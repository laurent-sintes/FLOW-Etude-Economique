<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730"><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="730" fill="#FAF8F4" rx="0"/><text x="38" y="40" font-size="26" fill="#182632" font-weight="700">FLOW — une identité plus énergique</text><text x="38" y="68" font-size="15" fill="#52606A" font-weight="400">Contrastes francs, orange vif en accent, lecture claire.</text><rect x="38" y="90" width="212" height="52" fill="#FAF8F4" rx="7"/><rect x="38" y="90" width="212" height="52" fill="none" stroke="#D6D2CB" rx="7"/><text x="38" y="165" font-size="15" fill="#182632" font-weight="650">Ivoire · #FAF8F4</text><text x="38" y="188" font-size="13" fill="#52606A" font-weight="400">Fond de lecture</text><rect x="266" y="90" width="212" height="52" fill="#182632" rx="7"/><text x="266" y="165" font-size="15" fill="#182632" font-weight="650">Encre · #182632</text><text x="266" y="188" font-size="13" fill="#52606A" font-weight="400">Titres et chiffres</text><rect x="494" y="90" width="212" height="52" fill="#FF7A1A" rx="7"/><text x="494" y="165" font-size="15" fill="#182632" font-weight="650">Orange vif · #FF7A1A</text><text x="494" y="188" font-size="13" fill="#52606A" font-weight="400">Actions et points clés</text><rect x="722" y="90" width="212" height="52" fill="#FFF0DB" rx="7"/><text x="722" y="165" font-size="15" fill="#182632" font-weight="650">Pêche claire · #FFF0DB</text><text x="722" y="188" font-size="13" fill="#52606A" font-weight="400">Fond des conclusions</text><rect x="950" y="90" width="212" height="52" fill="#086B63" rx="7"/><text x="950" y="165" font-size="15" fill="#182632" font-weight="650">Vert profond · #086B63</text><text x="950" y="188" font-size="13" fill="#52606A" font-weight="400">Signature et liens</text><rect x="38" y="216" width="1124" height="258" fill="#FFFFFF" rx="12"/><rect x="38" y="216" width="5" height="258" fill="#FF7A1A" rx="0"/><text x="65" y="249" font-size="12" fill="#086B63" font-weight="700">COMPRENDRE  /  01</text><text x="65" y="298" font-size="32" fill="#182632" font-weight="750">Comparer les périmètres et les responsabilités</text><text x="65" y="332" font-size="16" fill="#52606A" font-weight="400">Comparer les capacités couvertes, les travaux à réaliser et les responsabilités de chaque option.</text><rect x="65" y="361" width="212" height="39" fill="#FF7A1A" rx="6"/><text x="79" y="386" font-size="14" fill="#182632" font-weight="650">Couverture fonctionnelle</text><text x="301" y="386" font-size="14" fill="#182632" font-weight="400">Make / Buy hors coûts</text><text x="501" y="386" font-size="14" fill="#182632" font-weight="400">Socle / Intégration / Run &amp; MCO</text><text x="65" y="445" font-size="20" fill="#182632" font-weight="650">Couverture et frontières fonctionnelles</text><rect x="38" y="497" width="1124" height="181" fill="#FFF0DB" rx="12"/><rect x="38" y="497" width="1124" height="3" fill="#FF7A1A" rx="0"/><rect x="61" y="518" width="30" height="30" fill="#FF7A1A" rx="7"/><path d="M70 533l5 5 8-12" fill="none" stroke="#182632" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="105" y="539" font-size="12" fill="#182632" font-weight="700">À RETENIR DE CETTE PAGE</text><text x="61" y="575" font-size="16" fill="#182632" font-weight="550">Les options diffèrent par les fonctions déjà disponibles, les</text><text x="61" y="600" font-size="16" fill="#182632" font-weight="550">adaptations à réaliser et les responsabilités à porter. Le périmètre</text><text x="61" y="625" font-size="16" fill="#182632" font-weight="550">métier FLOW reste le point de comparaison.</text><text x="758" y="534" font-size="12" fill="#52606A" font-weight="650">CONTINUER AVEC</text><rect x="758" y="550" width="240" height="43" fill="#FF7A1A" rx="7"/><text x="775" y="578" font-size="16" fill="#182632" font-weight="700">Offres Synvance</text><path d="M966 571h17m-6-6 6 6-6 6" fill="none" stroke="#182632" stroke-width="2"/><text x="758" y="617" font-size="13" fill="#52606A" font-weight="400">Vous verrez ce que les propositions Microsoft</text><text x="758" y="637" font-size="13" fill="#52606A" font-weight="400">et SAP financent, et comment leurs prix sont</text><text x="758" y="657" font-size="13" fill="#52606A" font-weight="400">construits.</text><text x="38" y="712" font-size="12" fill="#52606A" font-weight="400">Proposition visuelle, non appliquée à l’application</text></g></svg>