date: '2026-10-25'
nature: Revue technique et hypothèses de réalisation ; aucune mesure de JH publiée
sources:
- url: https://docs.timefold.ai/timefold-solver/latest/constraints-and-score/overview
  constat: Le score et les contraintes métier doivent être définis ; le solveur ne fournit pas les décisions Supply.
  effet: Modèle métier et qualification restent chiffrés malgré le réemploi du solveur.
- url: https://developers.google.com/optimization/routing
  constat: Bibliothèque de routage avec capacités et contraintes temporelles ; le service industriel et les données
    ne sont pas inclus.
  effet: Travail de routage .NET inférieur à une reconstruction ; noyau C++ explicitement conservé.
- url: https://docs.elsaworkflows.io/guides/persistence
  constat: Définitions, instances, bookmarks et journaux persistés ; migrations, indexation et exploitation restent
    à configurer.
  effet: Créditer la persistance Elsa sans lui attribuer tout le Case Management SCM.
- url: https://github.com/apalis-dev/apalis
  constat: Bibliothèque de traitement de jobs en arrière-plan.
  effet: Ne prouve pas les parcours adaptatifs, sentries et interventions métier ; charges Rust explicites sur ces
    mécanismes.
- url: https://learn.microsoft.com/en-us/dynamics365/commerce/dom
  constat: Commerce possède un moteur DOM ; sa présence fonctionnelle doit être créditée et son périmètre contractuel
    vérifié.
  effet: Aucune absence générale OMS/affectation présumée dans Microsoft.
- url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/sales-marketing/delivery-dates-available-promise-calculations
  constat: ATP et CTP existent ; les scénarios CTP dépendent du moteur de planification.
  effet: Promesse standard créditée avant toute extension spécifique.
- url: sources/core-system-solutions-2026-10-22.yaml
  constat: Registre daté des composants SAP, Microsoft et Make, éditions et limites.
  effet: Références documentaires réutilisées ; aucun ancien point ni JH transféré.
- url: source/ecarts-perimetre-flow-rfi.md
  constat: Écarts et incertitudes entre cible FLOW et pièces commerciales locales.
  effet: Les compléments sont conditionnels à une démonstration et à la couverture effective du contrat.
limites:
- Les charges des paquets sont des jugements d’ingénierie à trois scénarios, pas des abaques statistiques.
- Les pages publiques courantes ne prouvent ni la licence achetée ni la configuration livrée dans les offres 2025.
- L’accès direct au portail OMSA a échoué ; les preuves SAP restent les références archivées et les pièces locales,
  sans prétendre les avoir toutes reconsultées.
