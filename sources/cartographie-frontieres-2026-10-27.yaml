    modeling_depth: context
    pedagogical_description:
      explanation: 'Ce [domaine](glossary:TER030) aide à choisir les produits à préparer pour une collection
        et à apprécier les ventes et ressources envisageables. Il rapproche les orientations de l’offre, les
        modèles retenus et leurs échéances. Ces choix préparent l’activité sans constituer une [commande](glossary:TER012)
        ni un plan de couverture opérationnel. Une collection peut ainsi préparer un socle [offshore](glossary:TER382)
        et des possibilités d''appoint [nearshore](glossary:TER383), dont la faisabilité sera vérifiée avant
        engagement.


        Les rythmes peuvent varier : deux [saisons](glossary:TER386), plusieurs [capsules](glossary:TER388)
        ou des produits reconduits. Le service rendu reste de préparer les produits et leurs jalons ; le calendrier
        est un [contexte configurable](glossary:TER389).


        [Pourquoi les rythmes et calendriers restent configurables](principle:PRINCIPLE-CONFIGURABLE-CONTEXTS).'
      example_refs:
      - node_id: domain-product-portfolio-collection
        example_id: illustration-domain-product-portfolio-collection-U1131
        contribution: Relier le choix des produits aux jalons de collection et aux hypothèses de ventes et
          d’approvisionnement.
      - node_id: domain-product-portfolio-collection
        example_id: offshore-nearshore-domain-product-portfolio-collection-U1134
        contribution: Le portefeuille prépare les hypothèses de collection et les lignes éligibles à un appoint
          ; le [Supply Chain Management](model:supply-chain-orchestration) compare les engagements possibles
          avec le recours vérifié par le [CTP](glossary:TER045).
      distinctions:
      - node_id: domain-product-development
        explanation: Composer une collection revient à choisir ce qui mérite d’être développé ; concevoir le
          produit consiste à en définir et éprouver les caractéristiques.
