    name: Finance
    definition: Tenir les comptes, analyser les coûts, décider du crédit et gérer la trésorerie et les règlements,
      pour rendre compte de l’activité et éclairer les décisions de l’entreprise.
    finality: Disposer d’une information financière fiable et conduire les décisions de crédit, de trésorerie
      et de règlement.
