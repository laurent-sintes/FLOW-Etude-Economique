- id: domain-sales
  revision: 6
  kind: domain
  fields:
    name: Commerce
    definition: Préparer et commercialiser l’offre, exploiter les canaux de vente et le réseau de magasins,
      et définir les conditions commerciales applicables.
    finality: Préparer les offres, conduire les ventes et organiser l’exploitation des canaux et du réseau
      de magasins.
    scope: 'Préparer l’offre et les conditions commerciales, puis conduire les ventes aux particuliers et aux
      revendeurs. Le domaine regroupe [Retail Commerce](model:subdomain-retail-commerce), [Wholesale Commerce](model:subdomain-sales-wholesale),
      [Assortment & Catalog Management](model:subdomain-assortment-catalog-management), [Pricing & Promotions
      Management](model:subdomain-pricing-promotions-management) et [Rebates & Incentives Management](model:subdomain-rebates-incentives-management).


      [Retail Network Management](model:subdomain-retail-network-management) et [Store Operations](model:subdomain-store-backoffice-operations)
      portent le réseau et les opérations magasin ; [Store Sales](model:subdomain-sales-b2c-store) porte la
      vente et la caisse. Une vente encaissée et emportée est un fait réalisé, pas nécessairement une commande
      restant à servir.


      [Supply Chain Management](model:supply-chain-orchestration) conserve les commandes à satisfaire, promesses,
      affectations, stocks de référence et coordination. [Sales Order](model:D04.i) tient l’identité et les
      transitions autorisées ; les canaux ne créent pas un cycle concurrent. Commerce détermine les prix applicables
      et les dispositifs commerciaux ; [Commercial Settlement Management](model:subdomain-commercial-settlement-management)
      calcule et règle les avantages sous Finance. Les décisions de crédit et la comptabilité restent dans
      [Finance](glossary:TER117).


      Exemple fictif : un revendeur prépare sa sélection puis soumet une commande ; la sélection seule ne réserve
      pas le stock. Les capacités décrivent la cible métier, sans preuve de transfert depuis les systèmes existants.


      [Pourquoi conserver le cycle complet de la commande dans SCM](principle:PRINCIPLE-ORDER-DECISION-CONTEXT).'
    modeling_depth: capabilities
    examples:
    - title: Illustration de responsabilité
      situation: Illustration FLOW fictive. Un client [B2B](glossary:TER195) négocie les conditions d’une [commande](glossary:TER012)
        de 100 vêtements. L’[orchestration](glossary:TER031) examine ensuite comment satisfaire la quantité
        et la date demandées dans les conditions convenues.
      lesson: Le récit explique la frontière métier ; il ne prouve aucun flux ou déploiement installé.
      source_refs:
      - U780
      - U1131
      id: illustration-domain-sales-U1131
      outcome: La [Supply](glossary:TER083) peut examiner comment servir la [demande](glossary:TER011) dans
        les conditions convenues, sans que la sélection commerciale ait réservé le [stock](glossary:TER005).
