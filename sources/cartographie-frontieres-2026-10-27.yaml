    modeling_depth: context
    pedagogical_description:
      explanation: 'Ce [domaine](glossary:TER030) permet de savoir quelle définition d’un produit est approuvée
        et dans quelles conditions elle peut être utilisée. Il conserve les variantes, les documents et les
        évolutions autorisées. Il évite de confondre une proposition de modification avec une version déjà
        applicable.


        Les caractéristiques et combinaisons admissibles identifient les [variantes](glossary:TER058). La grille
        peut aider à les représenter ou à les commander ; elle ne définit pas leur identité métier. [Pourquoi
        distinguer variante et grille](principle:PRINCIPLE-PRODUCT-VARIANTS).'
      example_refs:
      - node_id: domain-product-definition-lifecycle
        example_id: illustration-domain-product-definition-lifecycle-U1131
        contribution: Relier la version approuvée, les variantes et les conditions de mise à disposition.
      distinctions:
