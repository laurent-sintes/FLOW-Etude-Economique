    sha256: 4529c355d87f4eb12d9229a9684bbda550370f3a2808d13a8b6b90e910390cec
  RFI_SAP:
    reference: sources/client/delaware-septembre.pdf
    nature: rfi_2025
    portee: 'p.38 : 395000 + 7768577 + 5298775 = 13462352 EUR ; total imprimé 15462352 EUR contradictoire. 14640
      JH externes. p.37 forfaits annuels. p.43–45 licences, capacités et anomalies.'
