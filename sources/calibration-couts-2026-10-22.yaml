    sha256: 99345d535e452b38b17c1654d19359bf301cb7383f14c504de20ccf63defa377
  IA_EXPERIMENT:
    reference: https://www.microsoft.com/en-us/research/publication/the-impact-of-ai-on-developer-productivity-evidence-from-github-copilot/
    nature: recherche_primaire
    portee: 'Expérience sur une tâche JavaScript bornée : résultat non transposable en gain uniforme sur un programme
      SCM.'
  IA_METR:
    reference: https://metr.org/blog/2026-02-24-uplift-update/
    nature: recherche_primaire
    portee: Résultat 2025 et limites de sélection des expériences suivantes ; ne démontre pas un gain par langage.
      Les hypothèses FLOW restent prudentes et révisables, avec revue humaine conservée.
  AZURE_DB:
    reference: https://azure.microsoft.com/en-us/pricing/details/postgresql/flexible-server/
    nature: documentation_tarification
    portee: Calcul, stockage, disponibilité et sauvegarde ont des assiettes distinctes. Prix régionaux non rendus
      dans la page consultée ; les EUR retenus sont des provisions d’étude, pas un devis Azure.
  AZURE_IPAAS:
    reference: https://azure.microsoft.com/en-us/pricing/details/logic-apps/
    nature: documentation_tarification
    portee: 'Standard : calcul et mémoire, connecteurs et services complémentaires. Appels/actions différents des
      messages métier ; provisions à confirmer au calculateur.'
  SAP_IPAAS:
    reference: https://assets.dm.ux.sap.com/sap-user-groups/pdfs/250318_sap_integration_suite_2025.pdf
    nature: presentation_editeur_2025
    portee: p.38 gamme Standard/Premium et p.39 unités de transaction. Repère catalogue Standard affiché 55620 EUR
