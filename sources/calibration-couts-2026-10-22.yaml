    nature: hypothese_ingenierie
    portee: Les JH, parts IA, enveloppes et sensibilités sont des hypothèses nouvelles de cette étude. Aucun benchmark
      ne prouve ces durées ; calibration par blocs de travaux résiduels, revue détaillée à la spécification.
  SOLUTIONS:
    reference: sources/core-system-solutions-2026-10-22.yaml
