    portee: p.38 abonnements ; p.39 pilote et 40 interfaces ; p.40 abaques de déploiement. Les 380–460 JH des 40
      interfaces fournissent un repère, pas un tarif universel par flux.
    sha256: 2eca158bcb9b5d2ce50f66363e8715c870d8773f8e4caf6d56f376a13e1a3cc8
  COPIL:
    reference: sources/client/copil-5.pdf
