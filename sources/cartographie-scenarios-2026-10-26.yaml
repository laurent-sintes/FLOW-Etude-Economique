    - U889
    - U1115
    review:
      state: proposed
      note: Cible U883 validée U884 et appliquée U885 ; accords exacts capturés séparément, détails rédactionnels
        proposés.
  - id: credit-review-no-response-path
    name: Credit Review Without Response
    title: Validation financière sans réponse
    scenario_id: customer-credit-hold
    conditions:
    - Une commande reste bloquée pour crédit ; une vérification financière attend une réponse humaine.
    outcome: L’échéance dépassée conduit à une réaction tracée ; le blocage financier reste effectif jusqu’à une
      décision autorisée.
    steps:
    - id: wait
      title: Constater l’échéance dépassée
      description: L’échéance ouvrée est dépassée sans résultat accepté. Distinguer la contribution attendue de
        l’autorité financière qui décide. Le Case conserve un contrôle indéterminé faute de résultat financier applicable
        ; cette absence ne vaut ni autorisation ni refus financier.
      outcome: Contrôle indéterminé, blocage conservé et attente qualifiée.
      inputs:
      - Commande bloquée, tâche de vérification et échéance selon le calendrier applicable.
      - État de la contribution attendue et absence de résultat accepté.
      - 'Validité des informations financières : une information périmée ne remplace pas le résultat attendu.'
      contributions:
      - node_id: human-task-management
        role: Tenir la contribution et son résultat encore absent.
      - node_id: work-deadline-management
        role: Qualifier le dépassement selon le calendrier applicable.
      - node_id: D04.i
        role: Maintenir le blocage faute de décision autorisant sa levée.
