    id: consignment-launch-replenishment-path
    name: Consignment Launch Replenishment Response
    title: Implanter puis réalimenter un stock consigné
    scenario_id: consignment-launch-replenishment
    conditions:
    - 'Hypothèses du cas illustratif :'
    - Implantation puis réalimentation d’un stock chez un client sous accord de consignation.
    - Cibles, disponibilités et propriété connues ; vente constatée distincte d’un simple déplacement du stock.
    outcome: Le même cycle d’[Order](glossary:TER012) traite un motif d’alimentation continue.
    steps:
    - id: step-1
      title: Déterminer le besoin initial
      description: Le lancement nécessite 100 vestes au corner à une date précise.
      outcome: L’apport retenu est porté par une commande identifiée.
      contributions:
      - node_id: D05.e
        role: Déterminer le besoin d’apport.
      - node_id: D04.r
        role: Porter l’apport initial en consignation et sa date.
      inputs:
      - Situation et déclencheur du scénario ; informations, résultats et autorisations explicités dans cette étape.
    - id: step-2
      title: Recevoir sans confondre propriété
      description: Les 100 vestes sont reçues sous le régime prévu par l’accord.
      outcome: Détention et reste à apporter sont rapprochés.
      contributions:
      - node_id: D04.r
        role: Rapprocher la réception du besoin initial.
      - node_id: D01.f
        role: Capter le fait de réception.
      - node_id: D01.c
        role: Exposer stock détenu et propriété connue.
      inputs:
      - Situation et déclencheur du scénario ; informations, résultats et autorisations explicités dans cette étape.
    - id: step-3
      title: Réalimenter pendant l’activité
      description: Après les ventes, un nouveau besoin de 30 est retenu et fait l’objet d’un apport distinct.
      outcome: Le même cycle d’[Order](glossary:TER012) traite un motif d’alimentation continue.
      contributions:
      - node_id: D05.e
        role: Déterminer le besoin complémentaire.
      - node_id: D04.r
        role: Porter le nouvel apport et son solde.
      inputs:
      - Situation et déclencheur du scénario ; informations, résultats et autorisations explicités dans cette étape.
    dependencies: []
