  - id: seasonal-shared-resource-path
    name: Seasonal Shared Resource Path
    title: Arbitrer deux carnets partageant le même stock
    scenario_id: seasonal-order-backlog
    conditions:
    - 'Illustration : deux périmètres demandent 80 pièces chacun pour 100 disponibles au total.'
    - Droits de canal, priorités et autorité d’arbitrage commun identifiés ; les engagements déjà protégés sont
      connus.
    outcome: Une capacité commune pilote plusieurs carnets ; leurs ressources partagées restent arbitrées.
    steps:
    - id: variant-1
      title: Comparer les demandes concurrentes
      description: Examiner les deux carnets sur la même ressource, sans compter deux fois les 100 pièces.
      outcome: Ordre de priorité et contraintes communs explicites.
      inputs:
      - 'Illustration : deux périmètres demandent 80 pièces chacun pour 100 disponibles au total.'
      - Droits de canal, priorités et autorité d’arbitrage commun identifiés ; les engagements déjà protégés sont
        connus.
      contributions:
      - node_id: D05.f
        role: Organiser le pilotage commun des périmètres concurrents.
      - node_id: D03.m
        role: Prioriser les demandes selon leurs droits et critères.
      - node_id: demand-fulfilment-policy-management
        role: Fournir la stratégie active et les droits d’arbitrage commun.
    - id: variant-2
      title: Affecter une seule disponibilité
      description: Choisir les couvertures compatibles ; ne pas promettre indépendamment 80 pièces aux deux carnets.
      outcome: Couvertures compatibles avec la ressource commune.
      inputs:
      - Résultat de l’étape précédente et conditions applicables.
      contributions:
      - node_id: D03.o
        role: Attribuer les 100 pièces au plus une fois selon les droits et priorités.
      - node_id: D03.i
        role: Évaluer les possibilités unitaires sur la couverture admissible commune.
      - node_id: D02.e
        role: Appliquer les affectations autorisées sans créer un deuxième stock.
