  - id: preorder-future-availability
    name: Preorder for Future Availability
    title: Précommander avant disponibilité et préparer la réalisation
    situation: 'Illustration FLOW fictive : un client possède un Sales Order au statut Preorder pour 40 robes ;
      sa couverture peut mobiliser une proposition d’achat issue du planning puis affermie en Purchase Order.'
    trigger: Réception d’une demande avant disponibilité commerciale.
    objective: Conserver la précommande et ses engagements jusqu’à la réalisation, sans double comptage des prévisions
      ni des achats planifiés et affermis.
    conditions:
    - Disponibilité future et conditions commerciales identifiées.
    - Degré d’engagement, règles d’[affermissement](glossary:TER197) et autorisations explicites.
    nature: illustrative
    value_stream_ids:
    - obtain-products
    events:
    - demand
    - launch
    objects:
    - order
    - product
    situations:
    - nominal
    - exception
    validation_points:
    - Une précommande peut déjà être ferme.
    - Un Planned Purchase Order est distinct du Purchase Order résultant et de sa confirmation fournisseur.
    - Ne pas compter deux fois prévision et demande ferme, ni proposition d’achat et commande résultante.
    - Un changement de disponibilité ne modifie pas seul une promesse confirmée.
    - La sortie de Preorder change le statut du même Sales Order ; son identité et son historique restent conservés.
    - La filiation entre Planned Purchase Order et Purchase Order empêche de compter deux fois le même apport ;
      elle n’impose pas une identité commune.
    - La coupure côté achat distingue proposition de planning et commande fournisseur ; côté vente, Preorder qualifie
      le cycle d’une demande client déjà identifiée.
