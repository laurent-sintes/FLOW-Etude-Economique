    id: packaging-receipt-variance
    name: Packaging Receipt Variance
    title: Distinguer la consigne de conditionnement, l’annonce et la réception
    situation: 'Illustration FLOW fictive : une spécification prévoit douze pièces d’une même variante par carton.
      Une prestation est demandée pour 120 pièces ; l’exécutant annonce dix cartons complets. À destination, neuf
      cartons de douze et un carton de dix sont reconnus : 118 pièces reçues, avec un écart de deux à clarifier.'
    trigger: L’annonce de préparation puis le constat de réception doivent être rapprochés du résultat demandé,
      sans modifier la consigne réutilisable.
    objective: Conserver séparément la spécification, les 120 pièces demandées, les 120 annoncées et les 118 reçues
      ; rendre l’écart explicite sans en inventer la cause.
    conditions:
    - La version applicable de [Packaging Specification](glossary:TER186) prévoit douze pièces de la variante par
      carton ; le matériau d’emballage est identifié.
    - Préparation et réception sont confiées à des exécutants ; leurs commandes et leurs résultats sont distingués.
    - Les cartons annoncés et reçus sont identifiés, avec contenu, unité de mesure, origine et date des faits.
    nature: illustrative
    value_stream_ids:
    - obtain-service
    - replenish-stock
    - reliable-basis
    events:
    - discrepancy
    objects:
    - product
    - stock
    - service
    - information
    situations:
    - exception
    validation_points:
    - Une [Packaging Specification](glossary:TER186) est réutilisable ; le résultat individuel est porté par [Packing
      Order](model:service-order-packing).
    - Un carton identifié et son contenu forment une [Handling Unit](glossary:TER189) concrète, distincte de la
      spécification et des exemplaires individuels du bien.
    - Neuf cartons de douze plus un carton de dix représentent 118 pièces, pas 120 ; le nombre de cartons ne suffit
      pas à déduire leur contenu.
    - La réception de 118 pièces ne prouve pas à elle seule où les deux pièces manquantes ont été perdues ; annonce,
      faits reconnus et justifications restent distincts.
    - Une annonce ne crée pas une entrée physique de stock ; la réception ne réécrit ni la spécification ni les
      engagements par elle-même.
