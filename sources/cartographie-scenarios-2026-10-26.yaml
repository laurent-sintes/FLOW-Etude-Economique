      state: proposed
      note: Mise en œuvre U793 ; pas d’accord individuel sur le contenu déduit du Go.
    id: return-fashion-recovery-path
    name: Return Fashion Recovery Response
    title: Remettre en vente une robe retournée
    scenario_id: return-fashion-recovery
    conditions:
    - 'Hypothèses du cas illustratif :'
    - Retour client identifié ; article inspectable et critères de remise en vente connus.
    - Résultats du nettoyage, de la remise en état et du contrôle attendus avant réadmission du stock.
    outcome: La robe apparaît dans le stock vendable avec une trace de ses mouvements.
    steps:
    - id: step-1
      title: Recevoir et contrôler
      description: Le retour est attendu puis reçu ; le prestataire confirme la couture ouverte et transmet le contrôle.
      outcome: La robe est reçue mais sa remise en vente reste conditionnelle.
      contributions:
      - node_id: D04.l
        role: Porter le retour attendu et son achèvement.
      - node_id: service-order-inspection
        role: Demander le contrôle et son résultat.
      - node_id: D07.d
        role: Capter les faits d’exécution distants.
      inputs:
      - Situation et déclencheur du scénario ; informations, résultats et autorisations explicités dans cette étape.
      context_participants:
      - node_id: ba-returns-receiving-inspection
        role: Recevoir la robe retournée, constater le défaut et transmettre le résultat du contrôle.
        conditions:
        - Retour attendu et prestation identifiés ; la décision de réparation reste séparée du constat.
        source_refs:
        - U768
        - U793
        - U1020
        - U1021
        - U1114
        - U1115
    - id: step-2
      title: Choisir le devenir
      description: La réparation est autorisée et jugée pertinente pour cette robe ; une pièce irréparable suivrait
        une autre route.
      outcome: Une route de réparation est choisie sans confondre retour et réparation.
      contributions:
      - node_id: D05.i
        role: Décider de la destination et du traitement de l’article retourné.
      - node_id: service-order-repair-alteration
        role: Porter la prestation de réparation confiée.
      - node_id: D06.d
        role: Coordonner les dépendances et attendre la fin de réparation.
      inputs:
      - Situation et déclencheur du scénario ; informations, résultats et autorisations explicités dans cette étape.
    - id: step-3
