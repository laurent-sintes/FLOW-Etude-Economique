    id: return-fashion-recovery
    name: Return Fashion Recovery
    title: Remettre en vente une robe retournée
    situation: Illustration FLOW fictive. Une cliente retourne une robe dont une couture est ouverte. Le retour
      est accepté, mais la remise en stock vendable dépend du contrôle et de la réparation.
    trigger: Le retour est attendu puis reçu ; le prestataire confirme la couture ouverte et transmet le contrôle.
    objective: La robe apparaît dans le stock vendable avec une trace de ses mouvements.
    conditions:
    - 'Hypothèses du cas illustratif :'
    - Retour client identifié ; article inspectable et critères de remise en vente connus.
    - Résultats du nettoyage, de la remise en état et du contrôle attendus avant réadmission du stock.
    nature: illustrative
    value_stream_ids:
    - recover-value
    events:
    - return
    objects:
    - product
    situations:
    - recovery
    validation_points:
    - Le retour ne réalise pas lui-même la réparation.
    - Un simple accusé de réception de prestation ne vaut pas réalisation conforme.
    - '[Inventory Disposition](glossary:TER102) Decision couvre ce retour comme les incidents sur stock existant
      ; Policy-based Disposition applique les règles et Value Recovery Optimization compare les devenirs admissibles.'
