    id: export-remote-services-path
    name: Export Remote Services Response
    title: Exporter des vêtements et attendre la fin des prestations distantes
    scenario_id: export-remote-services
    conditions:
    - 'Hypothèses du cas illustratif :'
    - Destination export et exigences de prestations distantes identifiées.
    - Documents et résultats de prestations nécessaires à la suite du parcours connus.
    outcome: La prestation transport est libérée sur des résultats reconnus.
    steps:
    - id: step-1
      title: Préparer les prestations
      description: Les conditions contractuelles et les besoins documentaires déterminent les prestations requises.
      outcome: Transport, documents et dépendances sont définis.
      contributions:
      - node_id: D07.a
        role: Déterminer les prestations et leurs exigences documentaires, dont les documents requis pour poursuivre.
      - node_id: service-order-transport-booking
        role: Demander la réservation de transport.
      - node_id: service-order-customs-clearance
        role: Porter la prestation de dédouanement confiée.
      inputs:
      - '[Agreement](model:D11) : Les parties, conditions, quantités ou valeurs convenues, versions, dates et références
        d’assortiment restent consultables.'
    - id: step-2
      title: Déclencher les flux financiers
      description: FLOW porte les services de facturation et de paiement. Les composants spécialisés contribuent
        à leur réalisation ; un acquittement technique ne vaut ni facture émise ni encaissement.
      outcome: La facture et le résultat du paiement sont tenus ; leurs résultats manquants restent attendus.
      contributions:
      - node_id: service-order-billing
        role: Assurer la facturation et tenir la facture obtenue ou son rejet.
      - node_id: service-order-payment-collection
        role: Assurer le paiement et tenir son résultat, ses refus et son reste à encaisser.
      - node_id: D06.d
        role: Coordonner les dépendances et attendre les résultats.
      inputs:
      - Situation et déclencheur du scénario ; informations, résultats et autorisations explicités dans cette étape.
    - id: manual-document
      title: Vérifier une pièce reçue manuellement
      description: Si la pièce requise est reçue hors intégration automatisée, solliciter sa vérification, affecter
        le travail et suivre son échéance.
      outcome: La pièce est qualifiée ; sa réception seule ne vaut pas acceptation.
      inputs:
      - Contexte, informations et autorisations décrits dans le scénario.
      contributions:
      - node_id: human-task-management
        role: Recueillir le résultat de vérification.
      - node_id: work-assignment
        role: Choisir une personne admissible.
      - node_id: work-deadline-management
        role: Suivre l’échéance applicable.
      - node_id: BHV082
        role: Relier cette attente à la progression du parcours.
    - id: step-3
      title: Libérer au vu des résultats
      description: Les résultats sont rapprochés des prestations et services attendus ; paiement et documents requis
        conditionnent la suite.
      outcome: La prestation transport est libérée sur des résultats reconnus.
      contributions:
      - node_id: D07.d
        role: Capter les notifications d’exécution distante.
      - node_id: D07.c
        role: Rapprocher les résultats des prestations demandées.
      - node_id: operations-visibility
        role: Exposer les prestations terminées ou bloquées.
      - node_id: service-order-release-decision
        role: Décider de la libération des ordres éligibles.
      - node_id: service-order-transport
