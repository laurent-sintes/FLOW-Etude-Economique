    id: payment-resumption-not-confirmed-path
    name: Payment Resumption Not Confirmed
    title: Reprise refusée ou non confirmée
    scenario_id: remote-payment-ambiguous
    conditions:
    - Une investigation de paiement reste ouverte ; une reprise est demandée sans preuve suffisante de son autorisation
      ou de son effet.
    outcome: Une reprise refusée ou non confirmée reste visible ; aucun effet métier ni second paiement n’est présumé.
    steps:
    - id: authorize
      title: Contrôler la demande de reprise
      description: Refuser une reprise hors mandat ou la maintenir en attente de preuve. Ne pas confondre résolution
        du dossier et demande d’intervention.
      outcome: Reprise refusée ou en attente avec motif.
      inputs:
      - Dossier d’exception, faits contradictoires et preuve restant à obtenir.
      - 'Demande de reprise : cible, portée, demandeur, mandat et autorisation disponible ou absente.'
      contributions:
      - node_id: process-intervention
        role: Vérifier cible, mandat et autorisation avant toute sollicitation.
      - node_id: process-exception-management
        role: Conserver les faits contradictoires et la preuve restant à obtenir.
    - id: effect
      title: Vérifier l’effet si la reprise devient autorisée
      description: Si une autorisation est obtenue, solliciter la reprise puis attendre son effet reconnu. Une acceptation
        technique sans résultat ne clôt pas l’intervention et ne justifie pas un second paiement.
      outcome: Reprise appliquée et attestée, ou attente conservée sans paiement supplémentaire.
      inputs:
      - 'Si la reprise est autorisée : décision, cible, portée et référence de la demande.'
      - Acceptation reçue et effet métier reconnu ou encore absent ; références et montants du paiement existant.
      contributions:
      - node_id: process-intervention
        role: Distinguer demande, acceptation et effet confirmé.
      - node_id: order-workflow-orchestration
        role: Conduire uniquement les activités autorisées et exploiter leurs résultats.
      - node_id: service-order-payment-collection
        role: Conserver les références et montants sans double encaissement.
      - node_id: BHV082
        role: Rendre visible l’état inconnu ou encore attendu.
    dependencies: []
    sequence_note: Ordre de lecture du récit conservé ; les dépendances non explicitées ne sont pas déduites de
      la position. Les conditions et informations à préciser restent des limites de la description.
