  - id: process-approval-bottleneck-path
    name: Process Approval Bottleneck Response
    title: Du constat de délai à une amélioration vérifiée
    scenario_id: process-approval-bottleneck
    conditions:
    - Événements des Cases et tâches conservés dans [Process Ledger](model:process-ledger), corrélables par demande,
      parcours, tâche et version applicable, avec origine et dates.
    - Responsables et habilitations connus ; aucune réalisation installée présumée.
    outcome: Identifier la part de file et de travail, agir dans le mandat autorisé puis mesurer les effets.
    steps:
    - id: observe
      title: Établir les parcours réellement suivis
      description: Corréler les faits, reconstruire les variantes et isoler l’attente avant prise en charge.
      outcome: Mesures explicites et limites de couverture connues.
      inputs:
      - 'Traces de [Process Ledger](model:process-ledger) : identités des Cases, tâches, événements, dates et origine
        ; distinguer date du fait et date de capture des événements internes ou externes captés par la sentinelle.'
      - Population, période et limites de couverture des traces.
      contributions:
      - node_id: BHV082
        role: Établir la progression et les attentes connues.
      - node_id: process-mining
        role: Analyser les variantes et les distributions de temps.
      - node_id: operational-analysis-reporting
        role: Comparer les populations et ouvrir les dossiers explicatifs.
    - id: adapt
      title: Préparer une évolution autorisée
      description: Si le diagnostic confirme un problème de distribution, préciser les règles et activités autorisées
        avant de réorganiser les contributions.
      outcome: Définition applicable et suites autorisées établies.
      inputs:
      - Diagnostic des temps de file et de travail, variantes observées et réserves.
      - Définition applicable, règles d’affectation et autorité permettant leur évolution.
      contributions:
      - node_id: workflow-definition-management
        role: Tenir les conditions et la version applicables.
      - node_id: order-workflow-sentry
        role: Qualifier la réaction pertinente au contexte.
      - node_id: order-workflow-planning
        role: Organiser les contributions et attentes restantes.
    - id: act
      title: Rééquilibrer et conduire le travail
      description: Réaffecter les tâches admissibles ; les traiter sans déplacer l’autorité de décision.
      outcome: Travail pris en charge et résultats reliés au parcours.
      inputs:
      - Version autorisée, tâches encore ouvertes, habilitations, charge connue et échéances.
      - Contributions à réaffecter et conditions de prise en charge.
      contributions:
      - node_id: work-assignment
        role: Rééquilibrer les affectations admissibles.
      - node_id: human-task-management
        role: Tenir prise en charge et résultats.
      - node_id: work-deadline-management
        role: Surveiller les échéances applicables.
      - node_id: order-workflow-orchestration
        role: Conduire les contributions et exploiter leurs résultats.
    - id: measure
      title: Vérifier les effets
      description: Comparer des populations et calendriers explicités avant et après le changement ; reconnaître
        les autres facteurs possibles.
      outcome: Amélioration étayée ou besoin de poursuivre l’investigation.
      inputs:
      - Traces de [Process Ledger](model:process-ledger) avant et après le changement, version et date d’application,
        populations comparables et limites de corrélation explicites.
      - Calendriers, indicateurs retenus et autres facteurs susceptibles d’expliquer les écarts.
      contributions:
      - node_id: process-mining
        role: Comparer les temps et variantes sans causalité automatique.
      - node_id: operational-analysis-reporting
        role: Partager le résultat et ses limites.
    dependencies: []
    sequence_note: Parcours illustratif ; les étapes ne prescrivent ni durée ni déroulement universel.
    source_refs:
