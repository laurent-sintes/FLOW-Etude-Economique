    id: redistribute-protected-stock-path
    name: Redistribute Protected Stock Response
    title: Rééquilibrer et consolider des stocks sous protections
    scenario_id: redistribute-protected-stock
    conditions:
    - 'Hypothèses du cas illustratif :'
    - Stocks physiques par site, protections et besoins concurrents connus.
    - Redistribution envisagée ; droits d’usage et engagements à préserver avant transfert.
    outcome: Les transferts suivent le même cycle malgré des motifs différents.
    steps:
    - id: step-1
      title: Comparer cibles et protections
      description: Les cibles et règles sont examinées avant toute redistribution, y compris les droits réservés
        et le groupe web.
      outcome: Les ressources mobilisables et les protections sont explicites.
      contributions:
      - node_id: D05.a
        role: Déterminer les cibles de stock utiles.
      - node_id: D05.d
        role: Proposer les protections de groupes.
      - node_id: D05.h
        role: Évaluer les règles de réservation appropriées.
      - node_id: D02.b
        role: Porter les règles actives de protection de ressources.
      - node_id: D19.b
        role: Porter les règles actives de protection des demandes.
      inputs:
      - Situation et déclencheur du scénario ; informations, résultats et autorisations explicités dans cette étape.
    - id: step-2
      title: Construire deux actions complémentaires
      description: Proposer un apport au magasin en rupture et la consolidation des petits reliquats sur un site,
        sous réserve des besoins protégés.
      outcome: Rééquilibrage et consolidation gardent des objectifs distincts dans le même plan.
      contributions:
      - node_id: D05.c
        role: Déterminer les déplacements de redistribution.
      - node_id: D03.m
        role: Prioriser les demandes concurrentes.
      - node_id: D05.f
        role: Piloter l’arbitrage du master plan.
      - node_id: D03.o
        role: Déterminer les affectations compatibles.
      inputs:
      - Situation et déclencheur du scénario ; informations, résultats et autorisations explicités dans cette étape.
    - id: step-3
      title: Demander les déplacements retenus
      description: Les propositions autorisées deviennent des transferts avec quantités, origine, destination et
        date.
      outcome: Les transferts suivent le même cycle malgré des motifs différents.
      contributions:
      - node_id: D02.e
        role: Appliquer le plan autorisé.
      - node_id: D04.k
        role: Porter les déplacements et leur reste à satisfaire.
      inputs:
      - Situation et déclencheur du scénario ; informations, résultats et autorisations explicités dans cette étape.
