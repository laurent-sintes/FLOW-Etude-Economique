    id: transfer-replenishment-order-driven-path
    name: Transfer Replenishment Order Driven Response
    title: Réapprovisionner un magasin ou servir une commande identifiée
    scenario_id: transfer-replenishment-order-driven
    conditions:
    - 'Hypothèses du cas illustratif :'
    - Besoin de stock du magasin distingué d’une demande de vente identifiée.
    - Stock d’origine, protections et date de besoin connus ; transfert physique et affectation séparés.
    outcome: Réception, solde du transfert et satisfaction client restent distincts.
    steps:
    - id: step-1
      title: Distinguer les besoins
      description: Le besoin de stock et celui du client sont identifiés pour éviter de compter deux fois les deux
        pièces engagées.
      outcome: Les quantités et destinations du besoin sont explicites.
      contributions:
      - node_id: D05.e
        role: Déterminer le besoin de réapprovisionnement.
      - node_id: D04.i
        role: Porter la demande client identifiée.
      inputs:
      - Situation et déclencheur du scénario ; informations, résultats et autorisations explicités dans cette étape.
    - id: step-2
      title: Affecter et demander le transfert
      description: Le plan retient les ressources et autorise leur déplacement vers le magasin. Le déplacement de
        stock existant mobilise [Stock Redistribution](model:D05.c) ; affecter la ressource et tenir la demande
        de transfert sont des responsabilités distinctes.
      outcome: Les 22 pièces à transférer sont reliées à leurs besoins respectifs.
      contributions:
      - node_id: D03.o
        role: Affecter les ressources aux demandes.
      - node_id: D02.e
        role: Appliquer le plan autorisé.
      - node_id: D04.k
        role: Porter le transfert et son échéance.
      - node_id: D05.c
        role: Si la réponse déplace du stock physique existant, choisir les sites d’origine et de destination et
          les quantités à redistribuer, selon les protections et besoins concurrents.
      inputs:
      - Situation et déclencheur du scénario ; informations, résultats et autorisations explicités dans cette étape.
    - id: step-3
      title: Rapprocher le résultat
      description: Seules 20 pièces arrivent d’abord ; le transfert reste partiellement ouvert et l’affectation
        des quantités reçues ne se déduit pas de l’ordre d’arrivée.
      outcome: Réception, solde du transfert et satisfaction client restent distincts.
      contributions:
      - node_id: D04.k
        role: Tenir le reste à recevoir.
      - node_id: D01.f
        role: Capter la réception réelle.
      - node_id: D03.o
        role: Maintenir les affectations explicites.
      inputs:
      - Situation et déclencheur du scénario ; informations, résultats et autorisations explicités dans cette étape.
