    id: b2b-partial-stock
    name: B2B Partial Stock
    title: Livrer une commande B2B avec un stock partiel
    situation: 'Illustration FLOW fictive : un client B2B attend 100 vêtements ; 60 sont disponibles et une rentrée
      de 40 est annoncée. Plusieurs solutions de livraison sont examinées.'
    trigger: Une commande nécessite une proposition de quantité et de date.
    objective: Choisir une proposition réalisable, faire confirmer ses conditions puis organiser la réalisation
      regroupée ou fractionnée autorisée, en distinguant choix de promesse, engagement, affectation et libération.
    conditions:
    - Date demandée et fractionnement autorisé par le client.
    - Disponibilité effective, fiabilité de la rentrée et délais de préparation et de transport.
    - Engagements existants et règles de protection du stock.
    nature: illustrative
    value_stream_ids:
    - obtain-products
    - obtain-service
    events:
    - shortage
    objects:
    - order
    situations:
    - exception
    validation_points:
    - Évaluer, choisir, engager, affecter et libérer ont des responsabilités distinctes.
    - La rétention ne décale pas silencieusement la promesse ; une expédition commune ne garantit pas à elle seule
      une palette unique.
    - Les capacités coopèrent selon le besoin ; ce récit n’impose ni pipeline universel ni modification des grands
      équilibres d’[Availability](glossary:TER112). Promettre, affecter les ressources et libérer les prestations
      restent distincts.
