  - id: seasonal-contract-firming-path
    name: Seasonal Contract Firming Path
    title: Affermir automatiquement selon le contrat
    scenario_id: seasonal-order-backlog
    conditions:
    - 'Illustration : un contrat prévoit la fermeté après un mois sans annulation.'
    - La version du contrat, la date de départ et l’absence d’annulation sont établies ; une réservation n’est exigée
      que si la règle le prévoit.
    outcome: Automatisme guidé par le contrat, sans règle universelle d’un mois ni optimisation systématique.
    steps:
    - id: variant-1
      title: Établir le jalon contractuel
      description: Utiliser la règle active et les faits de commande pour déterminer si la clause s’applique.
      outcome: Fermeté contractuelle enregistrée.
      inputs:
      - 'Illustration : un contrat prévoit la fermeté après un mois sans annulation.'
      - La version du contrat, la date de départ et l’absence d’annulation sont établies ; une réservation n’est
        exigée que si la règle le prévoit.
      contributions:
      - node_id: demand-fulfilment-policy-management
        role: Fournir la clause et ses conditions actives pour ce périmètre.
      - node_id: D04.i
        role: Vérifier le jalon et appliquer la transition contractuellement autorisée.
    - id: variant-2
      title: Protéger les ressources si requis
      description: La fermeté ne suffit pas à identifier une réservation ; appliquer séparément la protection prévue.
      outcome: Protection de ressources distincte de la fermeté de commande.
      inputs:
      - Résultat de l’étape précédente et conditions applicables.
      contributions:
      - node_id: D02.c
        role: Si requis, engager les quantités autorisées pour la commande ferme.
      - node_id: D02.e
        role: Appliquer la protection autorisée et en vérifier les effets.
    dependencies:
    - from: variant-1
      to: variant-2
      condition: Résultat précédent disponible et autorisations de l’étape réunies.
    sequence_note: Variante illustrative conditionnelle ; ni parcours installé ni séquence universelle.
