- id: operations-visibility
  kind: capability
  fields:
    name: Operations Visibility
    definition: Rendre visibles l’avancement, les résultats et les attentes des prestations Supply à partir des
      faits intégrés.
    scope: 'Consolider les faits, jalons, estimations et résultats acquis, partiels ou en échec reçus par [Operations
      Tracking](model:D07.d). Distinguer fait, engagement et estimation, expliciter origine, fraîcheur et informations
      absentes. Présenter les perspectives entrepôt, transport et magasin sans imposer un cycle commun aux services.
      Les exécutants conservent leurs opérations internes ; Orchestration coordonne, Adaptation Decision choisit
      les adaptations et [Service Management](model:subdomain-service-orders) tient les engagements. [Inventory
      Visibility](model:D01.c) restitue les positions de stock et les ressources attendues. Exemple fictif : une
      prestation documentaire est en échec tandis que le transport est achevé ; exposer séparément leurs résultats
      et les attentes propres aux prestations. Leur effet sur la suite du parcours est expliqué par [Process, Tasks
      & Order Visibility](glossary:TER175).


      [Process, Tasks & Order Visibility](glossary:TER175) porte désormais le parcours complet dans [Process Supervision](glossary:TER165).
      [Operations Visibility](glossary:TER178) conserve la connaissance de réalisation des prestations et la transmet
      pour cette lecture. Un résultat de prestation ne prouve pas que toutes les conditions du parcours sont remplies.'
