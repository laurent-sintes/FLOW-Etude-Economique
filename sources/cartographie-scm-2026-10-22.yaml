- id: transport-scheduled
  kind: behavior
  fields:
    name: Scheduled Transport
    definition: Tenir une demande rattachée à un départ ou à un service programmé, et les conséquences d’un changement
      de programme ou d’un départ manqué.
    scope: 'L’engagement dépend d’une occurrence de service identifiée ; changer de départ peut nécessiter une nouvelle
      acceptation.


      Décrire le rattachement et ses suites, pas construire les horaires, le réseau ou une tournée. Une simple date
      demandée ne suffit pas. Deux sources SAP attestent le mécanisme sans consensus interéditeurs.


      Exemple fictif : La navette entre deux entrepôts part chaque soir ; le lot doit être pris en charge sur le
      départ convenu.'
  source_refs:
  - U709
  - C119
  - ELM689
  - ELM690
  - U771
  - CMP306
  - U774
  - CMP307
  - ELM805
- id: transport-appointments
  kind: behavior
  fields:
    name: Pickup & Delivery Appointments
    definition: Tenir les créneaux de collecte ou livraison convenus avec les parties, leurs confirmations, modifications
      et conséquences sur l’engagement.
    scope: 'Distinguer une fenêtre souhaitée, un horaire estimé et un rendez-vous effectivement accepté.


      Aucun Appointment Order systématique. Ne pas recopier la planification de quai ou la décision d’adaptation.
      Oracle documente aussi la collecte ; DHL étaye surtout la livraison.


      Exemple fictif : Un magasin confirme un créneau de réception ; un retard impose de tenir le créneau renégocié.'
  source_refs:
  - U709
  - C119
  - ELM691
  - ELM692
