    scope: 'Revoir les liens ressources-besoins autorisés à évoluer afin de produire un plan cohérent lorsque la
      situation change.


      Remplacer une réception retardée par une autre ressource ; transmettre un impact de promesse s’il ne peut
      être absorbé.


      Recalcul des affectations ; le réexamen des confirmations de type BOP reste dans Order Promising. Adjust Plan
