- id: BHV076
  kind: behavior
  fields:
    name: Capacity-Constrained CTP
    definition: Étendre la faisabilité aux ressources et capacités finies nécessaires, à leurs calendriers, charges
      et dépendances pertinentes.
    scope: 'Prendre en compte les capacités finies nécessaires, disponibles ou supplémentaires, leurs calendriers,
      charges et dépendances pertinentes. Inclure fabrication ou assemblage multiniveau et prestations logistiques
      lorsque les données le permettent, sans un comportement par ressource. Une substitution autorisée ou une autre
      date déjà réalisable ne suffit pas à constituer du CTP. Les exécutants gardent leurs opérations internes ;
      les données non contrôlées restent des hypothèses.


      Pour une option nécessitant un reconditionnement, vérifier les capacités et créneaux de la prestation requise
      avec les matières, durées et dépendances connues. Un délai standard ou une capacité non confirmée reste une
      hypothèse. Le contrôle de faisabilité ne choisit pas l''organisation interne du prestataire et n''autorise
      pas la prestation.'
