- id: BHV104
  kind: behavior
  fields:
    name: Contractual Milestone-Based Ownership Transfer
    definition: Déterminer les changements de propriétaire liés aux autres jalons contractuels d’un achat, d’une
      vente ou d’un transport.
    scope: 'Examiner les preuves des jalons prévus par l’accord : réception, expédition, acceptation ou autre étape
      pertinente du parcours. Des faits douaniers peuvent contribuer à établir la satisfaction d’une condition ;
      un changement de statut douanier ne prouve pas à lui seul un changement de propriétaire. Les mécanismes consommation/vente
      et échéance sont décrits dans leurs variantes dédiées.


      Déterminer quantités, parties, date d’effet et fondement, ou expliciter les justificatifs manquants. Exemple
      fictif : des marchandises deviennent propres en transit lorsque le jalon prévu par l’accord est établi ; elles
      ne sont pas encore physiquement disponibles à destination. Le résultat ne remplace ni l’acte éventuellement
      requis ni son enregistrement reconnu.'
