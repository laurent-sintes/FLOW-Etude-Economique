- id: HS-013
  title: Répondre au client lorsque la promesse reste incertaine
  location:
    node_ids:
    - ba-order-promising
  problem: Déterminer ce que FLOW répond immédiatement puis plus tard quand le client demande une date et qu’aucun
    plan de fulfillment porteur d’engagement ferme n’est encore disponible.
  examples:
  - Une précommande B2B Boardriders pour l’implantation reçoit un mois cible qui n’est pas affiné avant l’avis tardif
    du transporteur.
  - Une disponibilité de stock encore incertaine permet une estimation, puis une confirmation ou une révision explicite.
  complexity:
    arbitration: L
    implementation: L
    rationale: La politique de réponse varie selon les clients et exige un suivi de l’estimation à la confirmation.
      Taille proposée par Codex, à vérifier sur les cas et volumes réels.
    arbitration_rationale: Les marques doivent choisir ce qui peut être annoncé comme indicatif, conditionnel ou
      engagé.
    implementation_rationale: Les réponses successives doivent distinguer estimation, confirmation et changement
      d’engagement.
