- id: BHV056
  kind: behavior
  fields:
    name: Return for Replacement
    definition: Prendre en charge un retour associé à un remplacement attendu, en conservant les liens entre marchandises
      renvoyées et apports de remplacement.
    scope: 'Suivre les quantités et dates de remplacement convenues, leurs révisions et leurs réceptions via Purchase
      Order ; rapprocher sortant et entrant sans les compter deux fois.


      Exemple fictif : 20 pièces défectueuses sont renvoyées. Le fournisseur doit les remplacer ; 12 arrivent et
      8 restent attendues.


      Purchase Order porte l’apport attendu ; le marché utilise selon le produit une nouvelle commande liée ou le
      rétablissement d’un attendu sur la commande initiale. Aucun choix documentaire imposé. La date convenue ne
      vaut pas réception, ni disponibilité opposable automatique pour ATP.


      Un même retour peut associer avoir pour certaines quantités et remplacement pour d’autres. Pas de comportement
      autonome pour cette combinaison partielle.


      Ce parcours relève de [Supplier Return Order](model:D04.m). Les mutations des Orders, la composition et l’archivage
      restent transverses. D06 conserve l’exécution et D01 les écritures de stock. Les décisions et autorisations
      applicables sont consommées sans négociation ou réalisation physique implicite. Aucun produit logiciel, statut
      technique ou séquence obligatoire imposé ; les règles de contrat détaillées restent à préciser.'
