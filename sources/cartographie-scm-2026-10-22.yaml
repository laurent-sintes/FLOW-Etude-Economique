      de leur pilotage ; les ancrages suivent ces responsabilités et les stratégies actives. U1030 valide la réécriture
      autour des écarts de gestion et de la complexité, avec PDF et PPTX distincts. Scores et options conservés
      ; ni convergence choisie ni budget ferme. U1066 valide un titre concret et une ouverture centrée sur les commandes
      refusées ou conservées. U1071 distingue trois problèmes et limite à deux les options du besoin de pilotage
      selon les marques ; la construction et l’évolution de l’outil restent à instruire, sans solution retenue.
      U1077 réestime M/L pour le carnet Wholesale ; la difficulté de construction demeure importante et toute contrainte
      de faisabilité majeure réouvrirait le niveau d’implémentation.'
  framing_impact:
    category: structuring
    targets:
    - business_model
    rationale: Les règles à partager ou à préserver déterminent le socle commun. Leur combinaison et la construction
      du cœur métier et de l’outil complet déterminent la complexité à instruire ; MAP conserve le carnet d’achat.
    follow_up: framing
    evidence_state: hypothesis
    source_refs:
