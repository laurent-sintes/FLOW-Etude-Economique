- id: HS-020
  title: 'Négoce Storeland : quelles fonctions reprendre, et où ?'
  location:
    node_ids:
    - ba-wholesale-account-management
    - ba-wholesale-sales
    - D04.i
    - D04.j
    - ba-execution-coordination
  problem: Négoce Storeland couvre plusieurs étapes de la vente aux revendeurs chez les Marques Historiques. Les
    fonctions réellement utilisées et leur futur responsable doivent être établis par marque avant le retrait de
    l’outil. Leur reprise ne revient pas automatiquement à FLOW.
  examples:
  - 'Scénario d’étude, non observé : un revendeur passe commande, les conditions commerciales sont appliquées, puis
    la livraison est préparée. Relever quels outils et équipes interviennent et où sont tenus les engagements.'
  - 'Variante à vérifier : la commande nécessite un achat fournisseur. Établir si Négoce crée ou suit cet achat,
    et comment les changements de quantité ou de date se répercutent sur la vente.'
  complexity:
    arbitration: M
    implementation: L
    rationale: Arbitrage M et implémentation L réestimés U1077. La répartition des fonctions Négoces exige une coordination
      entre produits et équipes ; les fonctions, objets ouverts et interfaces à reprendre restent à inventorier.
    arbitration_rationale: La répartition des fonctions Négoces demande plusieurs interlocuteurs, mais aucun compromis
      démontré entre politiques incompatibles de marques ne justifie actuellement L.
    implementation_rationale: Plusieurs fonctions, objets ouverts et interfaces peuvent être interdépendants ; leur
      périmètre réel reste à établir avant chiffrage.
  source_refs:
  - U958
  - A77
  - U967
  - U973
  - U1056
  - U1065
  - U1066
  - U1067
  - U1073
  - U1077
  review:
    state: under_review
    note: 'U967 valide la pertinence et le périmètre du sujet avec ses réserves : Répartir les responsabilités actuellement
      couvertes par Négoce. Inventaire à compléter ; aucun remplacement décidé. Aucun dysfonctionnement, observation
      installée, ancrage détaillé, classement d’impact, estimation ou solution n’est confirmé automatiquement ;
      les autres champs conservent leur qualification. U973 : compléments de l’audit appliqués ; estimations préparatoires
      et options restent à éprouver. Les mandats, la réalisation installée et la crédibilité ne sont pas déduits
      de cette application. U1056 : ancrage de lecture proposé sur les deux Business Areas Wholesale ; la documentation
      Cegid confirme le périmètre de l’offre Négoce, pas les fonctions activées chez GBM. U1066 valide le périmètre
      d’analyse et sa localisation sur les responsabilités commerciales, de commande et d’exécution ; ces ancres
      ne prouvent pas leur usage dans Négoce. Les exemples restent des scénarios d’étude. U1077 ramène l’arbitrage
      à M sur les preuves actuelles ; si des règles divergentes entre marques apparaissent, réexaminer ce niveau.'
  framing_impact:
