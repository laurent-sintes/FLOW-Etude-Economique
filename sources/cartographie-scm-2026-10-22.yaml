- id: HS-012
  title: Stock Hub — rapprochement des états et faits de stock
  location:
    node_ids:
    - D01.f
    - D01.g
  problem: Rapprocher les mouvements et photographies de stock provenant de sources diverses pour établir une vue
    cohérente, datée et traçable sans double compte. C-LOG transmet aujourd’hui un état de stock comparable à une
    photographie d’inventaire.
  examples:
  - Un état C-LOG est rapproché des mouvements déjà reçus avant de corriger la vue centrale.
  - Une divergence entre stock attendu et état observé déclenche une vérification et une correction justifiée.
  complexity:
    arbitration: L
    implementation: XL
    rationale: La diversité des sources, les reprises et les règles anti-double-compte rendent la réalisation difficile.
      Taille proposée par Codex, à vérifier sur les cas et volumes réels.
    arbitration_rationale: Les contributeurs doivent reconnaître quelle source fait autorité lorsqu’un événement
      et une photographie se contredisent.
    implementation_rationale: L’ordre d’arrivée, les corrections et le rapprochement temporel doivent produire un
      registre reproductible.
