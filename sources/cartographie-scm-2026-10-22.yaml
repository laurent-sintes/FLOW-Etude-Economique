- id: BHV019
  kind: reference
  fields:
    name: Safety Stock Policy
    definition: Stock tampon de référence et conditions de son utilisation pour absorber les incertitudes.
    scope: 'Le référentiel précise la valeur de sécurité, son périmètre, sa période et ses conditions d’utilisation
      sans la confondre avec une réservation ou un seuil de déclenchement.


      D05.a décide le niveau ; ne pas additionner deux fois le tampon et le minimum de réassort.


      Exemple fictif : Sécurité 40 pour absorber retard fournisseur ; préciser quand elle peut être consommée.'
