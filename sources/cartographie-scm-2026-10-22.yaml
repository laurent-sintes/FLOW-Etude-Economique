- id: BHV059
  kind: behavior
  fields:
    name: Direct Delivery
    definition: Acheter des marchandises livrées directement par le fournisseur au client ; coordonner les attentes
      des commandes d’achat et de vente.
    scope: 'Coordination des attentes achat et vente, des destinations et des preuves de livraison.


      Exemple fictif : un fournisseur livre 100 pièces directement à un client wholesale.


      Livrer un magasin de notre réseau relève du premier parcours lorsque l’objectif est son stock. La décision
      de sourcing, la promesse et l’orchestration restent distinctes ; pas de propagation automatique implicite.


      Les mutations communes mobilisent [les familles d’Orders](model:D04), la composition [Order Structuring](model:D04.n)
      et la conservation [la conservation des Orders](model:D04). Aucune négociation de contrat, réalisation physique
