- id: BHV052
  kind: behavior
  fields:
    name: Return to Supplier
    definition: 'Tenir le lien entre retour client et retour fournisseur : identifier les quantités confiées à Supplier
      Return Order et rapprocher son résultat des engagements du retour client.'
    scope: 'Relais vers une commande de retour fournisseur liée au retour client ; suivre les quantités transférées
      à cette responsabilité et leur résultat.


      Exemple fictif : Trois pièces présentant un défaut fournisseur sont rattachées à un Supplier Return Order
      ; l’expédition ne prouve ni réception fournisseur ni avoir.


      Supplier Return Order D04.m porte la commande fournisseur ; ce comportement porte son articulation avec le
      retour client. L’accord de reprise est une condition, jamais déduit du choix logistique.


      Ce comportement appartient à [Return Order](model:D04.l). Il peut se combiner avec les autres parcours du
      retour selon le produit ou la quantité. Le choix du devenir est porté par [Inventory Disposition Decision](model:D05.i).
      Les preuves de résultat proviennent des responsabilités opérationnelles compétentes. Aucune inspection, écriture
      de stock, prestation physique ou décision de remboursement absorbée ; aucun logiciel ni traitement manuel
      imposé.


      Responsabilité propre de l’Order : tenir les obligations et le reste à satisfaire de cette destination, sur
      la base de preuves fournies par les capacités compétentes. Le récit transverse figure dans les scénarios ;
      ce comportement ne réalise ni la prestation ni la correction du stock.'
