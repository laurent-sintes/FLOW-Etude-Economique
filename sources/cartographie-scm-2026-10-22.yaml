- id: HS-014
  title: États complets PLM et extraction des changements
  location:
    node_ids:
    - system-design-development
    - D08
  problem: Le PLM pousse des états complets du référentiel produit ; Supply doit identifier changements, suppressions
    et versions fiables sans supposer qu’un delta source est disponible.
  examples:
  - Une nouvelle photographie PLM modifie un produit mais la différence avec l’état précédent doit être reconstruite.
  - 'Une référence absente d’un état complet peut être supprimée ou simplement hors périmètre : le sens de l’absence
    doit être défini.'
  complexity:
    arbitration: L
    implementation: XL
    rationale: Le rapprochement de photographies complètes, versions et reprises est transverse et potentiellement
      volumineux. Taille proposée par Codex, à vérifier sur les cas et volumes réels.
    arbitration_rationale: Le domaine source et Supply doivent partager le sens d’un état complet et d’une référence
      absente.
    implementation_rationale: Comparer des états exige identité stable, périmètre connu et reprise après interruption
      ; une absence ne signifie pas forcément suppression.
