- id: master-data-ingestion-finance
  kind: behavior
  fields:
    name: Reference Ingestion from Finance
    definition: Intégrer les données de référence fournies par le domaine Finance selon son contrat métier et leur
      provenance.
    scope: 'Recevoir du contrôle de gestion ou de [Finance](glossary:TER117) les informations alimentant [Customer
      Credit Profile](model:customer-credit-profile) : classement de risque, limite et devise, restrictions, périmètre,
