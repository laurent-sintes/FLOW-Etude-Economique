- id: BHV106
  kind: behavior
  fields:
    name: Consolidated Release
    definition: Retenir les ordres ou quantités compatibles jusqu’à une complétude ou un regroupement utile pour
      leur traitement commun, notamment pour une commande ou un client B2B.
    scope: 'Retenir des ordres ou quantités compatibles pour atteindre la complétude ou le regroupement utile à
      un traitement commun, par commande, client ou destination. Les délais de rétention, compatibilités et possibilités
      de libération partielle sont des règles. Exemple fictif : attendre le dernier ensemble d’une commande B2B
      pour éviter plusieurs préparations et conditionnements fragmentés, tout en respectant l’échéance. Porter explicitement
      les exigences de préparation et de packing communs ; une libération simultanée ne garantit pas une seule palette.
      Les limites de la fenêtre d’expédition peuvent conduire à libérer les éléments admissibles selon les engagements.'
