- id: BHV054
  kind: behavior
  fields:
    name: Scrapping
    definition: 'Tenir les obligations de clôture du retour destiné au rebut : conserver l’autorisation, les quantités
      concernées et les preuves de traitement et de sortie de stock reconnue.'
    scope: 'Parcours de retrait contrôlé : conserver le motif et l’autorisation, suivre la prestation et rapprocher
      la preuve avec la sortie de stock.


      Exemple fictif : Un article non récupérable attend une prestation de traitement ; le retour garde sa trace
      jusqu’au résultat et à l’enregistrement de la sortie.


      D05.i décide du devenir, l’exécutant réalise, D06 trace et D01 enregistre. Ne regroupe pas donation, recyclage
      et revente secondaire sous le même résultat.


      Ce comportement appartient à [Return Order](model:D04.l). Il peut se combiner avec les autres parcours du
      retour selon le produit ou la quantité. Le choix du devenir est porté par [Inventory Disposition Decision](model:D05.i).
      Les preuves de résultat proviennent des responsabilités opérationnelles compétentes. Aucune inspection, écriture
      de stock, prestation physique ou décision de remboursement absorbée ; aucun logiciel ni traitement manuel
      imposé.


      Responsabilité propre de l’Order : tenir les obligations et le reste à satisfaire de cette destination, sur
      la base de preuves fournies par les capacités compétentes. Le récit transverse figure dans les scénarios ;
      ce comportement ne réalise ni la prestation ni la correction du stock.


      Lorsque le traitement physique est confié comme prestation identifiable, [Scrapping Order](model:service-order-scrapping)
      en porte l’engagement, les quantités et les preuves. Le comportement du Return Order garde l’issue du retour
      ; les deux engagements ne se confondent pas.'
