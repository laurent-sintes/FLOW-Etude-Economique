- id: service-order-inspection
  kind: capability
  fields:
    name: Inspection Order
    definition: Porter les demandes d’inspection des vêtements, chaussures et accessoires confiées aux exécutants,
      leurs exigences, engagements et résultats.
    scope: 'Tenir la commande, ses exigences, ses engagements et ses résultats selon le [contrat commun des commandes
      de traitement des biens](model:ba-goods-processing-order-management#scope). Le workflow pilote son suivi ;
      le prestataire réalise la prestation. La commande conserve ses règles de validité sans choisir elle-même son
      parcours.


      Inspection autonome, contrôle de conformité et classement d’état des articles.


      Le contrôle intégré à une autre prestation reste dans cette prestation ; le constat ne décide pas du devenir
      du stock.


      Préciser articles, quantités, consignes, résultat attendu et échéance ; conserver acceptation, modifications
      et écarts reçus.


      Exemple fictif : Examiner un lot retourné et livrer un constat d’état sans décider de sa destination.'
