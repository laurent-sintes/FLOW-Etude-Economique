- id: BHV018
  kind: reference
  fields:
    name: Consumption Capping
    definition: Limites de consommation applicables à un groupe sur un périmètre et une période définis.
    scope: 'Le référentiel précise le groupe, le plafond, la période et les corrections applicables pour empêcher
      la surconsommation même si du stock reste accessible.


      Préserver un minimum et limiter un maximum diffèrent ; imputation et correction sont fonctions.


      Exemple fictif : Un groupe ne dépasse pas 500 malgré un stock supérieur.'
