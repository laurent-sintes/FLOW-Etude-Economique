  - U897
  - U898
- id: ba-reactive-workflow-management
  kind: business_area
  fields:
    name: Reactive Workflow Management
    definition: Organiser et conduire les parcours Supply en réagissant au contexte tout en préservant les engagements.
    scope: 'Tenir les activités réutilisables, interpréter les événements, composer les parcours et les conduire.
      Cette responsabilité appartient à [Process Management](glossary:TER164). Les familles de commandes conservent
      leur état et leurs engagements ; les services logistiques gardent leurs opérations internes.


      Exemple fictif : une confirmation financière rend une activité admissible ; un événement répété ne déclenche
      pas une seconde prestation. [Fulfilment Coordination](glossary:TER176) conserve sa latitude locale dans le
      mandat reçu.'
  source_refs:
  - U845
  - U846
  - U847
  - U848
  - U853
  - U859
  - U861
  - U881
  - U882
  - U883
  - U884
  - U885
- id: ba-service-planning
  kind: business_area
  fields:
    name: Service Planning
    definition: Déterminer les prestations nécessaires, leurs exécutants et les plans de transport compatibles avec
      les engagements.
    scope: 'La visibilité des capacités de service alimente ce périmètre ; aucun type de capacité n’est changé en
      Planning par son rattachement.


      Bénéficiaire et résultat : Fournir aux responsables de la réalisation un ensemble de prestations réalisables
      et compatibles avec les engagements confiés.


      Exemple fictif : Prévoir emballage puis collecte selon la capacité annoncée et la date promise ; la famille
      de commande conserve l’engagement accepté.'
  source_refs:
  - U845
  - U846
  - U847
  - U848
  - U853
- id: ba-execution-assurance
  kind: business_area
  fields:
    name: Execution Assurance
    definition: Établir une connaissance fiable de la réalisation des prestations, rapprocher leurs résultats et
      rendre visibles les écarts.
    scope: 'Ne décide pas seule des adaptations et ne se substitue pas à [Process Sentry](glossary:TER127).


      Bénéficiaire et résultat : Permettre aux responsables de la coordination de distinguer réalisation attestée,
      attente et écart à traiter.


      Exemple fictif : Une collecte est annoncée mais non attestée : rapprocher les faits et rendre visible l’écart
      sans choisir seul une autre prestation.'
  source_refs:
  - U845
  - U846
  - U847
  - U848
  - U853
  - U881
  - U882
  - U883
  - U884
  - U885
