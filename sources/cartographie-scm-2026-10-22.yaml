  - U1065
  - U1066
  - U1067
  - U1070
  - U1073
  review:
    state: under_review
    note: 'Laurent reconnaît le problème et son périmètre dans le lot U947–U948. Les options, estimations, ancres
      et arbitrages restent à éprouver ; aucune solution retenue. U973 : compléments de l’audit appliqués ; estimations
      préparatoires et options restent à éprouver. U1064 rétablit ce hotspot comme relation distincte de FLOW avec
      les autres logisticiens Boardriders ; la note M/L reste préparatoire. Les mandats, la réalisation installée
      et la crédibilité ne sont pas déduits de cette application. U1066 valide le type intégration et le récit de
      pilotage des autres logisticiens ; prestataire et parcours réel restent à documenter. La frontière commune
      avec HS-002 n’en fait pas un sujet unique.'
  framing_impact:
