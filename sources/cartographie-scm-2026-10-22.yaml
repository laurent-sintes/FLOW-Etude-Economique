- id: master-data-ingestion-commerce
  kind: behavior
  fields:
    name: Commercial Reference Ingestion
    definition: Intégrer les données de référence provenant des sources commerciales dont les responsabilités restent
      à documenter, en conservant leur contrat et leur provenance.
    scope: Conserver identification, validité, version et corrections selon le contrat source. Le nom [Commerce](model:domain-sales)
      désigne désormais le domaine de vente ; cette ingestion conserve aussi des sources commerciales extérieures
      à ce domaine. Les responsabilités de [Commerce](model:domain-sales) et de [Sourcing and Procurement](glossary:TER109)
      restent à établir selon les données ; ne pas attribuer toutes les références commerciales à [Commerce](model:domain-sales).
