- id: BHV020
  kind: reference
  fields:
    name: Replenishment Regulation
    definition: Règles de déclenchement et de limitation du réassort qui encadrent le renouvellement du stock.
    scope: 'Le référentiel précise les seuils, cibles, périodes et limites applicables pour prévenir manque et excès
      par des règles cohérentes de renouvellement.


      Min/Max et revue périodique sont des modalités de la règle ; D05.e décide et D04 gère les apports.


      Exemple fictif : Sous 60 viser 100 ; appliquer la baisse de cible décidée en fin de vie.'
