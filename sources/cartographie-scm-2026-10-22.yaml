- id: D03
  kind: area
  fields:
    name: Availability
    definition: Établir ce qui peut être promis pour une demande identifiée, selon les ressources, le plan commun,
      les règles et les engagements.
    scope: '[Order Promising](model:ba-order-promising) évalue les possibilités et conditions de réponse à une demande
      identifiée par [ATP](glossary:TER044), [CTP](glossary:TER045) et [PTP](glossary:TER068). Le [Matching Master
      Plan](glossary:TER100), construit dans [Master Plan](model:domain-plan), fournit le contexte collectif ; [Order
      Backlog Management](model:ba-order-backlog-management) décide des priorités et affectations entre commandes.
      Une proposition de promesse n’est ni une confirmation, ni une réservation, ni une affectation effective. Les
      engagements restent dans [Order Management](model:D04). Exemple fictif : après un retard de réception, répondre
      à une nouvelle demande selon le stock, les apports réalistes et les commandes déjà engagées.'
