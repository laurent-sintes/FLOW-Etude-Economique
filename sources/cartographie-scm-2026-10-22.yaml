- id: HS-021
  title: 'FLOW–Finance : transmettre les faits et décider du rôle de SAP SD'
  location:
    node_ids:
    - accounting-data-provision
    - subdomain-financial-accounting
  problem: FLOW doit transmettre à Finance les [faits de gestion](glossary:TER120) issus de ses ventes et de sa
    [facturation](glossary:TER153). Leur interprétation comptable et le rôle éventuel de SAP SD restent à définir
    avec Finance. Une facture, un fait et une écriture doivent rester reliés, y compris après correction.
  examples:
  - 'Scénario à éprouver : une vente à un revendeur devient facturable. Distinguer qui tient le résultat de [Billing](model:service-order-billing),
    qui émet le document fiscal et qui crée l’écriture comptable.'
  - 'Scénario à éprouver : Finance rejette un fait transmis. Retrouver l’opération d’origine, corriger la cause,
    puis transmettre la correction sans double comptabilisation et en conservant la trace du rejet.'
  complexity:
    arbitration: M
    implementation: L
    rationale: Arbitrage M et implémentation L réestimés U1077. FLOW, Finance et le programme SAP doivent se coordonner
      sur la facture, les faits transmis et le rôle éventuel de SD ; plusieurs flux et corrections restent à réaliser
      sans doublons.
    arbitration_rationale: La frontière FLOW–Finance–SAP requiert plusieurs interlocuteurs et décisions par type
      de flux ; aucun compromis entre modèles de fonctionnement des marques n’est établi.
    implementation_rationale: Les identités, versions, retours, rejets et corrections lient plusieurs composants
      et règles ; les circuits doivent préserver le détail et éviter les doublons.
  source_refs:
  - U958
  - A77
  - U967
  - U973
  - U981
  - U1031
  - U1032
  - U1065
  - U1066
  - U1067
  - U1070
  - U1073
  - U1077
  review:
    state: under_review
    note: U967 reconnaît le sujet avec ses réserves. U1031 demande de distinguer frontière FLOW / Finance et solution
      d’échange, avec une alternative à SD et un document pédagogique. U1032 valide cette restructuration et la
      mise à disposition du PDF, sans retenir une option ni confirmer le rôle réel de SD, les flux installés ou
      la solution cible. FI/CO reste hors du périmètre migré de HS-001. Les estimations préparatoires U973 restent
      à éprouver. U1066 valide le titre et le récit clarifiés ; l’ancrage sur l’échange Faits de gestion est conservé.
      Aucun rôle réel de SD ni circuit cible n’est confirmé. U1077 ramène l’arbitrage à M sur les preuves actuelles
      ; une divergence de gouvernance entre périmètres imposerait un réexamen.
  framing_impact:
    category: structuring
    targets:
    - business_model
    rationale: La frontière FLOW / Finance et le rôle éventuel de SD conditionnent le service de facturation, la
      production des faits, leur interprétation et la comptabilisation.
    follow_up: framing
    evidence_state: hypothesis
    source_refs:
    - U959
