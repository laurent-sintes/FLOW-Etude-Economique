- id: BHV063
  kind: behavior
  fields:
    name: Consumption-Based Ownership Transfer
    definition: Déterminer les changements de propriétaire liés à une consommation ou à une vente selon les conditions
      de l’accord.
    scope: 'Examiner les faits de consommation ou vente et les quantités concernées au regard de l’accord. Déterminer
      si la condition est satisfaite, pour quelles parties et à quelle date ; demander un acte si nécessaire. Une
      simple réservation ou une prévision de consommation ne constitue pas une preuve de consommation réalisée.
      Le résultat alimente la détermination de propriété, puis le registre reçoit le changement reconnu. Exemple
      : la vente de 20 vêtements satisfait une clause d’acquisition des seules pièces vendues.'
