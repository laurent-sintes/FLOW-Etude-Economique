- id: BHV105
  kind: behavior
  fields:
    name: Batch Release
    definition: Regrouper les ordres éligibles en lots de libération selon les fenêtres et la charge communiquée
      par l’exécutant.
    scope: 'Constituer les lots d’ordres éligibles à libérer à l’exécutant selon les fenêtres de travail, les échéances
      et la charge communiquée. Déterminer quels ordres appartiennent au lot et lesquels restent en attente. Une
      capacité annoncée ne constitue pas une réservation ni un disponible calculé sans règle connue. Exemple fictif
      : regrouper les préparations prêtes pour un créneau convenu afin que l’entrepôt organise le travail. La libération
      n’impose ni une vague unique ni une expédition commune ; [Fulfilment Coordination](glossary:TER176) la met
      en œuvre.'
