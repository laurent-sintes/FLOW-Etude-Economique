  problem: 'Déterminer la maille d’information produit nécessaire aux décisions et documents Supply selon les usages
    : produit, variante vendable, assortiment ou conditionnement, sans fixer cette maille par le seul canal.'
  examples:
  - Un achat de gros peut porter un carton ou un prépack dont la composition doit être connue.
  - Une vente B2C doit identifier la variante effectivement vendue ; un cadrage d’achat peut commencer à une maille
    plus large.
  complexity:
