- id: BHV051
  kind: behavior
  fields:
    name: Repair and Refurbishment
    definition: 'Tenir les engagements du retour soumis à réparation : préserver l’identité des articles, les quantités
      confiées, le résultat attendu et la suite autorisée en cas de succès ou d’échec.'
    scope: 'Parcours avec prestation corrective : préserver le lien au produit et au retour, suivre la prise en
      charge, le résultat et la suite autorisée.


      Exemple fictif : Une fermeture défectueuse est réparée ; selon la décision applicable, le vêtement revient
      au client ou au stock. Un échec remonte pour réexaminer le devenir.


      La réalisation de la réparation reste chez l’exécutant et son orchestration dans D06. Le coût acceptable et
      le choix du devenir sont dans D05.i. Aucun atelier interne imposé.


      Ce comportement appartient à [Return Order](model:D04.l). Il peut se combiner avec les autres parcours du
      retour selon le produit ou la quantité. Le choix du devenir est porté par [Inventory Disposition Decision](model:D05.i).
      Les preuves de résultat proviennent des responsabilités opérationnelles compétentes. Aucune inspection, écriture
      de stock, prestation physique ou décision de remboursement absorbée ; aucun logiciel ni traitement manuel
      imposé.


      Responsabilité propre de l’Order : tenir les obligations et le reste à satisfaire de cette destination, sur
      la base de preuves fournies par les capacités compétentes. Le récit transverse figure dans les scénarios ;
      ce comportement ne réalise ni la prestation ni la correction du stock.'
