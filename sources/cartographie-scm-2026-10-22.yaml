- id: BHV102
  kind: behavior
  fields:
    name: Commitment-Preserving Assignment
    definition: Compléter le plan en préservant les affectations qui soutiennent les engagements protégés, dans
      le périmètre fixé.
    scope: 'Compléter le plan en préservant les affectations qui soutiennent les engagements protégés, dans le périmètre
      fixé.


      Une nouvelle commande consomme le solde ; les ressources protégées pour une commande confirmée restent attachées.


      Microsoft documente une fonction conditionnelle à la version et au paramétrage ; dans FLOW, protection ne
