- id: BHV058
  kind: behavior
  fields:
    name: Stock Procurement
    definition: Acheter des marchandises destinées au stock du réseau ; suivre les quantités et dates restant à
      recevoir.
    scope: 'Parcours d’approvisionnement physique avec quantités et échéances restant à recevoir.


      Exemple fictif : achat de 2 000 vestes destinées à un entrepôt ou directement à des magasins.


      [Master Plan](glossary:TER111) détermine les besoins et leur couverture ; [Availability](glossary:TER112)
      évalue les possibilités de promesse. [Fulfilment Orchestration](model:D06) suit les prestations et [Inventory
      Management](model:D01) enregistre les faits de stock. Aucun comportement distinct par type de site.


      Les mutations communes mobilisent [les familles d’Orders](model:D04), la composition [Order Structuring](model:D04.n)
      et la conservation [la conservation des Orders](model:D04). Aucune négociation de contrat, réalisation physique
      ni fonction comptable reprise par ce comportement. Les exemples ne prouvent aucune pratique installée.'
