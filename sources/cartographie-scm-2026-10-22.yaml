- id: BHV060
  kind: behavior
  fields:
    name: Service Procurement
    definition: Acheter une prestation ; suivre ce qui est attendu puis reconnu réalisé.
    scope: 'Attente de prestation et constat de réalisation, au lieu d’un apport d’articles à recevoir.


      Exemple fictif : commande de réparation de 50 pièces auprès d’un prestataire.


      D04 porte l’achat ; D06 sollicite, orchestre et suit les services via les Service Orders. Pas de Purchase
      Order imposée pour chaque appel de service ; comptabilité et négociation contractuelle hors périmètre. Purchase
      Order couvre les biens et les prestations depuis U391.


      Les mutations communes mobilisent [les familles d’Orders](model:D04), la composition [Order Structuring](model:D04.n)
