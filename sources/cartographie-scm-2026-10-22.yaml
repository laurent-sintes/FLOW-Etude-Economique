- id: ba-order-lifecycle-management
  kind: business_area
  fields:
    name: Order Lifecycle Management
    definition: Tenir les commandes, leurs engagements et leurs évolutions, préserver leur traçabilité et restituer
      leur état.
    scope: 'La structuration et la visibilité restent des capacités distinctes ; le pilotage du parcours relève
      de [Reactive Workflow Management](glossary:TER125).


      Bénéficiaire et résultat : Donner aux parties de la commande une trace fiable de ce qui a été demandé, accepté,
      modifié et réalisé.


      Exemple fictif : Une commande est fractionnée avec accord du client : conserver les engagements et la filiation
      des parties sans choisir leur transporteur.


      Les commandes appliquent les résultats autorisés des contrôles propres aux [Cases](glossary:TER064). Le [Credit
      Check](glossary:TER155) relève du parcours de [Wholesale Commerce](model:subdomain-sales-wholesale) et des
      règles financières compétentes ; ce périmètre ne porte pas une capacité de décision financière autonome.'
  source_refs:
  - U845
  - U846
  - U847
  - U848
  - U853
  - U887
  - U892
  - U893
  - U894
  - U895
