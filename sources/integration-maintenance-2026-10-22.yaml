date_recherche: '2026-10-22'
limite: Sources de capacités, frontières et prix RFI datés. Les prix RFI ne sont pas des contrats actuels ni
  des prix retraités au seul périmètre FLOW. Points, volumes et parts de rôles restent des hypothèses.
sources:
  CADRE:
    reference: AGENTS.md
    nature: hypothese_etude
    portee: Points, répartitions de rôles et volumes proposés pour comparaison ; aucune preuve empirique de
      durée.
  CARTO:
    reference: sources/cartographie-scm-2026-10-22.yaml
    nature: cartographie
    portee: Périmètre Supply Chain Management, frontières et coexistence avec les SI externes ; pas inventaire
      technique des flux.
  RFI_USERS:
    reference: archives/etude-avant-yaml-2026-10-24/07-analyse-synvance.md
    nature: analyse_interne_de_source_client
    portee: 'Section Microsoft : 950 utilisateurs dans le panier RFI 2025. Repère indirect du périmètre ERP
      global ; sa transposition au seul SCM est une hypothèse, pas un effectif SCM confirmé. Aucun prix ou
      ancien JH repris.'
  GOLIVE:
    reference: https://learn.microsoft.com/en-us/dynamics365/guidance/implementation-guide/prepare-go-live-checklist
    nature: documentation_officielle
    portee: Migration, tests, préparation des opérations, formation et bascule ; aucune durée ni répartition
      de rôles fournie.
  CUTOVER:
    reference: https://learn.microsoft.com/en-us/dynamics365/guidance/implementation-guide/prepare-go-live-cutover-strategy
    nature: documentation_officielle
    portee: Répétition et contrôle de bascule, transition vers le support ; aucune roadmap imposée au modèle.
  MS_DATA:
    reference: https://learn.microsoft.com/en-us/dynamics365/guidance/implementation-guide/data-management-product-specific-fo
    nature: documentation_officielle
    portee: Entités, packages de données et promotion de configuration ; nettoyage métier et règles de migration
      restent à réaliser.
  MS_UPDATES:
    reference: https://learn.microsoft.com/en-us/dynamics365/guidance/implementation-guide/service-solution-service-updates
    nature: documentation_officielle
    portee: Service updates ; préparation, validation et adoption restent des responsabilités client. Pas promesse
      de livrer une évolution métier demandée.
  MS_RESTORE:
    reference: https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/database/dbmovement-operations
    nature: documentation_officielle
    portee: Refresh/export/import/restauration proposés ; vérifier les scénarios et environnements supportés.
  MS_TEST:
    reference: https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/perf-test/rsat/rsat-overview
    nature: documentation_officielle
    portee: 'RSAT ne remplace ni tests unitaires ni tests de flux. La page annonce sa fin de support au 15
      mai 2027 : ne pas fonder une économie pérenne sur cet outil.'
  CICD:
    reference: https://learn.microsoft.com/en-us/azure/well-architected/operational-excellence/safe-deployments
    nature: documentation_officielle
    portee: Artefacts, contrôles, déploiement sûr et reprise ; principe technique utilisable hors Azure, sans
      choix fournisseur implicite.
  SHARED:
    reference: https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility
    nature: documentation_officielle
    portee: 'SaaS/PaaS/IaaS : données, identités et configurations client restent à gérer ; document non contractuel.'
  SAP_MIG:
    reference: https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE/f5d3e1005efd4e86acf9a65abf428082/8d47c19784b74d7a8e9b030ad9645e75.html?version=2025.001
    nature: documentation_officielle
    portee: Objets du Migration Cockpit, dépendants de la version ; les historiques et données externes ne
      sont pas tous chargeables tels quels.
  SAP_CONTRACT:
    reference: https://www.sap.com/about/trust-center/agreements/cloud/cloud-services.html
    nature: documentation_officielle
    portee: Référentiel des documents contractuels cloud. Les services inclus et responsabilités Private doivent
      être confirmés sur le contrat applicable, pas inférés de Public ou Tailored.
  SOLUTION:
    reference: sources/core-system-solutions-2026-10-22.yaml
    nature: registre_technique_local
    portee: Capacités et limites des moteurs/éditeurs. Les écarts de couverture du produit générique sont traités
      dans Core System Solution, pas reconstruits dans Intégration.
  RFI_MS_PRIX:
    reference: sources/client/microsoft-1.pdf
    nature: estimation_fournisseur_rfi_2025
    portee: 'Page PDF 38 : panier Dynamics et K3 de 950 utilisateurs, 979 001,51 EUR/an pour les cinq années
      documentées ; maintenance standard, infrastructure Azure, sandbox et services managés inclus. Aucun prix
      cloud séparé ni ventilation Dynamics/K3. Finance et Commerce présents ; périmètre à rapprocher de FLOW.'
    sha256: 2eca158bcb9b5d2ce50f66363e8715c870d8773f8e4caf6d56f376a13e1a3cc8
  RFI_MS_SUPPORT:
    reference: sources/client/microsoft-questionnaire.xlsx
    nature: estimation_fournisseur_rfi_2025
    portee: 'Onglet 8. Estimations budgétaires, C13/D13 : 90 000 EUR en année 1 pour Unified + Project Quality
      advisory, incluant 200 heures d’ingénierie, Build/Run. Récurrence non établie ; ne pas convertir en forfait
      annuel perpétuel. D26 : Sandbox/UAT inclus dans l’estimation. Onglet 3. Architecture et sécurité, D3
      : SQL intégré.'
    sha256: 73440f70552ca7d82fd61bb4bbc9121840918af321dc14bc93193a03505a8345
  RFI_SAP_PRIX:
    reference: sources/client/delaware-septembre.pdf
    nature: estimation_fournisseur_rfi_2025
    portee: 'Pages PDF 43–45 : totaux annuels imprimés 790 633 / 765 823 / 973 480 / 1 270 879 / 1 270 879
      EUR HT. Séquence de montée en charge du dossier, finance comprise ; BOM explicitement non validée par
      SAP. Extensions mémoire incluses dans ces totaux. Stockage présent p.43–44 mais absent p.45 ; ligne DRP
      non comprise dans les totaux imprimés : ne pas corriger silencieusement. Page 28 : Integration Suite
      non inclus ; voucher BTP ne démontre pas une couverture iPaaS complète. Mention hors CPI p.45 conservée
      sans expansion arbitraire de l’acronyme.'
    sha256: 09871d01b3086de99ce19bca0f75613455d525acb4759cd3510e4bd190293ee4
  RFI_SAP_SERVICES:
    reference: sources/client/delaware-septembre.pdf
    nature: estimation_fournisseur_rfi_2025
    portee: 'Page PDF 37 : après stabilisation, MCO 250 000 EUR/an, monitoring des flux en horaires étendus
      450 000 EUR/an, TMA évolutive 350 000 EUR/an. RISE arrondi à 1 270 000 EUR est déjà représenté par la
      BOM précise, jamais ajouté. Rapprochement des forfaits avec les activités FLOW hypothétique ; aucune
      ventilation contractuelle par rôle disponible.'
    sha256: 09871d01b3086de99ce19bca0f75613455d525acb4759cd3510e4bd190293ee4
