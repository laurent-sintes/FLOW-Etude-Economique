name: Validate and deploy FLOW

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tools/requirements-model.txt
      - name: Install locked dependencies
        run: |
          python -m pip install -r tools/requirements-model.txt
          npm install --global pnpm@11.25.0 --ignore-scripts
          pnpm --dir app install --frozen-lockfile --ignore-scripts
      - name: Validate model and local application
        run: python -m tools.check_model --full
      - name: Build static application and original evidence
        run: |
          pnpm --dir app exec vite build --outDir dist-pages --base /FLOW-Etude-Economique/
          python -m tools.build_pages --output app/dist-pages --base /FLOW-Etude-Economique/
          python -m tools.pages_validation --output tmp/pages-validation.json
      - name: Install Chromium
        run: pnpm --dir app exec playwright install --with-deps chromium
      - name: Check Pages and Python simulations in the browser
        shell: bash
        run: |
          mkdir -p tmp/pages-preview/FLOW-Etude-Economique
          cp -R app/dist-pages/. tmp/pages-preview/FLOW-Etude-Economique/
          python -m http.server 8777 --bind 127.0.0.1 --directory tmp/pages-preview > tmp/pages-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8777/FLOW-Etude-Economique/site-manifest.json > /dev/null; then break; fi
            sleep 1
          done
          node app/scripts/verify-pages.mjs --url http://127.0.0.1:8777/FLOW-Etude-Economique/ --cases tmp/pages-validation.json --output tmp/pages-validation-report.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist-pages

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated application
        id: deployment
        uses: actions/deploy-pages@v4
