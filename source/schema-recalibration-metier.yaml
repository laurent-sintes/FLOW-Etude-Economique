$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required:
- version
- date
- statut
- methode
- dependances
- lots
- couvertures
- blocs
- transverse
- maintenance
- lecture
properties:
  version:
    const: 3
  preuves:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required:
      - titre
      - reference
      - portee
      properties:
        titre:
          $ref: '#/$defs/text'
        reference:
          type: string
          pattern: ^https://
        portee:
          $ref: '#/$defs/text'
  date:
    type: string
  statut:
    enum: [calibration_ingenierie_a_confirmer, a_reestimer]
  methode:
    type: object
    additionalProperties: false
    required:
    - unite
    - natures
    - principe
    - fourchettes
    - reemploi
    - buy
    - maintenance
    - integration
    properties:
      unite:
        $ref: '#/$defs/text'
      natures:
        type: array
        minItems: 6
        maxItems: 6
        items:
          $ref: '#/$defs/text'
      principe:
        $ref: '#/$defs/text'
      fourchettes:
        $ref: '#/$defs/text'
      reemploi:
        $ref: '#/$defs/text'
      buy:
        $ref: '#/$defs/text'
      maintenance:
        $ref: '#/$defs/text'
      integration:
        $ref: '#/$defs/text'
  dependances:
    type: object
    minProperties: 1
    additionalProperties:
      type: string
      pattern: ^[0-9a-f]{64}$
  lots:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required:
      - travail
      - bas
      - central
      - haut
      - hypothese_basse
      - hypothese_haute
      properties:
        travail:
          $ref: '#/$defs/text'
        bas:
          $ref: '#/$defs/charges'
        central:
          $ref: '#/$defs/charges'
        haut:
          $ref: '#/$defs/charges'
        hypothese_basse:
          $ref: '#/$defs/text'
        hypothese_haute:
          $ref: '#/$defs/text'
  couvertures:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required:
      - composants
      - sources
      - apport
      - limites
      properties:
        composants:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/$defs/text'
        sources:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/$defs/text'
        apport:
          $ref: '#/$defs/text'
        limites:
          $ref: '#/$defs/text'
  blocs:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
      - bloc
      - capacite
      - reemploi
      - stacks
      - hypothese
      properties:
        bloc:
          type: string
          pattern: ^BC-[0-9]{3}$
        capacite:
          $ref: '#/$defs/text'
        scenario:
          $ref: '#/$defs/text'
          readOnly: true
        frontiere:
          $ref: '#/$defs/text'
          readOnly: true
        reemploi:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - proprietaire
            - contrat
            properties:
              proprietaire:
                $ref: '#/$defs/text'
              contrat:
                $ref: '#/$defs/text'
        stacks:
          $ref: '#/$defs/stacks'
        hypothese:
          $ref: '#/$defs/text'
  transverse:
    type: object
    additionalProperties: false
    required:
    - id
    - nom
    - frontiere
    - stacks
    properties:
      id:
        const: TRANSVERSE
      nom:
        $ref: '#/$defs/text'
      frontiere:
        $ref: '#/$defs/text'
      stacks:
        $ref: '#/$defs/stacks'
  maintenance:
    type: object
    additionalProperties: false
    required:
    - justification
    - par_stack
    properties:
      justification:
        $ref: '#/$defs/text'
      par_stack:
        type: object
        propertyNames:
          enum:
          - java-spring
          - dotnet
          - rust
          - microsoft
          - sap
        minProperties: 5
        maxProperties: 5
        additionalProperties:
          type: object
          additionalProperties: false
          required:
          - correction_core
          - qualification_release
          - evolution_core
          - correction_extension
          - qualification_client
          - entretien_complements_buy_jh
          - justification
          properties:
            correction_core:
              type: number
              minimum: 0
            qualification_release:
              type: number
              minimum: 0
            evolution_core:
              type: number
              minimum: 0
            correction_extension:
              type: number
              minimum: 0
            qualification_client:
              type: number
              minimum: 0
            entretien_complements_buy_jh:
              type: number
              minimum: 0
            justification:
              $ref: '#/$defs/text'
  lecture:
    type: object
$defs:
  text:
    type: string
    minLength: 1
  charges:
    type: array
    minItems: 6
    maxItems: 6
    items:
      type: number
      minimum: 0
  stacks:
    type: object
    propertyNames:
      enum:
      - java-spring
      - dotnet
      - rust
    minProperties: 3
    maxProperties: 3
    additionalProperties:
      type: object
      additionalProperties: false
      required:
      - couverture_ref
      - travaux_ref
      - traitement
      - statut
      properties:
        couverture_ref:
          $ref: '#/$defs/text'
        travaux_ref:
          $ref: '#/$defs/text'
        traitement:
          enum:
          - build_core
          - complement_integration
          - inclus_rfi
        statut:
          enum:
          - mecanismes_a_realiser
          - standard_a_confirmer
          - couverture_partielle_a_qualifier
