    et les droits du panier FLOW restent à qualifier.
ai_refs:
- id: IA_EXPERIMENT
  title: GitHub Copilot · expérience contrôlée
  published_on: '2023-02-13'
  observed_result: 55,8 % de temps en moins parmi les participants ayant terminé la tâche.
  population: 95 développeurs professionnels recrutés sur Upwork, répartis aléatoirement. Réalisation d’un serveur
    HTTP JavaScript en mai–juin 2022.
  limit: Tâche standardisée et isolée. L’étude ne mesure pas la qualité du code ni le travail collectif d’un programme.
- id: IA_METR_2025
  title: METR · développeurs expérimentés
  published_on: '2025-07-10'
  observed_result: 19 % de temps en plus avec les outils IA autorisés.
  population: 16 développeurs expérimentés, 246 tâches sur leurs propres dépôts à code ouvert. Outils de début 2025,
    principalement Cursor avec Claude 3.5 ou 3.7.
  limit: Résultat propre à ces développeurs, à des dépôts familiers et aux outils testés début 2025.
- id: IA_METR
  title: METR · suivi et changement de protocole
  published_on: '2026-02-24'
  observed_result: Le suivi ne permet pas de mesurer fiablement l’effet actuel des outils IA.
  population: Expérience lancée en août 2025, avec 10 développeurs de la première étude et 47 nouveaux participants.
  limit: Des développeurs refusent de travailler sans IA et certaines tâches sont écartées. Ces biais de sélection,
    le changement de rémunération et le travail avec plusieurs agents rendent la mesure incertaine.
