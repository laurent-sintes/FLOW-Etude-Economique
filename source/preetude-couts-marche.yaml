  channels:
  - id: direct
    title: Indépendant en direct
    description: Le client achète la prestation à l’indépendant ou à sa société. Il organise la sélection et la
      coordination de l’équipe.
    price: Comparer le prix HT facturé au client, le profil et les conditions de mission.
    source_ids:
    - fw-java
    - fw-direction
  - id: plateforme
    title: Indépendant via une plateforme ou un intermédiaire
    description: Un intermédiaire facilite le sourcing, le référencement, les contrats ou le paiement. Son rôle
      et sa facturation dépendent de l’offre.
    price: Distinguer tarif du professionnel, frais client et montant total du devis. Malt affiche ses offres client
      sur demande.
    source_ids:
    - malt
  - id: esn
    title: ESN / intégrateur
    description: L’entreprise fournit une prestation avec ses compétences et l’organisation convenue. Elle peut
      vendre du temps, un lot ou un service.
    price: Comparer le prix client et les services inclus. L’offre Avanade reçue donne un repère de pilote à 1 000
      € HT / JH, sans grille par rôle.
    source_ids:
    - avanade
  engagements:
  - title: Régie · du temps et des compétences
    text: Facturation des jours réalisés aux tarifs convenus. Volume, livrables et pilotage restent à cadrer. Un
      tarif journalier ne garantit pas un budget total.
  - title: Forfait · un périmètre et des livrables
    text: Prix d’un lot défini avec critères de réception, exclusions et traitement des changements. Le prix couvre
      le périmètre contractualisé.
  - title: Service managé · un service dans la durée
    text: Prix périodique ou à l’usage, avec horaires, volumes et engagements de service. Un forfait d’exploitation
      ne se compare pas directement à un TJM.
  portage:
    text: Le portage salarial organise la relation entre le professionnel, son employeur de portage et le client.
      Il peut se combiner avec un intermédiaire. Les frais de gestion du porté ne constituent pas automatiquement
      un supplément à la facture client.
    source_ids:
    - portage
