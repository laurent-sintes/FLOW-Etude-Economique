type: object
additionalProperties: false
properties:
  version:
    const: 1
  date: &id001
    type: string
    minLength: 1
  default_zone:
    const: paris
  rounding_eur:
    const: 25
  method:
    type: object
    additionalProperties: false
    properties:
      title: *id001
      steps:
        type: array
        items: *id001
        minItems: 1
    required:
    - title
    - steps
  roles:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        ratio_role: *id001
        rationale: *id001
        status:
          const: reference_etude
        paris_ref:
          type: object
          additionalProperties: false
          properties:
            path: *id001
            pointer: *id001
            role_id: *id001
            field: *id001
          required:
          - path
          - pointer
        paris_value:
          type: number
          exclusiveMinimum: 0
      required:
      - id
      - ratio_role
      - rationale
      - status
      oneOf:
      - required:
        - paris_ref
        not:
          required:
          - paris_value
      - required:
        - paris_value
        not:
          required:
          - paris_ref
    minItems: 1
  stack_bindings: &id003
    type: object
    additionalProperties: &id002
      type: object
      additionalProperties: *id001
  transformation_bindings: *id002
  selection_bindings: *id002
  regional_peers:
    type: object
    additionalProperties:
      type: array
      minItems: 1
      items: *id001
  activity_bindings: *id003
required:
- version
- date
- default_zone
- rounding_eur
- method
- roles
- stack_bindings
- transformation_bindings
- selection_bindings
- regional_peers
- activity_bindings
