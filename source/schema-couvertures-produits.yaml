type: object
additionalProperties: false
required:
- version
- couvertures
- preuves
properties:
  version:
    const: 1
  couvertures:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required:
      - composants
      - sources
      - apport
      - limites
      properties:
        composants:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
        sources:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
        apport:
          type: string
          minLength: 1
        limites:
          type: string
          minLength: 1
  preuves:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required:
      - titre
      - reference
      - portee
      properties:
        titre:
          type: string
          minLength: 1
        reference:
          type: string
          pattern: ^https://
        portee:
          type: string
          minLength: 1
