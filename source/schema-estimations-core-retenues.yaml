type: object
properties:
  version:
    const: 1
  units:
    type: array
    minItems: 0
    items:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        stack:
          enum:
          - java-spring
          - dotnet
          - rust
        label:
          type: string
          minLength: 1
        status:
          const: retained
        decision_date:
          type: string
          minLength: 1
        capabilities:
          type: array
          minItems: 0
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
              native_id:
                type: string
                minLength: 1
            required:
            - id
            - native_id
            additionalProperties: false
        total_jh:
          type: number
          minimum: 0
        months:
          type: number
          minimum: 0
        method:
          type: string
          minLength: 1
        roles:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
              label:
                type: string
                minLength: 1
              jh:
                type: number
                minimum: 0
              rate_ref:
                type: object
                properties:
                  path:
                    type: string
                    minLength: 1
                  pointer:
                    type: string
                    minLength: 1
                required:
                - path
                - pointer
                additionalProperties: false
              rate_assumption:
                type: string
                minLength: 1
            required:
            - id
            - label
            - jh
            - rate_ref
            - rate_assumption
            additionalProperties: false
        provenance:
          type: object
          properties:
            path:
              type: string
              minLength: 1
            sha256:
              type: string
              minLength: 1
            explanation:
              type: string
              minLength: 1
          required:
          - path
          - sha256
          - explanation
          additionalProperties: false
        role_assumption:
          type: string
          minLength: 1
        schedule:
          type: object
          properties:
            unrounded_months:
              type: number
              minimum: 0
            capacity_ref:
              type: object
              properties:
                path:
                  type: string
                  minLength: 1
                pointer:
                  type: string
                  minLength: 1
              required:
              - path
              - pointer
              additionalProperties: false
            explanation:
              type: string
              minLength: 1
            rule_ref:
              const: cocomo_schedule
          required:
          - unrounded_months
          - capacity_ref
          - explanation
          - rule_ref
          additionalProperties: false
        uncertainty:
          type: object
          properties:
            confidence_level:
              type: 'null'
            low_jh:
              type: 'null'
            high_jh:
              type: 'null'
            explanation:
              type: string
              minLength: 1
            status:
              const: unquantified
          required:
          - confidence_level
          - low_jh
          - high_jh
          - explanation
          - status
          additionalProperties: false
        includes:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        excludes:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        assumptions:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
              hypothesis:
                type: string
                minLength: 1
              trigger:
                type: string
                minLength: 1
              effect:
                type: string
                minLength: 1
            required:
            - id
            - hypothesis
            - trigger
            - effect
            additionalProperties: false
        crosscheck:
          type: object
          properties:
            method:
              type: string
              minLength: 1
            jh:
              type: number
              minimum: 0
            explanation:
              type: string
              minLength: 1
          required:
          - method
          - jh
          - explanation
          additionalProperties: false
        no_extra_ai_discount:
          const: true
        no_extra_coordination:
          const: true
        calculation:
          type: object
          properties:
            id:
              type: string
              minLength: 1
          required:
          - id
          additionalProperties: false
        professional_functions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
      required:
      - id
      - stack
      - label
      - status
      - decision_date
      - capabilities
      - total_jh
      - months
      - method
      - roles
      - provenance
      - role_assumption
      - schedule
      - uncertainty
      - includes
      - excludes
      - assumptions
      - crosscheck
      - no_extra_ai_discount
      - no_extra_coordination
      - calculation
      additionalProperties: false
      allOf:
      - if:
          properties:
            capabilities:
              maxItems: 0
        then:
          required:
          - professional_functions
required:
- version
- units
additionalProperties: false
