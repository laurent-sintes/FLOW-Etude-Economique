type: object
additionalProperties: false
required:
- version
- maintenance
properties:
  version:
    const: 1
  maintenance:
    type: object
    additionalProperties: false
    required:
    - justification
    - par_stack
    properties:
      justification:
        type: string
        minLength: 1
      par_stack:
        type: object
        propertyNames:
          enum:
          - java-spring
          - dotnet
          - rust
          - microsoft
          - sap
        minProperties: 5
        maxProperties: 5
        additionalProperties:
          type: object
          additionalProperties: false
          required:
          - correction_core
          - qualification_release
          - evolution_core
          - correction_extension
          - qualification_client
          - entretien_complements_buy_jh
          - justification
          properties:
            correction_core:
              type: number
              minimum: 0
            qualification_release:
              type: number
              minimum: 0
            evolution_core:
              type: number
              minimum: 0
            correction_extension:
              type: number
              minimum: 0
            qualification_client:
              type: number
              minimum: 0
            entretien_complements_buy_jh:
              type: number
              minimum: 0
            justification:
              type: string
              minLength: 1
