couvertures:
  java-spring_application:
    composants:
    - spring
    - postgresql
    - camel
    sources:
    - SPRING
    - PG
    - STACK_CAMEL
    apport: API, transactions, accès aux données et échanges techniques disponibles.
    limites: Les règles, invariants, projections et contrats de la chaîne logistique restent à réaliser. Aucun métier prêt à utiliser
      ni prime de langage automatique.
  dotnet_application:
    composants:
    - dotnet
    - postgresql
    - rebus
    sources:
    - ASPNET
    - PG
    - STACK_REBUS
    apport: API, transactions, accès aux données et échanges techniques disponibles.
    limites: Les règles, invariants, projections et contrats de la chaîne logistique restent à réaliser. Aucun métier prêt à utiliser
      ni prime de langage automatique.
  rust_application:
    composants:
    - axum
    - sqlx
    - postgresql
    sources:
    - AXUM
    - PG
    apport: API, transactions, accès aux données et échanges techniques disponibles.
    limites: Les règles, invariants, projections et contrats de la chaîne logistique restent à réaliser. Aucun métier prêt à utiliser
      ni prime de langage automatique.
  java-spring_decision:
    composants:
    - drools
    - timefold
    - spring
    sources:
    - DROOLS
    - TIMEFOLD
    apport: Tables/règles, recherche sous contraintes et calcul du score réutilisables.
    limites: Le modèle Supply, les objectifs, les explications et la qualité de décision restent à construire ;
      Community sans fonctions commerciales présumées.
  dotnet_decision:
    composants:
    - nrules
    - ortools
    - dotnet
    sources:
    - NRULES
    - ORTOOLS
    - ROUTING
    apport: Règles NRules et noyaux CP/routage OR-Tools via API C# disponibles.
    limites: OR-Tools exécute du C++ ; les objectifs métier, données et validation ne sont pas fournis. Pas de parité
      BRMS supposée.
  rust_decision:
    composants:
    - zen
    - pumpkin
    - axum
    sources:
    - ZEN
    - PUMPKIN
    apport: Tables de décision ZEN et noyau CP Pumpkin candidats.
    limites: Pas de Rete stateful ou routage industriel équivalent établi. Heuristiques et garanties de production
      à réaliser/qualifier en Rust ; aucune dépendance Java implicite.
  java-spring_process:
    composants:
    - flowable
    - spring
    - postgresql
    sources:
    - FLOWABLE
    apport: Primitives de cas, événements, tâches et exécution durable Flowable OSS disponibles.
    limites: Contrats métier, politiques de version, interventions et React restent à réaliser ; Work/Design commerciaux
      non crédités.
  dotnet_process:
    composants:
    - elsa
    - dotnet
    - postgresql
    sources:
    - ELSA_PERSIST
    - ELSA_TASKS
    apport: Définitions, persistance, bookmarks et reprise Elsa, tâches humaines utilisables.
    limites: Sémantique adaptative de la chaîne logistique et migrations à qualifier. La persistance ne démontre pas un CMMN complet.
  rust_process:
    composants:
    - apalis
    - axum
    - postgresql
    sources:
    - APALIS
    - PG
    apport: Jobs, stockage et reprises techniques disponibles.
    limites: État du dossier, attentes, sentries, interventions et coordination métier à réaliser ; un job ne constitue
      pas un moteur de cas.
  ms_reference:
    composants:
    - d365-scm
    - k3-fashion
    sources:
    - MS_DATA
    - MS_VENDOR
    apport: Entités, produits/variantes et contrôles fournisseur candidats à la projection Supply.
    limites: Étendue de chaque entité, prestataire et accord à confirmer avec les questionnaires ; pas de nouveau
      MDM supposé.
  ms_stock:
    composants:
    - d365-scm
    sources:
    - MS_STOCK
    - MS_IV
    - MS_CONSIGN
    apport: Transactions, journaux, stocks, inventaires et consignation ; Inventory Visibility fournit des projections.
    limites: Vérifier licences/entités, temporalité et corrections externes ; ne pas attribuer un registre universel
      sans démonstration.
  ms_order:
    composants:
    - d365-scm
    - d365-commerce
    - k3-fashion
    sources:
    - MS_ORDERS
    - MS_CONSIGN
    apport: Vente, achat, retour, transfert et consignation fournissent des cycles standard candidats.
    limites: Filiations et variantes intercompany/consignation à qualifier ; les noms proches ne prouvent pas tous
      les résultats de la capacité.
  ms_plan:
    composants:
    - d365-scm
    sources:
    - MS_PLAN
    - MS_FORECAST
    - MS_ATP
    - MS_CAP
    apport: Besoins nets, réduction des prévisions, ATP et CTP disponibles selon moteur de planification.
    limites: CTP varie selon moteur ; optimisation des protections et valeur économique PTP non créditées sans scénarios
      probants.
  ms_transport:
    composants:
    - d365-scm
    sources:
    - MS_TRANSPORT
    apport: Chargements, tournées et sélection transport dans Transportation Management.
    limites: Capacité générique prestataire et optimisation de toutes les prestations ne sont pas démontrées par
      le TMS.
  ms_process:
    composants:
    - d365-scm
    - power-platform
    sources:
    - MS_WORKFLOW
    - MS_CASE
    apport: Workflows, tâches et dossiers standards fournissent une base de coordination.
    limites: Parcours Supply adaptatifs interapplications, interventions, ledger et mining restent à qualifier ;
      licences Power Platform additionnelles non présumées incluses.
  sap_reference:
    composants:
    - s4-fashion
    sources:
    - SAP_DATA
    - SAP_VENDOR
    - SAP_API
    apport: Articles, partenaires, contrôles fournisseur et API de S/4 fournissent les références candidates.
    limites: Droits, entités et projections locales à vérifier ; pas de nouveau référentiel maître FLOW.
  sap_stock:
    composants:
    - s4-fashion
    - omsa
    sources:
    - SAP_STOCK
    - SAP_COUNT
    - SAP_CONSIGN
    - SAP_OMSA
    apport: Stock, inventaire, consignation et disponibilité/réservations par les composants du panier.
    limites: Stocks magasin et temporalité à clarifier ; OMSA ne démontre ni OMS complet ni tous les invariants
      de propriété.
  sap_order:
    composants:
    - s4-fashion
    sources:
    - SAP_FASHION
    - SAP_TRANSFER
    - SAP_CONSIGN
    apport: Cycles Fashion de commande, transfert, retours et consignation.
    limites: Le périmètre complet des variantes et leurs liens aux exécutants doit être confirmé ; pas de ventilation
      du prix source.
  sap_plan:
    composants:
    - s4-fashion
    - ibp
    - omsa
    sources:
    - SAP_ARUN
    - SAP_ATP
    - SAP_IBP
    - SAP_IBP_LIC
    apport: Allocation Fashion, disponibilité et capacités de planification IBP candidates.
    limites: Édition, licences IBP et profondeur CTP/optimisation à confirmer ; aucune licence supplémentaire gratuite
      présumée.
  sap_process:
    composants:
    - s4-fashion
    - btp
    - abap-fiori
    sources:
    - SAP_WORKFLOW
    - SAP_CASE_S4
    - SAP_SBC
    apport: Workflow, tâches et extensibilité ABAP/Fiori fournissent les primitives de coordination.
    limites: Parcours adaptatifs de la chaîne logistique, interventions et garanties de reprise non démontrés par le seul panier. BTP
      ne prouve pas un moteur métier livré.
  sap_transport:
    composants:
    - s4-fashion
    - osta
    sources:
    - SAP_API
    - SAP_PRIVATE
    apport: Commandes et événements de transport peuvent être raccordés au paysage retenu.
    limites: OSTA est un service de suivi, pas une preuve de moteur de planification de transport ; TM complet non
      crédité au prix sans pièce.
  ms_dom:
    composants:
    - d365-commerce
    - d365-scm
    sources:
    - MS_ORDERS
    - MS_IV
    - MS_DOM
    apport: Commerce DOM fournit une affectation distribuée des commandes. Dynamics 365 Supply Chain Management
      (gestion de la chaîne logistique) et Inventory Visibility apportent commandes et disponibilité.
    limites: Crédit documentaire confirmé par la documentation DOM citée dans la revue du 25 octobre. Priorités,
      protections, accords et contraintes du scénario FLOW nécessitent une démonstration ; extension conditionnelle,
      pas moteur complet à reconstruire.
