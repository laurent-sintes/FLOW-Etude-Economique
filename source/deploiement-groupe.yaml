version: 1
date: '2026-10-27'
statut: reference_active_hypotheses_opportunite
objet: Enveloppe externe de passage au Groupe après livraison du Flow Core System, hors build déjà financé.
prix: Prix de travail constants du modèle, sans indexation ni gains de productivité. Pas un devis commercial ni
  des euros 2026 normalisés.
perimetre:
  domaine: supply-chain-orchestration
  poles_candidats:
  - Boardriders
  - Vibs
  - Premium
  - La Halle
  precision: Quatre unités de travail proposées, pas une identité prouvée entre pôle, pays et unité Avanade. Regroupement
    des huit instances à organiser. Sarenza non ajouté ; aucune fonction métier nouvelle.
  repartition_usagers_par_unite:
  - 0.25
  - 0.25
  - 0.25
  - 0.25
  precision_usagers: Hypothèse symétrique pour calculer la montée du support, pas effectifs réels des pôles.
  recette: Un socle de recette intégrée commun et quatre acceptations locales. Les 43 situations servent aux critères,
    pas à multiplier les forfaits.
  migration: 280 JH conservés, dix applications externes et huit instances à rapprocher. Deux répétitions complètes
    par unité supposées dans cette provision ; pas deux fois 280 JH.
  formation: Formation des relais et transfert applicatif ; temps métier et transformation organisationnelle exclus
    comme dans la référence.
