  - INT-013
  accompagnement_retire: true
  preparation_retiree: true
  justification: Les paquets Groupe remplacent toute la formation, l'accompagnement, la bascule et leur coordination
    technique précédemment chiffrés. La consommation technique sur la durée remplace les 60 k€ de préparation ;
    elle ne s'y ajoute pas.
  activites_conservees:
  - INT-001
  - INT-002
  - INT-003
  - INT-004
  - INT-005
  - INT-006
  - INT-007
  - INT-008
  - INT-009
  - INT-010
  - INT-011
deploiement:
  roles_pct:
    developpement: 15
    integration: 45
    support_n3: 30
    support_n1: 10
  origine_roles: Mix INT-013 repris comme hypothèse pour le paquet local entier, non publié par Avanade.
  coordination_technique_pct: 10
  convention: Les JH de paquet sont traités ici comme réalisation hors coordination technique. Le 10 % explicite
    couvre les leads techniques ; il ne prétend pas décrire la composition du prix Avanade.
  contenu: Préparer les relais et aides communs une fois, les adapter localement, rejouer la recette d'acceptation,
    former, exécuter la bascule et stabiliser chaque unité pendant deux mois jusqu'à son acceptation.
  exclusions: Pas de seconde conception des règles, écrans, extensions, interfaces, mappings ou scripts ; pas de
    seconde répétition de migration déjà en INT-007 ; pas de seconde recette transverse INT-010. Pas de correction
    du produit générique.
  limite: Les abaques 200/400 JH portent sur des paquets Avanade plus larges. Leur utilisation pour cette capacité
    de déploiement Make est une hypothèse prudente de contenu, pas une transposition validée ni un plafond prouvé.
  cartographie:
  - D01.f
  - D01.g
  - D04.i
  - D04.k
  - D06.d
  - human-task-management
  - BHV082
pilotage:
  jours_par_etp_mois: 18
  tarif_direction_eur_jh: 1000
  tarif_coordination_eur_jh: 850
  statut_tarifs: Provisions proposées, non cotations de marché ni tarifs eXalt. Pas d'outillage ou de marge ajoutés
    à ces prix.
  justification: Directeur responsable du budget, des risques, fournisseurs et arbitrages ; coordination fonctionnelle/PMO
    responsable des dépendances entre pôles, de la préparation des décisions et des acceptations. Leur charge suit
    la durée, pas un pourcentage du prix SAP.
  distinct_de: Les leads techniques restent dans 10 % des travaux et 8 % du service. Les rôles de programme ne réalisent
    ni le code, ni les recettes techniques, ni les décisions métier internes.
  preuve_limite: Le COPIL exige une équipe métier dédiée, sans dimensionner le pilotage Make. Les 2371 JH de gouvernance/coordination
    SAP sont un contrôle d'ordre de grandeur, pas la charge à copier.
core:
  activite: MAI-003
  debut_mois: 0
  hypothese_contractuelle: Après réception du build, capacité de correctifs génériques et production/qualification
    des releases achetée séparément sur toute l'intégration ; elle n'est pas réputée fournie gratuitement par la
    garantie.
  pas_de_double_compte: Les corrections de conformité qui restent dues par le fournisseur du build sont imputées
    à sa garantie, pas facturées à ce service. La capacité budgétée couvre les besoins hors garantie et les releases
    ; sa quantité complète est une provision, pas une charge constatée.
  evolutions: Aucune évolution fonctionnelle générique MAI-009 commandée dans le central. En option distincte seulement
    ; le périmètre du Core est supposé complet à la réception.
  services_client: MAI-006 finance qualification et déploiement client des mises à jour ultérieures, distincts de
    leur production dans MAI-003 et de la réception initiale déjà financée dans INT-010.
  taux_pilotage_ref: source/calibration-couts.yaml#pilotage/maintenance_pct
transition:
  nature_cout_ref: mco_run
  stabilisation_mois: 2
  infrastructure_annuelle_refs:
  - cloud_make_annuel
  - ipaas_make_microsoft_annuel
  - outillage_support_annuel
  infrastructure_debut_mois: 0
  infrastructure_fin: Fin de la dernière stabilisation ; pleine provision technique dès le début, sans économie
    de montée en charge supposée.
  justification_infrastructure: Les enveloppes actives 72/36/24 k€ par an remplacent la préparation de 60 k€. Pas
    de quatrième environnement ni de seconde plateforme par pôle.
  services_partages:
  - MAI-005
  - MAI-006
  - MAI-007
  - MAI-008
  debut_services_partages: Première ouverture en production ; une seule fois pour le Groupe, sans prorata d'utilisateurs.
  services_variables:
  - MAI-001
  - MAI-002
  - MAI-004
  debut_services_variables: Fin des deux mois de stabilisation de chaque unité ; prorata des utilisateurs supposés
    pour support et des périmètres stabilisés pour corrections d'extensions.
  limite_variables: Les proportions égales et la linéarité des seuls services variables sont des hypothèses. Les
    prestations fixes ne sont pas divisées par quatre.
  pas_de_double_compte: Pendant les deux mois de stabilisation locale, assistance et corrections de démarrage sont
    dans les paquets. Après, elles passent aux services variables. Les services partagés portent la plateforme et
    les contrats déjà acceptés, pas les nouveaux flux encore livrés par l'intégration.
  evolutions_client: MAI-009 absent ; pas de changement fonctionnel commandé pendant la trajectoire. Les défauts
    et l'entretien contractuel restent financés.
  fin: Fin de la stabilisation Groupe ; passage au service annuel complet sans recouvrement.
