justifications_centrales:
  interfaces: Les 40 interfaces du pilote Avanade servent de point de comparaison ; retenir 40 contrats pour FLOW
    remplace l'hypothèse 30, sans prétendre que les inventaires sont identiques ou exhaustifs. MAP/CBS à inventorier.
  calendrier: Travaux communs préparés jusqu’à la première ouverture, puis quatre unités aux mois 16, 20, 24 et
    28. Deux mois fixes de stabilisation par unité ; réception Groupe au mois 30. Hypothèse autonome conditionnée
    par les capacités et décisions métier, sans dépendance aux durées Buy.
  programme: Les capacités mensuelles de direction et de coordination sont converties en JH sur la durée centrale selon la convention du modèle. Capacité
    externe proposée ; disponibilité des responsables internes en plus, hors budget externe.
  core: 12 corrections et 4 releases par an repris des volumes de service actifs, sans gain IA. Application pendant
    l'intégration = nouvelle convention contractuelle proposée, pas obligation prouvée.
  achats: Prix constants pour toutes les rubriques, cohérents entre eux ; l'indexation du futur calendrier doit
    être appliquée à toute l'enveloppe si elle est retenue, pas uniquement au Core.
