      à regrouper.
    vagues:
    - unite: complexe_1
      jh: 400
      preparation_et_stabilisation:
      - 10
      - 18
      ouverture: 16
      reception: 18
    - unite: complexe_2
      jh: 400
      preparation_et_stabilisation:
      - 14
      - 22
      ouverture: 20
      reception: 22
    - unite: standard_1
      jh: 200
      preparation_et_stabilisation:
      - 20
      - 26
      ouverture: 24
      reception: 26
    - unite: standard_2
      jh: 200
      preparation_et_stabilisation:
      - 24
      - 30
      ouverture: 28
      reception: 30
    non_double_compte: Les 1200 JH remplacent INT-012/013 ; pas de seconde conception, interface, migration transverse
      ni recette commune.
    metier: source/deploiement-groupe.yaml#deploiement/cartographie
  capacite:
    jours_productifs_etp_mois: 18
    origine_productivite: Convention active du pilotage étendue ici aux capacités de réalisation ; hypothèse explicite,
      sans prix nouveau.
    commun_moyen_sur_16_mois: Environ 6,7 ETP Java/.NET et 7,1 ETP Rust ; ce sont des moyennes de charge, pas des
      équipes constantes.
    pic_java: Environ 11 ETP de réalisation sur les fenêtres proposées, hors pilotage et service Core ; à confirmer
      par profil et disponibilité.
    deploiement_complexe: Environ 2,8 ETP sur huit mois par unité complexe, avec deux vagues chevauchées ; les standard
      mobilisent environ 1,9 ETP sur six mois.
    pilotage: Maintenir 0,5 ETP de direction et 1 ETP de coordination pendant 30 mois, aux tarifs actuels. Coordination
      technique déjà financée séparément.
    limite: Ne pas transformer les moyennes en effectifs permanents facturés ; prix des travaux et budgets de coordination
      inchangés.
  conditions:
  - Core générique réceptionné et exploitable ; aucun rattrapage fonctionnel majeur imputé à l'intégration.
  - Référents métier disponibles pour arbitrer et valider ; disponibilité interne hors dépenses chiffrées.
  - Inventaire des 40 interfaces confirmé, notamment MAP/CBS ; accès aux SI et environnements tiers disponibles.
  - Qualité des données et répétitions compatibles avec la provision de 280 JH ; les reprises tardives majeures
    invalident le planning.
  - Disponibilité des profils techniques pendant les chevauchements ; les JH seuls ne démontrent pas le délai.
  - Fenêtres commerciales et saisons retail compatibles avec les ouvertures ; aucun calendrier réel n'est encore
    confirmé.
  - Recette commune prête à M16 et acceptations locales explicites ; pas de généralisation automatique d'un pilote
    non stabilisé.
  statut: hypothese_opportunite_validee_2026_10_27
  sensibilite_duree_seule: 36 mois avec ouvertures 20/25/30/34 et stabilisation fixe de deux mois ; mêmes travaux
    et staffing. Distinct du scénario renforcé qui change les volumes.
