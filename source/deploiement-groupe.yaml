    - titre: Recette transverse et préparation du service
      activites:
      - INT-010
      - INT-011
      jh_java: 350
      fenetre_mois:
      - 10
      - 16
      rattachement: source/parcours-integration.yaml#lots/recette
      sortie: Situations métier qualifiées de bout en bout, performance et exploitabilité acceptées ; premières
        recettes partielles avant complétude des flux.
