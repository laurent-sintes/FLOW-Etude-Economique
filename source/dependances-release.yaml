version: 1
id: initial-core-release-dependencies
phase_ref: acquisition
release_definition: Première release majeure complète. Les évolutions de MCO ne changent pas son périmètre.
progress_definition: Le pourcentage porte sur les livrables achevés du périmètre initial de l’équipe, pas sur les
  JH consommés. Le seuil exige aussi le livrable indiqué.
labels:
  intro: Première release majeure complète. Les évolutions de MCO ne changent pas son périmètre.
  start: Démarrage
  production: Mise en production
  table: Contraintes
  supplier: Équipe fournisseuse
  consumer: Équipe dépendante
  threshold: Seuil fournisseur
  prerequisite: Livrable attendu
  work: Travaux concernés
  basis: Justification
  evidence: Sources
  hypothesis: Hypothèse de séquencement
  release: Release initiale
  charge: Charge de construction
  reset: Recentrer
  instruction: Sélectionner une équipe pour mettre en évidence ses dépendances. Cliquer sur une flèche pour lire
    sa condition.
  details: Détail de la contrainte
  progress: Le pourcentage porte sur les livrables achevés du périmètre initial de l’équipe, pas sur les JH consommés.
    Le seuil exige aussi le livrable indiqué.
  production_note: À 100 %, la release majeure initiale du fournisseur est complète, qualifiée et disponible en
    production. Les prérequis entrants se cumulent.
  start_note: Le seuil débloque les travaux indiqués. L’analyse métier et la conception indépendante peuvent commencer
    auparavant.
  no_schedule: Les contraintes ne calculent pas encore de durée. Le dimensionnement des équipes et les durées incompressibles
    restent à définir.
  excluded: Intégration accompagne les équipes. Elle ne porte pas de release produit bloquante. L’intégration Beaumanoir
    et le MCO sont hors de cette cartographie.
  selected: Sélectionner une contrainte
  percent: '%'
  scope: Périmètre initial
  phase: Construction du Core System
  clear: Toutes les dépendances
releases:
- id: case-management-r1
  team_ref: case-management
  scope: Moteurs de processus, tâches, règles, analytics et process mining.
- id: paas-r1
  team_ref: paas
  scope: Outillage, environnements, CI/CD, tests automatisés et moyens de livraison de la première release.
- id: master-plan-supply-policy-r1
  team_ref: master-plan-supply-policy
  scope: Planification, politiques Supply et décisions attribuées à l’équipe.
- id: inventory-availability-r1
  team_ref: inventory-availability
  scope: Stock, propriété, réservations et fonctions de disponibilité attribuées à l’équipe.
- id: services-r1
  team_ref: services
  scope: Gestion des prestations, orchestration, offres de capacité et fonctions attribuées à l’équipe.
- id: mdm-platform-r1
  team_ref: mdm-platform
  scope: Moteur MDM, interfaces génériques, studio, plugins et qualification technique.
- id: master-data-r1
  team_ref: master-data
  scope: Familles de références, règles métier, qualification inter-familles et vues opérationnelles.
- id: sourcing-procurement-r1
  team_ref: sourcing-procurement
  scope: Socle partagé des commandes typées et parcours achat.
- id: b2c-r1
  team_ref: b2c
  scope: Comportements et parcours de commande B2C.
- id: wholesale-r1
  team_ref: wholesale
  scope: Comportements et engagements de commande Wholesale.
- id: portal-r1
  team_ref: portal
  scope: Accès à la plateforme, XP APIs, sécurité applicative, portail et expériences transverses.
constraints:
- id: paas--case-management--start
  provider_release_ref: paas-r1
  consumer_release_ref: case-management-r1
  gate: start
  threshold_pct: 20
  prerequisite: Dépôt, environnement de développement et de test, pipeline minimal, publication des artefacts et
    conventions de configuration utilisables.
  work_scope: Développement exécutable, tests et livraison des composants de Case Management.
  justification: Les composants consomment les moyens de développement et de livraison de PaaS. Le seuil de 20 %
    représente ce socle minimal, pas l’achèvement de tout l’outillage. Le seuil est une hypothèse de contract first,
    conditionnée aux livrables décrits.
  assessment: sequencing_assumption
  evidence_refs:
  - source/organisation-delivery.yaml
  - source/fonctions-produit-core.yaml
  - audits/2026-11-06-premiere-cartographie-dependances.md
- id: paas--case-management--production
  provider_release_ref: paas-r1
  consumer_release_ref: case-management-r1
  gate: production
  threshold_pct: 100
  prerequisite: Release initiale complète du fournisseur, qualifiée et disponible en production. Dépôt, environnement
    de développement et de test, pipeline minimal, publication des artefacts et conventions de configuration utilisables.
  work_scope: Développement exécutable, tests et livraison des composants de Case Management.
  justification: Les composants consomment les moyens de développement et de livraison de PaaS. Le seuil de 20 %
    représente ce socle minimal, pas l’achèvement de tout l’outillage.La première cartographie retient la disponibilité
    de toute la release fournisseur, plutôt qu’une livraison partielle.
