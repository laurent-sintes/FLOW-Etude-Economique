type: object
additionalProperties: false
properties:
  version:
    const: 1
  id:
    const: study-downloads
  reading:
    type: object
    additionalProperties: false
    properties:
      model_title: &id001
        type: string
        minLength: 1
      model_description: *id001
      model_limit: *id001
      download: *id001
      model_action: *id001
      originals_title: *id001
      originals_intro: *id001
      documents_title: *id001
      documents_intro: *id001
      personal_title: *id001
      personal_description: *id001
      personal_action: *id001
      personal_empty: *id001
      personal_format: *id001
      origin_original: *id001
      origin_document: *id001
      model_format: *id001
      version_label: *id001
      hash_label: *id001
      size_label: *id001
      size_unit: *id001
      date_label: *id001
      date_unknown: *id001
      metadata_unavailable: *id001
      retry: *id001
      details: *id001
    required:
    - model_title
    - model_description
    - model_limit
    - download
    - model_action
    - originals_title
    - originals_intro
    - documents_title
    - documents_intro
    - personal_title
    - personal_description
    - personal_action
    - personal_empty
    - personal_format
    - origin_original
    - origin_document
    - model_format
    - version_label
    - hash_label
    - size_label
    - size_unit
    - date_label
    - date_unknown
    - metadata_unavailable
    - retry
    - details
  model_package:
    type: object
    additionalProperties: false
    properties:
      asset: *id001
      metadata_asset: *id001
      filename: *id001
    required:
    - asset
    - metadata_asset
    - filename
  reading_document_refs:
    type: array
    uniqueItems: true
    items: *id001
  personal_route:
    const: '#comparer'
required:
- version
- id
- reading
- model_package
- reading_document_refs
- personal_route
