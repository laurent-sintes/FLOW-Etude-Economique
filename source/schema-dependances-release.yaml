type: object
additionalProperties: false
properties:
  version:
    const: 1
  id:
    const: initial-core-release-dependencies
  phase_ref:
    const: acquisition
  release_definition: &id001
    type: string
    minLength: 1
  progress_definition: *id001
  labels:
    type: object
    additionalProperties: *id001
  releases:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        team_ref: *id001
        scope: *id001
      required:
      - id
      - team_ref
      - scope
    minItems: 1
  constraints:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        provider_release_ref: *id001
        consumer_release_ref: *id001
        gate:
          enum:
          - start
          - production
        threshold_pct:
          type: integer
          minimum: 1
          maximum: 100
        prerequisite: *id001
        work_scope: *id001
        justification: *id001
        assessment:
          const: sequencing_assumption
        evidence_refs:
          type: array
          items: *id001
          minItems: 1
      required:
      - id
      - provider_release_ref
      - consumer_release_ref
      - gate
      - threshold_pct
      - prerequisite
      - work_scope
      - justification
      - assessment
      - evidence_refs
    minItems: 1
  excluded_team_refs:
    type: array
    items: *id001
    minItems: 1
required:
- version
- id
- phase_ref
- release_definition
- progress_definition
- labels
- releases
- constraints
- excluded_team_refs
$schema: https://json-schema.org/draft/2020-12/schema
