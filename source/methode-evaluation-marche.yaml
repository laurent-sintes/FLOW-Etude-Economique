schema_version: 1
id: market-evaluation-opportunity
principle:
  title: Des références de marché pour étayer les hypothèses
  text: >-
    **Une référence ne peut étayer une estimation que si sa portée et son usage sont justifiés.**
    L’étude examine fonctions, travaux et prix documentés pour construire la
    {{notion.core_system}}, l’intégrer chez Beaumanoir et la faire fonctionner.
    Chaque appui est rapproché du besoin avant d’être utilisé.
notice:
  title: Des entrants à transformer en appuis comparables
  text: >-
    **Synvance apporte les offres, questionnaires, prix et trajectoires reçus.**
    La cartographie fournit les capacités et frontières métier auxquelles les confronter.
    Documentation produit, code, cas de déploiement et données de service complètent
    ces entrants. La méthode sépare leur contenu observé des hypothèses proposées pour FLOW.
navigation_label: 'Les six étapes · {{vue.evaluation_marche}}'
sections:
  - id: separer-assiettes
    title: Définir la comparaison
    lead: >-
      **Une référence est utile si elle répond à une question précise.**
      Séparer construction, intégration et fonctionnement évite de leur appliquer
      indistinctement un budget de programme.
    blocks:
      - kind: table
        caption: Trois volets de recherche
        columns: [Objet, Ce que l’on cherche à comparer]
        rows:
          - ['{{notion.build_core_system}}', 'Les fonctions à réaliser, les composants réutilisables et les efforts de développement comparables.']
          - ['{{notion.integration_deploiement_initiaux}}', 'Les prestations, livrables, responsabilités et conditions de déploiement dans le Groupe.']
          - ['{{notion.mco_run}}', 'Les consommations, droits, maintenance et engagements de service à financer dans la durée.']
      - kind: paragraphs
        items:
          - >-
            La cartographie fixe le **périmètre commun**. Chaque référence précise
            capacités, entités réellement équipées, usage attesté et exclusions.
            La taille du groupe client ne donne pas la taille du déploiement.
          - >-
            Ces volets ne sont pas les tags **{{notion.build}} / {{notion.run_activities}}** :
            le fonctionnement comprend le MCO du produit générique, classé Build,
            et celui des adaptations, réparti selon la clé du modèle.
          - >-
            **Résultat : une question bornée**, reliée au besoin métier et à la dépense étudiée.
  - id: qualifier-preuves
    title: Analyser la preuve
    lead: >-
      **La nature de la source délimite ce qu’elle peut démontrer.**
      Distinguer annonce, usage, prix et effort observé évite de leur attribuer
      la même valeur de preuve.
    blocks:
      - kind: bullets
        items:
          - '**Documentation, code versionné ou démonstration** : fonctions, édition et comportement observables. Une annonce ne prouve ni l’usage en production ni la couverture de FLOW.'
          - '**Contrat, proposition ou bordereau** : prix, prestations, inclusions et engagements, sans mesure du travail réellement consommé.'
          - '**Bilan de projet ou relevé d’activité** : livrables, heures, rôles et circonstances. Un budget annoncé n’est pas la dépense finale.'
          - '**Tarif ou mesure d’usage** : unité, seuils et consommation. Distinguer prix catalogue et négocié, quantité souscrite et usage constaté.'
      - kind: paragraphs
        items:
          - >-
            Conserver la source primaire, **auteur, pièce, dates, version et périmètre** ;
            pour un prix, devise, taxes, période et conditions commerciales.
            Séparer **fait observé, analogie et hypothèse**.
          - >-
            **Inconnu, inclus, sans objet et zéro ont des sens distincts.**
            Inclus renvoie à un financement identifié ailleurs. Une information
            manquante ne prouve ni une absence produit ni un coût nul.
          - >-
            **Résultat : une preuve traçable**, avec sa portée et les informations manquantes.
  - id: build-fonctions-ecosystemes
    title: 'Construction : rapprocher fonctions et effort'
    lead: >-
      **Un produit comparable éclaire les travaux ; un composant réutilisable peut
      en éviter.** Une ressemblance fonctionnelle ne démontre pas une économie de charge.
    blocks:
      - kind: bullets
        items:
          - '**Relier capacités et fonctions** : identifiants métier, module, édition, preuve et écarts. Rapprocher les fonctions communes aux produits sans les additionner.'
          - '**Vérifier les éléments réutilisables** : licence, compatibilité, interfaces, maintenance et raccordements. Chaque mécanisme partagé conserve un propriétaire de financement.'
          - '**Analyser les références d’effort** : travaux livrés, heures de développeurs, composants disponibles et activités incluses. Les tests développeur font partie de la réalisation ; qualification logicielle indépendante, architecture transverse et pilotage sont isolés des JH développeur.'
          - '**Borner les inventaires de code** : commits, règles de comptage, exclusions et sélection utile. Les lignes physiques ne sont ni des points de fonction ni des JH observés.'
      - kind: paragraphs
        items:
          - >-
            Si un inventaire est utilisé pour un **diagnostic nominal simplifié inspiré de COCOMO II**,
            déclarer la sélection, les conventions et les facteurs non évalués.
            La règle de calcul par composant s’écrit :
      - kind: formula
        text: JH nominaux = arrondi [somme par composant (a × (PNCLOC / 1 000)^E × heures par mois-personne / heures par JH)]
      - kind: paragraphs
        items:
          - >-
            PNCLOC désigne les lignes physiques de code hors commentaires et lignes vides.
            Exposer a, E, les conventions horaires et les multiplicateurs d’effort fixés
            au nominal. **Employer ce volume comme approximation de taille ne mesure ni
            l’effort historique ni une charge calibrée pour FLOW.** Une transposition exige
            de justifier les différences de travaux et de contexte. Un abaque par point
            de fonction exige aussi un comptage indépendant et des activités comparables.
          - >-
            **Résultat : des fonctions rattachées au besoin et des références d’effort analysées.**
            Sans effort observé comparable, l’estimation reste une hypothèse d’ingénierie explicite.
  - id: integration-transposition
    title: 'Intégration : comparer travaux et prix'
    lead: >-
      **Comparer les prix exige d’abord de comparer ce qui est livré.**
      Une monnaie commune ne rend pas les périmètres ni les responsabilités équivalents.
    blocks:
      - kind: paragraphs
        items:
          - >-
            Décrire **configuration, extensions, interfaces, données, qualification logicielle,
            bascule et stabilisation**, avec les responsabilités du prestataire, de l’éditeur
            et du client. Distinguer travaux communs et répétés par entité, en tenant compte
            des pays, de la qualité des données et de la coexistence des systèmes.
          - >-
            Isoler les **prestations externes comparables** des licences, cloud, matériel,
            charges internes et transformation organisationnelle. Si la source ne le permet
            pas, le budget global reste un repère de contexte. Un pilote ne décrit que ses travaux.
      - kind: table
        caption: Trois valeurs à conserver séparément
        columns: [Valeur, Ce qu’elle établit]
        rows:
          - [Prix d’origine, 'Montant publié ou proposé, avec devise, date, périmètre, inclusions et statut.']
          - [Prix normalisé, 'Montant converti et actualisé à une date commune, au périmètre de la source.']
          - [Estimation transposée, 'Retraitement justifié des livrables, volumes et responsabilités vers le contexte Beaumanoir.']
      - kind: formula
        text: Montant normalisé (€) = montant d’origine × (indice cible / indice de départ) / taux de change (devise d’origine par euro)
      - kind: paragraphs
        items:
          - >-
            Le registre normalise **chaque borne d’une fourchette** vers son année
            de référence. Le taux, exprimé en devise par euro, est un diviseur ;
            il vaut 1 pour l’euro. Le rapport d’indices vaut 1 sans changement d’année
            de valeur. L’affichage en k€ divise ensuite par 1 000.
          - >-
            Conserver dates de change et indices. Un indice général est une convention
            monétaire, pas une mesure des tarifs d’intégrateur. **Cette actualisation
            documentaire est distincte de l’indexation future du budget.**
      - kind: bullets
        items:
          - '**La transposition exige des écarts justifiés** : ajouts, retraits et changements de volume ou de responsabilité. Sans eux, l’estimation cible reste inconnue ; aucun coefficient automatique ne la remplace.'
          - '**Un forfait opaque ne devient pas une charge observée en le divisant par un tarif journalier.** Lorsqu’il finance les travaux retenus, il remplace leur valorisation et ne s’y ajoute pas.'
      - kind: paragraphs
        items:
          - >-
            **Résultat : un prix dont le périmètre et les retraitements restent identifiables.**
  - id: fonctionnement-contrats-sequences
    title: 'Fonctionnement : comparer services et contrats'
    lead: >-
      **Un prix annuel n’a de sens qu’avec un service, un volume et une période.**
      Ces trois dimensions rendent les dépenses comparables sans les compter deux fois.
    blocks:
      - kind: bullets
        items:
          - '**Moyens et unités** : infrastructure, stockage, échanges, licences et abonnements. Relier volumes métier, unités facturées, seuils et minimums ; une transaction métier n’équivaut pas toujours à une action fournisseur.'
          - '**Travaux annuels** : maintenance du produit, adaptations, corrections et évolutions. Conserver activités, fréquences et JH, sans multiplier à nouveau par les volumes déjà inclus.'
          - '**Niveau de service** : horaires, prise en charge, rétablissement, disponibilité, astreinte et restauration. Séparer support éditeur, assistance utilisateur et maintenance des spécifiques, avec leurs responsables.'
          - '**Contrat et séquence** : validité du prix, engagement, remises, paliers, indexation et renouvellement. Gratuité initiale, service ponctuel et abonnement récurrent restent distincts.'
      - kind: paragraphs
        items:
          - >-
            **Les inclusions documentées empêchent un second financement.**
            Le poste « {{notion.grouped_buy}} » reste global si ses composantes sont inconnues.
            Un complément exige un service absent du contrat ; une licence d’outil
            ne finance pas les travaux réalisés avec cet outil.
          - >-
            Financer les moyens dès leur consommation, y compris pendant le Build,
            et le MCO de l’intégration après réception ; la stabilisation reste en intégration.
            **Transition et régime annuel se relaient sans chevauchement.** Les observations
            gardent devise et période d’origine sans normalisation documentée.
          - >-
            **Résultat : des services et contrats utilisables pour la base annuelle et son calendrier.**
            Aucun pourcentage automatique du budget de construction ne les remplace.
  - id: transmettre-references
    title: Déterminer ce que la référence permet d’estimer
    lead: >-
      **Chaque estimation reçoit les appuis utiles à son calcul.**
      Une référence seule ne crée pas de budget.
    blocks:
      - kind: table
        caption: Passage des preuves aux estimations
        columns: [Pour estimer, Ce qu’il faut transmettre]
        rows:
          - ['{{vue.methode_core_system}}', 'Correspondances fonctionnelles, composants disponibles et références d’effort avec leurs activités incluses, pour estimer les JH développeur bruts.']
          - ['{{vue.calcul_net}}', 'Charges et prestations retenues, écarts justifiés et financements identifiés, pour appliquer les gains et valoriser les travaux.']
          - ['{{vue.calcul_run}}', 'Volumes, unités, activités, tarifs et séquences contractuelles, pour calculer les services et leur calendrier.']
      - kind: paragraphs
        items:
          - >-
            Le marché conserve **constats et preuves** ; les estimations, **hypothèses et raisons**.
            Réutiliser la source sans copie concurrente. Les budgets Beaumanoir
            ne prouvent pas indépendamment leurs propres hypothèses.
          - >-
            Nommer l’information manquante et son effet possible. Une nouvelle version
            de produit ou de service fait revoir les constats concernés ; un changement
            de tarif ne déclenche pas seul une nouvelle analyse fonctionnelle.
          - >-
            **Résultat : un dossier d’appuis dont chaque usage est justifié.**
            Les analyses réalisées, leur avancement et les observations de fonctions,
            projets, prix et services sont présentés dans le dossier économique,
            séparément de cette méthode.
examples: []
