  pending: '**.NET et Rust restent à réestimer.** Le modèle conserve ces variantes et leur historique, avec leur
    statut distinct. Elles ne constituent pas deux constructions entièrement réévaluées.'
  labels:
    common: Le raisonnement de la phase
    inputs: Le point de départ
    treatment: Comment on y arrive
    output: Résultat attendu de l’évaluation
    limits: Ce qui reste à préciser
    compare: Comparer les approches
    option: Option
    next: Poursuivre la démarche
