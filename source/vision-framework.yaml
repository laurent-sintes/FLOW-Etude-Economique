    text: Préparer les références, calculer, confronter les méthodes et adopter les résultats justifiés.
    group: estimer
  - href: '#calcul-net'
    label: Valoriser les travaux
    text: Passer des activités et des JH aux budgets avec les inclusions et rôles déclarés.
    group: projeter
  - href: '#calcul-run'
    label: Dimensionner les services récurrents
    text: Relier les services, moyens, contrats et réceptions aux dépenses annuelles.
    group: projeter
  - href: '#leviers'
    label: Comprendre les variables de scénario
    text: Définir les paramètres, leurs unités et les effets de leurs variations.
    group: projeter
  - href: '#conditions-realisation'
    label: Examiner les conditions de réalisation
    text: Qualifier responsabilités, moyens et preuves avant de décider la poursuite.
