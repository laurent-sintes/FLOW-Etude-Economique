version: 1
id: framework-vision
opening:
  title: Trois phases, plusieurs options, un scénario économique
  text: '**Nous évaluons séparément l’obtention du produit, son intégration au Groupe et son fonctionnement.** Chaque
    phase distingue les raisonnements Make et Buy. Les coûts sont ensuite placés dans le temps pour comparer les
    options sur un horizon commun.'
adaptation:
  title: Des hypothèses à examiner et à tester
  text: Les choix retenus et leurs justifications sont consultables dans le dossier économique. Simuler permet de
    tester les paramètres proposés en conservant la référence commune.
  href: '#simuler'
  label: Tester une hypothèse
  reference_link:
    href: '#parametres'
    label: Lire les {{vue.parametres_modele}}
approach:
  title: Évaluer chaque phase avec les bons entrants
  steps:
  - id: besoin
    title: Délimiter le besoin
    text: La cartographie définit le besoin commun. Les produits et assemblages techniques définissent les options
      à évaluer. Synvance apporte les propositions Microsoft et SAP.
  - id: investissement
    title: Construire le scénario économique de référence
    text: Valoriser les travaux et les achats, positionner les dépenses dans le temps, puis calculer les annuités
      et les cumuls. Les équipes produits et le lotissement de réalisation seront étudiés ultérieurement.
  matrix:
    caption: Trois phases × Make / Buy
    activity_label: Phase à évaluer
    make_label: '{{notion.make}}'
    buy_label: '{{notion.buy}}'
    rows:
    - id: acquisition
      title: 1 · Obtenir le Core System
      make:
      - Estimer la construction du produit à partir des fonctions, des références logicielles et des méthodes de
        calcul.
      buy:
      - Qualifier les offres, leurs inclusions et le travail acheteur de sélection-contractualisation.
    - id: integration
      title: 2 · {{notion.integrer_deployer}}
      make:
      - Dimensionner adaptations, interfaces, migrations et déploiements à partir des travaux Groupe.
      buy:
      - Examiner les lots fournisseur et les compléments justifiés, en conservant leurs différences de périmètre.
    - id: fonctionnement
      title: 3 · Fonctionner et évoluer
      make:
      - Dimensionner les activités récurrentes, les moyens techniques et les achats nécessaires.
      buy:
      - Qualifier abonnements, services inclus et responsabilités restant à financer.
    notes:
    - '**Les phases organisent l’évaluation. Build / Run qualifie les activités financées.** Une dépense récurrente
      peut financer du Build. Certaines activités commencent avant la stabilisation complète.'
evidence:
  title: Les données d’entrée
  items:
  - id: perimetre
    title: Cartographie métier
    text: La capture reçue définit le périmètre de l’étude. La page dédiée présente sa provenance et donne accès
      à Atlas.
    href: '#cartographie'
    label: Consulter le périmètre reçu
  - id: synvance
    title: Repères Synvance
    text: Retrouver la demande, les conclusions, les comparaisons OMS et coûts, ainsi que les pièces originales.
    href: '#synvance'
    label: Consulter les Repères Synvance
confidence:
  title: Distinguer les niveaux de preuve
  text: Une méthode définie, une estimation documentée et une réalisation démontrée répondent à des questions différentes.
    Les dossiers liés présentent les preuves et leurs statuts.
  levels:
  - id: method
    title: Définir la méthode
    text: Les règles et les sources attendues sont définies.
    href: '#complexite'
    label: Lire la méthode Make
  - id: application
    title: Documenter son application
    text: Les données, hypothèses et travaux utilisés sont traçables.
    href: '#evaluation-core'
    label: Examiner les évaluations
  - id: review
    title: Relire l’évaluation
    text: La revue humaine identifie son auteur, son périmètre et ses réserves.
    href: '#evaluation-core'
    label: Vérifier la revue et ses réserves
  - id: delivery
    title: Démontrer la réalisation
    text: Équipe, essais, transfert et engagements doivent être établis pour FLOW.
    href: '#capacite-realisation'
    label: Voir l’état du dispositif FLOW
  links:
  - href: '#conditions-realisation'
    label: Comprendre les critères de réalisation
  limits_title: Lire les résultats sur leur périmètre
  limits:
  - Une estimation ne vaut ni validation métier ni engagement de livraison.
  - Les inconnues restent explicites dans les périmètres, les prix et les responsabilités.
next:
  title: Choisir la suite de la lecture
  links:
  - href: '#modele'
    label: Comprendre les fondamentaux
  - href: '#comparer'
    label: Comparer les options
  - href: '#capacite-realisation'
    label: Préparer la réalisation FLOW
