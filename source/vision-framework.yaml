  consolidation:
    title: Des références pour chaque voie
    text: '**Les quatre logiciels à code source ouvert servent de références de fonctions et de code.** Ils aident
      à estimer le produit Java/Spring à construire. Les calculs et décisions par lot se consultent dans la méthode
      Make. Microsoft et SAP sont les deux solutions d’achat confrontées au même besoin.'
