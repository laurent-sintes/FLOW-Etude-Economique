version: 1
id: framework-vision
opening:
  title: Choisir la voie de réalisation
  text: '**La décision porte sur la voie et les conditions de réalisation de la {{notion.core_system}}.** Construire
    sous maîtrise du Groupe ou acheter une solution existante, puis organiser son intégration et son fonctionnement.'
adaptation:
  title: Des hypothèses établies pour comparer
  text: Le dossier économique compare les trois options à partir des choix de référence. Les valeurs et leurs
    justifications sont consultables en lecture seule.
  href: '#comparer'
  label: Comparer les options
  reference_link:
    href: '#parametres'
    label: Lire les {{vue.parametres_modele}}
approach:
  title: Du besoin commun aux budgets comparables
  intro: '**Sept étapes de raisonnement relient les preuves à la décision.** Les étapes Obtenir, Intégrer et Faire fonctionner évaluent les trois phases du projet. L’organisation, la valorisation et le calendrier réunissent ensuite leurs résultats. Les phases peuvent se chevaucher dans le temps.'
  labels:
    inputs: Ce qu’on utilise
    treatment: Ce qu’on en fait
    output: Ce qu’on transmet à la suite
    links: Voir le détail de cette étape
  steps:
  - id: besoin
    title: Définir le besoin commun et les références
    text: Fixer ce que les trois options doivent permettre, avant de comparer leur coût.
    inputs: Cartographie reçue, scénarios métier, offres Synvance et études préalables des solutions, projets, tarifs et productivités.
    treatment: Partir des capacités métier et des résultats attendus. Distinguer le produit générique des adaptations Groupe. Qualifier la couverture des solutions et conserver les sources, leurs dates et leurs limites.
    output: Un périmètre de comparaison commun, les fonctions attendues et les écarts à instruire. Les mêmes besoins servent à évaluer Make et Buy.
    links:
    - href: '#cartographie'
      label: Retrouver le périmètre reçu
    - href: '#preetudes'
      label: Examiner les données d’entrée
  - id: acquisition
    title: Évaluer l’obtention du Core System
    text: Chiffrer la construction du produit ou préparer l’achat d’une solution existante.
    inputs: Fonctions attendues, composants et fichiers de logiciels à code source ouvert (OSS), règles de réutilisation et propositions Microsoft ou SAP.
    treatment: En Make, relier capacités, features et code OSS, comparer les méthodes d’estimation puis retenir les JH et les rôles justifiés. La table de transcription traduit les activités COCOMO en rôles. En Buy, qualifier inclusions, sélection et contractualisation.
    output: En Make, une charge de construction par lot et rôle. En Buy, le travail acheteur et les conditions d’achat. Les adaptations Groupe et le fonctionnement sont évalués séparément.
    links:
    - href: '#acquisition'
      label: Comprendre Make et Buy
    - href: '#complexite?focus=roles'
      label: Voir la transcription des activités en rôles
  - id: integration
    title: Évaluer l’intégration et les déploiements Groupe
    text: Passer du produit générique à une solution utilisable dans les systèmes et les pratiques du Groupe.
    inputs: Écarts au besoin Groupe, interfaces, données à migrer, reprises, recettes et périmètres des lots intégrateur.
    treatment: En Make, dimensionner les travaux, leurs volumes et leurs profils. En Buy, rapprocher les prestations fournisseur des mêmes travaux et identifier les compléments. Séparer pilote, généralisation, réception et stabilisation.
    output: Des charges et enveloppes d’intégration par option, avec inclusions et travaux restant à dimensionner. Les réceptions préparent le passage aux services récurrents.
    links:
    - href: '#integration'
      label: Comprendre l’évaluation de l’intégration
  - id: fonctionnement
    title: Évaluer le fonctionnement et les évolutions
    text: Décrire le service à maintenir et les moyens nécessaires après les premières mises en service.
    inputs: Services attendus, activités de maintenance et d’évolution, fréquences d’intervention, consommations techniques et contrats fournisseur.
    treatment: Dimensionner les interventions par profil et les moyens techniques. Distinguer entretien du produit, adaptations Groupe, cloud et services inclus. Conserver les annuités Buy documentées et les périodes propres à chaque dépense.
    output: Une base annuelle Make et une séquence de contrats et services Buy. Leurs dates de démarrage sont liées à la consommation, aux contrats ou aux réceptions.
    links:
    - href: '#fonctionnement'
      label: Comprendre l’évaluation des services récurrents
  - id: delivery
    title: Organiser les équipes et la trajectoire de livraison
    text: Relier les travaux estimés aux responsabilités, aux capacités et aux jalons.
    inputs: JH par rôle, périmètres des lots, dépendances, disponibilités et responsabilités client et fournisseur.
    treatment: S’appuyer sur des équipes durables de delivery, avec des responsabilités sur le générique, l’intégration Beaumanoir et le MCO. Les accompagnements Enabling visent l’autonomie et restent temporaires. Distinguer la gouvernance, les types d’équipes et leurs modes d’interaction. Relier les travaux aux équipes sans confondre charge, capacité et coût financé. Poser le calendrier propre à chaque option, sans additionner les délais locaux des lots.
    output: Une cible d’équipes durables de delivery et une lecture conservant les charges et coûts par équipe et étape, avec reliquats explicites. Les capacités et les séquences détaillées restent à dimensionner.
    links:
    - href: '#organisation-delivery'
      label: Principes et Team Topologies
    - href: '#equipes-produit'
      label: Équipes et missions
    - href: '#integration-transverse'
      label: Intégration transverse
  - id: valorisation
    title: Passer des charges aux budgets
    text: Associer un prix à chaque travail et rapprocher tous les financements.
    inputs: Charges des trois phases, rôles, tarifs Paris avec province en variante, achats techniques, forfaits et organisation proposée.
    treatment: Valoriser les JH par rôle. Appliquer les gains uniquement aux activités éligibles. Ajouter les achats et dispositifs distincts, puis dédupliquer les travaux déjà financés. Les lots Core System adoptés conservent leurs charges, sans remise globale.
    output: Des budgets traçables aux charges, aux prix et aux contrats, prêts à être positionnés dans le calendrier. Un montant Buy groupé garde son périmètre connu.
    links:
    - href: '#calcul-net'
      label: Comprendre la valorisation
    - href: '#parametres'
      label: Lire les prix et hypothèses retenus
  - id: comparaison
    title: Projeter les dépenses et préparer la décision
    text: Comparer les trois options sur une même durée, avec leur trajectoire de service.
    inputs: Budgets par option, calendrier, dates de réception, périodes contractuelles, consommations et hypothèses d’indexation.
    treatment: Positionner chaque financement une seule fois dans le temps. Calculer les dépenses annuelles et cumulées sur un horizon commun. Rapprocher coûts, dates de service, écarts de périmètre et conditions de réalisation.
    output: Le dossier économique comparatif et les points à lever avant les prochains engagements. Une dépense non dimensionnée reste visible comme telle. Le scénario ne constitue pas encore un plan de livraison détaillé.
    links:
    - href: '#scenarios'
      label: Comprendre la construction du scénario
    - href: '#comparer'
      label: Lire les résultats comparatifs
  matrix:
    caption: Trois phases × Make / Buy
    activity_label: Phase à évaluer
    make_label: '{{notion.make}}'
    buy_label: '{{notion.buy}}'
    rows:
    - id: acquisition
      title: 1 · Obtenir le Core System
      make:
      - Estimer la construction du produit à partir des fonctions, des références logicielles et des méthodes de
        calcul.
      buy:
      - Qualifier les offres, leurs inclusions et le travail acheteur de sélection-contractualisation.
    - id: integration
      title: 2 · {{notion.integrer_deployer}}
      make:
      - Dimensionner adaptations, interfaces, migrations et déploiements à partir des travaux Groupe.
      buy:
      - Examiner les lots fournisseur et les compléments justifiés, en conservant leurs différences de périmètre.
    - id: fonctionnement
      title: 3 · {{notion.exploiter_evoluer}}
      make:
      - Dimensionner les activités récurrentes, les moyens techniques et les achats nécessaires.
      buy:
      - Qualifier abonnements, services inclus et responsabilités restant à financer.
    notes:
    - '**Les phases organisent l’évaluation. Build / Run qualifie les activités financées.** Une dépense récurrente
      peut financer du Build. Certaines activités commencent avant la stabilisation complète.'
evidence:
  title: Les données d’entrée
  items:
  - id: perimetre
    title: Cartographie métier
    text: La capture reçue définit le périmètre de l’étude. La page dédiée présente sa provenance et donne accès
      à Atlas.
    href: '#cartographie'
    label: Consulter le périmètre reçu
  - id: synvance
    title: Repères Synvance
    text: Retrouver la demande, les conclusions, les comparaisons OMS et coûts, ainsi que les pièces originales.
    href: '#synvance'
    label: Consulter les Repères Synvance
  - id: projets
    title: Projets et transformations similaires
    text: Comparer les ressemblances avec FLOW, les différences et les enseignements utiles pour challenger les estimations.
    href: '#preetude-projets'
    label: Consulter les projets et transformations similaires
  - id: solutions
    title: Comparaison des solutions
    text: Quatre OSS comparés à Microsoft et SAP, avec les constats, versions et preuves par besoin métier.
    href: '#preetude-solutions'
    label: Consulter la préétude des solutions
  - id: tarifs
    title: Tarifs et coûts de marché
    text: Fourchettes de prestations par profil, services techniques et repères économiques avec leurs preuves.
    href: '#preetude-couts'
    label: Consulter la préétude des tarifs et coûts de marché
confidence:
  title: Distinguer les niveaux de preuve
  text: Une méthode définie, une estimation documentée et une réalisation démontrée répondent à des questions différentes.
    Les dossiers liés présentent les preuves et leurs statuts.
  levels:
  - id: method
    title: Définir la méthode
    text: Les méthodes, conventions et sources attendues sont définies. Elles expliquent comment passer du besoin aux résultats.
    href: '#complexite'
    label: Lire la méthode Make
  - id: application
    title: Documenter son application
    text: Les données, hypothèses et travaux utilisés sont traçables.
    href: '#evaluation-core'
    label: Examiner les évaluations
  - id: review
    title: Relire l’évaluation
    text: Une revue humaine doit identifier son auteur, le périmètre relu et ses réserves. Les calculs reproductibles ne remplacent pas cette revue.
    href: '#evaluation-core'
    label: Vérifier la revue et ses réserves
  - id: delivery
    title: Démontrer la réalisation
    text: Équipe, essais, transfert et engagements doivent être établis pour FLOW.
    href: '#conditions-realisation'
    label: Lire les conditions de réalisation
  links:
  - href: '#conditions-realisation'
    label: Comprendre les critères de réalisation
  limits_title: Lire les résultats sur leur périmètre
  limits:
  - Le périmètre, les hypothèses et la référence retenue accompagnent chaque résultat.
  - Les inconnues restent explicites dans les périmètres, les prix et les responsabilités.
