  phases:
  - id: acquisition
    title: Obtenir le Core System
    intro: Construire le produit en Make, ou sélectionner et contractualiser une solution existante en Buy.
    make: Estimer le travail de construction du produit.
    buy: Qualifier les conditions d’achat et le travail de sélection acheteur.
    providers:
    - option_ref: java-spring
      stack_reading:
        title: La stack Java/Spring à construire
        intro: '**Un produit Flow développé en Java/Spring et React**, assemblé avec des moteurs OSS spécialisés.
          Les ERP de référence servent à dimensionner les fonctions. Ils ne constituent pas le produit à déployer.
          Les composants ci-dessous décrivent la stack de travail proposée.'
        groups:
        - title: Backend et interface
          element_refs: [jdk, spring, react]
        - title: Processus, règles et optimisation
          element_refs: [temporal, drools, timefold, ortools]
        - title: Données et services techniques
          element_refs: [postgresql, rabbitmq, keycloak, otel, camel]
        - title: Analyse et pilotage
          element_refs: [pm4js, superset]
        choices: Temporal est l’alternative de travail à Flowable. PM4JS et Superset sont des composants distincts
          du backend Java. PM4Py constitue une alternative à PM4JS. Ces alternatives ne sont pas cumulées.
      inputs:
      - Cartographie des capacités, fonctions complémentaires du produit et stack Java/Spring.
      - Code de logiciels à code source ouvert (OSS) mesuré, rapprochements fonctionnels et réutilisation documentée.
      treatment:
      - Décrire les fonctions attendues à partir des capacités et des scénarios métier, puis les rapprocher des traitements et fichiers OSS.
      - Comparer les estimations issues du code, du comptage fonctionnel et des livrables détaillés selon les preuves disponibles.
      - Adopter les résultats justifiés et répartir les JH par rôle.
      output: Des efforts de construction en JH, avec leurs rôles, activités incluses et preuves.
      limits:
      - Les délais locaux ne déterminent pas le calendrier global.
      links:
      - href: '#complexite'
        label: Approfondir les méthodes de calcul Make
      status: Construction Java/Spring adoptée. Les écarts sectoriels sont suivis dans la comparaison par Business Area.
      example: Pour une règle de réassort, identifier ce qui existe déjà dans les composants réutilisés, puis estimer
        les compléments à construire.
    - option_ref: microsoft
      inputs:
      - Proposition Avanade et périmètre Dynamics 365 / K3.
      treatment:
      - Examiner la couverture et les inclusions.
      - Dimensionner la sélection-contractualisation acheteur.
      - Conserver les conditions d’activation des abonnements.
      output: Le travail acheteur en JH et les conditions d’achat à intégrer au scénario.
      limits:
      - Les licences suivent leur activation contractuelle, pas toute la première phase.
      links:
      - href: '#synvance-microsoft'
        label: Consulter la proposition Microsoft
      status: Offre reçue. Couverture et engagements encore à qualifier.
      example: Une fonction annoncée dans Commerce doit être rapprochée du besoin, puis de son inclusion dans le
        prix proposé.
    - option_ref: sap
      inputs:
      - Proposition Delaware et périmètre S/4 Fashion.
      treatment:
      - Examiner les inclusions et écarts au besoin.
      - Dimensionner la sélection-contractualisation acheteur.
      - Conserver la séquence tarifaire proposée.
      output: Le travail acheteur en JH et les conditions d’achat à intégrer au scénario.
      limits:
      - Un point à qualifier ne crée aucun budget automatique.
      links:
      - href: '#synvance-sap'
        label: Consulter la proposition SAP
      status: Offre reçue. Travaux Finance identifiés, qualification encore ouverte.
      example: Un lot Finance présent dans l’offre reste identifiable pour comparer son périmètre avec celui demandé.
    short_title: Obtenir
    make_audit:
      mapping:
        title: De la capacité métier au code à estimer
        shortcut: Comprendre le passage du métier au code
        intro: '**La correspondance se construit par analyse fonctionnelle et revue de code.** On décrit le résultat attendu, on repère les traitements qui le produisent et on justifie les fichiers retenus.'
        relation: Une capacité peut mobiliser plusieurs features. Une feature et un composant peuvent servir plusieurs capacités. Le rapprochement conserve ces liens et attribue chaque mécanisme partagé à un seul financement.
        steps:
        - title: 1 · Partir d’une capacité et de ses frontières
          text: Lire sa définition dans la cartographie, ses entrées, le résultat attendu et les responsabilités des capacités voisines. Décrire un scénario concret avec ses erreurs, corrections et contraintes.
        - title: 2 · Décomposer en fonctions puis regrouper en features
          text: Décrire les actions que le produit doit permettre, avec leurs règles et leurs données. Regrouper les fonctions qui partagent le même cycle et les mêmes données dans un périmètre cohérent. Les fonctions proposées restent reliées aux capacités d’origine.
        - title: 3 · Rechercher des traitements équivalents dans les OSS
          text: Examiner les fonctions des logiciels à code source ouvert, puis leurs objets, règles, états et interfaces. Justifier ce qui répond au même besoin, ce qui dépasse le besoin et ce qui manque pour FLOW. Une proximité de nom ne suffit pas à établir la correspondance.
        - title: 4 · Délimiter les fichiers et dépendances utiles
          text: Suivre les traitements jusqu’aux services, modèles, vues et configurations. Figer leur révision et les fichiers retenus. Dans un fichier partagé, expliciter la part attribuée à la feature et son motif. Les comptages sont mesurés, les parts attribuées et les analogies sont des hypothèses documentées.
        - title: 5 · Préparer la taille à estimer
          text: Déduire les mécanismes déjà financés, conserver les adaptations nécessaires et dimensionner les fonctions manquantes par des analogues explicités. La préparation tient compte du langage et du déclaratif. On obtient un périmètre de code argumenté et une taille équivalente pour le calcul.
        example:
          title: Un exemple réel dans le lot Stock
          capability_label: Capacité de la cartographie
          function_label: Fonction proposée pour FLOW
          feature_label: Feature regroupant les traitements
          code_label: Espaces de code retenus comme références
          boundary_label: Ce que le rapprochement laisse à compléter
          capability_ref: BC-010
          function_ref: BC-010.01
          component_source: audits/2026-10-30-stock-composants-07/components.json
          component_ref: K1
          references:
          - title: ERPNext
            source: audits/2026-10-30-stock-composants-07/erpnext-perimetre.json
            repository: https://github.com/frappe/erpnext
            file_refs:
            - erpnext/stock/stock_ledger.py
            - erpnext/stock/doctype/stock_ledger_entry/stock_ledger_entry.json
          - title: Odoo Community
            source: audits/2026-10-30-stock-composants-07/odoo-perimetre.json
            repository: https://github.com/odoo/odoo
            file_refs:
            - addons/stock/models/stock_move.py
            - addons/stock/views/stock_move_views.xml
        estimation:
          title: Ce que les méthodes font de ce rapprochement
          text: COCOMO II transforme la taille équivalente et les conditions de réalisation en charge projet. COSMIC × ISBSG estime séparément la charge à partir des fonctions et d’une référence de productivité. Une estimation par livrables détaille directement les travaux nécessaires. La décision retient la voie justifiée pour le périmètre, avec ses preuves.
        roles:
          title: De la charge aux rôles
          text: '**COCOMO répartit la charge entre activités. Une table FLOW les transcrit en JH par rôle.** Elle donne les clés par défaut, leur justification et les conditions d’adaptation pour un produit Java/Spring orienté services. Chaque activité reste répartie à 100 %. Les allocations déjà adoptées sont conservées.'
          href: '#complexite?focus=roles'
          label: Comprendre les règles d’affectation aux rôles
        appendix:
          href: '#complexite?focus=formules'
          label: Approfondir COCOMO et les règles de calcul
        return_label: Revenir au passage du métier au code
      title: Annexe · COCOMO II et règles de calcul
      intro: '**Les préétudes fournissent les fonctions et mesures documentées.** L’évaluation les rapproche des capacités,
        prépare la taille, applique les calculs et justifie une décision. Les formules et unités viennent du métamodèle
        exécuté par le moteur.'
      steps:
      - title: 1 · Rapprocher les capacités du code OSS
        text: Délimiter une unité cohérente dans la cartographie. Relier ses capacités aux fonctions, modules et
          chemins de code des OSS de référence. Tracer versions, mesures, écarts et compléments du produit professionnel.
          Ces compléments ne créent pas de capacités dans la cartographie reçue.
        rule_refs:
        - calculation_binding
        - evidence_closure
      - title: 2 · Préparer la taille et la réutilisation
        text: À partir du code correspondant aux fonctions, préparer une taille adaptée à Java/Spring. Le contrat
          conserve les pondérations du déclaratif, analogies, adaptations et compléments. Une mesure physique PNCLOC
          n’est pas directement une taille logique COCOMO. Le patrimoine déjà financé est retiré une seule fois.
        rule_refs:
        - prepare_size
        - equivalent_size
        - unique_mechanism_funding
      - title: 3 · Appliquer COCOMO II, puis comparer
        text: COCOMO II utilise la taille préparée en KSLOC et les paramètres du modèle pour donner l’effort
          projet en JH. COSMIC × ISBSG utilise séparément un comptage fonctionnel et une productivité justifiée.
          Rapprocher activités et garanties avant d’interpréter leur écart.
        rule_refs:
        - cocomo_exponent
        - cocomo_effort
        - cosmic_effort
        - comparison_contract
      - title: 4 · Adopter, ventiler et consolider
        text: Justifier la référence et le résultat retenus, leurs rôles et leurs preuves. Les compléments métier,
          adaptations et réutilisations entrent dans la taille préparée. Consolider les lots après déduplication
          des financements. Les décisions actuelles se lisent dans le dossier économique.
        rule_refs:
        - retained_rounding
        - role_allocation
        - decision_consolidation
      method: core_method
      sections: []
      links:
      - href: '#evaluation-core'
        label: Vérifier les calculs, les preuves et les décisions
      - href: '#complexite'
        label: Lire la méthode détaillée et les références
  - id: integration
    title: '{{notion.integrer_deployer}} dans le Groupe'
    intro: Relier le produit aux pratiques, aux données et aux systèmes du Groupe, puis organiser les déploiements
      et réceptions.
    make: Dimensionner les adaptations et déploiements propres au Groupe.
    buy: Examiner les prestations reçues et les compléments justifiés.
    providers:
    - option_ref: java-spring
      inputs:
      - Adaptations, interfaces, migrations et déploiements Groupe.
      treatment:
      - Décrire les travaux propres au Groupe.
      - Dimensionner leurs activités et rôles.
      - Valoriser les JH et les moyens consommés pendant l’intégration.
      output: Une enveloppe d’intégration en euros, avec les JH et hypothèses qui la justifient.
      limits:
      - Les équipes de delivery sont proposées. Les capacités par lot, les affectations et la séquence de livraison restent à valider.
      links:
      - href: '#calcul-net'
        label: Approfondir la valorisation des travaux
      status: Dimensionnement Groupe retenu comme hypothèse d’opportunité. Calendrier provisoire.
      example: Pour raccorder une application, décrire les données échangées, les mappings et les essais, puis estimer
        le travail des profils nécessaires.
    - option_ref: microsoft
      inputs:
      - Pilote Avanade, projection Groupe du COPIL et inclusions.
      treatment:
      - Séparer le pilote chiffré de la projection des autres pôles.
      - Rapprocher les prestations des travaux à réaliser.
      - Justifier les compléments de l’étude séparément.
      output: Une enveloppe d’intégration en euros, retraçable au pilote et à la projection Groupe.
      limits:
      - Le support initial n’est pas renouvelé implicitement.
      links:
      - href: '#synvance-microsoft'
        label: Examiner le pilote et la projection Microsoft
      status: Pilote et projection disponibles. Pas d’offre détaillée pour chaque pôle.
      example: Pour un pôle supplémentaire, examiner ce que la projection reprend du pilote et les adaptations locales
        qu’elle suppose.
    - option_ref: sap
      inputs:
      - 'Lots Delaware : Finance, migration et déploiement.'
      treatment:
      - Rapprocher les montants des lots et le total imprimé.
      - Identifier les travaux et leur périmètre.
      - Justifier les compléments de l’étude séparément.
      output: Une enveloppe d’intégration en euros, retraçable aux lots et compléments déclarés.
      limits:
      - Un écart de total n’est pas une prestation supplémentaire.
      links:
      - href: '#synvance-sap'
        label: Examiner les lots de convergence SAP
      status: Lots reçus et compléments retenus. Différences de périmètre à conserver.
      example: Pour une migration Boardriders, identifier les prestations du lot et les frontières avec les autres
        travaux de convergence.
    short_title: '{{notion.integrer_deployer}}'
    make_audit:
      title: 'Make : des travaux Groupe au budget d’intégration'
      intro: La construction du produit générique est financée séparément. Les adaptations, interfaces et déploiements
        sont dimensionnés sur leurs travaux propres.
      steps:
      - title: 1 · Décrire et dimensionner les travaux
        text: Préciser les volumes, les activités, les profils et les inclusions. Un raccordement doit déclarer
          ses mappings, ses essais et ses travaux de bascule.
        rule_refs: []
      - title: 2 · Valoriser par profil
        text: Multiplier les JH de chaque profil par son tarif, puis sommer. Les activités déjà incluses ne sont
          pas ajoutées. Aucun gain IA n’est appliqué à l’intégration Make actuelle.
        rule_refs:
        - role_price
      - title: 3 · Consolider l’enveloppe Groupe
        text: Ajouter uniquement les coordinations, déploiements, programme et prestations distincts. La décomposition
          ci-dessous provient de la méthode de valorisation du modèle.
        rule_refs: []
      method: net_method
      sections:
      - construire-charge-totale
      links:
      - href: '#evaluation-core'
        label: Vérifier les évaluations et leur provenance
      - href: '#calcul-net'
        label: Lire les activités, tarifs et règles de valorisation
  - id: fonctionnement
    title: '{{notion.exploiter_evoluer}}'
    intro: Évaluer les services récurrents, les évolutions et les moyens nécessaires, puis préciser leurs périodes
      de consommation.
    make: Dimensionner les services récurrents et les moyens nécessaires.
    buy: Qualifier les contrats, leurs périodes et les responsabilités restantes.
    providers:
    - option_ref: java-spring
      inputs:
      - Services attendus, activités récurrentes et moyens techniques.
      treatment:
      - Dimensionner les interventions et leurs profils.
      - Valoriser le travail et ajouter les achats distincts.
      - Placer chaque dépense à partir de sa consommation ou réception.
      output: Une base annuelle en euros, avec ses activités et ses dates de démarrage.
      limits:
      - Le MCO du produit relève du Build dans la convention retenue.
      links:
      - href: '#calcul-run'
        label: Approfondir le calcul des services
      status: Base annuelle estimée. Moyens cloud encore exprimés en enveloppes.
      example: Pour maintenir une interface, estimer les interventions récurrentes et les moyens nécessaires. Le
        service commence après sa réception.
    - option_ref: microsoft
      inputs:
      - Annuités Dynamics 365 / K3 et support initial proposé.
      treatment:
      - Conserver les années de licences documentées.
      - Séparer support initial et services récurrents.
      - Qualifier les moyens supplémentaires à financer.
      output: Une séquence de dépenses en euros, distinguant abonnements et services complémentaires.
      limits:
      - Au-delà de l’offre, les prolongations relèvent du scénario.
      links:
      - href: '#synvance-costs'
        label: Vérifier les périodes chiffrées des offres
      status: Annuités et support initial documentés. Entretien des adaptations à qualifier.
      example: Un support payé en première année ne devient pas une dépense annuelle répétée sans justification
        de renouvellement.
    - option_ref: sap
      inputs:
      - Abonnements, MCO, monitoring et évolutions proposés.
      treatment:
      - Conserver la montée en charge tarifaire.
      - Distinguer prix annuels et engagements pluriannuels.
      - Qualifier les activités couvertes et les compléments.
      output: Une séquence de dépenses en euros, avec les périodes des abonnements et services.
      limits:
      - Les parts inconnues d’un contrat groupé ne sont pas ventilées artificiellement.
      links:
      - href: '#synvance-costs'
        label: Vérifier les abonnements et services SAP
      status: Prix et forfaits documentés. Responsabilités et ventilation encore à préciser.
      example: Un forfait MCO après stabilisation ne démarre pas automatiquement au lancement du projet. Sa date
        suit la période de service retenue.
    short_title: '{{notion.exploiter_evoluer}}'
    make_audit:
      title: 'Make : du service à la dépense annuelle'
      intro: Séparer les prestations estimées, les moyens techniques et les contrats. Les volumes, gains et tarifs
        concernent uniquement leur assiette déclarée.
      steps:
      - title: 1 · Définir le service et les volumes
        text: Déclarer les interventions annuelles, leurs JH unitaires et leurs profils. Qualifier les moyens cloud
          et les achats distincts.
        rule_refs: []
      - title: 2 · Calculer les prestations annuelles
        text: Appliquer les gains justifiés aux seules activités éligibles, puis les tarifs. Les contrats documentés
          ne reçoivent pas cette réduction.
        rule_refs:
        - annual_work_cost
      - title: 3 · Ajouter les moyens et positionner les dépenses
        text: Ajouter les achats et provisions distincts. Les réceptions et périodes de service déterminent la consommation.
          Les règles d’indexation et d’allocation sont celles du modèle.
        rule_refs:
        - inflation
        - period_allocation
      method: run_method
      sections:
      - valoriser-prestations
      links:
      - href: '#parametres'
        label: Vérifier volumes, tarifs et hypothèses
      - href: '#calcul-run'
        label: Lire les services, contrats et périodes de consommation
  scenario:
    intro: '**Une option technique devient un scénario économique lorsqu’on lui associe des prix, des dates et des
      règles de consommation.** Le scénario de référence contient déjà des hypothèses Groupe. Il ne constitue pas
      un plan de réalisation par équipes et par lots.'
    steps:
    - title: 1 · Rassembler les évaluations des trois phases
      text: Conserver le périmètre et les inclusions de chaque coût. Les prix Buy restent documentés en euros, les
        travaux sont valorisés par profil et tarif.
    - title: 2 · Définir un calendrier pour chaque option
      text: Positionner la construction ou sélection, les intégrations, les réceptions et la montée des services.
        Le calendrier Make reste indépendant des durées Buy.
    - title: 3 · Appliquer les règles de dépense
      text: Répartir les montants selon leur consommation, leurs périodes contractuelles et les hypothèses d’indexation.
        Un abonnement déjà inclus ne se finance pas une seconde fois.
    - title: 4 · Lire les annuités et les cumuls
      text: Comparer les dépenses sur un horizon commun en tenant compte des dates de service et des travaux restant
        à financer.
    future: '**Les équipes durables de delivery structurent la cible du delivery.** Les charges et coûts sont rapprochés par équipe et par étape depuis les financements existants. Les parts non justifiées restent à ventiler. La capacité disponible et la séquence de mobilisation restent à dimensionner. Le scénario économique ne simule pas encore ce plan de capacité détaillé.'
    links:
    - href: '#leviers'
      label: Approfondir les variables et conventions
    - href: '#parametres'
      label: Lire les hypothèses de référence
    - href: '#comparer'
      label: Comparer les coûts sur un même horizon
    example:
      title: Une interface, du travail initial au service récurrent
      text: Les JH de raccordement sont valorisés par profil et répartis pendant l’intégration. Après réception,
        les interventions d’entretien alimentent les années de fonctionnement. Le cumul à un horizon donné réunit
        les dépenses consommées, avec les achats et contrats distincts. Le travail initial n’est pas compté une
        seconde fois.
    primary:
      href: '#se-projeter'
      label: Voir le scénario économique de référence
  methods:
  - href: '#modele'
    label: Les fondamentaux et le périmètre
    text: Retrouver les définitions, les trois axes de lecture, les postes de coût et les repères de calendrier.
