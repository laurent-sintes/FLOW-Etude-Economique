version: 1
id: framework-vision
opening:
  title: Éclairer la décision d’investissement
  text: >-
    **L’objectif est un Go / No Go éclairé sur l’opportunité de poursuivre FLOW.**
    À ce stade, les fonctionnalités applicatives ne sont pas cadrées en détail.
    Le dispositif de réalisation et les engagements fournisseurs restent à préciser.
    Il faut néanmoins situer l’investissement, comparer les trajectoires et
    identifier les hypothèses décisives. Le framework construit des
    **ordres de grandeur explicables et des scénarios révisables**,
    sans engagement forfaitaire.
adaptation:
  title: Des chiffres à discuter et à adapter
  text: >-
    **Les chiffres constituent une base de discussion, adaptable au contexte.**
    Charges, gains de productivité, tarifs et calendrier peuvent être confrontés
    aux conditions du projet. Les paramètres exposés permettent de construire
    des scénarios et d’en mesurer l’impact sur l’investissement, en conservant
    la référence commune pour les comparer.
  href: '#leviers'
  label: Comprendre les {{vue.leviers_calcul}}
approach:
  title: Un besoin commun, deux démarches d’évaluation
  steps:
  - id: besoin
    title: Délimiter le résultat métier attendu
    text: >-
      **La cartographie métier fournit le référentiel commun.** Ses capacités
      délimitent ce que la {{notion.core_system}} doit couvrir, puis les adaptations
      propres à Beaumanoir. Elle structure les travaux Make et sert aussi à
      challenger les offres Buy. Les niveaux de complexité orientent l’analyse,
      sans conversion automatique en JH.
  - id: make
    title: Make · estimer les travaux à réaliser
    text: >-
      La construction repose sur des **hypothèses de travaux par écosystème**.
      La {{notion.reutilisation_logicielle}} mobilise frameworks, bibliothèques,
      programmes, automatisations et skills disponibles. Elle détermine les
      développements, adaptations, raccordements et tests restants. La méthode
      du skill formalise leur rattachement aux capacités et aux fonctions observées.
  - id: buy
    title: Buy · partir des offres existantes
    text: >-
      **L’étude Synvance est l’entrée principale du Buy.** Les offres Microsoft
      et SAP, questionnaires et projections COPIL apportent prestations, prix
      et trajectoires. La méthode confronte leur périmètre au besoin, vérifie
      les inclusions et identifie les travaux client complémentaires à instruire.
  - id: investissement
    title: Relier les estimations aux scénarios d’investissement
    text: >-
      Le moteur rapproche **travaux valorisés, achats et prix des offres**,
      puis les inscrit dans leur calendrier. Les dépenses initiales, transitions
      et services annuels alimentent les mêmes comparaisons. Les horizons et
      simulations montrent l’effet des hypothèses de charge, de prix et de délai
      sur l’investissement à financer.
evidence:
  title: Confronter les hypothèses à des éléments vérifiables
  items:
  - id: synvance
    title: Des pièces commerciales avec leur périmètre
    text: >-
      Les propositions et questionnaires conservent leurs dates, inclusions,
      exclusions et séquences. **Une fonction déclarée ou disponible au catalogue
      n’est pas automatiquement incluse dans le prix.** Les écarts restent
      identifiés, sans supplément budgétaire implicite.
    href: source/offres-synvance.md
    label: Lire les pièces et la construction des offres
  - id: marche
    title: Des produits et projets pour éprouver les hypothèses
    text: >-
      L’étude de marché examine fonctions, éditions, déploiements et prix documentés.
      Pour les logiciels open source (OSS), les observations de code précisent les composants
      et leurs frontières. **Leur utilisation pour FLOW exige une transposition justifiée** :
      expliciter ce qui change dans les travaux, volumes et responsabilités.
    href: '#marche'
    label: Consulter l’{{vue.evaluation_marche}}
  - id: methode
    title: Des charges rattachées aux travaux qui les justifient
    text: >-
      La méthode du skill prévoit, pour chaque lot, de documenter le résultat
      attendu, les inclusions, les hypothèses et la provenance.
      **Un mécanisme partagé possède un seul financement**,
      même lorsque plusieurs capacités l’utilisent.
    href: '#complexite'
    label: Lire la méthode d’estimation des JH développeur
dimensions:
  title: Quatre distinctions rendent le calcul relisible
  items:
  - title: Du brut au net, puis aux autres efforts
    text: >-
      Le brut décrit les travaux après réutilisation ; le net applique les gains
      explicites sur ce même périmètre. La {{notion.charge_totale_projet}} ajoute
      les autres efforts humains retenus, sans compter deux fois qualification,
      architecture ou pilotage.
  - title: Des JH aux euros
    text: >-
      Les JH sont valorisés selon les profils et tarifs applicables. Achats,
      licences et forfaits restent en euros. **Un forfait Buy prime sur les JH
      diagnostiques** et ne reçoit aucune remise automatique de productivité.
  - title: Des dépenses au calendrier
    text: >-
      Consommations, réceptions et séquences commerciales déterminent les périodes
      financées. Le calendrier Make est autonome. Un horizon commun peut donc
      contenir des durées de service différentes ; l’indexation suit les règles
      de chaque catégorie.
  - title: Build et Run, indépendamment des phases
    text: >-
      Ces tags qualifient les activités. Le MCO de la {{notion.core_system}} est
      Build ; celui des adaptations Beaumanoir est Run, sauf interventions
      importantes en projet, selon une répartition paramétrable. Un coût annuel
      n’est donc pas nécessairement du Run.
confidence:
  title: Des hypothèses traçables, un calcul vérifiable
  text: >-
    **Une estimation doit pouvoir être relue, discutée et recalculée.**
    La chaîne de justification relie chaque hypothèse à ses appuis et à son périmètre.
    Les contrôles vérifient cohérence des références, financements uniques,
    calendriers et réconciliation des résultats ; ils ne démontrent pas la justesse
    empirique des hypothèses. Les simulations les font varier sans modifier la référence.
  limits_title: Conditions d’une comparaison recevable
  limits:
  - Déclarer les données effectivement utilisées, leur provenance et les contrôles réalisés ; une méthode définie ne prouve pas son application.
  - Conserver les inconnues et les écarts de périmètre. Une absence de preuve ne démontre ni une absence produit ni un coût nul.
  - N’annoncer un total humain complet que si les efforts nécessaires ont été dimensionnés ; distinguer exclusions et inconnues.
  - N’agréger Build / Run que sur les parts documentées, sans convertir une ventilation inconnue en zéro.
next:
  href: '#modele'
  label: Approfondir les {{vue.concepts}}
