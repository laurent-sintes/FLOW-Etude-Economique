version: 1
id: flow-delivery-organisation
date: '2026-11-06'
excluded_workload_phases:
- integration
principle:
  id: durable-product-teams
  title: Équipes durables de delivery
  text: Des équipes stables portent les flux de valeur, les services de plateforme et les sous-systèmes spécialisés
    pendant la construction, l’intégration et la vie en service. L’équipe Enabling développe leur autonomie par
    des accompagnements temporaires. Relier les responsabilités, les charges, les coûts et la capacité dans le temps.
team_types:
- id: stream-aligned
  label: Stream-aligned
  definition: Une équipe alignée sur un flux de valeur, responsable de sa livraison de bout en bout et de sa vie
    en service.
  color: '#FFEDB8'
- id: platform
  label: Platform
  definition: Une plateforme pensée comme un produit interne. Ses services en libre-service réduisent la charge
    cognitive des équipes consommatrices.
  color: '#BBD2F6'
- id: complicated-subsystem
  label: Complicated-subsystem
  definition: Une équipe dédiée à un sous-système exigeant une expertise rare. Cette séparation se justifie par
    la complexité qui dépasserait la capacité des équipes alignées sur un flux.
  color: '#FBDBBA'
- id: enabling
  label: Enabling
  definition: Une équipe qui transmet des compétences aux autres équipes. Chaque accompagnement est temporaire et
    vise leur autonomie, sans reprendre la propriété de leurs composants.
  color: '#C9DFBE'
interaction_modes:
- id: collaboration
  label: Collaboration
  definition: Explorer et construire ensemble pendant une période définie. La zone commune hachurée représente ce
    travail partagé.
  color: '#75529B'
- id: x-as-a-service
  label: X-as-a-Service
  definition: Fournir et consommer un service avec peu de coordination au quotidien, un contrat clair et une expérience
    de consommation simple. Le connecteur noir représente cette relation de service.
  color: '#222222'
- id: facilitating
  label: Facilitating
  definition: Accompagner temporairement une équipe pour lever un obstacle ou acquérir une compétence. La zone commune
    pointillée représente cet accompagnement.
  color: '#75529B'
phases:
- id: acquisition
  label: Build Core System
  charge_unit: JH
  cost_unit: k€ HT
  period: Construction initiale
  note: Produit générique, gouvernance et moyens de construction. Les charges brutes connues et les coûts financés
    ont des assiettes distinctes.
- id: integration
  label: Intégration Beaumanoir
  charge_unit: JH
  cost_unit: k€ HT
  period: Intégration initiale
  note: Jours non évalués et non ventilés, étude d’intégration à reprendre. Les coûts conservent les financements
    existants, dont le maintien du produit et les moyens consommés pendant cette période.
- id: fonctionnement
  label: MCO et évolutions
  charge_unit: JH / an
  cost_unit: k€ HT / an
  period: Régime annuel complet
  note: Base annuelle de service, à distinguer du cumul sur un horizon. Produit générique, adaptations et moyens
    restent identifiés.
target_topology:
  layers:
  - id: business-journeys
    label: Parcours métier
    team_refs:
    - sourcing-procurement
    - b2c
    - wholesale
  - id: business-services
    label: Couche business de la plateforme Flow
    team_refs:
    - portal
    - master-data
    - services
    rows:
    - - portal
    - - master-data
      - services
  - id: shared-engines
    label: Socle technique
    team_refs:
    - mdm-platform
    - case-management
    - master-plan-supply-policy
    - inventory-availability
  - id: technical-base
    label: Infrastructure et outillage PaaS
    team_refs:
    - paas
  transverse:
    label: Accompagnement transverse
    team_refs:
    - integration
teams:
- id: case-management
  label: Case Management
  type: platform
  mission: Socle de case management, moteur de règles générique, process mining et analytics engine.
  boundary: Les équipes métier conservent leurs règles et processus. Le moteur générique fournit les mécanismes
    de leur exécution.
  status: target
  responsibilities:
    acquisition: Construire les moteurs, contrats, studios et mécanismes génériques.
    integration: Accompagner leur configuration et qualifier les usages Beaumanoir.
    fonctionnement: Maintenir les moteurs, leurs contrats et la compatibilité.
  capacity:
    acquisition: null
    integration: null
    fonctionnement: null
- id: paas
  label: PaaS
  type: platform
  mission: Outils de développement, IA, harnais, CI/CD et moyens techniques du delivery.
  boundary: Les services fournis et les moyens consommés sont distincts. Les contributions d’exploitation restent
    à contractualiser.
  status: target
  responsibilities:
    acquisition: Fournir les outils, environnements et la chaîne industrielle.
    integration: Industrialiser la livraison et les environnements du contexte client.
    fonctionnement: Maintenir et faire évoluer l’outillage et les environnements.
  capacity:
    acquisition: null
    integration: null
    fonctionnement: null
- id: master-plan-supply-policy
  label: Master Plan et Supply Policy
  type: complicated-subsystem
  mission: Plans, politiques Supply, arbitrages et décisions de planification.
  boundary: Le contrat avec Inventory et Availability distingue affectation du plan, possibilité de promesse et
    engagement.
  status: target
  responsibilities:
    acquisition: Réaliser les mécanismes de planification, politiques et arbitrages.
    integration: Configurer et éprouver les politiques et contraintes du Groupe.
    fonctionnement: Maintenir et faire évoluer les mécanismes et politiques selon leur objet.
  capacity:
    acquisition: null
    integration: null
    fonctionnement: null
- id: inventory-availability
  label: Inventory et Availability
  type: complicated-subsystem
  mission: Faits de stock, propriété, réservations et possibilités de promesse.
  boundary: Les interfaces séparent fait de stock, réservation, disponibilité et décision de planification.
  status: target
  responsibilities:
    acquisition: Réaliser les mécanismes de stock, de réservation et de disponibilité.
    integration: Intégrer les sources de stock et les engagements Beaumanoir.
    fonctionnement: Maintenir la cohérence, les performances et les contrats de disponibilité.
  capacity:
    acquisition: null
    integration: null
    fonctionnement: null
- id: services
  label: Services
  type: stream-aligned
  mission: Service Management et Fulfilment Orchestration.
  boundary: L’équipe possède l’exécution métier des prestations et consomme les moteurs génériques de Case Management.
  status: target
  responsibilities:
    acquisition: Construire les comportements standard de gestion et d’orchestration des prestations.
    integration: Intégrer les prestataires, contrats et parcours d’exécution du Groupe.
    fonctionnement: Maintenir les comportements génériques et les adaptations d’exécution.
  capacity:
    acquisition: null
    integration: null
    fonctionnement: null
- id: mdm-platform
  label: Plateforme MDM
  type: platform
  mission: Fournir le socle technique du MDM et ses outils génériques.
  boundary: Plateforme MDM porte le moteur et les outils. Master Data porte les modèles et règles métier. PaaS fournit les environnements. Case Management fournit les moteurs de processus.
  status: target
  responsibilities:
    acquisition: Construire le moteur MDM, ses interfaces et ses outils de configuration.
    integration: Adapter les extensions et interfaces aux usages Beaumanoir.
    fonctionnement: Maintenir le socle MDM, sa sécurité, ses performances et sa compatibilité.
  capacity:
    acquisition: null
    integration: null
    fonctionnement: null
- id: master-data
  label: Master Data
  type: stream-aligned
  mission: Porter les référentiels maîtres de la {{notion.flow_core_system}} et leur qualité métier.
  boundary: Dans la {{notion.core_system}}, Master Data définit les familles de données et leurs règles sur le socle Plateforme MDM. Portal porte Operational References et les vues de consommation.
  status: target
  responsibilities:
    acquisition: Construire les modèles des référentiels et leurs règles métier.
    integration: Adapter et reprendre les données Beaumanoir avec leurs responsables métier.
    fonctionnement: Faire évoluer les référentiels et maintenir leur cohérence.
  capacity:
    acquisition: null
    integration: null
    fonctionnement: null
- id: sourcing-procurement
  label: Sourcing & Procurement
  type: stream-aligned
  mission: Parcours et Orders du monde achat.
  boundary: Porte les accords et commandes d’achat ainsi que le socle des commandes typées consommé par B2C et Wholesale.
  status: target
  responsibilities:
    acquisition: Construire les comportements standard des Orders achat.
    integration: Adapter les parcours et les échanges avec le SI et les fournisseurs.
    fonctionnement: Maintenir le standard et les adaptations des parcours d’achat.
  capacity:
    acquisition: null
    integration: null
    fonctionnement: null
- id: b2c
  label: B2C
  type: stream-aligned
  mission: Comportements et parcours des Orders B2C.
  boundary: Un standard générique comparable aux comportements préétablis d’un OMS, puis les spécificités Beaumanoir.
    L’équipe consomme le socle des commandes typées fourni par Sourcing & Procurement.
  status: target
  responsibilities:
    acquisition: Construire les états, comportements et contrats standard des Orders B2C.
    integration: Configurer et intégrer les parcours, canaux et spécificités Beaumanoir.
    fonctionnement: Maintenir le produit générique et les adaptations B2C.
  capacity:
    acquisition: null
    integration: null
    fonctionnement: null
- id: wholesale
  label: Wholesale
  type: stream-aligned
  mission: Comportements et parcours des Orders B2B et Wholesale.
  boundary: Porte les engagements et parcours Wholesale, dont les engagements réciproques intersociétés retenus.
    L’équipe consomme le socle des commandes typées fourni par Sourcing & Procurement.
  status: target
  responsibilities:
    acquisition: Construire les comportements standard des Orders B2B et Wholesale.
    integration: Intégrer les spécificités et échanges avec les partenaires Beaumanoir.
    fonctionnement: Maintenir le produit et les adaptations Wholesale.
  capacity:
    acquisition: null
    integration: null
    fonctionnement: null
- id: portal
  label: Flow Core System Portal
  type: stream-aligned
  mission: Donner accès à FLOW par le portail, les XP APIs et la sécurité applicative.
  boundary: Portal porte l’expérience d’accès et Operational References. Les équipes de domaine gardent leurs API et règles métier. Master Data garde les données maîtres.
  status: target
  responsibilities:
    acquisition: Construire le portail, les XP APIs et les vues Operational References.
    integration: Adapter les accès, les identités et les vues au contexte Beaumanoir.
    fonctionnement: Faire évoluer les parcours et maintenir la sécurité et les interfaces.
  capacity:
    acquisition: null
    integration: null
    fonctionnement: null
- id: integration
  label: Intégration
  type: enabling
  mission: Faciliter l’intégration des composants et les flux SI en accompagnant les équipes et les contributions
    iPaaS.
  boundary: L’accompagnement doit accroître l’autonomie. Les flux et leur exploitation restent attribués à des propriétaires
    durables à identifier.
  status: target
  responsibilities:
    acquisition: Accompagner la conception des contrats et pratiques de tests intégrés.
    integration: Faciliter les raccordements au SI et les contributions iPaaS.
    fonctionnement: Accompagner les évolutions d’intégration et transmettre les compétences.
  capacity:
    acquisition: null
    integration: null
    fonctionnement: null
governance:
  id: transformation-office
  label: Transformation Office FLOW
  mission: Instance de gouvernance hors typologie Team Topologies, pour les décisions, arbitrages et conditions
    de réalisation pendant la construction du Core System et son intégration Beaumanoir.
  roles_ref: source/modele-composable.yaml#equipe_transformation
  funding_note: Les missions opérationnelles actuellement financées restent identifiées. La cible de board ne supprime
    pas la direction de projet, le PMO, la synchronisation, le changement ou l’architecture transverse.
