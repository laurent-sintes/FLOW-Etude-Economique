  graph_inspect_help: Choisir une équipe pour lire sa mission, ou un symbole accompagné d’un nom d’équipe pour examiner
    le contrat d’interaction. Le schéma et le tableau présentent toutes les relations proposées.
  graph_open_team: Ouvrir la fiche de l’équipe
