labels:
  book_title: Team Topologies
  book_subtitle: Organizing Business and Technology Teams for Fast Flow
  book_edition: Matthew Skelton et Manuel Pais · IT Revolution · 2ᵉ édition, 2025
  book_cover: assets/team-topologies-book.jpg
  book_alt: Couverture de Team Topologies, deuxième édition, 2025
  book_link: Découvrir le livre
  book_href: https://teamtopologies.com/book
  authors_link: Les auteurs
  authors_href: https://teamtopologies.com/people
  author_matthew: Matthew Skelton
  author_manuel: Manuel Pais
  author_matthew_image: assets/matthew-skelton.jpg
  author_manuel_image: assets/manuel-pais.jpg
  author_matthew_role: Coauteur · architecture et conception des organisations
  author_manuel_role: Coauteur · organisation des équipes et flux de valeur
  book_credit: 'Couverture et portraits : site officiel Team Topologies. Portrait de Matthew Skelton : Paula
    Brown.'
  conway_law_title: Loi de Conway
  conway_law_text: Les systèmes conçus reflètent les structures de communication des organisations qui les produisent.
    Les frontières et les échanges entre équipes influencent donc les frontières et les interfaces du logiciel.
  conway_law_from: Organisation et communications
  conway_law_to: Architecture produite
  conway_law_source: Melvin Conway · 1968
  conway_law_href: https://www.melconway.com/Home/Conways_Law.html
  conway_inverse_title: Conway inversée
  conway_inverse_text: Partir de l’architecture souhaitée pour organiser les équipes, leurs responsabilités et
    leurs interactions. Cette démarche, appelée « manœuvre de Conway inversée », utilise le mécanisme décrit
    par Conway pour favoriser la cible.
  conway_inverse_from: Architecture souhaitée
  conway_inverse_to: Équipes et interactions adaptées
  conway_inverse_source: La démarche expliquée par Martin Fowler
  conway_inverse_href: https://martinfowler.com/bliki/ConwaysLaw.html
  conway_flow_title: Application à FLOW
  conway_flow_text: Les équipes durables portent les produits et composants de l’architecture cible. Plateforme
    MDM possède le moteur générique, Master Data les familles et leurs règles, Portal les parcours d’accès et
    Operational References. Les contrats entre ces produits organisent les interactions entre leurs équipes.
  references_title: Sources et références
  integration_workload_pending: Non évalué — étude d’intégration à reprendre
  integration_workload_note: Les jours d’intégration ne sont pas ventilés. L’étude de cette charge est à reprendre
    et ne permet pas de justifier une répartition ou un total. Les coûts affichés reprennent les financements existants
    et ne valident pas cette charge.
  allocation_title: Ventilation des coûts par équipe et par phase
  allocation_note: Les équipes responsables de composants les accompagnent pendant leur construction, leur intégration
    Beaumanoir et leur MCO. La table restitue les coûts connus, la gouvernance et les travaux et moyens restant
    à ventiler.
  allocation_details: Consulter les travaux et financements de la ventilation
  principle_title: Équipes durables de delivery
  theory_title: Organiser le delivery pour accélérer le flux de valeur
  theory_intro: La stabilité des équipes soutient le flux de valeur. Leurs frontières et leurs interactions doivent
    limiter la charge cognitive et permettre de livrer avec autonomie.
  types_title: Quatre types d’équipes
  modes_title: Trois modes d’interaction
  conway_title: Concevoir ensemble organisation et architecture
  conway: La loi de Conway relie la structure d’un système aux structures de communication de l’organisation qui
    le conçoit. Les frontières des équipes FLOW et les contrats logiciels doivent être travaillés ensemble.
  book: Team Topologies, Matthew Skelton et Manuel Pais. Première édition 2019, seconde édition 2025.
  target_title: Une cible organisée autour des flux de valeur
  target_note: Le socle technique et les moteurs partagés soutiennent les services et les parcours métier. Selon
    la loi de Conway, on conçoit ensemble les frontières des équipes, leurs interactions et les contrats logiciels.
  target_evolution: Les équipes se constituent progressivement selon les besoins et les compétences. Le type des
    deux sous-systèmes spécialisés reste à éprouver.
  scope_title: Périmètre et frontières
  responsibilities_title: Une responsabilité sur tout le cycle de vie
  capacity_title: Dimensionner la capacité dans le temps
  capacity_note: La charge de travail, la capacité réservée et le coût financé sont trois informations distinctes.
    Les effectifs et disponibilités restent à dimensionner par rôle et par période.
  capacity_unknown: Capacité à dimensionner
  unknown: À ventiler
  known_zero: '0'
  all_teams: Toutes les équipes
  team: Équipe
  phase: Étape
  totals: Total connu
  governance: Gouvernance
  unallocated: Travaux et moyens à ventiler
  assigned: Affectations connues
  charges_title: Charges par équipe et par phase
  costs_title: Coûts par équipe et par phase
  charges_note: Charges brutes des travaux connus. Le MCO est une base annuelle. Les contributions non dimensionnées
    et les postes uniquement en euros restent distincts.
  costs_note: Coûts financés, calculés par le moteur économique. Les coûts humains et les moyens consommés sont
    distingués dans les travaux. Le MCO présente une base annuelle complète.
  unallocated_reason: Rapprochement des travaux, responsabilités et contributions encore nécessaire.
  unknown_note: À ventiler signifie que le financement ou la charge existe sans répartition justifiée entre équipes.
    Cela ne signifie pas zéro travail ou zéro budget.
  workload: Charge brute connue
  cost: Coût financé
  source: Travail ou financement
  object: Objet
  period: Période
  no_records: Aucune affectation justifiée à cette équipe à ce stade. Sa mission et son périmètre restent définis.
  records_title: Travaux et financements rattachés
  candidates: Équipes concernées à confirmer
  basis: Fondement du rattachement
  interactions_title: Des interactions explicites et évolutives
  interaction_note: Cible proposée. Les équipes suivent les couches de l’architecture, de PaaS en bas aux parcours
    métier en haut. Intégration accompagne les équipes de façon transverse. Chaque relation apparaît avec son symbole
    et le nom de l’équipe concernée, dans l’équipe qui la propose.
  source_team: Équipe qui fournit ou accompagne
  target_team: Équipe consommatrice ou accompagnée
  mode: Mode
  interaction_object: Objet de l’interaction
  exit: Critère de sortie
  permanent_service: Contrat de service à entretenir
  graph_label: Équipes FLOW disposées selon les couches de l’architecture
  governance_title: Gouvernance et trajectoire de constitution
  lifecycle_note: Les équipes qui possèdent un périmètre logiciel en gardent la responsabilité pendant sa construction,
    son intégration et sa vie en service. L’équipe Enabling intervient temporairement auprès de chaque équipe accompagnée,
    puis se retire lorsque celle-ci devient autonome.
  buy_note: Cette organisation décrit la cible Make Java/Spring. En Buy, l’éditeur porte son produit et l’intégrateur
    ses prestations. Les contrats restent financés selon leurs propres périmètres.
  reconciliation: Les affectations, la gouvernance et les reliquats restituent les mêmes charges et financements.
    Aucun budget supplémentaire n’est créé par cette lecture.
  nav_label: Parcours du delivery
  phase_filter: Filtrer les interactions par étape
  team_filter: Choisir une équipe
  all_phases: Toutes les étapes
  responsibilities: Responsabilités
  method_link: Comprendre les méthodes
  charges_link: Examiner les charges par équipe
  costs_link: Examiner les coûts par équipe
  org_link: Comprendre l’organisation
  next: Poursuivre
  economic_link: Comparer les options
  months: mois depuis le lancement
  annual_period: Après réception, base annuelle complète
  team_directory: Équipes et missions
  team_types_note: « Équipe produit » n’est pas un type Team Topologies. Le cadre distingue quatre types d’équipes
    selon leur contribution au flux de valeur. Une plateforme se pilote comme un produit interne. Une équipe Enabling
    accompagne les autres équipes vers l’autonomie.
  mode_filter: Filtrer les interactions par mode
  all_modes: Tous les modes
  relationship_contracts: Contrats de toutes les interactions proposées
  graph_gestures: Sélectionner le nom d’une équipe pour lire sa mission, ou un symbole pour examiner une interaction.
    Déplacer le fond pour parcourir le schéma. Utiliser + et − pour zoomer.
  graph_reset: Recadrer
