    pas leur configuration ni leurs inclusions.
  meaning: Le choix ERP Backbone / Suite intégrée reste indéterminé au stade du RFI. Les OSS sont des références comparables,
    pas des options Make adoptées supplémentaires. Une Business Area rassemble des constats partiels et ne reçoit
    aucun score de couverture.
reading:
  title: Comparer les solutions par Business Area
  intro: '**Une même grille pour les six solutions.** Les briques documentées et les réponses du RFI sont rapprochées
    des besoins FLOW. Les écarts restent visibles, sans être transformés automatiquement en supplément de coût.'
  scope: Le tableau suit le périmètre de la cartographie métier. Financial Services et deux capacités d’Inventory
    State Management restent hors de la comparaison.
  limits: '**Un montant adopté ne démontre pas une couverture complète.** La couverture sectorielle, les adaptations
    et les inclusions commerciales restent à qualifier. Le supplément net est inconnu après rapprochement des travaux
    déjà financés.'
  source_limit: Une pièce référencée peut ne pas être proposée à la consultation dans l’application.
  proof_limit: Une documentation produit ou une déclaration fournisseur ne remplace pas la recette du scénario FLOW.
  funding_limit: Ces mécanismes sont des financements candidats à rapprocher. Ils ne prouvent pas l’inclusion de tout
    le complément et ne créent pas de nouveaux budgets.
  mapping_note: Rapprochements proposés et non revus. Un passage du RFI ne décrit pas nécessairement toute la cible
    FLOW.
