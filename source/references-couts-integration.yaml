    minimum_ancres_eur_2026: 7008885
    maximum_ancres_eur_2026: 19427901
    plage_arrondie_m_eur_2026:
      min: 7
      max: 20
    verite_transposition_flow_beaumanoir: 0
    usage: Signal d'audit uniquement pour des budgets de grands programmes SAP. Se situer hors de 7 à 20 M EUR appelle
      une explication de périmètre et de responsabilités ; rester dans la plage ne valide aucun budget. Cette sélection
      SAP/public ne sert pas de plancher applicable à Microsoft ou à Make.
  contrepoints_dynamics:
    selection: 'Montants externes Dynamics de projets entiers plutôt que d''un module isolé : MTC contractuel et composites
      Forrester 2026 et 2018. Les deux composites sont des modèles commandés par Microsoft, non des devis.'
    references_ids:
    - forrester-d365-erp-2026
    - mtc-d365-2022
    - forrester-d365-fo-2018
    minimum_eur_2026: 1517180
    maximum_eur_2026: 14294386
    verite_transposition_flow_beaumanoir: 0
    usage: 'La très large amplitude contredit l''emploi de la seule plage SAP/public comme fourchette générale du marché.
      Le composite Forrester 2026 ne compte que 1,7 M USD externes mais 2,619 M USD internes de mise en œuvre : le partage
      des travaux avec le client est décisif. Aucun coût interne n''est ajouté à la comparaison externe de l''étude.'
  pont_requis_pour_une_fourchette_flow:
  - Quantifier les livrables publiés absents du périmètre FLOW à retrancher.
  - Quantifier les livrables FLOW absents des prix publiés à ajouter.
  - Rapprocher volumes, interfaces, données, pays, déploiements et responsabilités.
  - Distinguer prix attribué, estimation avant consultation et modèle composite.
  - Confronter les scénarios ainsi obtenus aux JH et TJM externes du modèle.
