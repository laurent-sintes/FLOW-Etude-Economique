      traitement: Estimation préconsultation du design et du build, non prix attribué.
    - reference_id: eweb-s4-2023
      montant_min_eur_2026: 15940049
      montant_max_eur_2026: 15940049
      traitement: Plafond de contrat Deloitte attribué pour l'intégration initiale, hors direction de programme achetée
