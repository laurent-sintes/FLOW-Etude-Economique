brief:
  title: L’étude Synvance en bref
  introduction: '**Un besoin commun, deux finalistes et une sélection à poursuivre.** Synvance a structuré le besoin
    et la confrontation au marché.'
  questions:
  - id: demande
    question: Qu’est-ce qui a été demandé ?
    answer: Choisir un ERP Achat / Vente commun pour remplacer Storeland côté Beaumanoir et SAP côté Boardriders,
      connecté aux applications spécialistes du Groupe.
    proof_refs:
    - demande-contexte
  - id: perimetre
    question: Sur quel périmètre ?
    answer: 'France et Europe : achats, approvisionnements, stocks, allocations, magasins, e-commerce, Wholesale,
      livraisons et retours. Finance hors choix initial, sauf administration des ventes ; l’offre SAP comprend néanmoins
      des travaux Finance.'
    proof_refs:
    - demande-objectif
    - demande-perimetre
    - copil-conclusion
  - id: calendrier
    question: Quand l’étude a-t-elle eu lieu ?
    answer: Consultation du 28 mai au 18 juin 2025. Mission Synvance clôturée le 4 juillet ; échanges poursuivis
      par Beaumanoir jusqu’au COPIL du 17 septembre.
    proof_refs:
    - demande-calendrier
    - copil-avancement
  - id: resultats
    question: Quels sont les résultats ?
    answer: 'Des besoins formalisés, une grille d’évaluation, des réponses fonctionnelles et techniques, et des
      estimations. Deux finalistes : Microsoft / Avanade / K3 et SAP / Delaware.'
    proof_refs:
    - copil-selection
    - copil-avancement
  - id: avancement
    question: Où en était-on à la dernière restitution ?
    answer: 'Au 17 septembre 2025 : pré-cadrage recommandé avec les deux fournisseurs pour préciser processus complexes,
      adaptations, déploiement, ressources et budget.'
    proof_refs:
    - copil-conclusion
  - id: choix
    question: Qui a gagné ?
    answer: '**Aucun choix définitif documenté.** SAP est le « maître étalon », Microsoft l’alternative. Le COPIL
      recommande de poursuivre avec les deux ; les pièces disponibles s’arrêtent à cette recommandation.'
    proof_refs:
    - copil-selection
    - copil-conclusion
    - demande-selection
  highlights:
    title: Les points saillants de l’étude
    items:
    - '**La convergence métier précède le choix logiciel.** Processus communs, équipe métier dédiée et centre de
      compétences conditionnent la réussite.'
    - '**Les deux finalistes demandent des adaptations.** Saisons, variantes, allocations et réassort restent des
      sujets sensibles.'
    - '**Des compromis différents.** Le COPIL souligne les références Fashion de SAP et son coût projet élevé ;
      pour Microsoft/K3, le coût projet peut être sous-évalué et les références comparables restent à confirmer.'
    proof_refs:
    - copil-conclusion
    - copil-projet
    - copil-couverture
    - demande-contexte
business:
  title: Périmètre et architecture proposés
  introduction: '**Les pièces examinées ne permettent pas de rattacher Microsoft ou SAP à un pattern.** Le critère
    est la persistance des commandes et du stock spécifiques aux canaux.'
  architectures:
  - id: backbone
    title: Pattern 1 — ERP Backbone
    text: '**Les applications de canaux persistent leurs commandes et leur stock spécifiques.** L’ERP porte les
      opérations communes et échange avec elles ; une vision Groupe peut être consolidée.'
    systems:
    - ERP Backbone · opérations communes et consolidation
    - Application magasin · commandes et stock propres
    - Application B2C · commandes et stock propres
  - id: suite
    title: Pattern 2 — Suite intégrée
    text: '**L’ERP est l’unique gestionnaire des commandes et du stock unifié.** Les applications de canaux s’appuient
      sur ces états métier, sans gérer leurs propres commandes et stocks autonomes.'
    systems:
    - ERP · persistance des commandes et du stock unifié
    - Applications magasin / B2B · accès aux états ERP
    - Applications B2C · accès aux états ERP
  architecture_note: '**Un OMS vendu seul et utilisable sans ERP est un indice en faveur du pattern ERP Backbone.**
    Il faut confirmer que ce fonctionnement est retenu et que les canaux portent leur propre persistance.
    **Une vue de stock unifiée ne prouve pas une persistance unique.**'
  architecture_proof_refs:
  - demande-contexte
  - demande-architecture
  oms:
    title: Comparer les solutions OMS B2C
    introduction: '**La comparaison porte sur la promesse client, le partage du stock et la préparation des commandes.**
      Le fonctionnement actuel rapporté repose sur un OMS autonome.'
    note: Les offres de 2025 établissent les composants inclus. Les documentations produit consultées le 30 octobre
      2026 précisent les fonctions et limites actuelles ; elles ne prouvent pas les parcours effectivement prévus
      et financés en 2025.
    proof_refs:
    - sap-composants
    - microsoft-abonnements
    - microsoft-canaux
    - microsoft-stocks
    - microsoft-perimetre
    product_sources:
    - label: SAP — périmètre fonctionnel OMSA (10 avril 2026)
      href: https://help.sap.com/doc/08442b9d2cd744f7aecc1e08080c26f3/SHIP/en-US/FSD_SAP_OMSA.pdf
    - label: SAP — alimentation d’OMSA depuis des systèmes SAP et non-SAP
      href: https://help.sap.com/docs/SAP_Order_Management_for_Sourcing_and_Availability/b1914f5958b54a148b2b7580550ef9a5/f06cbc74f4c34a9e8e3a74adb8d6d0b9.html
    - label: Microsoft — fonctions DOM de Commerce
      href: https://learn.microsoft.com/en-us/dynamics365/commerce/dom
    - label: Microsoft — intégration de Commerce avec Dynamics 365
      href: https://learn.microsoft.com/en-us/dynamics365/commerce/dev-itpro/commerce-architecture
    - label: Microsoft — traitement DOM par lots
      href: https://learn.microsoft.com/en-us/dynamics365/commerce/dom-processing
    - label: Microsoft — limites DOM et préparation en entrepôt
      href: https://learn.microsoft.com/en-us/dynamics365/commerce/dom-limitations
    labels:
      criterion: Critère commun
      microsoft: Microsoft / Avanade
      sap: SAP / Delaware
      decision: Conséquence pour le Groupe
    conclusion: '**Microsoft : Commerce inclus, scénario DOM à préciser. SAP : OMSA explicitement inclus avec S/4.**
      Dans les deux cas, le choix de l’OMS est lié à l’écosystème ERP proposé.'
    rows:
    - id: solution
      criterion: Solution proposée
      microsoft: '**Commerce est inclus.** DOM optimise le choix des sites de préparation ; le scénario prévu au
        projet n’est pas arrêté dans les pièces.'
      sap: '**OMSA est inclus**, avec un lien natif annoncé vers l’Available to Promise de S/4.'
      decision: '**Le choix OMS engage aussi l’architecture ERP.** Il influence les composants exploités, les interfaces
        et les responsabilités de fonctionnement.'
      proof_refs:
      - microsoft-abonnements
      - sap-composants
    - id: integration
      criterion: Lien avec l’ERP et autonomie
      microsoft: '**DOM est une fonction de Commerce, intégrée au back-office Dynamics 365.** Finance, Supply Chain
        Management et Commerce partagent leurs données de back-office.'
      sap: '**L’offre Delaware relie OMSA à l’ATP S/4.** Le produit accepte aussi des sources SAP et non-SAP ; cela
        ne démontre pas un OMS complet fonctionnant sans ERP.'
      decision: '**Découpler les canaux de l’ERP engage les données, les interfaces et les responsabilités.** L’autonomie
        doit couvrir la gestion des commandes et du stock, au-delà du seul choix du site de préparation.'
      proof_refs:
      - microsoft-canaux
      - sap-composants
    - id: disponibilite
      criterion: Disponibilité, réservation et promesse
      microsoft: '**Stock consolidé à partir des mouvements WMS et magasins.** Inventory Visibility reste une option
        ; DOM ne décrit pas à lui seul la promesse à l’achat.'
      sap: '**Disponibilité, réservations et sourcing dans OMSA**, articulés à la promesse de S/4 selon les règles
        retenues.'
      decision: '**Le partage d’un même stock entre canaux conditionne la promesse client.** Les réservations doivent
        rester cohérentes avec les autres ventes et le stock vendable.'
      proof_refs:
      - microsoft-stocks
      - sap-composants
    - id: sourcing
      criterion: Choix du lieu de préparation
      microsoft: '**DOM optimise les sources de préparation** selon les stocks, coûts, distances et règles de service.'
      sap: '**OMSA calcule des stratégies de sourcing** selon les sites, délais, capacités, coûts et contraintes.'
      decision: '**Préparer en magasin ou en entrepôt devient un arbitrage coût / service.** Le choix change le
        délai de livraison, les frais et la charge des équipes.'
      proof_refs:
      - microsoft-abonnements
      - sap-composants
    - id: cadence
      criterion: Cadence et délai de décision
      microsoft: '**DOM s’exécute par traitements planifiés.** La fréquence du traitement détermine son rythme de
        décision.'
      sap: '**Aucun temps de réponse chiffré n’est garanti par les pièces examinées.** Le lien natif ATP est annoncé.'
      decision: '**Avec DOM, la commande peut attendre le prochain traitement avant optimisation.** Ce délai compte
        dans l’engagement de service ; promesse à l’achat et affectation logistique sont deux moments distincts.'
      proof_refs:
      - microsoft-perimetre
      - sap-composants
    - id: exceptions
      criterion: Modifications, annulations et exceptions
      microsoft: '**La réaffectation dépend de l’avancement de préparation** et des contraintes WMS. Les parcours
        repris ne sont pas détaillés.'
      sap: '**Le cycle complet de commande n’est pas établi par l’inclusion d’OMSA.** Modifications, exceptions
        et retours restent à préciser avec S/4.'
      decision: '**Le choix de l’OMS détermine où traiter les changements de commande.** Service client, magasin
        et entrepôt sont concernés par les annulations et réaffectations.'
      proof_refs:
      - microsoft-perimetre
      - sap-composants
    - id: canaux
      criterion: Magasins, e-commerce et marketplaces
      microsoft: '**Interfaces Cegid Y2 et Univers Retail prévues.** L’usage de Commerce Scale Unit pour les POS
        et l’e-commerce est présenté comme une opportunité.'
      sap: '**OMSA et back-office magasin inclus.** Interfaces magasin prévues ; encaissement et moteur de réassort
        hors chiffrage.'
      decision: '**Une cohabitation avec les outils magasin demeure prévue.** Inclure un OMS ou un back-office ne
        signifie pas remplacer tous les outils des canaux.'
      proof_refs:
      - microsoft-canaux
      - sap-magasin
      - sap-reassort
      - sap-flux-cible
    - id: cout
      criterion: Coût OMS identifiable dans l’offre
      microsoft: '**Commerce est dans le panier Dynamics 365 / K3.** Aucun prix propre à l’OMS / DOM n’est isolé.'
      sap: '**OMSA est dans le panier SAP.** Aucun prix propre à l’OMS n’est isolé.'
      decision: '**L’arbitrage économique porte sur un ensemble licences et intégration.** Les pièces ne permettent
        pas de comparer deux prix d’OMS autonomes.'
      proof_refs:
      - microsoft-abonnements
      - sap-abonnements
      - sap-composants
    open_points_title: Arbitrages et vérifications à finaliser
    open_points:
    - '**Autonomie de l’OMS :** distinguer licence séparée, fonctionnement sans ERP et persistance autonome des
      commandes et du stock dans le scénario proposé.'
    - '**Scénario Microsoft :** confirmer l’usage de DOM, de Commerce Scale Unit et, le cas échéant, d’Inventory
      Visibility.'
    - '**Promesse et délais :** fixer la fraîcheur des stocks, les réservations concurrentes, les protections par
      canal et les temps de décision attendus.'
    - '**Cycle de commande :** répartir entre composants et équipes les modifications, annulations, réaffectations,
      exceptions et retours.'
    - '**Périmètre des canaux :** arrêter les outils et écrans conservés, les parcours repris et les raccordements
      aux sites et marketplaces.'
  comparison_title: Les fonctions effectivement proposées, par domaine
  comparison_note: '**Périmètre offert, fonction du catalogue et remplacement d’un outil sont distincts.** Les éléments
    ci-dessous proviennent des réponses de 2025.'
  labels:
    topic: Sujet métier
    request: Direction donnée par la consultation
    microsoft: Microsoft / Avanade / K3
    sap: SAP / Delaware
  axes:
  - id: architecture
    topic: Architecture de la plateforme
    request: '**Identifier le gestionnaire de la persistance**, pour les commandes et le stock de chaque canal.
      La présence des données dans l’ERP ne démontre pas son exclusivité.'
    microsoft: '**Pattern non établi.** Les interfaces, Commerce inclus et la vue consolidée du stock ne fixent
      pas les responsabilités de persistance des applications de canaux.'
    sap: '**Pattern non établi.** S/4, OMSA et le back-office magasin sont inclus, sans preuve d’un gestionnaire
      unique des commandes et du stock unifié.'
    proof_refs:
    - demande-architecture
    - microsoft-abonnements
    - microsoft-canaux
    - sap-composants
    - sap-magasin
  - id: stocks
    topic: Stocks entrepôt et magasin
    request: '**Stocks logiques et physiques dans l’ERP**, en lien avec entrepôts et magasins, avec rapprochement
      des écarts.'
    microsoft: '**Vue consolidée des mouvements annoncée presque en temps réel.** Inventory Visibility reste une
      option d’architecture à discuter.'
    sap: '**Stocks par entrepôt et magasin annoncés.** La gestion des stocks physiques multiples est renvoyée aux
      WMS externes ; la frontière reste à clarifier.'
    proof_refs:
    - besoins-stocks
    - microsoft-stocks
    - sap-stocks
  - id: retail
    topic: Retail — magasin et réseau
    request: '**Articles, prix, stocks, allocations, réassort et retours.** Le remplacement du système de caisse
      n’est pas demandé.'
    microsoft: '**Assortiments, allocations et équilibrage des stocks présentés.** Interfaces Cegid Y2 / Univers
      Retail prévues ; adaptations du réassort.'
    sap: '**Back-office magasin inclus pour les stocks et retours.** Encaissement et moteur de réassort hors chiffrage
      ; SAP CAR Allocation Management exclu.'
    proof_refs:
    - sap-flux-cible
    - demande-carte
    - besoins-reassort
    - microsoft-magasin
    - microsoft-canaux
    - microsoft-reassort
    - sap-magasin
    - sap-reassort
    - sap-composants
  - id: b2c
    topic: B2C — e-commerce et marketplaces
    request: '**Commandes e-commerce détaillées dans l’ERP.** Les marketplaces sont des canaux à raccorder, sans
      projet de remplacement des sites établi.'
    microsoft: '**Commerce, E-commerce Tiers 3 et Scale Unit inclus dans le panier.** Leur usage sur les canaux
      existants reste à arrêter.'
    sap: '**OMSA inclus avec S/4.** La proposition ne suffit pas à établir le remplacement des sites ou une nouvelle
      plateforme marketplace.'
    proof_refs:
    - besoins-b2c
    - besoins-marketplaces
    - microsoft-abonnements
    - sap-composants
  - id: oms-b2c
    topic: OMS B2C
    request: L’ERP doit connaître les commandes B2C détaillées et gérer les allocations. Ces exigences ne désignent
      pas à elles seules le système responsable de tout le cycle de commande ni un produit OMS à remplacer.
    microsoft: Dynamics 365 Commerce est la solution proposée, avec DOM pour optimiser le choix des sites de préparation
      et une intégration standard au back-office Dynamics 365. Vérifier le scénario DOM effectivement prévu, sa
      cadence par lots, les réaffectations après début de préparation et la couverture des parcours dans l’intégration.
    sap: OMSA est la solution OMS incluse, en lien natif avec l’Available to Promise de S/4. Les règles de promesse,
      les commandes réparties entre sites, les modifications, les exceptions et les retours restent à vérifier sur
      les parcours du Groupe, avec leur prise en charge dans l’intégration.
    proof_refs:
    - besoins-b2c
    - microsoft-abonnements
    - microsoft-canaux
    - microsoft-perimetre
    - sap-composants
  - id: b2b
    topic: B2B — Wholesale
    request: '**Clients, conditions commerciales et cycle de commande Wholesale**, jusqu’à l’expédition, la livraison
      et le retour.'
    microsoft: '**Dynamics 365 et K3 Fashion pour le Wholesale.** Adaptations des commandes et allocations ; portail
      B2B autonome non établi.'
    sap: '**S/4 Fashion SD et Allocation Management inclus.** Commandes Wholesale, segmentation, pénuries et priorités
      par canal ; portail B2B autonome non établi.'
    proof_refs:
    - demande-perimetre
    - besoins-b2c
    - copil-couverture
    - sap-wholesale
  others_title: Et les autres solutions étudiées ?
  others_introduction: Le panel a été resserré avant la comparaison finale. Les pièces de synthèse ne permettent
    pas de reconstituer une architecture détaillée pour ces candidats.
  others:
  - id: odoo
    title: Odoo
    text: Écarté dans les préconisations pour le poids des besoins hors standard.
    proof_refs:
    - copil-selection
  - id: orisha
    title: Orisha
    text: Écarté dans les préconisations pour le poids des besoins hors standard.
    proof_refs:
    - copil-selection
  - id: sei
    title: SEI
    text: L’écart de prix avec Microsoft est jugé insuffisant pour compenser le risque projet.
    proof_refs:
    - copil-selection
  - id: infor
    title: Infor
    text: Les échanges n’ont pas permis son intégration à la restitution finale de septembre.
    proof_refs:
    - copil-avancement
  pattern_reading:
    title: Où les offres placent-elles la persistance des commandes et du stock ?
    note: '**Le nombre de composants ou leur intégration ne détermine pas le pattern.** Commerce, OMSA ou un back-office
      magasin peuvent être présents sans que les pièces établissent qui conserve et gère les états métier de chaque
      canal.'
    providers:
    - id: microsoft
      pattern_ref: null
      summary: '**Commandes : persistance côté canal non établie.** Commerce inclus et interfaces POS prévues ne
        disent pas qui conserve et met à jour cet état métier.'
      scope: '**Stock : persistance côté canal non établie.** La remontée de mouvements vers D365 décrit une consolidation
        ; Inventory Visibility reste une option.'
      proof_refs:
      - microsoft-abonnements
      - microsoft-canaux
      - microsoft-stocks
      - besoins-b2c
    - id: sap
      pattern_ref: null
      summary: '**Commandes : persistance côté canal non établie.** S/4 Fashion SD et OMSA sont inclus, sans localisation
        explicite de cet état métier pour chaque canal.'
      scope: '**Stock : exclusivité ERP non établie.** Stock magasin dans S/4 et interfaces POS sont décrits ; la
        persistance propre des applications de canaux n’est pas précisée.'
      proof_refs:
      - sap-wholesale
      - sap-composants
      - sap-magasin
      - sap-stocks
      - sap-reassort
    undetermined_label: Pattern non établi par les pièces examinées
overview:
  title: Les acquis et les propositions à consulter
  introduction: '**Une connaissance des besoins du Groupe et une première confrontation aux solutions du marché.**
    Synvance a apporté son expérience du secteur de la mode à l’étude des besoins. Les documents issus de la consultation
    permettent de comprendre ce qui a été demandé, ce que les fournisseurs proposent et comment ils envisagent l’intégration
    dans le Groupe. Pour FLOW, ces acquis servent à examiner aussi bien l’achat d’une solution que la construction
    d’un Core System maîtrisé par Beaumanoir.'
  inputs:
  - piece_ref: demande
    label: Un contexte et un périmètre de consultation
    text: Le cadre de la consultation expose les objectifs et les frontières de la demande. Il permet de replacer
      les réponses fournisseur dans leur contexte d’origine.
  - piece_ref: besoins
    label: Une expression des besoins métier
    text: Les besoins étudiés donnent une matière commune pour interroger les solutions. FLOW la rapproche de la
      cartographie métier pour préciser le périmètre du Core System.
  - piece_ref: questionnaire_microsoft
    label: Une réponse détaillée sur la solution Microsoft
    text: Le questionnaire décrit la couverture annoncée, les modalités de déploiement et les responsabilités proposées.
      Il aide à identifier les travaux que le Groupe et son partenaire auraient à prendre en charge.
  - piece_ref: questionnaire_sap
    label: Une réponse détaillée sur la solution SAP
    text: Le questionnaire documente les fonctions annoncées, les outils conservés et les interfaces envisagées.
      Il aide à repérer les inclusions, les exclusions et les sujets à approfondir avec le fournisseur.
  proposals_title: Les propositions et leurs premiers repères de coût
  proposals_introduction: '**Les propositions traduisent ces réponses en prestations, abonnements et trajectoires
    de déploiement.** Microsoft part d’un pilote, puis d’une généralisation aux autres pôles ; SAP propose la convergence
    des socles Boardriders et Beaumanoir vers un Core commun. Les chiffres ci-dessous se lisent avec ces différences
    de périmètre.'
  cards:
  - id: microsoft
    title: Microsoft / Avanade / K3
    description: Le comité de pilotage (COPIL) reprend le montant d’un pilote et projette les autres pôles. Avanade
      décrit le pilote à titre indicatif.
    highlights:
    - row_ref: total-copil
      label: Prestations projetées au COPIL
    note: Les abonnements et le support initial figurent séparément dans le détail.
    link_label: Voir le détail Microsoft
  - id: sap
    title: SAP / Delaware
    description: La proposition détaille les travaux Finance, la migration du socle Boardriders et le déploiement
      Beaumanoir.
    highlights:
    - row_ref: somme-lots
      label: Somme des lots documentés
    note: Le total imprimé diffère de la somme des lots. Le détail rend cet écart visible.
    link_label: Voir le détail SAP
  warning: '**Ces montants décrivent des périmètres différents.** Les hypothèses de comparaison, les compléments
    FLOW et les budgets retenus se lisent dans le dossier économique.'
