      entries: []
      proof_refs: []
  - structure_ref: integration
    model_scope: Offre ou projection Groupe et compléments de qualification/support initial retenus. Le périmètre
      Finance SAP reste conservé dans le budget Buy.
    model_display: amount
    comparison: Microsoft projette un pilote et les autres pôles ; SAP chiffre des lots de convergence incluant
      de la Finance. Les écarts de périmètre restent à traiter.
    microsoft:
      status: Projection Groupe du COPIL
