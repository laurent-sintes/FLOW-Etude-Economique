  - structure_ref: operations_support
    model_scope: Les services d’assistance et d’exploitation Buy restent regroupés dans les contrats et services
      retenus ; ils ne sont pas financés une deuxième fois.
    model_display: bundled
    comparison: Le support Microsoft initial est ponctuel ; le monitoring SAP est annuel après stabilisation. Ces
      deux prix ne désignent pas le même service.
    microsoft:
      status: Support initial ponctuel
