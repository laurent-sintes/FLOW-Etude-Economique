documents:
  title: Consulter les pièces originales
  introduction: Cinq PDF et deux questionnaires, dans leur format d’origine.
usage:
  title: Ce que FLOW reprend de ces travaux
  introduction: '**Les acquis de Synvance restent utiles quel que soit le choix de solution.** Ils donnent une base
    documentée pour comparer l’achat d’un produit et la construction d’un Core System.'
  paragraphs:
  - '**Pour acheter une solution**, les réponses et les offres permettent d’examiner la couverture métier, les prestations
    incluses et les responsabilités du Groupe et de l’intégrateur.'
  - '**Pour construire le Core System**, les besoins étudiés et les réponses sur l’intégration aident à identifier
    les fonctions et les travaux à prévoir. Les efforts de construction restent à évaluer pour FLOW.'
  - '**Pour décider**, FLOW rapproche ces éléments de la cartographie métier, explicite les différences de périmètre
    et les points à préciser, puis construit la comparaison économique. Une fonction annoncée doit être vérifiée
    avec le fournisseur, tout comme son inclusion dans le prix proposé.'
  links:
  - href: '#vision'
    label: Comprendre la stratégie d’estimation
    text: La Vision présente la matrice Make / Buy et Build / Run.
