    year: Année tarifaire
    price_year: Prix de
    amount: Montant (k€ HT)
    total: Total du modèle sur l’horizon
    years: ans
    horizon: Horizon commun depuis le départ du projet
    bundled: Dans les contrats groupés — part non ventilée
    model_amount: Montant financé par le modèle
