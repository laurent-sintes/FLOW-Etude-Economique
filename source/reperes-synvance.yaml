synthesis:
  title: Les données documentées
  introduction: >-
    **Les prix conservent leur date et leurs conditions d’origine.** Ils sont présentés
    sans actualisation ni compléments FLOW.
  integration_title: Lire les prestations initiales
  integration_note: Chaque montant conserve son origine — ligne de l’offre, projection du comité ou rapprochement arithmétique. Les montants récapitulatifs ne s’ajoutent pas aux lignes détaillées. Les rapprochements utilisent les montants non arrondis ; l’affichage est arrondi au k€.
  annual_title: Lire les abonnements et services
  annual_note: >-
    **Les années numérotées sont celles de l’offre, pas des années civiles du calendrier FLOW.**
    Les forfaits annuels se lisent selon la période indiquée pour chaque poste.
    Seuls les prix documentés sont présentés, sans prolongation ni indexation.
    Les contrats groupés peuvent réunir du Build et du Run sans répartition connue.
  providers:
  - id: microsoft
    title: Microsoft / Avanade / K3
    context:
      title: Identifier le périmètre Microsoft
      lead: '**Avanade décrit un pilote ; le comité de pilotage (COPIL) projette les autres pôles.**'
      items:
      - La consultation de 2025 porte sur les besoins du Groupe. La Finance est hors demande, sauf les besoins d’administration des ventes.
      - La proposition et le questionnaire précisent la couverture déclarée et les responsabilités. Une fonction annoncée ne garantit pas son inclusion dans le prix.
    integration:
      intro: >-
        **Le tableau reprend les montants du COPIL.** La proposition Avanade donne séparément
        une fourchette indicative pour le pilote, consultable dans la pièce. La projection
        des autres pôles reste à préciser avec le fournisseur.
      rows:
      - id: pilote-copil
        label: Pilote repris au COPIL
        binding: post:0
        period: Pilote
        status: Projection du comité de pilotage
        scope: Pilote retenu dans la comparaison du comité. La proposition Avanade en détaille les phases et la fourchette indicative.
        proof_refs: [copil-prix, microsoft-pilote]
      - id: poles-copil
        label: Autres pôles
        binding: post:1
        period: Généralisation Groupe
        status: Projection du comité de pilotage
        scope: Déploiement au-delà du pilote. Les vagues, adaptations et responsabilités restent à préciser.
        proof_refs: [copil-prix, microsoft-deploiements]
      - id: total-copil
        label: Ensemble projeté au COPIL
        binding: printed
        period: Pilote et autres pôles
        status: Total publié par le comité
        scope: Récapitulatif du pilote et des autres pôles, hors abonnements.
        proof_refs: [copil-prix]
    annual:
      intro: '**Les abonnements et le support initial sont deux postes distincts.** Le support est documenté pour la première année seulement.'
      rows:
      - id: licences
        label: Abonnements Dynamics 365 / K3 et hébergement standard
        post_ref: MAI-010/licences
        period: Années tarifaires documentées de l’offre
        scope: Droits d’usage, maintien du standard et infrastructure proposés, dont Finance et Commerce. Le prix n’est pas détaillé par composante.
        proof_refs: [microsoft-abonnements]
      - id: support-initial
        label: Support initial et conseil qualité (Unified + Project Quality advisory)
        post_ref: MAI-013/outillage-support
        period: Première année de l’offre seulement
        scope: La pièce ne documente ni le renouvellement de ce support ni une couverture complète de la maintenance des adaptations.
        proof_refs: [microsoft-support]
  - id: sap
    title: SAP / Delaware
    context:
      title: Identifier le périmètre SAP
      lead: '**Delaware propose trois lots de convergence, dont des travaux Finance.**'
      items:
      - L’offre distingue la Finance, la migration du socle Boardriders et le déploiement Beaumanoir. La consultation de 2025 exclut la Finance, sauf les besoins d’administration des ventes.
      - Le questionnaire précise la couverture déclarée et les responsabilités. Les inclusions et réserves de chaque lot restent celles de la proposition.
    integration:
      intro: >-
        **La somme des trois lots diffère du total imprimé.** Le tableau distingue
        les lignes de l’offre, leur somme et l’écart à clarifier avec le fournisseur.
        Cet écart ne désigne pas une prestation supplémentaire et ne préjuge pas de la capacité du produit à répondre au besoin.
      rows:
      - id: upgrade-finance
        label: Mise à niveau Finance (Upgrade Finance)
        binding: post:0
        period: Lot initial
        status: Ligne de la proposition Delaware
        scope: Travaux Finance figurant dans la proposition, à distinguer du périmètre commun de {{notion.supply_chain_management}}.
        proof_refs: [sap-lots]
      - id: boardriders
        label: Migration du socle Boardriders
        binding: post:1
        period: Lot de convergence
        status: Ligne de la proposition Delaware
        scope: Travaux de migration et de convergence du socle Boardriders décrits par l’offre.
        proof_refs: [sap-lots]
      - id: beaumanoir
        label: Déploiement Beaumanoir
        binding: post:2
        period: Lot de déploiement
        status: Ligne de la proposition Delaware
        scope: Déploiement et adaptations décrits dans les lots de l’offre.
        proof_refs: [sap-lots]
      - id: somme-lots
        label: Somme des trois lots
        binding: sum
        period: Ensemble des lots ci-dessus
        status: Lecture arithmétique des lignes
        scope: Addition des trois montants détaillés ci-dessus.
        proof_refs: [sap-lots]
      - id: total-imprime
        label: Total imprimé dans la proposition
        binding: printed
        period: Ligne « Total »
        status: Montant imprimé à clarifier
        scope: Montant inscrit dans la pièce, à rapprocher de la somme des lots.
        proof_refs: [sap-lots]
      - id: ecart-total
        label: Écart entre total imprimé et somme des lots
        binding: difference
        period: Rapprochement des montants
        status: Écart documentaire
        scope: Total imprimé moins la somme des lots. Le fournisseur doit expliquer cette différence.
        proof_refs: [sap-lots]
    annual:
      intro: '**Les licences suivent une séquence tarifaire ; les services ont leurs propres périodes.** Les forfaits ci-dessous indiquent des prix annuels de référence.'
      rows:
      - id: licences
        label: Licences SAP et hébergement standard
        post_ref: MAI-010/licences
        period: Années tarifaires documentées de l’offre
        scope: Licences et infrastructure SAP à capacité évolutive. Les réserves sur le stockage et le plan de reprise après sinistre (DRP) restent à clarifier.
        proof_refs: [sap-abonnements]
      - id: mco
        label: Maintien en condition opérationnelle (forfait MCO)
        post_ref: rfi-mco
        period: Prix annuel après stabilisation
        scope: Forfait hors évolutions ; le détail contractuel des responsabilités et des activités couvertes reste à préciser.
        proof_refs: [sap-services]
      - id: monitoring
        label: Surveillance des flux (Monitoring des flux)
        post_ref: rfi-monitoring
        period: Prix annuel après stabilisation
        scope: Surveillance en horaires étendus. L’inclusion de la maintenance et des modifications des contrats de flux reste à confirmer.
        proof_refs: [sap-services]
      - id: evolutions
        label: Maintenance évolutive proposée (TMA évolutive)
        post_ref: rfi-evolutions
        period: Enveloppe annuelle de référence
        scope: Enveloppe d’évolutions proposée ; son équivalence avec le portefeuille d’évolutions FLOW n’est pas démontrée.
        proof_refs: [sap-services]
documents:
  title: Consulter les pièces originales
  introduction: '**Retrouver les preuves dans leur format d’origine.** Les cinq PDF et les deux questionnaires sont consultables ou téléchargeables ci-dessous.'
usage:
  title: Passer des sources à l’estimation
  introduction: '**Le Framework explique le traitement des sources ; le dossier économique présente les choix et les résultats.**'
  paragraphs:
  - '**Pour Buy**, les offres donnent des prix, des périmètres et des séquences. L’analyse des inclusions et des écarts permet d’identifier les compléments nécessaires.'
  - '**Pour Make**, certains repères Avanade éclairent les interfaces et les déploiements. Le budget est construit à partir des travaux propres à FLOW et au Groupe.'
  - '**La cartographie métier fixe le besoin commun** et sert à challenger les deux approches.'
  links:
  - href: '#vision'
    label: Comprendre la stratégie d’estimation
    text: La Vision présente la matrice Make / Buy et Build / Run.
  - href: '#marche'
    label: Comprendre le traitement des sources
    text: La méthode explique comment qualifier périmètre, prix et preuves.
  - href: '#etude-marche'
    label: Lire les analyses des offres
    text: Le dossier économique présente les écarts et points à instruire.
  - href: '#evaluation-core'
    label: Voir les évaluations économiques
    text: Les budgets incluent les choix de l’étude et les compléments retenus.
