  introduction: '**Deux lectures, une même structure à sept postes.** Les offres reçues montrent ce qui est documenté
    en 2025. Le modèle ajoute les travaux et moyens retenus dans l’étude, puis applique les calendriers et l’indexation.
    Les montants reçus et les budgets du modèle restent identifiables.'
