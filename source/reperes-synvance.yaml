overview:
  title: Partir du besoin et des réponses reçues
  introduction: >-
    **Synvance apporte un contexte métier et des réponses sur l’intégration, au-delà du choix d’un éditeur.**
    La consultation documente les besoins du Groupe ; propositions et questionnaires décrivent
    la couverture déclarée, les travaux et les responsabilités envisagées.
    Ces acquis servent à challenger **Make comme Buy**, avec la cartographie pour vérifier le périmètre.
  inputs:
  - piece_ref: demande
    label: Lire le cadre de la consultation
    text: Identifier le contexte, les objectifs et les limites de la demande transmise aux fournisseurs.
  - piece_ref: besoins
    label: Consulter les besoins étudiés
    text: Retrouver la matière métier de départ. Elle reste à rapprocher du périmètre de cartographie retenu pour FLOW.
  - piece_ref: questionnaire_microsoft
    label: Examiner les réponses Microsoft
    text: Vérifier couverture déclarée, modalités d’intégration et responsabilités proposées, sans confondre fonction annoncée et prestation incluse.
  - piece_ref: questionnaire_sap
    label: Examiner les réponses SAP
    text: Appliquer la même lecture des écarts, inclusions, interfaces et responsabilités à la proposition SAP.
  proposals_title: Lire ensuite les deux propositions
  proposals_introduction: '**Microsoft part d’un pilote ; SAP propose des lots de convergence.** Chaque dossier détaille les prestations initiales, puis les abonnements et services.'
  cards:
  - id: microsoft
    title: Microsoft / Avanade / K3
    description: Le comité de pilotage (COPIL) reprend le montant d’un pilote et projette les autres pôles. Avanade décrit le pilote à titre indicatif.
    highlights:
    - row_ref: total-copil
      label: Prestations projetées au COPIL
    note: Les abonnements et le support initial figurent séparément dans le détail.
    link_label: Voir le détail Microsoft
  - id: sap
    title: SAP / Delaware
    description: La proposition détaille les travaux Finance, la migration du socle Boardriders et le déploiement Beaumanoir.
    highlights:
    - row_ref: somme-lots
      label: Somme des lots documentés
    note: Le total imprimé diffère de la somme des lots. Le détail rend cet écart visible.
    link_label: Voir le détail SAP
  warning: >-
    **Ces montants décrivent des périmètres différents.** Les hypothèses de comparaison,
    les compléments FLOW et les budgets retenus se lisent dans le dossier économique.
