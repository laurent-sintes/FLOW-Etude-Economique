schema_version: 1
id: net-calculation
principle:
  title: Des charges au budget de réalisation
  text: '**Le budget de réalisation réunit les familles retenues, l’intégration et les achats nécessaires.** Chaque
    base conserve ses activités, tarifs et règles. Les services récurrents sont expliqués dans le chapitre suivant.'
notice:
  title: Deux traitements, un seul financement
  text: '**Les familles Core System retenues sont valorisées directement par rôle.** Leurs activités déclarées ne
    reçoivent ni remise IA globale ni pilotage supplémentaire. Les autres activités conservent leurs gains et provisions
    propres.'
navigation_label: Les cinq étapes du passage au budget
sections:
- id: repartir-roles
  title: Identifier la base et ses inclusions
  lead: '**Un total en JH se lit avec les activités qu’il couvre.**'
  blocks:
  - kind: table
    caption: Choisir le traitement adapté
    columns:
    - Base
    - Traitement
    rows:
    - - Famille Core System retenue
      - Effort projet adopté, ventilé par rôle. Analyse, conception, développement, QA et pilotage déclarés restent
        inclus.
    - - Autre activité estimée
      - Charge et volumes identifiés ; gains appliqués uniquement aux activités éligibles.
    - - Offre ou contrat Buy
      - Prix, périmètre et séquence contractuelle conservés ; les JH diagnostiques inclus ne sont pas ajoutés au
        forfait.
  - kind: bullets
    items:
    - Identifier les travaux partagés et leur propriétaire de financement. Un consommateur finance ses adaptations
      spécifiques.
    - Une activité ou une charge inconnue reste à instruire ; elle ne vaut pas zéro.
- id: reemploi-et-productivite
  title: Appliquer les gains aux activités éligibles
  lead: '**La réutilisation est déjà intégrée aux travaux restants.**'
  blocks:
  - kind: paragraphs
    items:
    - Pour les autres activités éligibles, chaque gain précise son assiette et sa justification. Le taux réduit
      l’effort sur les mêmes travaux ; les tarifs et prix fournisseur restent distincts.
  - kind: formula
    rule_ref: eligible_gains
  - kind: bullets
    items:
    - Une activité sans gain conserve ses JH. La QA possède ses travaux et, le cas échéant, son gain propre.
    - Les familles retenues conservent leurs JH adoptés et leur ventilation. Aucun abattement global supplémentaire.
- id: calculer-jh-nets
  title: Valoriser les JH par rôle
  lead: '**Les profils et leur outillage déterminent la dépense.**'
  blocks:
  - kind: table
    caption: Valorisation en euros HT
    columns:
    - Base
    - Calcul
    rows:
    - - Famille Core System retenue
      - Budget famille = somme [JH retenus du rôle × tarif du rôle] + JH totaux de la famille × outillage par JH
    - - Autre activité estimée
      - Coût = somme par profil [JH nets de l’activité × part du profil / 100 × (tarif + outillage applicable)]
  - kind: bullets
    items:
    - Les parts de profils totalisent 100 %. Dans une famille retenue, la ventilation par activité puis par rôle
      conserve exactement le total adopté.
    - Une expertise isolée en intégration remplace le tarif applicatif sur les JH concernés ; elle ne crée pas de
      journées.
    - L’outillage de réalisation s’applique aux JH prévus par le modèle. Le programme Make est valorisé aux tarifs
      de ses rôles sans cet ajout.
- id: construire-charge-totale
  title: Compléter l’intégration et les autres efforts
  lead: '**Ajouter seulement les travaux qui restent à financer.**'
  blocks:
  - kind: table
    caption: Budget d’intégration Make en euros HT
    columns:
    - Poste
    - Calcul ou assiette
    rows:
    - - Travaux communs
      - 'Somme des activités communes valorisées par profil ; interfaces = nombre d’interfaces × JH par interface.
        Migration : charge retenue et complément Groupe identifié.'
    - - Coordination des travaux communs
      - Coût des travaux communs × taux de coordination de l’intégration / 100.
    - - Déploiements
      - JH des paquets par unité × tarif moyen des profils, avec leur outillage par JH. Les activités remplacées
        sont retirées.
    - - Coordination des déploiements
      - Coût des déploiements × taux de coordination des déploiements / 100.
    - - Programme Make
      - 'Pour chaque rôle : JH mobilisés par mois × durée de l’intégration Groupe × tarif. Direction et coordination
        fonctionnelle sont distinctes du pilotage local des familles.'
    - - Prestations partagées avant réception
      - Budgets de préparation des interfaces et de QA / déploiement client des versions, coordination des services
        déjà comprise. Aucune seconde coordination d’intégration.
  - kind: formula
    text: Budget d’intégration Make = travaux communs + leur coordination + déploiements + leur coordination + programme
      + prestations partagées avant réception
  - kind: paragraphs
    items:
    - La stabilisation précède la réception. Le MCO du produit générique, les moyens techniques et les services
      après réception conservent leurs financements de fonctionnement, y compris pendant l’intégration. Une provision
      budgétaire ne dimensionne pas un effort humain.
  - kind: bullets
    items:
    - Le total humain du projet additionne les efforts retenus sans doubler les activités incluses. Le temps interne
      métier et la transformation organisationnelle globale restent exclus.
    - Un total complet exige de dimensionner les efforts manquants ; les licences et forfaits restent des dépenses
      en euros.
- id: valoriser-et-piloter
  title: Consolider le budget et son calendrier
  lead: '**Chaque financement est compté une fois, puis réparti dans le temps.**'
  blocks:
  - kind: formula
    rule_ref: economic_total
  - kind: bullets
    items:
    - Les familles adoptées financent la construction retenue. L’intégration, les achats et contrats gardent leurs
      inclusions et périodes propres.
    - Les provisions de coordination de l’intégration et des services portent sur leurs seules prestations prévues.
      Les familles retenues, licences et forfaits n’entrent pas dans une assiette générale de pilotage de construction.
    - Le calendrier global est distinct des délais calculés pour les familles ; leurs durées ne s’additionnent pas.
  - kind: links
    items:
    - href: '#parametres'
      label: Consulter les hypothèses et justifications retenues
    - href: '#calcul-run'
      label: Relier services, réceptions et dépenses annuelles
examples: []
next:
