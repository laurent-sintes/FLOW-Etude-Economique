version: 1
date: "2026-10-28"
id: qualification-buy
principe: Les capacités définissent le Core générique. En Buy, le produit fournit le standard ; la configuration
  et les parcours Beaumanoir relèvent de l’intégration. Un développement additionnel exige un écart identifié
  et un financement distinct.
hypothese: Le budget central retient les offres et les travaux client déjà identifiés. Il ne finance pas de
  reconstruction générique par capacité. Les modules et fonctions encore à qualifier ci-dessous ne sont pas
  chiffrés en supplément ; cela ne prouve pas leur inclusion.
absence_de_developpement: Aucun développement générique additionnel n’est démontré par la revue ; les points
  ouverts portent sur l’adéquation, l’intégration ou le choix des modules.
sources:
  sap-sbc:
    titre: SAP Supply Creation-Based Confirmation dans PP/DS
    reference: https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE/f899ce30af9044299d573ea30b533f1c/4c56297de7c33a0de10000000a42189c.html
    portee: Documentation 2025 FPS01 ; confirmation matières et capacités avec une limite de visibilité des simulations concurrentes avant transfert. Droits et configuration FLOW à qualifier.
  ms-dom:
    titre: Microsoft Commerce DOM
    reference: https://learn.microsoft.com/en-us/dynamics365/commerce/dom
    portee: Optimisation du sourcing des commandes selon contraintes et coûts ; pas preuve de toute optimisation
      FLOW.
  ms-ctp:
    titre: Microsoft Planning Optimization CTP
    reference: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/planning-optimization/calculate-delivery-dates-using-ctp
    portee: Promesse selon stock, capacité et délais ; conditions de version et de moteur.
  ms-stock:
    titre: Microsoft Safety stock fulfillment
    reference: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/safety-stock-replenishment
    portee: Réapprovisionnement et protection des stocks ; pas preuve de toute optimisation économique.
  ms-mining:
    titre: Microsoft Power Automate Process Mining
    reference: https://learn.microsoft.com/en-us/power-automate/process-advisor-overview
    portee: "Process Mining fait partie des droits Power Automate Premium ; un add-on apporte de la capacité supplémentaire. Cette disponibilité ne démontre ni les droits ni les volumes inclus dans le panier Dynamics 365/K3 reçu."
  sap-omf:
    titre: SAP Order Management Foundation — fonctionnalités
    reference: https://help.sap.com/doc/65309ba6056d4d6c8dc40195ec4b3074/Cloud/en-US/FSD_SAP_OMF.pdf
    portee: Orchestration de commandes et retours ; module distinct d’OMSA, inclusion dans le panier non établie.
  sap-mining:
    titre: SAP Signavio Process Intelligence
    reference: https://help.sap.com/docs/signavio-process-intelligence/user-guide/process-analysis?locale=en-US
    portee: Analyse de processus comme produit commercial ; prix et inclusion non établis dans l’offre.
  sap-tm:
    titre: SAP Transportation Management
    reference: https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE/e3dc5400c1cc41d1bc0ae0e7fd9aa5a2/9c27c9535f267414e10000000a174cb4.html?locale=en-US
    portee: Fonctions de transport dans un module commercial ; TM non inclus dans la BOM Delaware indexée.
  offres:
    titre: Périmètre des offres Avanade / Delaware
    reference: source/ecarts-perimetre-flow-rfi.md
    portee: Pièces et pages localisées ; ne pas transformer une fonction disponible au catalogue en prestation
      achetée.
  carte-scm:
    titre: Capacités métier Supply Chain Management
    reference: source/referentiel-capacites.yaml
    portee: Fonctions et frontières proposées sous les capacités Beaumanoir ; rattachement métier des points
      à qualifier, sans preuve de couverture produit ni de prix.
exceptions:
- id: optimisation-stocks
  titre: Optimisation des protections et règles de réservation
  stacks:
  - microsoft
  - sap
  blocs:
  - BC-040
  - BC-041
  - BC-042
  nature: adequation_standard
  decision: Utiliser les politiques, seuils et réservations standard. Définir les objectifs supplémentaires
    attendus avant de retenir un optimiseur distinct.
  sources:
  - ms-stock
  - offres
  statut: a_qualifier
  cout_initial_eur_ht: null
  cout_annuel_eur_ht: null
  financement: Aucun supplément autonome retenu ; vérifier le besoin résiduel et l’inclusion avant un achat
    ou une extension.
- id: ctp-sap
  titre: Promesse fondée sur les capacités dans SAP
  stacks:
  - sap
  blocs:
  - BC-047
  nature: module
  decision: "Comparer les scénarios CTP à aATP et Supply Creation-Based Confirmation, puis vérifier la version, le moteur et les droits PP/DS. Tester les demandes concurrentes sur les mêmes composants et capacités : la documentation SBC signale que les résultats simulés restent invisibles aux transactions parallèles avant transfert. L’absence de PP/DS dans la BOM ne démontre pas un besoin de moteur maison."
  sources:
  - offres
  - sap-sbc
  statut: a_qualifier
  cout_initial_eur_ht: null
  cout_annuel_eur_ht: null
  financement: Aucun supplément autonome retenu ; vérifier le besoin résiduel et l’inclusion avant un achat
    ou une extension.
- id: ptp
  titre: Choix d’une promesse économiquement admissible
  stacks:
  - microsoft
  - sap
  blocs:
  - BC-048
  nature: adequation_standard
  decision: Rapprocher les objectifs FLOW des règles de sourcing, coûts et contraintes du produit. Un choix
    explicable ou un paramétrage ne signifie pas nécessairement un moteur PTP spécifique.
  sources:
  - ms-dom
  - offres
  statut: a_qualifier
  cout_initial_eur_ht: null
  cout_annuel_eur_ht: null
  financement: Aucun supplément autonome retenu ; vérifier le besoin résiduel et l’inclusion avant un achat
    ou une extension.
- id: transport-sap
  titre: Décision de plan de transport SAP
  stacks:
  - sap
  blocs:
  - BC-052
  nature: module
  decision: TM est exclu du panier indexé. Distinguer le raccordement au transporteur ou TMS existant d’un
    moteur de planification à acheter ; ne pas budgéter son développement sans ce choix.
  sources:
  - sap-tm
  - offres
  statut: a_qualifier
  cout_initial_eur_ht: null
  cout_annuel_eur_ht: null
  financement: Aucun supplément autonome retenu ; vérifier le besoin résiduel et l’inclusion avant un achat
    ou une extension.
- id: orchestration
  titre: Coordination et reprises des parcours
  stacks:
  - microsoft
  - sap
  blocs:
  - BC-053
  - BC-076
  - BC-077
  - BC-079
  nature: integration
  decision: Configurer les workflows et raccorder les exécutants. Vérifier les reprises et interventions des
    parcours Beaumanoir ; pour SAP, examiner S/4 avec OMSA puis le besoin éventuel d’Order Management Foundation.
  sources:
  - ms-dom
  - sap-omf
  - offres
  statut: a_qualifier
  cout_initial_eur_ht: null
  cout_annuel_eur_ht: null
  financement: Aucun supplément autonome retenu ; vérifier le besoin résiduel et l’inclusion avant un achat
    ou une extension.
- id: mining
  titre: Analyse des processus
  stacks:
  - microsoft
  - sap
  blocs:
  - BC-087
  nature: module
  decision: Examiner Power Automate Process Mining ou SAP Signavio, leurs licences et la collecte des événements.
    Aucun développement de moteur de mining n’est retenu par défaut.
  sources:
  - ms-mining
  - sap-mining
  - offres
  statut: a_qualifier
  cout_initial_eur_ht: null
  cout_annuel_eur_ht: null
  financement: Aucun supplément autonome retenu ; vérifier le besoin résiduel et l’inclusion avant un achat
    ou une extension.
- id: reassort-sap
  titre: Réassort magasin et allocation SAP
  stacks:
  - sap
  blocs:
  - BC-034
  - BC-037
  - BC-040
  - BC-043
  - BC-044
  nature: module
  decision: Le questionnaire conserve un moteur de réassort externe et la BOM exclut CAR Allocation Management.
    Qualifier ses responsabilités avec Planning Scenario Reconciliation, Supply Assignment, Physical Stock
    Target Optimization, Replenishment et Stock Redistribution. Ce rapprochement est proposé pour les besoins
    de réapprovisionnement et de redistribution du réseau magasin ; il ne démontre ni un écart produit ni un
    supplément. Les allocations standard S/4 restent créditées.
  sources:
  - offres
  - carte-scm
  statut: a_qualifier
  cout_initial_eur_ht: null
  cout_annuel_eur_ht: null
  financement: Aucun supplément autonome retenu ; vérifier le besoin résiduel et l’inclusion avant un achat
    ou une extension.
