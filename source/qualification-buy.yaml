presentation:
  titre: Ce que les produits fournissent et les points à préciser
  note: Le standard est acheté ; son adaptation au contexte Beaumanoir est intégrée. Les points ci-dessous
    déterminent un éventuel achat ou travail supplémentaire.
  point: Point à préciser
  options: Options concernées
  decision: Traitement retenu
  cout: Supplément initial / annuel
  non_chiffre: Non chiffré
  details: Couverture des capacités et preuves
  source: Ouvrir le registre complet
  coverage_title: Couverture du Core générique
  coverage_note: La revue distingue l’hypothèse de standard, les travaux client et les points ciblés. Elle
    ne constitue pas un pourcentage de couverture certifié.
  statuses:
    standard_retenu: Hypothèse de standard
    integration_client: Travaux client inclus
    point_cible: Point à qualifier
  budget_note: Les budgets Buy ne comprennent pas de supplément chiffré pour les modules et fonctions restant
    à qualifier.
  budget_link: Voir les points de couverture Buy
  product_evidence_note: Les profils d’apport décrivent des fonctions documentées des produits. Ils sont mutualisés
    entre les capacités concernées.
  adequacy_note: L’adéquation au besoin FLOW se juge sur les fonctions et situations de la capacité ; les points
    ciblés précisent ce qui reste à vérifier.
  offer_note: La disponibilité d’une fonction au catalogue ne démontre pas son inclusion dans l’offre achetée.
    Les pièces commerciales et leurs limites restent attachées aux points ciblés.
  funding_note: Les travaux client retenus sont financés par les enveloppes d’intégration. Les modules et fonctions
    encore à qualifier n’ajoutent aucun supplément automatiquement.
