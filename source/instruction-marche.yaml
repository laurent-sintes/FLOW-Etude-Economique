interpretation: >-
  La matrice est dérivée pour toutes les capacités du périmètre comparatif et tous les produits étudiés.
  Une référence à un axe signale une instruction documentaire partielle, sans démontrer la couverture
  de chacune de ses capacités. Une qualification détaillée relie une fonction précise, ses besoins métier,
  le produit observé, les preuves, les différences, les inconnues et la revue. Fait observé, analogie et
  hypothèse d'ingénierie restent distincts. Aucun statut ne crée de JH ni de budget.
qualifications: []
