sections:
  core:
    title: 'Construction du Core System : unités retenues'
    lead: Les capacités Java/Spring disposent d’estimations adoptées par unité cohérente. La complétude des studios
      métier et des fonctions IT professionnelles est en réexamen. .NET et Rust restent à réestimer. La couverture
      de la cartographie ne démontre pas la complétude du produit.
    caption: Charges de construction retenues
    note: 'Le budget de chaque famille retenue inclut tous ses rôles et l’outillage de réalisation. Le pilotage produit
      est déjà compté dans ses JH. Aucune coordination proportionnelle ne lui est ajoutée. Les autres budgets et
      le calendrier provisoire global restent conservés.'
    capacity_note: 'Les capacités renvoient à leur unité de financement. Une unité cohérente peut regrouper plusieurs familles.
      Leurs allocations ne sont pas des chiffrages indépendants par capacité. .NET et Rust restent à réestimer.'
    links:
    - href: '#parametres'
      label: Vérifier gains, tarifs et coordination
    - href: '#cartographie'
      label: Retrouver le périmètre et les capacités métier
    - href: '#complexite'
      label: Lire la méthode d’évaluation du Core System
  selection:
    title: Sélectionner et contractualiser une solution Buy
    lead: '**Acheter un produit existant ne finance pas sa construction générique.** Le poste ci-dessous couvre
      l’assistance acheteur jusqu’au choix et à la contractualisation du finaliste, avant son intégration.'
    caption: Sélection et contractualisation — alternatives Buy
    note: 'Les deux lignes représentent des choix alternatifs. **Leur montant ne se cumule pas** : une seule décision
      d’achat est financée. Le travail Synvance déjà réalisé est réutilisé. La provision de préparation transférée
      n’est pas recomptée dans l’intégration.'
    sources:
    - path: source/selection-buy.yaml
      label: Travaux et périmètre de la sélection Buy
    - path: source/offres-synvance.md
      label: Dossier des propositions Synvance
  integration:
    title: '{{notion.integrer_deployer}} dans le Groupe'
    lead: '**Chaque budget conserve son assiette.** Les options Make sont dimensionnées par les travaux et déploiements
      Groupe. Les options Buy conservent leur base fournisseur et les compléments identifiés dans l’étude.'
    caption: Intégration initiale — cinq options
    detail_title: Ce que finance le budget d’intégration
    detail_note: '**Ces lignes composent le budget affiché. Elles ne s’y ajoutent pas.** Les montants et les périodes viennent
      du même journal de financement que la projection. En Make, les travaux communs, les déploiements et le pilotage
      sont distingués. Les lignes de réception couvrent les travaux initiaux avant passage aux services récurrents.
      Les lots fournisseur Buy restent groupés selon leur financement.'
    ledger_labels:
      travaux_communs: Travaux communs, adaptations, interfaces, migration et recette
      coordination_commune: Coordination technique des travaux communs
      deploiements: Formation, bascule et stabilisation des unités
      coordination_deploiements: Coordination technique des déploiements
      programme: Direction et coordination du programme Groupe
      MAI-005/reception: Réception initiale des flux
      MAI-006/reception: Qualification de la première mise en service
      integration_initiale: Offre d’intégration et compléments retenus
    explanations:
      Make: Travaux communs, adaptations, interfaces, migration, déploiements et pilotage Groupe. Le repère SAP
        retraité ne calcule pas cette base.
      microsoft: Base Microsoft et K3, avec généralisation au Groupe selon le dossier retenu et compléments distincts
        du standard acheté.
      sap: Lots et prix du dossier SAP, avec leur périmètre documenté et les compléments retenus. Les écarts de
        périmètre restent explicités.
    note: Les durées partent après la construction Make ou la sélection Buy. **Le calendrier finance aussi les moyens
      techniques consommés et le maintien du produit pendant ces périodes.** Le budget des travaux d’intégration
      affiché ici ne constitue donc pas toute la dépense de la période.
    sources:
    - path: source/deploiement-groupe.yaml
      label: Travaux et calendrier d’intégration Make
    - path: source/offres-synvance.md
      label: Prix et inclusions des offres Buy
  annual:
    title: Financer le fonctionnement à pleine capacité
    lead: '**La base annuelle combine prestations, moyens techniques et contrats.** Elle couvre aussi le maintien
      et les évolutions du produit générique. Elle ne constitue donc pas un total analytique Run.'
    caption: Base annuelle complète aux prix de référence, avant indexation
    detail_title: Activités et achats de la base annuelle
    detail_note: '**Chaque ligne est déjà comprise dans la base annuelle.** Les regroupements ci-dessous expliquent les travaux
      et achats financés. Ils ne constituent pas une ventilation analytique Build/Run. Les forfaits et droits éditeur
      restent groupés lorsque leurs composantes n’ont pas de prix séparé. La séquence commerciale retenue et sa
      prolongation sont présentées dans les hypothèses. Les montants reçus restent consultables dans Repères Synvance.'
    rows:
    - id: services_mco
      label: Prestations de maintenance et d’exploitation
      explanation: Prestations estimées, coordination, outillage de support et forfaits de services retenus.
    - id: hebergement
      label: Hébergement et capacité achetés séparément
      explanation: Les moyens déjà inclus dans une offre éditeur restent financés par cette offre.
    - id: ipaas
      label: Plateforme d’intégration achetée séparément
      explanation: Moyens d’échange entre applications, hors travail humain sur les flux.
    - id: licences_complementaires
      label: Droits logiciels complémentaires
      explanation: Achats distincts de l’offre éditeur groupée et de la plateforme d’intégration.
    - id: offre_editeur
      label: '{{notion.offre_editeur}}'
      explanation: Droits et services inclus conservés ensemble. La première valeur de la séquence commerciale sert
        à cette base de référence.
    note: '**Une base annuelle n’est pas la dépense de chaque année du projet.** Les dates de consommation, les périodes
      de transition et les prix documentés des abonnements sont appliqués dans {{vue.se_projeter}}. Une ligne à
      zéro signifie qu’aucun achat séparé n’est retenu dans ce poste. Elle ne démontre pas l’absence d’un service
      inclus ailleurs.'
    sources:
    - path: source/maintenance.yaml
      label: Activités et scénario de fonctionnement
    - path: source/calibration-couts.yaml#couts_communs
      label: Enveloppes des moyens et achats
    - path: source/plan-investissement.yaml#presentation_achats
      label: Regroupement et inclusions des achats
  limits:
    title: Portée des résultats
    lead: Les périmètres, hypothèses et inconnues accompagnent la lecture des montants.
