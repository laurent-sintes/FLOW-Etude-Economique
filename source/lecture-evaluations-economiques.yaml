  label: Examiner les capacités et les preuves de réalisation


sponsor:
  completion: Dépenses jusqu’au service complet
  completion_note: Travaux, moyens de transition et abonnements consommés avant cette date sont compris. Ce repère
    reste limité au périmètre chiffré.
  completion_detail: Ce qui est payé avant le service complet
  initial_ledger: Travaux et moyens initiaux ou de transition
  subscriptions: Abonnements consommés avant le service complet
  insight: Ce qui change entre les options
  insight_text: Le cumul dépend des prix et du calendrier. Java finance un produit à construire et à maintenir.
    Microsoft et SAP associent intégration, abonnements et services. Le temps de service complet et les périmètres
    diffèrent.
  compare_parts: Pourquoi les cumuls diffèrent
  compare_parts_note: Les mêmes postes sont comparés sur l’horizon choisi. Les services et achats comprennent ceux
    du projet, puis ceux du fonctionnement.
  acquisition: Construction ou sélection
  difference: Écart avec Java / Spring
  reference_option: Référence de comparaison
  funding_and_annual: Le coût d’une année de fonctionnement
  annual_base: Année pleine aux prix de référence
  projected_year: Dépense projetée en année
  annual_pair_note: La base annuelle décrit le régime cible aux prix de référence. La dépense projetée suit le calendrier
    et l’indexation. Avant le service complet, elle peut encore comprendre des travaux.
  budgets_detail: Budgets complets et solde initial
  scope_title: Le périmètre à retenir pour décider
  scope_short: Produit, intégration et services chiffrés. Équipes internes, transformation et ancien SI restent
    à chiffrer.
  trajectory: La dépense au fil des années
  trajectory_note: Chaque barre représente le total d’une année, déjà compris dans le cumul. La date de service
    complet situe la fin de la montée en service.
  annual_parts: Voir les postes et contrats de l’année de référence
  determinant_title: Les hypothèses qui orientent la décision
  determinant_note: Ces choix sont fixes dans l’étude. Leur statut indique ce qui est retenu et ce qui doit encore
    être confirmé pour engager la réalisation.
  lots: lots adoptés
  users: utilisateurs
  stages:
    before_service: Projet avant service complet
    partial_service: Année de passage au service complet
    full_service: Année entière en service complet
  drivers:
    java-spring: La construction du produit est financée dès le départ. Le calendrier plus long laisse moins d’années
      de fonctionnement complet dans le cumul. Les services annuels restent à financer après sa construction.
    microsoft: La base d’intégration est une projection Groupe. Les abonnements commencent après la sélection, avant
      le service complet. L’offre éditeur regroupe les droits et les services inclus.
    sap: L’intégration reprend les lots Delaware avec la Finance. Les abonnements et forfaits de services pèsent
      ensuite dans le cumul. Le service complet intervient plus tôt dans la projection.
  determinants:
  - id: calendar
    title: Calendrier Java
    status: Hypothèse provisoire
    text: À confirmer avec l’équipe et le plan de déploiement. Il détermine le temps de service complet dans le
      cumul.
  - id: core
    title: Construction Java
    status: Estimation adoptée
    text: Les lots incluent leurs rôles et leur pilotage local. Leur adoption ne confirme pas la disponibilité d’une
      équipe.
  - id: offers
    title: Bases Microsoft et SAP
    status: Projection et offre documentées
    text: Microsoft reprend la généralisation Groupe du COPIL. SAP reprend l’offre Delaware, Finance incluse. Les
      contrats finaux restent à confirmer.
  - id: service
    title: Prestations et service
    status: Hypothèses de cadrage
    text: Les tarifs de prestations indépendantes et les volumes servent au chiffrage. Ils ne constituent pas un
      devis d’équipe.
  scope_rows:
  - id: priced
    title: Ce qui est chiffré
    text: Le produit, l’intégration Beaumanoir et les services retenus.
    action: Les montants jusqu’au service complet et les cumuls utilisent ces mêmes dépenses.
  - id: unpriced
    title: Ce qui reste à établir
    text: Temps des équipes internes, transformation, maintien et retrait de l’ancien SI.
    action: Chiffrer ces travaux selon l’option et sa durée de coexistence. Aucun montant nul n’est supposé.
  - id: sap
    title: Le périmètre Finance SAP
    text: La Finance reste dans l’offre et le total SAP.
    action: Confirmer le périmètre comparable avant l’arbitrage. Aucun retrait forfaitaire n’est appliqué.
  decision:
    title: Le prochain arbitrage de financement
    intro: Choisir l’option à approfondir, son périmètre et les conditions de poursuite.
    items:
    - Confirmer les responsabilités, les équipes mobilisables et les engagements du partenaire.
    - Chiffrer les dépenses internes et la coexistence avec l’ancien SI pour le calendrier retenu.
    - Définir la prochaine tranche à instruire et ses critères d’acceptation.
    budget: Le montant de cette tranche reste à établir.
    href: '#capacite-realisation?view=gates&focus=delivery-readiness-gate-dispositif'
    link: Voir le jalon avant d’engager la réalisation
  cumulative: Dépenses prévues cumulées
  comparison_note: Dépenses prévues sur l’horizon choisi, depuis un départ commun.
  difference_labels:
    higher: de plus
    lower: de moins
    equal: Identique
