version: 1
id: economic-evaluations
navigation_label: Les évaluations de la référence
intro:
  title: Lire les évaluations avant de comparer les options
  text: >-
    **Ces résultats décrivent la référence courante de l’étude.** Ils réunissent
    la construction du produit, la sélection d’une solution achetée, l’intégration
    au Groupe et le fonctionnement. Les hypothèses personnelles restent dans Simuler.
labels:
  option: Option
  budget: Budget initial
  duration: Durée de référence
  months: mois
  source: Travaux, périmètre et provenance
  price_convention: Convention monétaire
  annual_item: Poste financé
  annual_total: Total annuel de référence
  not_applicable: '{{notion.sans_objet}}'
  annual_sources: Activités, contrats et achats par option
sections:
  selection:
    title: Sélectionner et contractualiser une solution Buy
    lead: >-
      **Acheter un produit existant ne finance pas sa construction générique.**
      Le poste ci-dessous couvre l’assistance acheteur jusqu’au choix et à la
      contractualisation du finaliste, avant son intégration.
    caption: Sélection et contractualisation — alternatives Buy
    note: >-
      Les deux lignes représentent des choix alternatifs. **Leur montant ne se cumule
      pas** : une seule décision d’achat est financée. Le travail Synvance déjà réalisé
      est réutilisé ; la provision de préparation transférée n’est pas recomptée dans
      l’intégration.
    sources:
      - {path: source/selection-buy.yaml, label: Travaux et périmètre de la sélection Buy}
      - {path: source/offres-synvance.md, label: Dossier des propositions Synvance}
  integration:
    title: '{{notion.integrer_deployer}} dans le Groupe'
    lead: >-
      **Chaque budget conserve son assiette.** Les options Make sont dimensionnées
      par les travaux et déploiements Groupe. Les options Buy conservent leur base
      fournisseur et les compléments identifiés dans l’étude.
    caption: Intégration initiale — cinq options
    explanations:
      Make: Travaux communs, adaptations, interfaces, migration, déploiements et pilotage Groupe. Le repère SAP retraité ne calcule pas cette base.
      microsoft: Base Microsoft et K3, avec généralisation au Groupe selon le dossier retenu et compléments distincts du standard acheté.
      sap: Lots et prix du dossier SAP, avec leur périmètre documenté et les compléments retenus. Les écarts de périmètre restent explicités.
    note: >-
      Les durées partent après la construction Make ou la sélection Buy.
      **Le calendrier finance aussi les moyens techniques consommés et le maintien
      du produit pendant ces périodes.** Le budget des travaux d’intégration affiché
      ici ne constitue donc pas toute la dépense de la période.
    sources:
      - {path: source/deploiement-groupe.yaml, label: Travaux et calendrier d’intégration Make}
      - {path: source/offres-synvance.md, label: Prix et inclusions des offres Buy}
  annual:
    title: Financer le fonctionnement à pleine capacité
    lead: >-
      **La base annuelle combine prestations, moyens techniques et contrats.**
      Elle couvre aussi le maintien et les évolutions du produit générique.
      Elle ne constitue donc pas un total analytique Run.
    caption: Base annuelle complète aux prix de référence, avant indexation
    rows:
      - {id: services_mco, label: Prestations de maintenance et d’exploitation, explanation: 'Prestations estimées, coordination, outillage de support et forfaits de services retenus.'}
      - {id: hebergement, label: Hébergement et capacité achetés séparément, explanation: Les moyens déjà inclus dans une offre éditeur restent financés par cette offre.}
      - {id: ipaas, label: Plateforme d’intégration achetée séparément, explanation: 'Moyens d’échange entre applications, hors travail humain sur les flux.'}
      - {id: licences_complementaires, label: Droits logiciels complémentaires, explanation: Achats distincts de l’offre éditeur groupée et de la plateforme d’intégration.}
      - {id: offre_editeur, label: '{{notion.offre_editeur}}', explanation: Droits et services inclus conservés ensemble. La première valeur de la séquence commerciale sert à cette base de référence.}
    note: >-
      **Une base annuelle n’est pas la dépense de chaque année du projet.**
      Les dates de consommation, les périodes de transition et les prix documentés
      des abonnements sont appliqués dans {{vue.se_projeter}}. Une ligne à zéro signifie
      qu’aucun achat séparé n’est retenu dans ce poste ; elle ne démontre pas l’absence
      d’un service inclus ailleurs.
    sources:
      - {path: source/maintenance.yaml, label: Activités et scénario de fonctionnement}
      - {path: source/calibration-couts.yaml#couts_communs, label: Enveloppes des moyens et achats}
      - {path: source/plan-investissement.yaml#presentation_achats, label: Regroupement et inclusions des achats}
  limits:
    title: Portée des résultats
    lead: Les périmètres, hypothèses et inconnues accompagnent la lecture des montants.
links:
  - {href: '#parametres', label: Vérifier les hypothèses et valeurs retenues}
  - {href: '#se-projeter', label: Lire les dépenses dans le calendrier}
  - {href: '#comparer', label: Comparer les structures de coût}
