version: 1
id: economic-evaluations
navigation_label: Les évaluations de la référence
intro:
  title: Lire les évaluations avant de comparer les options
  text: '**Ces résultats décrivent la référence courante de l’étude.** Ils réunissent la construction du produit,
    la sélection d’une solution achetée, l’intégration au Groupe et le fonctionnement. Les hypothèses personnelles
    restent dans Simuler.'
labels:
  option: Option
  budget: Budget initial
  duration: Durée de référence
  months: mois
  source: Travaux, périmètre et provenance
  price_convention: Convention monétaire
  annual_item: Poste financé
  annual_total: Total annuel de référence
  not_applicable: '{{notion.sans_objet}}'
  annual_sources: Activités, contrats et achats par option
  choose_option: Option à examiner
  choose_capacity: Capacité à examiner
  nature: Nature de travaux
  jh_before: JH avant gains, QA comprise
  jh_unit: JH
  amount: Montant retenu
  period: Période financée depuis le départ du projet
  month_prefix: Mois
  total: Total
  core_work: Prestations retenues par rôle
  core_coordination: '{{notion.coordination_travaux_techniques}}'
