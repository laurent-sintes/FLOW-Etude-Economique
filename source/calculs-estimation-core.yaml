      decision: Une différence de productivité liée au patrimoine est plausible mais non quantifiée empiriquement.
      evidence:
      - audits/2026-10-30-stock-opportunite-08/inputs.json
      - audits/2026-10-30-stock-completion-04/cosmic.json
      - audits/2026-10-30-stock-consolidation-09/results.json
      id: reuse
