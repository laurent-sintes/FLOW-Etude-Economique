    - classification: unknown
      cocomo: Architecture transactionnelle standard et compléments de rapprochement.
      cosmic: Les contraintes internes ne produisent pas seules des CFP supplémentaires.
      decision: Écart de garanties non apparié ; pas de probabilité ni correction automatique.
