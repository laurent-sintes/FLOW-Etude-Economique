# Modèle source éditable. Même schéma pour Make et Buy.
version_schema: 1
id: rust-make
nom: Rust
strategie: make
date_documentation: '2026-10-22'
description: Backend Rust, moteurs natifs retenus comme candidats et frontend React. Aucun moteur métier Java ajouté
  pour combler silencieusement les écarts.
conventions:
- Description d’une stack de travail, sans chiffrage global ni calendrier.
- Les prix de produits sont à qualifier ; les TJM rémunèrent les interventions humaines.
- Un composant inclus est financé par un autre élément, pas gratuit.
- Les composants proposés ne valent pas décision d’achat ou validation d’architecture.
