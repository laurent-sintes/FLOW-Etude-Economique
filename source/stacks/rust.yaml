interventions:
  unite: EUR_HT_par_JH
  marche: France
  mode_achat: freelance_direct
  profil_comparable: Intervenant autonome expérimenté ; hors direction de projet, architecte transverse et astreinte.
  base_geographique: France ; grilles Paris utilisées lorsqu’une ventilation existe. Pas de coefficient régional
    automatique.
  tarifs:
    expert:
      bas: 600
      reference: 700
      haut: 850
      nature: hypothese_de_cadrage
      niveau_preuve: faible
      justification: Hypothèse exploratoire autour du signal Rust à 680 €/j. La fiche TJMètre annonce 51 réponses
        et 600–770, mais la grille générale en annonce 11 et un P25 différent. Bornes élargies par jugement, pas
        distribution statistique validée ; profil senior non isolé.
      sources:
      - RUST_TJM
      - RUST_TJM_LIMITE
    qa:
      bas: 550
      reference: 600
      haut: 700
      nature: hypothese_de_cadrage
      niveau_preuve: faible
      justification: QA senior Paris Silkhom 2025, 530–700 €/JH. Référence majorée de 50 €/JH par hypothèse de spécialisation Rust, sans cotation dédiée.
      sources:
      - SILKHOM
    architecte:
      bas: 900
      reference: 1000
      haut: 1150
      nature: hypothese_de_cadrage
      niveau_preuve: faible
      justification: ForTeam Architecture SI et Tech Lead 920–1 180 €/JH senior/expert. Référence de cadrage à 1 000 pour la spécialisation Rust ; prime non mesurée.
      sources:
      - FORTEAM
    support_utilisateur:
      bas: 400
      reference: 425
      haut: 450
      nature: hypothese_de_cadrage
      niveau_preuve: intermediaire
      justification: Accueil et diagnostic de premier niveau. Grille support applicatif senior Paris, Silkhom 2025.
        Hors expertise propre au progiciel ou au langage.
      sources:
      - SILKHOM
  activites:
    developpement:
      tarif: expert
      perimetre: Architecture applicative, conception, code et tests du Core.
    integration:
      tarif: expert
      perimetre: Configuration, adaptations fonctionnelles, intégration technique et flux par un spécialiste autonome.
    support_n3:
      tarif: expert
      perimetre: Diagnostic expert et correction des composants ou extensions sous responsabilité client.
    support_n1:
      tarif: support_utilisateur
      perimetre: Réception, qualification et résolution de premier niveau ; escalade des incidents complexes.
  regle: Même tarif pour développement, intégration et support N3 à qualification équivalente. Aucun écart systématique
    par activité n’est établi par les sources retenues.
  limites: Les bornes sont une plage de cadrage, pas un intervalle statistique. La référence n’est pas une moyenne
    observée. Hors marge ESN additionnelle, forfait de support éditeur, SLA, astreintes et remises de volume.
  repere_esn:
    tjm_eur_ht: null
    precision: Aucun tarif ESN comparable suffisamment documenté retenu. Ne pas appliquer une marge forfaitaire
      au tarif freelance.
    sources:
    - CADRE
points_ouverts:
- Versions et compatibilité des composants à sélectionner avant tout engagement.
- Fournisseur IaaS, option Kubernetes managée ou autogérée, sauvegardes et reprise à qualifier.
- Choix iPaaS à confronter au SI existant ; Logic Apps est une proposition, pas une décision utilisateur.
- Chaîne CI/CD, gestion des secrets, stockage de supervision et contrats de support à préciser.
- Les coûts logiciels et cloud ne sont pas chiffrés ; aucune gratuité globale n’est déduite des licences OSS.
- Aucun Case Management complet retenu ; évaluer séparément le travail de dossiers et de tâches humaines.
- Qualifier ZEN par rapport aux besoins d’inférence, et Pumpkin par rapport aux modèles d’optimisation.
- 'TJM Rust à confirmer par consultation : source publique contradictoire et spécialisation métier non isolée.'
