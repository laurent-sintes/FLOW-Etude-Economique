version: 1
id: capacite-realisation
date: '2026-10-29'
principle:
  title: Construire la capacité à porter FLOW
  text: '**Le Make souhaité exige un dispositif à constituer et à démontrer.** Le contexte communiqué décrit un Groupe historiquement acheteur de solutions, dont les compétences et l’organisation internes sont à construire pour porter ce produit. Ce constat rapporté reste à confirmer avec les responsables concernés.'
notice:
  title: Un dossier ouvert, sans engagement présumé
  text: '**Aucune référence projet ni équipe mobilisable eXalt n’est attestée dans ce dossier à ce stade.** Les rôles et validations ci-dessous sont proposés. Les pièces attendues ne constituent ni une preuve disponible ni un engagement accepté. Cela ne conclut pas à une incapacité du partenaire.'
navigation_label: Les points à rendre démontrables
context:
  source: Contexte de l’étude communiqué le 29 octobre 2026.
  status: rapporte
  text: La préférence pour Make oriente les questions à instruire ; elle ne dispense pas de confronter les options au même besoin ni de réunir les capacités nécessaires.
labels:
  states:
    a_constituer: À constituer
    a_confirmer: À confirmer
    a_demontrer: À démontrer
  proof_states:
    disponible: Document disponible
    attendue: Pièce à obtenir
  role_columns: [Mission, Acteur envisagé et validation proposée, État et pièce attendue]
  partner_columns: [Capacité eXalt à établir, Pièce attendue]
  proof_label: Preuves à réunir
  validation_label: Validation proposée
  proceed_label: Poursuivre si
  reconsider_label: Réexaminer si
  risk_label: Risque à traiter
  action_label: Vérification proposée
  available_label: Appui disponible
  gate_label: Jalon de validation
  capability_label: Consulter la capacité
sections:
  organisation:
    title: Une organisation à constituer
    lead: '**Les missions sont identifiées ; les personnes et disponibilités restent à confirmer.** La maîtrise du produit demeure côté Groupe, y compris avec une réalisation confiée à un partenaire.'
  points-chauds:
    title: Des points chauds à éprouver
    lead: '**La cartographie rend les difficultés concrètes.** Ces sujets viennent du périmètre retenu ; leur description ne prouve pas qu’un mécanisme a déjà été réalisé ou testé pour FLOW.'
  partenaire:
    title: Les preuves attendues d’eXalt
    lead: '**Documenter l’expérience réelle et le dispositif proposé.** Les pièces demandées doivent établir le rôle réellement tenu, les résultats observés et leur transposition possible à FLOW.'
  jalons:
    title: Des décisions progressives sur dix ans
    lead: '**Chaque étape prépare une décision vérifiable.** Ces jalons proposés complètent la lecture du calendrier sans modifier ses durées ni ses financements.'
scope:
  id: perimetre
  title: Le périmètre métier retenu
  introduction: Les capacités, leurs frontières et leurs trois axes de complexité viennent de la grille utilisée par l’étude. Les noms et la hiérarchie sont ceux de la capture de cartographie associée.
  note: Les niveaux sont ordinaux, proposés et à relire avec le métier. Ils ne se somment pas et ne déterminent pas des JH. Atlas présente sa publication courante ; cette étude conserve la capture qui a servi à son périmètre.
  link:
    href: https://laurent-sintes.github.io/Urbanisation-SCM/
    label: Ouvrir la cartographie Beaumanoir dans FLOW Atlas
  labels:
    capture_date: Capture utilisée par l’étude
    version: Publication de cartographie importée
    search: Rechercher une capacité ou un domaine
    results: '{count} capacités affichées'
    boundary: Frontière du périmètre
    native_reference: Ouvrir la capacité dans Atlas
    back_label: Revenir aux {{vue.concepts}}
proofs:
- id: cartographie
  title: Cartographie et grille de complexité retenues
  status: disponible
  kind: document_entree
  source_ref: source/grille-complexite.yaml
  href: '#perimetre-retenu'
  detail: Fonctions, frontières et difficultés documentées ; aucune réalisation installée déduite.
- id: synvance
  title: Besoins et réponses d’intégration Synvance
  status: disponible
  kind: document_entree
  source_ref: sources/client/rfi-besoins.pdf
  href: '#synvance'
  detail: Besoins, questionnaires et propositions accessibles dans les Repères Synvance ; leur périmètre propre est conservé.
- id: organisation
  title: Organisation et disponibilités des acteurs
  status: attendue
  kind: preuve_realisation
  source_ref: null
  href: null
  detail: Rôles, responsabilités, disponibilités et relais confirmés par les acteurs concernés.
- id: references-exalt
  title: Références de grands projets et de transformation
  status: attendue
  kind: reference_partenaire
  source_ref: null
  href: null
  detail: Projets réels avec contexte, ampleur, rôle exact d’eXalt, difficultés traitées, résultats vérifiables et limites de transposition.
- id: equipe-exalt
  title: Dispositif et compétences proposés pour FLOW
  status: attendue
  kind: preuve_realisation
  source_ref: null
  href: null
  detail: Profils, expérience pertinente, disponibilité, organisation de réalisation, QA et continuité de prestation à confirmer.
- id: demonstration
  title: Résultats des essais sur les mécanismes difficiles
  status: attendue
  kind: preuve_realisation
  source_ref: null
  href: null
  detail: Cas représentatifs, conditions d’essai, résultats observés, écarts et revue des critères d’acceptation.
- id: acceptation
  title: Dossier d’acceptation du pilote
  status: attendue
  kind: preuve_realisation
  source_ref: null
  href: null
  detail: Parcours, données, service, bascule et reprise éprouvés avec les responsables métier et exploitation.
- id: transfert
  title: Exercice de transfert et de continuité
  status: attendue
  kind: preuve_realisation
  source_ref: null
  href: null
  detail: Une autre équipe reprend un incident et livre une évolution avec les droits, documents, outils et relais prévus.
roles:
- id: produit
  title: Produit et arbitrages entre marques
  actor: Responsables métier et produit Beaumanoir à désigner.
  validation_owner: Direction métier du Groupe, proposition à confirmer.
  status: a_constituer
  criteria_refs: [maitrise, capacite]
  proof_refs: [organisation]
  decision_ref: organisation
- id: realisation
  title: Architecture, réalisation et QA
  actor: eXalt envisagé avec les interlocuteurs DSI Beaumanoir ; dispositif non engagé.
  validation_owner: DSI Beaumanoir, proposition à confirmer.
  status: a_confirmer
  criteria_refs: [capacite, preuve]
  proof_refs: [equipe-exalt, demonstration]
  decision_ref: organisation
- id: integration
  title: Données, intégration et acceptation
  actor: Référents métier, responsables des SI et équipe d’intégration à mobiliser.
  validation_owner: Métiers et DSI Beaumanoir, proposition à confirmer.
  status: a_confirmer
  criteria_refs: [maitrise, trajectoire]
  proof_refs: [organisation, acceptation]
  decision_ref: integration
- id: continuite
  title: Exploitation et autonomie du produit
  actor: Responsables du service et relais produit à définir avec le partenaire.
  validation_owner: DSI et exploitation Beaumanoir, proposition à confirmer.
  status: a_constituer
  criteria_refs: [capacite, trajectoire]
  proof_refs: [transfert]
  decision_ref: dependances
hotspots:
- id: stocks
  title: Intégrer les stocks sans doubler leurs effets
  capability_refs: [D01.f, D01.g]
  risk: Des doublons ou corrections tardives peuvent fausser une situation de stock et sa justification.
  action: Rejouer des faits dupliqués, corrigés et reçus hors ordre ; vérifier une situation à date et la provenance de chaque effet.
  available_refs: [cartographie]
  expected_refs: [demonstration]
  gate_ref: preuve-produit
  role_ref: realisation
- id: propositions
  title: Expliquer les propositions de réapprovisionnement
  capability_refs: [D05.e, D05.a]
  risk: Une recommandation peut paraître correcte tout en masquant les contraintes ou compromis qui la rendent inapplicable.
  action: Confronter des pénuries et contraintes concurrentes à des résultats acceptables définis avec le métier ; expliquer les écarts sans présumer un solveur global.
  available_refs: [cartographie]
  expected_refs: [demonstration]
  gate_ref: preuve-produit
  role_ref: produit
- id: reprise
  title: Reprendre un parcours après interruption
  capability_refs: [order-workflow-orchestration, process-exception-management]
  risk: Une reprise peut répéter un effet déjà réalisé ou perdre la responsabilité d’une exception.
  action: Interrompre puis reprendre un parcours avec interventions humaines ; vérifier progression, effets uniques, résolution et traçabilité.
  available_refs: [cartographie]
  expected_refs: [demonstration, acceptation]
  gate_ref: pilote
  role_ref: realisation
- id: references
  title: Rapprocher les références sans remplacer leurs maîtres
  capability_refs: [master-data-ingestion]
  risk: Des identités ou versions incohérentes peuvent contaminer les parcours malgré une interface techniquement disponible.
  action: Éprouver rapprochement, quarantaine et rejeu sur des données représentatives ; attribuer le nettoyage et les décisions aux responsables des référentiels.
  available_refs: [cartographie]
  expected_refs: [demonstration, acceptation]
  gate_ref: pilote
  role_ref: integration
partner:
- id: experience
  title: Grands projets et transformation
  proof_ref: references-exalt
- id: equipe
  title: Compétences réellement mobilisables
  proof_ref: equipe-exalt
- id: methode
  title: Méthode appliquée aux difficultés FLOW
  proof_ref: demonstration
gates:
- id: dispositif
  title: Avant d’engager la réalisation
  expected: Un dispositif de réalisation et de décision accepté, avec disponibilités et engagements identifiés.
  validation_owner: Sponsor, métiers et DSI, proposition à confirmer.
  status: a_demontrer
  criteria_refs: [maitrise, capacite]
  proof_refs: [organisation, references-exalt, equipe-exalt]
  depends_on: []
  decision_ref: capacite
  proceed: Les responsabilités critiques disposent d’acteurs et de moyens confirmés.
  reconsider: Une responsabilité essentielle ou une capacité indispensable ne peut pas être tenue.
- id: preuve-produit
  title: Avant de généraliser les mécanismes
  expected: Les points chauds et exigences de service sont éprouvés sur des cas représentatifs.
  validation_owner: Produit, architecture et QA, proposition à confirmer.
  status: a_demontrer
  criteria_refs: [preuve]
  proof_refs: [demonstration]
  depends_on: [dispositif]
  decision_ref: metier
  proceed: Les résultats attendus sont observés et les écarts acceptés explicitement.
  reconsider: Un besoin impératif échoue ou l’avantage recherché du Make n’est pas démontré.
- id: pilote
  title: Avant les déploiements suivants
  expected: Le pilote est accepté, sa reprise maîtrisée et les conditions des prochaines unités examinées.
  validation_owner: Métiers et exploitation, proposition à confirmer.
  status: a_demontrer
  criteria_refs: [preuve, trajectoire]
  proof_refs: [acceptation]
  depends_on: [preuve-produit]
  decision_ref: trajectoire
  proceed: Parcours, données et service satisfont les critères d’acceptation convenus.
  reconsider: La bascule, la coexistence ou la qualité du service restent insuffisamment maîtrisées.
- id: autonomie
  title: Avant d’annoncer l’autonomie
  expected: Les relais peuvent faire évoluer le produit et rétablir le service avec les moyens transférés.
  validation_owner: DSI et responsables produit, proposition à confirmer.
  status: a_demontrer
  criteria_refs: [capacite, trajectoire]
  proof_refs: [transfert]
  depends_on: [pilote]
  decision_ref: capacite
  proceed: Une autre équipe réussit l’exercice de reprise et d’évolution prévu.
  reconsider: Le produit dépend encore de personnes sans relais, de droits manquants ou d’un transfert non éprouvé.
next:
