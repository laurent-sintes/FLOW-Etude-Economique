  decision_ref: trajectoire
  proceed: Parcours, données et service satisfont les critères d’acceptation convenus.
  reconsider: La bascule, la coexistence ou la qualité du service restent insuffisamment maîtrisées.
- id: autonomie
  title: Avant d’annoncer l’autonomie
  expected: Les relais peuvent faire évoluer le produit et rétablir le service avec les moyens transférés.
  validation_owner: DSI et responsables produit, proposition à confirmer.
  status: a_demontrer
  criteria_refs:
  - capacite
  - trajectoire
  proof_refs:
  - transfert
  depends_on:
  - pilote
  decision_ref: capacite
  proceed: Une autre équipe réussit l’exercice de reprise et d’évolution prévu.
  reconsider: Le produit dépend encore de personnes sans relais, de droits manquants ou d’un transfert non éprouvé.
