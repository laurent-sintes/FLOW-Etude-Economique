    lead: Disponibilités et validations à confirmer. La maîtrise du produit demeure côté Groupe.
  points-chauds:
    title: Points chauds à éprouver
    lead: Vérifier ces mécanismes sur des cas représentatifs de FLOW.
  partenaire:
    title: Entrants et preuves à réunir
    lead: Les exigences eXalt couvrent références réelles, compétences mobilisables et méthode appliquée aux difficultés
      FLOW.
  jalons:
    title: Jalons de décision
    lead: Les résultats observés conditionnent la poursuite. Durées et financements du modèle restent inchangés.
scope:
  id: perimetre
  title: Le périmètre métier retenu
  introduction: 'Le référentiel des capacités est un entrant : les noms, définitions, périmètres et la hiérarchie
    sont repris de la capture de cartographie, sans ajout de score ni réécriture.'
  note: 'Les fonctions proposées, comparaisons et hypothèses FLOW sont une analyse séparée dans le dossier économique.
    Atlas présente sa publication courante. Cette étude conserve la capture qui définit son périmètre.'
  link:
    href: https://laurent-sintes.github.io/Urbanisation-SCM/
    label: Ouvrir la cartographie Beaumanoir dans FLOW Atlas
