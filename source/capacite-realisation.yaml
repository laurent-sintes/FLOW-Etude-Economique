hotspots:
- id: stocks
  title: Intégrer les stocks sans doubler leurs effets
  capability_refs:
  - D01.f
  - D01.g
  risk: Des doublons ou corrections tardives peuvent fausser une situation de stock et sa justification.
  action: 'Rejouer des faits dupliqués, corrigés et reçus hors ordre. Vérifier une situation à date et la provenance de
    chaque effet.'
  available_refs:
  - cartographie
  expected_refs:
  - demonstration
  gate_ref: preuve-produit
  role_ref: realisation
- id: propositions
  title: Expliquer les propositions de réapprovisionnement
  capability_refs:
  - D05.e
  - D05.a
  risk: Une recommandation peut paraître correcte tout en masquant les contraintes ou compromis qui la rendent inapplicable.
  action: 'Confronter des pénuries et contraintes concurrentes à des résultats acceptables définis avec le métier. Expliquer
    les écarts sans présumer un solveur global.'
  available_refs:
  - cartographie
  expected_refs:
  - demonstration
  gate_ref: preuve-produit
  role_ref: produit
- id: reprise
  title: Reprendre un parcours après interruption
  capability_refs:
  - order-workflow-orchestration
  - process-exception-management
  risk: Une reprise peut répéter un effet déjà réalisé ou perdre la responsabilité d’une exception.
  action: 'Interrompre puis reprendre un parcours avec interventions humaines. Vérifier progression, effets uniques, résolution
    et traçabilité.'
  available_refs:
  - cartographie
  expected_refs:
  - demonstration
  - acceptation
  gate_ref: pilote
  role_ref: realisation
- id: references
  title: Rapprocher les références sans remplacer leurs maîtres
  capability_refs:
  - master-data-ingestion
  risk: Des identités ou versions incohérentes peuvent contaminer les parcours malgré une interface techniquement
    disponible.
  action: 'Éprouver rapprochement, quarantaine et rejeu sur des données représentatives. Attribuer le nettoyage et les
    décisions aux responsables des référentiels.'
  available_refs:
  - cartographie
  expected_refs:
  - demonstration
  - acceptation
  gate_ref: pilote
  role_ref: integration
