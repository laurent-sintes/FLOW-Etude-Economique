  - capacite
  proof_refs:
  - organisation
  - references-exalt
  - equipe-exalt
  depends_on: []
  decision_ref: capacite
  proceed: Les responsabilités critiques disposent d’acteurs et de moyens confirmés.
  reconsider: Une responsabilité essentielle ou une capacité indispensable ne peut pas être tenue.
- id: preuve-produit
  title: Avant de généraliser les mécanismes
  expected: Les points chauds et exigences de service sont éprouvés sur des cas représentatifs.
  validation_owner: Produit, architecture et QA, proposition à confirmer.
  status: a_demontrer
  criteria_refs:
  - preuve
  proof_refs:
  - demonstration
  depends_on:
  - dispositif
  decision_ref: metier
  proceed: Les résultats attendus sont observés et les écarts acceptés explicitement.
  reconsider: Un besoin impératif échoue ou l’avantage recherché du Make n’est pas démontré.
- id: pilote
  title: Avant les déploiements suivants
  expected: Le pilote est accepté, sa reprise maîtrisée et les conditions des prochaines unités examinées.
  validation_owner: Métiers et exploitation, proposition à confirmer.
  status: a_demontrer
  criteria_refs:
  - preuve
  - trajectoire
  proof_refs:
  - acceptation
  depends_on:
