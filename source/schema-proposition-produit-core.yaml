type: object
additionalProperties: false
properties:
  version:
    const: 1
  id:
    const: professional-product-proposal
  status:
    enum:
    - proposal_not_adopted
    - retained
  stack:
    const: java-spring
  inputs:
    type: object
    additionalProperties: false
    properties:
      path: &id001
        type: string
        minLength: 1
      sha256:
        type: string
        pattern: ^[a-f0-9]{64}$
    required:
    - path
    - sha256
  reading:
    type: object
    additionalProperties: *id001
  technical_trials:
    type: object
    additionalProperties: false
    properties:
      id:
        const: temporal-mining-2026-10-31
      evaluated_on: &id002
        type: string
        minLength: 1
      status:
        const: targeted_trials_completed
      effort_effect:
        const: unchanged
      evidence:
        type: object
        additionalProperties: false
        properties:
          path: *id002
          sha256:
            type: string
            pattern: ^[a-f0-9]{64}$
        required:
        - path
        - sha256
      reading:
        type: object
        additionalProperties: false
        properties:
          title: *id002
          conclusion: *id002
          checks: *id002
          observed: *id002
          remaining: *id002
          funding: *id002
          stop: *id002
        required:
        - title
        - conclusion
        - checks
        - observed
        - remaining
        - funding
        - stop
      observations:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          properties:
            id: *id002
            label: *id002
            detail: *id002
          required:
          - id
          - label
          - detail
      funding:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          properties:
            requirement: *id002
            module_refs:
              type: array
              minItems: 1
              uniqueItems: true
              items: *id002
            basis: *id002
          required:
          - requirement
          - module_refs
          - basis
      remaining:
        type: array
        minItems: 1
        items: *id002
      runtime_versions:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
    required:
    - id
    - evaluated_on
    - status
    - effort_effect
    - evidence
    - reading
    - observations
    - funding
    - remaining
    - runtime_versions
  adoption:
    type: object
    additionalProperties: false
    properties:
      decision_date:
        type: string
        minLength: 1
      basis:
        type: object
        additionalProperties: false
        properties:
          path:
            type: string
            minLength: 1
          sha256:
            type: string
            pattern: ^[a-f0-9]{64}$
        required:
        - path
        - sha256
      unit_ids:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          minLength: 1
    required:
    - decision_date
    - basis
    - unit_ids
required:
- version
- id
- status
- stack
- inputs
- reading
- technical_trials
allOf:
- if:
    properties:
      status:
        const: retained
  then:
    required:
    - adoption
