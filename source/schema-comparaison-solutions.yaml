$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required:
- version
- id
- date
- context
- reading
- sources
- business_areas
- gaps
- rfi_crosswalk
properties:
  version:
    const: 1
  id:
    const: comparaison-solutions-flow
  date:
    type: string
    format: date
  context:
    type: object
    additionalProperties: false
    required:
    - scope_ref
    - product_refs
    - architecture_status
    - historical_offers
    - meaning
    properties:
      scope_ref:
        const: source/references-couts-integration.yaml#reperes_build_core/etude_oss/perimetre
      product_refs: &id002
        type: array
        uniqueItems: true
        items: &id001
          type: string
          minLength: 1
      architecture_status:
        const: indetermine_rfi
      historical_offers: *id001
      meaning: *id001
  reading:
    type: object
    additionalProperties: false
    required:
    - tests_unit
    - new_work
    - existing_processes
    - existing_models
    - deliverable
    - role
    - instruction_back
    - instruction_open
    - scope_prepared
    - count_unit
    - calculation_base
    - outside_scope
    - integration_scope
    - core_scope
    - phase_boundaries
    - buy_instruction
    - next_instruction
    - bank_unit
    - bank
    - backlog_count
    - allocation_note
    - backlog_allocation
    - coherent_lot
    - baseline
    - sizing_attempt
    - experiment_count
    - experiment
    - expected
    - covered_by
    - observation
    - criterion
    - instruction_title
    - title
    - intro
    - scope
    - limits
    - source_limit
    - proof_limit
    - funding_limit
    - mapping_note
    - unknown
    - coverage_unknown
    - date
    - search
    - products
    - all
    - oss
    - buy
    - results
    - business_area
    - select
    - sources
    - target
    - next
    - commercial
    - composition
    - version
    - gaps
    - gaps_intro
    - make
    - buy_consequence
    - scenario
    - funding
    - extra
    - not_estimated
    - adopted
    - unit
    - method
    - method_steps
    - crosswalk
    - needs
    - review
    - unreviewed
    - financial
    - empty
    - no_gaps
    - detail_link
    - status_labels
    - commercial_labels
    properties:
      tests_unit:
        type: string
        minLength: 1
      new_work:
        type: string
        minLength: 1
      existing_processes:
        type: string
        minLength: 1
      existing_models:
        type: string
        minLength: 1
      deliverable:
        type: string
        minLength: 1
      role:
        type: string
        minLength: 1
      instruction_back:
        type: string
        minLength: 1
      instruction_open:
        type: string
        minLength: 1
      scope_prepared:
        type: string
        minLength: 1
      count_unit:
        type: string
        minLength: 1
      calculation_base:
        type: string
        minLength: 1
      outside_scope:
        type: string
        minLength: 1
      integration_scope:
        type: string
        minLength: 1
      core_scope:
        type: string
        minLength: 1
      phase_boundaries:
        type: string
        minLength: 1
      buy_instruction:
        type: string
        minLength: 1
      next_instruction:
        type: string
        minLength: 1
      bank_unit:
        type: string
        minLength: 1
      bank:
        type: string
        minLength: 1
      backlog_count:
        type: string
        minLength: 1
      allocation_note:
        type: string
        minLength: 1
      backlog_allocation:
        type: string
        minLength: 1
      coherent_lot:
        type: string
        minLength: 1
      baseline:
        type: string
        minLength: 1
      sizing_attempt:
        type: string
        minLength: 1
      experiment_count:
        type: string
        minLength: 1
      experiment:
        type: string
        minLength: 1
      expected:
        type: string
        minLength: 1
      covered_by:
        type: string
        minLength: 1
      observation:
        type: string
        minLength: 1
      criterion:
        type: string
        minLength: 1
      instruction_title:
        type: string
        minLength: 1
      title: *id001
      intro: *id001
      scope: *id001
      limits: *id001
      source_limit: *id001
      proof_limit: *id001
      funding_limit: *id001
      mapping_note: *id001
      unknown: *id001
      coverage_unknown: *id001
      date: *id001
      search: *id001
      products: *id001
      all: *id001
      oss: *id001
      buy: *id001
      results: *id001
      business_area: *id001
      select: *id001
      sources: *id001
      target: *id001
      next: *id001
      commercial: *id001
      composition: *id001
      version: *id001
      gaps: *id001
      gaps_intro: *id001
      make: *id001
      buy_consequence: *id001
      scenario: *id001
      funding: *id001
      extra: *id001
      not_estimated: *id001
      adopted: *id001
      unit: *id001
      method: *id001
      method_steps: *id002
      crosswalk: *id001
      needs: *id001
      review: *id001
      unreviewed: *id001
      financial: *id001
      empty: *id001
      no_gaps: *id001
      detail_link: *id001
      status_labels:
        type: object
        additionalProperties: false
        required:
        - briques_documentees
        - declare_rfi
        - analogie_a_qualifier
        - ecart_explicite
        - non_etabli
        - hors_perimetre
        properties:
          briques_documentees: *id001
          declare_rfi: *id001
          analogie_a_qualifier: *id001
          ecart_explicite: *id001
          non_etabli: *id001
          hors_perimetre: *id001
      commercial_labels:
        type: object
        additionalProperties: false
        required:
        - non_etabli
        - panier_partiel
        - panier_nommee
        - option_architecture
        - composant_non_inclus
        - droits_non_etablis
        properties:
          non_etabli: *id001
          panier_partiel: *id001
          panier_nommee: *id001
          option_architecture: *id001
          composant_non_inclus: *id001
          droits_non_etablis: *id001
  sources:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - id
      - label
      - source_ref
      - location
      - kind
      - observation
      properties:
        id: *id001
        label: *id001
        source_ref: *id001
        location: *id001
        kind: *id001
        observation: *id001
  business_areas:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - business_area_ref
      - target
      - next_qualification
      - assessments
      properties:
        business_area_ref: *id001
        target: *id001
        next_qualification: *id001
        assessments:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - product_ref
            - reading_status
            - summary
            - evidence_refs
            - commercial_status
            - complete_ba_coverage
            - review
            properties:
              product_ref: *id001
              reading_status:
                enum:
                - briques_documentees
                - declare_rfi
                - analogie_a_qualifier
                - ecart_explicite
                - non_etabli
                - hors_perimetre
              summary: *id001
              evidence_refs: *id002
              commercial_status:
                enum:
                - non_etabli
                - panier_partiel
                - panier_nommee
                - option_architecture
                - composant_non_inclus
                - droits_non_etablis
              complete_ba_coverage:
                type:
                - boolean
                - 'null'
              review:
                anyOf:
                - type: 'null'
                - type: object
                  additionalProperties: false
                  required:
                  - date
                  - reviewer
                  - decision
                  properties:
                    date:
                      type: string
                      format: date
                    reviewer: *id001
                    decision:
                      enum:
                      - a_completer
                      - retenu
  gaps:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - business_area_refs
      - evidence_refs
      - priority
      - make_consequence
      - buy_consequence
      - acceptance_scenario
      - funding_owner_refs_to_reconcile
      - product_refs
      - treatment_status
      - net_extra_jh
      - net_extra_initial_eur_ht
      - net_extra_annual_eur_ht
      properties:
        id: *id001
        title: *id001
        business_area_refs: *id002
        evidence_refs: *id002
        priority:
          enum:
          - P0
          - P1
        make_consequence: *id001
        buy_consequence: *id001
        acceptance_scenario: *id001
        funding_owner_refs_to_reconcile: *id002
        product_refs: *id002
        treatment_status:
          enum:
          - a_qualifier
          - traite
        instruction:
          type: object
          additionalProperties: false
          required:
          - id
          - date
          - status
          - title
          - conclusion
          - scope
          - boundaries
          - criteria
          - experiment
          - quantification
          - next_steps
          - buy_followup
          properties:
            id: &gcase001
              type: string
              minLength: 1
            date:
              type: string
              format: date
            status:
              const: qualification_partielle
            title: *gcase001
            conclusion: *gcase001
            scope: *gcase001
            boundaries:
              type: object
              additionalProperties: false
              required:
              - core
              - integration
              - excluded
              properties:
                core: &gcase002
                  type: array
                  uniqueItems: true
                  items: *gcase001
                integration: *gcase002
                excluded: *gcase002
            criteria:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required:
                - id
                - title
                - need_refs
                - expected
                - observed
                - evidence_refs
                - mechanism_refs
                - native_status
                properties:
                  id: *gcase001
                  title: *gcase001
                  need_refs: *gcase002
                  expected: *gcase001
                  observed: *gcase001
                  evidence_refs: *gcase002
                  mechanism_refs: *gcase002
                  native_status:
                    enum:
                    - partiel
                    - a_demontrer
            experiment:
              type: object
              additionalProperties: false
              required:
              - report_ref
              - report_sha256
              - implementation_ref
              - implementation_sha256
              - interpretation
              properties:
                report_ref: *gcase001
                report_sha256:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                implementation_ref: *gcase001
                implementation_sha256:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                interpretation: *gcase001
            quantification:
              type: object
              additionalProperties: false
              required:
              - status
              - calculation_ref
              - family_refs
              - new_equivalent_units
              - new_cfp
              - net_extra_jh
              - reason
              - cocomo_treatment
              - cosmic_treatment
              - decision
              properties:
                status:
                  const: complement_non_isole
                calculation_ref: *gcase001
                family_refs: *gcase002
                new_equivalent_units:
                  const: null
                new_cfp:
                  const: null
                net_extra_jh:
                  const: null
                reason: *id001
                cocomo_treatment: *id001
                cosmic_treatment: *id001
                decision: *id001
            next_steps:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required:
                - title
                - role
                - deliverable
                properties:
                  title: *id001
                  role: *id001
                  deliverable: *id001
            buy_followup:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required:
                - product_ref
                - evidence_refs
                - conclusion
                - requested
                properties:
                  product_ref: *id001
                  evidence_refs: *id002
                  conclusion: *id001
                  requested: *id001
        net_extra_jh:
          const: null
        net_extra_initial_eur_ht:
          const: null
        net_extra_annual_eur_ht:
          const: null
  rfi_crosswalk:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - id
      - business_area_ref
      - capability_ref
      - bc_ref
      - proposed_need_refs
      - rfi_source_ref
      - rfi_location
      - gap_ref
      - evidence_refs
      - mapping_status
      - scope_note
      properties:
        id: *id001
        business_area_ref: *id001
        capability_ref: *id001
        bc_ref: *id001
        proposed_need_refs: *id002
        rfi_source_ref: *id001
        rfi_location: *id001
        gap_ref: *id001
        evidence_refs: *id002
        mapping_status:
          const: propose_non_revu
        scope_note: *id001
