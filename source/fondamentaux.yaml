  rules:
  - id: common_work_estimation_contract
    title: Estimer les travaux et rapprocher leurs coûts sans modifier les décisions
    kind: algorithm
    expression: Charge valorisée par rôle × tarif + frais + arrondi = coût retenu. Les propositions restent séparées
      et les inconnus restent null.
    variables:
      reference: Mesures source retenues, leur phase et leur période.
      detail: Quantité, préparation, charge unitaire, gain et tarif par rôle avec justification.
      proposal: Calcul séparé sans adoption automatique ni modification du journal de financement.
      bridge: Rapprochement des tarifs et JH valorisés avec chaque mesure monétaire, sans conversion implicite d’un
        forfait en JH.
    unit: JH, EUR HT, quantités et pourcentages
    note: Les charges brutes et nettes du MCO restent distinctes. Les charges d’intégration en attente ne sont pas
      réintroduites. Les coûts des rôles suivent les clés de leurs contributions.
  - id: generic_work_contribution_conservation
    title: Ventiler les unités de travail sans modifier les mesures retenues
    expression: mesure source = contributions des équipes + gouvernance + reliquat. Conserver chaque rôle, son tarif
      et chaque centime.
    variables:
      mesure_source: Mesure unique rattachée à une unité, une phase et une période.
      contributions: Clés par unité et rôle. Les capacités sont des liens de périmètre, sans poids budgétaire.
      reliquat: Part non attribuée. Les inconnus restent null, les candidats restent sans affectation.
    unit: JH, EUR HT et pourcentages de ventilation
    kind: algorithm
    note: Les coûts de rôles suivent les parts des JH aux tarifs existants. Les frais se ventilent séparément par
      différences de cumuls arrondis. Une décomposition ne duplique pas un budget parent.
  - id: delivery_allocation_conservation
    title: Conserver les charges et coûts dans la lecture par équipe
    expression: source = affectations + gouvernance + reliquat, pour chaque phase et mesure
    variables:
      source: JH des travaux connus ou coûts déjà valorisés, sur une assiette explicitement identifiée.
      affectations: Sources rattachées à une équipe. Un candidat ne reçoit aucune charge par défaut.
      gouvernance: Postes de gouvernance conservés hors typologie.
      reliquat: Sources connues restant à ventiler. Une absence de dimensionnement reste null.
    unit: JH ou EUR HT, avec régime initial ou annuel explicite
    kind: algorithm
    note: La construction et l’intégration sont des périodes initiales. Le MCO est une base annuelle. Les montants
      dérivent du moteur existant et ne créent aucun budget. La capacité disponible reste distincte.
  - id: market_comparison_contract
    title: Comparer les solutions sans inventer couverture ou budget
    expression: Dériver les BA et capacités du référentiel natif. Séparer preuves, correspondances, inclusion commerciale
      et revue. Une couverture complète exige chaque besoin instruit et une revue retenue. Les écarts et financements
      inconnus restent non dimensionnés.
    variables:
      native_scope: Hiérarchie reçue et exclusions comparatives
      assessments: Appuis documentaires et qualifications détaillées
      gaps: Écarts, traitements et financements candidats
    unit: Statuts documentaires, sans nouveau budget
    kind: algorithm
    note: Le nombre de preuves n’est pas un score de couverture. Les montants adoptés restent lus chez leur propriétaire.
      Un écart commun ne crée pas plusieurs budgets.
  - id: cocomo_exponent
    title: Exposant d’effort
    expression: B + 0.01 * SF_sum
    variables:
      B: constante COCOMO
      SF_sum: somme des facteurs d’échelle
    unit: sans unité
    kind: arithmetic
    note: ''
    domains:
      B:
        minimum: 0
      SF_sum:
        minimum: 0
  - id: schedule_exponent
    title: Exposant de délai
    expression: D + 0.2 * (E - B)
    variables:
      D: constante de délai
      E: exposant d’effort
      B: constante COCOMO
    unit: sans unité
    kind: arithmetic
    note: ''
    domains:
      D:
        minimum: 0
      E:
        minimum: 0
      B:
        minimum: 0
  - id: cocomo_effort
    title: Effort COCOMO sur les phases déclarées
    expression: A * KSLOC ** E * EM * SCED * month_hours / day_hours * effort_phase_factor
    variables:
      A: constante COCOMO
      KSLOC: milliers de lignes logiques équivalentes après réutilisation
      E: exposant
      EM: produit des autres multiplicateurs
      SCED: multiplicateur d’effort de contrainte de délai
      month_hours: heures par mois-personne
      day_hours: heures par JH
      effort_phase_factor: extension aux phases incluses
    unit: JH
    kind: arithmetic
    note: ''
    domains:
      A:
        minimum: 0
      KSLOC:
        minimum: 0
      E:
        minimum: 0
      EM:
        minimum: 0
      SCED:
        exclusiveMinimum: 0
      month_hours:
        exclusiveMinimum: 0
      day_hours:
        exclusiveMinimum: 0
      effort_phase_factor:
        exclusiveMinimum: 0
  - id: cosmic_effort
    title: Effort fonctionnel COSMIC × ISBSG
    expression: CFP * hours_per_CFP * factor / day_hours
    variables:
      CFP: taille fonctionnelle
      hours_per_CFP: heures par CFP et activités couvertes
      factor: ajustement justifié
      day_hours: heures par JH
    unit: JH
    kind: arithmetic
    note: 20 h/CFP et le facteur 1 sont des hypothèses de ce pilote, pas une calibration FLOW.
    domains:
      CFP:
        minimum: 0
      hours_per_CFP:
        minimum: 0
      factor:
        minimum: 0
      day_hours:
        exclusiveMinimum: 0
  - id: cocomo_schedule
    title: Délai COCOMO aux conditions nominales
    expression: C * (JH / effort_phase_factor * day_hours / month_hours / SCED) ** F * schedule_phase_factor
    variables:
      C: constante de délai
      JH: effort projet adopté
      effort_phase_factor: extension des phases
      day_hours: heures par JH
      month_hours: heures par mois-personne
      SCED: multiplicateur d’effort retiré de PMns
      F: exposant de délai
      schedule_phase_factor: extension aux phases du délai
    unit: mois
    kind: arithmetic
    note: Cas nominal SCED=1. Une compression de calendrier exige la modélisation du pourcentage de délai correspondant.
      Ne pas déduire ce pourcentage du multiplicateur d’effort.
    domains:
      C:
        minimum: 0
      JH:
        minimum: 0
      effort_phase_factor:
        exclusiveMinimum: 0
      day_hours:
        exclusiveMinimum: 0
      month_hours:
        exclusiveMinimum: 0
      SCED:
        exclusiveMinimum: 0
      F:
        minimum: 0
      schedule_phase_factor:
        minimum: 0
  - id: signed_gap
    title: Écart par rapport au calcul de référence
    expression: candidate - reference
    variables:
      candidate: calcul comparé non arrondi
      reference: calcul de référence non arrondi
    unit: JH
    kind: arithmetic
    note: ''
    domains:
      candidate:
        minimum: 0
      reference:
        minimum: 0
  - id: signed_gap_pct
    title: Écart en pourcentage du calcul de référence
    expression: 100 * (candidate - reference) / reference
    variables:
      candidate: calcul comparé non arrondi
      reference: calcul de référence strictement positif
    unit: '%'
    kind: arithmetic
    note: ''
    domains:
      candidate:
        minimum: 0
      reference:
        exclusiveMinimum: 0
  - id: spread
    title: Dispersion entre références
    expression: maximum - minimum
    variables:
      maximum: maximum des calculs comparables
      minimum: minimum des calculs comparables
    unit: JH
    kind: arithmetic
    note: ''
    domains:
      maximum:
        minimum: 0
      minimum:
        minimum: 0
  - id: spread_pct
    title: Dispersion relative
    expression: 100 * (maximum - minimum) / reference
    variables:
      maximum: maximum
      minimum: minimum
      reference: ancrage non arrondi explicitement nommé
    unit: '%'
    kind: arithmetic
    note: ''
    domains:
      maximum:
        minimum: 0
      minimum:
        minimum: 0
      reference:
        exclusiveMinimum: 0
  - id: implied_productivity
    title: Productivité fonctionnelle équivalente
    expression: JH * day_hours / CFP
    variables:
      JH: effort COCOMO
      day_hours: heures par JH
      CFP: taille fonctionnelle strictement positive
    unit: h/CFP
    kind: arithmetic
    note: ''
    domains:
      JH:
        minimum: 0
      day_hours:
        exclusiveMinimum: 0
      CFP:
        exclusiveMinimum: 0
  - id: role_price
    title: Valorisation par rôle
    expression: JH * rate
    variables:
      JH: effort du rôle
      rate: tarif du rôle
    unit: EUR HT
    kind: arithmetic
    note: ''
    domains:
      JH:
        minimum: 0
      rate:
        minimum: 0
  - id: average_team
    title: Capacité moyenne nécessaire
    expression: JH / months / capacity
    variables:
      JH: effort total
      months: délai retenu
      capacity: JH productifs par personne et mois
    unit: ETP
    kind: arithmetic
    note: Contrôle de capacité. Pas un délai indépendant calculé par une deuxième méthode.
    domains:
      JH:
        minimum: 0
      months:
        exclusiveMinimum: 0
      capacity:
        exclusiveMinimum: 0
  - id: coverage
    title: Couverture du référentiel
    expression: 100 * covered / total
    variables:
      covered: capacités distinctes couvertes par une décision
      total: capacités distinctes du périmètre reçu
    unit: '%'
    kind: arithmetic
    note: Mesure de périmètre. Aucune mesure de certitude.
    domains:
      covered:
        minimum: 0
      total:
        exclusiveMinimum: 0
  - id: role_allocation
    title: Ventiler les activités puis les rôles
    expression: JH_role = somme_activités(JH_total × part_activité × clé_activité_rôle)
    variables:
      part_activité: somme des poids de phase × pourcentages publiés / somme des poids / 100
      clé_activité_rôle: hypothèse d’organisation. Somme 1 par activité
    unit: JH
    kind: algorithm
    note: Arrondi par plus grands restes au pas déclaré. Départager les égalités par identifiant. Conserver exactement
      le total.
  - id: retained_rounding
    title: Adopter et arrondir
    expression: arrondi_half_up(résultat / pas) × pas
    variables:
      résultat: calcul choisi par décision
      pas: pas explicite de décision
    unit: JH ou mois
    kind: algorithm
    note: Le résultat arrondi ne remplace pas le résultat de comparaison.
  - id: nonlinear_complements
    title: Contribution marginale des compléments
    expression: effort(taille_commune + taille_compléments) - effort(taille_commune)
    variables:
      taille_commune: taille équivalente commune
      taille_compléments: taille des compléments après réutilisation
    unit: JH
    kind: algorithm
    note: COCOMO est non linéaire. Ne pas additionner des estimations isolées comme si elles formaient le même projet.
  - id: integration_unit_dimensioning
    title: Dimensionner les travaux communs d’intégration
    expression: préparation_fixe_par_rôle + quantité_commune × charge_unitaire_par_rôle
    variables:
      inputs: Livrable et recette communs, quantité justifiée, charges par rôle propres à chaque option.
    unit: JH
    kind: algorithm
    note: Une inconnue conserve un résultat inconnu. Les difficultés sont décrites sans coefficient ordinal. Les
      financements existants et forfaits partagés sont rapprochés sans ventilation inventée ni addition automatique
      aux budgets. Chaque option qualifie la couverture de la ligne, les postes sources et le travail restant. Les
      charges Make sont lues dans les activités actives. Les observations Buy conservent le périmètre du pilote
      ou du lot et les recouvrements entre vues.
  - id: transformation_team_cost
    title: Financer le Transformation Office sur les deux phases
    expression: somme(ETP_rôle × jours_annuels × tarif_rôle × mois_phase / 12)
    variables:
      inputs: Cinq postes dédiés, jours annuels et tarifs dans source/modele-composable.yaml. Durées d’obtention
        et d’intégration de chaque option.
    unit: EUR HT
    kind: algorithm
    note: Une même équipe client à temps plein sur les deux phases. Prorata mensuel et arrêt à la fin de l’intégration.
      La direction de programme interne est exclue. Remplacer les provisions identifiées, conserver les missions
      locales et ne déduire aucune part supposée des forfaits Buy.
  - id: economic_total
    title: Total financé
    expression: somme(JH_rôle × TJM_rôle) + outillage + achats explicites
    variables:
      outillage: assiette et prix selon le modèle économique
      achats: éléments hors effort humain
    unit: EUR HT
    kind: algorithm
    note: Ne pas ajouter une provision globale de pilotage ou une remise IA aux familles dont ces activités sont
      déjà incluses.
  - id: eligible_gains
    title: Gains sur activités éligibles
    expression: JH_nets = JH_bruts × (1 - gain_pct / 100)
    variables:
      inputs: Paramètres des instances propriétaires, avec unités et périodes explicites.
    unit: JH
    kind: algorithm
    note: Les familles Core System adoptées conservent leur total. Aucune remise globale. Les autres activités conservent
      leurs règles existantes.
  - id: annual_work_cost
    title: Travaux annuels
    expression: volume_annuel × JH_unitaires × (1 - gain_pct / 100) × TJM
    variables:
      inputs: Paramètres des instances propriétaires, avec unités et périodes explicites.
    unit: EUR HT/an
    kind: algorithm
    note: Conserver les rôles, activités, hypothèses de volume et dates de début. Les contrats inclus ne sont pas
      refacturés.
  - id: inflation
    title: Indexation par catégorie
    expression: montant_base × (1 + taux_catégorie) ** ancienneté
    variables:
      inputs: Paramètres des instances propriétaires, avec unités et périodes explicites.
    unit: EUR HT
    kind: algorithm
    note: Catégories et conventions temporelles dans les paramètres. Pas de normalisation monétaire cachée.
  - id: period_allocation
    title: Répartir le financement par période
    expression: arrondi_centime(cumul_fin_période) - arrondi_centime(cumul_début_période)
    variables:
      inputs: Paramètres des instances propriétaires, avec unités et périodes explicites.
    unit: EUR HT
    kind: algorithm
    note: Les différences de cumuls préservent les centimes et le total financé.
  - id: horizon_total
    title: Coût à un horizon
    expression: somme des dépenses du journal dans la période sélectionnée
    variables:
      inputs: Paramètres des instances propriétaires, avec unités et périodes explicites.
    unit: EUR HT
    kind: algorithm
    note: Les périodes de lecture couvrent 1 à 15 années entières depuis le début du projet, la disponibilité du
      Core System ou la fin de l’intégration Groupe. Les raccourcis 3/5/7/10/15 ans sont conservés. Les dépenses
      antérieures au jalon sont exclues. La projection couvre la fin de la période choisie, même au-delà de quinze
      ans depuis le début du projet. Les différences de cumuls annuels conservent les centimes, les séquences fournisseur
      et l’origine de l’indexation. Les budgets initiaux complets et les bases annuelles restent séparés. Le reste
      à financer est apprécié à la fin de la période et ne crée pas de nouvelle dépense.
  - id: reuse_assimilation
    title: Assimilation et intégration du patrimoine réutilisé
    expression: (AA + 0.3 * IM) / 100
    variables:
      AA: évaluation et assimilation du composant
      IM: part de travail d’intégration et vérification
    unit: sans unité
    kind: arithmetic
    note: 'Cas simplifié retenu : conception et code réutilisés sans modification, DM=CM=0 et SU=0. AA et IM sont
      des hypothèses. Le cas général COCOMO nécessite d’autres facteurs.'
    domains:
      AA:
        minimum: 0
        maximum: 8
      IM:
        minimum: 0
        maximum: 100
  - id: equivalent_size
    title: Taille logique équivalente après réutilisation
    expression: new_program + w * new_declarative + AAM * (reused_program + w * reused_declarative)
    variables:
      new_program: unités programme neuves
      new_declarative: unités déclaratives neuves
      reused_program: unités programme réutilisées
      reused_declarative: unités déclaratives réutilisées
      w: poids du déclaratif
      AAM: coefficient de réutilisation
    unit: unités logiques équivalentes
    kind: arithmetic
    note: Unités logiques comptées et hypothèses de pondération conservées séparément. KSLOC = ESLOC / 1000.
    domains:
      new_program:
        minimum: 0
      new_declarative:
        minimum: 0
      reused_program:
        minimum: 0
      reused_declarative:
        minimum: 0
      w:
        minimum: 0
      AAM:
        minimum: 0
        maximum: 1
  - id: calculation_binding
    title: Lier une décision à son calcul
    expression: Même unité, stack, capacités natives, version de source et périmètre des activités.
    variables:
      inputs: Instances et preuves du registre des calculs
    unit: contrôle
    kind: algorithm
    note: Chaque décision conserve le lien vers les mesures et hypothèses de son propre périmètre.
  - id: evidence_closure
    title: Vérifier les preuves de bout en bout
    expression: Recalculer les empreintes de toutes les dépendances déclarées. Rejeter cycles, dépendances omises
      et pièces modifiées.
    variables:
      inputs: Instances et preuves du registre des calculs
    unit: contrôle
    kind: algorithm
    note: Les versions et empreintes permettent de retrouver les entrants exacts du calcul.
  - id: unique_mechanism_funding
    title: Financer chaque mécanisme une fois
    expression: Un propriétaire par mécanisme. Un consommateur référence le financement adopté sans recopier sa
      taille.
    variables:
      inputs: Instances et preuves du registre des calculs
    unit: contrôle
    kind: algorithm
    note: Les adaptations restent dans le lot consommateur. Le mécanisme partagé reste dans son lot propriétaire.
  - id: decision_consolidation
    title: Cumuler les décisions adoptées
    expression: Sommer les décisions après contrôle des financements. Aucune estimation intégrée COCOMO ni somme
      des délais locaux.
    variables:
      inputs: Instances et preuves du registre des calculs
    unit: contrôle
    kind: algorithm
    note: Le cumul additionne les efforts des lots adoptés après déduplication des financements.
  - id: prepare_size
    title: Reconstruire les tailles depuis les mesures
    expression: Réconcilier les fichiers mesurés, pondérer le déclaratif, appliquer la réutilisation et compter
      les compléments distincts. Affiner avec les méthodes enregistrées.
    variables:
      inputs: Instances et preuves du registre des calculs
    unit: contrôle
    kind: algorithm
    note: La taille préparée distingue le code de référence, la réutilisation et les compléments Flow.
  - id: cosmic_count
    title: Recompter les mouvements COSMIC
    expression: Sommer les mouvements E/R/W/X de 1 CFP. Groupes, processus et mouvements distincts et référencés.
    variables:
      inputs: Instances et preuves du registre des calculs
    unit: contrôle
    kind: algorithm
    note: E désigne une entrée, R une lecture, W une écriture et X une sortie de données.
  - id: comparison_contract
    title: Qualifier la comparaison
    expression: Contrôler les unités et activités. Exposer les différences de périmètre et les garanties de service
      non appariées.
    variables:
      inputs: Instances et preuves du registre des calculs
    unit: contrôle
    kind: algorithm
    note: La comparaison rapproche les mêmes fonctions, activités et conventions horaires.
  - id: component_attribution
    title: Attribuer une taille métier au code mixte
    expression: max(taille source après retrait du patrimoine déjà financé × part supposée, plancher métier mesuré)
    variables:
      inputs: Mesures sources, déductions du financement existant, part de pertinence et plancher par fichier
    unit: unités logiques équivalentes
    kind: algorithm
    note: Union des fichiers et des instructions avant calcul. Attribution d’ingénierie, sans score de complexité
      ni proportion observée.
  - id: module_analogy
    title: Dimensionner un module nouveau par analogie
    expression: reference_units * fraction + scaffold_units
    variables:
      reference_units: Comportement natif après déduction du patrimoine déjà financé
      fraction: Fraction de comportement nouveau supposée, pas norme de marché
      scaffold_units: Structure du service nouveau mesurée dans la technologie native
    domains:
      reference_units:
        minimum: 0
      fraction:
        minimum: 0
      scaffold_units:
        minimum: 0
    unit: unités logiques équivalentes
    kind: arithmetic
    note: Schémas, vues et configurations ajoutés séparément. Les fractions et les partages du code restent des
      hypothèses explicites.
  - id: funded_module_preparation
    title: Dimensionner de nouveaux modules sur des analogues déjà financés
    expression: Reconstruire les analogues du calcul propriétaire référencé, appliquer les fractions de modules
      nouveaux et leurs modèles. Ne pas ajouter le code déjà financé à la nouvelle famille.
    variables:
      inputs: Contrat propre à la famille, preuves et contrat figé du fournisseur des analogues
    unit: contrôle
    kind: algorithm
    note: La dépendance au fournisseur et le propriétaire de financement sont explicites. Le contrôle de taille
      ne valide pas la suffisance des fractions ni la productivité.
  - id: coherent_component_preparation
    title: Préparer une unité de composants cohérents
    expression: Reconstruire les atomes et analogues natifs, attribuer la base une seule fois, sommer les tailles
      des modules de l’unité puis appliquer COCOMO II une fois. Recompter COSMIC à la même frontière.
    variables:
      inputs: Contrat d’unité, archives complètes figées, mesures, modules, gabarits, allocations et comptage fonctionnel
    unit: contrôle
    kind: algorithm
    note: Les archives gzip/base64 sont des preuves complètes de stockage. Les fractions restent des hypothèses.
      Les allocations entre familles ne sont pas des estimations indépendantes par capacité.
  - id: purpose_unallocated_jh
    title: JH adoptés non encore ventilés entre Core Domain et Support
    expression: total - business - it
    variables:
      total: Total adopté sur la même assiette
      business: Part Core Domain explicitement attribuée. Le nom de variable historique reste compatible.
      it: Part Support explicitement attribuée. Le nom de variable historique reste compatible.
    unit: JH
    kind: arithmetic
    note: Les parts attribuées ne sont pas une nouvelle estimation. Leur somme et le non ventilé doivent conserver
      le total et chaque rôle.
    domains:
      total:
        minimum: 0
      business:
        minimum: 0
      it:
        minimum: 0
  - id: purpose_unallocated_cost
    title: Coût adopté non encore ventilé entre Core Domain et Support
    expression: total - business - it
    variables:
      total: Total adopté sur la même assiette
      business: Part Core Domain explicitement attribuée. Le nom de variable historique reste compatible.
      it: Part Support explicitement attribuée. Le nom de variable historique reste compatible.
    unit: EUR HT
    kind: arithmetic
    note: Les parts attribuées ne sont pas une nouvelle estimation. Leur somme et le non ventilé doivent conserver
      le total et chaque rôle.
    domains:
      total:
        minimum: 0
      business:
        minimum: 0
      it:
        minimum: 0
  - id: product_purpose_partition
    title: Ventilation Core Domain et Support du produit
    expression: Contrôler les fonctions professionnelles et leurs preuves. Ventiler les JH adoptés par rôles et
      finalités seulement sur une attribution justifiée. Conserver le reste non ventilé et le complément requis
      inconnu.
    variables:
      adopted_units: Décisions adoptées et valorisées
      declared_allocations: Attributions étayées en JH par rôle
      professional_functions: Fonctions du produit et réutilisation à qualifier
    unit: Ventilation des JH et EUR HT adoptés, sans nouveau budget
    kind: algorithm
    note: La cartographie native reste inchangée. Classer selon la contribution à la valeur propre de Flow, avec
      motif explicite. Support peut être utilisé par le métier. Les rôles et couches ne déterminent pas le classement.
  - id: complete_product_proposal
    title: Chiffrage professionnel et reproduction des décisions adoptées
    expression: Conserver les unités inchangées. Remplacer une unité élargie par son nouveau calcul COCOMO. Agréger
      les tailles des compléments cohérents avant COCOMO. Déduire les réutilisations financées. Ventiler chaque
      rôle une fois. Contrôler les fonctions COSMIC remplacées et consommées. Tester une hypothèse à la fois.
    variables:
      measured_components: Instructions et déclarations des périmètres OSS révisés
      module_assumptions: Fractions de composants nouveaux proposées et sensibilités
      adopted_units: Décisions conservées et unité explicitement remplacée
      functional_forecast: Processus et mouvements prévisionnels, hors fonctions déjà comptées
    unit: JH projet, EUR HT, mois nominaux et écarts entre méthodes
    kind: algorithm
    note: Les règles arithmétiques COCOMO et COSMIC du métamodèle sont réutilisées. Une proposition ne modifie les
      décisions et simulations qu’après adoption explicite et rattachement aux contrats actifs. La couverture déclarée
      n’est ni une exhaustivité future prouvée ni une confiance statistique. La ventilation stratégique courante
      est appliquée séparément des catégories historiques de la preuve figée.
  - id: professional_component_preparation
    title: Adoption des lots professionnels depuis une base antérieure figée
    expression: Reconstituer les tailles COCOMO et les comptages COSMIC depuis les preuves. Adopter les nouveaux
      lots et leur répartition de rôles. Conserver les unités inchangées, puis ventiler chaque JH par finalité une
      seule fois.
    variables:
      proposal_inputs: Mesures et hypothèses de composants
      adoption_basis: Décisions antérieures et résultat de la proposition figés
      component_scope: Groupe professionnel et fonctions financées
    unit: JH projet, mois et rôles
    kind: algorithm
    note: Les distributions publiées d’activités sont conservées séparément des rôles adoptés. La reconstruction
      ne prend jamais les nouveaux lots comme base de leur propre complément.
  - id: budget_reserve_reconciliation
    title: Rapprocher tous les écarts sans inventer de supplément
    expression: Couvrir chaque écart identifié, chaque option économique et les trois phases. Référencer les mécanismes,
      contrats de calcul, activités et preuves existants. Une réserve a une identité unique par option, phase et
      travail résiduel. Le modèle courant conserve les compléments non dimensionnés à null, hors des décisions adoptées
      et des simulations. Aucun total complet ne peut être déduit de réserves inconnues.
    variables:
      reviews: Rapprochements documentaires des écarts déclarés
      reserves: Compléments potentiels et preuves nécessaires au chiffrage
      funding: Décisions et mécanismes existants
    unit: Réserves non dimensionnées, sans nouveau montant adopté
    kind: algorithm
    note: Une recette manquante ne crée pas automatiquement des travaux nouveaux. Une fonction chiffrée ne prouve
      pas la suffisance de sa charge. Tout chiffrage futur nécessite un contrat de calcul ou de devis net documenté
      avant extension de ce contrat.
  - id: oss_reference_revision
    title: Révision des analogues OSS
    expression: Rejouer les contrats antérieurs figés, remplacer les seuls analogues sélectionnés, puis recalculer
      les JH et les rôles. Conserver un propriétaire par financement.
    variables:
      basis: Contrats antérieurs figés
      selections: Méthodes mesurées et composants fournis retirés
    unit: JH projet
    kind: algorithm
    note: Les fonctions sectorielles non chiffrées restent identifiées séparément.
  - id: scenario_scope_adoption
    title: Adoption du périmètre détaillé par scénarios
    expression: Rejouer la comparaison OSS antérieure. Remplacer les anciens processus du lot par le comptage détaillé
      adopté, calculer COSMIC × ISBSG et répartir les rôles antérieurs. Conserver les mécanismes partagés et les
      six lots non révisés.
    variables:
      basis: Contrats et décisions antérieurs figés
      scope: Fonctions et mouvements adoptés
      decision: Validation utilisateur du total
    unit: JH projet
    kind: algorithm
    note: Les références OSS gardent leur périmètre historique. Le délai COCOMO projeté est indicatif et ne modifie
      pas le calendrier global.
  - id: work_package_adoption
    title: Adoption des charges détaillées par livrable
    expression: Rejouer les comparaisons antérieures. Valider les identifiants, cas et propriétaires de financement
      des livrables. Sommer leurs JH projet sans addition de l’ancien lot. Répartir les rôles et valoriser aux tarifs
      actifs. Conserver les références COCOMO et COSMIC comme comparaisons historiques.
    variables:
      basis: Contrats antérieurs figés
      work: Livrables et hypothèses de charge
      decision: Décision utilisateur
    unit: JH projet
    kind: algorithm
    note: Les JH sont des hypothèses d’ingénierie adoptées. Le délai local est indicatif. La somme ne constitue
      pas un nouveau calcul COCOMO ou COSMIC.
  - id: regional_role_price
    title: Tarif régional par rôle
    expression: arrondi_half_up(prix_Paris × rapport_régional / pas) × pas
    variables:
      prix_Paris: Tarif de cadrage retenu, ou référence financière existante.
      rapport_régional: Rapport de centres région / Paris du même profil. À défaut, médiane des rapports des pairs
        déclarés.
      pas: 25 EUR. Les transferts de rôle et les pairs sont explicites dans source/tarifs-projet.yaml.
    unit: EUR HT / JH
    kind: algorithm
    note: Les observations gardent leur population et leur fiscalité. Les prix transposés sont des hypothèses. Appliquer
      seulement aux charges adoptées et préserver forfaits, achats, JH et calendrier.
  - id: working_team_consolidation
    title: Consolider les versions par équipe sans double compte
    kind: algorithm
    expression: Sélectionner une version par travail. Exclure les enveloppes remplacées après confirmation de la
      couverture. Ventiler chaque rôle et chaque dépense une fois, puis agréger les contributions de la matrice
      et du détail.
    variables:
      versions: Référence ou proposition choisie par travail, version et période.
      coverage: Remplacement intégral confirmé et justifié dans une même phase. Les propositions en attente restent
        hors du total.
      valuation: JH bruts, JH valorisés et tarifs distincts des achats et frais. Une inclusion ne crée pas de second
        montant.
      completeness: Les motifs de complétude sont locaux à chaque contribution et à la mesure lue. Un achat sans
        JH est sans objet pour les charges. Les trous de périmètre et de ventilation restent visibles à la phase.
      projection: Valoriser une consommation mensuelle ou annuelle sur sa période, puis projeter une fois chaque
        mesure source ou composant. Ventiler le résultat par cumuls arrondis en conservant chaque centime.
    unit: JH, EUR HT, mois et base annuelle
    note: Les données manquantes restent null. Les lectures par travail, équipe, phase et abaque proviennent de
      la même sélection et des mêmes contributions. Les montants retenus et leurs simulations restent inchangés.
  - id: scope_revision_replacement
    title: Réévaluer un périmètre sans cumuler ancien et nouveau financement
    kind: algorithm
    expression: Proposition du Core System = référence du Core System − lot remplacé + somme des livrables cibles.
      Chaque livrable et chaque rôle sont valorisés une fois.
    variables:
      capture: Nouvelle hiérarchie native et empreinte vérifiée.
      packages: Livrables cibles, charges de travail estimées et capacités couvertes.
      baseline: Décision retenue à remplacer intégralement, conservée inchangée.
      roles: Proportions de rôles retenues transposées explicitement, aux tarifs sources actuels.
      unknowns: Intégration, exploitation et hypothèses de dimensionnement encore à renseigner.
    unit: JH et EUR HT
    note: Estimation d’ingénierie par livrable. Aucun nouveau comptage COSMIC ou mesure COCOMO n’est déclaré. La
      proposition ne modifie pas le journal de financement.
  - id: domain_cost_partition
    title: Conservation du budget par domaine métier
    expression: Total = montants affectés à Master Data + montants affectés à la {{notion.supply_chain_management}}
      + reste non ventilé.
    variables:
      units: Mesures retenues des unités de travail
      classification: Domaine natif ou classement fonctionnel documenté
    unit: JH et euros HT sur une même phase et récurrence
    kind: algorithm
    note: Les travaux communs sans clé restent à ventiler. Les coûts complets des deux domaines ne sont établis
      qu’après cette ventilation. Les contributions des équipes et Core Domain / Support constituent des axes indépendants.
  - id: mdm_oss_size_projection
    title: Projection COCOMO du domaine Master Data
    expression: Par référence, compter l’union des composants sélectionnés, pondérer le déclaratif, ajouter les
      compléments distincts et appliquer COCOMO II une fois sur cette taille équivalente.
    variables:
      measured: Code et déclarations des composants sélectionnés
      completions: Médiane des analogues mesurés, multipliée par le nombre de services ou adaptateurs supposé
      target: Capacités du domaine Master Data
    unit: Unités logiques équivalentes et JH projet conditionnels
    kind: algorithm
    note: Les prototypes ne sont pas imputés à la fois comme base mesurée et comme configuration projetée. Les fonctions
      ou services déjà financés ailleurs sont exclus. Aucune moyenne des résultats et aucune modification de la
      référence adoptée.
  - id: mdm_functional_count_projection
    title: Comptage COSMIC du périmètre MDM
    kind: algorithm
    expression: Compter les mouvements uniques E/R/W/X par processus, sommer leurs CFP puis appliquer cosmic_effort
      avec la convention de productivité référencée.
    variables:
      processes: Processus, utilisateurs fonctionnels, événements et groupes de données explicites
      scope: Capacités natives MDM couvertes sans référence étrangère
      benchmark: Convention de productivité existante et heures par jour
    unit: CFP et JH comparatifs
    note: Les groupes de données sont des hypothèses explicites. Le moteur commun est compté une fois. Les familles
      portent leurs groupes distincts, sans multiplication des services communs. Aucun complément ni remplacement
      de charge adoptée automatique.
  - id: initial_release_dependency_projection
    title: Projection des contraintes de première release
    kind: algorithm
    expression: Référencer les contributions de construction par équipe, valider les contraintes et rejeter les
      cycles de production exigeant la fin complète des releases.
    variables:
      organisation: Équipes et contributions de construction
      constraints: Releases, seuils et conditions documentées
    unit: graphe de contraintes
    note: Ne calcule ni date ni durée. Un cycle entre conditions de production à 100 % exige une livraison groupée
      ou une décomposition explicite.
  invariants:
  - Chaque unité de travail possède un contrat d’estimation versionné. La référence, le calcul détaillé proposé
    et son adoption sont distincts. Les données manquantes restent null. Les charges et coûts retenus sont conservés
    par phase et période.
  - Les capacités décrivent un périmètre sans poids budgétaire implicite. Chaque mesure appartient à une unité de
    travail unique. Les contributions multiples conservent les rôles, les tarifs, la gouvernance et le reliquat.
  - Les équipes durables de delivery conservent leur mission sur le cycle de vie. Chaque accompagnement Enabling
    reste temporaire. Les charges, coûts, capacités et calendriers restent distincts.
  - Une équipe Enabling peut contribuer aux travaux d’accompagnement sans posséder les composants logiciels. Les
    périodes financées restent dans une étape explicite et les attributions contradictoires sont refusées.
  - Les affectations par équipe conservent chaque source une fois. Gouvernance, moyens partagés et reliquats restent
    visibles sans nouveau financement.
  - Un essai technique réussi démontre seulement ses cas et conditions déclarés. Son temps de réalisation et son
    code ne calibrent pas automatiquement les JH. Les effets sur le chiffrage sont explicités séparément.
  - Le référentiel reçu conserve identifiants, libellés, définitions, périmètres, hiérarchie et relations. Aucun
    score de complexité ni hypothèse FLOW ne lui est ajouté.
  - Une comparaison déclare périmètre, activités, unités et conventions horaires. Si les activités ne sont pas alignées,
    l’écart est descriptif et cette limite est affichée.
  - Une référence nulle ou inconnue ne produit pas de pourcentage. Retourner null avec le motif, jamais zéro par
    défaut.
  - Les indicateurs utilisent les résultats non arrondis. Une dispersion n’est ni un intervalle probabiliste ni
    une mesure de confiance.
  - 'Les hypothèses partagées sont signalées : quatre références partageant les compléments ne constituent pas quatre
    validations indépendantes.'
  - Aucune classe ABCDE. L’incertitude reste inconnue tant que ses bornes et probabilités ne sont pas étayées.
  - Les répartitions d’activité publiées et les clés activité/rôle proposées sont conservées séparément.
  - Le délai d’une famille ne remplace pas le calendrier global. Le financement est compté une seule fois.
  - Une règle déclarée descriptive ne s’exécute pas automatiquement. Son implémentation et ses contrôles sont identifiés.
  - Les classes de couverture sont sans objet, en attente, partielle ou complète selon les capacités distinctes.
    Elles ne mesurent pas la confiance.
  - 'Les références natives comprennent encore des fonctions de création et édition directe non isolées : la comparaison
    avec le contrat FLOW est partielle.'
  - Le cumul des décisions adoptées ne vaut pas recalcul non linéaire de tout le Core System. Aucun délai local
    n’est agrégé.
  - Les ensembles fortement liés sont estimés une fois sur leur taille totale. Ne pas cumuler leur charge et celle
    de leurs composants ou mécanismes communs.
  - La complétude du produit inclut les fonctions professionnelles IT absentes de la cartographie métier. Aucune
    nouvelle capacité native n’est créée.
  - Les coûts métier, IT et non ventilés partitionnent les seuls travaux adoptés. Les compléments inconnus restent
    null. Ils ne sont ni inclus par défaut ni mis à zéro.
  - Une ventilation par finalité conserve les JH de chaque rôle et les tarifs de chaque unité. Les familles déjà
    adoptées ne sont pas estimées à nouveau par ce partage.
  - L’instruction de tous les écarts identifiés ne signifie pas que tous les ERP ou scénarios sont qualifiés. Les
    compléments potentiels restent distincts des budgets adoptés. Une réserve partagée est comptée une fois et un
    montant inconnu n’est jamais converti en zéro.
