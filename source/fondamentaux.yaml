    - unknowns
    - review
  - id: solution_comparison_context
    domain_ref: solutions
    label: Contexte de comparaison des solutions
    owner: source/comparaison-solutions.yaml
    attributes:
    - date
    - scope_ref
    - product_refs
    - architecture_status
    - historical_offers
  - id: business_area_assessment
    domain_ref: solutions
    label: Lecture comparative par Business Area
    owner: source/comparaison-solutions.yaml
    attributes:
    - business_area_ref
    - product_ref
    - component_composition
    - reading_status
    - commercial_status
    - evidence_refs
    - complete_ba_coverage
    - review
  - id: solution_gap
    domain_ref: solutions
    label: Écart ou qualification transverse
    owner: source/comparaison-solutions.yaml
    attributes:
    - business_area_refs
