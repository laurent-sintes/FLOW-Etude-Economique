  note: 'La cartographie organise le métier en domaines, puis en capacités métier : ce que l’entreprise doit savoir
    faire.'
  estimation: Les capacités retenues définissent le besoin commun. Elles structurent l’estimation Make et permettent
    de confronter les offres Buy aux fonctions attendues, avec leurs preuves et leurs limites.
  scope_summary: '**Le périmètre de la {{notion.flow_core_system}} réunit Master Data et {{notion.supply_chain_management}}.**
    La cartographie métier fournit les capacités communes à examiner dans les trois options.'
  scope: La {{notion.flow_core_system}} couvre Master Data et {{notion.supply_chain_management}}. Sourcing and Procurement
    et Commerce restent des domaines voisins. Les autres systèmes situent le contexte des échanges.
estimation:
  title: Lire les charges sur leur périmètre
  intro: Les efforts humains sont exprimés en JH. Leur valorisation en euros intervient séparément.
  stages:
  - id: gross
    notion: charge_brute
    producer: Effort avant les réductions explicites
    text: '**Charge après réutilisation, avant les gains applicables.** Les activités couvertes sont déclarées.
      Les JH de développement sont identifiés au sein d’un éventuel effort projet.'
  - id: net
    notion: charge_nette
    producer: Calculée par le moteur
    text: '**Effort sur les mêmes activités après les gains applicables.** Une activité sans réduction conserve
      sa charge. Les familles retenues ne reçoivent aucune remise IA globale.'
  - id: total_project
    notion: charge_totale_projet
    producer: À constituer sur tout le périmètre déclaré
    text: '**Ensemble des efforts humains retenus sur le périmètre annoncé.** Les activités déjà incluses dans une
      famille restent comptées une seule fois. Les efforts manquants sont signalés.'
  relations:
  - source_ref: gross
    target_ref: net
    operation: apply_productivity
    text: 'Brut → net : appliquer les gains explicites sur le même périmètre de travaux.'
  - source_ref: net
    target_ref: total_project
    operation: add_project_activities
    text: 'Net → total projet : ajouter les autres efforts retenus, sans compter un travail deux fois.'
  note: '**Le cumul porte sur les décisions adoptées après contrôle des financements partagés.** Il ne constitue
    pas une estimation COCOMO intégrée du Core System. Les délais locaux ne s’additionnent pas. Le calendrier global
    reste à instruire. La classification Core Domain / Support décrit la contribution à la valeur du produit Flow.
    Elle est indépendante des rôles et des couches techniques. Les parts sans attribution justifiée restent non
    ventilées.'
  links:
  - href: '#complexite'
    label: Comprendre le calcul et l’adoption des efforts projet
  - href: '#calcul-net'
    label: Consulter « {{vue.calcul_net}} »
  - href: '#evaluation-core'
    label: Consulter l’application et la provenance des évaluations
program_ref: programme_flow
estimation_model:
  version: 1
  title: Métamodèle de l’étude et de son estimation
  authority: source/fondamentaux.yaml
  purpose: Point unique de définition des objets métier, relations, règles de calcul et indicateurs. Les fichiers
    propriétaires contiennent les instances. Les schémas et le moteur contrôlent leur conformité. Les attributs
    sont des concepts métier. Les schémas précisent leur représentation physique chez les propriétaires.
  domains:
  - id: scope
    label: Périmètre métier et produit
    definition: Capacités natives, fonctions du produit et frontières retenues.
  - id: solutions
    label: Solutions et réutilisation
    definition: Qualifications des solutions, écarts et patrimoine réutilisable.
  - id: evidence
    label: Preuves et publication
    definition: Pièces, essais, traçabilité et diffusion du modèle.
  - id: work
    label: Travaux et delivery
    definition: Unités génériques, mesures et spécialisations par activité ou cycle de vie.
  - id: estimation
    label: Estimation et décisions
    definition: Méthodes, mesures de taille, comparaisons, efforts et décisions d’adoption.
  - id: organisation
    label: Équipes et contributions
    definition: Périmètres durables, contributions, interactions et clés de ventilation.
  - id: economics
    label: Coûts et trajectoire
    definition: Tarifs, financements, offres, calendriers et scénarios économiques.
  objects:
  - id: work_estimate
    domain_ref: estimation
    label: Contrat d’estimation d’un travail
    owner: source/unites-travail.yaml
    attributes:
    - id
    - version
    - work_unit_ref
    - option_ref
    - phase_ref
    - method
    - scope
    - period
    - terms
    - reference
    - proposal
    - missing
    - source_refs
    - decision_status
    - cost_mode
    - billing_period
    - included_in_ref
    description: Contrat commun aux trois phases. Il distingue les mesures retenues, les entrées du détail et la
      proposition. Le livrable est un résultat explicite à réceptionner, distinct des activités et commentaires
      de chiffrage. Les inconnus restent null et une proposition ne modifie jamais le budget retenu.
  - id: work_cost_bridge
    domain_ref: economics
    label: Passage des JH aux coûts
    owner: tools/work_estimation.py
    attributes:
    - record_ref
    - roles
    - gross_jh
    - gain_pct
    - net_jh
    - rate_eur_jh
    - labour_eur_ht
    - non_labour_eur_ht
    - rounding_eur_ht
    - calculated_eur_ht
    - retained_eur_ht
    - status
    description: Relie les charges valorisées aux tarifs, frais et montants retenus. Les montants sans assiette
      de JH restent identifiés comme tels. Un total connu ne rend pas ses composantes inconnues sans objet. Les
      écarts d’arrondi sont visibles et les enveloppes ne sont pas recalibrées.
  - id: work_unit
    domain_ref: work
    label: Unité de travail
    owner: source/unites-travail.yaml
    attributes:
    - id
    - nature
    - phase_ref
    - object
    - recurrence
    - record_refs
    - core_scope_refs
    - integration_unit_ref
    - estimation_contract
    - included_activities
    - parent_ref
    - basis
    description: Travail cohérent à réaliser pour le projet, ponctuel ou récurrent. Les mesures restent référencées
      chez leur propriétaire. Les activités et justifications incluses ne définissent pas le livrable attendu. Celui-ci
      et ses critères de réception restent à renseigner sans modifier les mesures retenues.
  - id: work_capability_link
    domain_ref: work
    label: Périmètre métier du travail
    owner: tools/work_units.py
    attributes:
    - work_unit_ref
    - capability_ref
    - status
    - share_pct
    description: Association de périmètre entre un travail et des capacités natives. Plusieurs capacités ne multiplient
      ni ne ventilent ses JH et ses coûts. La part de couverture vaut 100 % pour un rattachement unique. Pour une
      capacité partagée entre fonctions, la part reste inconnue tant que sa répartition n’est pas définie.
  - id: team_capability_scope
    domain_ref: organisation
    label: Périmètre durable de l’équipe
    owner: source/unites-travail.yaml
    attributes:
    - team_ref
    - scope_kind
    - status
    - core_scope_refs
    - basis
    description: Capacités gérées ou desservies durablement par une équipe. Le lien direct ou indirect reste distinct
      de ses contributions à un travail.
  - id: team_contribution
    domain_ref: organisation
    label: Contribution d’une équipe
    owner: tools/work_units.py
    attributes:
    - work_unit_ref
    - record_ref
    - team_ref
    - phase
    - roles
    - jh
    - cost_eur_ht
    - rule_refs
    - contribution_kinds
    - estimate_source
    - estimate_version
    - source_jh
    - gross_jh
    - net_jh
    - period
    - component_kind
    - component_applicability
    - projected_cost_eur_ht
    - missing
    - human_applicable
    - cost_applicable
    - share_pct
    - billing_period
    description: Part documentée d’une mesure de travail attribuée à une équipe. Plusieurs équipes peuvent contribuer.
      Les rôles conservent leurs tarifs et les parts restantes demeurent non ventilées. L’applicabilité des composants
      distingue les dépenses non ventilées des composants sans objet explicitement établis.
  - id: allocation_abaque
    domain_ref: organisation
    label: Abaque générale de ventilation
    owner: source/abaque-ventilation.yaml
    attributes:
    - rules
    - overrides
    - work_unit_ref
    - phase_ref
    - measure
    - component_ref
    - shares
    - basis
    description: Clés de ventilation par unité, période et rôle. Une clé spécifique prime sur la clé générale. Les
      frais ont une clé distincte et une candidature ne déclenche aucune affectation.
  - id: work_measurement
    domain_ref: work
    label: Mesure retenue du travail
    owner: tools/delivery_organisation.py
    attributes:
    - id
    - phase
    - jh
    - cost_eur_ht
    - roles
    - source_ref
    - start_month
    - end_month
    description: JH connus, coûts valorisés, rôles et périodes issus des décisions et financements existants. Une
      mesure source est consommée une seule fois par le catalogue.
  - id: delivery_team_type
    domain_ref: organisation
    label: Type Team Topologies d’une équipe
    owner: source/organisation-delivery.yaml
    attributes:
    - id
    - label
    - definition
  - id: delivery_interaction_mode
    domain_ref: organisation
    label: Mode d’interaction entre équipes
    owner: source/organisation-delivery.yaml
    attributes:
    - id
    - label
    - definition
  - id: delivery_principle
    domain_ref: organisation
    label: Principe des équipes durables de delivery
    owner: source/organisation-delivery.yaml
    attributes:
    - id
    - title
    - text
  - id: delivery_team
    domain_ref: organisation
    label: Équipe durable de delivery
    owner: source/organisation-delivery.yaml
    attributes:
    - id
    - type
    - mission
    - boundary
    - responsibilities
    - capacity
  - id: delivery_target_topology
    domain_ref: organisation
    label: Disposition des équipes selon l’architecture
    owner: source/organisation-delivery.yaml
    attributes:
    - layers
    - transverse
    description: Chaque couche peut ordonner ses équipes en rangées, sans dupliquer leurs placements. Couches du
      produit ordonnées du parcours métier au socle technique, avec l’accompagnement transverse à part.
  - id: delivery_governance
    domain_ref: organisation
    label: Gouvernance transverse au build et à l’intégration, hors typologie
    owner: source/organisation-delivery.yaml
    attributes:
    - id
    - mission
    - roles_ref
  - id: team_interaction
    domain_ref: organisation
    label: Interaction entre équipes
    owner: source/organisation-delivery.yaml
    attributes:
    - source
    - target
    - mode
    - object
    - phases
    - exit_criterion
  - id: team_work_assignment
    domain_ref: organisation
    description: Responsabilité source initiale. Cette liaison alimente l’abaque. Les contributions effectives,
      éventuellement partagées, sont portées par team_contribution.
    label: Affectation des travaux et financements aux équipes
    owner: source/organisation-delivery.yaml
    attributes:
    - kind
    - ref
    - team_ref
    - candidate_refs
    - basis
  - id: team_phase_allocation
    domain_ref: organisation
    label: Table de ventilation par équipe et par phase
    owner: tools/delivery_organisation.py
    attributes:
    - id
    - option
    - zone
    - phase_ref
    - owner_kind
    - team_ref
    - governance_ref
    - jh
    - cost_eur_ht
    - period_basis
    - record_ids
  - id: native_business_area
