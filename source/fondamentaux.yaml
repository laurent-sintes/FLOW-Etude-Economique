  relations:
  - id: work_estimate_contract
    label: Possède un contrat
    source: work_unit
    target: work_estimate
    cardinality: one-to-many
    meaning: Décrit la même estimation pour chaque phase, option et version sans changer la référence retenue.
  - id: estimate_cost_bridge
    label: Explique sa valorisation
    source: work_estimate
    target: work_cost_bridge
    cardinality: one-to-many
    meaning: Distingue charge brute, gain, charge valorisée, tarif, frais et arrondi. Le montant retenu reste chez
      son propriétaire.
  - id: bridge_measure_source
    label: Rapproche une mesure
    source: work_cost_bridge
    target: work_measurement
    cardinality: many-to-one
    meaning: Référence chaque mesure monétaire une fois et explicite la charge valorisée lorsqu’elle est documentée.
  - id: estimate_core_calculation
    label: Réutilise un calcul
    source: work_estimate
    target: calculation
    cardinality: many-to-one
    meaning: Référence les calculs existants du Core System et leur périmètre, sans nouvelle calibration.
  - id: estimate_roles
    label: Décrit les rôles
    source: work_estimate
    target: role_allocation
    cardinality: one-to-many
    meaning: Conserve les rôles et les deux assiettes de charge, brute et valorisée, avec leurs preuves.
  - id: bridge_rate
    label: Applique un tarif
    source: work_cost_bridge
    target: rate
    cardinality: many-to-many
    meaning: Valorise chaque rôle au tarif source. Un tarif inconnu conserve un coût calculé inconnu.
  - id: estimate_option
    label: S’inscrit dans une option
    source: work_estimate
    target: economic_option
    cardinality: many-to-one
    meaning: Identifie l’option de référence de l’estimation. Une inclusion commerciale conserve son forfait non
      ventilable.
  - id: estimate_period
    label: Décrit sa période
    source: work_estimate
    target: schedule
    cardinality: many-to-one
    meaning: Sépare la période initiale, la base annuelle et les dates restant à établir.
  - id: bridge_contribution
    label: Valorise les contributions
    source: work_cost_bridge
    target: team_contribution
    cardinality: one-to-many
    meaning: Les clés par rôle ventilent les JH sources et leur coût valorisé. Les frais gardent une clé distincte.
  - id: work_has_scope
    label: Déclare le périmètre
    source: work_unit
    target: work_capability_link
    cardinality: one-to-many
    meaning: Déclare son périmètre métier, sans clé de répartition budgétaire.
  - id: scope_targets_capability
    label: Cible une capacité
    source: work_capability_link
    target: native_capability
    cardinality: many-to-one
    meaning: Référence une capacité métier native, sans modifier son identité ni sa définition.
  - id: team_has_scope
    label: Porte un périmètre
    source: delivery_team
    target: team_capability_scope
    cardinality: one-to-many
    meaning: Porte un périmètre durable direct ou indirect, distinct des affectations de charges.
  - id: team_scope_capability
    label: Gère ou dessert
    source: team_capability_scope
    target: native_capability
    cardinality: many-to-many
    meaning: Gère ou dessert une capacité. Plusieurs équipes peuvent contribuer à la même capacité.
  - id: work_has_contribution
    label: Reçoit une contribution
    source: work_unit
    target: team_contribution
    cardinality: one-to-many
    meaning: Reçoit les contributions de plusieurs équipes, pour une phase et une mesure identifiées.
  - id: contribution_to_team
    label: Attribue à une équipe
    source: team_contribution
    target: delivery_team
    cardinality: many-to-one
    meaning: Attribue une part documentée à une équipe. Les candidats restent séparés.
  - id: contribution_rule
    label: Applique une clé
    source: team_contribution
    target: allocation_abaque
    cardinality: many-to-one
    meaning: Applique les clés documentées et conserve le reliquat non ventilé.
  - id: work_measurement_source
    label: Référence une mesure
    source: work_unit
    target: work_measurement
    cardinality: one-to-many
    meaning: Référence chaque mesure source une fois. Les JH et coûts peuvent être complémentaires.
  - id: contribution_measure
    label: Ventile une mesure
    source: team_contribution
    target: work_measurement
    cardinality: many-to-one
    meaning: Ventile une mesure retenue sans modifier son total ni les tarifs de ses rôles.
  - id: work_core_specialisation
    label: Spécialise un travail
    source: evaluation_unit
    target: work_unit
    cardinality: one-to-one
    meaning: Spécialise une unité de travail pour l’évaluation du Build du Core System.
  - id: work_integration_specialisation
    label: Décrit un livrable
    source: integration_work_unit
    target: work_unit
    cardinality: one-to-one
    meaning: Spécialise une unité de travail par livrable, quantité et critères de recette d’intégration.
  - id: work_annual_specialisation
    label: Décrit un travail récurrent
    source: annual_work
    target: work_unit
    cardinality: one-to-many
    meaning: Alimente les unités récurrentes de MCO, de Run et de service, sans créer de nouvelles annuités.
  - id: work_decomposition
    label: Décompose
    source: work_unit
    target: work_unit
