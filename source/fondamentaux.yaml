version: 1
id: flow-fundamentals
architecture_ref: source/architecture.yaml
reading:
  intro: Situer la première étape de la {{notion.plateforme_marques.court}}, comprendre les voies de réalisation
    et lire les charges, les coûts et le calendrier.
  toc_label: Les six repères du modèle
  chapters:
  - id: scope
    title: Ce que nous évaluons
    lead: '**La {{notion.core_system}} constitue la première étape de l’ambition de {{notion.plateforme_marques.court}}.**
      Le modèle compare cinq options pour obtenir ce produit, l’intégrer au Groupe et le faire fonctionner. Le périmètre
      évalué reste celui des capacités retenues ; les étapes ultérieures de l’ambition ne sont pas financées implicitement.'
  - id: strategies
    title: Sur quoi reposent les évaluations Make et Buy
    lead: '**Deux points de départ, un même besoin à examiner.** La cartographie métier structure les travaux Make
      et sert à challenger les propositions Buy.'
  - id: activities
    title: Quelles activités relèvent du Build et du Run
    lead: '**Build et Run décrivent la nature des activités, pas leur période.** Cette convention distingue la réalisation
      du service courant, indépendamment du choix Make ou Buy.'
  - id: workload
    title: Que mesurent le brut, le net et le total projet
    lead: '**Le brut et le net couvrent les mêmes travaux. Le total projet élargit le périmètre humain.** Ces distinctions
      évitent de confondre développement, effort complet et budget en euros.'
  - id: costs
    title: Quels postes sont financés
    lead: '**Chaque dépense est financée une seule fois.** Les structures de coût indiquent l’objet financé ; elles
      permettent de rapprocher les options sans additionner des prestations déjà incluses.'
  - id: calendar
    title: Quand les dépenses interviennent
    lead: '**Les dépenses suivent la consommation et les réceptions.** Les trois phases donnent des repères chronologiques
      ; une même nature de coût peut traverser plusieurs phases.'
  composition: '**{{notion.plateforme_beaumanoir}} = {{notion.core_system}} retenue + spécificités du Groupe.**
    Cette composition décrit la cible métier, pas une formule de coût.'
  strategy_note: '**Comparer exige d’expliciter les écarts de périmètre entre les offres et le besoin.** Une couverture
    déclarée ne prouve pas son inclusion dans le prix ; un point à qualifier ne crée aucun supplément automatique.'
  strategy_links:
  - href: source/offres-synvance.md
    label: Comprendre les offres issues de Synvance
  - href: '#etude-marche'
    label: Voir l’analyse des écarts dans le dossier économique — chapitre « Offres reçues »
  costs_intro: Les sept postes ci-dessous décrivent ce qui est acheté ou réalisé. Leurs tags indiquent la nature
    Build ou Run des activités.
  costs_note: '**Le poste « {{notion.grouped_buy}} » conserve les prix groupés et leurs inclusions.** Une part non
    documentée reste inconnue. Les tags ne créent aucun budget ; un total Build / Run exige une ventilation monétaire
    justifiée.'
  coverage_label: Couches concernées
  next_href: '#conditions-realisation'
  next_label: Examiner les conditions de réalisation et les jalons de décision
activity_reading:
  title: '{{notion.build}} et {{notion.run_activities}}, deux angles de lecture des activités'
  intro: Un budget annuel peut financer du Build. Du Run peut être consommé pendant la réalisation.
  type_refs:
  - build
  - run
  summaries:
  - type_ref: build
    text: Construire, adapter ou faire évoluer le système, y compris les travaux importants conduits en mode projet.
  - type_ref: run
    text: Maintenir le service courant, exploiter les moyens techniques et assister les utilisateurs, y compris
      pendant la réalisation.
  note: '**Le MCO de la {{notion.core_system}} est classé en Build.** Le MCO des adaptations et interfaces Beaumanoir
    est Run, sauf interventions importantes en mode projet : leur structure de coût porte une répartition paramétrable.
    Un financement annuel ne détermine donc pas son classement.'
entities:
- id: programme_flow
  notion: programme_flow
  kind: program
  text: Porter la première étape SI de l’ambition de {{notion.plateforme_marques.court}}, choisir sa voie de réalisation
    et organiser son intégration et son déploiement dans le Groupe.
- id: core_system
  notion: core_system
  kind: platform
  text: Le produit générique, construit ou acheté, avant les adaptations propres à Beaumanoir.
  layer_refs:
  - core_system
- id: plateforme_beaumanoir
  notion: plateforme_beaumanoir
  kind: platform
  text: La cible SI réunissant le produit retenu et les spécificités du Groupe pour unifier les SI des marques historiques
    et de Boardriders. Elle contribue à l’ambition de {{notion.plateforme_marques.court}}.
- id: flow_core_system
  notion: flow_core_system
  kind: platform
- id: adaptations_beaumanoir
  label: Spécificités Beaumanoir
  definition: Processus, configurations, extensions, interfaces et données propres au Groupe.
  layer_refs:
  - applications
  - business_process
  - integration
  kind: adaptations
- id: si_historique
  label: SI des marques historiques
  definition: Système d’information des marques historiques du Groupe.
  kind: information_system
- id: si_boardriders
  label: SI de Boardriders
  definition: Système d’information de Boardriders.
  kind: information_system
relations:
- id: flow_implements_core
  type: implements
  source: flow_core_system
  target: core_system
- id: beaumanoir_contains_core
  type: composed_of
  source: plateforme_beaumanoir
  target: core_system
- id: beaumanoir_contains_specifics
  type: composed_of
  source: plateforme_beaumanoir
  target: adaptations_beaumanoir
- id: program_targets_platform
  type: targets
  source: programme_flow
  target: plateforme_beaumanoir
- id: platform_unifies_historical
  type: unifies
  source: plateforme_beaumanoir
  target: si_historique
- id: platform_unifies_boardriders
  type: unifies
  source: plateforme_beaumanoir
  target: si_boardriders
strategies:
- id: make
  notion: make
  mode: Make
  target_ref: core_system
  option_refs:
  - java-spring
  - dotnet
  - rust
  open_selection: false
  tags:
  - Construire
  - '{{notion.core_system}} générique'
  text: '**Construire la {{notion.flow_core_system}}, version Make de la {{notion.core_system}}, sous maîtrise du
    Groupe.** La réalisation peut associer équipes internes et partenaire ; Make ne suppose pas une équipe interne
    déjà opérationnelle. Responsabilité produit, participation métier, compétences, transfert et continuité sont
    à organiser. Les capacités métier orientent les travaux après réutilisation. Trois options techniques sont comparées
    : Java / Spring, .NET et Rust.'
  implementation_ref: flow_core_system
- id: buy
  notion: buy
  mode: Buy
  target_ref: core_system
  option_refs:
  - microsoft
  - sap
  open_selection: true
  tags:
  - Microsoft, SAP ou autre
  - '{{notion.core_system}} existante'
  text: '**Partir de l’étude Synvance.** Les offres Avanade / Microsoft et Delaware / SAP, les questionnaires et
    la projection COPIL documentent les prestations, prix et trajectoires. L’étude FLOW les confronte au besoin
    et explicite les compléments retenus. Le choix fournisseur reste ouvert.'
phases:
- id: obtain_core
  notion: obtenir_core_system
  bullets:
  - '**Make :** construire le produit et financer ses moyens de fabrication.'
  - '**Buy :** réutiliser le dossier Synvance pour sélectionner et contractualiser. Les dates de consommation suivent
    les engagements de l’offre retenue.'
  costs:
  - obtention
  - run_cloud
  target_ref: core_system
- id: integrate_deploy
  notion: integrer_deployer
  text: Adapter le produit, migrer les données et raccorder les SI, puis déployer progressivement. La stabilisation
    précède la réception locale ; le {{notion.mco_client}} commence après cette réception.
  costs:
  - integration
  - core_care
  - client_care
  - run_cloud
  - operations_support
  - grouped_buy
  target_ref: plateforme_beaumanoir
- id: operate_evolve
  notion: exploiter_evoluer
  text: Les services annuels complets prennent le relais des financements transitoires, sans chevauchement. Les
    moyens consommés pendant la réalisation sont déjà financés à leur période d’usage.
  costs:
  - core_care
  - client_care
  - run_cloud
  - operations_support
  - grouped_buy
  target_ref: plateforme_beaumanoir
phase_reading: '**Un départ commun permet de comparer les dépenses sans imposer les mêmes dates de service.** Construire
  le calendrier Make à partir de ses travaux et déploiements. Pour Buy, instruire les trajectoires reçues de Synvance
  et du COPIL, puis la sélection-contractualisation ; ces données ne déterminent pas le calendrier Make.'
limitations: '**Chaque évaluation doit déclarer ses inclusions et exclusions.** Examiner notamment le temps interne,
  la transformation organisationnelle, les systèmes maintenus pendant la transition, le décommissionnement et la
  sélection fournisseur. Les capacités d’organisation et de réalisation doivent être établies même lorsqu’elles
  sortent du périmètre chiffré. Un poste exclu ne vaut pas zéro ; un travail déjà financé n’est pas ajouté une seconde
  fois.'
business_map:
  source: sources/client/cartographie-2026-10-17.1.yaml
  systems:
  - node_ref: system-design-development
    domain_relation_refs:
    - REL-U975-domain-product-portfolio-collection
    - REL-U975-domain-product-development
    - REL-U975-domain-product-definition-lifecycle
  - node_ref: system-business-operations
    domain_relation_refs:
    - REL-U780-OPERATIONS-domain-sourcing-procurement
    - REL-U780-OPERATIONS-domain-sales
    - REL-U780-OPERATIONS-supply-chain-orchestration
  - node_ref: system-enterprise-management-control
    domain_relation_refs:
    - REL-U826-domain-finance
    - REL-U975-domain-enterprise-planning-performance
    - REL-U975-domain-governance-risk-compliance
  - node_ref: domain-logistics-execution
    domain_relation_refs:
    - REL-U975-domain-warehousing
    - REL-U975-domain-transportation
    - REL-U1027-PARENT-domain-customs-management
  program_scope:
    entity_ref: programme_flow
    system_ref: system-business-operations
  outside_scope:
  - system-design-development
  - system-enterprise-management-control
  positioning:
    entity_ref: flow_core_system
    domain_ref: supply-chain-orchestration
    status: indicative
  note: 'La cartographie organise le métier en domaines, puis en capacités métier : ce que l’entreprise doit savoir
    faire.'
  estimation: Les capacités retenues définissent le besoin commun. Elles structurent l’estimation Make et permettent
    de confronter les offres Buy aux fonctions attendues, avec leurs preuves et leurs limites.
  scope_summary: '**La cartographie reçue situe le programme dans Business Operations. Les capacités retenues de
    la chaîne logistique forment le périmètre d’entrée de l’évaluation.** Ce référentiel sert aussi à examiner les
    offres Buy ; le schéma situe la cible dans un ensemble plus large.'
  scope: 'Design & Development et Enterprise Management & Control restent hors du périmètre du programme présenté.
    Le positionnement de la {{notion.flow_core_system}} est indicatif : cette vue de contexte ne remplace pas la
    sélection des capacités chiffrées et n’étend pas le budget de construction aux autres domaines.'
estimation:
  title: Les trois niveaux de charge
  intro: Les efforts humains sont exprimés en JH ; leur valorisation en euros intervient séparément.
  stages:
  - id: gross
    notion: charge_brute
    producer: Part développement à identifier dans les calculs de référence
    text: '**Les JH développeur restant à réaliser après réutilisation**, tests développeur inclus et QA indépendante
      exclue. Ce sous-ensemble doit être identifié dans les calculs COCOMO et COSMIC × ISBSG : leur total peut couvrir
      aussi analyse, conception et QA. Il ne peut donc pas être repris intégralement comme du développement brut.'
  - id: net
    notion: charge_nette
    producer: Calculée par le moteur
    text: '**Les mêmes travaux après application des gains de productivité documentés.** Le moteur les applique
      aux activités éligibles, sans seconde remise pour la réutilisation déjà comptée dans le brut.'
  - id: total_project
    notion: charge_totale_projet
    producer: À constituer sur tout le périmètre déclaré
    text: '**Le développement net et les autres efforts humains retenus** : qualification indépendante, architecture,
      pilotage, intégration, déploiement et conduite du changement, selon le périmètre déclaré et sans double compte.'
  relations:
  - source_ref: gross
    target_ref: net
    operation: apply_productivity
    text: 'Brut → net : appliquer les gains explicites sur le même périmètre de travaux.'
  - source_ref: net
    target_ref: total_project
    operation: add_project_activities
    text: 'Net → total projet : ajouter les autres efforts retenus, sans compter un travail deux fois.'
  note: Les familles retenues financent leurs activités déclarées sans remise IA ni provision de pilotage supplémentaire.
    Le résultat calculé, la décision arrondie et la ventilation par rôle restent distincts. Les capacités non couvertes
    restent à réestimer. Une provision en euros ne dimensionne pas un effort humain.
  links:
  - href: '#complexite'
    label: Comprendre l’estimation du brut par le skill
  - href: '#calcul-net'
    label: Consulter « {{vue.calcul_net}} »
  - href: '#evaluation-core'
    label: Consulter l’application et la provenance des évaluations
program_ref: programme_flow
estimation_model:
  version: 1
  title: Métamodèle de l’étude et de son estimation
  authority: source/fondamentaux.yaml
  purpose: Point unique de définition des objets métier, relations, règles de calcul et indicateurs. Les fichiers
    propriétaires contiennent les instances ; les schémas et le moteur contrôlent leur conformité. Les attributs
    sont des concepts métier ; les schémas précisent leur représentation physique chez les propriétaires.
  objects:
  - id: native_capability
    label: Capacité métier reçue
    owner: source/referentiel-capacites.yaml
    attributes:
    - id
    - name
    - definition
    - scope
    - hierarchy
    - source_refs
  - id: scope_analysis
    label: Analyse du périmètre
    owner: source/analyse-perimetre-core.yaml
    attributes:
    - capability_ref
    - proposed_functions
    - boundary
    - assumptions
  - id: evaluation_unit
    label: Unité évaluée
    owner: source/estimations-core-retenues.yaml
    attributes:
    - id
    - stack
    - capabilities
    - includes
    - excludes
  - id: market_reference
    label: Référence produit et framework
    owner: source/references-couts-integration.yaml
    attributes:
    - id
    - version
    - revision
    - source_paths
    - evidence
  - id: mechanism
    label: Mécanisme réutilisable
    owner: source/calculs-estimation-core.yaml
    attributes:
    - id
    - coverage
    - reuse_mode
    - funding_owner
    - adaptation_work
  - id: flow_complement
    label: Complément requis par FLOW
    owner: source/calculs-estimation-core.yaml
    attributes:
    - requirement
    - analogy
    - proposed_volume
    - evidence
    - funding_owner
  - id: calculation
    label: Calcul reproductible
    owner: source/calculs-estimation-core.yaml
    attributes:
    - id
    - method
    - scope
    - activities
    - input_refs
    - rules
    - unrounded_result
    - units
  - id: cocomo_input
    label: Entrées COCOMO II
    owner: source/calculs-estimation-core.yaml
    attributes:
    - equivalent_KSLOC
    - A
    - B
    - SF_sum
    - effort_multipliers
    - reuse_assumptions
    - phase_factors
    - hours
  - id: cosmic_measure
    label: Taille fonctionnelle COSMIC
    owner: source/calculs-estimation-core.yaml
    attributes:
    - CFP
    - entries
    - exits
    - reads
    - writes
    - boundary
    - count_status
  - id: isbsg_reference
    label: Productivité issue des références ISBSG
    owner: source/calculs-estimation-core.yaml
    attributes:
    - hours_per_CFP
    - sample
    - activities
    - adjustments
    - evidence
    - limitations
  - id: comparison
    label: Comparaison des calculs
    owner: tools/estimation_calculation.py
    attributes:
    - reference_id
    - candidate_id
    - scope_match
    - activity_match
    - unit_match
    - assumptions
    - comparability_status
  - id: alignment
    label: Indicateur d’alignement
    owner: tools/estimation_calculation.py
    attributes:
    - signed_gap_jh
    - signed_gap_pct
    - reference_jh
    - spread_jh
    - spread_pct
    - shared_assumptions
  - id: uncertainty
    label: Incertitude étayée
    owner: source/estimations-core-retenues.yaml
    attributes:
    - status
    - bounds
    - probability
    - method
    - evidence
    - limitations
  - id: decision
    label: Estimation retenue
    owner: source/estimations-core-retenues.yaml
    attributes:
    - decision_date
    - method
    - reference_id
    - total_jh
    - months
    - rounding
    - rationale
  - id: activity
    label: Activité du projet logiciel
    owner: source/calculs-estimation-core.yaml
    attributes:
    - id
    - phase_weights
    - published_distribution
    - source_page
    - inclusions
  - id: role_allocation
    label: Ventilation par rôle
    owner: source/estimations-core-retenues.yaml
    attributes:
    - role
    - activity_weights
    - jh
    - rounding
    - assumption
  - id: rate
    label: Tarif de prestation
    owner: source/stacks/java-spring.yaml
    attributes:
    - role
    - eur_ht_per_jh
    - date
    - source
    - assumption
  - id: funding
    label: Financement unique
    owner: source/modele-composable.yaml
    attributes:
    - owner
    - amount_eur_ht
    - nature
    - responsibility
    - period
  - id: schedule
    label: Délai et calendrier
    owner: source/deploiement-groupe.yaml
    attributes:
    - model_months
    - retained_months
    - availability
    - dependencies
    - global_calendar
    - capacity
  - id: economic_option
    label: Option Make ou Buy
    owner: source/stacks/java-spring.yaml
    attributes:
    - id
    - mode
    - stack
    - pricing
    - inclusions
  - id: cost_structure
    label: Structure de coût
    owner: source/architecture.yaml
    attributes:
    - id
    - nature
    - activity_type
    - layer
    - responsibility
  - id: annual_work
    label: Travaux annuels
    owner: source/unites-maintenance.yaml
    attributes:
    - activity
    - volume
    - unit_effort
    - roles
    - gains
    - rates
  - id: buy_contract
    label: Offre et séquence commerciale Buy
    owner: source/selection-buy.yaml
    attributes:
    - provider
    - source
    - dates
    - services
    - initial_price
    - recurring_price
    - inclusions
  - id: deployment
    label: Déploiement et intégration Groupe
    owner: source/deploiement-groupe.yaml
    attributes:
    - unit
    - activity
    - roles
    - start
    - end
    - stabilization
  - id: economic_scenario
    label: Scénario économique
    owner: source/deploiement-groupe.yaml
    attributes:
    - options
    - inflation
    - sensitivity
    - calendar
    - horizons
  - id: ledger
    label: Journal de financement
    owner: tools/composable_costs.py
    attributes:
    - funding_owner
    - source
    - amount
    - nature
    - responsibility
    - start
    - end
  - id: calculation_evidence
    label: Preuve de calcul versionnée
    owner: source/calculs-estimation-core.yaml
    attributes:
    - chemin
    - empreinte SHA-256
    - dépendances vérifiées
    - mesures enregistrées distinctes des décisions adoptées
  relations:
  - id: analyzes
    source: scope_analysis
    target: native_capability
    cardinality: many-to-one
    meaning: Référence la capacité sans modifier son contenu reçu.
  - id: covers
    source: evaluation_unit
    target: native_capability
    cardinality: many-to-many
    meaning: Périmètre déclaré ; aucune ventilation artificielle de JH par capacité.
  - id: inspects
    source: scope_analysis
    target: market_reference
    cardinality: many-to-many
    meaning: Compare des fonctions observées à partir du code et de preuves.
  - id: reuses
    source: evaluation_unit
    target: mechanism
    cardinality: many-to-many
    meaning: La réutilisation laisse visibles adaptation et intégration technique.
  - id: requires
    source: evaluation_unit
    target: flow_complement
    cardinality: one-to-many
    meaning: Exigences additionnelles étayées ou hypothèses identifiées.
  - id: analogous
    source: flow_complement
    target: market_reference
    cardinality: many-to-many
    meaning: Une analogie est distincte d’une mesure.
  - id: sizes
    source: calculation
    target: cocomo_input
    cardinality: one-to-zero-or-one
    meaning: 'Voie COCOMO : taille équivalente et facteurs explicités.'
  - id: counts
    source: calculation
    target: cosmic_measure
    cardinality: one-to-zero-or-one
    meaning: 'Voie fonctionnelle : mouvements de données.'
  - id: values_cfp
    source: calculation
    target: isbsg_reference
    cardinality: one-to-zero-or-one
    meaning: COSMIC mesure la taille ; ISBSG apporte une référence de productivité, pas une troisième estimation
      indépendante.
  - id: estimates
    source: calculation
    target: evaluation_unit
    cardinality: many-to-one
    meaning: Les calculs comparent la même unité et les mêmes activités.
  - id: compares
    source: comparison
    target: calculation
    cardinality: many-to-many
    meaning: Au moins deux résultats identifiés, avec une référence explicite.
  - id: describes_gap
    source: alignment
    target: comparison
    cardinality: many-to-one
    meaning: Décrit un écart arithmétique, sans interprétation en confiance.
  - id: qualifies
    source: uncertainty
    target: calculation
    cardinality: many-to-one
    meaning: Bornes et probabilités seulement si une méthode et des preuves le permettent.
  - id: adopts
    source: decision
    target: calculation
    cardinality: many-to-one
    meaning: Décision distincte du résultat non arrondi ; aucune moyenne automatique.
  - id: allocates
    source: role_allocation
    target: decision
    cardinality: many-to-one
    meaning: La somme des rôles conserve le total adopté.
  - id: maps_activities
    source: role_allocation
    target: activity
    cardinality: many-to-many
    meaning: Clés d’organisation hypothétiques distinctes des répartitions publiées.
  - id: prices
    source: role_allocation
    target: rate
    cardinality: many-to-one
    meaning: Tarif sourcé ou hypothèse explicite.
  - id: funds
    source: funding
    target: decision
    cardinality: many-to-one
    meaning: Un seul financement par décision.
  - id: owns_mechanism
    source: mechanism
    target: funding
    cardinality: many-to-one
    meaning: Un propriétaire ; les consommateurs ne recomptent pas sa construction.
  - id: owns_complement
    source: flow_complement
    target: funding
    cardinality: many-to-one
    meaning: Complément financé une seule fois.
  - id: plans
    source: schedule
    target: decision
    cardinality: one-to-one
    meaning: Délai local et calendrier global restent distincts.
  - id: option_unit
    source: economic_option
    target: evaluation_unit
    cardinality: one-to-many
    meaning: Les familles d’estimation appartiennent à un écosystème.
  - id: option_contract
    source: economic_option
    target: buy_contract
    cardinality: one-to-many
    meaning: Une option Buy reprend les inclusions de ses offres.
  - id: option_annual
    source: economic_option
    target: annual_work
    cardinality: one-to-many
    meaning: Le fonctionnement annuel reste séparé de la construction.
  - id: deploys_option
    source: deployment
    target: economic_option
    cardinality: many-to-one
    meaning: Les adaptations Groupe ne sont pas les comportements génériques du produit.
  - id: ledger_funding
    source: ledger
    target: funding
    cardinality: one-to-many
    meaning: Chaque financement est alloué une fois aux périodes.
  - id: funding_structure
    source: funding
    target: cost_structure
    cardinality: many-to-one
    meaning: Le classement des dépenses ne crée pas de budget.
  - id: scenario_options
    source: economic_scenario
    target: economic_option
    cardinality: many-to-many
    meaning: Simuler modifie les paramètres du scénario sans modifier la référence.
  - id: scenario_ledger
    source: economic_scenario
    target: ledger
    cardinality: one-to-one
    meaning: Un journal unique alimente annuités et horizons.
  - id: calculation_evidence_chain
    source: calculation
    target: calculation_evidence
    cardinality: one-to-many
    meaning: Chaque calcul reconstruit ses entrées depuis une chaîne de preuves vérifiée et exportée.
  rules:
  - id: cocomo_exponent
    title: Exposant d’effort
    expression: B + 0.01 * SF_sum
    variables:
      B: constante COCOMO
      SF_sum: somme des facteurs d’échelle
    unit: sans unité
    kind: arithmetic
    note: ''
    domains:
      B:
        minimum: 0
      SF_sum:
        minimum: 0
  - id: schedule_exponent
    title: Exposant de délai
    expression: D + 0.2 * (E - B)
    variables:
      D: constante de délai
      E: exposant d’effort
      B: constante COCOMO
    unit: sans unité
    kind: arithmetic
    note: ''
    domains:
      D:
        minimum: 0
      E:
        minimum: 0
      B:
        minimum: 0
  - id: cocomo_effort
    title: Effort COCOMO sur les phases déclarées
    expression: A * KSLOC ** E * EM * SCED * month_hours / day_hours * effort_phase_factor
    variables:
      A: constante COCOMO
      KSLOC: milliers de lignes logiques équivalentes après réutilisation
      E: exposant
      EM: produit des autres multiplicateurs
      SCED: multiplicateur d’effort de contrainte de délai
      month_hours: heures par mois-personne
      day_hours: heures par JH
      effort_phase_factor: extension aux phases incluses
    unit: JH
    kind: arithmetic
    note: ''
    domains:
      A:
        minimum: 0
      KSLOC:
        minimum: 0
      E:
        minimum: 0
      EM:
        minimum: 0
      SCED:
        exclusiveMinimum: 0
      month_hours:
        exclusiveMinimum: 0
      day_hours:
        exclusiveMinimum: 0
      effort_phase_factor:
        exclusiveMinimum: 0
  - id: cosmic_effort
    title: Effort fonctionnel COSMIC × ISBSG
    expression: CFP * hours_per_CFP * factor / day_hours
    variables:
      CFP: taille fonctionnelle
      hours_per_CFP: heures par CFP et activités couvertes
      factor: ajustement justifié
      day_hours: heures par JH
    unit: JH
    kind: arithmetic
    note: 20 h/CFP et le facteur 1 sont des hypothèses de ce pilote, pas une calibration FLOW.
    domains:
      CFP:
        minimum: 0
      hours_per_CFP:
        minimum: 0
      factor:
        minimum: 0
      day_hours:
        exclusiveMinimum: 0
  - id: cocomo_schedule
    title: Délai COCOMO aux conditions nominales
    expression: C * (JH / effort_phase_factor * day_hours / month_hours / SCED) ** F * schedule_phase_factor
    variables:
      C: constante de délai
      JH: effort projet adopté
      effort_phase_factor: extension des phases
      day_hours: heures par JH
      month_hours: heures par mois-personne
      SCED: multiplicateur d’effort retiré de PMns
      F: exposant de délai
      schedule_phase_factor: extension aux phases du délai
    unit: mois
    kind: arithmetic
    note: Cas nominal SCED=1. Une compression de calendrier exige la modélisation du pourcentage de délai correspondant
      ; ne pas déduire ce pourcentage du multiplicateur d’effort.
    domains:
      C:
        minimum: 0
      JH:
        minimum: 0
      effort_phase_factor:
        exclusiveMinimum: 0
      day_hours:
        exclusiveMinimum: 0
      month_hours:
        exclusiveMinimum: 0
      SCED:
        exclusiveMinimum: 0
      F:
        minimum: 0
      schedule_phase_factor:
        minimum: 0
  - id: signed_gap
    title: Écart par rapport au calcul de référence
    expression: candidate - reference
    variables:
      candidate: calcul comparé non arrondi
      reference: calcul de référence non arrondi
    unit: JH
    kind: arithmetic
    note: ''
    domains:
      candidate:
        minimum: 0
      reference:
        minimum: 0
  - id: signed_gap_pct
    title: Écart en pourcentage du calcul de référence
    expression: 100 * (candidate - reference) / reference
    variables:
      candidate: calcul comparé non arrondi
      reference: calcul de référence strictement positif
    unit: '%'
    kind: arithmetic
    note: ''
    domains:
      candidate:
        minimum: 0
      reference:
        exclusiveMinimum: 0
  - id: spread
    title: Dispersion entre références
    expression: maximum - minimum
    variables:
      maximum: maximum des calculs comparables
      minimum: minimum des calculs comparables
    unit: JH
    kind: arithmetic
    note: ''
    domains:
      maximum:
        minimum: 0
      minimum:
        minimum: 0
  - id: spread_pct
    title: Dispersion relative
    expression: 100 * (maximum - minimum) / reference
    variables:
      maximum: maximum
      minimum: minimum
      reference: ancrage non arrondi explicitement nommé
    unit: '%'
    kind: arithmetic
    note: ''
    domains:
      maximum:
        minimum: 0
      minimum:
        minimum: 0
      reference:
        exclusiveMinimum: 0
  - id: implied_productivity
    title: Productivité fonctionnelle équivalente
    expression: JH * day_hours / CFP
    variables:
      JH: effort COCOMO
      day_hours: heures par JH
      CFP: taille fonctionnelle strictement positive
    unit: h/CFP
    kind: arithmetic
    note: ''
    domains:
      JH:
        minimum: 0
      day_hours:
        exclusiveMinimum: 0
      CFP:
        exclusiveMinimum: 0
  - id: role_price
    title: Valorisation par rôle
    expression: JH * rate
    variables:
      JH: effort du rôle
      rate: tarif du rôle
    unit: EUR HT
    kind: arithmetic
    note: ''
    domains:
      JH:
        minimum: 0
      rate:
        minimum: 0
  - id: average_team
    title: Capacité moyenne nécessaire
    expression: JH / months / capacity
    variables:
      JH: effort total
      months: délai retenu
      capacity: JH productifs par personne et mois
    unit: ETP
    kind: arithmetic
    note: Contrôle de capacité ; pas un délai indépendant calculé par une deuxième méthode.
    domains:
      JH:
        minimum: 0
      months:
        exclusiveMinimum: 0
      capacity:
        exclusiveMinimum: 0
  - id: coverage
    title: Couverture du référentiel
    expression: 100 * covered / total
    variables:
      covered: capacités distinctes couvertes par une décision
      total: capacités distinctes du périmètre reçu
    unit: '%'
    kind: arithmetic
    note: Mesure de périmètre ; aucune mesure de certitude.
    domains:
      covered:
        minimum: 0
      total:
        exclusiveMinimum: 0
  - id: role_allocation
    title: Ventiler les activités puis les rôles
    expression: JH_role = somme_activités(JH_total × part_activité × clé_activité_rôle)
    variables:
      part_activité: somme des poids de phase × pourcentages publiés / somme des poids / 100
      clé_activité_rôle: hypothèse d’organisation ; somme 1 par activité
    unit: JH
    kind: algorithm
    note: Arrondi par plus grands restes au pas déclaré ; départager les égalités par identifiant. Conserver exactement
      le total.
  - id: retained_rounding
    title: Adopter et arrondir
    expression: arrondi_half_up(résultat / pas) × pas
    variables:
      résultat: calcul choisi par décision
      pas: pas explicite de décision
    unit: JH ou mois
    kind: algorithm
    note: Le résultat arrondi ne remplace pas le résultat de comparaison.
  - id: nonlinear_complements
    title: Contribution marginale des compléments
    expression: effort(taille_commune + taille_compléments) - effort(taille_commune)
    variables:
      taille_commune: taille équivalente commune
      taille_compléments: taille des compléments après réutilisation
    unit: JH
    kind: algorithm
    note: COCOMO est non linéaire. Ne pas additionner des estimations isolées comme si elles formaient le même projet.
  - id: economic_total
    title: Total financé
    expression: somme(JH_rôle × TJM_rôle) + outillage + achats explicites
    variables:
      outillage: assiette et prix selon le modèle économique
      achats: éléments hors effort humain
    unit: EUR HT
    kind: algorithm
    note: Ne pas ajouter une provision globale de pilotage ou une remise IA aux familles dont ces activités sont
      déjà incluses.
  - id: eligible_gains
    title: Gains sur activités éligibles
    expression: JH_nets = JH_bruts × (1 - gain_pct / 100)
    variables:
      inputs: Paramètres des instances propriétaires, avec unités et périodes explicites.
    unit: JH
    kind: algorithm
    note: Les familles Core System adoptées conservent leur total ; aucune remise globale. Les autres activités
      conservent leurs règles existantes.
  - id: annual_work_cost
    title: Travaux annuels
    expression: volume_annuel × JH_unitaires × (1 - gain_pct / 100) × TJM
    variables:
      inputs: Paramètres des instances propriétaires, avec unités et périodes explicites.
    unit: EUR HT/an
    kind: algorithm
    note: Conserver les rôles, activités, hypothèses de volume et dates de début ; les contrats inclus ne sont pas
      refacturés.
  - id: inflation
    title: Indexation par catégorie
    expression: montant_base × (1 + taux_catégorie) ** ancienneté
    variables:
      inputs: Paramètres des instances propriétaires, avec unités et périodes explicites.
    unit: EUR HT
    kind: algorithm
    note: Catégories et conventions temporelles dans les paramètres ; pas de normalisation monétaire cachée.
  - id: period_allocation
    title: Répartir le financement par période
    expression: arrondi_centime(cumul_fin_période) - arrondi_centime(cumul_début_période)
    variables:
      inputs: Paramètres des instances propriétaires, avec unités et périodes explicites.
    unit: EUR HT
    kind: algorithm
    note: Les différences de cumuls préservent les centimes et le total financé.
  - id: horizon_total
    title: Coût à un horizon
    expression: somme des dépenses du journal jusqu’à l’horizon
    variables:
      inputs: Paramètres des instances propriétaires, avec unités et périodes explicites.
    unit: EUR HT
    kind: algorithm
    note: Les horizons 3/5/7/10 ans dérivent du même journal. Le reste à financer ne crée pas de nouvelle dépense.
  - id: reuse_assimilation
    title: Assimilation et intégration du patrimoine réutilisé
    expression: (AA + 0.3 * IM) / 100
    variables:
      AA: évaluation et assimilation du composant
      IM: part de travail d’intégration et vérification
    unit: sans unité
    kind: arithmetic
    note: 'Cas simplifié retenu : conception et code réutilisés sans modification, DM=CM=0 et SU=0. AA et IM sont
      des hypothèses ; le cas général COCOMO nécessite d’autres facteurs.'
    domains:
      AA:
        minimum: 0
        maximum: 8
      IM:
        minimum: 0
        maximum: 100
  - id: equivalent_size
    title: Taille logique équivalente après réutilisation
    expression: new_program + w * new_declarative + AAM * (reused_program + w * reused_declarative)
    variables:
      new_program: unités programme neuves
      new_declarative: unités déclaratives neuves
      reused_program: unités programme réutilisées
      reused_declarative: unités déclaratives réutilisées
      w: poids du déclaratif
      AAM: coefficient de réutilisation
    unit: unités logiques équivalentes
    kind: arithmetic
    note: Unités logiques comptées et hypothèses de pondération conservées séparément. KSLOC = ESLOC / 1000.
    domains:
      new_program:
        minimum: 0
      new_declarative:
        minimum: 0
      reused_program:
        minimum: 0
      reused_declarative:
        minimum: 0
      w:
        minimum: 0
      AAM:
        minimum: 0
        maximum: 1
  - id: calculation_binding
    title: Lier une décision à son calcul
    expression: Même unité, stack, capacités natives, version de source et périmètre des activités.
    variables:
      inputs: Instances et preuves du registre des calculs
    unit: contrôle
    kind: algorithm
    note: Un contrôle structurel ne valide pas la justesse des hypothèses métier.
  - id: evidence_closure
    title: Vérifier les preuves de bout en bout
    expression: Recalculer les empreintes de toutes les dépendances déclarées ; rejeter cycles, dépendances omises
      et pièces modifiées.
    variables:
      inputs: Instances et preuves du registre des calculs
    unit: contrôle
    kind: algorithm
    note: Un contrôle structurel ne valide pas la justesse des hypothèses métier.
  - id: unique_mechanism_funding
    title: Financer chaque mécanisme une fois
    expression: Un propriétaire par mécanisme ; un consommateur référence le financement adopté sans recopier sa
      taille.
    variables:
      inputs: Instances et preuves du registre des calculs
    unit: contrôle
    kind: algorithm
    note: Un contrôle structurel ne valide pas la justesse des hypothèses métier.
  - id: decision_consolidation
    title: Cumuler les décisions adoptées
    expression: Sommer les décisions après contrôle des financements ; aucune estimation intégrée COCOMO ni somme
      des délais locaux.
    variables:
      inputs: Instances et preuves du registre des calculs
    unit: contrôle
    kind: algorithm
    note: Un contrôle structurel ne valide pas la justesse des hypothèses métier.
  - id: prepare_size
    title: Reconstruire les tailles depuis les mesures
    expression: Réconcilier les fichiers mesurés, pondérer le déclaratif, appliquer la réutilisation et compter
      les compléments distincts ; affiner avec les méthodes enregistrées.
    variables:
      inputs: Instances et preuves du registre des calculs
    unit: contrôle
    kind: algorithm
    note: Un contrôle structurel ne valide pas la justesse des hypothèses métier.
  - id: cosmic_count
    title: Recompter les mouvements COSMIC
    expression: Sommer les mouvements E/R/W/X de 1 CFP ; groupes, processus et mouvements distincts et référencés.
    variables:
      inputs: Instances et preuves du registre des calculs
    unit: contrôle
    kind: algorithm
    note: Un contrôle structurel ne valide pas la justesse des hypothèses métier.
  - id: comparison_contract
    title: Qualifier la comparaison
    expression: Contrôler les unités et activités ; exposer les différences de périmètre et les garanties de service
      non appariées.
    variables:
      inputs: Instances et preuves du registre des calculs
    unit: contrôle
    kind: algorithm
    note: Un contrôle structurel ne valide pas la justesse des hypothèses métier.
  invariants:
  - Le référentiel reçu conserve identifiants, libellés, définitions, périmètres, hiérarchie et relations. Aucun
    score de complexité ni hypothèse FLOW ne lui est ajouté.
  - Une comparaison déclare périmètre, activités, unités et conventions horaires. Si les activités ne sont pas alignées,
    l’écart est descriptif et cette limite est affichée.
  - Une référence nulle ou inconnue ne produit pas de pourcentage ; retourner null avec le motif, jamais zéro par
    défaut.
  - Les indicateurs utilisent les résultats non arrondis. Une dispersion n’est ni un intervalle probabiliste ni
    une mesure de confiance.
  - 'Les hypothèses partagées sont signalées : quatre références partageant les compléments ne constituent pas quatre
    validations indépendantes.'
  - Aucune classe ABCDE. L’incertitude reste inconnue tant que ses bornes et probabilités ne sont pas étayées.
  - Les répartitions d’activité publiées et les clés activité/rôle proposées sont conservées séparément.
  - Le délai d’une famille ne remplace pas le calendrier global. Le financement est compté une seule fois.
  - Une règle déclarée descriptive ne s’exécute pas automatiquement ; son implémentation et ses contrôles sont identifiés.
  - Les classes de couverture sont sans objet, en attente, partielle ou complète selon les capacités distinctes
    ; elles ne mesurent pas la confiance.
  - 'Les références natives comprennent encore des fonctions de création et édition directe non isolées : la comparaison
    avec le contrat FLOW est partielle.'
  - Le cumul des décisions adoptées ne vaut pas recalcul non linéaire de tout le Core System ; aucun délai local
    n’est agrégé.
