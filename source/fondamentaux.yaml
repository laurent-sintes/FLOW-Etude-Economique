  - id: estimates
    source: calculation
    target: evaluation_unit
    cardinality: many-to-one
    meaning: Les calculs comparent la même unité et les mêmes activités.
  - id: compares
    source: comparison
    target: calculation
    cardinality: many-to-many
    meaning: Au moins deux résultats identifiés, avec une référence explicite.
  - id: describes_gap
    source: alignment
    target: comparison
    cardinality: many-to-one
    meaning: Décrit un écart arithmétique, sans interprétation en confiance.
  - id: qualifies
    source: uncertainty
    target: calculation
    cardinality: many-to-one
    meaning: Bornes et probabilités seulement si une méthode et des preuves le permettent.
  - id: adopts
    source: decision
    target: calculation
    cardinality: many-to-one
    meaning: Décision distincte du résultat non arrondi ; aucune moyenne automatique.
  - id: allocates
    source: role_allocation
    target: decision
    cardinality: many-to-one
    meaning: La somme des rôles conserve le total adopté.
  - id: maps_activities
    source: role_allocation
    target: activity
    cardinality: many-to-many
    meaning: Clés d’organisation hypothétiques distinctes des répartitions publiées.
  - id: prices
    source: role_allocation
    target: rate
    cardinality: many-to-one
    meaning: Tarif sourcé ou hypothèse explicite.
  - id: funds
    source: funding
    target: decision
    cardinality: many-to-one
    meaning: Un seul financement par décision.
  - id: owns_mechanism
    source: mechanism
    target: funding
    cardinality: many-to-one
    meaning: Un propriétaire ; les consommateurs ne recomptent pas sa construction.
  - id: owns_complement
    source: flow_complement
    target: funding
    cardinality: many-to-one
    meaning: Complément financé une seule fois.
  - id: plans
    source: schedule
    target: decision
    cardinality: one-to-one
    meaning: Délai local et calendrier global restent distincts.
  - id: option_unit
    source: economic_option
    target: evaluation_unit
    cardinality: one-to-many
    meaning: Les familles d’estimation appartiennent à un écosystème.
  - id: option_contract
    source: economic_option
    target: buy_contract
    cardinality: one-to-many
    meaning: Une option Buy reprend les inclusions de ses offres.
  - id: option_annual
    source: economic_option
    target: annual_work
    cardinality: one-to-many
    meaning: Le fonctionnement annuel reste séparé de la construction.
  - id: deploys_option
    source: deployment
    target: economic_option
    cardinality: many-to-one
    meaning: Les adaptations Groupe ne sont pas les comportements génériques du produit.
  - id: ledger_funding
    source: ledger
    target: funding
    cardinality: one-to-many
    meaning: Chaque financement est alloué une fois aux périodes.
  - id: funding_structure
    source: funding
    target: cost_structure
    cardinality: many-to-one
    meaning: Le classement des dépenses ne crée pas de budget.
  - id: scenario_options
    source: economic_scenario
    target: economic_option
    cardinality: many-to-many
    meaning: Simuler modifie les paramètres du scénario sans modifier la référence.
  - id: scenario_ledger
    source: economic_scenario
    target: ledger
    cardinality: one-to-one
    meaning: Un journal unique alimente annuités et horizons.
  - id: calculation_evidence_chain
    source: calculation
    target: calculation_evidence
    cardinality: one-to-many
    meaning: Chaque calcul reconstruit ses entrées depuis une chaîne de preuves vérifiée et exportée.
  - id: attribution_evidence
    source: component_attribution
    target: calculation_evidence
    cardinality: many-to-many
    meaning: Les mesures source sont distinctes des parts de pertinence supposées.
  - id: attribution_input
    source: component_attribution
    target: cocomo_input
    cardinality: many-to-one
    meaning: Produit une taille équivalente, pas un effort observé.
  - id: function_purpose
    source: professional_function
    target: product_purpose
    cardinality: many-to-one
    meaning: La finalité du travail est indépendante des rôles du projet et des couches techniques.
  - id: function_evidence
    source: professional_function
    target: market_reference
    cardinality: many-to-many
    meaning: Comparer les fonctions administratives et professionnelles des suites, sans déduire leur absence d’un
      fichier manquant.
  - id: function_funding
    source: professional_function
    target: mechanism
    cardinality: many-to-many
    meaning: Rapprocher les travaux déjà financés avant toute charge complémentaire ; la présence de code ne prouve
      pas la complétude du financement.
  - id: purpose_of_adopted_unit
    source: purpose_partition
    target: evaluation_unit
    cardinality: many-to-one
    meaning: Ventiler une décision adoptée sans changer ses JH, rôles, prix ni calendrier.
  - id: purpose_share
    source: purpose_partition
    target: product_purpose
    cardinality: many-to-many
    meaning: Une part déclarée de JH par rôle compte une fois ; une part inconnue reste non ventilée, sans devenir
      zéro.
  - id: proposal_units
    source: product_estimate_proposal
    target: evaluation_unit
    cardinality: many-to-many
    meaning: Avant adoption, conserver la référence économique. À la décision, remplacer explicitement l’unité élargie et ajouter les seuls lots nouveaux, avec leurs contrats et financements.
  - id: proposal_functions
    source: product_estimate_proposal
    target: professional_function
    cardinality: many-to-many
    meaning: Couvrir les fonctions professionnelles par des lots cohérents ; déduire les mécanismes déjà financés.
  - id: proposal_evidence
    source: product_estimate_proposal
    target: calculation_evidence
    cardinality: many-to-many
    meaning: Conserver chemins, révisions, mesures, comptages prévisionnels et hypothèses séparés ; proximité de
      calculs partagés ne vaut pas indépendance.
  - id: proposal_technical_trials
    source: product_estimate_proposal
    target: technical_trial
    cardinality: one-to-many
    meaning: Éprouver les choix techniques et les hypothèses de réutilisation sans assimiler le prototype à un bilan de charge.
  - id: trial_funding
    source: technical_trial
    target: professional_function
    cardinality: many-to-many
    meaning: Rattacher les mécanismes observés aux lots déjà proposés et aux réutilisations financées, sans double compte.
  rules:
  - id: cocomo_exponent
    title: Exposant d’effort
    expression: B + 0.01 * SF_sum
    variables:
      B: constante COCOMO
      SF_sum: somme des facteurs d’échelle
    unit: sans unité
    kind: arithmetic
    note: ''
    domains:
      B:
        minimum: 0
      SF_sum:
        minimum: 0
  - id: schedule_exponent
    title: Exposant de délai
    expression: D + 0.2 * (E - B)
    variables:
      D: constante de délai
      E: exposant d’effort
      B: constante COCOMO
    unit: sans unité
    kind: arithmetic
    note: ''
    domains:
      D:
        minimum: 0
      E:
        minimum: 0
      B:
        minimum: 0
  - id: cocomo_effort
    title: Effort COCOMO sur les phases déclarées
    expression: A * KSLOC ** E * EM * SCED * month_hours / day_hours * effort_phase_factor
    variables:
      A: constante COCOMO
      KSLOC: milliers de lignes logiques équivalentes après réutilisation
      E: exposant
      EM: produit des autres multiplicateurs
      SCED: multiplicateur d’effort de contrainte de délai
      month_hours: heures par mois-personne
      day_hours: heures par JH
      effort_phase_factor: extension aux phases incluses
    unit: JH
    kind: arithmetic
    note: ''
    domains:
      A:
        minimum: 0
      KSLOC:
        minimum: 0
      E:
        minimum: 0
      EM:
        minimum: 0
      SCED:
        exclusiveMinimum: 0
      month_hours:
        exclusiveMinimum: 0
      day_hours:
        exclusiveMinimum: 0
      effort_phase_factor:
        exclusiveMinimum: 0
  - id: cosmic_effort
    title: Effort fonctionnel COSMIC × ISBSG
    expression: CFP * hours_per_CFP * factor / day_hours
    variables:
      CFP: taille fonctionnelle
      hours_per_CFP: heures par CFP et activités couvertes
      factor: ajustement justifié
      day_hours: heures par JH
    unit: JH
    kind: arithmetic
    note: 20 h/CFP et le facteur 1 sont des hypothèses de ce pilote, pas une calibration FLOW.
    domains:
      CFP:
        minimum: 0
      hours_per_CFP:
        minimum: 0
      factor:
        minimum: 0
      day_hours:
        exclusiveMinimum: 0
  - id: cocomo_schedule
    title: Délai COCOMO aux conditions nominales
    expression: C * (JH / effort_phase_factor * day_hours / month_hours / SCED) ** F * schedule_phase_factor
    variables:
      C: constante de délai
      JH: effort projet adopté
      effort_phase_factor: extension des phases
      day_hours: heures par JH
      month_hours: heures par mois-personne
      SCED: multiplicateur d’effort retiré de PMns
      F: exposant de délai
      schedule_phase_factor: extension aux phases du délai
    unit: mois
    kind: arithmetic
    note: Cas nominal SCED=1. Une compression de calendrier exige la modélisation du pourcentage de délai correspondant
      ; ne pas déduire ce pourcentage du multiplicateur d’effort.
    domains:
      C:
        minimum: 0
      JH:
        minimum: 0
      effort_phase_factor:
        exclusiveMinimum: 0
      day_hours:
        exclusiveMinimum: 0
      month_hours:
        exclusiveMinimum: 0
      SCED:
        exclusiveMinimum: 0
      F:
        minimum: 0
      schedule_phase_factor:
        minimum: 0
  - id: signed_gap
    title: Écart par rapport au calcul de référence
    expression: candidate - reference
    variables:
      candidate: calcul comparé non arrondi
      reference: calcul de référence non arrondi
    unit: JH
    kind: arithmetic
    note: ''
    domains:
      candidate:
        minimum: 0
      reference:
        minimum: 0
  - id: signed_gap_pct
    title: Écart en pourcentage du calcul de référence
    expression: 100 * (candidate - reference) / reference
    variables:
      candidate: calcul comparé non arrondi
      reference: calcul de référence strictement positif
    unit: '%'
    kind: arithmetic
    note: ''
    domains:
      candidate:
        minimum: 0
      reference:
        exclusiveMinimum: 0
  - id: spread
    title: Dispersion entre références
    expression: maximum - minimum
    variables:
      maximum: maximum des calculs comparables
      minimum: minimum des calculs comparables
    unit: JH
    kind: arithmetic
    note: ''
    domains:
      maximum:
        minimum: 0
      minimum:
        minimum: 0
  - id: spread_pct
    title: Dispersion relative
    expression: 100 * (maximum - minimum) / reference
    variables:
      maximum: maximum
      minimum: minimum
      reference: ancrage non arrondi explicitement nommé
    unit: '%'
    kind: arithmetic
    note: ''
    domains:
      maximum:
        minimum: 0
      minimum:
        minimum: 0
      reference:
        exclusiveMinimum: 0
  - id: implied_productivity
    title: Productivité fonctionnelle équivalente
    expression: JH * day_hours / CFP
    variables:
      JH: effort COCOMO
      day_hours: heures par JH
      CFP: taille fonctionnelle strictement positive
    unit: h/CFP
    kind: arithmetic
    note: ''
    domains:
      JH:
        minimum: 0
      day_hours:
        exclusiveMinimum: 0
      CFP:
        exclusiveMinimum: 0
  - id: role_price
    title: Valorisation par rôle
    expression: JH * rate
    variables:
      JH: effort du rôle
      rate: tarif du rôle
    unit: EUR HT
    kind: arithmetic
    note: ''
    domains:
      JH:
        minimum: 0
      rate:
        minimum: 0
  - id: average_team
    title: Capacité moyenne nécessaire
    expression: JH / months / capacity
    variables:
      JH: effort total
      months: délai retenu
      capacity: JH productifs par personne et mois
    unit: ETP
    kind: arithmetic
    note: Contrôle de capacité ; pas un délai indépendant calculé par une deuxième méthode.
    domains:
      JH:
        minimum: 0
      months:
        exclusiveMinimum: 0
      capacity:
        exclusiveMinimum: 0
  - id: coverage
    title: Couverture du référentiel
    expression: 100 * covered / total
    variables:
      covered: capacités distinctes couvertes par une décision
      total: capacités distinctes du périmètre reçu
    unit: '%'
    kind: arithmetic
    note: Mesure de périmètre ; aucune mesure de certitude.
    domains:
      covered:
        minimum: 0
      total:
        exclusiveMinimum: 0
  - id: role_allocation
    title: Ventiler les activités puis les rôles
    expression: JH_role = somme_activités(JH_total × part_activité × clé_activité_rôle)
    variables:
      part_activité: somme des poids de phase × pourcentages publiés / somme des poids / 100
      clé_activité_rôle: hypothèse d’organisation ; somme 1 par activité
    unit: JH
    kind: algorithm
    note: Arrondi par plus grands restes au pas déclaré ; départager les égalités par identifiant. Conserver exactement
      le total.
  - id: retained_rounding
    title: Adopter et arrondir
    expression: arrondi_half_up(résultat / pas) × pas
    variables:
      résultat: calcul choisi par décision
      pas: pas explicite de décision
    unit: JH ou mois
    kind: algorithm
    note: Le résultat arrondi ne remplace pas le résultat de comparaison.
  - id: nonlinear_complements
    title: Contribution marginale des compléments
    expression: effort(taille_commune + taille_compléments) - effort(taille_commune)
    variables:
      taille_commune: taille équivalente commune
      taille_compléments: taille des compléments après réutilisation
    unit: JH
    kind: algorithm
    note: COCOMO est non linéaire. Ne pas additionner des estimations isolées comme si elles formaient le même projet.
  - id: economic_total
    title: Total financé
    expression: somme(JH_rôle × TJM_rôle) + outillage + achats explicites
    variables:
      outillage: assiette et prix selon le modèle économique
      achats: éléments hors effort humain
    unit: EUR HT
    kind: algorithm
    note: Ne pas ajouter une provision globale de pilotage ou une remise IA aux familles dont ces activités sont
      déjà incluses.
  - id: eligible_gains
    title: Gains sur activités éligibles
    expression: JH_nets = JH_bruts × (1 - gain_pct / 100)
    variables:
      inputs: Paramètres des instances propriétaires, avec unités et périodes explicites.
    unit: JH
    kind: algorithm
    note: Les familles Core System adoptées conservent leur total ; aucune remise globale. Les autres activités
      conservent leurs règles existantes.
  - id: annual_work_cost
    title: Travaux annuels
    expression: volume_annuel × JH_unitaires × (1 - gain_pct / 100) × TJM
    variables:
      inputs: Paramètres des instances propriétaires, avec unités et périodes explicites.
    unit: EUR HT/an
    kind: algorithm
    note: Conserver les rôles, activités, hypothèses de volume et dates de début ; les contrats inclus ne sont pas
      refacturés.
  - id: inflation
    title: Indexation par catégorie
    expression: montant_base × (1 + taux_catégorie) ** ancienneté
    variables:
      inputs: Paramètres des instances propriétaires, avec unités et périodes explicites.
    unit: EUR HT
    kind: algorithm
    note: Catégories et conventions temporelles dans les paramètres ; pas de normalisation monétaire cachée.
  - id: period_allocation
    title: Répartir le financement par période
    expression: arrondi_centime(cumul_fin_période) - arrondi_centime(cumul_début_période)
    variables:
      inputs: Paramètres des instances propriétaires, avec unités et périodes explicites.
    unit: EUR HT
    kind: algorithm
    note: Les différences de cumuls préservent les centimes et le total financé.
  - id: horizon_total
    title: Coût à un horizon
    expression: somme des dépenses du journal jusqu’à l’horizon
    variables:
      inputs: Paramètres des instances propriétaires, avec unités et périodes explicites.
    unit: EUR HT
    kind: algorithm
    note: Les horizons 3/5/7/10 ans dérivent du même journal. Le reste à financer ne crée pas de nouvelle dépense.
  - id: reuse_assimilation
    title: Assimilation et intégration du patrimoine réutilisé
    expression: (AA + 0.3 * IM) / 100
    variables:
      AA: évaluation et assimilation du composant
      IM: part de travail d’intégration et vérification
    unit: sans unité
    kind: arithmetic
    note: 'Cas simplifié retenu : conception et code réutilisés sans modification, DM=CM=0 et SU=0. AA et IM sont
      des hypothèses ; le cas général COCOMO nécessite d’autres facteurs.'
    domains:
      AA:
        minimum: 0
        maximum: 8
      IM:
        minimum: 0
        maximum: 100
  - id: equivalent_size
    title: Taille logique équivalente après réutilisation
    expression: new_program + w * new_declarative + AAM * (reused_program + w * reused_declarative)
    variables:
      new_program: unités programme neuves
      new_declarative: unités déclaratives neuves
      reused_program: unités programme réutilisées
      reused_declarative: unités déclaratives réutilisées
      w: poids du déclaratif
      AAM: coefficient de réutilisation
    unit: unités logiques équivalentes
    kind: arithmetic
    note: Unités logiques comptées et hypothèses de pondération conservées séparément. KSLOC = ESLOC / 1000.
    domains:
      new_program:
        minimum: 0
      new_declarative:
        minimum: 0
      reused_program:
        minimum: 0
      reused_declarative:
        minimum: 0
      w:
        minimum: 0
      AAM:
        minimum: 0
        maximum: 1
  - id: calculation_binding
    title: Lier une décision à son calcul
    expression: Même unité, stack, capacités natives, version de source et périmètre des activités.
    variables:
      inputs: Instances et preuves du registre des calculs
    unit: contrôle
    kind: algorithm
    note: Un contrôle structurel ne valide pas la justesse des hypothèses métier.
  - id: evidence_closure
    title: Vérifier les preuves de bout en bout
    expression: Recalculer les empreintes de toutes les dépendances déclarées ; rejeter cycles, dépendances omises
      et pièces modifiées.
    variables:
      inputs: Instances et preuves du registre des calculs
    unit: contrôle
    kind: algorithm
    note: Un contrôle structurel ne valide pas la justesse des hypothèses métier.
  - id: unique_mechanism_funding
    title: Financer chaque mécanisme une fois
    expression: Un propriétaire par mécanisme ; un consommateur référence le financement adopté sans recopier sa
      taille.
    variables:
      inputs: Instances et preuves du registre des calculs
    unit: contrôle
    kind: algorithm
    note: Un contrôle structurel ne valide pas la justesse des hypothèses métier.
  - id: decision_consolidation
    title: Cumuler les décisions adoptées
    expression: Sommer les décisions après contrôle des financements ; aucune estimation intégrée COCOMO ni somme
      des délais locaux.
    variables:
      inputs: Instances et preuves du registre des calculs
    unit: contrôle
    kind: algorithm
    note: Un contrôle structurel ne valide pas la justesse des hypothèses métier.
  - id: prepare_size
    title: Reconstruire les tailles depuis les mesures
    expression: Réconcilier les fichiers mesurés, pondérer le déclaratif, appliquer la réutilisation et compter
      les compléments distincts ; affiner avec les méthodes enregistrées.
    variables:
      inputs: Instances et preuves du registre des calculs
    unit: contrôle
    kind: algorithm
    note: Un contrôle structurel ne valide pas la justesse des hypothèses métier.
  - id: cosmic_count
    title: Recompter les mouvements COSMIC
    expression: Sommer les mouvements E/R/W/X de 1 CFP ; groupes, processus et mouvements distincts et référencés.
    variables:
      inputs: Instances et preuves du registre des calculs
    unit: contrôle
    kind: algorithm
    note: Un contrôle structurel ne valide pas la justesse des hypothèses métier.
  - id: comparison_contract
    title: Qualifier la comparaison
    expression: Contrôler les unités et activités ; exposer les différences de périmètre et les garanties de service
      non appariées.
    variables:
      inputs: Instances et preuves du registre des calculs
    unit: contrôle
    kind: algorithm
    note: Un contrôle structurel ne valide pas la justesse des hypothèses métier.
  - id: component_attribution
    title: Attribuer une taille métier au code mixte
    expression: max(taille source après retrait du patrimoine déjà financé × part supposée, plancher métier mesuré)
    variables:
      inputs: Mesures sources, déductions du financement existant, part de pertinence et plancher par fichier
    unit: unités logiques équivalentes
    kind: algorithm
    note: Union des fichiers et des instructions avant calcul ; attribution d’ingénierie, sans score de complexité
      ni proportion observée.
  - id: module_analogy
    title: Dimensionner un module nouveau par analogie
    expression: reference_units * fraction + scaffold_units
    variables:
      reference_units: Comportement natif après déduction du patrimoine déjà financé
      fraction: Fraction de comportement nouveau supposée, pas norme de marché
      scaffold_units: Structure du service nouveau mesurée dans la technologie native
    domains:
      reference_units:
        minimum: 0
      fraction:
        minimum: 0
      scaffold_units:
        minimum: 0
    unit: unités logiques équivalentes
    kind: arithmetic
    note: Schémas, vues et configurations ajoutés séparément. Les fractions et les partages du code restent des
      hypothèses explicites.
  - id: funded_module_preparation
    title: Dimensionner de nouveaux modules sur des analogues déjà financés
    expression: Reconstruire les analogues du calcul propriétaire référencé, appliquer les fractions de modules
      nouveaux et leurs modèles ; ne pas ajouter le code déjà financé à la nouvelle famille.
    variables:
      inputs: Contrat propre à la famille, preuves et contrat figé du fournisseur des analogues
    unit: contrôle
    kind: algorithm
    note: La dépendance au fournisseur et le propriétaire de financement sont explicites. Le contrôle de taille
      ne valide pas la suffisance des fractions ni la productivité.
  - id: coherent_component_preparation
    title: Préparer une unité de composants cohérents
    expression: Reconstruire les atomes et analogues natifs, attribuer la base une seule fois, sommer les tailles
      des modules de l’unité puis appliquer COCOMO II une fois. Recompter COSMIC à la même frontière.
    variables:
      inputs: Contrat d’unité, archives complètes figées, mesures, modules, gabarits, allocations et comptage fonctionnel
    unit: contrôle
    kind: algorithm
    note: Les archives gzip/base64 sont des preuves complètes de stockage. Les fractions restent des hypothèses.
      Les allocations entre familles ne sont pas des estimations indépendantes par capacité.
  - id: purpose_unallocated_jh
    title: JH adoptés non encore ventilés entre métier et IT
    expression: total - business - it
    variables:
      total: Total adopté sur la même assiette
      business: Part métier explicitement attribuée
      it: Part IT explicitement attribuée
    unit: JH
    kind: arithmetic
    note: Les parts attribuées ne sont pas une nouvelle estimation. Leur somme et le non ventilé doivent conserver
      le total et chaque rôle.
    domains:
      total:
        minimum: 0
      business:
        minimum: 0
      it:
        minimum: 0
  - id: purpose_unallocated_cost
    title: Coût adopté non encore ventilé entre métier et IT
    expression: total - business - it
    variables:
      total: Total adopté sur la même assiette
      business: Part métier explicitement attribuée
      it: Part IT explicitement attribuée
    unit: EUR HT
    kind: arithmetic
    note: Les parts attribuées ne sont pas une nouvelle estimation. Leur somme et le non ventilé doivent conserver
      le total et chaque rôle.
    domains:
      total:
        minimum: 0
      business:
        minimum: 0
      it:
        minimum: 0
  - id: product_purpose_partition
    title: Ventilation des fonctions métier et IT du produit
    expression: Contrôler les fonctions professionnelles et leurs preuves ; ventiler les JH adoptés par rôles et
      finalités seulement sur une attribution justifiée ; conserver le reste non ventilé et le complément requis
      inconnu.
    variables:
      adopted_units: Décisions adoptées et valorisées
      declared_allocations: Attributions étayées en JH par rôle
      professional_functions: Fonctions du produit et réutilisation à qualifier
    unit: Ventilation des JH et EUR HT adoptés, sans nouveau budget
    kind: algorithm
    note: La cartographie native reste inchangée. Runtime et outils métier sont distincts des fonctions IT transverses
      ; un rôle QA ou DevOps ne constitue pas une catégorie fonctionnelle.
  - id: complete_product_proposal
    title: Chiffrage proposé du produit métier et IT complet sur son périmètre déclaré
    expression: Conserver les unités inchangées ; remplacer une unité élargie par son nouveau calcul COCOMO ; agréger
      les tailles des compléments cohérents avant COCOMO ; déduire les réutilisations financées ; ventiler chaque
      rôle une fois ; contrôler les fonctions COSMIC remplacées et consommées ; tester une hypothèse à la fois.
    variables:
      measured_components: Instructions et déclarations des périmètres OSS révisés
      module_assumptions: Fractions de composants nouveaux proposées et sensibilités
      adopted_units: Décisions conservées et unité explicitement remplacée
      functional_forecast: Processus et mouvements prévisionnels, hors fonctions déjà comptées
    unit: JH projet, EUR HT, mois nominaux et écarts entre méthodes
    kind: algorithm
    note: Les règles arithmétiques COCOMO et COSMIC du métamodèle sont réutilisées. Une proposition ne modifie les décisions et simulations qu’après adoption explicite et rattachement aux contrats actifs. La couverture déclarée n’est ni une exhaustivité future prouvée
      ni une confiance statistique.
  - id: professional_component_preparation
    title: Adoption des lots professionnels depuis une base antérieure figée
    expression: Reconstituer les tailles COCOMO et les comptages COSMIC depuis les preuves ; adopter les nouveaux lots et leur répartition de rôles ; conserver les unités inchangées, puis ventiler chaque JH par finalité une seule fois.
    variables:
      proposal_inputs: Mesures et hypothèses de composants
      adoption_basis: Décisions antérieures et résultat de la proposition figés
      component_scope: Groupe professionnel et fonctions financées
    unit: JH projet, mois et rôles
    kind: algorithm
    note: Les distributions publiées d’activités sont conservées séparément des rôles adoptés. La reconstruction ne prend jamais les nouveaux lots comme base de leur propre complément.
  invariants:
  - Un essai technique réussi démontre seulement ses cas et conditions déclarés. Son temps de réalisation et son code ne calibrent pas automatiquement les JH ; les effets sur le chiffrage sont explicités séparément.
  - Le référentiel reçu conserve identifiants, libellés, définitions, périmètres, hiérarchie et relations. Aucun
    score de complexité ni hypothèse FLOW ne lui est ajouté.
  - Une comparaison déclare périmètre, activités, unités et conventions horaires. Si les activités ne sont pas alignées,
    l’écart est descriptif et cette limite est affichée.
  - Une référence nulle ou inconnue ne produit pas de pourcentage ; retourner null avec le motif, jamais zéro par
    défaut.
  - Les indicateurs utilisent les résultats non arrondis. Une dispersion n’est ni un intervalle probabiliste ni
    une mesure de confiance.
  - 'Les hypothèses partagées sont signalées : quatre références partageant les compléments ne constituent pas quatre
    validations indépendantes.'
  - Aucune classe ABCDE. L’incertitude reste inconnue tant que ses bornes et probabilités ne sont pas étayées.
  - Les répartitions d’activité publiées et les clés activité/rôle proposées sont conservées séparément.
  - Le délai d’une famille ne remplace pas le calendrier global. Le financement est compté une seule fois.
  - Une règle déclarée descriptive ne s’exécute pas automatiquement ; son implémentation et ses contrôles sont identifiés.
  - Les classes de couverture sont sans objet, en attente, partielle ou complète selon les capacités distinctes
    ; elles ne mesurent pas la confiance.
  - 'Les références natives comprennent encore des fonctions de création et édition directe non isolées : la comparaison
    avec le contrat FLOW est partielle.'
  - Le cumul des décisions adoptées ne vaut pas recalcul non linéaire de tout le Core System ; aucun délai local
    n’est agrégé.
  - Les ensembles fortement liés sont estimés une fois sur leur taille totale ; ne pas cumuler leur charge et celle
    de leurs composants ou mécanismes communs.
  - La complétude du produit inclut les fonctions professionnelles IT absentes de la cartographie métier ; aucune
    nouvelle capacité native n’est créée.
  - Les coûts métier, IT et non ventilés partitionnent les seuls travaux adoptés. Les compléments inconnus restent
    null ; ils ne sont ni inclus par défaut ni mis à zéro.
  - Une ventilation par finalité conserve les JH de chaque rôle et les tarifs de chaque unité. Les familles déjà
    adoptées ne sont pas estimées à nouveau par ce partage.
