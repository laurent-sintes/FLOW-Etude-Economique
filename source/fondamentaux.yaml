  relations:
  - id: analyzes
    source: scope_analysis
    target: native_capability
    cardinality: many-to-one
    meaning: Référence la capacité sans modifier son contenu reçu.
  - id: covers
    source: evaluation_unit
    target: native_capability
    cardinality: many-to-many
    meaning: Périmètre déclaré ; aucune ventilation artificielle de JH par capacité.
  - id: inspects
    source: scope_analysis
    target: market_reference
    cardinality: many-to-many
    meaning: Compare des fonctions observées à partir du code et de preuves.
  - id: reuses
    source: evaluation_unit
    target: mechanism
    cardinality: many-to-many
    meaning: La réutilisation laisse visibles adaptation et intégration technique.
  - id: requires
    source: evaluation_unit
    target: flow_complement
    cardinality: one-to-many
    meaning: Exigences additionnelles étayées ou hypothèses identifiées.
  - id: analogous
    source: flow_complement
    target: market_reference
    cardinality: many-to-many
    meaning: Une analogie est distincte d’une mesure.
