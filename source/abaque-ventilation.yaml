version: 1
id: work-allocation-abaque
labels:
  remainder: Part restante sans attribution documentée.
rules:
- id: source-owner
  label: Responsabilité source connue
  condition: Équipe explicitement désignée dans la source propriétaire.
  share_pct: 100
  basis: Conserver l’affectation retenue sans ajouter de répartition.
- id: governance
  label: Gouvernance du programme
  condition: Travaux de gouvernance conservés hors équipes de delivery.
  share_pct: 100
  basis: Préserver les rôles et financements du pilotage.
- id: unallocated
  label: Responsabilité à établir
  condition: Équipe inconnue ou uniquement candidate.
  share_pct: 0
  basis: Conserver la totalité dans le reliquat. Une candidature ne vaut pas affectation.
overrides: []
