version: 1
id: work-allocation-abaque
labels:
  remainder: Part restante sans attribution documentée.
rules:
- id: source-owner
  label: Responsabilité source connue
  condition: Équipe explicitement désignée dans la source propriétaire.
  share_pct: 100
  basis: Conserver l’affectation retenue sans ajouter de répartition.
- id: governance
  label: Gouvernance du programme
  condition: Travaux de gouvernance conservés hors équipes de delivery.
  share_pct: 100
  basis: Préserver les rôles et financements du pilotage.
- id: unallocated
  label: Responsabilité à établir
  condition: Équipe inconnue ou uniquement candidate.
  share_pct: 0
  basis: Conserver la totalité dans le reliquat. Une candidature ne vaut pas affectation.
overrides:
- id: build-orders
  work_unit_ref: core/orders-java-spring
  phase_ref: acquisition
  measure: effort
  component_ref: '*'
  basis: >-
    Comptage COSMIC de 147 points. La répartition suit les processus adoptés, puis les JH entiers validés. Preuve dans audits/2026-11-02-adoption-perimetre-scenarios/scope.json.
  shares:
  - team_ref: sourcing-procurement
    share_pct: 63.333333333333
    contribution_kind: responsibility
    basis: >-
      93 points COSMIC. Socle commun des commandes typées (65 points) et parcours d’achat, dont consignation et retours fournisseur (28 points).
  - team_ref: b2c
    share_pct: 17.619047619048
    contribution_kind: functional
    basis: >-
      26 points COSMIC. Précommande et parcours de retour, remplacement et rapprochement client.
  - team_ref: wholesale
    share_pct: 19.047619047619
    contribution_kind: functional
    basis: >-
      28 points COSMIC. Engagements réciproques, révisions, résultats et retours intersociétés.
