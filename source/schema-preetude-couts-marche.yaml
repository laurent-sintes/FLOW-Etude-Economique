type: object
additionalProperties: false
required:
- version
- id
- recorded_on
- provenance
- rates
- purchase_refs
- ai_refs
- effort_groups
- programmes
- transformation_roles
- rate_study
properties:
  version:
    const: 1
  id:
    const: preetude-couts-marche
  recorded_on: &id001
    type: string
    minLength: 1
  provenance: *id001
  rates:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
      - id
      - profile
      - unit
      - tax_status
      - kind
      - scope
      - source_stack
      - basis_ref
      - stacks
      - roles
      - min
      - max
      - price_date
      - source_ids
      - purchase_mode
      properties:
        id: *id001
        profile: *id001
        unit:
          const: EUR_par_JH
        tax_status:
          enum:
          - non_retranscrit
          - HT
        kind:
          enum:
          - barometre
          - annonce
          - signal_contradictoire
          - non_retranscrit
          - offre_fournisseur
        scope: *id001
        source_stack: *id001
        basis_ref: *id001
        stacks:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum:
            - java-spring
            - dotnet
            - rust
            - microsoft
            - sap
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum:
            - expert
            - qa
            - architecte
            - support_utilisateur
        min: &id002
          type:
          - number
          - 'null'
          minimum: 0
        max: *id002
        price_date:
          type:
          - string
          - 'null'
        source_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: *id001
        purchase_mode:
          enum:
          - freelance_direct
          - esn
        source_locator:
          type: string
          minLength: 1
  purchase_refs:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - observation
      properties:
        id: *id001
        title: *id001
        observation: *id001
  ai_refs:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - published_on
      - observed_result
      - population
      - limit
      properties:
        id: *id001
        title: *id001
        published_on:
          type: string
          minLength: 1
        observed_result:
          type: string
          minLength: 1
        population:
          type: string
          minLength: 1
        limit:
          type: string
          minLength: 1
  effort_groups:
    type: object
    additionalProperties: false
    required:
    - productivity
    - programmes
    properties:
      productivity:
        type: array
        minItems: 1
        uniqueItems: true
        items: *id001
      programmes:
        type: array
        minItems: 1
        uniqueItems: true
        items: *id001
  programmes:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - currency
      - period
      - status
      - scope
      - limit
      - url
      - basis_ref
      - amount
      properties:
        id:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        currency:
          enum:
          - USD
          - EUR
        period:
          type: string
          minLength: 1
        status:
          type: string
          minLength: 1
        scope:
          type: string
          minLength: 1
        limit:
          type: string
          minLength: 1
        url:
          type: string
          minLength: 1
        basis_ref:
          type: string
          minLength: 1
        amount:
          type: number
          minimum: 0
  transformation_roles:
    type: array
    minItems: 5
    maxItems: 5
    items:
      type: object
      additionalProperties: false
      properties:
        id: &id003
          type: string
          minLength: 1
        title: *id003
        market_title: *id003
        mission: *id003
        conclusion: *id003
        observations:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            properties:
              kind: *id003
              url: *id003
              title: *id003
              scope: *id003
              limit: *id003
              recorded_on: *id003
              currency:
                const: EUR
              unit:
                const: jour
              tax_status:
                enum:
                - HT
                - non explicité
              min: &id004
                type: number
                minimum: 0
              max: *id004
              price_date:
                type:
                - string
                - 'null'
            required:
            - kind
            - url
            - title
            - scope
            - limit
            - recorded_on
            - currency
            - unit
            - tax_status
            - min
            - max
            - price_date
      required:
      - id
      - title
      - market_title
      - mission
      - conclusion
      - observations
  rate_study:
    type: object
    additionalProperties: false
    properties:
      recorded_on: &id005
        type: string
        minLength: 1
      sources:
        type: object
        additionalProperties:
          type: object
          additionalProperties: false
          properties:
            title: *id005
            url: *id005
            published_on: &id006
              type:
              - string
              - 'null'
            recorded_on: *id005
            method: *id005
            limit: *id005
          required:
          - title
          - url
          - published_on
          - recorded_on
          - method
          - limit
        minProperties: 1
      groups:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            id: *id005
            title: *id005
          required:
          - id
          - title
        minItems: 1
      roles:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            id: *id005
            group: *id005
            title: *id005
            mission: *id005
            basis_refs:
              type: array
              items: *id005
              minItems: 1
            funding: *id005
            observations:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  source_id: *id005
                  segment: *id005
                  measure:
                    enum:
                    - fourchette
                    - moyenne_declarative
                    - mediane
                  tax_status:
                    enum:
                    - HT
                    - non_retranscrit
                  purchase_mode:
                    enum:
                    - freelance_non_isole
                    - esn
                  price_date: *id006
                  areas:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        label: *id005
                        min: &id007
                          type: number
                          minimum: 0
                        max: *id007
                      required:
                      - label
                      - min
                      - max
                    minItems: 1
                  scope: *id005
                  locator:
                    type: string
                required:
                - source_id
                - segment
                - measure
                - tax_status
                - purchase_mode
                - price_date
                - areas
                - scope
                - locator
              minItems: 0
          required:
          - id
          - group
          - title
          - mission
          - basis_refs
          - funding
          - observations
        minItems: 1
      channels:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            id: *id005
            title: *id005
            description: *id005
            price: *id005
            source_ids:
              type: array
              items: *id005
              minItems: 1
          required:
          - id
          - title
          - description
          - price
          - source_ids
        minItems: 3
      engagements:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            title: *id005
            text: *id005
          required:
          - title
          - text
        minItems: 3
      portage:
        type: object
        additionalProperties: false
        properties:
          text: *id005
          source_ids:
            type: array
            items: *id005
            minItems: 1
        required:
        - text
        - source_ids
      regional_checks:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            title: *id005
            source_id: *id005
            areas:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  label: *id005
                  value: *id007
                  sample:
                    type: integer
                    minimum: 1
                required:
                - label
                - value
                - sample
              minItems: 1
          required:
          - title
          - source_id
          - areas
        minItems: 1
    required:
    - recorded_on
    - sources
    - groups
    - roles
    - channels
    - engagements
    - portage
    - regional_checks
