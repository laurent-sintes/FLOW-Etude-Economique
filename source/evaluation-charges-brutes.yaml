  supply-decisions-java-spring:
    finding: '**Les fonctions détaillées par scénarios sont adoptées. Le comptage remplace celui du périmètre précédent.**'
    oss: ERPNext fournit une sélection de traitements de réservation et disponibilité, sans picking physique, prix,
      taxes ni fabrication. Odoo fournit les calendriers de ressources. Les analogues Axelor d’optimisation et de
      coordination restent présents. Le scénario Tryton beaucoup plus petit ne démontre pas qu’il représente l’ensemble
      de ces mécanismes. Les colonnes complètes et la sélection retenue utilisent donc des tailles différentes.
    cosmic: Les mouvements de données des demandes et résultats métier distincts sont comptés dans la preuve adoptée.
