unit_analyses:
  process-management-java-spring:
    finding: '**2 060 JH retenus pour 11 livrables détaillés.**'
    oss: Les quatre scénarios utilisent le même studio Axelor, les mêmes formulaires Axelor et le même analogue
      analytique Odoo. Seule leur base de workflow et de supervision varie. Leur proximité provient donc surtout
      de ces hypothèses communes. La sélection retenue retire les composants de configuration déjà fournis avant
      d’appliquer la moitié du studio. Elle conserve la moitié du portail et des formulaires, ainsi que les trois
      quarts de l’analogue analytique. Ces fractions représentent du code à composer ou adapter, pas des charges
      observées dans ces projets.
    cosmic: Le comptage réunit 76 CFP d’exécution et de supervision conservés, 49 pour le studio, 44 pour les formulaires
      et tâches et 47 pour les analyses, soit 216 CFP. Il compte les échanges de données de 32 processus, sans mesurer
      directement l’effort d’un éditeur graphique, de sa validation ou de son ergonomie. Les essais Temporal, PM4JS
      et Superset étayent certains mécanismes sur données fictives. Ils ne mesurent pas le temps nécessaire au produit
      complet. Cette différence de mesure peut contribuer à l’écart, sans en démontrer le montant.
    decision: Le montant retenu est la somme des livrables présentés ci-dessous, avec analyse, conception, réalisation,
      QA, pilotage de l’équipe produit et mise en service. Les composants et fonctions partagés restent financés
      une seule fois.
    remaining: Confronter ces hypothèses de charge aux premières réalisations. Préciser les règles et interfaces
      propres au Groupe dans l’intégration, puis qualifier les volumes, temps de réponse et garanties de reprise.
  supply-workbenches-java-spring:
    finding: '**400 JH retenus pour 6 livrables détaillés.**'
    oss: Tryton apporte un calendrier étroit. Odoo comprend une surface visuelle beaucoup plus large. ERPNext et
      Axelor fournissent des analogues intermédiaires. Le choix Axelor utilise un composant visuel comme base de
      trois compositions, chacune évaluée à 0,8 composant, soit une fraction totale de 2,4. Il s’agit d’une hypothèse
      de taille pour planifier, comparer les décisions et suivre les prestations. Ce choix ne démontre pas que ces
      trois ateliers ont été réalisés dans Axelor.
    cosmic: Les cinq CFP historiques couvrent la sauvegarde d’une vue. Les trois compositions visuelles et leurs
      interactions sont désormais détaillées dans les livrables. Les calculs métier sont consommés dans leurs lots,
      sans nouveau financement.
    decision: Le montant retenu est la somme des livrables présentés ci-dessous, avec analyse, conception, réalisation,
      QA, pilotage de l’équipe produit et mise en service. Les composants et fonctions partagés restent financés
      une seule fois.
    remaining: Confronter ces hypothèses de charge aux premières réalisations. Préciser les règles et interfaces
      propres au Groupe dans l’intégration, puis qualifier les volumes, temps de réponse et garanties de reprise.
  master-data-java-spring:
    finding: '**L’édition de redressement est comprise dans les 1 600 JH.**'
    oss: Les quatre références documentent admission, consultation, édition, versions et reprise. Leurs fonctions
      d’édition servent aussi d’analogues au redressement des données. Leur portée ne correspond pas entièrement
      aux corrections autorisées dans FLOW. Le chiffrage détaillé finance ces corrections sans reprendre un PIM,
      un PLM ou un MDM collaboratif complet.
    cosmic: Les 420 CFP du calcul antérieur couvrent les processus de référence, contribution, publication et reprise.
      Ils n’ont pas été recomptés pour les neuf livrables adoptés. Les 210 JH d’édition corrective sont une hypothèse
      d’ingénierie comprise dans les 1 600 JH, avec réutilisation du versionnement, des contrôles et de l’audit.
    decision: Le montant retenu est la somme des livrables présentés ci-dessous, avec analyse, conception, réalisation,
      QA, pilotage de l’équipe produit et mise en service. Les composants et fonctions partagés restent financés
      une seule fois.
    remaining: Confronter ces hypothèses de charge aux premières réalisations. Préciser les règles et interfaces
      propres au Groupe dans l’intégration, puis qualifier les volumes, temps de réponse et garanties de reprise.
      Les corrections conservent motif, autorité, provenance et versions. La priorité entre une correction locale
      et une nouvelle contribution source doit être définie.
  stock-java-spring:
    finding: '**Axelor est proche d’ERPNext et de Tryton. Le résultat Odoo utilise un analogue plus large.**'
    oss: Le lot déduit le patrimoine Master Data puis finance les positions, mouvements, corrections et sept modules
      nouveaux. L’analogue Odoo des positions est plus large et augmente à la fois la base et les compléments calculés.
      Les trois autres scénarios sont plus proches. Cette différence ne démontre pas que le Stock FLOW nécessite
      toutes les responsabilités du composant Odoo.
    cosmic: Les 169 CFP décrivent les services cibles à la frontière du Stock. Leur valorisation à rendement constant
      ne mesure pas le bénéfice du patrimoine Master Data déjà financé. La réutilisation peut contribuer au montant
      COCOMO plus bas. Son effet sur le rendement n’est toutefois pas observé. La concurrence et la reprise ne sont
      pas appariées aux projets historiques.
    decision: Axelor est arrondi à la dizaine. Le montant inclut les adaptations Stock après déduction du patrimoine
      partagé et s’inscrit près des scénarios ERPNext et Tryton. Il est défendable pour cette architecture réutilisée,
      avec une réserve précise sur le rendement implicite plus favorable que le repère historique.
    remaining: 'Vérifier le financement des droits collectifs de stock : enveloppes par groupe, plafonds, consommation
      concurrente et restitution après annulation. Les réservations individuelles ne démontrent pas cette couverture.
      Éprouver aussi la filiation des coffrets et la distinction entre 120 pièces annoncées et 118 reçues. Vérifier
      les limites du composant Odoo, les responsabilités de Master Data effectivement disponibles et les garanties
      de concurrence sur les positions. Confronter les sept modules nouveaux à des travaux détaillés. Ne pas réduire
      la charge COSMIC par une remise de réutilisation non mesurée.'
  inventory-ownership-java-spring:
    finding: '**La révision multi-OSS remplace une analogie Axelor trop étroite pour plusieurs traitements.**'
    oss: Axelor reste utilisé pour les conditions. Odoo apporte les quantités et dimensions propriétaire. ERPNext
      sert aux actes, au registre et aux corrections. Tryton apporte le rapprochement. Cette sélection explique
      pourquoi le montant dépasse nettement le scénario tout Axelor. Les schémas et la structure des services restent
      Java. Les chaînes de Stock servent d’analogues, sans reconstruire le Stock ni la comptabilité.
    cosmic: Les 80 CFP couvrent neuf processus de propriété. Les lectures aux deux dates ne sont pas comptées comme
      deux copies des mêmes processus. Le rendement uniforme ne calibre pas la réutilisation de Master Data et Stock.
      À l’inverse, le registre temporel ne dispose pas d’un équivalent natif complet permettant de valider les fractions
      de code.
    decision: Le montant suit l’assemblage sélectionné, arrondi à la dizaine. Il est proche des scénarios ERPNext,
      Odoo et Tryton et du contrôle fonctionnel, plutôt que du scénario Axelor seul. Le choix est motivé par les
      traitements manquants dans l’analogie initiale, pas par une moyenne des quatre résultats.
    remaining: 'Éprouver les trois scénarios entre sociétés : livraison directe, fourniture de stock et retour partiel.
      Les changements de propriétaire doivent rester distincts du trajet physique et des résultats financiers. Rapprocher
      chaque contrôle des déclencheurs et registres déjà financés. Valider les règles de transfert, le journal et
      les lectures aux deux dates sur des exemples métier. Détailler les adaptations nouvelles et vérifier le rattachement
      aux services Master Data et Stock. Les fractions des chaînes de correction restent à éprouver.'
  supply-controls-java-spring:
    finding: '**Les fonctions détaillées par scénarios sont adoptées. Le comptage remplace celui du périmètre précédent.**'
    oss: Les règles de stock Odoo retenues initialement décrivent surtout les routes et l’approvisionnement. Le
      rescan retrouve des conditions, priorités et conflits dans Pricing Rule ERPNext, des contrôles de dates et
      de récursion dans les listes de prix Odoo, des règles typées Tryton et des règles configurables Axelor. Ces
      composants proviennent d’autres domaines métier. Ils ne démontrent pas la couverture des droits de ressources
      par marque et canal ni des incompatibilités entre politiques Supply. Leurs petites tailles ne justifient donc
      pas le coût d’un moteur complet.
    cosmic: Les mouvements de données des demandes et résultats métier distincts sont comptés dans la preuve adoptée.
      Les valeurs de marque, canal, société et type de prestation ne multiplient pas un même service. Le calcul
      utilise 20 h/CFP et 7 h/JH.
    decision: La charge retenue applique COSMIC au périmètre détaillé adopté. Elle inclut les rôles projet et les
      mécanismes propres au lot. Les composants partagés sont consommés sans nouvelle construction. Les colonnes
      OSS restent des références du périmètre antérieur, sans moyenne entre méthodes.
    remaining: Vérifier les critères d’acceptation des scénarios sur les livraisons, les contraintes réelles et
      les temps de réponse. Confronter les 20 h/CFP à un lot réalisé. Les règles, contrats et interfaces propres
      aux marques et SI du Groupe restent à préciser en intégration.
  orders-java-spring:
    finding: '**Les fonctions détaillées par scénarios sont adoptées. Le comptage remplace celui du périmètre précédent.**'
    oss: Le scénario Axelor utilise une base native et des compléments plus petits que les trois autres. Les tailles
      équivalentes sont documentées, mais cette différence de taille ne prouve pas à elle seule que les fonctions
      supplémentaires des autres suites sont inutiles. L’arbitrage conserve les commandes et leur filiation, sans
      acheter le périmètre d’un OMS complet.
    cosmic: Les mouvements de données des demandes et résultats métier distincts sont comptés dans la preuve adoptée.
