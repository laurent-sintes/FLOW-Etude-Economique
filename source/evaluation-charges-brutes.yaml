phases:
  acquisition:
    intro: '**Le produit à construire ou la solution à acquérir.** Les efforts Make sont présentés avant valorisation
      par les tarifs. Les travaux acheteur Buy restent séparés des offres d’intégration.'
    summaries:
      java-spring: '**Les fonctions détaillées par scénarios sont intégrées au chiffrage.** Le périmètre générique
        comprend politiques, droits collectifs, saisons opérationnelles, engagements entre sociétés et décisions
        sous contraintes. Les travaux propres au Groupe restent à rapprocher de l’intégration.'
      microsoft: Les travaux de sélection et de contractualisation sont dimensionnés côté acheteur. Le prix d’obtention
        du produit n’est pas isolé dans les pièces reçues.
      sap: Les travaux de sélection et de contractualisation sont dimensionnés côté acheteur. Le prix d’obtention
        du produit n’est pas isolé dans les pièces reçues.
  fonctionnement:
    intro: '**Une année de fonctionnement et les séquences tarifaires documentées.** Les charges humaines, les achats
      techniques et les contrats groupés sont distingués.'
    summaries:
      java-spring: L’année de référence couvre support, corrections, versions, exploitation et évolutions. Les achats
        techniques et le pilotage financé en euros sont présentés séparément.
      microsoft: L’abonnement regroupe les droits, le standard et le cloud. Le prix récurrent des adaptations reste
        non isolé. Le support initial ponctuel est présenté avec l’intégration.
      sap: Les prix distinguent l’abonnement progressif, le MCO des adaptations, les évolutions et la surveillance
        des flux. Leurs périodes et périmètres restent ceux des pièces reçues.
  integration:
    intro: '**Les travaux pour rendre le Core System opérationnel dans le Groupe.** Les charges Make et les forfaits
      Synvance conservent chacun leur périmètre.'
    summaries:
      java-spring: Le scénario central réunit les travaux communs, les déploiements sur les pôles du Groupe et le
        pilotage de l’intégration. Les provisions de coordination technique restent exprimées en euros.
      microsoft: Le prix d’intégration provient de la projection Groupe du COPIL. Le support et le conseil qualité
        initiaux sont ponctuels. Les compléments du modèle se lisent dans le dossier économique.
      sap: Les lots de la proposition donnent un prix d’intégration. Upgrade Finance est compris dans leur total.
        Les compléments du modèle se lisent dans le dossier économique.
