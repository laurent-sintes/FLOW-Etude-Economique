  service-fulfilment-java-spring:
    finding: '**Les fonctions détaillées par scénarios sont adoptées. Le comptage remplace celui du périmètre précédent.**'
    oss: Les scénarios complets transposent des chaînes natives plus larges. La sélection retient chez ERPNext les
      demandes, instructions et résultats d’assurance, transport et finance. Elle utilise une chaîne de correction
      Axelor pour le dossier douanier, plus représentative qu’une simple métadonnée. Les douze contrats de traitement
      marchandises et leur structure commune restent dans le calcul.
    cosmic: Les mouvements de données des demandes et résultats métier distincts sont comptés dans la preuve adoptée.
