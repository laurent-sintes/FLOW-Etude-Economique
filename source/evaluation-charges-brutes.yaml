  professional-it-java-spring:
    finding: '**540 JH retenus pour 8 livrables détaillés.**'
    oss: La référence retenue retire MFA, LDAP, Pac4j et les chargeurs déjà fournis avant d’appliquer les fractions
      de composants. Le scénario Axelor complet de la colonne n’applique pas encore ces mêmes retraits. Le montant
      sélectionné finance les consoles et adaptations restantes, avec des fractions de moitié pour l’administration,
      0,65 pour l’exploitation produit et 0,4 pour les services de données. La petite taille Tryton ne prouve pas
      une couverture équivalente.
    cosmic: Les 68 CFP viennent de l’administration et sécurité, des traitements nouveaux et des services de données
      nouveaux. Les purges, restaurations, migrations, audits et certains imports/exports sont déclarés déjà consommés
      dans les fonctions financées. Les consoles supplémentaires et les garanties techniques peuvent demander du
      travail sans créer autant de CFP nouveaux. Le comptage et le coût des adaptations ne sont donc pas entièrement
      comparables.
    decision: Le montant retenu est la somme des livrables présentés ci-dessous, avec analyse, conception, réalisation,
      QA, pilotage de l’équipe produit et mise en service. Les composants et fonctions partagés restent financés
      une seule fois.
    remaining: Confronter ces hypothèses de charge aux premières réalisations. Préciser les règles et interfaces
      propres au Groupe dans l’intégration, puis qualifier les volumes, temps de réponse et garanties de reprise.
