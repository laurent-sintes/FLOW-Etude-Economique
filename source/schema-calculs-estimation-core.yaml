type: object
properties:
  version:
    const: 1
  proofs:
    type: object
    minProperties: 1
    additionalProperties:
      type: object
      properties:
        sha256: &id001
          type: string
          pattern: ^[0-9a-f]{64}$
        kind:
          enum:
          - calculation_evidence
          - historical_code
        dependencies:
          type: array
          items:
            type: object
            properties:
              path: &id002
                type: string
                minLength: 1
              sha256: *id001
            required:
            - path
            - sha256
            additionalProperties: false
      required:
      - sha256
      - kind
      - dependencies
      additionalProperties: false
  mechanisms:
    type: array
    items:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
        stack:
          type: string
          minLength: 1
        funding_owner:
          type: string
          minLength: 1
        basis:
          oneOf:
          - type: object
            properties:
              kind:
                enum:
                - native_reuse
                - native_new
            required:
            - kind
            additionalProperties: false
          - type: object
            properties:
              kind:
                const: complement_family
              family: *id002
            required:
            - kind
            - family
            additionalProperties: false
        note:
          type: string
          minLength: 1
      required:
      - id
      - label
      - stack
      - funding_owner
      - basis
      - note
      additionalProperties: false
  calculations:
    type: array
    items:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        unit_id:
          type: string
          minLength: 1
        stack:
          type: string
          minLength: 1
        recipe:
          const: native_reuse_plus_complements_v1
        scope:
          type: object
          properties:
            level:
              type: string
              minLength: 1
            native_id:
              type: string
              minLength: 1
            capabilities:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                  native_id:
                    type: string
                    minLength: 1
                required:
                - id
                - native_id
                additionalProperties: false
            native_source:
              type: object
              properties:
                version:
                  type: number
                  minimum: 0
                source:
                  type: string
                  minLength: 1
                sha256:
                  type: string
                  minLength: 1
                domain_id:
                  type: string
                  minLength: 1
              required:
              - version
              - source
              - sha256
              - domain_id
              additionalProperties: false
            analysis_sha256: *id001
            decision_scope_sha256: *id001
          required:
          - level
          - native_id
          - capabilities
          - native_source
          - analysis_sha256
          - decision_scope_sha256
          additionalProperties: false
        inputs:
          type: object
          properties:
            baseline:
              type: string
              minLength: 1
            allocation:
              type: string
              minLength: 1
            native_inputs:
              type: string
              minLength: 1
            native_measures:
              type: string
              minLength: 1
            complement_inputs:
              type: string
              minLength: 1
            analogues:
              type: string
              minLength: 1
            refinements:
              type: string
              minLength: 1
            method_measures:
              type: string
              minLength: 1
            cosmic:
              type: string
              minLength: 1
            productivity:
              type: string
              minLength: 1
            productivity_source:
              type: string
              minLength: 1
            activities:
              type: string
              minLength: 1
            decision_evidence:
              type: string
              minLength: 1
          required:
          - baseline
          - allocation
          - native_inputs
          - native_measures
          - complement_inputs
          - analogues
          - refinements
          - method_measures
          - cosmic
          - productivity
          - productivity_source
          - activities
          - decision_evidence
          additionalProperties: false
        funding_claims:
          type: array
          items:
            type: object
            properties:
              mechanism:
                type: string
                minLength: 1
              mode:
                enum:
                - funded
                - consumed
            required:
            - mechanism
            - mode
            additionalProperties: false
        comparison:
          type: object
          properties:
            activity_status:
              enum:
              - conventional
              - unknown
            activity_note:
              type: string
              minLength: 1
            service_status:
              const: unverified
            service_note:
              type: string
              minLength: 1
            scope_rows:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                  label:
                    type: string
                    minLength: 1
                  classification:
                    enum:
                    - shared
                    - flow_specific
                    - native_excess
                    - unknown
                  cocomo:
                    type: string
                    minLength: 1
                  cosmic:
                    type: string
                    minLength: 1
                  evidence:
                    type: array
                    items:
                      type: string
                      minLength: 1
                  decision:
                    type: string
                    minLength: 1
                required:
                - id
                - label
                - classification
                - cocomo
                - cosmic
                - evidence
                - decision
                additionalProperties: false
          required:
          - activity_status
          - activity_note
          - service_status
          - service_note
          - scope_rows
          additionalProperties: false
        recipe_parameters:
          type: object
          properties:
            scenario:
              const: central
            structure_units_per_group:
              type: number
              minimum: 0
          required:
          - scenario
          - structure_units_per_group
          additionalProperties: false
      required:
      - id
      - unit_id
      - stack
      - recipe
      - scope
      - inputs
      - funding_claims
      - comparison
      - recipe_parameters
      additionalProperties: false
  consolidation:
    type: object
    properties:
      mode:
        type: string
        minLength: 1
      integrated_core_estimate:
        type: boolean
      schedule_aggregation:
        type: string
        minLength: 1
      note:
        type: string
        minLength: 1
    required:
    - mode
    - integrated_core_estimate
    - schedule_aggregation
    - note
    additionalProperties: false
required:
- version
- proofs
- mechanisms
- calculations
- consolidation
additionalProperties: false
