version: 1
id: core-product-functions
scope: construction_core
purposes:
- id: business-runtime
  label: Runtime et outils métier
  definition: 'Services d’exécution des capacités et outils destinés aux utilisateurs métier : studios, tâches,
    formulaires, analyse et pilotage métier. Les fonctions IT déjà mêlées aux unités retenues restent à ventiler.'
- id: it-complement
  label: Fonctions IT complémentaires
  definition: 'Administration et robustesse du produit : habilitations, configuration, traitements techniques, sécurité,
    journaux, purges, sauvegarde et exploitabilité. Elles n’ajoutent aucune capacité à la cartographie métier reçue.'
