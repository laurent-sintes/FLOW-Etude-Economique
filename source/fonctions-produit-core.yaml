reading:
  title: Distinguer Core Domain et Support
  intro: La classification porte sur la contribution des fonctions à la valeur du produit Flow. Des outils utilisés
    par le métier peuvent relever du Support. Le référentiel reçu reste intact.
  adopted: Charge adoptée
  business: '{{notion.core_domain}}'
  it: '{{notion.product_support}}'
  unallocated: Charge adoptée restant à ventiler
  unknown: Non déterminé
  no_estimate: Pas d’estimation adoptée
  jh_unit: JH
  allocation_note: Le classement est une hypothèse de positionnement du produit. Process Management relève du Support
    comme service générique de processus. Les ateliers de planification et de décision restent dans le Core Domain.
    Chaque JH, rôle et montant est compté une seule fois.
  missing_note: Le chiffrage professionnel est adopté et intégré aux calculs financiers. Les limites de périmètre
    et les hypothèses restent consultables ci-dessous.
  inventory_title: Fonctions professionnelles financées dans les lots retenus
  function_label: Fonction du produit
  purpose_label: Contribution au produit
  funding_label: Financement retenu
  proof_label: Références OSS observées
  scope_label: Travail et limite de couverture
  progress_label: Avancement de l’inventaire
  progress_note: Présence de code observée, distincte d’une couverture complète ou d’un chiffrage. Les 75 capacités
    hors Process Management n’ont pas été réauditées fonctionnellement lors de cet examen.
  count_label: familles de fonctions
  source_label: Voir le code de référence
  review_label: Couverture à vérifier
  unknown_additional: Financé dans les lots retenus ; pas de répartition d’effort par fonction élémentaire.
  process_reservation: Process Management comprend le runtime, les studios, le portail de tâches, le Process Mining
    et les tableaux de bord. L’écart avec COSMIC reste visible et non réconcilié.
  finance_title: 'Construction retenue : Core Domain et Support'
  finance_note: Répartition du coût total de construction de référence, avant son étalement par horizon. Les hypothèses
    personnelles de budget ne modifient pas les JH retenus.
  finance_detail: Rôles, délais et hypothèses
  classification_title: Critère de classement
  operating_review_title: 'Fonctionnement : adéquation du périmètre à vérifier'
  assurance_title: Périmètre chiffré et garanties vérifiées
  assurance_note: Les capacités rattachées à un chiffrage ne constituent pas une preuve de toutes les garanties
    de production. L’inventaire des fonctions et leur vérification fonctionnelle sont suivis séparément.
  assurance_review: Familles de fonctions dont la couverture reste à vérifier
  classification_basis: Motif du classement
classification:
  perspective: Produit Flow, et non organisation complète de Beaumanoir
  status: study_hypothesis
  criterion: Contribution à la valeur propre de Flow, indépendamment des rôles, des couches et des utilisateurs
    métier ou techniques.
  reference: https://www.domainlanguage.com/wp-content/uploads/2016/05/DDD_Reference_2015-03.pdf
  boundary: Le classement stratégique ne redéfinit ni les capacités reçues, ni les frontières d’intégration, ni
    les estimations adoptées. Il ne constitue pas encore un découpage de contextes DDD.
operating_scope_review:
  status: pending_scope_review
  reason: Les budgets d’intégration et de fonctionnement sont conservés. Leur adéquation au périmètre professionnel
    élargi reste à vérifier, notamment pour Temporal, le mining et les tableaux de bord. Ce point ouvert ne crée
    aucun budget supplémentaire.
  targets:
  - source/unites-maintenance.yaml
  - source/maintenance/maintenance-java-spring.yaml
  - source/calibration-couts.yaml
