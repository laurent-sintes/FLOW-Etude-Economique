  label: Services communs du Master Data
- id: families
  label: Adaptations aux familles de données
packages:
- id: OR01
  group: scm
  label: Admission des versions publiées
  jh: 90
  capability_refs:
  - master-data-ingestion
  deliverable: Contrats de réception et contrôles de format, version et provenance.
  acceptance: Une version invalide est rejetée avec un diagnostic traçable.
  estimate_kind: engineering_assumption
- id: OR02
  group: scm
  label: Conception et réalisation des vues opérationnelles
  jh: 60
  capability_refs:
  - master-data-ingestion
  deliverable: Concevoir les modèles de lecture, les correspondances avec les versions MDM et les règles d’actualisation,
    puis réaliser les vues de consultation des cinq familles documentaires existantes.
  acceptance: Les vues restituent la version reçue, sa provenance et sa validité. Elles ne permettent pas de corriger
    le référentiel maître. Leur conception et leur qualification sont incluses dans cette ligne.
  estimate_kind: engineering_assumption
- id: OR03
  group: scm
  label: Compatibilité et validité
  jh: 90
  capability_refs:
  - master-data-ingestion
  deliverable: Contrôle des dépendances, dates de validité et versions manquantes.
  acceptance: Les incompatibilités restent visibles et ne sont pas corrigées silencieusement.
  estimate_kind: engineering_assumption
- id: OR04
  group: scm
  label: Retours et reprise de réception
  jh: 70
  capability_refs:
  - master-data-ingestion
  deliverable: Accusés de réception, rejet et reprise technique après correction publiée.
  acceptance: Une reprise ne duplique pas les versions et ne clôt pas une anomalie métier.
  estimate_kind: engineering_assumption
- id: OR05
  group: scm
  label: Qualification des flux opérationnels
  jh: 90
  capability_refs:
  - master-data-ingestion
  deliverable: Scénarios de réception croisés avec les flux commerce, finance et conception.
  acceptance: Les trois provenances existantes et les erreurs de version sont qualifiées.
  estimate_kind: engineering_assumption
- id: MDM01
  group: common
  label: Règles et responsabilités
  jh: 140
  capability_refs:
  - cap-mdm-standards
  - cap-mdm-authority
  deliverable: Règles de données, périmètres et autorités configurables.
  acceptance: Une modification respecte les autorités déclarées et leur périmètre.
  estimate_kind: engineering_assumption
- id: MDM02
  group: common
  label: Contributions et ingestion
  jh: 180
  capability_refs:
  - cap-mdm-source-contribution
  - cap-mdm-ingestion
  deliverable: Contrats génériques de contribution et préparation des données entrantes.
  acceptance: Chaque contribution garde sa provenance et ses erreurs. Les connecteurs propres aux SI restent à dimensionner.
  estimate_kind: engineering_assumption
- id: MDM03
  group: common
  label: Identités et rapprochement
  jh: 180
  capability_refs:
  - cap-mdm-identity
  deliverable: Rapprochement, dédoublonnage, fusion et séparation des identités.
  acceptance: Une fusion ou séparation est explicable et conserve les références sources.
  estimate_kind: engineering_assumption
- id: MDM04
  group: common
  label: Consolidation et survivance
  jh: 200
  capability_refs:
  - cap-mdm-consolidation
  deliverable: Règles de normalisation, priorités de sources et consolidation des valeurs.
  acceptance: Une valeur consolidée est reliée à sa règle et à ses origines.
  estimate_kind: engineering_assumption
- id: MDM05
  group: common
  label: Mesure de qualité
  jh: 120
  capability_refs:
  - cap-mdm-quality-assessment
  deliverable: Profils de contrôle et anomalies qualifiées.
  acceptance: Une anomalie possède sa règle, son périmètre et son résultat vérifiable.
  estimate_kind: engineering_assumption
- id: MDM06
  group: common
  label: Remédiation et correction à la source
  jh: 150
  capability_refs:
  - cap-mdm-quality-remediation
  deliverable: Cycle de remédiation, demande à la source et vérification de correction.
  acceptance: Un accusé de réception ne clôt pas une anomalie. La correction est recontrôlée.
  estimate_kind: engineering_assumption
- id: MDM07
  group: common
  label: Enrichissement contrôlé
  jh: 100
  capability_refs:
  - cap-mdm-enrichment
  deliverable: Règles et contributions d’enrichissement avec provenance.
  acceptance: Les enrichissements conservent leurs droits et leurs justificatifs.
  estimate_kind: engineering_assumption
- id: MDM08
  group: common
  label: Changements et versions
  jh: 160
  capability_refs:
  - cap-mdm-change
  deliverable: Modifications autorisées, différences et historique versionné.
  acceptance: Une modification est auditée et ne modifie pas une version déjà certifiée.
  estimate_kind: engineering_assumption
- id: MDM09
  group: common
  label: Certification
  jh: 130
  capability_refs:
  - cap-mdm-certification
  deliverable: Certification d’une version pour un périmètre et une date d’effet.
  acceptance: Qualité, certification et entrée en vigueur restent des états distincts.
  estimate_kind: engineering_assumption
- id: MDM10
  group: common
  label: Publication et retrait
  jh: 140
  capability_refs:
  - cap-mdm-publication
  deliverable: Publication cohérente et retrait des références certifiées.
  acceptance: Seule une version autorisée est publiée. Son retrait est traçable.
  estimate_kind: engineering_assumption
- id: MDM11
  group: common
  label: Accès, abonnements et distribution
  jh: 150
  capability_refs:
  - cap-mdm-access-subscription
  - cap-mdm-distribution
  deliverable: Accès, souscription, distribution et reprise par destinataire.
  acceptance: Émis, reçu et rejeté restent distincts. La livraison ne prouve pas l’application métier.
  estimate_kind: engineering_assumption
- id: MDM12
  group: common
  label: Qualification transverse du MDM
  jh: 200
  capability_refs:
  - cap-mdm-quality-assessment
  deliverable: Qualification inter-familles, résilience et essais de performance.
  acceptance: Les scénarios transverses sont rejouables. Les cibles de volume et de service restent à préciser.
  estimate_kind: engineering_assumption
- id: MDM13
  group: common
  label: Traçabilité et protection des références
  jh: 90
  capability_refs:
  - cap-mdm-change
  deliverable: Lignage, contrôles de protection et scénarios de restauration.
  acceptance: Une référence restaurée conserve son origine. Les services techniques communs sont réutilisés.
  estimate_kind: engineering_assumption
- id: PF01
  group: families
  label: Clients et fournisseurs
  jh: 100
  capability_refs:
  - cap-mdm-customer
  - cap-mdm-supplier
  deliverable: Structures, règles et vues des tiers.
  acceptance: Les vues 360 citent les transactions sources sans en prendre la propriété.
  estimate_kind: engineering_assumption
- id: PF02
  group: families
  label: Accords approuvés
  jh: 60
  capability_refs:
  - cap-mdm-agreement
  deliverable: Références des accords et de leurs versions approuvées.
  acceptance: La négociation et l’approbation des contrats restent dans leur domaine métier.
  estimate_kind: engineering_assumption
- id: PF03
  group: families
  label: Produits, variantes et unités commerciales
  jh: 150
  capability_refs:
  - cap-mdm-product
  - cap-mdm-variant
  - cap-mdm-trade-item
  deliverable: Adaptation des structures, identifiants et variantes de produits.
  acceptance: La définition produit et les droits de contribution restent explicites.
  estimate_kind: engineering_assumption
- id: PF04
  group: families
  label: Catalogues, assortiments et prix
  jh: 90
  capability_refs:
  - cap-mdm-assortment
  - cap-mdm-catalog
  - cap-mdm-product-pricing
  deliverable: Références publiées des assortiments, catalogues et prix.
  acceptance: Les décisions d’offre et de prix restent chez leurs propriétaires métier.
  estimate_kind: engineering_assumption
- id: PF05
  group: families
  label: Réseau et fournitures internes
  jh: 80
  capability_refs:
  - cap-mdm-location-network
  - cap-mdm-internal-supplies
  deliverable: Références de lieux, réseaux et fournitures.
  acceptance: Les stocks physiques et capacités réelles ne deviennent pas des données maîtres.
  estimate_kind: engineering_assumption
- id: PF06
  group: families
  label: Services et tarifs
  jh: 70
  capability_refs:
  - cap-mdm-service-catalog
  - cap-mdm-service-pricing
  deliverable: Catalogue de services et tarifs approuvés.
  acceptance: Les règles de prestation et les transactions de service restent externes.
  estimate_kind: engineering_assumption
- id: PF07
  group: families
  label: Matériaux et spécifications d’emballage
  jh: 60
  capability_refs:
  - cap-mdm-packaging-material
  - cap-mdm-packaging-specification
  deliverable: Références et spécifications d’emballage.
  acceptance: Les opérations réelles d’emballage restent dans l’exécution logistique.
  estimate_kind: engineering_assumption
- id: PF08
  group: families
  label: Références partagées et configuration
  jh: 120
  capability_refs:
  - cap-mdm-codes-classification
  - cap-mdm-unit-conversion
  - cap-mdm-calendar
  - cap-mdm-shared-configuration
  deliverable: Codes, classifications, conversions, calendriers et valeurs partagées.
  acceptance: Les valeurs de configuration ne remplacent pas un moteur de décision métier.
  estimate_kind: engineering_assumption
assumptions:
- Hypothèses d’ingénierie par livrable pour le produit générique Java/Spring. Analyse, conception, développement,
  tests, QA et coordination sont compris dans chaque ligne.
- Les services communs du MDM sont construits une seule fois. Les adaptations de familles les consomment et ne refont
  pas les moteurs de qualité, de versions ou de distribution.
- Authentification, socle applicatif, stockage, automatisation de livraison et audit technique réutilisent les moyens
  déjà financés par les autres lots. Aucun nouveau rabais forfaitaire de réutilisation n’est appliqué.
- La valorisation transpose les proportions de rôles du lot retenu aux tarifs sources actuels. Cette hypothèse ne
  vaut ni équipe disponible ni plan de charge confirmé.
- Les comparaisons COCOMO II et COSMIC antérieures documentent l’ancien périmètre. Aucun nouveau comptage de taille
  ou étalonnage de productivité du domaine MDM élargi n’est établi.
