    financés dans le lot contrôles adopté. Master Data fournit références et versions.
  residual: Définir les valeurs et règles réelles des marques, puis recetter saisons parallèles et bascules avec
    engagements ouverts. Ne pas ajouter une seconde fois les fonctions génériques déjà chiffrées.
