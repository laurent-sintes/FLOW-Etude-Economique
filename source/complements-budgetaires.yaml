  product_actions:
    microsoft: K3 est déclaré dans la réponse. Faire lever la contradiction E110/G110 et relier les adaptations
      saisonnières aux provisions de réalisation déjà proposées.
    sap: Fashion déclare saisons et segmentation. Démontrer chevauchement, fenêtres et bascule dans la release proposée,
      puis confirmer droits et paramétrage.
    erpnext: Les variantes et groupes d’articles ne prouvent pas les saisons opérationnelles. Démontrer fenêtres
