      ne démontre pas une implémentation complète de la saison Fashion.
    remaining: Vérifier ce critère sur les fonctions génériques adoptées puis isoler les adaptations propres au
      Groupe, sans ajouter une seconde fois le service déjà financé.
  - id: G01-C2
