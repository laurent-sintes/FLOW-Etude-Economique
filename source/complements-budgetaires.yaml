reading:
  title: Écarts et compléments de budget
  intro: Tous les écarts identifiés sont rapprochés des financements existants. Les réserves de budget restent séparées
    des montants adoptés et des scénarios.
  progress: Écarts instruits
  progress_note: Instruction documentaire de tous les écarts identifiés. Ce décompte ne mesure ni la couverture
    fonctionnelle des ERP ni une recette achevée.
  open: Réserves non dimensionnées
  priced: Compléments chiffrés proposés
  total: Total des compléments
  unknown: Non déterminé
  none_priced: Aucun complément chiffrable sur les preuves disponibles
  amount_note: Un montant inconnu reste inconnu. Les réserves ne sont pas ajoutées aux simulations. Une enveloppe
    existante ne prouve pas qu’elle est suffisante.
  funding: Déjà financé
  residual: Ce qui reste à établir
  open_case: Lire le rapprochement et les réserves
  back: Revenir à tous les écarts
  criteria: Besoin, financement et preuve manquante
  criterion: Critère
  observation: Constat et financement
  remaining: Preuve ou comportement restant
  baselines: Périmètres chiffrés rapprochés
  baseline_note: Repères de périmètre, non additionnables entre écarts. Chaque lot est financé une seule fois. Les
    ventilations par famille sont internes au lot.
  jh: JH
  cfp: CFP
  family: Familles rapprochées
  schemas: Structures déjà prévues
  source: Preuves et sources
  checks: Recette à effectuer
  checks_note: Procédures proposées, non exécutées dans les ERP pendant cet audit.
  products: Conséquences par solution
  budget: Réserves de budget identifiées dans le modèle
  budget_note: Une même réserve peut concerner plusieurs écarts. Son identifiant est unique. Elle ne constitue pas
    une décision d’adoption.
  id: Identifiant
  option: Option
  phase: Phase
  status: Statut
  amount: Complément
  proof: Pour pouvoir chiffrer
  excluded: À ne pas recompter
  integration: Travaux Groupe déjà prévus
  maintenance: Activités annuelles à rapprocher
  experiment_link: Consulter les 18 essais expérimentaux et la trace détaillée G02
  study_limit: Les neuf écarts identifiés sont instruits. Les garanties réelles, les règles métier non approuvées
    et les inclusions contractuelles restent ouvertes. Aucun supplément chiffré défendable ne ressort de cette revue.
