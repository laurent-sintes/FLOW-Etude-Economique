version: 1
id: mdm-cosmic-2026-11-06
work_unit_ref: core/master-data-java-spring
status: comparison
counting_basis: Hypothèses de processus explicites dérivées du périmètre MDM et des postes de construction. Aucun
  comptage déduit des JH.
boundary: Produit MDM générique, studio et plugins compris. Les systèmes contributeurs et consommateurs sont extérieurs.
  Les processus génériques de Case Management et les vues Operational References sont financés ailleurs.
family_rule: Les processus communs sont comptés une fois. Chaque famille ajoute ses groupes de données distincts
  pour la maintenance de ses objets. Pas de multiplication du moteur, de la certification ou de la distribution
  par famille. Les noms et attributs supplémentaires ne créent pas de mouvements.
activity_scope: La conversion couvre les activités projet de la référence de productivité. Aucun supplément QA ou
  coordination n’est ajouté. Le comptage mesure les échanges fonctionnels, pas la complexité ergonomique du studio
  ni les garanties de performance.
benchmark_ref: audits/2026-10-30-master-data-decomposition-gap/benchmark-decision.json
day_hours: 7
proof_refs:
- source/revision-master-data.yaml
- audits/2026-11-05-estimation-mdm-oss/scope.json
- audits/2026-11-05-mdm-studio-plugins/engineering.json
- audits/2026-11-05-affinage-unidata/selection.json
- audits/2026-11-06-justifications-et-cosmic-mdm.md
