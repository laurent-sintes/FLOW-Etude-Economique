version: 1
id: generic-work-units
labels:
  reading: Lectures des unités de travail
  search: Rechercher un travail
  search_placeholder: Travail, capacité ou nature
  all_phases: Toutes les étapes
  no_results: Aucune unité dans cette sélection.
  select_help: Sélectionner un travail pour lire son périmètre, ses contributions et les mesures retenues.
  rate_unit: € HT / JH
  retained_scope: Le catalogue chiffré reprend la référence Java/Spring. Les livrables d’intégration restent à dimensionner.
    Les contrats Microsoft et SAP conservent leurs enveloppes sans ventilation fictive.
  title: Unités de travail et contributions
  intro: Une unité décrit un travail à réaliser, son résultat attendu, sa période et ses mesures retenues. Les capacités
    décrivent son périmètre métier. Les contributions attribuent les travaux aux équipes.
  scope_title: Périmètre métier et contributions
  scope_note: Le périmètre durable est une proposition d’organisation. Il décrit les capacités gérées ou desservies.
    Il ne répartit aucun budget.
  direct: Périmètre direct proposé
  indirect: Périmètre desservi indirectement
  units: Unités de travail
  unit: Unité de travail
  nature: Nature du travail
  phase: Étape
  capabilities: Capacités métier liées
  scope_pending: Rattachement métier à établir
  contributions: Contributions retenues
  candidates: Équipes candidates
  unallocated: Non ventilé
  governance: Gouvernance
  jh: JH
  cost: k€ HT
  unknown: À établir
  no_measure: Détail à dimensionner
  initial: Sur la phase
  annual: Base annuelle
  details: Consulter le travail
  records: Mesures sources
  roles: Rôles retenus
  result: Résultat attendu
  boundary: Frontière de financement
  acceptance: Critères de recette
  parent: Unité parente
  source: Source
  basis: Justification
  no_units: Aucun travail attribué à cette équipe. Son périmètre proposé reste distinct des affectations.
  candidate_note: Les équipes candidates et les liens aux capacités ne reçoivent aucune charge par défaut.
  abaque_title: Abaque générale de ventilation
  abaque_intro: Une clé spécifique à l’unité et au rôle prime sur la clé de l’unité, puis sur la responsabilité
    source. Les JH d’un rôle conservent son tarif. Les frais utilisent une clé distincte. Toute part restante demeure
    non ventilée.
  rule: Règle
  condition: Application
  share: Part
  overrides: Clés spécifiques documentées
  no_overrides: Aucune répartition partagée n’est encore retenue. Les responsabilités connues restent intégrales.
    Les autres travaux restent non ventilés.
  retained: Chiffrage retenu conservé
  measurement_note: Les JH et les coûts proviennent de mesures complémentaires. Un montant n’est pas converti en
    JH. Les détails d’intégration ne reprennent pas les budgets de leurs parents.
  pending_integration: Charges d’intégration à réévaluer
  team: Équipe
  all_teams: Toutes les unités
  activity_type: Pilotage Build / Run
  scope_proposed: Périmètre proposé
  rule_refs: Clés appliquées
  unknown_measures: Les valeurs connues sont affichées. Les mesures absentes restent à établir.
  nature_labels:
