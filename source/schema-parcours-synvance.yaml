$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required: [version, titre, conclusion, dependances, affichage, pieces, etapes, points_cadrage, suite]
properties:
  version: {const: 1}
  titre: {$ref: '#/$defs/texte'}
  conclusion: {$ref: '#/$defs/texte'}
  dependances: {$ref: '#/$defs/liste'}
  affichage:
    type: object
    required: [parcours, preuves, consequence]
    additionalProperties: {type: string, minLength: 1}
  pieces:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, titre, auteur, path, localisation, objet]
      properties:
        id: {$ref: '#/$defs/texte'}
        titre: {$ref: '#/$defs/texte'}
        auteur: {$ref: '#/$defs/texte'}
        path: {$ref: '#/$defs/texte'}
        localisation: {$ref: '#/$defs/texte'}
        objet: {$ref: '#/$defs/texte'}
  etapes:
    type: array
    minItems: 6
    maxItems: 6
    items:
      type: object
      additionalProperties: false
      required: [id, titre, question, reponse, comparaison, afficher_comparaison, consequence, widget, preuves, notions, mots_cles]
      properties:
        id: {$ref: '#/$defs/texte'}
        titre: {$ref: '#/$defs/texte'}
        question: {$ref: '#/$defs/texte'}
        reponse: {$ref: '#/$defs/texte'}
        comparaison:
          type: object
          additionalProperties: false
          required: [microsoft, sap]
          properties:
            microsoft: {$ref: '#/$defs/texte'}
            sap: {$ref: '#/$defs/texte'}
        afficher_comparaison: {type: boolean}
        consequence: {$ref: '#/$defs/texte'}
        widget: {enum: [aucun, prix, passage, cadrage, conclusion]}
        preuves: {$ref: '#/$defs/liste'}
        notions: {$ref: '#/$defs/liste'}
        mots_cles: {$ref: '#/$defs/liste'}
  points_cadrage:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [sujet, effet, attendu, interlocuteur]
      properties:
        sujet: {$ref: '#/$defs/texte'}
        effet: {$ref: '#/$defs/texte'}
        attendu: {$ref: '#/$defs/texte'}
        interlocuteur: {$ref: '#/$defs/texte'}
  suite:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [route, titre]
      properties:
        route: {$ref: '#/$defs/texte'}
        titre: {$ref: '#/$defs/texte'}
$defs:
  texte: {type: string, minLength: 1}
  liste:
    type: array
    minItems: 1
    uniqueItems: true
    items: {$ref: '#/$defs/texte'}
