$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required:
- version
- id
- date
- reading
- reviews
- additions
properties:
  version:
    const: 1
  id:
    const: complements-budgetaires-flow
  date:
    type: string
    format: date
  reading:
    type: object
    additionalProperties: false
    required:
    - title
    - intro
    - progress
    - progress_note
    - open
    - priced
    - total
    - unknown
    - none_priced
    - amount_note
    - funding
    - residual
    - open_case
    - back
    - criteria
    - criterion
    - observation
    - remaining
    - baselines
    - baseline_note
    - jh
    - cfp
    - family
    - schemas
    - source
    - checks
    - checks_note
    - products
    - budget
    - budget_note
    - id
    - option
    - phase
    - status
    - amount
    - proof
    - excluded
    - integration
    - maintenance
    - experiment_link
    - study_limit
    - phases
    - statuses
    - register_open
    - existing_count
    properties:
      title: &id001
        type: string
        minLength: 1
      intro: *id001
      progress: *id001
      progress_note: *id001
      open: *id001
      priced: *id001
      total: *id001
      unknown: *id001
      none_priced: *id001
      amount_note: *id001
      funding: *id001
      residual: *id001
      open_case: *id001
      back: *id001
      criteria: *id001
      criterion: *id001
      observation: *id001
      remaining: *id001
      baselines: *id001
      baseline_note: *id001
      jh: *id001
      cfp: *id001
      family: *id001
      schemas: *id001
      source: *id001
      checks: *id001
      checks_note: *id001
      products: *id001
      budget: *id001
      budget_note: *id001
      id: *id001
      option: *id001
      phase: *id001
      status: *id001
      amount: *id001
      proof: *id001
      excluded: *id001
      integration: *id001
      maintenance: *id001
      experiment_link: *id001
      study_limit: *id001
      phases:
        type: object
        additionalProperties: false
        required:
        - obtain_core
        - integrate_deploy
        - operate_evolve
        properties:
          obtain_core: *id001
          integrate_deploy: *id001
          operate_evolve: *id001
      statuses:
        type: object
        additionalProperties: false
        required:
        - dimensionnement_a_requalifier
        - base_a_reestimer
        - inclusion_a_confirmer
        - besoin_conditionnel
        properties:
          dimensionnement_a_requalifier: *id001
          base_a_reestimer: *id001
          inclusion_a_confirmer: *id001
          besoin_conditionnel: *id001
      register_open:
        type: string
        minLength: 1
      existing_count:
        type: string
        minLength: 1
  reviews:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - gap_ref
      - conclusion
      - already_funded
      - residual
      - criteria
      - baseline_refs
      - integration_activity_refs
      - maintenance_activity_refs
      - evidence_refs
      - acceptance_checks
      - product_actions
      - status
      - addition_refs
      - non_budget_treatments
      properties:
        gap_ref: *id001
        conclusion: *id001
        already_funded: *id001
        residual: *id001
        criteria:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - title
            - need_refs
            - mechanism_refs
            - observation
            - remaining
            properties:
              id: *id001
              title: *id001
              need_refs:
                type: array
                items: *id001
                uniqueItems: true
                minItems: 1
              mechanism_refs:
                type: array
                items: *id001
                uniqueItems: true
                minItems: 1
              observation: *id001
              remaining: *id001
          uniqueItems: true
          minItems: 1
        baseline_refs:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - calculation_ref
            - family_refs
            properties:
              calculation_ref: *id001
              family_refs:
                type: array
                items: *id001
                uniqueItems: true
          uniqueItems: true
          minItems: 1
        integration_activity_refs:
          type: array
          items: *id001
          uniqueItems: true
          minItems: 1
        maintenance_activity_refs:
          type: array
          items: *id001
          uniqueItems: true
          minItems: 1
        evidence_refs:
          type: array
          items: *id001
          uniqueItems: true
          minItems: 1
        acceptance_checks:
          type: array
          items: *id001
          uniqueItems: true
          minItems: 1
        product_actions:
          type: object
          additionalProperties: *id001
          minProperties: 1
        status:
          const: instruction_documentaire_complete_preuves_ouvertes
        addition_refs:
          type: array
          items: *id001
          uniqueItems: true
          minItems: 1
        non_budget_treatments:
          type: array
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required:
            - stack
            - phase_ref
            - reason
            properties:
              stack:
                type: string
                minLength: 1
              phase_ref:
                type: string
                minLength: 1
              reason:
                type: string
                minLength: 1
    uniqueItems: true
    minItems: 1
  additions:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - id
      - stack
      - phase_ref
      - gap_refs
      - title
      - status
      - residual_scope
      - excluded_scope
      - proof_to_price
      - estimate_ref
      - net_extra_jh
      - net_extra_initial_eur_ht
      - net_extra_annual_eur_ht
      - work_package_ref
      - existing_funding_refs
      properties:
        id: *id001
        stack: *id001
        phase_ref: *id001
        gap_refs:
          type: array
          items: *id001
          uniqueItems: true
          minItems: 1
        title: *id001
        status:
          enum:
          - dimensionnement_a_requalifier
          - base_a_reestimer
          - inclusion_a_confirmer
          - besoin_conditionnel
        residual_scope: *id001
        excluded_scope: *id001
        proof_to_price: *id001
        estimate_ref:
          const: null
        net_extra_jh:
          const: null
        net_extra_initial_eur_ht:
          const: null
        net_extra_annual_eur_ht:
          const: null
        work_package_ref: *id001
        existing_funding_refs:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required:
            - source_ref
            - keys
            - label
            properties:
              source_ref:
                type: string
                pattern: ^source/[^#]+\.yaml$
              keys:
                type: array
                items:
                  type: string
                  minLength: 1
              label:
                type: string
                minLength: 1
    uniqueItems: true
    minItems: 1
