schema_version: 1
id: levers-calculation
principle:
  title: Comprendre ce qui fait varier une estimation
  text: '**Une hypothèse agit à une étape précise du calcul.** Distinguer la préparation des tailles, la décision
    retenue et les paramètres proposés dans Simuler permet d’interpréter les scénarios.'
notice:
  title: Des hypothèses adaptables et des contrôles constants
  text: Chaque variable conserve unité, périmètre, origine et justification. Les financements partagés, les activités
    couvertes et les montants répartis restent contrôlés.
navigation_label: Les sept familles de leviers
sections:
- id: perimetre
  title: Définir le périmètre des travaux
  lead: '**Les options se comparent sur un besoin identifié.** La cartographie métier et les pièces Synvance fournissent
    des entrants complémentaires pour décrire les fonctions attendues, les inclusions et les écarts à examiner.'
  blocks:
  - kind: table
    caption: Trois niveaux de variation
    columns:
    - Niveau
    - Variables et effet
    rows:
    - - Calcul d’estimation
      - Parts d’attribution, fractions d’analogie, réutilisation, coefficients COCOMO et productivité ISBSG. Une
        révision exige un calcul documenté et ses contrôles.
    - - Décision retenue
      - Référence choisie, arrondis et répartition des rôles. Une adoption explicite détermine les JH financés.
    - - Scénario personnel
      - Budgets, durées et services exposés dans Simuler. Modifier un budget personnel ne recalcule pas les tailles,
        hypothèses ou JH de la décision d’origine.
  - kind: table
    caption: Ce que le périmètre détermine
    columns:
    - Levier
    - Unité et effet
    - Justification attendue
    rows:
    - - Capacités et fonctions
      - 'Périmètre métier : délimite les travaux et exclusions.'
      - Identifiants natifs, fonctions attendues et frontières.
    - - Patrimoine logiciel réutilisable
      - 'Travaux résiduels : réduit ou transforme ce qui reste à réaliser.'
      - Composants utilisables, adaptations, licences et financement partagé.
    - - Inclusions contractuelles
      - 'Prestations ou droits : détermine les compléments à financer.'
      - Édition, offre, périmètre et conditions documentés.
  - kind: links
    items:
    - href: '#complexite'
      label: Relier le périmètre aux travaux — {{vue.methode_core_system}}
- id: activites
  title: Dimensionner les activités
  lead: '**Un volume n’est utile que si son lien avec le travail est expliqué.** Distinguer la charge d’un lot des
    activités qui se répètent selon une fréquence ou un nombre d’unités.'
  blocks:
  - kind: bullets
    items:
    - '**Charges de réalisation en JH** : travaux, qualité attendue, inclusions et bornes d’estimation.'
    - '**Volumes et fréquences** : utilisateurs, interventions, échanges ou déploiements, avec leur période et leur
      origine.'
    - '**Efforts unitaires en JH par unité** : contenu d’une intervention et tâches déjà couvertes ailleurs.'
    - '**Composition des profils en %** : répartition d’un effort existant entre les rôles, sans créer de journées
      supplémentaires.'
  - kind: paragraphs
    items:
    - Une activité ne reçoit pas deux fois l’effet d’un volume déjà intégré à sa charge. Les parts de profils totalisent
      100 %.
  - kind: links
    items:
    - href: '#calcul-run'
      label: Relier volumes et services — {{vue.calcul_run}}
- id: travail
  title: Traiter les gains et valoriser le travail
  lead: '**Le taux de réduction de l’effort et le tarif journalier ont des effets distincts.** Le premier modifie
    les JH éligibles ; le second valorise les journées conservées.'
  blocks:
  - kind: bullets
    items:
    - '**Réduction d’effort en %** : assiette et justification pour les activités éligibles. Les familles Core System
      retenues conservent leurs JH adoptés, sans remise IA globale ; la réutilisation déjà intégrée n’est pas déduite
      à nouveau.'
    - '**Tarifs en € HT / JH** : profil, expérience, marché, régime d’achat, date et prestations incluses comparables.'
    - '**Outillage en € HT / JH** : supplément appliqué seulement aux prestations concernées, avec ses exclusions.'
    - '**Coordination et pilotage** : missions distinctes, dimensionnées en JH ou provisionnées en euros sur une
      assiette explicite. Un taux budgétaire ne devient pas une charge humaine.'
  - kind: links
    items:
    - href: '#calcul-net'
      label: Consulter les formules — {{vue.calcul_net}}
- id: moyens
  title: Financer les moyens et les contrats
  lead: '**Chaque achat conserve son unité et son périmètre.** Les ressources consommées, abonnements, prestations
    et forfaits suivent leurs propres règles de prix.'
  blocks:
  - kind: bullets
    items:
    - '**Consommations** : volume facturable, capacité, seuils, minimums et prix unitaire.'
    - '**Enveloppes** : provision déclarée quand le dimensionnement détaillé reste à établir, avec périmètre et
      justification.'
    - '**Offres et contrats** : montant, devise, taxes, période, inclusions, exclusions et séquence de prix.'
    - '**Services inclus** : financement identifié dans un autre poste. Une composante inconnue ne vaut ni zéro
      ni supplément automatique.'
  - kind: paragraphs
    items:
    - Les prix reçus via Synvance restent attachés à leurs offres. Leur analyse détermine les écarts et compléments
      à justifier dans le dossier économique.
- id: temps
  title: Positionner et indexer les dépenses
  lead: '**Une même dépense produit une trajectoire différente selon sa date et sa durée.** Le calendrier relie
    consommations, livraisons, réceptions et service complet.'
  blocks:
  - kind: table
    caption: Variables temporelles et monétaires
    columns:
    - Variable
    - Ce qu’elle détermine
    rows:
    - - Dates et durées en mois
      - Ouverture, déploiement, stabilisation et début du service, selon les responsabilités.
    - - Parts de service
      - Périmètre progressivement desservi et consommation pendant la transition.
    - - Date et unité du prix
      - Valeur d’origine, monnaie et période financée ; distinction entre euros courants et constants.
    - - Indexation annuelle en %
      - Évolution d’une catégorie de prix après les périodes documentées, selon la convention retenue.
    - - Horizon de comparaison
      - Dépenses comprises dans la fenêtre étudiée, services effectivement disponibles et reste à financer.
  - kind: paragraphs
    items:
    - Les conventions de proratisation et d’arrondi conservent les montants. Les financements transitoires et annuels
      se relaient sans chevauchement. Une normalisation de référence marché reste distincte de l’indexation future
      du budget.
- id: scenarios
  title: Construire des scénarios interprétables
  lead: '**Un scénario est un ensemble explicite d’hypothèses.** Ses écarts doivent pouvoir être reliés au périmètre,
    aux charges, aux gains, aux prix ou au calendrier.'
  blocks:
  - kind: bullets
    items:
    - '**Bornes et sensibilités** : déclarer les variables modifiées et les dépendances communes. Une enveloppe
      basse et haute n’est pas une distribution statistique.'
    - '**Comparaison cohérente** : conserver les unités, le besoin comparé et la même convention temporelle, en
      rendant visibles les différences de service disponible.'
    - '**Lecture Build / Run** : classer les dépenses déjà calculées. Une clé de répartition ne crée aucun budget
      et ses parts reconstituent 100 % du poste.'
    - '**Incertitude** : distinguer donnée inconnue, hypothèse proposée, observation et estimation revue. Ne pas
      attribuer de probabilité sans méthode et preuves adaptées.'
- id: justification
  title: Justifier puis faire varier les hypothèses
  lead: '**Une hypothèse reste discutable même lorsque le calcul est exact.** Sa recevabilité dépend des preuves,
    des ajustements et de la revue de son périmètre.'
  blocks:
  - kind: bullets
    items:
    - Pour chaque valeur, conserver **origine, date, unité, périmètre, statut et justification**. Si une référence
      porte sur un autre périmètre, sa transposition doit être justifiée avant de soutenir une estimation FLOW.
    - Les contrôles vérifient cohérence et traçabilité. La confrontation aux réalisations permet ensuite de réexaminer
      les hypothèses et leur calibration.
    - Le dossier économique distingue **hypothèses communes retenues et scénarios personnels**. Seuls les leviers
      réellement proposés dans Simuler y sont modifiables directement ; les autres restent des paramètres du modèle.
  - kind: links
    items:
    - href: '#parametres'
      label: Voir l’application à FLOW — {{vue.parametres_modele}}
examples: []
