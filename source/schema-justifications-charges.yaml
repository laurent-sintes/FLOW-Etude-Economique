type: object
additionalProperties: false
required:
- version
- scope
- units
properties:
  version:
    const: 1
  scope:
    const: construction_core
  units:
    type: object
    minProperties: 1
    additionalProperties:
      type: object
      additionalProperties: false
      properties:
        summary: &id001
          type: string
          minLength: 1
        choice: *id001
        reuse: *id001
        exclusions: *id001
        calculation: *id001
        natures:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum:
            - business
            - it
        proof_refs:
          type: array
          minItems: 1
          uniqueItems: true
          items: *id001
      required:
      - summary
      - choice
      - reuse
      - exclusions
      - calculation
      - natures
      - proof_refs
