  id: master-data-java-spring
  includes:
  - Règles de données, périmètres et autorités configurables.
  - Contrats génériques de contribution et préparation des données entrantes.
  - Rapprochement, dédoublonnage, fusion et séparation des identités.
  - Règles de normalisation, priorités de sources et consolidation des valeurs.
  - Profils de contrôle et anomalies qualifiées.
  - Cycle de remédiation, demande à la source et vérification de correction.
  - Règles et contributions d’enrichissement avec provenance.
  - Modifications autorisées, différences et historique versionné.
  - Certification d’une version pour un périmètre et une date d’effet.
  - Publication cohérente et retrait des références certifiées.
  - Accès, souscription, distribution et reprise par destinataire.
  - Qualification inter-familles, résilience et essais de performance.
  - Lignage, contrôles de protection et scénarios de restauration.
  - Structures, règles et vues des tiers.
  - Références des accords et de leurs versions approuvées.
  - Adaptation des structures, identifiants et variantes de produits.
  - Références publiées des assortiments, catalogues et prix.
  - Références de lieux, réseaux et fournitures.
  - Catalogue de services et tarifs approuvés.
  - Références et spécifications d’emballage.
  - Codes, classifications, conversions, calendriers et valeurs partagées.
  - Redressement des fiches et des lots, aperçu avant application, suivi des anomalies et recontrôle.
  - Configuration, prévisualisation et activation des règles de qualité et d’enrichissement dans les périmètres
    autorisés.
  - Studio de schéma pour créer et modifier familles, champs et relations, analyser les impacts et activer les évolutions
    compatibles.
  - Dépôt, approbation, activation et exécution isolée de plugins JAR versionnés dans les règles de qualité et d’enrichissement.
  label: Master Data Java/Spring
  method: Estimation détaillée par livrable
  months: 23
