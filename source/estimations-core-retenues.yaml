- assumptions:
  - effect: 'Sensibilité isolée calculée : environ −106 / +111 JH autour des 339,02 JH non arrondis. Ni marge ni
      intervalle de confiance.'
    hypothesis: La taille Stock est attribuée aux composants natifs mêlés à des fonctions hors périmètre, avec plancher
      déjà mesuré et déduction du patrimoine Master Data.
    id: source-attribution
    trigger: Une part de code mixte sensiblement différente est nécessaire.
  - effect: 'Variation conjointe des fractions des sept modules : environ −52 / +84 JH, sans modifier les schémas
      ni cumuler d’autres sensibilités.'
    hypothesis: Les sept compléments Flow restent aux fractions explicites des chaînes et composants natifs ; 17
      structures et 124 champs nouveaux ou étendus.
    id: flow-modules
    trigger: Protocoles, contributions ou règles de commande plus riches que les analogies retenues.
  - effect: Estimation à rouvrir. Les mécanismes communs gardent leur propriétaire Master Data ; aucun coût forfaitaire
      de framework ajouté au Stock.
    hypothesis: Persistance, transactions, verrouillage optimiste, sécurité, métadonnées, composants UI, admission
      générique et livraison disponibles via le patrimoine Master Data et des composants Spring équivalents. Aucun
      coût de reconstruction Axelor à financer ; travail spécifique Stock inclus. Une UI entièrement sur mesure,
      une réécriture du socle ou des garanties supérieures exigeraient une révision.
    id: reuse
    trigger: Patrimoine Master Data indisponible ou reconstruction d’un service générique.
  - effect: 'Sensibilité du poids du déclaratif : environ −49 / +99 JH. Un parcours ajouté modifie le périmètre
      et demande une nouvelle estimation.'
    hypothesis: Composants de consultation, formulaires et administration réutilisables, sans interface WMS sur
      mesure.
    id: ui
    trigger: Poids des modèles et vues différent ou interface métier plus riche.
  - effect: Effet non chiffré. Les objectifs Master Data ne démontrent pas les garanties du Stock ; revoir architecture
      et qualification avant engagement.
    hypothesis: Une base transactionnelle et un module Stock ; protection et reprise communes réutilisées, rapprochements
      Stock spécifiques inclus.
    id: architecture
    trigger: Réservation distribuée, plusieurs régions actives ou engagement de débit, latence ou reprise plus exigeant.
  - effect: 'Sensibilité isolée de capacité : environ −58 / +88 JH. Le délai dépend aussi des dépendances et de
      l’affectation réelle des rôles.'
    hypothesis: Équipe nominale maîtrisant Java/Spring et le patrimoine réutilisé, décision métier et experts disponibles.
    id: team
    trigger: Compétences ou disponibilité inférieures à l’hypothèse.
  - effect: Le contrôle reste à 482,86 JH, environ 42 % au-dessus de Java. Écart non réconcilié ; pas de moyenne
      ni correction pour forcer l’accord.
    hypothesis: COCOMO II reste la référence ; le contrôle COSMIC × ISBSG conserve 169 CFP et 20 h/CFP.
    id: comparison
    trigger: Nouvelles mesures de taille, de comptage ou référence de productivité applicable.
