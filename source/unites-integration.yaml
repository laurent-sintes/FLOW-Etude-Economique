version: 1
id: integration-work-units
labels:
  title: Rapprochement des travaux et des chiffrages existants
  intro: Chaque ligne relie le besoin commun aux enveloppes Make et aux postes des offres Synvance. Un travail chiffré
    dans une enveloppe ne possède pas nécessairement un prix individuel. Les points ouverts précisent le périmètre
    ou la responsabilité à confirmer avant tout supplément.
  quantity: Quantité à établir
  unknown: À dimensionner
  delivery: Livrable attendu
  acceptance: Critères de recette
  drivers: Facteurs de difficulté
  boundary: Frontière de financement
  counting: Règle de comptage
  options: Traitement et financement par option
  effort: Charge détaillée de cette ligne
  formula: Charge par rôle = préparation fixe + quantité × charge unitaire. Cette proposition ne s’ajoute pas automatiquement
    aux budgets.
  funding: Enveloppes et postes de référence
  basis: Justification du dimensionnement
  sources: Sources et cas métier
  no_allocation: Les forfaits ne sont pas ventilés entre les lignes tant que cette répartition n’est pas documentée.
  option_names:
    java-spring: Make · Java/Spring
    microsoft: Microsoft · Avanade
    sap: SAP · Delaware
  covered: Déjà chiffré
  remaining: Ce qui reste à établir ou à estimer
  matrix: Couverture de la grille commune
  work: Travail commun
  evidence_packages: Postes rapprochés
  shared: Enveloppe partagée avec plusieurs lignes. Ne pas additionner ses renvois.
  observations: Détail des postes utilisés pour le rapprochement
  observation_note: Les postes du pilote Microsoft ne ventilent pas la projection Groupe. Chez SAP, les vues par
    domaine, phase et type de développement se recoupent. Elles détaillent les mêmes lots et ne s’additionnent pas.
  status_labels:
    inclus_documente: Chiffré dans une enveloppe
    partiel: Périmètre partiellement rapproché
    a_rapprocher: Inclusion à confirmer
    complement: Complément à estimer
    sans_objet: Sans objet
  range_to: à
  actions: Points ouverts par option
  option_findings:
    java-spring: Les activités et paquets actifs financent les familles de travaux de la grille. Il reste à en détailler
      les quantités, les critères de recette et les frontières de réutilisation. Un dépassement de périmètre doit
      être démontré avant de créer un complément.
    microsoft: Le pilote chiffre configuration, interfaces, customisation, architecture, tests et démarrage. Migration,
      formation, transfert, chaîne de livraison, automatisation, supervision et reprise restent à localiser dans
      les forfaits. La projection Groupe demande le rapprochement des vagues et des responsabilités.
    sap: Les lots chiffrent domaines, développements, interfaces, reprise, recette, bascule et assistance initiale.
      Formation, transfert, automatisation, identités et garanties de service restent à confirmer. Les règles et
      parcours FLOW doivent être rapprochés de la BPML. Le périmètre Finance est encore présent dans les montants
      sources.
sources:
  RFI:
    path: sources/client/rfi-presentation.pdf
    location: 'p. 4–7 : périmètre, systèmes et frontières'
  BESOINS:
    path: sources/client/rfi-besoins.pdf
    location: Expression des besoins. Index fonctionnel à rapprocher des cas FLOW
  MS:
    path: sources/client/microsoft-1.pdf
    location: 'PDF p. 39 : cinq postes du ROM pilote. PDF p. 40 : abaques de déploiement.'
  MSQ:
    path: sources/client/microsoft-questionnaire.xlsx
    location: 2. Interfaces, lignes 7–12. 1. Besoins fonctionnels, E302/G302. 8. Estimations budgétaires, C13/D13
      et lignes 20–23
  SAP:
    path: sources/client/delaware-septembre.pdf
    location: 'PDF p. 33 : volumes. PDF p. 38 : lots. PDF p. 39–40 : domaines et phases. PDF p. 41 : WRICEF.'
  SAPQ:
    path: sources/client/sap-questionnaire.xlsx
    location: 1. Besoins fonctionnels, E136/H136, E229/H229 à E231/H231, E300/H300, E302/H302. 2. Interfaces, lignes
      7–8
  COPIL:
    path: sources/client/copil-5.pdf
    location: 'p. 7–8 : pilote, généralisation, équipes internes, autonomie et pré-cadrage'
  CATALOGUE:
    path: source/integration.yaml
    location: 'INT-001 à INT-013 : activités et frontières communes'
  PARCOURS:
    path: source/parcours-integration.yaml
    location: Cas métier et rapprochements proposés avec les activités
  MAKE:
    path: source/integration/integration-java-spring.yaml
    location: Responsabilités par activité. Le diagnostic historique des flux est remplacé par le scénario Groupe
      actif.
  DEPLOIEMENT:
    path: source/deploiement-groupe.yaml
    location: Paquets Groupe et substitutions INT-012/INT-013
  OFFICE:
    path: source/modele-composable.yaml
    location: 'equipe_transformation : pilotage client, architecture transverse et conduite du changement'
  ECARTS:
    path: source/ecarts-perimetre-flow-rfi.md
    location: Rapprochement documentaire des offres et du périmètre FLOW
  QUALIFICATION:
    path: source/qualification-buy.yaml
    location: Points de couverture et de droits Buy encore à qualifier
  MAKE_COST:
    path: source/chiffrage/chiffrage-java-spring.yaml
    location: Activités INT-001 à INT-011. INT-006 remplacé par le scénario Groupe actif.
funding_groups:
  make-common:
    option: java-spring
    label: Travaux communs Make existants
    path: source/integration/integration-java-spring.yaml
    scope: Activités conservées INT-001 à INT-011. Rapprochement à effectuer, sans addition au budget existant.
  make-deployment:
    option: java-spring
    label: Paquets de déploiement Groupe
    path: source/deploiement-groupe.yaml
    scope: Remplacent INT-012 et INT-013. Un forfait couvre plusieurs unités sans ventilation présumée.
  microsoft-offer:
    option: microsoft
    label: Offre Microsoft pilote et projection Groupe
    path: source/reperes-synvance.yaml
    scope: Le ROM pilote et la projection Groupe restent distincts. Inclusion de chaque livrable à confirmer.
  sap-offer:
    option: sap
    label: Lots SAP reçus
    path: source/reperes-synvance.yaml
    scope: Lots Boardriders et Beaumanoir. Finance hors FLOW à réconcilier. Aucun partage de forfait inventé.
