        calcul_runners: 300
        bases: 150
        stockage_sauvegardes: 50
        reseau_traces: 150
      central:
        calcul_runners: 450
        bases: 250
        stockage_sauvegardes: 100
        reseau_traces: 200
      soutenu:
        calcul_runners: 700
        bases: 400
        stockage_sauvegardes: 150
        reseau_traces: 250
  - id: developpement_qualification
    part_duree: 0.5
    contenu: Deux environnements partagés persistants, développement et qualification ; exécution régulière des
      tests et sauvegardes.
    couts_mensuels_eur_ht:
      sobre:
        calcul_runners: 600
        bases: 300
        stockage_sauvegardes: 100
        reseau_traces: 300
      central:
        calcul_runners: 900
        bases: 500
