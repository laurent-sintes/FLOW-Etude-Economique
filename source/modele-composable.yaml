  frontiere: Fin des consommations de build à la réception du Core ; les moyens de déploiement prennent le relais
    sans superposition.
buy:
  microsoft:
    source: source/maintenance/maintenance-microsoft.yaml
    groupes:
      MAI-010/licences:
        services:
        - cycle_vie_core_system
        - run
        statut_inclusions: documente
        periode: Séquence commerciale de cinq années sources, conservée. Le modèle actif démarre les souscriptions
          avec l'intégration.
        preuve: sources/client/microsoft-1.pdf#page=38
        limite: Maintenance standard, Azure, sandbox et services managés groupés ; aucune preuve de couverture de
          toutes les adaptations client.
      MAI-013/outillage-support:
        services:
        - integration_client
        - run
        statut_inclusions: a_rapprocher
        periode: Année 1 de l'offre, prix initial unique ; récurrence non établie. Affectation initiale courante
          conservée.
        preuve: sources/client/microsoft-questionnaire.xlsx#8. Estimations budgétaires!C13:D13
        limite: Advisory Unified et Project Quality ; pas une maintenance annuelle ni un deuxième abonnement produit.
  sap:
    source: source/maintenance/maintenance-sap.yaml
    groupes:
      MAI-010/licences:
        services:
        - cycle_vie_core_system
        - run
        statut_inclusions: documente_avec_reserves
        periode: Séquence BOM source conservée ; années sources 4/5 utilisées dans le modèle courant. Le RISE arrondi
          est un rappel, pas un nouvel achat.
        preuve: sources/client/delaware-septembre.pdf#page=37,43-45
        limite: Pas de ventilation inventée de Finance, droits, infrastructure ou entretien du standard. Réserves
          DRP/stockage préservées.
      rfi-mco:
        services:
        - mco_client
        - run
        statut_inclusions: rapprochement_propose
        periode: Après stabilisation selon la pièce ; pas année 1 du projet par défaut.
        preuve: sources/client/delaware-septembre.pdf#page=37
        limite: Libellé MCO hors évolutions, contenu détaillé non contractuel. La liste couvre du modèle est un
          rapprochement de travail, pas une preuve de ventilation Run/MCO.
      rfi-monitoring:
        services:
        - run
        statut_inclusions: documente_pour_monitoring
        periode: Après stabilisation, horaires étendus.
        preuve: sources/client/delaware-septembre.pdf#page=37
        limite: Le rattachement historique à tout MAI-005 ne démontre pas la prise en charge des modifications de
          contrats. Aucun supplément n'est ajouté ici.
      rfi-evolutions:
        services:
        - evolutions_client
        statut_inclusions: portefeuille_a_qualifier
        periode: Enveloppe annuelle après stabilisation.
        preuve: sources/client/delaware-septembre.pdf#page=37
        limite: Ne prouve pas la livraison de la roadmap générique SAP ni l'identité avec les 24 évolutions du scénario.
  regle_financiere: Prix, séquences, projections et inclusions préservés. Les parts non documentées restent null.
    Les contrats groupés ne financent aucune seconde ligne.

equipe_transformation:
  nom: Transformation Office FLOW
  jours_par_an: 216
  statut: Hypothèse adoptée le 2 novembre 2026, tarifs de cadrage hors taxes
  calendrier: Mobilisation par rôle pour la construction Make. Le dimensionnement existant est conservé pour l’intégration
    et les options Buy. Prorata mensuel et arrêt à la fin de l’intégration.
  exclusions: Direction de programme interne et mobilisation des équipes métier et IT hors de cette équipe.
  non_double_compte: Remplace intégralement la provision Make de direction et coordination de l’intégration ainsi
    que les 16 JH de revue d’architecture et 24 JH de coordination de sélection Buy. Le pilotage local, la conception
    détaillée, les leads techniques et la formation applicative restent dans leurs lots. L’équipe transverse représente
    le client. Elle ne réalise pas les prestations des intégrateurs Buy. Les forfaits Buy non ventilés ne donnent
    lieu à aucune déduction supposée.
  architecture: L’architecte transverse porte la vision fonctionnelle et technique, les frontières de composants
    et les arbitrages entre équipes. Les architectes des lots conservent la conception détaillée et les expertises.
    Aucune déduction de JH sans mission identifiée à transférer.
  roles:
  - id: direction_projet
    nom: Directeur de projet
    etp: 1
    tarif_eur_jh: 1000
    mission: Piloter l’exécution, le planning, le budget, les risques et les fournisseurs sous la direction de programme
      interne.
    build_make_etp: 1
    build_make_min_etp: 0.8
    build_make_max_etp: 1
    build_rationale: Piloter les engagements, les risques et les arbitrages d’exécution.
    decision: Arbitrer les engagements et escalader les décisions de programme.
    boundary: Le PMO consolide les informations. Les équipes pilotent leur travail quotidien.
    reinforcement: Engagements critiques, fournisseurs multiples et arbitrages simultanés.
    build_justification: Un pilotage quotidien est nécessaire pour tenir les engagements de plusieurs équipes produit
      et préparer les arbitrages du programme.
  - id: pmo
    nom: PMO
    etp: 1
    tarif_eur_jh: 850
    mission: Consolider portefeuille, engagements, budget, risques et décisions.
    build_make_etp: 0.8
    build_make_min_etp: 0.5
    build_make_max_etp: 1
    build_rationale: Consolider la trajectoire et préparer les décisions.
    decision: Tenir une vision commune des engagements, risques et décisions.
    boundary: Le PMO ne dirige pas les équipes et ne remplace pas leur suivi quotidien.
    reinforcement: Nombre d’équipes actives et volume des décisions à préparer.
    build_justification: La consolidation des engagements, risques et décisions mobilise un rôle central presque
      à temps plein. Le suivi quotidien reste dans chaque équipe.
  - id: synchronisation
    nom: Responsable de synchronisation
    etp: 1
    tarif_eur_jh: 850
    mission: Organiser les dépendances, les cycles et les livraisons entre équipes, hors pilotage local et coordination
      technique des lots.
    build_make_etp: 1
    build_make_min_etp: 0.5
    build_make_max_etp: 1.5
    build_rationale: Organiser les dépendances et les livraisons communes.
    decision: Résoudre les blocages entre équipes et préparer les livraisons communes.
    boundary: Les leads techniques gardent la coordination technique de leur produit.
    reinforcement: Livraisons simultanées, dépendances bloquantes et reprises entre équipes.
    build_justification: Les dépendances entre socles techniques, données et produits métier imposent une coordination
      continue des prérequis et des livraisons.
  - id: change
    nom: Responsable de la conduite du changement
    etp: 1
    tarif_eur_jh: 850
    mission: Piloter les impacts organisationnels, la communication et l’adoption, hors formation applicative et
      bascules déjà financées.
    build_make_etp: 0.4
    build_make_min_etp: 0.2
    build_make_max_etp: 0.8
    build_rationale: Accompagner l’organisation produit et les nouvelles pratiques de travail.
    decision: Préparer les changements de responsabilités et l’adoption des pratiques produit.
    boundary: La formation applicative et les bascules restent dans leurs lots.
    reinforcement: Nombre d’équipes qui adoptent de nouvelles pratiques et ampleur des changements de responsabilités.
    build_justification: Pendant la construction, le changement porte sur les pratiques et responsabilités des équipes
      produit. Le déploiement auprès des utilisateurs et la formation applicative sont traités séparément.
  - id: architecture
    nom: Architecte de solution transverse
    etp: 1
    tarif_eur_jh: 1000
    mission: Construire et maintenir une vision fonctionnelle et technique cohérente de la solution, de l’obtention
      à l’intégration.
    build_make_etp: 1
    build_make_min_etp: 1
    build_make_max_etp: 1.5
    build_rationale: Assurer la cohérence du produit, des composants et de leurs contrats.
    decision: Arbitrer les frontières des composants et les contrats entre équipes.
    boundary: Les architectes et leads des équipes gardent la conception détaillée.
    reinforcement: Conception simultanée des contrats, décisions transverses et exigences de sécurité ou de performance.
    build_justification: La construction d’un produit générique exige une responsabilité continue sur les frontières
      des composants et les contrats communs. La conception détaillée reste dans les équipes.
  pilotage:
    build_annual_label: Construction Make · par an
    other_annual_label: Intégration et Buy · par an
    title: Piloter la construction du Core System
    scope: Construction Make · première release majeure
    total: Mobilisation centrale
    range: Plage de mobilisation
    etp: ETP
    role: Rôle
    mission: Mission et décision
    detail: Justification et responsabilités
    boundary: Frontière de responsabilité
    reinforcement: Quand renforcer le rôle
    range_note: La mobilisation varie avec les équipes actives, les dépendances et les livraisons simultanées.
    board_title: Instance de décision Beaumanoir
    board_text: Sponsor, direction de programme et responsables métier arbitrent les priorités, les moyens et les
      engagements majeurs.
    product_title: Responsable de la cohérence produit
    product_text: À désigner côté Beaumanoir pour prioriser entre domaines et définir le périmètre de la release
      majeure. Sa disponibilité reste à dimensionner.
    operations_title: Pilotage opérationnel
    operations_text: Prépare les arbitrages, coordonne les dépendances et suit les engagements.
    teams_title: Équipes produit durables
    teams_text: Décident et réalisent dans leur périmètre. Portent la qualité et les évolutions de leur produit.
    decision_flow: Priorités et arbitrages
    execution_flow: Coordination et remontée des blocages
    integration_note: Le dimensionnement de l’intégration est traité séparément.
    annual: Charge annuelle de construction
    unit: JH/an
