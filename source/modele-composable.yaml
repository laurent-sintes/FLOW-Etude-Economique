  objet: plateforme
  options:
  - java-spring
  - dotnet
  - rust
  duree_ref: source/plan-investissement.yaml#build_make_mois
  cas_central: central
  statut_prix: Provisions d'ingénierie proposées, pas cotations cloud ni prix de catalogue vérifiés. Prix constants
    en euros HT.
  inclus: Calcul applicatif et runners de tests hébergés, bases de développement/qualification, stockage et sauvegardes,
    réseau et traces des environnements de fabrication.
  exclus: Licences et dépôts/outils déjà financés par les 8 euros par JH ; postes de travail ; main-d'œuvre CI/CD
    et socle déjà dans le build ; iPaaS de production et flux métier réels ; production HA et secours multisite.
  limites: Pas d'environnement persistant dédié par développeur. Données de test synthétiques ou anonymisées ; pas
    une copie automatique de tout le patrimoine de production. Tests de performance intermittents, arrêt des ressources
