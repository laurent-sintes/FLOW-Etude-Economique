version: 1
date: '2026-11-03'
default_zone: paris
rounding_eur: 25
method:
  title: Un prix de cadrage par rôle et par zone
  steps:
  - 'Paris : conserver les tarifs déjà adoptés après revue de leur positionnement. Pour les rôles complémentaires,
    retenir un prix explicite adapté au niveau de responsabilité, arrondi à 25 €. Chaque choix est une hypothèse
    retenue pour l’étude, distincte d’un devis.'
  - 'Province : lorsque le même relevé publie les deux zones du profil, appliquer au prix Paris le rapport province
    / Paris observé. Chez Silkhom, la province est le milieu des deux centres Grandes villes et Régions. Chez Free-Work,
    utiliser Autres villes.'
  - Sans comparaison régionale du rôle, utiliser la médiane des rapports de profils documentés de sa famille. Les
    familles sans paire régionale utilisent les profils de pilotage. Ces transpositions sont des hypothèses explicites,
    pas des prix régionaux observés.
  - Arrondir le résultat province au multiple de 25 € le plus proche. Les rôles internes sont valorisés en équivalent
    de prestation, sans conversion en salaire ni création de JH.
  - Appliquer les tarifs seulement aux JH déjà estimés. Les forfaits, licences, cloud, achats et frais techniques
    restent à leur montant. Les responsabilités sans charge adoptée restent à dimensionner.
roles:
- id: direction_programme
  ratio_role: direction_projet
  rationale: Équivalent externe d’une direction de transformation senior. La grille nationale de directeur de transformation
    (1 050–1 300) sert d’appui. Le temps interne reste à dimensionner.
  status: reference_etude
  paris_value: 1200
- id: direction_projet
  ratio_role: direction_projet
  rationale: 1 000 € HT / JH conservés pour la direction senior du projet. Les trois contributions senior conservées
    vont de 900 à 1 200. La moyenne générale à 829 en Île-de-France décrit une population plus large.
  status: reference_etude
  paris_ref:
    path: source/modele-composable.yaml
    pointer: equipe_transformation.roles
    role_id: direction_projet
    field: tarif_eur_jh
- id: pmo
  ratio_role: pmo
  rationale: 850 € HT / JH conservés pour un PMO senior. Un profil affiche ce prix à partir de 850. Les moyennes
    géographiques Free-Work servent uniquement à construire la variante régionale, pas à prouver une mission à ce
    prix.
  status: reference_etude
  paris_ref:
    path: source/modele-composable.yaml
    pointer: equipe_transformation.roles
    role_id: pmo
    field: tarif_eur_jh
- id: synchronisation
  ratio_role: synchronisation
  rationale: Tarif existant conservé pour un responsable transverse senior. Scrum Master est une analogie régionale
    partielle. La prime de responsabilité reste une hypothèse de cadrage.
