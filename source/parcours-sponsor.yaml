market:
  conclusion_title: Le build peut être testé en effort, pas validé en prix par le marché.
  conclusion: Un abaque ISBSG donne des heures par point de fonction pour des lots Java neufs de taille comparable.
    Les lots FLOW doivent encore être comptés et les travaux réconciliés. Aucun prix de programme publié ne valide
    directement l’enveloppe de l’étude.
  corpus_source:
    path: source/references-couts-integration.yaml#analyse_dispersion
    label: Portée, critères et qualité des références
  build:
    title: Build Make
    status: Abaque conditionnel disponible
    argument: Les charges par capacité peuvent être confrontées à un taux d'effort observé après mesure fonctionnelle.
    text: Le montant FLOW reste issu des travaux, gains et tarifs retenus. ISBSG observe 72 développements neufs
      Java de 100 à 300 points de fonction, à 9,4 heures par point en médiane. Un comptage indépendant et un
      alignement des phases sont nécessaires avant de comparer les JH de BC-010, BC-013, BC-018 et BC-043.
      OpenLMIS, Odoo, ERPNext, OCA et Camunda éclairent les mécanismes et frontières, sans fournir le prix du Core.
    link: Examiner les charges et leur valorisation
    source:
      path: sources/benchmark-build-core-scm-2026-10-27.md
      label: Audit approfondi du build SCM · abaques, effort observé et frontières
  integration:
    title: Intégration
    status: Écarts à expliquer
    argument: Deux points concrets changent la lecture des offres.
    text: Microsoft repose sur une généralisation projetée au-delà du pilote. SAP conserve la Finance et son document
      présente une divergence entre somme des lots et total imprimé.
    difference: Écart dans le document SAP
    sum: Somme des lots
    printed: Total imprimé
    note: Ces montants décrivent le fournisseur, pas toute l’enveloppe de l’étude. Le chiffrage Make par activités
      a une assiette distincte ; l’écart avec SAP ne prouve pas à lui seul une économie.
    sources:
    - path: sources/client/copil-5.pdf#page=7
      label: COPIL 5 · pages PDF 7–8 · généralisation Microsoft
    - path: sources/client/delaware-septembre.pdf#page=38
      label: Delaware · pages PDF 38–40 · prix et périmètre des lots
  run:
    title: Run & MCO
    status: Contenu des services à vérifier
    argument: Le budget annuel dépasse le seul abonnement éditeur.
    text: La comparaison FLOW réunit les achats techniques et les activités de maintenance et d’exploitation. Les
      offres groupées restent non ventilées. La vérification porte sur leurs inclusions — hébergement, support et
      évolutions — avant de conclure qu’une option est chère ou économique.
    link: Vérifier les activités et achats annuels
    source:
      path: source/lecture-comparative.yaml#economique
      label: Responsabilités et inclusions du service annuel
  evidence_title: Les preuves restent accessibles
  references_link: Projets de référence et preuves localisées
  rates_link: Profils et tarifs de prestation
  references_note: Les fiches complètes permettent de vérifier une affirmation précise. Utilité du projet, qualité
    du prix et transposition à FLOW restent trois appréciations distinctes.
