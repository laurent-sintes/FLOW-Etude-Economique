version: 1
id: conditions-realisation
principle:
  title: Passer d’une option souhaitée à une réalisation crédible
  text: '**La {{notion.plateforme_marques.court}} se construit par étapes.** Le choix de la {{notion.core_system}} engage des responsabilités de produit, d’intégration et de service. Examiner les conditions pour les tenir permet de préparer chaque décision, quel que soit le choix Make ou Buy.'
notice:
  title: Une méthode de preuve, sans promesse de livraison
  text: Les critères ci-dessous organisent l’instruction. Leur application, les capacités disponibles et les pièces manquantes sont présentées dans le dossier de capacité. **Un calcul cohérent ne démontre ni la disponibilité d’une équipe ni l’engagement d’un partenaire.**
navigation_label: Les conditions à examiner
criteria:
- id: maitrise
  title: Distinguer maîtrise du produit et réalisation
  lead: '**Make décrit une maîtrise du Groupe.** La réalisation peut associer Beaumanoir et un partenaire ; l’organisation reste à expliciter.'
  expected: Une répartition des décisions, travaux, acceptations et responsabilités de service, avec un responsable de validation pour chaque mission.
  blocks:
  - kind: bullets
    items:
    - '**Beaumanoir :** priorités produit, arbitrages entre marques, données et acceptation métier.'
    - '**Partenaire :** travaux et engagements proposés, compétences mobilisables, assurance qualité et continuité de prestation.'
    - '**Ensemble :** organisation de réalisation, transfert et critères d’autonomie. Acheter un produit conserve aussi des responsabilités côté client.'
- id: capacite
  title: Vérifier les capacités nécessaires
  lead: '**Une charge en JH ne constitue pas une équipe disponible.** Relier les missions aux profils, à leur disponibilité et aux moyens de travail.'
  expected: Des rôles et disponibilités confirmés, des relais identifiés et un dispositif finançable, avant l’engagement de réalisation.
  blocks:
  - kind: bullets
    items:
    - Préciser ce qui existe, ce qui reste à constituer et ce qui doit être vérifié. Un acteur envisagé n’est pas un intervenant engagé.
    - Inclure les contributions métier, les décisions, la QA, les données, la sécurité et l’exploitation, même lorsque leur coût est hors périmètre de l’estimation.
    - Vérifier la continuité et le transfert à une autre équipe. La possession du code ne suffit pas à démontrer l’autonomie.
- id: preuve
  title: Adapter la preuve à ce qu’elle doit démontrer
  lead: '**Une référence de marché, une expérience du partenaire et un essai FLOW répondent à des questions différentes.** Garder leur origine et leur portée.'
  expected: Une pièce vérifiable, son contexte, ses limites de transposition et une revue adaptée à la décision.
  blocks:
  - kind: table
    caption: Ce que les preuves permettent de conclure
    columns: [Élément examiné, Ce qu’il étaye, Ce qu’il reste à vérifier]
    rows:
    - [Cartographie et dossier Synvance, Besoin et repères d’intégration documentés, Couverture et réalisation dans le contexte retenu.]
    - [Référence réelle du partenaire, Expérience et rôle effectivement tenus, Équipe proposée et transposition à FLOW.]
    - [Prototype ou exercice de reprise, Résultat observé sur un cas et des conditions connus, Généralisation et exigences de service.]
    - [Estimation relue, Hypothèses et travaux examinés, Disponibilité des acteurs et engagement de réalisation.]
- id: trajectoire
  title: Autoriser la suite sur des résultats observables
  lead: '**La perspective sur dix ans se pilote par décisions successives.** Les jalons relient les preuves aux conditions de poursuite ou de réexamen.'
  expected: Pour chaque jalon, un résultat attendu, des pièces, un responsable de validation et des critères de poursuite ou de réexamen.
  blocks:
  - kind: bullets
    items:
    - Vérifier le dispositif avant d’engager la réalisation, puis éprouver les mécanismes difficiles avant d’en généraliser l’usage.
    - Accepter le pilote sur ses parcours, ses données et son service avant les déploiements suivants.
    - Démontrer le transfert, la capacité d’évolution et la reprise du service avant d’annoncer l’autonomie.
  - kind: paragraphs
    items:
    - Les dates du modèle restent des hypothèses de calendrier. Les jalons de preuve ne les déplacent pas automatiquement et ne créent aucun budget. Une condition non satisfaite appelle une décision explicite.
  - kind: links
    items:
    - href: '#capacite-realisation'
      label: Examiner la capacité et les preuves à réunir
next:
