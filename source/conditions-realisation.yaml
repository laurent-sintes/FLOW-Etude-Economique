version: 1
id: conditions-realisation
principle:
  title: Des critères communs à Make et Buy
  text: '**Examiner qui décide, qui réalise et qui porte le service.** Ces critères guident l’évaluation du dispositif
    ; le dossier FLOW présente les acteurs envisagés et les pièces à réunir.'
notice:
  title: De la méthode à la réalisation
  text: Une estimation relue étaye les travaux prévus. La disponibilité des équipes, les résultats des essais et
    les engagements du partenaire demandent des preuves distinctes.
navigation_label: Les quatre critères de réalisation
criteria:
- id: maitrise
  title: Répartir les responsabilités
  lead: '**Qui décide, réalise et accepte le produit ?** La maîtrise du Groupe se distingue des travaux confiés
    au partenaire.'
  expected: Des missions attribuées, avec décisions, acceptations et responsabilités de service explicites.
  blocks:
  - kind: bullets
    items:
    - Beaumanoir porte priorités produit, arbitrages entre marques, données et acceptation métier.
    - Le partenaire précise réalisation, QA et continuité. Le transfert et l’autonomie se préparent ensemble, y
      compris en Buy.
- id: capacite
  title: Vérifier les moyens mobilisables
  lead: '**Les missions disposent-elles des compétences et disponibilités nécessaires ?** Une charge en JH ne prouve
    pas qu’une équipe est mobilisable.'
  expected: Un dispositif finançable, des disponibilités confirmées et des relais capables de reprendre le produit.
  blocks:
  - kind: bullets
    items:
    - Inclure métier, produit, données, architecture, QA, sécurité et exploitation, même hors du périmètre économique
      chiffré.
    - Vérifier moyens de travail, continuité et transfert. Posséder le code ne démontre pas l’autonomie.
- id: preuve
  title: Qualifier les preuves
  lead: '**Que démontre chaque pièce, et dans quelles limites ?** Distinguer les entrants, l’expérience réelle,
    les essais et la revue de l’estimation.'
  expected: Une origine vérifiable, un contexte et une revue adaptés à la décision.
  blocks:
  - kind: table
    caption: Portée des pièces examinées
    columns:
    - Pièce
    - Apport
    - À vérifier
    rows:
    - - Cartographie et Synvance
      - Besoin et intégration documentés
      - Couverture dans le contexte retenu
    - - Référence du partenaire
      - Expérience et rôle tenus
      - Équipe proposée et transposition à FLOW
    - - Prototype ou reprise
      - Résultat observé sur un cas
      - Généralisation et service
    - - Estimation relue
      - Hypothèses et travaux examinés
      - Disponibilités et engagement de réalisation
- id: trajectoire
  title: Décider la poursuite par jalons
  lead: '**Quel résultat autorise l’étape suivante ?** Chaque jalon associe des pièces, une validation et des conditions
    de poursuite ou de réexamen.'
  expected: Une décision explicite avant réalisation, généralisation, déploiements suivants et autonomie.
  blocks:
  - kind: paragraphs
    items:
    - Les jalons de preuve ne déplacent pas automatiquement le calendrier et ne créent aucun budget. Les résultats
      observés conditionnent la poursuite.
  - kind: links
    items:
    - href: '#capacite-realisation'
      label: Consulter le dispositif, les preuves et les jalons FLOW
