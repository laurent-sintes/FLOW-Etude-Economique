version: 1
id: framework-application
economic:
  status_ref: core
  sections:
  - id: scope
    title: Périmètre des évaluations actuelles
    paragraphs:
    - '**Les offres ne sont pas ramenées à un périmètre identique.** Le budget SAP conserve notamment des travaux
      Finance hors du besoin FLOW commun. Les offres issues de Synvance sont examinées avec leurs inclusions, leurs
      responsabilités et leurs écarts. Un point à qualifier ne crée aucun supplément automatique.'
    - '**Les budgets ne couvrent pas toute la transformation du Groupe.** Le temps interne de décision et d’acceptation,
      la transformation organisationnelle, le décommissionnement et le maintien des SI historiques pendant la transition
      restent exclus. L’assistance de sélection Buy est une provision côté acheteur. La consultation passée et les
      PoC payants ne sont pas ajoutés.'
    links:
    - href: source/ecarts-perimetre-flow-rfi.md
      label: Examiner les écarts de périmètre des offres
  - id: calendar
    title: Provenance des calendriers retenus
    paragraphs:
    - Le calendrier Make est fondé sur les travaux et déploiements Groupe. Les durées Buy viennent du COPIL simplifié
      et sont précédées de la sélection-contractualisation. Elles ne déterminent pas les durées Make. Le départ
      commun permet de comparer les dépenses, avec des dates de service complet différentes.
    - '**Les durées globales Make restent provisoires.** Les délais des familles retenues sont conservés séparément.
      Ils ne s’additionnent pas et ne déterminent pas le calendrier complet du produit ou des déploiements.'
  - id: maturity
    title: Portée des résultats disponibles
    paragraphs:
    - '**La construction Java/Spring est chiffrée sur tout le périmètre.** Chaque unité finance ses rôles et mécanismes
      déclarés sans remise IA globale ni pilotage proportionnel ajouté. .NET et Rust restent à réestimer. Intégration
      et fonctionnement conservent leurs bases.'
    - '**Le total humain du projet reste incomplet en JH.** Le moteur calcule les charges par activité et les budgets,
      mais la coordination technique reste notamment provisionnée en euros sans dimensionnement complet en journées.
      Un effort exclu ou inconnu ne vaut pas zéro.'
    - '**Les tags Build / Run et la clé du MCO des adaptations sont définis. Leur agrégation monétaire comparative
      reste à constituer.** Le moteur présente les postes et leurs annuités. Un sous-total de parts connues ne serait
      pas un total Run complet. Les contrats Buy sans ventilation restent à leur prix global.'
hypotheses:
  sections:
  - id: productivity
    title: Application des gains aux travaux retenus
    paragraphs:
    - Les familles Core System retenues conservent leurs JH par rôle, réutilisation et pilotage local compris. Les
      gains des autres activités restent des hypothèses d’ingénierie à éprouver.
    - '**L’intégration Make et les prestations de transition sont calculées sans gains IA.** Les gains annuels concernent
      le régime stabilisé. Les taux de construction sans assiette active ne réduisent aucun budget.'
  - id: coordination
    title: Dimensionnement de la coordination et du programme
    paragraphs:
    - La coordination des travaux techniques est provisionnée en pourcentage des prestations de son assiette. Les
      missions détaillées, profils et JH restent à dimensionner. Pour le pilotage du programme Make, les mobilisations
      mensuelles des rôles sont appliquées à la durée de l’intégration Groupe.
  - id: annual_means
    title: Hypothèses des moyens annuels
    paragraphs:
    - 'Les moyens cloud et achats techniques reposent sur des enveloppes. Les volumes de données, d’environnements
      et d’échanges les éclairent. Ils ne produisent pas une facture cloud détaillée.'
  - id: annual_expertise
    title: Hypothèse d’expertise annuelle
    paragraphs:
    - 'Le plafond annuel d’expertise cloud et sécurité est une hypothèse héritée, sans mesure de charge observée.
      Il borne un sous-ensemble de JH de support N3 déjà financés dans l’exploitation cloud et la sécurité. La répartition
      précise entre ces activités reste inconnue. Le complément change leur tarif, sans ajouter de journées.'
  - id: offer_sequences
    title: Séquences commerciales appliquées
    paragraphs:
    - '**La séquence reçue et celle retenue dans le calcul sont distinctes.** Les pièces Synvance documentent cinq
      années de prix pour chaque offre. Le modèle conserve les années source 1 à 5 pour Microsoft. Pour SAP, il
      retient les années source 4 et 5 à pleine capacité. Il ne rejoue donc pas la montée en charge initiale de
      l’offre SAP.'
    - '**La première année de la séquence retenue commence à la fin de la sélection-contractualisation.** Après
      ses cinq années Microsoft ou ses deux années SAP, le dernier prix retenu est prolongé par l’indexation des
      licences. Ces années de séquence ne sont pas les années civiles du plan.'
    - Les forfaits de services SAP restent dans la base annuelle des services, avec son indexation. Ils ne sont
      ni ajoutés aux licences ni indexés une seconde fois avec elles.
    links:
    - href: '#synvance-microsoft'
      label: Voir les cinq années reçues pour Microsoft
    - href: '#synvance-sap'
      label: Voir la montée en charge reçue pour SAP
market:
  sections:
  - id: evidence_status
    title: Ce que les références disponibles établissent
    paragraphs:
    - '**Ces appuis ne calibrent pas encore indépendamment les charges et coûts de FLOW.** Les fiches produit et
      inventaires de code éclairent les fonctions étudiées. Les prix d’intégration sont normalisés, sans transposition
      établie à FLOW. Le fonctionnement combine offres Beaumanoir, références externes partielles et hypothèses
      de volumes.'
    - L’analyse des correspondances produit et des références de charge reste partielle. Les états d’avancement
      indiquent le travail documentaire engagé, sans démontrer la couverture du besoin ni transformer une inconnue
      en absence produit.
    links:
    - href: sources/rafraichissement-referentiel-marche-2026-10-28.md
      label: Lire les vérifications et ajustements du référentiel
  - id: cocomo
    title: Quatre références natives et deux voies de calcul
    paragraphs:
    - '**Les décisions actives utilisent quatre références natives : ERPNext / Frappe, Odoo, Tryton et Axelor / Open
      Platform.** COCOMO II est la référence retenue. COSMIC × ISBSG reste une voie de comparaison avec ses limites
      de périmètre et d’activités.'
    - Les diagnostics nominaux historiques et les essais non retenus restent distincts des décisions adoptées. Aucun
      de ces calculs ne mesure le temps réellement passé à développer les OSS.
    links:
    - href: sources/fiche-marche-frappe-erpnext-flow-2026-10-28.md
      label: Examiner la sélection de code et le diagnostic
