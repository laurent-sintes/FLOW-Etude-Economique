version: 1
id: framework-application
economic:
  status_ref: core
  sections:
  - id: scope
    title: Périmètre des évaluations actuelles
    paragraphs:
    - '**Les offres ne sont pas ramenées à un périmètre identique.** Le budget SAP conserve notamment des travaux Finance hors du besoin FLOW commun. Les offres issues de Synvance sont examinées avec leurs inclusions, leurs responsabilités et leurs écarts ; un point à qualifier ne crée aucun supplément automatique.'
    - '**Les budgets ne couvrent pas toute la transformation du Groupe.** Le temps interne de décision et d’acceptation, la transformation organisationnelle, le décommissionnement et le maintien des SI historiques pendant la transition restent exclus. L’assistance de sélection Buy est une provision côté acheteur ; la consultation passée et les PoC payants ne sont pas ajoutés.'
    links:
    - {href: 'source/ecarts-perimetre-flow-rfi.md', label: Examiner les écarts de périmètre des offres}
  - id: calendar
    title: Provenance des calendriers retenus
    paragraphs:
    - 'Le calendrier Make est fondé sur les travaux et déploiements Groupe. Les durées Buy viennent du COPIL simplifié et sont précédées de la sélection-contractualisation. Elles ne déterminent pas les durées Make. Le départ commun permet de comparer les dépenses, avec des dates de service complet différentes.'
  - id: maturity
    title: Portée des résultats disponibles
    paragraphs:
    - '**Le total humain du projet reste incomplet en JH.** Le moteur calcule les charges par activité et les budgets, mais la coordination technique reste notamment provisionnée en euros sans dimensionnement complet en journées. Un effort exclu ou inconnu ne vaut pas zéro.'
    - '**Les tags Build / Run et la clé du MCO des adaptations sont définis ; leur agrégation monétaire comparative reste à constituer.** Le moteur présente les postes et leurs annuités. Un sous-total de parts connues ne serait pas un total Run complet ; les contrats Buy sans ventilation restent à leur prix global.'
hypotheses:
  sections:
  - id: productivity
    title: Application des gains aux travaux retenus
    paragraphs:
    - 'Les gains d’assistance par IA sont des hypothèses d’ingénierie par activité et écosystème, à éprouver sur des travaux représentatifs. Ils ne sont pas des performances mesurées chez Beaumanoir. Le scénario haut courant conserve l’hypothèse d’une absence de gain IA.'
    - '**L’intégration Make de référence, son expertise transverse et les prestations de transition Make sont calculées sans gains IA.** Les gains annuels concernent le régime stabilisé. Aucun développement générique additionnel n’est retenu pour Buy ; les taux enregistrés à ce titre n’ont donc pas d’assiette active.'
  - id: coordination
    title: Dimensionnement de la coordination et du programme
    paragraphs:
    - 'La coordination des travaux techniques est provisionnée en pourcentage des prestations de son assiette. Les missions détaillées, profils et JH restent à dimensionner. Pour le pilotage du programme Make, les mobilisations mensuelles des rôles sont appliquées à la durée de l’intégration Groupe.'
  - id: annual_means
    title: Hypothèses des moyens annuels
    paragraphs:
    - 'Les moyens cloud et achats techniques reposent sur des enveloppes. Les volumes de données, d’environnements et d’échanges les éclairent ; ils ne produisent pas une facture cloud détaillée.'
  - id: annual_expertise
    title: Hypothèse d’expertise annuelle
    paragraphs:
    - 'Le plafond annuel d’expertise cloud et sécurité est une hypothèse héritée, sans mesure de charge observée. Il borne un sous-ensemble de JH de support N3 déjà financés dans l’exploitation cloud et la sécurité. La répartition précise entre ces activités reste inconnue ; le complément change leur tarif, sans ajouter de journées.'
  - id: offer_sequences
    title: Séquences commerciales appliquées
    paragraphs:
    - '**La séquence reçue et celle retenue dans le calcul sont distinctes.** Les pièces Synvance documentent cinq années de prix pour chaque offre. Le modèle conserve les années source 1 à 5 pour Microsoft ; pour SAP, il retient les années source 4 et 5 à pleine capacité. Il ne rejoue donc pas la montée en charge initiale de l’offre SAP.'
    - '**La première année de la séquence retenue commence à la fin de la sélection-contractualisation.** Après ses cinq années Microsoft ou ses deux années SAP, le dernier prix retenu est prolongé par l’indexation des licences. Ces années de séquence ne sont pas les années civiles du plan.'
    - 'Les forfaits de services SAP restent dans la base annuelle des services, avec son indexation. Ils ne sont ni ajoutés aux licences ni indexés une seconde fois avec elles.'
    links:
    - {href: '#synvance-microsoft', label: Voir les cinq années reçues pour Microsoft}
    - {href: '#synvance-sap', label: Voir la montée en charge reçue pour SAP}
market:
  sections:
  - id: evidence_status
    title: Ce que les références disponibles établissent
    paragraphs:
    - '**Ces appuis ne calibrent pas encore indépendamment les charges et coûts de FLOW.** Les fiches produit et inventaires de code éclairent les fonctions étudiées. Les prix d’intégration sont normalisés, sans transposition établie à FLOW. Le fonctionnement combine offres Beaumanoir, références externes partielles et hypothèses de volumes.'
    - 'L’analyse des correspondances produit et des références de charge reste partielle. Les états d’avancement indiquent le travail documentaire engagé, sans démontrer la couverture du besoin ni transformer une inconnue en absence produit.'
    links:
    - {href: 'sources/rafraichissement-referentiel-marche-2026-10-28.md', label: Lire les vérifications et ajustements du référentiel}
  - id: cocomo
    title: Portée du diagnostic nominal de reconstruction
    paragraphs:
    - 'Le calcul nominal simplifié inspiré de COCOMO II porte sur une sélection de code ERPNext, Frappe et Insights. Il décrit une reconstruction hypothétique, sans mesurer l’effort historique observé. Il n’est pas calibré pour FLOW, ne valide pas les charges des cinq options et ne s’ajoute pas aux budgets.'
    links:
    - {href: 'sources/fiche-marche-frappe-erpnext-flow-2026-10-28.md', label: Examiner la sélection de code et le diagnostic}
