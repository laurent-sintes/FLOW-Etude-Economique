$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required:
- version
- labels
- overrides
properties:
  version:
    const: 1
  labels:
    type: object
    required:
    - title
    - intro
    - domain
    - effort
    - cost
    - total
    - unallocated
    - pending
    - native_basis
    - pending_basis
    - shared_note
    - phases_note
    - classification
    - direct
    - shared_pending
    - to_classify
    - grouped_list
    - known_note
    additionalProperties: &id001
      type: string
      minLength: 1
  overrides:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - work_unit_ref
      - status
      - domain_refs
      - basis
      - evidence_refs
      properties:
        work_unit_ref: *id001
        status:
          enum:
          - direct
          - shared_pending
        domain_refs:
          type: array
          minItems: 1
          uniqueItems: true
          items: *id001
        basis: *id001
        evidence_refs:
          type: array
          minItems: 1
          uniqueItems: true
          items: *id001
