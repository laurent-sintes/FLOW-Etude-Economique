schema_version: 1
id: core-evaluation-opportunity
principle:
  title: Estimer la {{notion.core_system}} à partir des capacités et du code OSS
  text: '**Cartographie des capacités → fonctions à réaliser → références et comptages → JH retenus.** Les calculs
    COCOMO II et COSMIC × ISBSG restent séparés. Les lots détaillés par livrable sont retenus par somme de leurs
    charges validées, avec déduction des mécanismes déjà financés.'
notice:
  status_ref: core
tooling:
  label: Automatisation
  title: Un calcul reproductible depuis ses preuves
  skill: flow-evaluer-core-system
  text: Le skill prépare mesures et hypothèses. Le moteur reconstruit les tailles, vérifie les liens et reproduit
    les décisions à partir des versions, mesures et paramètres enregistrés.
navigation_label: Les étapes de l’estimation
sections:
- id: delimiter-perimetre
  title: Définir l’unité et les activités couvertes
  lead: '**La cartographie des capacités fixe le périmètre à estimer. Le rapprochement avec les fonctions et composants
    OSS justifie les mesures retenues.**'
  blocks:
  - kind: bullets
    items:
    - 'Conserver les noms, identifiants et frontières de la capture native. Choisir une unité cohérente : capacité,
      Business Area ou ensemble métier justifiable.'
    - Pour chaque unité, relier les capacités à des fonctions observées dans les OSS, puis aux modules et chemins
      de code correspondants. Conserver versions, preuves de couverture, écarts et compléments FLOW.
    - Déclarer fonctions communes, compléments FLOW, exclusions et garanties attendues. Les adaptations propres
      au Groupe relèvent de l’intégration.
    - Lier le calcul à son unité, sa stack, sa version de périmètre et ses activités. Une nouvelle frontière exige
      de requalifier le calcul.
    - Pour des composants fortement liés, sommer leurs tailles et appliquer COCOMO une seule fois à l’unité cohérente.
      Une allocation entre familles ne crée pas des estimations indépendantes par capacité.
  - kind: callout
    title: Activités couvertes par les JH du produit
    text: Les charges comprennent analyse produit, architecture, développement et tests développeur, QA, sécurité
      ciblée, pilotage de l’équipe et préparation de la livraison. Cette couverture s’applique à tous les lots.
      Le {{notion.transformation_office}} finance séparément le pilotage de l’exécution côté client, le PMO, l’architecture
      de solution et le change sur la durée d’obtention et d’intégration. L’intégration transverse du delivery est
      un dispositif distinct pour les dépendances, la qualification intégrée et les livraisons communes. Sa mobilisation
      doit être dimensionnée en rapprochant les missions déjà financées. Les raccordements, migrations, formation
      des relais et déploiements Groupe sont chiffrés dans l’intégration. Le MCO, l’exploitation et les achats techniques
      sont présentés dans le fonctionnement. Le temps interne métier et IT, la conduite du changement organisationnelle
      et les audits externes spécifiques restent à dimensionner.
  - kind: callout
    title: Compléter le périmètre du produit professionnel
    text: Le référentiel des capacités est un entrant métier immuable. Il ne décrit pas tous les outils d’administration,
      de robustesse et de sécurité. Inventorier séparément ces fonctions dans fonctions-produit-core.yaml, les rapprocher
      des quatre suites et du financement existant. Classer Core Domain et Support selon la contribution à la valeur
      de Flow, y compris pour les outils utilisés par le métier. Ne pas convertir la répartition des rôles en répartition
      fonctionnelle. Une fonction non chiffrée reste inconnue, sans budget nul présumé.
- id: observer-fonctions
  title: Préparer les tailles et la réutilisation
  lead: '**Quatre références OSS rendent le dimensionnement inspectable.** PNCLOC désigne les lignes physiques non
    vides, hors commentaires. Ces sélections ne mesurent pas le produit entier et doivent être rapprochées des capacités
    avant préparation de la taille COCOMO II.'
  blocks:
  - kind: reference_cards
    cards:
    - title: ERPNext / Frappe
      subtitle: Un ERP métier porté par un framework de documents
      fields:
      - label: Périmètre fonctionnel
        items:
        - Achats, ventes, stocks et planification dans ERPNext. Frappe porte documents, droits, workflows et API.
          Insights complète l’analyse.
      - label: Langages et socle
        items:
        - Python et JavaScript dans Frappe/ERPNext, Vue/TypeScript dans Insights. DocTypes en JSON, MariaDB et Redis/Valkey.
      - label: Fonction marquante
        items:
        - Les DocTypes relient modèle de données, formulaires, droits et API dans un même cadre déclaratif.
      - label: Déploiements documentés
        items:
        - '**Chewy** : portail de contrats de remises fournisseurs adapté sur ERPNext.'
        - '**Vodafone UK** : commandes SIM et webshop spécifique. Édition et volumes non établis.'
      note: Relevé du 28 octobre 2026. Périmètre déployé et sources ci-dessous.
      sources:
      - label: Architecture Frappe
        href: https://docs.frappe.io/framework/user/en/basics/architecture
      - label: Cas Chewy publié par Frappe
        href: https://frappe.io/stories/Chewy
      - label: Cas Vodafone UK publié par Korecent
        href: https://korecent.com/case-study/success-story-of-vodafone-global
      measurement:
        product_ref: erpnext
        label: Code sélectionné et mesuré
    - title: Odoo Community
      subtitle: Un ERP modulaire avec un socle et une interface intégrés
      fields:
      - label: Périmètre fonctionnel
        items:
        - Achats, ventes, stocks, fabrication et socle web modulaire. Le panier mesuré ajoute le moteur OSS o-spreadsheet.
          Les modules Enterprise sont exclus.
      - label: Langages et socle
        items:
        - Python et PostgreSQL, modèles et ORM côté serveur, vues XML, interface JavaScript/Owl.
      - label: Fonction marquante
        items:
        - Des modules métier intégrés et extensibles, avec une interface web et des vues communes.
      - label: Déploiements documentés
        items:
        - '**Aurora Multimarket** : Odoo Community pour la planification du personnel des magasins. Ce cas ne démontre
          pas la gestion des stocks sur Odoo.'
        - '**Toyota Material Handling France** : ventes, achats, stock et fabrication dans un cas publié en 2017.
          Édition inconnue et usage actuel non reconfirmé.'
      note: Relevé du 28 octobre 2026. Périmètre déployé et sources ci-dessous.
      sources:
      - label: Code public et composition Odoo Community
        href: https://github.com/odoo/odoo
      - label: Cas Aurora publié par UBM Soft
        href: https://ubmsoft.com.ua/en/blog/our-blog-2/wfm-system-in-odoo-how-to-automate-personnel-management-23
      - label: Cas Toyota Material Handling publié par Odoo
        href: https://www.odoo.com/blog/customer-reviews-6/how-toyota-uses-odoo-after-just-6-months-of-integration-312
      measurement:
        product_ref: odoo-community
        label: Code sélectionné et mesuré
    - title: Tryton
      subtitle: Un socle métier modulaire et un code ouvert inspectable
      fields:
      - label: Périmètre fonctionnel
        items:
        - Achats, ventes, stocks, approvisionnement et production au moyen de modules indépendants. Le relevé retient
          le serveur, le client web et 25 modules opérationnels.
      - label: Langages et socle
        items:
        - Serveur Python avec ORM, base PostgreSQL, client web Sao en JavaScript et vues XML.
      - label: Fonction marquante
        items:
        - Composer et étendre les règles métier par modules Python, au-dessus de modèles et de transactions communs.
      - label: Déploiements documentés
        items:
        - '**Mifarma** : ERP relié au webshop, aux équipements de préparation et aux transporteurs.'
        - '**Coppernic** : achats, stock, production et livraison, avec des compléments adaptés. Versions et maintien
          en service non établis par ces cas non datés.'
      note: Relevé du 28 octobre 2026. Périmètre déployé et sources ci-dessous.
      sources:
      - label: Documentation des modules Tryton
        href: https://docs.tryton.org/
      - label: Cas Mifarma publié par Tryton
        href: https://www.tryton.org/success-stories/mifarma
      - label: Cas Coppernic publié par Tryton
        href: https://www.tryton.org/success-stories/coppernic
      measurement:
        product_ref: tryton
        label: Code sélectionné et mesuré
    - title: Axelor / Open Platform
      subtitle: Un socle Java et des applications métier configurables
      fields:
      - label: Périmètre fonctionnel
        items:
        - Achats, ventes, stocks et production dans Open Suite. Open Platform et Studio/BPM portent les modèles,
          interfaces et processus de l’assemblage étudié.
      - label: Langages et socle
        items:
        - Java, persistance Hibernate, modèles et vues XML, scripts Groovy et API REST. Client React/TypeScript
          pour la version de plateforme étudiée.
      - label: Fonction marquante
        items:
        - Associer modèles et vues déclaratifs à un studio de processus BPMN/DMN. La BI Enterprise est hors du panier
          OSS mesuré.
      - label: Déploiements documentés
        items:
        - '**thyssenkrupp Materials France** : production, stocks, achats, ventes et étiquetage. Le cas concerne
          cette filiale, pas le Core System du groupe.'
        - '**Octopia** : inscription et facturation de vendeurs tiers dans un cas de 2021. Édition et usage actuel
          non établis.'
      note: Relevé du 28 octobre 2026. Périmètre déployé et sources ci-dessous.
      sources:
      - label: Code et architecture Axelor Open Platform
        href: https://github.com/axelor/axelor-open-platform
      - label: Cas Octopia publié par Axelor
        href: https://axelor.com/fr/cas-client-cdiscount/
      - label: Cas thyssenkrupp Materials France
        href: https://axelor.com/fr/cas-client-tkmf/
      measurement:
        product_ref: axelor-open-suite
        label: Code sélectionné et mesuré
  - kind: table
    caption: Deux préparations selon les preuves disponibles
    columns:
    - Préparation
    - Traitement
    rows:
    - - Réutilisation native et compléments
      - Séparer code neuf, patrimoine réutilisé et adaptations. Pondérer le déclaratif et conserver les hypothèses
        d’assimilation.
    - - Composants mixtes et analogies de modules
      - Déduire le patrimoine déjà financé, attribuer une part supposée au métier et conserver un plancher mesuré.
        Dimensionner les nouveaux modules par analogie, puis ajouter modèles, vues et configurations.
  - kind: formula
    rule_ref: component_attribution
  - kind: formula
    rule_ref: module_analogy
  - kind: formula
    rule_ref: equivalent_size
  - kind: bullets
    items:
    - Figer versions, fichiers, comptages et empreintes. Une part de pertinence ou une fraction de module reste
      supposée, même si son calcul est reproductible.
    - Un mécanisme partagé a un propriétaire de financement. Le consommateur finance ses raccordements et adaptations.
      Le framework entier n’est pas reconstruit pour chaque famille.
  - kind: links
    items:
    - href: '#etude-marche'
      label: Examiner l’utilisation économique des références
- id: former-lots
  title: Calculer et confronter les deux voies
  lead: '**COCOMO estime l’effort. COSMIC mesure les fonctions. ISBSG apporte une référence de productivité.**'
  blocks:
  - kind: reference_cards
    cards:
    - title: COCOMO II
      subtitle: Modéliser un effort et un délai de développement
      fields:
      - label: Rôle dans le calcul
        items:
        - Relie la taille logique équivalente aux conditions du produit, de l’équipe et de l’environnement. Produit
          un effort et un délai modélisés, avec leurs phases.
      note: Le total COCOMO couvre les activités déclarées, au-delà du seul développement. Il ne mesure pas le temps
        historique de l’OSS.
      sources:
      - label: Présentation et référence COCOMO II — Boehm CSSE
        href: https://boehmcsse.org/tools/cocomo-ii/
    - title: COSMIC
      subtitle: Mesurer la taille fonctionnelle indépendamment du langage
      fields:
      - label: Rôle dans le calcul
        items:
        - Compte les mouvements fonctionnels de données E / R / W / X. Chaque mouvement vaut un CFP. Les contraintes
          internes ne créent pas automatiquement des points.
      note: COSMIC mesure une taille fonctionnelle. Une référence de productivité est nécessaire pour obtenir des
        JH.
      sources:
      - label: Manuel de mesure COSMIC — version 5
        href: https://cosmic-sizing.org/measurement-manual/
      - label: Processus de mesure et unité CFP
        href: https://cosmic-sizing.org/cosmic-sizing/intro/measurement-process/
    - title: ISBSG
      subtitle: Confronter l’estimation à des projets observés
      fields:
      - label: Rôle dans le calcul
        items:
        - 'Fournit des observations de productivité à rapprocher d’une mesure COSMIC : population, activités et
          conventions horaires doivent être comparables.'
      note: ISBSG complète la voie COSMIC. La productivité retenue reste une hypothèse de transposition à FLOW.
      sources:
      - label: Base Development & Enhancement — ISBSG
        href: https://www.isbsg.org/development-and-enhancement-data/
      - label: Questionnaires et collecte par méthode de mesure
        href: https://www.isbsg.org/submit-data/
  - kind: formula
    rule_ref: cocomo_effort
  - kind: formula
    rule_ref: cosmic_effort
  - kind: paragraphs
    items:
    - 'Présenter pour chaque OSS la base commune, les compléments FLOW et le total. COCOMO est non linéaire : les
      compléments se lisent par différence entre le total et la base commune.'
  - kind: formula
    rule_ref: nonlinear_complements
  - kind: bullets
    items:
    - Enregistrer coefficients, conventions horaires et phases. Ne pas appliquer une seconde remise pour la réutilisation
      déjà intégrée à la taille.
    - Aligner fonctions, activités et garanties avant d’interpréter les écarts. La productivité ISBSG et sa transposition
      restent à qualifier pour chaque famille.
    - 'Conserver les écarts de périmètre : fonctions natives excédentaires, activités rapprochées par convention,
      garanties de service non appariées.'
- id: etablir-charge
  title: Adopter une référence et ventiler les rôles
  lead: '**La décision désigne une référence et un pas d’arrondi. Le moteur les reproduit.**'
  blocks:
  - kind: paragraphs
    items:
    - '**La décision choisit la méthode adaptée au périmètre documenté.** Elle peut retenir COCOMO II à partir du
      code préparé, COSMIC × ISBSG à partir des fonctions, ou la somme de livrables détaillés. Chaque choix conserve
      son motif, ses hypothèses et son arrondi. Les composants communs gardent un financement unique.'
    - Les tailles incluent le code correspondant aux capacités, les adaptations, la réutilisation et les compléments
      Flow. Certains analogues de modules sont communs aux quatre calculs. Pour le produit professionnel, les studios
      et formulaires utilisent notamment le périmètre Axelor, et l’analytique utilise l’analogue le plus large du
      panel.
    - Les écarts comparent chaque résultat à la référence non arrondie. Les comparaisons COCOMO et COSMIC conservent
      leurs périmètres, même lorsqu’une estimation détaillée par livrable est adoptée.
  - kind: formula
    rule_ref: retained_rounding
  - kind: paragraphs
    items:
    - Les répartitions d’activités publiées et les clés proposées entre activités et rôles restent distinctes. L’allocation
      et ses arrondis conservent exactement les JH adoptés. QA, architecture et pilotage local déjà inclus ne sont
      pas ajoutés à nouveau.
  - kind: formula
    rule_ref: cocomo_schedule
  - kind: paragraphs
    items:
    - Le délai calculé concerne la famille et ses phases déclarées. Le calendrier global dépend aussi des disponibilités,
      dépendances et déploiements. Les délais locaux ne s’additionnent pas.
  - kind: links
    items:
    - href: '#calcul-net'
      label: Valoriser les JH retenus par rôle
- id: repartir-roles
  title: Passer des activités aux rôles
  lead: '**Charge totale → activités COCOMO → table de transcription FLOW → JH par rôle.** Une activité peut mobiliser
    plusieurs rôles et un rôle peut contribuer à plusieurs activités.'
  blocks:
  - kind: callout
    title: Une convention de cadrage pour le produit Java/Spring
    text: '**COCOMO fournit les parts d’activité. FLOW définit les clés entre rôles.** Les défauts ci-dessous reprennent
      les clés documentées du lot Stock pour un produit orienté services, avec une interface de consultation et
      d’administration. Leur emploi comme convention du framework est explicité le 5 novembre 2026. Ils permettent
      une première répartition sans chiffrer chaque tâche. Ce sont des choix d’organisation, à adapter au lot et
      à l’équipe.'
  - kind: bullets
    items:
    - '**Dimensionner les activités.** Pondérer les distributions COCOMO par l’effort des phases du périmètre retenu,
      puis les normaliser sur ce périmètre. On obtient la charge de chaque activité.'
    - '**Transcrire vers les rôles.** Appliquer la clé par défaut lorsque le lot correspond au contexte décrit.
      Examiner les conditions d’adaptation avant de retenir la répartition.'
    - '**Conserver la charge totale.** Chaque ligne répartit 100 % de son activité. Le moteur cumule les contributions
      et conserve les JH adoptés après arrondi. Les tests développeur restent dans la réalisation. Le pilotage du
      produit reste distinct du Transformation Office et de l’intégration transverse.'
  - kind: formula
    rule_ref: role_allocation
  - kind: activity_roles
    caption: Table de transcription FLOW · clés par défaut pour le cadrage Java/Spring
    columns:
    - Activité COCOMO
    - Clé par défaut
    - Justification de la convention
    - Quand adapter la clé
    source: audits/2026-10-30-stock-consolidation-09/results.json
    allocation_source: audits/2026-10-30-stock-consolidation-09/inputs.json
    activity_notes:
    - activity_ref: management
      rationale: Le pilotage local de l’équipe produit porte la planification, le suivi et la coordination de ses
        travaux. Toute cette activité est affectée au rôle correspondant.
      adapt_when: Pilotage partagé ou assuré par plusieurs intervenants. Répartir le travail local entre eux. Le
        pilotage du programme reste dans son financement propre.
    - activity_ref: environment
      rationale: La plateforme prend en charge l’essentiel des environnements, de la configuration et de l’automatisation.
        Les développeurs Java contribuent aux réglages applicatifs. Le partage 80/20 traduit cette responsabilité
        principale.
      adapt_when: Environnements déjà fournis, développeurs responsables des pipelines ou configuration importante
        de l’interface. Adapter les contributions. Exclure la reconstruction d’un socle déjà financé.
    - activity_ref: requirements
      rationale: L’analyste porte la définition fonctionnelle, les règles et les contrats métier. L’architecte intervient
        sur les exigences structurantes. Le partage 90/10 réserve une contribution technique ciblée.
      adapt_when: Exigences non fonctionnelles déterminantes, domaine nouveau ou contrats d’intégration complexes.
        Renforcer les contributions concernées. Un besoin déjà stabilisé peut réduire le travail d’analyse.
    - activity_ref: design
      rationale: Architecture et conception des services sont partagées à parts égales entre architecte et développeurs
        Java. Le reste couvre la conception de l’interface, l’ergonomie et la revue de sécurité.
      adapt_when: Interface riche, parcours métier nombreux, architecture distribuée complexe ou exigences de sécurité
        renforcées. Revoir les parts UX, interface, architecture et sécurité selon les responsabilités effectives.
    - activity_ref: implementation
      rationale: Le produit est principalement constitué de services et de règles Java. Une interface de consultation
        et d’administration représente une contribution minoritaire. Le partage 85/15 inclut les tests développeur
        dans chaque contribution.
      adapt_when: Édition métier riche, applications mobiles ou interface fortement personnalisée. Augmenter la
        part interface. Une interface standard réutilisée peut la réduire.
    - activity_ref: assessment
      rationale: La qualification indépendante est principalement confiée à la QA. Les développeurs Java et interface
        apportent le diagnostic et la vérification techniques. La sécurité réalise sa revue spécialisée. Le partage
        70/20/5/5 représente cette organisation.
      adapt_when: Tests de qualification davantage automatisés ou portés par les développeurs, QA intégrée à l’équipe,
        campagnes métier importantes ou audits de sécurité renforcés. Revoir les parts selon qui réalise le travail.
    - activity_ref: deployment
      rationale: La plateforme porte l’automatisation et la préparation de la mise en service du produit. Java assure
        les adaptations applicatives et le pilotage coordonne la livraison. Le partage 70/20/10 suit ces responsabilités.
      adapt_when: Livraison entièrement automatisée, opérations manuelles nombreuses ou processus de mise en production
        différent. Revoir les parts techniques et de coordination. L’intégration et le déploiement dans le Groupe
        gardent leur financement distinct.
  - kind: callout
    title: Comment lire les 70 % QA
    text: '**70 % de l’activité de vérification, pas 70 % du lot.** Cette clé suppose que la QA réalise la majorité
      de la qualification indépendante, avec une contribution technique des développeurs et une revue de sécurité.
      COCOMO dimensionne l’activité. Le partage entre personnes est la convention FLOW. Le taux de 70 % n’est ni
      une statistique COCOMO ni une mesure de productivité de l’équipe.'
  - kind: paragraphs
    items:
    - '**Adapter une clé demande un motif d’organisation, sans exiger d’emblée une estimation détaillée de toutes
      les tâches.** Décrire ce qui change par rapport au contexte par défaut, les contributions déplacées et les
      rôles concernés. Conserver 100 % par activité et tracer la décision, sa date et son périmètre.'
    - '**Affiner lorsque la décision en a besoin.** Une interface beaucoup plus riche, une campagne de qualification
      différente ou un partage de responsabilités nouveau peut justifier des estimations de tâches, une comparaison
      avec un projet similaire ou une revue d’experts. Les temps mesurés sur les premiers lots permettent ensuite
      de calibrer les clés.'
    - '**Une clé répartit le travail, elle ne dimensionne pas un supplément.** Si le changement ajoute des travaux
      ou un niveau de qualité supérieur, revoir aussi l’enveloppe de l’activité. Un déplacement entre rôles à charge
      constante ne finance pas ces travaux supplémentaires.'
  - kind: reference_cards
    cards:
    - title: COCOMO et FLOW ont chacun leur rôle
      subtitle: Distribution publiée et convention de transcription
      fields:
      - label: Référence publiée
        items:
        - COCOMO II Model Definition Manual, version 2.1 de 2000. Section 6.5.2, tables 57 et 58, pages imprimées
          64 à 66. Les distributions d’activités servent à préparer une première répartition des équipes, à adapter
          au projet.
      - label: Convention FLOW
        items:
        - Les pourcentages entre rôles reprennent la matrice Stock du 30 octobre 2026. Les motifs de cadrage et
          conditions d’adaptation du présent tableau rendent explicite leur emploi comme défauts. Ces pourcentages
          ne sont pas publiés par COCOMO.
      note: Les valeurs du manuel sont des points de départ. La table FLOW traduit les activités dans l’organisation
        envisagée, sans constituer une mesure des temps réels.
      sources:
      - label: COCOMO II · distributions et première répartition des équipes
        href: https://www.rose-hulman.edu/class/csse/csse372/201310/Homework/CII_modelman2000.pdf#page=68
      - label: Matrice d’origine des clés FLOW
        href: https://github.com/laurent-sintes/FLOW-Etude-Economique/blob/31906f6843c367b5a93da11a1d5c5ee1feebf586/audits/2026-10-30-stock-consolidation-09/inputs.json
    - title: Affiner et calibrer les clés
      subtitle: Références pour la suite du projet
      fields:
      - label: ISTQB · CTFL 4.0.1, 15 septembre 2024
        items:
        - Section 5.1.4, pages 49 et 50. Affiner les travaux de test par des historiques comparables, des mesures
          du projet ou des estimations d’experts confrontées.
      - label: GAO · guide GAO-20-195G, 12 mars 2020
        items:
        - Tracer les travaux, données et hypothèses. Examiner la sensibilité et actualiser l’estimation avec les
          réalisations.
      note: Ces références soutiennent la démarche d’affinage. Elles ne prescrivent pas les pourcentages entre rôles
        de la table FLOW.
      sources:
      - label: ISTQB · techniques d’estimation des tests
        href: https://istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf#page=49
      - label: GAO · construction et revue d’une estimation
        href: https://www.gao.gov/products/gao-20-195g
  - kind: paragraphs
    items:
    - '**Les décisions déjà adoptées conservent leur répartition.** La table du framework explique une convention
      de cadrage. Elle ne remplace pas automatiquement les matrices propres aux lots ou les JH par rôle adoptés
      directement. Les distributions COCOMO conservées pour comparaison restent distinctes de ces allocations.'
    - '**Des JH par rôle ne donnent pas encore un effectif.** Le nombre de personnes dépend du délai, des disponibilités
      et des travaux simultanés. L’organisation du delivery explicite ensuite les responsabilités fixes et les capacités
      à dimensionner.'
- id: qualifier-incertitude
  title: Consolider les lots et tracer la décision
  lead: '**Chaque lot conserve ses mesures, hypothèses, résultats comparatifs et choix d’adoption.**'
  blocks:
  - kind: bullets
    items:
    - Décrire les écarts en JH et pourcentage à la référence non arrondie, puis la dispersion. Les hypothèses communes
      et les analogues communs sont identifiés dans les preuves.
    - Donner accès aux versions OSS, chemins de code, tailles préparées, paramètres et résultats calculés pour retracer
      le passage des capacités aux JH adoptés.
    - Consolider les décisions adoptées après déduplication des financements. Ce cumul n’est pas une estimation
      COCOMO intégrée de tout le Core System.
    - Rapporter les capacités étudiées et retenues au périmètre total. Dire ce qui reste à instruire et quelle preuve
      pourrait améliorer la décision. Les inconnues ne valent pas zéro.
  - kind: links
    items:
    - href: '#evaluation-core'
      label: Consulter les décisions, leur périmètre et leurs preuves
