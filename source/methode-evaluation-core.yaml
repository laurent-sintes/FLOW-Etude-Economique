schema_version: 1
id: core-evaluation-opportunity
principle:
  title: Estimer la {{notion.core_system}} à partir des capacités et du code OSS
  text: '**Cartographie des capacités → composants OSS correspondants → taille préparée → COCOMO II → JH adoptés.**
    C’est la démarche de base du Make. Les OSS servent de références inspectables pour dimensionner les fonctions
    à construire en Java/Spring. COSMIC × ISBSG apporte une comparaison distincte. Les compléments du produit professionnel
    sont inventoriés séparément.'
notice:
  status_ref: core
tooling:
  label: Automatisation
  title: Un calcul reproductible depuis ses preuves
  skill: flow-evaluer-core-system
  text: Le skill prépare mesures et hypothèses. Le moteur reconstruit les tailles, vérifie les liens et reproduit
    les décisions à partir des versions, mesures et paramètres enregistrés.
navigation_label: Les cinq étapes de l’estimation
sections:
- id: delimiter-perimetre
  title: Définir l’unité et les activités couvertes
  lead: '**La cartographie des capacités fixe le périmètre à estimer. Le rapprochement avec les fonctions et composants
    OSS justifie les mesures retenues.**'
  blocks:
  - kind: bullets
    items:
    - 'Conserver les noms, identifiants et frontières de la capture native. Choisir une unité cohérente : capacité,
      Business Area ou ensemble métier justifiable.'
    - Pour chaque unité, relier les capacités à des fonctions observées dans les OSS, puis aux modules et chemins
      de code correspondants. Conserver versions, preuves de couverture, écarts et compléments FLOW.
    - Déclarer fonctions communes, compléments FLOW, exclusions et garanties attendues. Les adaptations propres
      au Groupe relèvent de l’intégration.
    - Lier le calcul à son unité, sa stack, sa version de périmètre et ses activités. Une nouvelle frontière exige
      de requalifier le calcul.
    - Pour des composants fortement liés, sommer leurs tailles et appliquer COCOMO une seule fois à l’unité cohérente.
      Une allocation entre familles ne crée pas des estimations indépendantes par capacité.
  - kind: callout
    title: Compléter le périmètre du produit professionnel
    text: Le référentiel des capacités est un entrant métier immuable. Il ne décrit pas tous les outils d’administration,
      de robustesse et de sécurité. Inventorier séparément ces fonctions dans fonctions-produit-core.yaml, les rapprocher
      des quatre suites et du financement existant. Classer Core Domain et Support selon la contribution à la valeur
      de Flow, y compris pour les outils utilisés par le métier. Ne pas convertir la répartition des rôles en répartition
      fonctionnelle. Une fonction non chiffrée reste inconnue, sans budget nul présumé.
- id: observer-fonctions
  title: Préparer les tailles et la réutilisation
  lead: '**Quatre références OSS rendent le dimensionnement inspectable.** PNCLOC désigne les lignes physiques non
    vides, hors commentaires. Ces sélections ne mesurent pas le produit entier et doivent être rapprochées des capacités
    avant préparation de la taille COCOMO II.'
  blocks:
  - kind: reference_cards
    cards:
    - title: ERPNext / Frappe
      subtitle: Un ERP métier porté par un framework de documents
      fields:
      - label: Périmètre fonctionnel
        items:
        - Achats, ventes, stocks et planification dans ERPNext. Frappe porte documents, droits, workflows et API.
          Insights complète l’analyse.
      - label: Langages et socle
        items:
        - Python et JavaScript dans Frappe/ERPNext, Vue/TypeScript dans Insights. DocTypes en JSON, MariaDB et Redis/Valkey.
      - label: Fonction marquante
        items:
        - Les DocTypes relient modèle de données, formulaires, droits et API dans un même cadre déclaratif.
      - label: Déploiements documentés
        items:
        - '**Chewy** : portail de contrats de remises fournisseurs adapté sur ERPNext.'
        - '**Vodafone UK** : commandes SIM et webshop spécifique. Édition et volumes non établis.'
      note: Relevé du 28 octobre 2026. Périmètre déployé et sources ci-dessous.
      sources:
      - label: Architecture Frappe
        href: https://docs.frappe.io/framework/user/en/basics/architecture
      - label: Cas Chewy publié par Frappe
        href: https://frappe.io/stories/Chewy
      - label: Cas Vodafone UK publié par Korecent
        href: https://korecent.com/case-study/success-story-of-vodafone-global
      measurement:
        product_ref: erpnext
        label: Code sélectionné et mesuré
    - title: Odoo Community
      subtitle: Un ERP modulaire avec un socle et une interface intégrés
      fields:
      - label: Périmètre fonctionnel
        items:
        - Achats, ventes, stocks, fabrication et socle web modulaire. Le panier mesuré ajoute le moteur OSS o-spreadsheet.
          Les modules Enterprise sont exclus.
      - label: Langages et socle
        items:
        - Python et PostgreSQL, modèles et ORM côté serveur, vues XML, interface JavaScript/Owl.
      - label: Fonction marquante
        items:
        - Des modules métier intégrés et extensibles, avec une interface web et des vues communes.
      - label: Déploiements documentés
        items:
        - '**Aurora Multimarket** : Odoo Community pour la planification du personnel des magasins. Ce cas ne démontre
          pas la gestion des stocks sur Odoo.'
        - '**Toyota Material Handling France** : ventes, achats, stock et fabrication dans un cas publié en 2017.
          Édition inconnue et usage actuel non reconfirmé.'
      note: Relevé du 28 octobre 2026. Périmètre déployé et sources ci-dessous.
      sources:
      - label: Code public et composition Odoo Community
        href: https://github.com/odoo/odoo
      - label: Cas Aurora publié par UBM Soft
        href: https://ubmsoft.com.ua/en/blog/our-blog-2/wfm-system-in-odoo-how-to-automate-personnel-management-23
      - label: Cas Toyota Material Handling publié par Odoo
        href: https://www.odoo.com/blog/customer-reviews-6/how-toyota-uses-odoo-after-just-6-months-of-integration-312
      measurement:
        product_ref: odoo-community
        label: Code sélectionné et mesuré
    - title: Tryton
      subtitle: Un socle métier modulaire et un code ouvert inspectable
      fields:
      - label: Périmètre fonctionnel
        items:
        - Achats, ventes, stocks, approvisionnement et production au moyen de modules indépendants. Le relevé retient
          le serveur, le client web et 25 modules opérationnels.
      - label: Langages et socle
        items:
        - Serveur Python avec ORM, base PostgreSQL, client web Sao en JavaScript et vues XML.
      - label: Fonction marquante
        items:
        - Composer et étendre les règles métier par modules Python, au-dessus de modèles et de transactions communs.
      - label: Déploiements documentés
        items:
        - '**Mifarma** : ERP relié au webshop, aux équipements de préparation et aux transporteurs.'
        - '**Coppernic** : achats, stock, production et livraison, avec des compléments adaptés. Versions et maintien
          en service non établis par ces cas non datés.'
      note: Relevé du 28 octobre 2026. Périmètre déployé et sources ci-dessous.
      sources:
      - label: Documentation des modules Tryton
        href: https://docs.tryton.org/
      - label: Cas Mifarma publié par Tryton
        href: https://www.tryton.org/success-stories/mifarma
      - label: Cas Coppernic publié par Tryton
        href: https://www.tryton.org/success-stories/coppernic
      measurement:
        product_ref: tryton
        label: Code sélectionné et mesuré
    - title: Axelor / Open Platform
      subtitle: Un socle Java et des applications métier configurables
      fields:
      - label: Périmètre fonctionnel
        items:
        - Achats, ventes, stocks et production dans Open Suite. Open Platform et Studio/BPM portent les modèles,
          interfaces et processus de l’assemblage étudié.
      - label: Langages et socle
        items:
        - Java, persistance Hibernate, modèles et vues XML, scripts Groovy et API REST. Client React/TypeScript
          pour la version de plateforme étudiée.
      - label: Fonction marquante
        items:
        - Associer modèles et vues déclaratifs à un studio de processus BPMN/DMN. La BI Enterprise est hors du panier
          OSS mesuré.
      - label: Déploiements documentés
        items:
        - '**thyssenkrupp Materials France** : production, stocks, achats, ventes et étiquetage. Le cas concerne
          cette filiale, pas le Core System du groupe.'
        - '**Octopia** : inscription et facturation de vendeurs tiers dans un cas de 2021. Édition et usage actuel
          non établis.'
      note: Relevé du 28 octobre 2026. Périmètre déployé et sources ci-dessous.
      sources:
      - label: Code et architecture Axelor Open Platform
        href: https://github.com/axelor/axelor-open-platform
      - label: Cas Octopia publié par Axelor
        href: https://axelor.com/fr/cas-client-cdiscount/
      - label: Cas thyssenkrupp Materials France
        href: https://axelor.com/fr/cas-client-tkmf/
      measurement:
        product_ref: axelor-open-suite
        label: Code sélectionné et mesuré
  - kind: table
    caption: Deux préparations selon les preuves disponibles
    columns:
    - Préparation
    - Traitement
    rows:
    - - Réutilisation native et compléments
      - Séparer code neuf, patrimoine réutilisé et adaptations. Pondérer le déclaratif et conserver les hypothèses
        d’assimilation.
    - - Composants mixtes et analogies de modules
      - Déduire le patrimoine déjà financé, attribuer une part supposée au métier et conserver un plancher mesuré.
        Dimensionner les nouveaux modules par analogie, puis ajouter modèles, vues et configurations.
  - kind: formula
    rule_ref: component_attribution
  - kind: formula
    rule_ref: module_analogy
  - kind: formula
    rule_ref: equivalent_size
  - kind: bullets
    items:
    - Figer versions, fichiers, comptages et empreintes. Une part de pertinence ou une fraction de module reste
      supposée, même si son calcul est reproductible.
    - Un mécanisme partagé a un propriétaire de financement. Le consommateur finance ses raccordements et adaptations.
      Le framework entier n’est pas reconstruit pour chaque famille.
  - kind: links
    items:
    - href: '#etude-marche'
      label: Examiner l’utilisation économique des références
- id: former-lots
  title: Calculer et confronter les deux voies
  lead: '**COCOMO estime l’effort. COSMIC mesure les fonctions. ISBSG apporte une référence de productivité.**'
  blocks:
  - kind: reference_cards
    cards:
    - title: COCOMO II
      subtitle: Modéliser un effort et un délai de développement
      fields:
      - label: Rôle dans le calcul
        items:
        - Relie la taille logique équivalente aux conditions du produit, de l’équipe et de l’environnement. Produit
          un effort et un délai modélisés, avec leurs phases.
      note: Le total COCOMO couvre les activités déclarées, au-delà du seul développement. Il ne mesure pas le temps
        historique de l’OSS.
      sources:
      - label: Présentation et référence COCOMO II — Boehm CSSE
        href: https://boehmcsse.org/tools/cocomo-ii/
    - title: COSMIC
      subtitle: Mesurer la taille fonctionnelle indépendamment du langage
      fields:
      - label: Rôle dans le calcul
        items:
        - Compte les mouvements fonctionnels de données E / R / W / X. Chaque mouvement vaut un CFP. Les contraintes
          internes ne créent pas automatiquement des points.
      note: COSMIC mesure une taille fonctionnelle. Une référence de productivité est nécessaire pour obtenir des
        JH.
      sources:
      - label: Manuel de mesure COSMIC — version 5
        href: https://cosmic-sizing.org/measurement-manual/
      - label: Processus de mesure et unité CFP
        href: https://cosmic-sizing.org/cosmic-sizing/intro/measurement-process/
    - title: ISBSG
      subtitle: Confronter l’estimation à des projets observés
      fields:
      - label: Rôle dans le calcul
        items:
        - 'Fournit des observations de productivité à rapprocher d’une mesure COSMIC : population, activités et
          conventions horaires doivent être comparables.'
      note: ISBSG complète la voie COSMIC. La productivité retenue reste une hypothèse de transposition à FLOW.
      sources:
      - label: Base Development & Enhancement — ISBSG
        href: https://www.isbsg.org/development-and-enhancement-data/
      - label: Questionnaires et collecte par méthode de mesure
        href: https://www.isbsg.org/submit-data/
  - kind: formula
    rule_ref: cocomo_effort
  - kind: formula
    rule_ref: cosmic_effort
  - kind: paragraphs
    items:
    - 'Présenter pour chaque OSS la base commune, les compléments FLOW et le total. COCOMO est non linéaire : les
      compléments se lisent par différence entre le total et la base commune.'
  - kind: formula
    rule_ref: nonlinear_complements
  - kind: bullets
    items:
    - Enregistrer coefficients, conventions horaires et phases. Ne pas appliquer une seconde remise pour la réutilisation
      déjà intégrée à la taille.
    - Aligner fonctions, activités et garanties avant d’interpréter les écarts. La productivité ISBSG et sa transposition
      restent à qualifier pour chaque famille.
    - 'Conserver les écarts de périmètre : fonctions natives excédentaires, activités rapprochées par convention,
      garanties de service non appariées.'
- id: etablir-charge
  title: Adopter une référence et ventiler les rôles
  lead: '**La décision désigne une référence et un pas d’arrondi. Le moteur les reproduit.**'
  blocks:
  - kind: paragraphs
    items:
    - '**Le panel comprend ERPNext/Frappe, Odoo Community, Tryton et Axelor. Les décisions adoptées sélectionnent
      Axelor pour chacun des lots Java/Spring.** Les trois autres ERP fournissent des résultats comparatifs.
      Le montant retenu est le résultat COCOMO II de la référence sélectionnée, arrondi selon la décision.'
    - Les tailles incluent le code correspondant aux capacités, les adaptations, la réutilisation et les compléments
      Flow. Certains analogues de modules sont communs aux quatre calculs. Pour le produit professionnel, les studios
      et formulaires utilisent notamment le périmètre Axelor, et l’analytique utilise l’analogue le plus large du panel.
    - Les écarts comparent chaque résultat à la référence non arrondie. COSMIC × ISBSG reste une comparaison séparée.
  - kind: formula
    rule_ref: retained_rounding
  - kind: formula
    rule_ref: role_allocation
  - kind: paragraphs
    items:
    - Les répartitions d’activités publiées et les clés proposées entre activités et rôles restent distinctes. L’allocation
      et ses arrondis conservent exactement les JH adoptés. QA, architecture et pilotage local déjà inclus ne sont
      pas ajoutés à nouveau.
  - kind: formula
    rule_ref: cocomo_schedule
  - kind: paragraphs
    items:
    - Le délai calculé concerne la famille et ses phases déclarées. Le calendrier global dépend aussi des disponibilités,
      dépendances et déploiements. Les délais locaux ne s’additionnent pas.
  - kind: links
    items:
    - href: '#calcul-net'
      label: Valoriser les JH retenus par rôle
- id: qualifier-incertitude
  title: Consolider les lots et tracer la décision
  lead: '**Chaque lot conserve ses mesures, hypothèses, résultats comparatifs et choix d’adoption.**'
  blocks:
  - kind: bullets
    items:
    - Décrire les écarts en JH et pourcentage à la référence non arrondie, puis la dispersion. Les hypothèses communes
      et les analogues communs sont identifiés dans les preuves.
    - Donner accès aux versions OSS, chemins de code, tailles préparées, paramètres et résultats calculés pour
      retracer le passage des capacités aux JH adoptés.
    - Consolider les décisions adoptées après déduplication des financements. Ce cumul n’est pas une estimation
      COCOMO intégrée de tout le Core System.
    - Rapporter les capacités étudiées et retenues au périmètre total. Dire ce qui reste à instruire et quelle preuve
      pourrait améliorer la décision. Les inconnues ne valent pas zéro.
  - kind: links
    items:
    - href: '#evaluation-core'
      label: Consulter les décisions, leur périmètre et leurs preuves
examples: []
next:
  href: '#calcul-net'
  label: Passer des efforts retenus au budget
