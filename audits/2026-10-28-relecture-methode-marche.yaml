date: '2026-10-28'
objet: Relecture de la page suivante du framework, Évaluation de marché.
route: '#marche'
sources_modifiees:
- source/methode-evaluation-marche.yaml
- config/application.yaml
- source/README.md
structure:
- Définir la comparaison.
- Qualifier la preuve.
- Construction, fonctions et effort.
- Intégration, travaux et prix.
- Fonctionnement, services et contrats.
- Transmission des références aux estimations.
clarifications:
- Six étapes au lieu de huit, chacune avec raison, traitements et résultat explicite.
- Trois exemples fictifs supprimés, emphases ciblées, absence de nouveaux encarts.
- Volets de recherche distincts des tags Build/Run, MCO Core classé Build.
- Skill limité aux JH développeur bruts, tests développeur inclus, QA indépendante et autres efforts distincts.
- Prix d’origine, normalisation et transposition séparés ; aucune transposition automatique.
- Formule nominale COCOMO par composant et formule de normalisation monétaire explicitées.
- Diagnostic de code non calibré sur FLOW ; paramètres conservés dans la fiche propriétaire.
- Six axes et six fiches produit conservés, présentés comme références disponibles et vérifications à réaliser.
validation:
  relectures: Audits indépendants éditorial, formules et catalogue, puis relecture du candidat.
  suite_complete: 173 tests Python réussis ; tests JavaScript, types, contenu et build réussis.
  parite: Témoin de simulation préservé ; aucun changement des résultats économiques des cinq options.
  derniers_libelles: Contrôle de contenu relancé après deux précisions éditoriales finales.
  rendu: Six étapes, six résultats, trois tableaux et deux formules visibles.
  clavier: Sommaire testé avec Entrée, focus placé sur le titre ; fermeture des fiches restaure le focus.
  responsive: Contrôlé à 800 et 390 pixels ; aucun débordement de page ou de formule, tableaux à défilement contenu et accessibles au clavier.
  navigation: Suite depuis la méthode Run et lien vers Paramètres du modèle vérifiés.
  serveur: Application locale actualisée sur le même port.
  capture: output/methode-marche-formules.jpg
economic_change: false
