statut: proposition_non_appliquee
remplace_pour_la_proposition: 2026-10-27-selection-contractualisation-buy.yaml
constat:
  consultation: Le dossier Synvance est réutilisable mais ne démontre pas l'achèvement d'un RFP contractuel.
  copil: COPIL 5 page PDF 8 recommande d'initialiser la phase 1 du RFP et un pré-cadrage avec les équipes internes et les deux fournisseurs ; complexités, roadmap, lotissement, ressources et budget restent à affiner.
  microsoft: Avanade page PDF 39 qualifie son chiffrage de ROM non engageant, à réviser en avant-vente pour produire une proposition formelle. Page 38, les conditions de signature/activation concernent 2025 ; actualisation nécessaire, sans présumer du nouveau prix.
  sap: Delaware page PDF 38 précise que l'estimation ne préjuge pas d'une proposition commerciale liée à un RFP projet.
  consequence: Douze semaines constituent un cas de finalisation accélérée, pas la base centrale de préparation d'une décision Groupe à partir des seules pièces disponibles.
rapprochement:
- poste: Périmètre et qualification décisionnelle
  microsoft: Analyse/configuration, tests et validation sont dans le pilote Avanade p.39 ; exclure leur réalisation de l'assistance de sélection.
  sap: Inception, Blueprint, SIT/UAT et autres phases sont dans les lots Delaware p.39–40 ; ne pas reconstruire ces livrables en assistance amont.
  retenu: Revue des réponses, arbitrage du périmètre et critères d'acceptation pour décider ; travaux de conseil côté client, pas production du dossier de conception fournisseur.
  deduction_documentee_eur: 0
- poste: Architecture et gouvernance
  microsoft: Gouvernance & Architecture figure au pilote Avanade p.39 ; aucune preuve qu'il s'agisse d'assistance indépendante à l'achat avant engagement.
  sap: Gouvernance, coordination et infrastructure figurent aux lots p.39–40 ; prestations de programme déjà financées.
  retenu: Analyse indépendante des engagements et risques du finaliste ; exclure architecture détaillée, configuration, pilotage de réalisation et recette technique.
  deduction_documentee_eur: 0
- poste: Support Microsoft initial
  montant_eur: 90000
  preuve: sources/client/microsoft-questionnaire.xlsx#8. Estimations budgétaires!C13:D13
  contenu: Unified + Project Quality advisory incluant 200 heures d'ingénierie Microsoft, phase Build/Run, coût année 1.
  decision: Pas de crédit démontré sur le conseil acheteur ou juridique. Ni les 90 k€ ni les 200 heures ne sont convertis en économie de sélection. Toute mobilisation avant signature exige preuve de disponibilité, livrable et substitution explicite.
  deduction_documentee_eur: 0
- poste: Services annuels SAP
  preuve: sources/client/delaware-septembre.pdf#page=37
  decision: MCO, monitoring et TMA sont indiqués après stabilisation ; ne financent pas la sélection-contractualisation amont.
  deduction_documentee_eur: 0
- poste: Préparation Buy du modèle
  montant_par_option_eur: 20000
  preuve: source/calibration-couts.yaml#couts_communs/preparation_buy
  implementation: tools/calculate_costs.py#calculate_option
  nature: Provision FLOW ajoutée au forfait fournisseur ; les pièces examinées ne donnent pas un bordereau d'achat ni un contenu suffisant pour prouver son équivalence.
  decision: Proposition de réaffectation budgétaire entière vers la préparation de l'achat, avec retrait simultané de la ligne initiale d'intégration. Ce n'est ni une remise fournisseur ni une prestation prouvée incluse.
  condition: Confirmer qu'aucun autre besoin, prestation commandée ou consommation technique ne mobilise déjà cette provision. Sinon la maintenir et retenir le coût net sans crédit.
  deduction_documentee_eur: 0
  reaffectation_proposee_eur: 20000
- poste: Actualisation commerciale et contractualisation
  decision: Réponses et chiffrages commerciaux attendus des fournisseurs ; assistance de négociation et revue juridique commandées par le Groupe. Aucun financement client déjà identifié pour cette assistance dans les pièces examinées.
  limite: L'avant-vente fournisseur est supposée non facturée ; tout pré-cadrage fournisseur payant ou PoC constitue une commande à rapprocher avant ajout.
charges_revisees:
  unite: JH d'assistance externe côté client
  tarifs: Hypothèses identiques à la proposition initiale, non devis ; 850/1000 EUR HT/JH sont des niveaux de provision, 1200 EUR HT/JH une provision juridique à confirmer.
  lignes:
  - {id: perimetre, ancien_jh: 8, jh: 12, tarif: 850, motif: Ateliers de confirmation du périmètre Groupe et réutilisation du dossier existant.}
  - {id: qualification_ciblee, ancien_jh: 16, jh: 28, tarif: 850, motif: Pré-cadrage décisionnel des deux options et itérations sur les écarts métier et déploiements.}
  - {id: architecture_exploitabilite, ancien_jh: 12, jh: 16, tarif: 1000, motif: Revue acheteur des engagements et risques du finaliste sans conception technique.}
  - {id: actualisation_commerciale, ancien_jh: 10, jh: 16, tarif: 1000, motif: Révision des offres datées et rapprochement des paniers puis négociation du finaliste.}
  - {id: contractualisation, ancien_jh: 10, jh: 14, tarif: 1200, motif: Itérations contractuelles et approbations Groupe ; un seul finaliste.}
  - {id: coordination_decision, ancien_jh: 8, jh: 24, tarif: 850, motif: Quatre JH par mois pendant six mois pour préparation et suivi des arbitrages ; hors gouvernance de réalisation.}
  cartographie: source/parcours-integration.yaml et source/qualification-buy.yaml ; confirmer règles, parcours, flux, données et critères de réception sur les capacités existantes, sans refaire la cartographie ou multiplier le prix par scénario.
  exclusions: Synvance passé, production des réponses fournisseurs, conception et réalisation de l'intégration, recette technique, abonnements, PoC payant, temps interne ; aucune charge supprimée n'est réputée gratuite.
cout_net_propose:
  devise: EUR HT
  brut_initial: 61200
  ancien_net_si_reaffectation: 41200
  augmentation_travaux: 42000
  brut_revise: 103200
  credit_fournisseur_demontre: 0
  reaffectation_preparation_buy: 20000
  net_conditionnel: 83200
  net_sans_reaffectation: 103200
  identique_pour: [microsoft, sap]
  interpretation: Réserver 103200 EUR de capacité d'achat ; supplément au modèle de 83200 EUR uniquement si les 20000 EUR de préparation sont transférés et retirés de l'intégration. À défaut, supplément de 103200 EUR. Aucune preuve ne justifie aujourd'hui un net Microsoft inférieur au net SAP.
  non_addition: Une seule décision Buy à financer ; ne pas additionner les deux colonnes comme deux achats.
delai_net_propose:
  central_mois: 6
  central_semaines_approx: 26
  resserre_mois: 4
  prudent_mois: 9
  phases:
  - {fenetre_mois: [0, 1], objet: Réutilisation Synvance, mobilisation et périmètre de décision.}
  - {fenetre_mois: [1, 3], objet: Pré-cadrage ciblé et démonstrations des deux options ; arbitrages métier.}
  - {fenetre_mois: [2, 4], objet: Paniers et propositions révisés, vérifications et choix préférentiel.}
  - {fenetre_mois: [4, 5], objet: Négociation et contractualisation du finaliste.}
  - {fenetre_mois: [5, 6], objet: Approbations, derniers écarts et signature ; autorisation de lancer l'intégration.}
  origine: Date à laquelle le Groupe autorise cette préparation, à partir des pièces examinées ; si une partie du RFP a été réalisée depuis, retrancher les étapes effectivement terminées.
  recouvrement_prouve_mois: 0
  convention: Ajouter six mois avant les 38 mois Microsoft ou 30 mois SAP du modèle, uniquement comme proposition conservatrice à défaut de planning de recouvrement démontré. Les phases de conception et de préparation déjà incluses restent dans l'intégration ; le pré-cadrage proposé est limité à la décision d'achat.
  totaux_depuis_decision_mois: {microsoft: 44, sap: 36}
  limites: Ce ne sont pas des délais prouvés par les offres. Un travail réalisé avant signature et accepté comme livrable de projet doit être déduit de sa charge et de son calendrier futurs sur preuve, sans retrancher arbitrairement les phases Explore ou Inception.
  abonnements: Ne pas déclencher automatiquement les licences pendant les six mois. La pièce Microsoft p.38 lie signature et activation dans son offre 2025 ; négocier les dates effectives et préserver les séquences, sans prix ou crédit nouveau présumé.
