    cardinality: one-to-zero-or-one
    meaning: 'Voie fonctionnelle : mouvements de données.'
  - id: values_cfp
    source: calculation
    target: isbsg_reference
    cardinality: one-to-zero-or-one
    meaning: COSMIC mesure la taille. ISBSG apporte une référence de productivité, pas une troisième estimation indépendante.
  - id: estimates
