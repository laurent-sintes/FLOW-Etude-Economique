  - id: purpose_share
    source: purpose_partition
    target: product_purpose
    cardinality: many-to-many
    meaning: Une part déclarée de JH par rôle compte une fois. Une part inconnue reste non ventilée, sans devenir
      zéro.
  - id: proposal_units
    source: product_estimate_proposal
