  - id: assesses_business_area
    source: business_area_assessment
    target: native_business_area
    cardinality: many-to-one
    meaning: Rassemble les appuis partiels sans certifier toute la Business Area.
  - id: assesses_product
    source: business_area_assessment
    target: market_reference
