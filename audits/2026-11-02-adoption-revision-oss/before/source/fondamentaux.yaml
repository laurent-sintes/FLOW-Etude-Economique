purpose_reading:
  model_object_ref: product_purpose
  scope_entity_ref: core_system
  purpose_refs:
  - core-domain
  - support
  intro: '**La {{notion.core_system}} comprend à la fois le {{notion.core_domain}} et le {{notion.product_support}}.**
    Les deux contributions appartiennent au produit, indépendamment de son mode d’obtention.'
  axes:
  - label: Make / Buy
    text: 'Comment obtenir le produit : le construire ou acheter une solution.'
  - label: Build / Run
    text: 'Quelle activité financer : réaliser et faire évoluer, ou assurer le service courant.'
  - label: '{{notion.core_domain}} / {{notion.product_support}}'
    text: 'Quelle valeur apporter : les fonctions distinctives du produit ou les services génériques qui les soutiennent.'
  examples:
  - title: Réassort
    purpose_ref: core-domain
    text: Décider quels articles réapprovisionner et en quelle quantité.
  - title: Allocation des stocks
    purpose_ref: core-domain
    text: Répartir le stock selon les priorités métier du produit.
  - title: Formulaires génériques
    purpose_ref: support
    text: Saisir des informations avec un outil réutilisable entre domaines.
  - title: Processus génériques
    purpose_ref: support
    text: Exécuter et suivre des étapes avec un moteur partagé.
  note: '**Support ne signifie pas Run.** Construire un outil générique relève du Support et du Build. L’exploiter
    au quotidien relève du Support et du Run.'
  positioning_note: Ce positionnement ne crée aucun budget et ne ventile pas automatiquement les offres Buy.
