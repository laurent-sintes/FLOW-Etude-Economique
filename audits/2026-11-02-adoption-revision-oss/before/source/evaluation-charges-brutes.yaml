phases:
  acquisition:
    intro: '**Le produit à construire ou la solution à acquérir.** Les efforts Make sont présentés avant valorisation
      par les tarifs. Les travaux acheteur Buy restent séparés des offres d’intégration.'
    summaries:
      java-spring: Le résultat adopté couvre la réalisation du produit et ses activités associées. La proposition
        de révision reste distincte et ne modifie pas les budgets.
      microsoft: Les travaux de sélection et de contractualisation sont dimensionnés côté acheteur. Le prix d’obtention
        du produit n’est pas isolé dans les pièces reçues.
      sap: Les travaux de sélection et de contractualisation sont dimensionnés côté acheteur. Le prix d’obtention
        du produit n’est pas isolé dans les pièces reçues.
  integration:
    intro: '**Les travaux pour rendre le Core System opérationnel dans le Groupe.** Les charges Make et les forfaits
      Synvance conservent chacun leur périmètre.'
    summaries:
      java-spring: Le scénario central réunit les travaux communs, les déploiements sur les pôles du Groupe et
        le pilotage du programme. Les provisions de coordination technique restent exprimées en euros.
      microsoft: Le prix d’intégration provient de la projection Groupe du COPIL. Le support et le conseil qualité
        initiaux sont ponctuels. Les compléments du modèle se lisent dans le dossier économique.
      sap: Les lots de la proposition donnent un prix d’intégration. Upgrade Finance est compris dans leur total.
        Les compléments du modèle se lisent dans le dossier économique.
  fonctionnement:
    intro: '**Une année de fonctionnement et les séquences tarifaires documentées.** Les charges humaines, les
      achats techniques et les contrats groupés sont distingués.'
    summaries:
      java-spring: L’année de référence couvre support, corrections, versions, exploitation et évolutions. Les
        achats techniques et le pilotage financé en euros sont présentés séparément.
      microsoft: L’abonnement regroupe les droits, le standard et le cloud. Le prix récurrent des adaptations
        reste non isolé. Le support initial ponctuel est présenté avec l’intégration.
      sap: Les prix distinguent l’abonnement progressif, le MCO des adaptations, les évolutions et la surveillance
        des flux. Leurs périodes et périmètres restent ceux des pièces reçues.
unit_arbitrations:
  master-data-java-spring: Axelor conservé pour l’ancre Master Data et ses compléments documentés. Les trois autres
    OSS restent des contrepoints, sans moyenne automatique.
  stock-java-spring: Axelor conservé pour les stocks, mouvements et corrections. Les écarts des autres OSS ne
    justifient pas de remplacer cette référence métier.
  inventory-ownership-java-spring: Axelor pour le contexte et les conditions. Odoo pour les quantités et dimensions
    propriétaire. ERPNext pour les actes, corrections et transferts. Tryton pour la régularisation. Les règles
    propres à Flow et la structure Java sont conservées.
  supply-controls-java-spring: Odoo remplace le petit analogue Axelor pour les politiques de contrôle. Les schémas
    Java et les autres compléments restent inchangés.
  orders-java-spring: Axelor conservé pour les commandes et leurs compléments. Les autres références éclairent
    la dispersion, sans apport retenu au nouveau total.
  master-plan-java-spring: Ancre de planification Axelor conservée. ERPNext apporte une préparation du plan filtrée,
    sans intégrer les moteurs de fabrication et de nomenclatures hors périmètre.
  supply-decisions-java-spring: ERPNext pour l’allocation et la disponibilité. Odoo pour les calendriers. Les
    compléments Java propres à Flow restent dans le lot.
  service-fulfilment-java-spring: ERPNext pour les services assurance, transport et finance. Axelor pour les corrections
    proches du cas douanier. Les contrats et règles Flow restent à réaliser en Java.
  process-management-java-spring: Retrait des composants de configuration fournis avant application de la fraction
    du studio. Les formulaires Axelor et les graphes Odoo déjà partagés restent financés une seule fois.
  supply-workbenches-java-spring: Axelor conservé pour les ateliers métier. Le calendrier Tryton seul et les surfaces
    Odoo plus larges ne représentent pas le même périmètre de travail.
  professional-it-java-spring: Retrait des composants MFA, LDAP, Pac4j et des chargeurs déjà fournis avant les
    fractions de transposition. Les fonctions d’administration, d’exploitation et de données propres au produit
    sont conservées.
