  core_note: Le total adopté est la somme des décisions par lot. La proposition reprend les arbitrages entre les
    quatre OSS. Les tailles équivalentes sont traitées par COCOMO II avec les paramètres et les arrondis des décisions
    actuelles.
  core_construction: Le panel comprend Axelor, ERPNext, Odoo et Tryton. La référence adoptée retient Axelor pour
    chacun des lots, avec ses compléments et composants partagés. La proposition conserve cette base quand elle
    est pertinente et remplace certains analogues par des composants mieux ajustés au périmètre Flow.
  quote_note: Les prix ci-dessous conservent le périmètre et la période des pièces d’origine. Un montant « dont
    » est une partie du total. Les contrats groupés restent groupés. Il n’y a pas de total entre des périodes
    ou des périmètres différents.
