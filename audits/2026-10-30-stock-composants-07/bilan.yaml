  extension_hypotheses: 4
  field_hypotheses: 126
  does_not_bound_JH: true
  service_objectives_still_unknown: true
what_progressed:
- Une même frontière fonctionnelle est déclarée par composant dans les quatre références ; les compléments Flow
  ne sont plus noyés dans leur code.
- Partages entre registre, positions, inventaire et réservation dédupliqués au niveau des fichiers/composants, avant
  tout effort.
- Recouvrements exacts du patrimoine natif Master Data retirés des empreintes supplémentaires, sans remise forfaitaire.
- Chaque complément a un contenu inclus/exclu, un inventaire de données, les services réutilisés et les inconnues
  ; aucun montant n’est déduit de ces seules limites.
what_prevents_JH:
- Les composants complets contiennent quantité, prix, opérations physiques, allocation ou commandes dans des proportions
  différentes selon le produit.
- Retirer un pourcentage uniforme serait une hypothèse sans preuve ; isoler seulement les petites méthodes ramènerait
  au biais déjà mesuré.
- Les 66 traitements et 126 champs sont des hypothèses de conception, pas une preuve de taille complète des adaptations
  Flow.
- Les garanties de service restent partiellement ouvertes. Les 169 CFP / 20 h par CFP restent un repère conditionnel,
  pas quatre calculs COCOMO.
