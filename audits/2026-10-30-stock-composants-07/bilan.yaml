id: stock-composants-07
status: quatre_perimetres_fonctionnels_proposes_charges_non_recevables
outcome: Les quatre périmètres sont rapprochés au niveau de composants cohérents. Les références sont mesurées sans
  doublons et les compléments Flow bornés en contenu ; aucune nouvelle estimation JH défendable.
common_components:
- id: K1
  label: Registre et effets des mouvements
  common_boundary: Identités produit/lieu/unité déjà disponibles ; faits connus, pas de mouvements inventés. Le
    protocole d’admission externe, la double date et les corrections liées Flow restent des compléments.
- id: K2
  label: Positions et apports attendus connus
  common_boundary: Une projection de quantité ne vaut ni promesse ni décision d’allocation. Les sources restent
    maîtres des commandes/plans ; leur création n’est pas reconstruite.
- id: K3
  label: Comptages et ajustements
  common_boundary: Pas de WMS mobile, orchestration de tournée ou moteur de valorisation. Les protocoles et rapprochements
    temporels Flow restent explicites.
- id: K4
  label: Engagements de quantité
  common_boundary: Pas de choix optimal de ressource, routage ou allocation commerciale. Quantité/portion demandées
    fournies ; expiration et rejeu métier Flow à adapter.
- id: K5
  label: Contrats de fourniture aux autres fonctions
  common_boundary: Contrats Flow de planification, Finance et constats produit. Pas quatre implémentations natives
    équivalentes revendiquées ; aucune comptabilité générale, aucun PLM.
