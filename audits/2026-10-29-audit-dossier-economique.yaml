date: '2026-10-29'
statut: Audit uniquement ; recommandations non appliquées.
revision_auditee: 4b83550f1951a85cc39a49ed9f3aaff8426e8cb2
perimetre:
  pages: ['#etude-marche', '#parametres', '#evaluation-core', '#comparer', '#se-projeter', '#simuler']
  inclus:
  - Ordre de lecture, rédaction, densité et cohérence avec le Framework.
  - Provenance visible, assiettes, temporalités, hypothèses retenues et limites de comparaison.
  - Fiches marché, explications des résultats et renvois aux entrants et à la capacité de réalisation.
  - Posture du sponsor et aide à la décision dans une perspective de dix ans.
  exclus:
  - Recalibration ou jugement externe sur le juste niveau des montants.
  - Rafraîchissement Internet des références et nouvelle qualification des fournisseurs.
  - Modification des paramètres, contrats ou sauvegardes personnelles.
  - Recommandation de choisir Make, Microsoft ou SAP.
posture:
  rappel: Plateforme de marques comme ambition, Core première étape, préférence Make à instruire et capacité eXalt à démontrer.
  exigence: Permettre au sponsor de comprendre ce qu’il finance, à quelle échéance, pour quel périmètre et avec quelles conditions de réalisation.
  neutralite: Préserver les acquis Synvance et appliquer les mêmes exigences de preuve aux options ; ne pas utiliser la défiance rapportée envers SAP comme critère de calcul.
avis:
  synthese: Le dossier est exploitable pour explorer des scénarios. Il n’est pas encore assez clair pour être présenté seul comme support de décision d’investissement sur dix ans.
  cause: Les sources expliquent les limites avec rigueur, mais ces limites et leurs preuves ne suivent pas suffisamment le lecteur jusqu’aux comparaisons finales.
  distinction: Les écarts établis concernent le sens des résultats et leur restitution. Cet audit ne démontre pas une erreur de montant ni une justesse économique indépendante de toutes les hypothèses.
acquis:
- Sources économiques et moteur uniques, référence distincte des simulations personnelles.
- Prix d’origine, normalisation et transposition FLOW distingués ; les transpositions non établies ne deviennent pas zéro.
- Limites des références marché et du diagnostic COCOMO explicites ; absence de recalibration des charges historiques par le skill reconnue.
- Écarts de périmètre SAP et exclusions de transformation explicités dans Évaluations économiques.
- Base annuelle distinguée des dépenses du calendrier et d’un total analytique Run ; contrats Buy groupés conservés.
- Gains IA, coordination et enveloppes techniques présentés comme des hypothèses, non comme des performances observées.
- Unités HT visibles, sommaires des dossiers justificatifs, cinq options accessibles et absence de débordement global sur les six pages observées.
constats:
- id: sens_du_service_et_du_reste
  priorite: P1
  pages: ['#simuler', '#se-projeter']
  constat: La carte « Service complet » affiche des années de service obtenues dans la fenêtre, pas un délai de mise en service. « Reste à financer » désigne le solde initial et transitoire, pas les dépenses récurrentes futures.
  preuve_observee: À dix ans, Java affiche 3,5 années de service et un début de service au mois 78 ; SAP affiche 7 années et un début au mois 36. Ces valeurs existantes peuvent être comprises à l’envers avec le libellé actuel. Le reste initial est nul à cet horizon sans que le fonctionnement ultérieur soit gratuit.
  consequence: Risque d’inverser la comparaison des délais et de mal comprendre la portée d’un solde nul.
  recommandation: Employer « Années de service complet à cet horizon » et « Reste à financer pour achever la réalisation ». Présenter séparément le mois de service complet lorsqu’on exprime un délai. Réutiliser les notions et données déjà présentes.
  references: ['app/src/EssentialViews.tsx:46', 'config/application.yaml:1659', 'config/application.yaml:1661', 'tools/study_app.py:181', 'tools/study_app.py:191', 'tools/study_app.py:194', 'source/glossaire.yaml:133']
- id: assiette_charge_core
  priorite: P1
  pages: ['#evaluation-core']
  constat: Le texte désigne les charges centrales et leurs bornes comme des JH développeur bruts, alors que le moteur additionne les six natures de travaux, qualification indépendante comprise. La notice placée juste après précise correctement cette inclusion.
  consequence: Confusion entre la sortie cible du skill et la base historique actuellement valorisée ; risque de compter ou d’exclure la QA à tort.
  recommandation: Nommer l’assiette actuelle « Charge de réalisation avant gains, QA comprise et hors coordination technique ». Réserver les JH développeur bruts à leur définition dans la méthode cible. Ne retirer aucune charge et ne recalculer aucun montant.
  references: ['config/application.yaml:1267', 'app/src/CoreEvaluationPage.tsx:11', 'tools/study_app.py:585', 'source/recalibration-metier.yaml:5', 'source/statut-evaluation.yaml:9']
- id: cadre_des_comparaisons
  priorite: P1
  pages: ['#comparer', '#se-projeter', '#simuler']
  constat: Les graphiques Comparer et Se projeter ne reprennent pas à proximité les réserves de périmètre, exclusions et maturité affichées dans Évaluations. Se projeter montre les cumuls sans les années de service ni le reste initial, pourtant déjà calculés. Les notes de chaque agrégat dans structure.phases ne sont pas rendues.
  consequence: Un lecteur arrivant directement sur les résultats peut traiter les montants comme des coûts complets à périmètre et service équivalents, ou comme le financement de toute la plateforme de marques.
  recommandation: Rendre visible un cadre commun bref, issu des textes canoniques, et rapprocher dépenses, disponibilité du service et solde initial. Expliciter la différence entre construction Make et sélection Buy, ainsi qu’entre budget initial et base annuelle. Aucun retraitement du périmètre ni calcul de coût par année de service implicite.
  references: ['source/application-framework.yaml:9', 'config/application.yaml:1619', 'config/application.yaml:1625', 'config/application.yaml:1933', 'app/src/EssentialViews.tsx:65', 'app/src/EssentialViews.tsx:79']
- id: justification_accessible
  priorite: P1
  pages: ['#parametres', '#evaluation-core', '#comparer', '#se-projeter', '#simuler']
  constat: Les liens YAML masqués ont supprimé plusieurs accès aux travaux Core, à l’intégration Make et au fonctionnement. Les explications de graphiques restent génériques. Certains textes de justification déjà transportés ne sont pas rendus, notamment les méthodes des enveloppes cloud et iPaaS et les justifications QA et architecture.
  preuve_observee: Dix fenêtres d’explication examinées sur les trois pages de résultats ne fournissent aucun lien de provenance. Leur texte explique l’agrégat, sans montrer la construction du chiffre propre à l’option.
  consequence: La promesse « D’où vient ce chiffre ? » est plus forte que le niveau de vérification offert au sponsor.
  recommandation: Conserver le masquage YAML et restituer en lecture continue les travaux, assiettes, hypothèses et preuves depuis leurs propriétaires. Distinguer une explication de calcul d’une preuve. Ajouter des renvois applicatifs et des pièces originales là où elles existent.
  references: ['app/src/CoreEvaluationPage.tsx:14', 'app/src/EconomicEvaluationsPage.tsx:40', 'app/src/FrameworkPage.tsx:103', 'app/src/FrameworkPage.tsx:167', 'app/src/EssentialViews.tsx:18', 'tools/study_app.py:268']
- id: qualification_marche_consultable
  priorite: P1
  pages: ['#etude-marche']
  constat: L’avancement est présenté sous forme de compteurs ; les qualifications détaillées, leurs inconnues et leurs revues ne sont pas accessibles. La référence YAML correspondante est masquée et les fiches produit exposent une autre synthèse, par axe.
  donnees_constatees:
    capacites_comparees: 84
    produits: 6
    couples: 504
    sans_instruction: 354
    reperes_par_axe: 139
    analyses_detaillees_engagees: 11
    qualifications_retenues: 0
  consequence: L’expert peut lire une activité documentaire, mais ne peut pas vérifier les observations ni la maturité exacte de l’instruction au grain du besoin.
  recommandation: Rendre les qualifications consultables par capacité et produit, avec observation, preuve, différences, inconnues et état de revue. Afficher explicitement la distinction entre analyse engagée et qualification retenue. Aucun score de couverture ni budget dérivé.
  references: ['app/src/MarketStudyPage.tsx:65', 'tools/study_app.py:569', 'tools/market_instruction.py:96', 'source/instruction-marche.yaml']
- id: prix_normalises_et_reserves
  priorite: P1
  pages: ['#etude-marche']
  constat: Les prix normalisés des références projet sont affichés sans accès direct aux taux, indices et dates utilisés ; le lien prévu cible un YAML masqué. Des réserves propres aux montants ne sont pas rendues dans le tiroir.
  consequence: Le calcul intermédiaire le plus technique semble précis tout en restant difficile à contrôler dans l’interface.
  recommandation: Exposer une lecture courte des conventions de normalisation et les réserves propres à la référence, avec preuves disponibles, sans changer les prix ni rétablir les téléchargements YAML.
  references: ['tools/market_reading.py:56', 'app/src/MarketReferenceDrawer.tsx:37', 'source/references-couts-integration.yaml:1753', 'source/references-couts-integration.yaml:1818']
- id: sequence_recue_et_retenue
  priorite: P2
  pages: ['#parametres', '#evaluation-core', '#se-projeter']
  constat: Synvance expose cinq années source SAP. Le modèle sélectionne les années source 4 et 5 à pleine capacité, puis prolonge cette séquence ; Microsoft conserve ses années source 1 à 5. Le texte actif dit seulement que les abonnements suivent leurs années contractuelles.
  consequence: La différence entre les données reçues et le choix retenu pour comparer n’est pas suffisamment explicite.
  recommandation: Montrer par option la séquence reçue, les années source sélectionnées, le démarrage à la fin de sélection et le point de prolongation par indexation. Documenter le choix existant sans modifier les annuités.
  references: ['source/application-framework.yaml:44', 'source/calibration-couts.yaml:16', 'source/maintenance/maintenance-sap.yaml:497', 'tools/calculate_costs.py:90', 'tools/project_investment.py:238']
- id: hierarchie_des_references
  priorite: P2
  pages: ['#etude-marche']
  constat: La page commence par les axes à examiner, avant les enseignements de l’instruction. Le diagnostic COCOMO est plus accessible que les références d’effort observé ISBSG. Le passage des 88 capacités du périmètre aux 84 comparées et la portée des vérifications récentes demandent une recherche dans d’autres documents.
  recommandation: Ouvrir par ce qui est établi, partiel ou ouvert ; proposer une entrée Références d’effort distinguant observations, relevés de code et diagnostic. Expliquer les quatre exclusions existantes près du compteur. Distinguer date de la preuve, dernière vérification et portée de cette vérification, sans disqualifier une preuve par sa seule ancienneté.
  references: ['app/src/MarketStudyPage.tsx:31', 'app/src/EssentialViews.tsx:112', 'source/references-couts-integration.yaml:46', 'source/references-couts-integration.yaml:105', 'sources/rafraichissement-referentiel-marche-2026-10-28.md:56']
- id: densite_et_harmonisation
  priorite: P2
  pages: ['#parametres', '#etude-marche', '#evaluation-core']
  constat: Hypothèses retenues cumule environ 3100 mots et plus de 11000 pixels à 1440 px, tandis que les pages de comparaison ont peu de contexte. Méthode, valeurs actives et diagnostics restent longs à parcourir. Les chapitres Étude de marché n’utilisent pas les badges numérotés du rendu commun.
  recommandation: Hiérarchiser les hypothèses structurantes avant les détails, alléger les rappels déjà expliqués dans le Framework et isoler visuellement les diagnostics. Garder les justifications visibles et les sections continues ; harmoniser sommaires, titres numérotés, emphases et espacements.
  references: ['app/src/FrameworkPage.tsx', 'app/src/MarketStudyPage.tsx:13', 'app/src/coreEvaluation.css:46', 'tmp/economic-audit-2026-10-29/reading.json']
- id: lecture_des_scenarios
  priorite: P2
  pages: ['#simuler', '#se-projeter']
  constat: Simuler montre Java, Microsoft et SAP par défaut, avec un bouton pour retrouver les cinq options. Les hypothèses communes sont dans un bloc à déplier. Le rendu actif montre les totaux modifiés sans leur écart chiffré à la référence, contrairement à l’ancien rendu non actif. Dans Se projeter, le sélecteur change le cumul comparatif mais le graphique et la table restent sur quinze ans.
  recommandation: Afficher les cinq options sur un pied d’égalité, rendre les hypothèses communes continues et rapprocher résultat simulé et référence sans modifier le contrat de calcul. Distinguer nettement la comparaison à l’horizon choisi de l’échéancier complet sur quinze ans. Guider les essais d’hypothèses sans les présenter comme des scénarios approuvés.
  references: ['app/src/EssentialViews.tsx:35', 'app/src/EssentialViews.tsx:42', 'app/src/EssentialViews.tsx:84', 'app/src/Simulations.tsx:24', 'app/src/Simulations.tsx:65', 'app/src/Simulations.tsx:73']
- id: parcours_de_decision
  priorite: P2
  pages: ['#etude-marche', '#parametres', '#evaluation-core', '#comparer', '#se-projeter', '#simuler']
  constat: Les trois premières pages servent la justification et les trois dernières les résultats, mais aucun parcours court n’est explicité. Les pages de projection et simulation terminent sans lien vers les conditions de réalisation et le dossier de capacité. Certains renvois de l’analyse Synvance deviennent des impasses textuelles après masquage des YAML.
  consequence: Le sponsor voit combien un scénario consomme, sans retrouver clairement les validations nécessaires avant d’engager son étape suivante.
  recommandation: Conserver six pages avec une question directrice et une suite principale par page. Proposer un parcours court Comparer, Se projeter, Simuler avec retour aux hypothèses et preuves. Relier la sortie aux jalons et capacités attendues, sans inventer ROI, disponibilité d’équipe ou engagement d’eXalt. Remplacer les renvois YAML neutralisés par les pages et restitutions métier adaptées.
  references: ['source/lecture-evaluations-economiques.yaml:82', 'app/src/EssentialViews.tsx:89', 'app/src/Simulations.tsx:76', 'source/ecarts-perimetre-flow-rfi.md:81', 'source/ecarts-perimetre-flow-rfi.md:87']
parcours_cible:
- page: Étude de marché
  question: Que savons-nous réellement et quelles preuves restent ouvertes ?
- page: Hypothèses retenues
  question: Quels choix alimentent le calcul et sur quelle justification ?
- page: Évaluations économiques
  question: Quels budgets en résultent, pour quels travaux et quelles inclusions ?
- page: Comparer
  question: Comment les structures de coût diffèrent-elles sur les périmètres déclarés ?
- page: Se projeter
  question: Que finance-t-on sur dix ans, avec quel service obtenu et quel solde initial ?
- page: Simuler
  question: Comment une hypothèse change-t-elle la référence et que faut-il valider pour la retenir ?
ordre_propose:
- Corriger le sens des libellés de service, solde initial et charge Core, puis remettre les réserves nécessaires près des graphiques.
- Rétablir la traçabilité lisible des charges, hypothèses, qualifications et normalisations, en gardant les YAML masqués.
- Expliciter les traitements déjà retenus, dont les annuités SAP et les différences entre données reçues, hypothèses et résultats.
- Réorganiser Étude de marché et Hypothèses pour exposer d’abord les enseignements et choix importants, puis les détails et diagnostics.
- Harmoniser Comparer, Se projeter et Simuler, avec cinq options, horizons explicites, hypothèses communes visibles et lien aux conditions de réalisation.
verification:
  methode: Relectures indépendantes des sources éditoriales, contrats et composants réellement montés ; rapprochement avec la présentation dans un navigateur isolé.
  navigateur: Six pages lues à 1440 et 390 px ; dix explications de chiffres ouvertes ; aucun paramètre économique saisi ni scénario enregistré.
  observations: Aucune erreur JavaScript ni débordement global. Un bloc repliable actif identifié dans les hypothèses communes de Simuler, sans balise details.
  traces: tmp/economic-audit-2026-10-29/reading.json
  captures: tmp/economic-audit-2026-10-29/
  modele_version: 57d2e719ef05f5a653e7df1f0fa2ed37a0a05f5f8cc5fa05e509d807d5a45c79
  serveur: Sources courantes confirmées sur localhost:8766 avant l’audit.
  tests: Aucune suite de calcul relancée pour cet audit documentaire ; contrôles du commit audité déjà disponibles. Aucune conclusion de calibration empirique tirée des tests logiciels.
