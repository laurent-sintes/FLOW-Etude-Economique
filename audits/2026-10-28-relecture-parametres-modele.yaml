date: '2026-10-28'
objet: Relecture et présentation des paramètres du modèle avec formules et périmètres d’application.
route: '#parametres'
fichiers:
- config/application.yaml
- app/src/FrameworkPage.tsx
- app/src/framework.css
- app/src/MethodDocument.tsx
- tools/study_app.py
- tools/test_study_app.py
- app/README.md
structure:
- Gains de productivité.
- Tarifs et outillage par JH.
- Coordination et pilotage.
- Moyens et achats.
- Évolution des prix.
- Répartition Build / Run.
clarifications:
- Six familles de lecture, sommaire vertical et titres numérotés contrastés, emphases partagées avec les méthodes.
- Référence commune distincte des hypothèses proposées dans Simuler.
- Onze formules visibles avec unités, pourcentages divisés par cent et assiettes explicites.
- Taux d’intégration diagnostiques séparés, aucun gain appliqué à l’intégration ou transition Make.
- Taux de développement Buy conservés sans assiette générique additionnelle active.
- Inclusions annuelles contractuelles mises en avant, taux diagnostiques sans effet sur leur prix.
- Outillage par JH placé avec la valorisation ; moyens annuels propres à chaque option.
- Cinq assiettes de coordination distinctes, programme Make en JH mensuels et totaux avec tarifs.
- Indexation limitée aux traitements réels, financements initiaux et transition constants.
- Clé Build/Run conservée, MCO Core classé Build, agrégation monétaire analytique non encore produite.
- Accompagnement Make conservé dans les repères remplacés ; statut de présentation dérivé de son propriétaire, sans modification économique.
validation:
  relectures: Formules, éditorial et UI relus indépendamment, corrections intégrées.
  suite_complete: 174 tests Python réussis ; tests JavaScript, types, contenu et build réussis.
  statut: Test ciblé de bascule de la substitution, avec conservation des autres champs et valeurs.
  parite: Témoin de simulation préservé, aucun écart des cinq options aux horizons de comparaison.
  rendu: Six familles, onze formules, cinq options de tarifs et détails conservés.
  responsive: Vérifié à 800 et 390 pixels, sans débordement de page ni de formule.
  clavier: Sommaire avec Entrée, focus sur titres, détails avec Entrée, régions de tableaux nommées et tabulables.
  contrat: Mentions d’inclusion annuelles, ancienne provision de 120 JH et mobilisation du programme vérifiées dans le rendu.
  navigation: Accès depuis Évaluation de marché, lien Simuler et suite Évaluation du Core System vérifiés.
  serveur: Rechargé sur le port 8766, page Paramètres laissée ouverte.
  captures:
  - output/parametres-modele-apercu.jpg
  - output/parametres-modele-formules.jpg
economic_change: false
