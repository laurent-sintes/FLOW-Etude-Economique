date: '2026-10-28'
scope: Page Méthode d’évaluation de la Plateforme Core System.
demande:
- Supprimer l’exemple fictif qui brouille la méthode.
- Remplacer le sommaire alternant gauche et droite par un parcours vertical.
- Expliquer à chaque étape pourquoi le choix méthodologique est pertinent.
relecture:
  constat: Les actions du skill étaient décrites, mais leur justification et leur résultat restaient souvent implicites.
  chaine: Périmètre commun → fonctions documentées → travaux restants → charges justifiées → consolidation.
  structure: Raison d’être dans l’introduction de chaque étape, actions du skill, puis résultat transmis à la suite.
  ajustements:
  - Suppression de la section d’exemple, de son entrée de sommaire et de ses données chiffrées.
  - Sommaire numéroté sur une seule colonne dans le rendu partagé.
  - Distinction entre preuve de fonction produit, pertinence de l’analogie et justification des JH.
  - Explication de la réutilisation, des travaux résiduels et du financement unique des mécanismes partagés.
  - Retrait de la formule de proportionnalité globale ; distinction conservée entre mise en place commune et travail répétable.
  - Contrôle de couverture du périmètre et addition unique des lots explicités avant l’incertitude.
  - Incertitudes, hypothèses communes et totaux partiels restent visibles.
  - Définition détaillée de la capitalisation conservée dans le glossaire.
  avis_final: Aucun défaut logique important restant après relecture indépendante.
compatibilite:
  exemples: Le format générique demeure testé sur une fixture synthétique indépendante de la page publique.
  ancres: Identifiants des cinq sections conservés, dont la section référencée par le glossaire.
validation:
  contenu: Contrôle réussi après la dernière précision effort / durée.
  python_tests: 166
  frontend: tests, types, content, build passed
  parite: Cinq options et horizons 3/5/7/10 inchangés ; témoin de simulation préservé.
  visuel:
    largeurs_css_px: [800, 390]
    sommaire: Cinq éléments alignés verticalement dans l’ordre de lecture.
    exemples_affiches: 0
    resultats_etapes: 5
    debordement_page: false
    tableaux: Défilement horizontal contenu et accès clavier conservés.
    clavier: Tab passe de la première à la deuxième entrée ; Entrée place le focus sur le titre de section correspondant.
    rendu_partage: Du brut au net et Évaluation de marché vérifiés avec le sommaire vertical.
  captures:
  - output/methode-core-sommaire-vertical.jpg
  - output/methode-core-logique-relecture.jpg
  serveur: Sources courantes actualisées dans l’application locale.
economic_change: false
