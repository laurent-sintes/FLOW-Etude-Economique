date: '2026-10-29'
scope: Repères Synvance — synthèse, dossier Microsoft et dossier SAP.
statut: Corrections appliquées après audit éditorial, visuel et relecture indépendante.
references:
- app/src/MethodDocument.tsx
- app/src/coreEvaluation.css
- app/src/ModelPage.tsx
- app/BRANDING.md
- AGENTS.md
principes_conserves:
- Une synthèse et deux pages de détail, accessibles par une seule entrée avant le Framework.
- Données reçues et preuves dans Repères Synvance ; analyses et budgets FLOW dans le dossier économique.
- Sept originaux consultables et téléchargeables, sans lien YAML et sans bloc à déplier.
constats_et_corrections:
- id: reperes_lecture
  constat: Le sommaire était numéroté, mais les titres ne portaient pas les badges du Framework.
  correction: Trois chapitres numérotés, titres actifs et messages clés en gras sur chaque page, avec les styles communs.
- id: repetitions
  constat: Le contexte commun était recopié dans les deux dossiers et les réserves réapparaissaient dans plusieurs introductions.
  correction: Contexte propre au fournisseur, introduction raccourcie, paragraphes limités à la largeur de lecture commune et réserves placées près des données concernées.
- id: vocabulaire
  constat: COPIL, panier logiciel, Année source, DRP, Upgrade et TMA gênaient une lecture directe.
  correction: COPIL et DRP explicités, abonnements et licences nommés, périodes de l’offre lisibles, intitulés français avec les noms fournisseur conservés.
- id: montants_documentaires
  constat: Lots, somme, total imprimé et écart SAP avaient une présentation semblable, favorisant une lecture additive.
  correction: Récapitulatifs mis en valeur et écart distingué avec texte explicite. Rôles de lecture dérivés des références existantes. Précision sur les montants non arrondis utilisés dans les rapprochements.
- id: annuel
  constat: Les montants annuels étaient alignés à gauche et une valeur annuelle unique apparaissait sous Année 1, y compris après stabilisation.
  correction: Style numérique partagé, colonnes alignées à droite et périodes contractuelles directement associées aux montants uniques. Les séquences à plusieurs années restent intégrales.
- id: preuves
  constat: La même preuve SAP se répétait à chaque ligne et les liens Consulter n’identifiaient pas leur cible pour un lecteur d’écran.
  correction: Preuve commune sous le tableau, preuves propres aux lignes conservées, localisation séparée du lien et nom accessible incluant le titre du document. Parcours vers Framework et dossier économique sur une seule colonne.
- id: mobile_et_styles
  constat: Le tableau d’intégration à deux colonnes imposait un défilement horizontal sur mobile et la feuille CSS conservait des règles remplacées.
  correction: Colonnes d’intégration lisibles jusqu’à 320 px sans défilement horizontal. Défilement local conservé pour les séquences annuelles. Feuille CSS consolidée, sans modification des styles des autres pages.
validation:
  suite_complete:
    python_tests: 256
    frontend: Tests, types, contenu et build réussis.
    parite: Six scénarios identiques, contrat et paramètres de référence conservés.
  documentaire:
    controles: 25
    lignes_initiales: 9
    lignes_annuelles: 6
    valeurs_annuelles_documentees: 14
    originaux: Sept pièces identiques par empreinte SHA-256.
    proprietaires: Quatre fichiers de chiffrage et maintenance et registre de provenance inchangés.
  navigateur:
    pages: [synvance, synvance-microsoft, synvance-sap]
    largeurs_css_px: [1440, 768, 390, 320]
    clavier: Les trois liens du sommaire placent le focus sur leur titre ; navigation fournisseur et retours vérifiés.
    liens: Noms accessibles des sept consultations et téléchargements réels PDF/XLSX vérifiés.
    debordement_page: false
    debordement_table_integration: false
    blocs_a_deplier: 0
    erreurs_javascript: 0
  livraison_pages:
    routes: 16
    largeurs_css_px: [1440, 390]
    moteur_python_navigateur: Six scénarios identiques au témoin, référence isolée et contrôle de version conservés.
    sauvegardes: Session et scénario nommé rechargés, collection personnelle conservée.
    preuves: Sept originaux vérifiés par empreinte et téléchargements disponibles.
    erreurs: 0
  relecture_independante: Aucun écart de style important restant identifié sur les captures et le code.
