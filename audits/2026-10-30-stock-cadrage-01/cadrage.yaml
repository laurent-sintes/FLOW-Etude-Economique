open_assumptions:
- Volumes, dimensions, rétention et objectifs de service.
- Corrections tardives, ordre des faits reçus, concurrence des réservations et arbitrages.
- 'Filiation et Handling Units : faits reçus, granularité et limites de connaissance.'
- Contrats de fourniture Finance, planification et retours produit.
- 'Applicabilité des mécanismes Master Data aux registres de faits : ne pas présumer leur équivalence.'
calculation_plan:
- Définir les résultats fonctionnels comparables dans les quatre OSS.
- Mesurer les méthodes, schémas, vues et dépendances utiles après exclusions.
- Calculer quatre références COCOMO natives avec réutilisation.
- Dimensionner les compléments Flow sans refinancer Master Data.
- Compter les processus et groupes COSMIC puis appliquer ISBSG avec les limites connues.
- Comparer activités, unités et périmètres ; proposer JH par rôle et délai avant adoption.
