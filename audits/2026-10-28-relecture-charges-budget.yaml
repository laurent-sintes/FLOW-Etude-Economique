date: '2026-10-28'
scope: Page Des charges au budget, anciennement Du brut au net.
source: source/methode-calcul-net.yaml
demande:
- Appliquer le niveau de qualité de la méthode du skill à la page suivante.
- Afficher les formules de calcul du modèle.
- Donner à la page un titre conforme à son périmètre réel.
structure:
  principe: Chaque étape présente sa raison d’être, son traitement et son résultat.
  etapes:
  - Identifier les charges de départ.
  - Retenir les gains applicables.
  - Calculer le net sur le même périmètre.
  - Situer les autres efforts du projet.
  - Valoriser les travaux et compléter le budget.
  presentation: Sommaire vertical, emphases ciblées, deux tableaux et formules visibles, sans exemple ni encarts redondants.
precisions:
- Les données actuelles couvrent plusieurs natures, dont la qualification ; la nouvelle méthode du skill ne les a pas encore recalibrées.
- Le gain réduit les JH concernés, sans seconde remise de réutilisation ni baisse des tarifs fournisseur.
- La qualification déjà enregistrée est rattachée au total projet, sans être ajoutée une seconde fois.
- Les JH du programme Make et la provision de coordination technique suivent des calculs distincts.
- Le coût technique inclut l’outillage applicable, qui entre dans l’assiette de coordination du build.
- Le total humain complet reste une définition à constituer ; les achats et forfaits sont normalement exprimés en euros.
formules_visibles:
- Net d’une activité.
- Somme des JH nets du périmètre.
- Effort d’un rôle du programme Make.
- Définition du total humain du projet à constituer.
- Répartition des JH entre profils.
- Coût technique par profil avec outillage applicable.
- Budget du programme Make.
- Provision de coordination technique du build Make.
- Budget du build Make.
- Consolidation du budget du périmètre.
verification_des_formules:
  fichiers:
  - tools/calculate_costs.py
  - tools/composable_costs.py
  - tools/study_app.py
  - source/calibration-couts.yaml
  - source/deploiement-groupe.yaml
  relecture_independante: Aucun défaut important relevé dans les expressions et leurs assiettes.
vocabulaire:
  titre_canonique: source/glossaire.yaml#vues/calcul_net
  nouveau_titre: Des charges au budget
  diffusion: Menu, en-tête, glossaire généré, liens depuis la méthode du skill et les fondamentaux, documentation courante.
  compatibilite: Identifiant calcul_net et route calcul-net conservés.
validation:
  python_tests: 166
  frontend: tests, types, content, build passed
  parite: Cinq options et horizons 3/5/7/10 inchangés ; témoin de simulation préservé.
  titre: Contrôle de contenu réussi après renommage et régénération du glossaire.
  visuel:
    largeurs_css_px: [800, 390]
    debordement_page: false
    debordement_formules: false
    tableaux: Défilement horizontal contenu, accès clavier conservé.
    clavier: Entrée sur le sommaire place le focus sur le titre de section correspondant.
    renvois: Liens des fondamentaux et de la méthode du skill vérifiés vers le nouveau titre.
  captures:
  - output/des-charges-au-budget.jpg
  - output/du-brut-au-net-formules.jpg
  serveur: Sources courantes actualisées dans l’application locale.
economic_change: false
