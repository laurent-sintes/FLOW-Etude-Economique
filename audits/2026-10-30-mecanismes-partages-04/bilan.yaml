funding:
  status: working_proposal_not_active_model
  mechanisms:
  - id: order-state
    owner: orders
    name: Cycle commun des commandes et lignes
    base: true
    fraction: 0.25
    schemas:
    - OrderMutationEvidence:orderRef,lineRef,previousVersion,acceptedVersion,authorityRef,quantityBefore,quantityAfter,resultRef
    basis: Réalisation du cycle commun observé ; complément pour contrôler et expliquer l’acceptation d’une contribution
      métier et conserver les invariants de quantité. Admission technique déjà financée.
  - id: order-lineage
    owner: orders
    name: Révisions et filiation des commandes
    base: true
    fraction: 0.35
    schemas:
    - OrderLineageProof:sourceRef,targetRef,sourceLine,targetLine,quantity,acceptedChangeRef,proofRef
    basis: Scission/amendement et suivi des origines. Complément estimé pour les filiations explicites et la conservation
      des engagements ; aucun second cycle d’état.
  - id: service-contract
    owner: goods-orders
    name: Contrat commun de prestation confiée
    base: false
    fraction: 1
    schemas:
    - ServiceRequirement:orderRef,requirementsRef,providerRef,version,expectedResultsRef
    - ServiceCommitment:requirementRef,acceptedVersion,quantity,date,conditionsRef,status
    basis: 'Module distinct du cycle Order : exigences confiées et engagement du prestataire. Les instructions de
      stock servent d’analogue ; aucune nouvelle exécution Stock n’est financée.'
  - id: service-recognition
    owner: assurance
    name: Reconnaissance et rapprochement des résultats de prestation
    base: false
    fraction: 0.75
    provider: stock_correction
    schemas:
    - ServiceResultAcceptance:serviceRef,sourceRef,expectedVersion,observedRef,acceptedRef,correctionOf,remaining,reason
    basis: Nouveau contrôle métier de résultat sur le modèle de contribution/correction déjà étudié. Le noyau d’admission
      et les mouvements Stock gardent leurs propriétaires.
  - id: process-definitions
    owner: workflow
    name: Définitions et versions de parcours
    base: true
    fraction: 0.25
    schemas:
    - ActivityBinding:activityRef,inputContractRef,resultContractRef,version,authorityRef
    basis: Définitions/versionnement et leur adaptation au catalogue d’activités Flow ; studio graphique universel
      et moteur BPMN/DMN exclus.
  - id: process-runtime
    owner: workflow
    name: Adaptation du moteur de processus et corrélation
    base: true
    fraction: 0.35
    schemas:
    - ProcessCorrelation:caseRef,instanceRef,definitionVersion,contextRef,lastRecognizedEventRef
    basis: Adaptateur d’instance, déclenchement/attente/reprise et corrélation. Moteurs et transactions sont fournis
      par les bibliothèques et le patrimoine commun ; orchestration métier adaptative de Fulfilment exclue.
  - id: human-task
    owner: human-work
    name: Contexte et attribution du travail humain
    base: true
    fraction: 0.25
    schemas:
    - TaskResultContract:taskRef,contextRef,resultContractRef,authorityRef,acceptedResultRef
    basis: Tâche contextualisée, affectation et reconnaissance du résultat. Identités/droits et exécution durable
      sont consommés ; pas outil RH ni studio universel de formulaires.
  - id: work-deadline
    owner: human-work
    name: Échéances, pauses et réactions autorisées
    base: false
    fraction: 1
    schemas:
    - TaskDeadlineState:taskRef,calendarRef,dueAt,pauseIntervals,lastReactionRef,authorityRef
    basis: Calendriers et minuteurs réutilisés. Nouveau comportement de pause/reprise, réexamen et réaction autorisée
      sur les tâches ; règles Beaumanoir reçues/configurées.
  - id: case-ledger
    owner: supervision
    name: Journal métier du Case et lectures temporelles
    base: false
    fraction: 1.75
    provider: stock_correction
    schemas:
    - CaseBusinessEvent:caseRef,sourceRef,kind,payloadRef,effectiveAt,knownAt,correctionOf,authorityRef
    - CaseReadCut:caseRef,effectiveAt,knownAt,recognizedEventsRef,limits
    basis: Analogie explicite de nouveau registre (1 chaîne) et lecture/correction aux deux dates (0,75 chaîne),
      comme forme technique déjà étudiée pour la propriété. Ni audit technique ni journal Stock reconstruit. La
      suffisance pour le Case reste supposée.
  - id: process-intervention
    owner: supervision
    name: Autorisation d’intervention et effet reconnu
    base: false
    fraction: 0.5
    schemas:
    - InterventionEvidence:caseRef,actionRef,scopeRef,authorityRef,expectedEffectRef,observedEffectRef,resultRef
    basis: Contrôle et preuve autour des actions du moteur ; ces actions ne sont pas reconstruites ni financées
      deux fois.
  - id: process-exception
    owner: supervision
    name: Exception, responsabilité et résolution attestée
    base: false
    fraction: 0.5
    schemas:
    - CaseException:caseRefs,kind,responsibleRef,remediationRef,expectedEvidenceRef,resolutionRef,status
    basis: Dossier d’exception et constat de résolution sur tâches/interventions déjà financées ; ni nouveau moteur
      de processus ni simple reprise technique.
