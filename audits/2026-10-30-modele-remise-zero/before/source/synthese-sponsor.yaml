version: 1
date: '2026-10-26'
role: Lecture de décision de l’étude d’opportunité, sans budget ni hypothèse financière autonome.
dependances:
- source/decision-make-buy.yaml
- source/grille-complexite.yaml
- source/methode-complexite.yaml
- source/ecarts-perimetre-flow-rfi.md
- source/plan-investissement.yaml
- source/calibration-couts.yaml
- source/maintenance.yaml
- source/references-couts-integration.yaml
- source/faq-sponsors.md
- source/recalibration-metier.yaml
- source/qualification-buy.yaml
- source/parcours-integration.yaml
verdict:
  statut: Étude d’opportunité
  titre: Maîtriser les règles SCM et leur évolution
  texte: Le Make donne la maîtrise du Core commun aux enseignes et de sa feuille de route. Cet intérêt doit justifier
    l’investissement et l’équipe produit dans la durée ; il ne repose pas sur la reconstruction de fonctions déjà
    fournies par les ERP.
  decision: Décider si l’intérêt métier, l’enveloppe et le calendrier justifient un Go pour FLOW.
  preuves:
  - path: source/grille-complexite.yaml
    titre: Périmètre métier
  - path: source/ecarts-perimetre-flow-rfi.md
    titre: Différences de couverture
lecture_rapide:
  interet: L’intérêt du Make
  couts: Quels écarts de coût ?
  reference: Scénario de référence · dépenses IT externes
  repere: Make le moins coûteux à cet horizon
  ecart: Écart Make − Buy
  service: Années de service complet
  reste: Financements initiaux restants
  calendrier: 'Le Make entre en service plus tard : une partie de l’écart vient du nombre d’années de service complet
    financées. SAP conserve aussi des travaux Finance hors cible FLOW.'
  inacheve: La réalisation se poursuit au-delà de cet horizon ; les montants restants sont indiqués ci-dessus.
  go: À quelles conditions donner le Go ?
  conditions:
  - titre: Une valeur métier propre
    texte: La maîtrise des règles et de leur évolution apporte davantage que l’adaptation du standard, y compris
      lorsque Microsoft est moins coûteux.
  - titre: Une enveloppe et un délai acceptés
    texte: Financer la réalisation puis les évolutions, et accepter une mise en service plus tardive.
  - titre: Une équipe produit durable
    texte: Mobiliser les responsables métier et techniques du Core et de l’intégration Beaumanoir.
  decision: Si ces conditions sont réunies, engager le cadrage FLOW. Sinon, privilégier le standard le plus adapté.
  simulation: Tester mes hypothèses
  details: Approfondir à la demande
  couts_detail: Les cinq options, le calendrier et les dépenses hors enveloppe
  choix_detail: Les engagements Make / SAP / Microsoft
  go_detail: Les résultats métier attendus et le cadrage après le Go
  buy_scope: Les suppléments de modules et fonctions Buy encore à qualifier ne sont pas chiffrés dans ces totaux.
  buy_scope_link: Examiner les points de couverture
lecture_economique:
  titre: Quelle enveloppe pour chaque option ?
  portee: Dépenses IT externes. Équipes internes, transformation organisationnelle et décommissionnement sont hors
    enveloppe.
  reference: Scénario de référence · tester d’autres hypothèses dans Simulations.
  limite: L’intégration Make suit les travaux, déploiements et pilotage Groupe. Le lotissement, les réceptions et
    les inclusions de services restent à confirmer ; SAP demeure un contrepoint.
  durees: Make enchaîne build et intégration. Buy enchaîne sélection-contractualisation et intégration ; ses abonnements
    commencent à la signature au début de l’intégration. Les horizons partent de la même décision.
  repere_make: Comparaison avec l’option Make la moins coûteuse à l’horizon choisi.
  lecture_ecart: 'Un montant plus faible à court terme peut refléter des financements initiaux encore à venir :
    construction, déploiements et services transitoires. Lire le reste à financer avec les années de service complet.'
  lectures_buy:
    microsoft: Microsoft combine un pilote détaillé et une projection pour les autres pôles. L’effort de généralisation
      est le principal facteur à préciser au cadrage.
    sap: SAP conserve des travaux Finance hors cible FLOW. Cette différence de périmètre contribue à l’écart affiché.
  preuves:
  - path: source/plan-investissement.yaml
    titre: Conventions et paramètres
  - path: source/faq-sponsors.md
    titre: Comprendre les montants
decision_suivante:
  regle_arbitrage: 'Le Go doit réunir trois éléments : une valeur métier propre, une enveloppe soutenable et une
    équipe capable de porter le produit. Comparer ces éléments aux standards SAP et Microsoft.'
  actions:
  - route: perimetres
    titre: Examiner le périmètre et les responsabilités
  - route: build
    titre: Examiner le Build Core System
  - route: simulations
    titre: Tester les hypothèses financières
