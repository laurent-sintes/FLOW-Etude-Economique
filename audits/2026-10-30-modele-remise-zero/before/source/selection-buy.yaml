  transfert n’est pas une remise fournisseur. Le support initial Microsoft et les forfaits Buy sont conservés.
calendrier: Sélection puis intégration. Signature et activation des abonnements au terme de la sélection ; séquences
  commerciales inchangées. Aucun chevauchement de phases présumé. Le régime annuel complet commence après intégration
  et stabilisation.
tarifs: 'Provisions de travail validées pour l’opportunité, non devis : 850/1000 EUR HT/JH, juridique 1200 EUR HT/JH
  à confirmer.'
exclusions: Consultation passée, production des réponses fournisseurs, réalisation d’intégration, temps interne
  et PoC payant ; aucun double achat du cadrage fournisseur.
