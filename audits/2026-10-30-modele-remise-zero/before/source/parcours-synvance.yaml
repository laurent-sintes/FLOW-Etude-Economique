  interlocuteur: Métiers SCM, SAP / Microsoft et intégrateurs
- sujet: Intégration et migration Beaumanoir
  effet: Interfaces, données, coexistence et effort de bascule.
  attendu: Décrire les applications conservées, les flux et les vagues de migration.
  interlocuteur: Architecture Groupe et intégration
