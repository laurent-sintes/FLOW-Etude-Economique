schema_version: 1
id: core-evaluation-opportunity
principle:
  title: Des capacités métier aux journées de développement
  text: >-
    Pour les **trois options Make**, le [skill](#glossaire?term=skill_evaluation) estime les **[JH](#glossaire?term=jh) développeur bruts** nécessaires à la {{notion.core_system}} :
    réalisation, assemblage et tests développeur, **après la [réutilisation](#glossaire?term=reutilisation_logicielle) retenue et
    avant les gains de productivité**. Pilotage, QA indépendante, architecture transverse,
    conduite du changement et adaptations Beaumanoir restent hors de cette base.
notice:
  title: Une sortie à qualifier avant utilisation
  text: >-
    Le skill prépare un dossier de charges avec ses preuves, hypothèses et inconnues.
    **Définir cette procédure ne démontre pas qu’une base de charges l’a déjà suivie.**
    L’évaluation économique doit préciser la provenance effectivement utilisée
    et les contrôles réalisés avant de reprendre ses résultats.
tooling:
  label: Automatisation
  title: Une méthode outillée par un skill
  skill: flow-evaluer-core-system
  text: >-
    Un skill est une **procédure exécutée à la demande par un assistant IA** pour préparer
    un dossier d’estimation traçable. Celui-ci suit les cinq étapes ci-dessous et conserve
    preuves et hypothèses : chaque charge est reliée aux travaux qui la justifient, puis
    aux capacités métier qu’ils servent. Les simulations utilisent la base enregistrée ;
    elles n’exécutent pas le skill.
navigation_label: Les cinq étapes de l’estimation
sections:
  - id: delimiter-perimetre
    title: Fixer un périmètre commun
    lead: >-
      **Comparer les écosystèmes exige de leur demander le même résultat métier.**
      La cartographie délimite ce que la {{notion.core_system}} doit couvrir et évite
      que les choix techniques changent le besoin en cours d’estimation.
    blocks:
      - kind: bullets
        items:
          - Le skill identifie les capacités retenues et conserve leur rattachement **Domaine / Sous-domaine / Business Area**.
          - Il décrit leurs résultats attendus, leurs frontières et leurs exclusions.
          - Il distingue le **produit générique** des adaptations propres au Groupe, qui relèvent de la {{notion.plateforme_beaumanoir}} et de son intégration.
      - kind: paragraphs
        items:
          - >-
            Les niveaux de complexité orientent l’analyse des sujets difficiles.
            **Ils ne sont pas convertis en JH** : ils ne décrivent pas encore les travaux à réaliser.
          - >-
            **Résultat : un périmètre métier explicite**, commun aux trois options Make
            Java / Spring Boot, .NET et Rust. Il sert de base à la recherche des fonctions nécessaires.
  - id: observer-fonctions
    title: Préciser les fonctions à réaliser
    lead: >-
      **Une capacité métier est trop générale pour chiffrer du développement.**
      Les produits comparables aident à identifier les comportements, règles et cas
      à traiter pour atteindre le résultat attendu.
    blocks:
      - kind: bullets
        items:
          - Le skill examine les fonctions documentées, démontrées ou observables dans le code des produits étudiés, en conservant **produit, version ou édition et preuve**.
          - Il rapproche chaque fonction des capacités retenues et explicite **les différences avec le besoin FLOW**. Une fonction commune à plusieurs produits n’est recensée qu’une fois pour ce besoin.
          - Il distingue **l’observation étayée**, **l’analogie proposée** et **l’inconnu**. Une absence de preuve ne démontre pas une absence produit.
      - kind: paragraphs
        items:
          - >-
            Une preuve établit ce que fait le produit observé ; la pertinence de sa
            transposition à FLOW reste à justifier. Ces correspondances enrichissent
            la base de connaissance commune avec l’étude de marché.
          - >-
            **Résultat : des fonctions reliées aux capacités, avec leurs preuves et leurs
            écarts.** Elles précisent le contenu du travail ; elles ne prouvent ni sa
            durée ni la possibilité de réutiliser le produit.
  - id: former-lots
    title: Identifier les travaux restants par écosystème
    lead: >-
      **Les mêmes fonctions peuvent demander des travaux différents selon les composants
      disponibles.** Examiner leur réutilisation permet d’estimer ce qu’il faut réellement
      construire, adapter et raccorder dans chaque écosystème.
    blocks:
      - kind: paragraphs
        items:
          - >-
            **{{notion.reutilisation_logicielle}}** : utiliser et adapter des éléments
            existants — frameworks, bibliothèques, composants, programmes, automatisations
            ou skills internes ou tiers. Le skill vérifie **licence, version, interfaces,
            compatibilité et limites connues** avant de les retenir.
      - kind: table
        caption: Le traitement de l’existant détermine les travaux
        columns: [État de la réutilisation, Travaux à estimer]
        rows:
          - [Utilisable en l’état, Raccordement et tests dans le contexte retenu.]
          - [À adapter, Adaptations identifiées puis raccordement et tests.]
          - [À développer, Réalisation de la fonction et tests développeur.]
          - [Réutilisation non démontrée, Hypothèse à qualifier ou inconnue à conserver.]
      - kind: paragraphs
        items:
          - >-
            Un pourcentage de couverture produit ne donne pas un pourcentage de JH économisés.
            Les raccordements, les exigences de qualité et les contraintes du projet restent à examiner.
          - >-
            Chaque mécanisme partagé a **un seul lot propriétaire qui finance sa réalisation**.
            Les capacités utilisatrices financent leurs raccordements et règles propres.
            Cette règle évite de compter plusieurs fois le même développement.
          - >-
            **Résultat : des lots de travaux par écosystème**, chacun avec un résultat
            attendu, des exclusions, des dépendances et des capacités utilisatrices.
            Ces lots sont les unités que l’étape suivante estime en JH.
  - id: etablir-charge
    title: Justifier la charge de chaque lot
    lead: >-
      **Une liste de travaux ne donne pas l’effort nécessaire.** Relier chaque charge à une mesure
      ou à une hypothèse explicite permet au relecteur d’en apprécier la pertinence
      et de la réviser quand de meilleures références deviennent disponibles.
    blocks:
      - kind: table
        caption: Identifier l’origine de chaque estimation
        columns: [Origine, Justification attendue]
        rows:
          - [Charge observée, Temps de développement réellement mesuré sur un lot comparable dont les activités sont connues.]
          - [Charge extrapolée, Référence observée transposée à un volume comparable ; unités homogènes et différences justifiées.]
          - [Estimation d’ingénierie, Décomposition argumentée des actions et tests à réaliser ; volumes et temps unitaires proposés comme hypothèses.]
      - kind: paragraphs
        items:
          - >-
            Le skill conserve **la provenance, la date, l’équipe de référence,
            l’environnement et le niveau de qualité**. Le JH désigne l’effort d’une
            personne pendant une journée selon la convention du modèle ; une durée
            calendaire ou un montant de projet ne mesure pas cet effort.
          - >-
            Pour extrapoler, il distingue **la mise en place commune et le travail
            répétable** : seul ce dernier peut être proportionnel au volume.
            Les écarts deviennent des travaux explicites. Une analogie trop éloignée
            exige une autre référence ou une décomposition plus fine.
          - >-
            Sans mesure comparable, la charge reste une **estimation d’ingénierie non calibrée**.
            Une assistance par IA est signalée ; une revue humaine n’est mentionnée que
            si elle a eu lieu. Lignes de code, contributeurs et âge d’un produit ne
            constituent pas une mesure de JH.
          - >-
            **Résultat : une charge centrale en JH développeur bruts pour chaque lot**,
            accompagnée de son origine, de ses conditions de réalisation et de ses limites.
  - id: qualifier-incertitude
    title: Consolider une estimation vérifiable
    lead: >-
      **Un total n’est utile que si l’on sait ce qu’il couvre et ce qui peut le faire varier.**
      La consolidation vérifie la couverture du besoin, les doubles comptes et les
      hypothèses qui nécessitent encore une validation.
    blocks:
      - kind: bullets
        items:
          - Le skill vérifie que **chaque fonction retenue est reliée à des travaux financés ou à une inconnue explicite**, puis additionne les lots une seule fois par écosystème. Toute ventilation conserve la charge unique du lot.
          - 'Il associe à chaque charge centrale une **incertitude justifiée**, éventuellement différente à la baisse et à la hausse : contenu ouvert, analogie fragile, réutilisation à confirmer ou temps unitaire incertain.'
          - Il dérive les bornes et conserve la chaîne **capacité → fonction → lot → charge → preuve ou hypothèse**, ainsi que les points à instruire en priorité.
      - kind: formula
        text: Charge centrale du périmètre (JH développeur bruts) = somme des charges centrales des lots retenus, comptés une seule fois
      - kind: formula
        text: Borne basse ou haute du périmètre (JH développeur bruts) = somme des bornes correspondantes des mêmes lots
      - kind: paragraphs
        items:
          - >-
            **Inconnu, inclus, sans objet et zéro restent distincts.** Un travail inclus
            référence son lot payeur ; zéro exige une justification. Si une charge manque,
            le total est annoncé comme partiel avec son périmètre non chiffré.
          - >-
            La somme des bornes forme une **enveloppe de sensibilité**, pas un intervalle
            de confiance statistique. Les hypothèses communes à plusieurs lots restent
            visibles : leurs incertitudes ne sont pas supposées indépendantes.
          - >-
            **Résultat : une estimation centrale et une plage justifiée par écosystème**,
            dont le relecteur peut remonter les charges en JH jusqu’au besoin métier,
            distinguer les mesures des hypothèses et cibler les validations à mener.
      - kind: links
        items:
          - href: '#evaluation-core'
            label: Consulter l’application dans les {{vue.evaluations_economiques}}
examples: []
next:
