empreinte: 80d7eceef2360ccf66f2d55943dbd5bf4d97f8d9f810231e189c862af184ae31
principe: Les scénarios rendent le contenu d’intégration traçable pour les cinq options. Ils ne sont ni des unités
  de facturation ni une décomposition exhaustive des budgets fournisseurs.
financement: Les travaux communs et déploiements financent Make ; les offres financent Buy. Les situations précisent
  les livrables et ne créent pas de forfait supplémentaire.
lots:
- id: parametres
  titre: Règles et paramètres Beaumanoir
  activites:
  - INT-001
  - INT-002
  - INT-003
  texte: Structures, priorités, seuils, règles d’engagement et paramètres des moteurs standard ou du Flow Core System.
- id: parcours
  titre: Parcours et interventions métier
  activites:
  - INT-004
  - INT-005
  texte: Configurer les parcours, écrans et interventions. Une extension n’est réalisée que si le besoin résiste
    au paramétrage ; INT-005 ne finance pas un second Core.
- id: flux
  titre: Échanges et données opérationnelles
  activites:
  - INT-006
  texte: Raccorder les applications et partenaires, transformer les messages et suivre les reprises. Un flux partagé
    est réalisé une seule fois.
- id: recette
  titre: Recette des situations métier
  activites:
  - INT-010
  texte: Qualifier les résultats et les enchaînements sur les données et systèmes Beaumanoir ; les scénarios servent
    de cas de recette.
- id: deploiement
  titre: Migration, déploiement et mise en service
  activites:
  - INT-007
  - INT-008
  - INT-009
  - INT-011
  - INT-012
  - INT-013
  texte: Reprendre les données, préparer environnements et exploitation, former puis basculer. Ces travaux transverses
    sont mutualisés entre les scénarios.
