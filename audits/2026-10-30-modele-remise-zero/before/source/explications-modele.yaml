    possible. Avanade p.39–40 chiffre surtout le pilote ; questionnaire onglet 8, lignes 20–23 : déploiements et
    responsabilités à préciser. Migration complète de tous les SI non démontrée. Compléments FLOW et 90 k€ Unified
