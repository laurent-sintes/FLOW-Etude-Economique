version_schema: 1
id: explications-modele
nature: Documentation métier et méthodes ; aucune hypothèse économique autonome.
dependances:
- source/plan-investissement.yaml
- source/calibration-couts.yaml
- source/ecarts-perimetre-flow-rfi.md
- source/references-couts-integration.yaml
- source/faq-sponsors.md
- sources/benchmark-integration-2026-10-23.md
regles:
- Les prix et hypothèses éditables restent dans les YAML économiques. Les montants cités ici sont des rappels documentaires,
  pas des paramètres de calcul.
- Les marqueurs de référence sont résolus depuis le modèle courant par le générateur. Ne pas les remplacer par des
  montants recopiés.
- Une référence publique reste à son périmètre publié ; aucun retraitement FLOW ni tarif contractuel implicite.
