version: 1
id: flow-fundamentals
architecture_ref: source/architecture.yaml
reading:
  intro: Situer la première étape de la {{notion.plateforme_marques.court}}, comprendre les voies de réalisation et lire les charges, les coûts et le calendrier.
  toc_label: Les six repères du modèle
  chapters:
  - id: scope
    title: Ce que nous évaluons
    lead: '**La {{notion.core_system}} constitue la première étape de l’ambition de {{notion.plateforme_marques.court}}.** Le modèle compare cinq options pour obtenir ce produit, l’intégrer au Groupe et le faire fonctionner. Le périmètre évalué reste celui des capacités retenues ; les étapes ultérieures de l’ambition ne sont pas financées implicitement.'
  - id: strategies
    title: Sur quoi reposent les évaluations Make et Buy
    lead: '**Deux points de départ, un même besoin à examiner.** La cartographie métier structure les travaux Make et sert à challenger les propositions Buy.'
  - id: activities
    title: Quelles activités relèvent du Build et du Run
    lead: '**Build et Run décrivent la nature des activités, pas leur période.** Cette convention distingue la réalisation du service courant, indépendamment du choix Make ou Buy.'
  - id: workload
    title: Que mesurent le brut, le net et le total projet
    lead: '**Le brut et le net couvrent les mêmes travaux. Le total projet élargit le périmètre humain.** Ces distinctions évitent de confondre développement, effort complet et budget en euros.'
  - id: costs
    title: Quels postes sont financés
    lead: '**Chaque dépense est financée une seule fois.** Les structures de coût indiquent l’objet financé ; elles permettent de rapprocher les options sans additionner des prestations déjà incluses.'
  - id: calendar
    title: Quand les dépenses interviennent
    lead: '**Les dépenses suivent la consommation et les réceptions.** Les trois phases donnent des repères chronologiques ; une même nature de coût peut traverser plusieurs phases.'
  composition: '**{{notion.plateforme_beaumanoir}} = {{notion.core_system}} retenue + spécificités du Groupe.** Cette composition décrit la cible métier, pas une formule de coût.'
  strategy_note: '**Comparer exige d’expliciter les écarts de périmètre entre les offres et le besoin.** Une couverture déclarée ne prouve pas son inclusion dans le prix ; un point à qualifier ne crée aucun supplément automatique.'
  strategy_links:
  - href: source/offres-synvance.md
    label: Comprendre les offres issues de Synvance
  - href: '#etude-marche'
    label: Voir l’analyse des écarts dans le dossier économique — chapitre « Offres reçues »
  costs_intro: Les sept postes ci-dessous décrivent ce qui est acheté ou réalisé. Leurs tags indiquent la nature Build ou Run des activités.
  costs_note: '**Le poste « {{notion.grouped_buy}} » conserve les prix groupés et leurs inclusions.** Une part non documentée reste inconnue. Les tags ne créent aucun budget ; un total Build / Run exige une ventilation monétaire justifiée.'
  coverage_label: Couches concernées
  next_href: '#conditions-realisation'
  next_label: Examiner les conditions de réalisation et les jalons de décision
activity_reading:
  title: '{{notion.build}} et {{notion.run_activities}}, deux angles de lecture des activités'
  intro: Un budget annuel peut financer du Build. Du Run peut être consommé pendant la réalisation.
  type_refs: [build, run]
  summaries:
  - type_ref: build
    text: Construire, adapter ou faire évoluer le système, y compris les travaux importants conduits en mode projet.
  - type_ref: run
    text: Maintenir le service courant, exploiter les moyens techniques et assister les utilisateurs, y compris pendant la réalisation.
  note: '**Le MCO de la {{notion.core_system}} est classé en Build.** Le MCO des adaptations et interfaces Beaumanoir est Run, sauf interventions importantes en mode projet : leur structure de coût porte une répartition paramétrable. Un financement annuel ne détermine donc pas son classement.'
