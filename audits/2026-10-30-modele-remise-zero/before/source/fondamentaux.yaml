  estimation: Les capacités retenues définissent le besoin commun. Elles structurent l’estimation Make et permettent de confronter les offres Buy aux fonctions attendues, avec leurs preuves et leurs limites.
  scope_summary: '**La cartographie reçue situe le programme dans Business Operations. Les capacités retenues de la chaîne logistique forment le périmètre d’entrée de l’évaluation.** Ce référentiel sert aussi à examiner les offres Buy ; le schéma situe la cible dans un ensemble plus large.'
  scope: 'Design & Development et Enterprise Management & Control restent hors du périmètre du programme présenté. Le positionnement de la {{notion.flow_core_system}} est indicatif : cette vue de contexte ne remplace pas la sélection des capacités chiffrées et n’étend pas le budget de construction aux autres domaines.'
estimation:
  title: Les trois niveaux de charge
  intro: Les efforts humains sont exprimés en JH ; leur valorisation en euros intervient séparément.
  stages:
  - id: gross
    notion: charge_brute
    producer: Production prévue par la méthode du skill
    text: '**Les JH développeur restant à réaliser après réutilisation**, tests développeur inclus et qualification indépendante exclue. La méthode du skill prévoit d’estimer ces travaux à partir des capacités métier et des fonctions observées, avant les gains de productivité explicites. L’application effectivement réalisée, sa provenance et son statut de revue se consultent avec l’évaluation.'
  - id: net
    notion: charge_nette
    producer: Calculée par le moteur
    text: '**Les mêmes travaux après application des gains de productivité documentés.** Le moteur les applique aux activités éligibles, sans seconde remise pour la réutilisation déjà comptée dans le brut.'
  - id: total_project
    notion: charge_totale_projet
    producer: À constituer sur tout le périmètre déclaré
    text: '**Le développement net et les autres efforts humains retenus** : qualification indépendante, architecture, pilotage, intégration, déploiement et conduite du changement, selon le périmètre déclaré et sans double compte.'
  relations:
  - source_ref: gross
    target_ref: net
    operation: apply_productivity
    text: 'Brut → net : appliquer les gains explicites sur le même périmètre de travaux.'
  - source_ref: net
    target_ref: total_project
    operation: add_project_activities
    text: 'Net → total projet : ajouter les autres efforts retenus, sans compter un travail deux fois.'
  note: '**Une provision en euros ne dimensionne pas un effort humain.** Un total complet en JH exige des rôles, missions et charges explicites ; un effort inconnu ou exclu ne vaut pas zéro. Achats, licences et forfaits restent en euros. Les forfaits Buy priment sur les JH diagnostiques et ne reçoivent aucune remise automatique de productivité.'
  links:
  - href: '#complexite'
    label: Comprendre l’estimation du brut par le skill
  - href: '#calcul-net'
    label: Consulter « {{vue.calcul_net}} »
  - href: '#evaluation-core'
    label: Consulter l’application et la provenance des évaluations
