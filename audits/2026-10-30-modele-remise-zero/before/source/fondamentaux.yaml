strategies:
- id: make
  notion: make
  mode: Make
  target_ref: core_system
  option_refs:
  - java-spring
  - dotnet
  - rust
  open_selection: false
  tags:
  - Construire
  - '{{notion.core_system}} générique'
  text: '**Construire la {{notion.flow_core_system}}, version Make de la {{notion.core_system}}, sous maîtrise du Groupe.** La réalisation peut associer équipes internes et partenaire ; Make ne suppose pas une équipe interne déjà opérationnelle. Responsabilité produit, participation métier, compétences, transfert et continuité sont à organiser. Les capacités métier orientent les travaux après réutilisation. Trois options techniques sont comparées : Java / Spring, .NET et Rust.'
  implementation_ref: flow_core_system
- id: buy
  notion: buy
  mode: Buy
  target_ref: core_system
  option_refs:
  - microsoft
  - sap
  open_selection: true
  tags:
  - Microsoft, SAP ou autre
  - '{{notion.core_system}} existante'
  text: '**Partir de l’étude Synvance.** Les offres Avanade / Microsoft et Delaware / SAP, les questionnaires et la projection COPIL documentent les prestations, prix et trajectoires. L’étude FLOW les confronte au besoin et explicite les compléments retenus. Le choix fournisseur reste ouvert.'
phases:
- id: obtain_core
  notion: obtenir_core_system
  bullets:
  - '**Make :** construire le produit et financer ses moyens de fabrication.'
  - '**Buy :** réutiliser le dossier Synvance pour sélectionner et contractualiser. Les dates de consommation suivent les engagements de l’offre retenue.'
  costs:
  - obtention
  - run_cloud
  target_ref: core_system
- id: integrate_deploy
  notion: integrer_deployer
  text: Adapter le produit, migrer les données et raccorder les SI, puis déployer progressivement. La stabilisation précède la réception locale ; le {{notion.mco_client}} commence après cette réception.
  costs:
  - integration
  - core_care
  - client_care
  - run_cloud
  - operations_support
  - grouped_buy
  target_ref: plateforme_beaumanoir
- id: operate_evolve
  notion: exploiter_evoluer
  text: Les services annuels complets prennent le relais des financements transitoires, sans chevauchement. Les moyens consommés pendant la réalisation sont déjà financés à leur période d’usage.
  costs:
  - core_care
  - client_care
  - run_cloud
  - operations_support
  - grouped_buy
  target_ref: plateforme_beaumanoir
phase_reading: '**Un départ commun permet de comparer les dépenses sans imposer les mêmes dates de service.** Construire le calendrier Make à partir de ses travaux et déploiements. Pour Buy, instruire les trajectoires reçues de Synvance et du COPIL, puis la sélection-contractualisation ; ces données ne déterminent pas le calendrier Make.'
limitations: '**Chaque évaluation doit déclarer ses inclusions et exclusions.** Examiner notamment le temps interne, la transformation organisationnelle, les systèmes maintenus pendant la transition, le décommissionnement et la sélection fournisseur. Les capacités d’organisation et de réalisation doivent être établies même lorsqu’elles sortent du périmètre chiffré. Un poste exclu ne vaut pas zéro ; un travail déjà financé n’est pas ajouté une seconde fois.'
