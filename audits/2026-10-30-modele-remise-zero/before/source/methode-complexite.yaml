  - cap-merchandise-reference-stewardship
  - cap-packaging-reference-stewardship
  - cap-internal-supplies-reference-stewardship
  - cap-service-reference-stewardship
  contrat: Recevoir et qualifier une version ; les vues propres aux cinq familles conservent leurs contrôles et
    résultats distincts.
- id: politiques
  titre: Version et applicabilité des politiques Supply
  capacite_responsable: demand-fulfilment-policy-management
  usages:
  - D03.m
  - D03.o
  - D05.a
  - D05.d
  - D05.h
  - D05.e
  - D05.c
  - D03.i
  - delivery-release-decision
  contrat: Résoudre la politique applicable ; chaque décision garde son calcul et ses garanties propres.
- id: positions_stock
  titre: Projections de positions de stock
  capacite_responsable: D01.c
  usages:
  - planning-data-provision
  - D03.i
  - D05.f
  - D05.e
  - D05.c
  contrat: Fournir une position cohérente et datée ; le consommateur ne reconstruit pas le registre mais garde sa
    logique de décision.
- id: orchestration
  titre: État durable des parcours
  capacite_responsable: order-workflow-orchestration
  usages:
  - D06.d
  - D06.f
  - human-task-management
  - process-intervention
  - process-exception-management
  - order-workflow-sentry
  contrat: Conserver attentes et résultats puis reprendre ; les règles métier ne sont pas transférées implicitement
    au moteur.
- id: promesse
  titre: Faisabilité de promesse
  capacite_responsable: D03.j
  usages:
  - D03.k
  - D05.e
  contrat: Réutiliser la possibilité faisable ; valorisation économique et décision de réassort restent propres
    aux consommateurs.
- id: simulation
  titre: Rejeu des calculateurs métier
  capacite_responsable: BHV006
  usages:
  - D05.f
  - D03.o
  - D05.a
  - D05.d
  - D05.h
  - planning-scenario-reconciliation
  contrat: Le dispositif de scénario appelle les calculateurs existants ; il ne finance pas une seconde réalisation
    de leurs algorithmes.
familles_reemploi_a_qualifier:
- id: cycles_commandes
  titre: Cycle commun des commandes
  capacites:
  - D04.i
  - D04.j
  - D04.k
  - D04.l
  - D04.m
  - D04.r
  - D04.t
  - D04.n
  decision: Étudier un noyau de cycle et de quantités partagé, puis chiffrer séparément les variantes de chaque
    commande. Aucune quote-part des anciens forfaits CSF-011 à 013.
- id: cycles_prestations
  titre: Cycle commun des demandes de prestation
  capacites:
  - service-order-picking
  - service-order-packing
  - service-order-cross-docking
  - service-order-labeling
  - service-order-kitting
  - service-order-garment-finishing
  - service-order-cleaning
  - service-order-repair-alteration
  - service-order-personalization
  - service-order-inspection
  - service-order-receiving
  - service-order-scrapping
  - service-order-transport
  - service-order-transport-booking
  - service-order-customs-clearance
  decision: Qualifier un cycle partagé, puis les exigences propres aux biens, au transport et à la douane. Conserver
    leurs trois Business Areas ; ne pas multiplier quinze fois un moteur de cycle.
- id: registres
  titre: Services techniques des registres
  capacites:
  - D01.g
  - inventory-ownership-ledger
  - process-ledger
  decision: Évaluer la persistance et la relecture communes ; conserver séparément les invariants de stock, de propriété
    et de dossier. Aucun ledger universel présumé.
qualifications_ciblees:
  D03.o: Définir les objectifs et conflits d’affectation ; comparer règles, heuristique et solveur sur les mêmes
    cas avant de choisir.
  D05.a: Définir le service cible, les données et le niveau de couplage entre magasins et centres de distribution
    ; le multi-échelon est une variante source à qualifier, pas un optimum global acquis.
  D05.d: Préciser les bénéficiaires, droits concurrents et règles d’arbitrage ; comparer l’effet des protections
    sur le service.
  D05.h: Fixer les critères de risque et d’immobilisation qui justifient un ajustement de la règle de réservation.
  D03.j: Fixer la profondeur des dépendances matière/capacité et les apports externes ; démontrer séparément tout
    besoin d’ordonnancement détaillé.
  transport-plan-decision: Définir nombre de chargements, arrêts, fenêtres et qualité de solution attendue ; évaluer
    construction de chargement et routage séparément.
  workflow-definition-management: Déterminer qui compose les parcours et avec quelles libertés ; ne pas financer
    un studio libre à partir d’un besoin de paramétrage borné.
  order-workflow-planning: Qualifier les changements autorisés pendant un parcours et ceux nécessitant une nouvelle
    version.
  order-workflow-orchestration: Définir les reprises et garanties d’exécution ; comparer les moteurs sur des dossiers
    Supply représentatifs.
  process-mining: Définir les variantes et indicateurs à détecter ; justifier séparément découverte automatique
    et alignement optimal éventuels.
  service-order-billing: Valider les faits déclencheurs, pièces et responsabilités de facturation de chaque chaîne
    intercompany.
  accounting-data-provision: Confirmer le contrat des faits des registres de stock et propriété avec Finance, distinct
    des demandes de facturation et de paiement.
statuts:
  propose: Proposition à revoir avec le métier
  non_recalibre: Couverture et JH non recalibrés sur cette grille
  historique: Évaluation précédente, conservée pour traçabilité
