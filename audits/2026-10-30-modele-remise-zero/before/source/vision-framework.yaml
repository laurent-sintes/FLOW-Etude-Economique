version: 1
id: framework-vision
opening:
  title: Construire la première étape d’une {{notion.plateforme_marques.court}}
  text: >-
    **La cible est une {{notion.plateforme_marques.court}} pour le Groupe. La {{notion.core_system}}
    en constitue la première étape.** L’étude compare les voies et les conditions
    de réalisation de cette étape, de son intégration et de son fonctionnement,
    dans une perspective d’investissement sur **dix ans**. Le périmètre évalué est
    celui des capacités retenues dans la cartographie ; les étapes ultérieures
    de l’ambition restent à définir et ne sont pas chiffrées implicitement.
    Sans cadrage applicatif détaillé ni dispositif arrêté, le framework produit
    des **ordres de grandeur explicables et révisables** pour préparer des décisions progressives.
adaptation:
  title: Des chiffres à discuter et à adapter
  text: >-
    **Les chiffres constituent une base de discussion, adaptable au contexte.**
    Charges, gains de productivité, tarifs et calendrier peuvent être confrontés
    aux conditions du projet. Les paramètres exposés permettent de construire
    des scénarios et d’en mesurer l’impact sur l’investissement, en conservant
    la référence commune pour les comparer.
  href: '#leviers'
  label: Comprendre les {{vue.leviers_calcul}}
approach:
  title: Sur quoi reposent nos estimations ?
  steps:
  - id: besoin
    title: Délimiter le résultat métier attendu
    text: >-
      **La cartographie métier fournit le référentiel commun.** Ses capacités
      délimitent ce que la {{notion.core_system}} doit couvrir, puis les adaptations
      propres à Beaumanoir. Elle structure les travaux Make et sert aussi à
      challenger les offres Buy. Les niveaux de complexité orientent l’analyse,
      sans conversion automatique en JH.
  - id: investissement
    title: Décider progressivement dans une perspective de dix ans
    text: >-
      Le moteur inscrit **travaux valorisés, achats et prix des offres** dans leur
      calendrier. Les simulations montrent l’effet des hypothèses sur la réalisation
      initiale, la transition et le fonctionnement. **Chaque étape d’engagement exige
      un résultat attendu, des preuves et un responsable de validation.** La perspective
      sur dix ans aide à préparer les choix de déploiement et de continuité ; elle
      ne constitue pas un engagement d’exécution de toute la trajectoire.
  matrix:
    caption: Make / Buy × Build / Run
    activity_label: Nature d’activité
    make_label: '{{notion.make}}'
    buy_label: '{{notion.buy}}'
    rows:
    - id: build
      title: Build — réaliser et faire évoluer
      make:
      - >-
        **{{notion.core_system}} :** cartographie métier → travaux après
        {{notion.reutilisation_logicielle}} → estimation des JH. Les références OSS
        et le diagnostic COCOMO confrontent les hypothèses ; ils ne calculent pas
        directement les JH FLOW.
      - >-
        **Intégration :** activités et déploiements Groupe, éclairés notamment par
        les **repères Synvance** sur les interfaces et les déploiements. Les évolutions
        sont dimensionnées par travaux et volumes.
      buy:
      - >-
        **Produit standard disponible.** L’intégration part des offres recueillies
        par Synvance et des projections de déploiement, avec leurs périmètres propres.
      - >-
        **Travaux client et évolutions :** identifier ce qui reste à réaliser hors
        offre, puis estimer les compléments justifiés. Une disponibilité au catalogue
        ne prouve pas une inclusion dans le prix.
    - id: run
      title: Run — exploiter et assurer le service
      make:
      - >-
        **Niveau de service et volumes attendus** → activités d’exploitation et de
        support → charges et tarifs. Le dimensionnement reste une hypothèse explicite.
      - >-
        **Achats techniques :** références fournisseurs et documentations tarifaires
        disponibles, avec leurs unités et conditions. Une provision d’étude reste
        distincte d’un devis.
      buy:
      - >-
        **Services et prix documentés dans le dossier Synvance**, avec leurs inclusions
        et périodes contractuelles. Les besoins non couverts font l’objet de compléments
        justifiés.
    notes:
    - >-
      **Build / Run qualifie les activités, pas leur fréquence.** Le MCO de la
      {{notion.core_system}} relève du Build. Un contrat Buy peut réunir les deux
      natures : son prix global est conservé lorsque sa ventilation n’est pas connue.
evidence:
  title: Appuyer l’estimation sur des sources qualifiées
  items:
  - id: perimetre
    title: Un périmètre métier que l’on peut vérifier
    text: >-
      **Les capacités retenues délimitent les travaux évalués.** La cartographie
      et les justifications de complexité permettent d’en vérifier les frontières.
      Les difficultés fonctionnelles restent distinctes des risques d’organisation
      et de réalisation à instruire.
    href: '#perimetre-retenu'
    label: Examiner le périmètre métier retenu
  - id: synvance
    title: Des besoins et des réponses fournisseur conservés
    text: >-
      **Synvance documente le besoin et les réponses sur l’intégration.** Propositions
      et questionnaires conservent leurs périmètres, inclusions, dates et séquences.
      Une fonction déclarée n’est pas automatiquement incluse dans le prix.
      Ces entrants servent à instruire Make comme Buy.
    href: '#synvance'
    label: Consulter les Repères Synvance
  - id: marche
    title: Des références de marché à transposer
    text: >-
      La méthode examine fonctions, éditions, déploiements et prix documentés.
      Les observations de logiciels open source (OSS) précisent composants et frontières.
      **Leur transposition à FLOW doit justifier les différences de travaux, de volumes
      et de responsabilités.** Le lien ci-dessous décrit cette méthode.
    href: '#marche'
    label: Comprendre la {{vue.evaluation_marche}}
  - id: methode
    title: Des charges rattachées aux travaux qui les justifient
    text: >-
      La méthode du skill prévoit, pour chaque lot, de documenter le résultat
      attendu, les inclusions, les hypothèses et la provenance.
      **Un mécanisme partagé possède un seul financement**,
      même lorsque plusieurs capacités l’utilisent.
    href: '#complexite'
    label: Lire la méthode d’estimation des JH développeur
dimensions:
  title: Quatre distinctions rendent le calcul relisible
  items:
  - title: Du brut au net, puis aux autres efforts
    text: >-
      Le brut décrit les travaux après réutilisation ; le net applique les gains
      explicites sur ce même périmètre. La {{notion.charge_totale_projet}} ajoute
      les autres efforts humains retenus, sans compter deux fois qualification,
      architecture ou pilotage.
  - title: Des JH aux euros
    text: >-
      Les JH sont valorisés selon les profils et tarifs applicables. Achats,
      licences et forfaits restent en euros. **Un forfait Buy prime sur les JH
      diagnostiques** et ne reçoit aucune remise automatique de productivité.
  - title: Des dépenses au calendrier
    text: >-
      Consommations, réceptions et séquences commerciales déterminent les périodes
      financées. Le calendrier Make est autonome. Un horizon commun peut donc
      contenir des durées de service différentes ; l’indexation suit les règles
      de chaque catégorie.
  - title: Build et Run, indépendamment des phases
    text: >-
      Les tags permettent de relire les mêmes dépenses selon leur nature. Le MCO
      des adaptations Beaumanoir se répartit entre Build et Run selon une clé
      paramétrable. **Une ventilation ne crée aucun financement supplémentaire** ;
      les parts inconnues restent identifiées.
confidence:
  title: Relier la confiance aux preuves de réalisation
  text: >-
    **Make désigne un produit sous maîtrise du Groupe ; sa réalisation peut s’appuyer
    sur un partenaire.** L’organisation produit, la participation métier, les compétences
    mobilisables, le transfert et la continuité doivent être établis. Les niveaux
    de preuve ci-dessous permettent de situer ce qui est défini, appliqué, relu ou
    démontré avant de décider de l’étape suivante.
  levels:
  - id: method
    title: Définir la méthode
    text: >-
      Les règles précisent le périmètre, les unités, les sources attendues et les calculs.
      **Une méthode définie décrit comment évaluer** ; son application doit être documentée séparément.
    href: '#complexite'
    label: Comprendre la méthode du skill
  - id: application
    title: Documenter son application
    text: >-
      Vérifier les données réellement utilisées, leur provenance, les travaux retenus
      et les contrôles exécutés. **La cohérence du calcul ne démontre pas la justesse
      empirique des hypothèses.**
    href: '#evaluation-core'
    label: Consulter l’application et sa provenance
  - id: review
    title: Relire l’évaluation
    text: >-
      **Une revue humaine explicite son auteur, son périmètre et ses réserves.**
      Le statut technique d’un dossier complet ne vaut ni validation humaine
      ni engagement de livraison. Vérifier le statut de revue de chaque évaluation.
    href: '#evaluation-core'
    label: Vérifier le statut et les réserves de l’évaluation
  - id: delivery
    title: Vérifier la capacité de réalisation
    text: >-
      Rapprocher références de grands projets et de transformation, équipe proposée,
      difficultés maîtrisées et transfert des compétences des besoins de FLOW.
      **La capacité d’eXalt reste à établir par des preuves vérifiables** ; le dossier
      distingue les éléments disponibles et ceux à réunir.
    href: '#capacite-realisation'
    label: Consulter le dossier de capacité de réalisation
  links:
  - href: '#conditions-realisation'
    label: Examiner les conditions de réalisation et les jalons de décision
  limits_title: Préserver les limites de la comparaison
  limits:
  - Conserver les inconnues et les écarts de périmètre. Une absence de preuve ne démontre ni une absence produit ni un coût nul.
  - Déclarer les efforts humains inclus, exclus ou restant à dimensionner avant d’annoncer une charge totale projet complète.
  - Ventiler Build / Run sur les parts documentées, sans convertir une part inconnue en zéro.
next:
  title: Choisir la suite de la lecture
  links:
  - href: '#modele'
    label: Comprendre la méthode
  - href: '#comparer'
    label: Consulter les résultats
  - href: '#capacite-realisation'
    label: Vérifier les conditions de réalisation
