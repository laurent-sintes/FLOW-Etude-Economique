date: '2026-10-29'
scope:
  inclus:
  - Modèle métier, qualification et contrats de lecture utiles à la décision du sponsor.
  - Vision et six pages détaillées du Framework.
  - Synthèse et deux dossiers Repères Synvance.
  - Navigation et accessibilité des entrants et des preuves dans ce parcours.
  exclus:
  - Audit du dossier économique, de ses pages et de ses résultats.
  - Pertinence des montants, recalibration et recommandation économique Make / Buy.
  - Vérification externe des cas Kiabi et Lidl rapportés par le sponsor.
statut: Audit et recommandations ; seules les instructions de travail AGENTS.md ont été complétées.
posture:
  source: Contexte communiqué directement par l’utilisateur le 29 octobre 2026.
  memoire: AGENTS.md#Posture et attentes du sponsor
  precision: La défiance envers SAP et les cas cités décrivent la perception du sponsor ; cet audit ne les établit pas comme des faits ni comme une preuve générale contre SAP.
avis:
  synthese: Le travail étaye la confiance dans une démarche d’estimation sérieuse. Il ne démontre pas encore la capacité à réaliser et porter durablement le Make avec eXalt.
  force: Périmètres, provenance des données, unités, formules, incertitudes et limites sont explicités avec rigueur.
  manque_central: Relier ambition de plateforme de marques, première étape Core, organisation de réalisation, preuves de capacité du partenaire et décisions progressives sur dix ans.
  limite: La satisfaction du sponsor est une appréciation prospective ; l’audit ne juge ni les performances réelles d’eXalt ni la pertinence des résultats du dossier économique.
acquis:
- Le programme, le produit générique et les adaptations Beaumanoir sont distincts. La convergence des SI des marques historiques et de Boardriders est déjà représentée.
- Make désigne déjà une maîtrise du Groupe et ne signifie pas automatiquement réalisation par ses salariés.
- Cartographie, OSS, COCOMO et Synvance ont des rôles distincts ; les limites de transposition sont explicites.
- La méthode distingue développement brut, net, effort humain total, budget, Build / Run et phases. Les inconnues ne deviennent pas zéro.
- Les contrôles de calcul ne sont pas présentés comme une validation empirique des hypothèses.
- Synvance reste accessible avec les besoins, propositions, questionnaires et sept pièces originales ; prix, projections et lectures arithmétiques sont distingués.
- Organisation, compétences, réversibilité et critères de décision existent dans les matériaux de décision, sans être tous exposés dans le parcours actif.
constats:
- id: ambition_et_accueil
  priorite: P1
  attente: Comprendre la plateforme de marques, dont le Core est la première étape.
  modele: La cible d’unification existe, mais la relation explicite ambition stratégique / première étape / périmètre évalué / étapes ultérieures manque.
  application: La Vision commence par un Go / No Go sur la poursuite de FLOW. Les dix pages auditées n’énoncent pas explicitement la plateforme de marques ni l’horizon dix ans. L’URL sans fragment et le logo renvoient à Comparer.
  consequence: Le sponsor peut croire qu’on rouvre le besoin de FLOW ou qu’on présente le coût de toute son ambition alors que l’étude couvre un périmètre défini.
  recommandation: Ouvrir sur la finalité, situer le Core et cadrer la décision sur les voies et conditions de réalisation. Faire de la Vision l’entrée du parcours et expliquer la perspective dix ans sans ajouter de budget.
  preuves:
  - source/vision-framework.yaml:6
  - source/fondamentaux.yaml:48
  - source/fondamentaux.yaml:95
  - source/glossaire.yaml:626
  - app/src/App.tsx:30
  - app/src/App.tsx:113
- id: dispositif_make
  priorite: P1
  attente: Comprendre comment réussir Make avec un Groupe historiquement organisé pour acheter.
  modele: La maîtrise produit est définie. Les responsabilités du journal désignent des catégories de financement et ne constituent pas une répartition des décisions et engagements entre acteurs.
  application: Le récit expose rapidement les trois écosystèmes techniques ; il rend peu visibles organisation produit, capacités disponibles, rôle du partenaire, participation métier et montée en autonomie.
  consequence: La comparaison peut laisser entière la question de la capacité réelle à porter le produit, indépendamment de la technologie et du calcul des JH.
  recommandation: Réutiliser les critères organisation et compétences existants. Décrire rôles, acteur envisagé, capacité disponible ou à constituer, preuve attendue, responsable de validation et continuité. Relier ces prérequis aux étapes sans les transformer automatiquement en dépenses.
  preuves:
  - source/glossaire.yaml:330
  - source/fondamentaux.yaml:120
  - source/modele-composable.yaml:23
  - source/decision-make-buy.yaml:174
  - source/decision-make-buy.yaml:254
  - source/deploiement-groupe.yaml:345
- id: capacite_exalt
  priorite: P1
  attente: Être rassuré sur eXalt en grands projets, transformation, méthode et difficultés du produit.
  modele: Aucun dossier de références et d’engagements eXalt n’est présenté dans le corpus audité. Le dispositif ne doit pas confondre références marché, qualité méthodologique et capacité du prestataire.
  application: Aucune référence eXalt, rôle effectivement tenu, équipe mobilisable, résultat établi ou preuve de transfert n’apparaît dans les dix pages lues.
  consequence: Le sponsor peut reconnaître un bon framework sans disposer d’une raison suffisamment étayée pour confier la réalisation à eXalt.
  recommandation: Recueillir des références réelles avec contexte, ampleur, rôle exact, difficultés traitées, transformation accompagnée, résultats vérifiables et limites de transposition. Les rapprocher des compétences et engagements proposés pour FLOW.
  emplacement: Dossier distinct de capacité et de faisabilité, relié au Framework qui décrit les critères d’évaluation. Les références eXalt ne doivent pas être inventées ni noyées dans les formules.
  dependance: Pièces et références eXalt à obtenir ; une réécriture seule ne satisfait pas cette attente.
  preuves:
  - source/vision-framework.yaml:88
  - source/decision-make-buy.yaml:341
  - tmp/sponsor-posture-audit-2026-10-29/active-reading.json
- id: points_chauds_et_cartographie
  priorite: P1
  attente: Vérifier que l’équipe connaît les nœuds de complexité et sait les traiter.
  modele: La grille possède des axes de complexité, fonctions, frontières et mécanismes partagés. Les risques organisationnels et de continuité existent dans d’autres matériaux mais ne sont pas reliés en une chaîne de preuve et de décision.
  application: Le schéma des Fondamentaux est statique. Aucun lien direct à la cartographie n’est exposé dans les pages auditées ; la route complexite ouvre la méthode du skill, pas la grille. Les mécanismes difficiles sont peu montrés au sponsor.
  consequence: Le lecteur doit croire la centralité de la cartographie sans pouvoir facilement vérifier les capacités et difficultés qui fondent le raisonnement.
  recommandation: Donner accès à la cartographie Beaumanoir et à son périmètre retenu. Présenter quelques points chauds réels, chacun lié à une capacité, au risque, à l’expérience ou preuve disponible, à la mesure proposée et au jalon de validation. Maintenir complexité fonctionnelle et risque de réalisation distincts.
  preuves:
  - source/methode-complexite.yaml:35
  - source/methode-complexite.yaml:59
  - source/fondamentaux.yaml:167
  - app/src/ModelMap.tsx:9
  - app/src/CoreMethodPage.tsx:4
  - source/decision-make-buy.yaml:329
- id: trajectoire_et_decision
  priorite: P1
  attente: Comprendre comment engager et piloter un investissement sur dix ans.
  modele: Phases, consommation, réception et continuité de service sont représentées. Des critères de poursuite et d’arrêt sont déjà écrits, mais ils ne forment pas des jalons reliés aux capacités et preuves de réalisation.
  application: Les conditions finales de la Vision portent surtout sur la recevabilité d’une estimation, sans répondre clairement à qui valide quoi avant l’étape suivante.
  consequence: Un calendrier et des efforts dimensionnés peuvent être perçus comme un engagement d’exécution, alors qu’ils restent conditionnés par des capacités à démontrer.
  recommandation: Organiser des jalons de décision progressifs avec résultat attendu, preuve, responsable et conditions de poursuite ou de réexamen. Faire apparaître les capacités de réalisation, acceptation, généralisation et autonomie sur la trajectoire, sans promettre d’un seul bloc dix ans d’exécution.
  preuves:
  - source/vision-framework.yaml:35
  - source/vision-framework.yaml:152
  - source/decision-make-buy.yaml:312
  - source/decision-make-buy.yaml:341
  - source/decision-make-buy.yaml:361
- id: acquis_synvance
  priorite: P2
  attente: Préserver l’étude des besoins et les réponses d’intégration, malgré le désaccord avec sa conclusion.
  modele: Demande, besoins, questionnaires, propositions et références Make sont conservés.
  application: Les repères sont clairs et accessibles, mais la synthèse commence par les propositions et leurs montants ; la substance du besoin et les réponses fonctionnelles restent surtout dans les pièces.
  recommandation: Introduire brièvement ce que Synvance apporte au besoin et à la compréhension de l’intégration avant les repères financiers. Donner des entrées explicites vers demande, besoins et questionnaires. Conserver ensuite la même grille d’exigence pour Make, Microsoft et SAP.
  vigilance: La divergence entre total imprimé SAP et somme des lots est une réserve documentaire précise, pas une preuve d’échec d’un ERP ni de supériorité du Make.
  preuves:
  - source/reperes-synvance.yaml:23
  - source/parcours-synvance.yaml:54
- id: niveaux_de_preuve
  priorite: P2
  attente: Pouvoir distinguer une méthode sérieuse, une évaluation appliquée et une capacité de livraison démontrée.
  modele: La qualification, la revue humaine et le candidat pour relecture sont distincts. Le statut complete du contrat ne constitue pas une revue humaine ni un engagement de livraison.
  application: Les notices sont honnêtes, mais certains raccourcis comme Estimée par le skill et des liens de la rubrique preuves vers d’autres méthodes peuvent laisser attendre une démonstration déjà réalisée.
  recommandation: Distinguer comprendre la méthode, consulter son application, lire une revue et vérifier une preuve de réalisation. Garder la provenance détaillée avec les résultats dans leur dossier ; qualifier les formulations conceptuelles et les liens dès le Framework.
  preuves:
  - source/methode-evaluation-core.yaml:10
  - source/vision-framework.yaml:100
  - source/fondamentaux.yaml:211
  - tools/core_qualification.py:195
  - tools/core_qualification.py:234
  - tools/core_qualification.py:255
ordre_propose:
- Recentrer Vision et accueil sur plateforme de marques, Core première étape et décision à préparer.
- Définir le dispositif de réalisation Make et les conditions organisationnelles à réunir en réutilisant les matériaux existants.
- Donner accès aux entrants et à une lecture concrète des points chauds, avec un niveau de preuve explicite.
- Constituer le dossier de capacité eXalt à partir de références et de compétences vérifiables.
- Relier conditions, preuves, responsabilités et jalons à la trajectoire de décision sur dix ans.
- Finaliser le parcours court du sponsor en gardant le détail méthodologique accessible et sans blocs à déplier.
regle_de_placement:
- Entrants et preuves originales dans les données d’entrée.
- Définitions, critères et traitement dans le Framework.
- Références eXalt, faisabilité organisationnelle et preuves de capacité dans un volet de capacité distinct, à articuler au Framework.
- Analyses, hypothèses retenues et résultats économiques dans le dossier économique, non audité ici.
verification:
  application_locale: Dix pages lues dans le navigateur à partir de leurs routes actives, sans ouvrir de page du dossier économique.
  source_des_constats: YAML canoniques, code de rendu actif et contrats métier ; relectures indépendantes du récit, du modèle et du parcours.
  limites: La présence ou l’absence d’un mot n’a pas été prise seule comme preuve ; les composants et données qui portent les notions ont été relus.
  controle_technique: Aucun nouveau contrôle complet du moteur requis pour une modification documentaire de AGENTS.md.
  serveur: Application locale courante, sources_current true.
  trace: tmp/sponsor-posture-audit-2026-10-29/active-reading.json
application_modifiee: false
modele_economique_modifie: false
