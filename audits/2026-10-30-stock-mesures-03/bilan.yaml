not_yet_costable_reasons:
- Les vues, permissions et imports/raccordements non retenus ne sont pas mesurés.
- Des méthodes mixtes restent en frontière ; certaines contiennent le workflow natif excédentaire, d’autres des
  dépendances à délimiter.
- Le noyau observé ne couvre pas tous les faits externes, filiations/Handling Units, reprises, limites de connaissance
  et garanties Flow.
- Les contrats de fourniture Finance, planification et retour produit restent à dimensionner, à partir de références
  et hypothèses bornées.
- Le comptage COSMIC et la confrontation des activités ne sont pas encore réalisés pour cette famille.
