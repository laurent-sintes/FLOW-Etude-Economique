meaning: Les unités sont des instructions et déclarations syntaxiques sélectionnées. Elles ne sont ni des lignes
  physiques ni des CFP, ni le nombre de fonctions métier. Le total programme + déclaratif emploie un poids 1 affiché
  pour la lecture, sans calibration de productivité entre langages.
critical_path_findings:
- product: ERPNext / Frappe
  write: Document métier vers sauvegarde Frappe et SQL, code générique partagé.
  correction: Décalage des quantités futures, ordre date/création et borne au prochain inventaire identifiés.
  concurrency: Requêtes for_update repérées, sérialisation complète non démontrée.
- product: Odoo
  write: Mise à jour du cache de champs puis flush et écriture SQL ; pas un appel direct write→SQL.
  correction: Ajustement via un mouvement et synchronisation des quants.
  concurrency: Verrou sur quants existants ; création et retries à qualifier.
- product: Tryton
  write: Transition de workflow vers ModelSQL.write ; ne pas assimiler le petit corps de assign à tout le comportement.
  correction: Lignes d’inventaire vers mouvements correctifs ; Move.do financier non compté en totalité.
  concurrency: Verrouillage de lignes ou de modèle dans le chemin natif d’affectation ; pas de test de contention.
- product: Axelor
  write: Mise à jour des quantités vers repository et JPA ; branches de réapprovisionnement exclues du comptage.
  correction: Inventaire vers mouvements correctifs et actualisation des positions ; métadonnées de dernier inventaire
    distinguées de la quantité actuelle.
  concurrency: Transaction repérée ; verrou exclusif non établi dans les chemins examinés. Garantie ouverte, sans
    conclure à une absence générale dans le produit.
