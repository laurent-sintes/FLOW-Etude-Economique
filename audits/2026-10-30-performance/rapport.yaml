findings:
- id: PERF-01
  priority: 1
  subject: Les validations isolées relisent les mêmes données
  evidence:
    parses_without_session: 55
    parses_with_session: 30
    native_capture_without_session: 5
    native_capture_with_session: 1
    same_results: true
    measured_speedup: 2.8277271628614775
  recommendation: Encadrer chaque validation autonome dans un chargement isolé du modèle et partager les données
    de référence immuables dans les tests. Conserver les copies des variantes et tous les contrôles de rejet.
  limit: Le gain mesuré porte sur cette validation ; il ne prédit pas exactement la durée future de toute la suite.
- id: PERF-02
  priority: 2
  subject: Le démarrage consacre surtout du temps à analyser et recopier les données
  evidence: 'Profil instrumenté : environ 6,77 s dans le chargement YAML et 7,21 s dans deepcopy, sur 15,91 s profilées.
    Le chargement réel médian sans profilage est de 7,76 s.'
  recommendation: Réduire les copies profondes redondantes aux frontières réellement mutables ; conserver l’isolation
    des simulations et la vérification des sources. Étudier séparément la lecture JSON des preuves JSON avec rejet
    des doublons.
- id: PERF-03
  priority: 2
  subject: La composition du téléchargement refait le travail même si les données sont inchangées
  evidence:
    compose_seconds: 0.2305192000058014
    serialize_seconds: 3.937072000000626
    file_bytes: 18139260
  recommendation: Contrôler les empreintes des dépendances avant de reconstruire le modèle et le YAML ; réutiliser
    uniquement un export dont les sources et le générateur sont inchangés, avec régénération si absent ou altéré.
- id: PERF-04
  priority: 2
  subject: Le fichier téléchargeable est servi sans compression
  evidence:
    content_type: application/octet-stream
    content_encoding: null
    file_bytes: 18139260
    gzip_trial_bytes: 2648115
    gzip_trial_seconds: 0.3948960999987321
  recommendation: Déclarer explicitement le type YAML sur le serveur local pour activer sa compression existante.
    Le fichier reste identique après décompression.
  limit: Le transfert local rapide masque le coût des 18,1 Mo sur une connexion distante ; la configuration de GitHub
    Pages n’est pas mesurée ici.
