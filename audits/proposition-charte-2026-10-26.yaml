statut: Proposition visuelle, non appliquée à l’application
titre: FLOW — une identité plus énergique
intention: Contrastes francs, orange vif en accent, lecture claire.
palette:
- nom: Ivoire
  valeur: '#FAF8F4'
  role: Fond de lecture
- nom: Encre
  valeur: '#182632'
  role: Titres et chiffres
- nom: Orange vif
  valeur: '#FF7A1A'
  role: Actions et points clés
- nom: Pêche claire
  valeur: '#FFF0DB'
  role: Fond des conclusions
- nom: Vert profond
  valeur: '#086B63'
  role: Signature et liens
regles:
- L’orange vif reçoit un texte encre ; ne pas l’assombrir pour y placer du blanc.
- Aucun grand aplat orange ou terracotta. Les fonds de lecture restent clairs.
- Le vert pâle cesse d’être le fond récurrent des cartes et tableaux.
- Les titres, chiffres et conclusions portent la hiérarchie avant la décoration.
- Les animations signalent un changement ou l’arrivée d’un repère ; pas de boucle.
- Le design aide à saisir l’intérêt du projet, ses écarts et ses conditions de Go ; il ne masque pas les contreparties.
sources:
- titre: Wilms et Oberfeld — Color and emotion
  url: https://pubmed.ncbi.nlm.nih.gov/28612080/
  apport: La saturation et la luminosité influencent aussi l’activation émotionnelle. Expérience sur des couleurs isolées, pas preuve d’effet sur une décision d’investissement.
- titre: Nielsen Norman Group — Using Color to Enhance Your Design
  url: https://www.nngroup.com/articles/color-enhance-design/
  apport: Dominantes neutres, accent réservé aux éléments importants et usage cohérent.
- titre: IBM Carbon — Motion
  url: https://www.carbondesignsystem.com/building-blocks/foundations/motion/overview
  apport: Mouvement discret pour les interactions courantes, plus expressif aux moments importants.
- titre: W3C — Contrast Minimum
  url: https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html
  apport: Vérifier le contraste de chaque paire texte/fond, plutôt que foncer systématiquement l’accent.
