base_scope: Registre et effets des mouvements, positions actuelles/passées et apports connus, comptages/ajustements,
  quantités engagées et protections natives de concurrence. L’intégration Beaumanoir, la comptabilité générale,
  le PLM, la promesse et l’optimisation ne sont pas chiffrés.
complement_scope:
- id: STOCK-F01
  analogue: correction_chain
  assumed_fraction: 1
  range:
  - 0.5
  - 1.5
  basis: Un module nouveau d’admission sémantique/révision des faits, avec soldes externes, filiation et contenu.
    Hypothèse de taille comparable à une chaîne native complète de correction, après attribution Stock. Les primitives
    du registre sont appelées, pas réimplémentées ; enveloppe/version génériques déjà financées.
  shares_by_reference:
    erpnext: 61.14044685452807
    odoo: 60.42475191515983
    tryton: 46.8487584232069
    axelor: 34.348064573369804
- id: STOCK-F02
  analogue: positions_component
  assumed_fraction: 0.5
  range:
  - 0.25
  - 0.9
  basis: Extension de composition des provenances, fraîcheur et limites ; les calculs quantitatifs de base sont
    réutilisés. Hypothèse centrale d’un module moitié aussi volumineux que le comportement de position native attribué.
  shares_by_reference:
    erpnext: 18.041820877594283
    odoo: 71.95727769715013
    tryton: 31.514406636864322
    axelor: 15.848130118526832
- id: STOCK-F03
  analogue: inventory_component
  assumed_fraction: 0.35
  range:
  - 0.15
  - 0.7
  basis: Protocoles, preuve, autorité et rapprochement des mouvements concomitants ; pas nouveau moteur de comptage.
    Un module compagnon estimé à 35 % du comportement d’inventaire de référence.
  shares_by_reference:
    erpnext: 15.272445130171878
    odoo: 29.384943120099887
    tryton: 34.45111622603411
    axelor: 35.89479563153108
- id: STOCK-F04
  analogue: reservation_chain
  assumed_fraction: 0.5
  range:
  - 0.25
  - 1
  basis: Identité/version de commande, premier conflit, consommation/libération et expiration. Disponibilité, mutation
    et transactions sont réutilisées ; module de commande estimé moitié d’une chaîne native de réservation.
  shares_by_reference:
    erpnext: 10.411931604238417
    odoo: 20.139175843554987
    tryton: 19.968622216197573
    axelor: 8.313011842392097
- id: STOCK-F05
  analogue: positions_component
  assumed_fraction: 0.25
  range:
  - 0.1
  - 0.5
  basis: Extraction typée des faits Finance et suivi du résultat, via publication/journal communs. Module estimé
    au quart du comportement de restitution native ; pas comptabilité ni valorisation.
  shares_by_reference:
    erpnext: 9.849995901642933
    odoo: 38.723904956628715
    tryton: 18.17349778751543
    axelor: 10.246135406300315
- id: STOCK-F06
  analogue: inventory_component
  assumed_fraction: 0.2
  range:
  - 0.1
  - 0.4
  basis: Constat produit, contexte, preuve et correction, via admission/publication communes. Module estimé au cinquième
    du comportement d’inventaire natif ; aucun PLM ou workflow de résolution.
  shares_by_reference:
    erpnext: 8.977153150480282
    odoo: 17.369346828218752
    tryton: 20.350670285082817
    axelor: 21.161491486616665
- id: STOCK-F07
  analogue: correction_chain
  assumed_fraction: 0.25
  range:
  - 0.1
  - 0.5
  basis: Nouveaux rapprochements Stock faits/engagements/sorties et branchement au coordinateur de reprise existant.
    Module estimé au quart de la chaîne de correction ; aucun backup, moteur de batch ou provision QA additionnels.
  shares_by_reference:
    erpnext: 15.745714748546348
    odoo: 16.67147128601353
    tryton: 13.239470072109075
    axelor: 10.073141165446067
complement_allocation_note: Les parts par ensemble répartissent le supplément COCOMO selon la taille estimée. Leur
  somme rejoint le supplément ; ce ne sont pas sept efforts COCOMO autonomes.
reuse:
  owner: master-data-java-spring
  services: Identités/références, enveloppes d’admission, versions, protection, coordinateur de reprise et mise
    en service.
  exact_native_MD_overlap_deduction_preserved: true
  no_second_framework_assimilation: true
  native_fields_mapped_instead_of_recreated:
  - model: StockFactExtension
    field: eventAt
    policy: exposé depuis la date/quantité native déjà comptée ; raccordement inclus dans le module Flow, pas nouveau
      champ persistant
  - model: StockCommitmentExtension
    field: originalQuantity
    policy: exposé depuis la date/quantité native déjà comptée ; raccordement inclus dans le module Flow, pas nouveau
      champ persistant
  dependency: Patrimoine financé et supposé utilisable ; pas une observation de code Flow livré.
hypotheses:
- id: H1
  text: Les 62 fichiers et les compléments définissent une base d’opportunité suffisante ; extensions installables
    et cas rares non exhaustifs. Les parties mixtes sont attribuées par jugement d’ingénierie, avec minimum déjà
    mesuré et sensibilité.
- id: H2
  text: Les nouveaux modules Flow sont de taille comparable aux fractions explicites des composants/chaînes natives.
    Ces fractions ne sont ni des normes de marché ni des observations d’effort.
- id: H3
  text: Master Data et ses services génériques sont disponibles et utilisables ; leur coût retenu est conservé,
    seuls les travaux spécifiques Stock sont ajoutés.
- id: H4
  text: Un module Stock, une base transactionnelle, architecture standard réutilisant les services Master Data.
    Pas de réservation distribuée entre bases ; aucun engagement de débit, latence ou RPO/RTO spécifique.
- id: H5
  text: Équipe nominale maîtrisant son écosystème, PERS=PREX=1 ; conventions 152 h/mois-personne, 7 h/JH, phases
    1,18 et délai 1,25. Les essais de sensibilité ne sont pas des probabilités.
- id: H6
  text: 'Base commune : mouvements/registre, positions connues, comptages et quantités engagées. Compléments : admission
    externe, révisions/double date, autorité, filiation/contenu, protocoles, reprise, et contributions typées. Pas
    intégration Groupe, GL, PLM, promesse ou optimisation.'
- id: H7
  text: Les quatre chiffres sont des charges modélisées du périmètre cible dans chaque écosystème natif, après patrimoine
    Master Data. Pas coût historique des produits, ni mesure de code Flow existant.
- id: H8
  text: La projection Java/Spring peut utiliser Axelor comme référence sous l’équivalence de framework déjà posée
    ; cette équivalence n’est pas une calibration empirique. Les quatre alternatives ne sont pas additionnées.
