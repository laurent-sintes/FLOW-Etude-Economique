date: '2026-10-28'
objet: Diffuser la notion de réutilisation du patrimoine logiciel dans les contenus courants.
decision:
  terme: Réutilisation du patrimoine logiciel
  forme_courte: Réutilisation
  terme_genie_logiciel: Réutilisation logicielle
  anglais: Software reuse
  distinction: La capitalisation constitue et enrichit le patrimoine ; la réutilisation le mobilise dans un projet.
sources_terminologiques:
- https://www.lirmm.fr/~dony/postscript/comp-these-lf.pdf
- https://smals.be/fr/que-faisons-nous/applications/reutilisation-de-logiciels
glossaire:
  proprietaire: source/glossaire.yaml
  notions: [patrimoine_logiciel, reutilisation_logicielle, capitalisation_logicielle]
diffusion:
- Fondamentaux, méthode du skill et calcul du net.
- Méthodes de complexité et de marché, explications et parcours sponsor.
- Contrats de travaux partagés et libellés des détails dans l’application.
- Documentation courante et règles de rédaction du projet.
conservation:
- Clés techniques et identifiants historiques stables pour préserver les contrats.
- Ancien terme conservé uniquement comme synonyme historique dans le glossaire.
- Preuves originales, diagnostics et audits antérieurs inchangés.
validation:
  valeurs_numeriques_comparees: 1404
  changement_economique: false
  python_tests: 166
  frontend: tests, types, content, build passed
  parite: Cinq options et horizons 3/5/7/10 identiques ; témoin de simulation préservé.
  contenu: Aucun ancien terme dans les textes courants hors synonymes historiques.
audit_lisibilite:
  reference: audits/2026-10-28-lisibilite-methode-core.yaml
  statut: Préconisations validées par l’utilisateur et déjà appliquées.
