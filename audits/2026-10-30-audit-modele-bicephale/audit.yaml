date: '2026-10-30'
verdict: Calculs retenus reproductibles et sources examinées intactes. Le dispositif conserve correctement la décision
  Master Data, mais ses contrôles et certaines relations métier sont insuffisants pour généraliser aux autres unités.
  La comparaison numérique des deux voies existe ; leur équivalence de périmètre et leur validité prédictive ne
  sont pas démontrées.
decision: Conserver les 1 500 JH et les 17 mois adoptés. Aucun nouveau chiffrage, coefficient ou budget n’est appliqué
