date: '2026-10-28'
objet: Page complémentaire Méthode de calcul du Run, avec la clarté et les formules de la méthode Build.
source: source/methode-calcul-run.yaml
route: '#calcul-run'
structure:
- Définir le service à assurer.
- Dimensionner les interventions.
- Valoriser les prestations.
- Chiffrer les moyens et les contrats.
- Positionner les dépenses dans le temps.
- Identifier la part Run.
presentation:
- Rendu MethodDocument partagé, raison d’être puis traitements et résultat à chaque étape.
- Sommaire vertical, emphases ciblées, formules et unités visibles, aucun exemple fictif.
- Navigation après Des charges au budget et avant Évaluation de marché ; lien de suite Build vers Run.
formules_verifiees:
- Demandes N1 selon utilisateurs nominatifs et fréquence, puis escalades N3.
- JH fixes et variables, gain applicable en régime stabilisé, valorisation par profil et outillage.
- Supplément de tarif pour expertise Make sur des journées déjà comptées.
- Provision de coordination sur les prestations estimées et non les achats ou forfaits.
- Enveloppes techniques mensuelles et annuelles, prix documentés selon couverture.
- Services locaux de transition selon parts d’utilisateurs et périodes après réception, services partagés comptés une fois.
- Indexation du régime stabilisé depuis le début du plan, séquences contractuelles de licences Buy et relais sans chevauchement.
- Différences de cumuls arrondis pour conserver les financements au centime.
- Complément de part Run et formule de ventilation monétaire présentés comme règle analytique future.
frontieres:
- MCO de la Plateforme Core System classé Build conformément à la convention utilisateur.
- Clé du MCO de l’intégration référencée sans copie du pourcentage courant dans la prose.
- Dépenses calculées et annuités distinctes du total analytique Build/Run non encore agrégé.
- Gains annuels non appliqués aux prestations de transition Make.
- Cloud et iPaaS chiffrés par enveloppes, sans conversion automatique des volumes métier en facture fournisseur.
- Forfaits de services SAP dans la base annuelle indexée, distincts des séquences contractuelles de licences.
- Parts inconnues des contrats Buy conservées ; aucune inclusion financée deux fois.
references_moteur:
- tools/model_inputs.py
- tools/calculate_costs.py
- tools/composable_costs.py
- tools/project_investment.py
references_metier:
- source/maintenance.yaml
- source/architecture.yaml
- source/modele-composable.yaml
- source/deploiement-groupe.yaml
- source/calibration-couts.yaml
validation:
  relecture: Formules et cohérence éditoriale relues indépendamment, corrections intégrées.
  suite_complete: 173 tests Python réussis ; tests JavaScript, types, contenu et build réussis.
  parite: Témoin de simulation préservé, résultats des cinq options et horizons 3/5/7/10 inchangés.
  rendu: Six étapes et résultats, six tableaux et vingt et une expressions de calcul visibles.
  clavier: Le sommaire place le focus sur le titre de l’étape, tableaux accessibles au clavier.
  responsive: Contrôlé à 800 et 390 pixels ; aucun débordement de page ou de formule, tableaux à défilement contenu.
  navigation: Lien depuis Build, entrée du menu et suite vers Évaluation de marché vérifiés.
  serveur: Application locale actualisée, page Run laissée ouverte.
  captures:
  - output/methode-run-apercu.jpg
  - output/methode-run-formules.jpg
economic_change: false
