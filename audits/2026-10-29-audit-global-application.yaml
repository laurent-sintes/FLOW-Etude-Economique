  capacite_realisation:
    constat: Les références vérifiées eXalt, l’équipe mobilisable et les preuves sur les points de complexité restent à réunir ; la page distingue explicitement disponible et attendu.
    reference: source/capacite-realisation.yaml:9
    suite: Constituer le dossier de preuves et faire valider les responsabilités, moyens, démonstrations et jalons avant engagement de réalisation.
  total_projet_et_build_run:
    constat: La charge totale projet en JH et la comparaison monétaire analytique Build/Run ne sont pas entièrement constituées. Les provisions en euros et les contrats Buy groupés restent correctement identifiés.
    suite: Conserver ces limites visibles ; ne pas convertir implicitement des forfaits en charges ni fabriquer une ventilation manquante.
