avis:
  synthese: L’application constitue désormais un support cohérent pour comprendre et explorer l’étude d’opportunité. Aucun défaut bloquant général ni nouvel écart de formule active n’a été confirmé dans le périmètre vérifié.
  reserves: Deux défauts affectent des situations particulières de simulation. Trois améliorations de consultation et une orientation de lecture complémentaire sont recommandées.
  sponsor: La démarche peut susciter la confiance par sa traçabilité, ses hypothèses discutables et ses limites explicites. Elle ne démontre pas encore, à elle seule, la capacité d’eXalt et de l’organisation client à livrer le produit.
  investissement: L’étude peut soutenir la discussion de scénarios et de jalons ; elle ne constitue ni un engagement forfaitaire, ni la preuve de financement complet de la plateforme de marques.
acquis:
- La matrice Make/Buy–Build/Run explique les familles d’entrants sans forcer le choix Make ou Buy.
- Synvance conserve son statut de donnée reçue, ses réserves et ses sept pièces originales ; la cartographie structure Make et challenge Buy.
- Le Framework décrit les méthodes et les entrants ; le dossier économique expose les hypothèses appliquées et les résultats.
- Les assiettes brut, net, QA indépendante, autres efforts et budgets en euros sont distinguées ; aucune seconde réduction de réutilisation n’a été constatée.
- L’intégration Make active vient des activités Groupe ; le contrepoint SAP est décrit comme diagnostique dans le parcours affiché.
- Le MCO Core est classé Build ; le MCO intégration utilise la clé paramétrable 50/50. Récurrence, chronologie et classement analytique sont distingués.
- Les écarts de périmètre, exclusions, années de service et besoins résiduels accompagnent désormais les résultats économiques.
- Les conventions d’indexation, réceptions et séquences contractuelles Buy concordent avec les formules inspectées.
- Les skills d’évaluation renvoient au projet déplacé et aux mêmes méthodes canoniques que l’application ; une observation documentaire ne devient pas automatiquement un budget.
- Aucun bloc éditorial à déplier ni lien de téléchargement YAML n’a été relevé dans les 19 parcours inspectés. Les bulles de glossaire ne constituent pas des accordéons éditoriaux.
- Les erreurs réseau conservent le dernier résultat valide et empêchent de sauvegarder ou exporter un résultat incohérent.
- Les sessions et sauvegardes nommées conservent leurs contrats distincts de reprise ; les simulations personnelles n’ont pas été utilisées pour les essais.
constats:
- id: seuil_sap_diagnostic
  priorite: P2
  ordre: 1
  pages: ['#simuler']
  titre: Le contrepoint SAP bloque encore le recalcul de simulations pourtant valides.
  constat: Le champ Budget d’intégration Buy accepte zéro, mais le moteur refuse le calcul lorsque le budget SAP est inférieur aux retraits historiques Finance et compléments génériques du contrepoint.
  reproduction: Study.validate accepte SAP à 1 M€ ; Study.simulate renvoie invalid_anchor. Le rejet subsiste à 2 583 119,33 €, tandis que 2 583 119,34 € est accepté.
  consequence: Une hypothèse diagnostique sans effet sur le budget Make actif empêche de recalculer les cinq options et restreint les baisses SAP annoncées comme possibles par le paramétrage.
  precision: L’intégration Make reste calculée par ses activités Groupe ; il ne s’agit pas d’un montant de référence erroné démontré par cet audit.
  recommandation: Accepter les budgets Buy dans les bornes affichées. Sous le seuil, déclarer uniquement le contrepoint SAP non interprétable et expliquer pourquoi ; préserver les calculs actifs et les sauvegardes.
  verification_future: Ajouter un scénario SAP inférieur au seuil et remplacer le test qui impose actuellement le rejet à zéro ; vérifier référence, cinq options et contrats de stockage inchangés.
  references:
  - tools/study_app.py:159
  - config/application.yaml:449
  - tools/test_study_app.py:635
- id: reprise_calcul_reseau
  priorite: P2
  ordre: 2
  pages: ['#simuler']
  titre: La relance demandée par l’erreur réseau n’est pas disponible.
  constat: L’alerte invite à réessayer, mais le rendu actif ne contient pas le bouton de relance prévu dans l’ancien rendu du composant.
  reproduction: Interrompre un appel à /api/simulate, modifier une valeur puis rétablir le réseau. L’erreur persiste sans nouvelle modification de valeur ou rechargement.
  consequence: Le lecteur ne peut exécuter l’action annoncée, bien que son brouillon et le dernier résultat valide soient préservés.
  recommandation: Ajouter une action Réessayer dans l’alerte active, utilisant le mécanisme de relance existant, sans réinitialiser le brouillon ni les sauvegardes.
  verification_future: Simuler une panne temporaire puis une reprise réussie ; vérifier conservation du brouillon et protection des résultats pendant l’erreur.
  references:
  - app/src/Simulations.tsx:42
  - app/src/Simulations.tsx:71
  preuves_locales:
  - tmp/audit-application-global-2026-10-29/technical-probes.json
  - tmp/audit-application-global-2026-10-29/simulation-network-error.png
- id: echelles_complexite
  priorite: P2
  ordre: 3
  pages: ['#perimetre-retenu']
  titre: Les niveaux de complexité sont dépourvus d’échelle consultable.
  constat: Les trois axes affichent des nombres seuls. La source définit pourtant une échelle ordinale de 1 à 5 et des seuils propres à chaque axe ; la préparation de l’écran ne transmet que les titres.
  consequence: Un relecteur ne peut juger la cohérence entre une justification et le niveau attribué en restant sur cette page.
  recommandation: Afficher Niveau sur 5 et une légende lisible des seuils par axe, dérivée de la méthode canonique. Maintenir l’absence de somme, de moyenne ou de conversion automatique en JH.
  verification_future: Vérifier la présence des définitions sources et l’identité des notes existantes, sans accordéon.
  references:
  - source/methode-complexite.yaml:8
  - source/methode-complexite.yaml:34
  - tools/delivery_readiness.py:215
  - app/src/DeliveryReadinessPage.tsx:35
- id: acces_glossaire
  priorite: P2
  ordre: 4
  pages: ['#modele', '#marche', '#complexite', '#calcul-net', '#calcul-run', '#leviers']
  titre: Le glossaire canonique n’a plus d’entrée directement consultable.
  constat: La route historique glossaire conduit aux Fondamentaux sans ouvrir le glossaire. Quelques titres de concepts offrent une bulle ; les textes de méthode ne donnent pas accès aux définitions de façon constante.
  consequence: Un lecteur découvrant COCOMO, skill, JH, MCO ou CaaS ne dispose pas d’un repère persistant pour retrouver le vocabulaire partagé.
  recommandation: Rétablir un accès persistant à un glossaire lisible et recherchable, puis relier les premières occurrences utiles. Réutiliser les définitions canoniques, conserver QA et ne pas ajouter de blocs à déplier.
  verification_future: Vérifier navigation directe, recherche des principales notions et absence de définitions concurrentes.
  references:
  - app/src/App.tsx:28
  - app/src/ModelPage.tsx:25
  - app/src/MethodDocument.tsx:8
- id: navigation_perimetre
  priorite: P2
  ordre: 5
  pages: ['#perimetre-retenu']
  titre: La lecture du périmètre exige de connaître les libellés ou de parcourir toute la liste.
  constat: Les 88 capacités sont présentées en liste continue, avec recherche textuelle mais sans sommaire par domaine ni regroupement visuel de la hiérarchie.
  mesure: Environ 6 037 mots, 36 166 pixels à 1440 pixels de largeur et 56 247 pixels à 390 pixels de largeur dans les essais locaux.
  consequence: La preuve est disponible, mais son organisation ne permet pas de comprendre rapidement l’étendue du périmètre ni d’accéder à une famille de capacités.
  recommandation: Ajouter une synthèse de la hiérarchie, un sommaire avec ancres et un regroupement par domaine métier. Conserver les détails ouverts, la recherche, les frontières et les sources existantes.
  verification_future: Vérifier l’accès aux familles sans connaître les noms des capacités, la conservation des 88 capacités et les parcours mobile et clavier.
  references:
  - app/src/DeliveryReadinessPage.tsx:31
  preuves_locales:
  - tmp/audit-application-global-2026-10-29/reading.json
- id: orientation_vision
  priorite: P3
  ordre: 6
  pages: ['#vision']
  titre: La Vision pourrait mieux orienter trois intentions de lecture.
  constat: La sortie principale conduit aux Fondamentaux, alors qu’un sponsor peut souhaiter consulter directement les résultats ou les conditions de réalisation.
  recommandation: Ajouter un choix bref en fin de Vision vers Comprendre la méthode, Consulter les résultats et Vérifier les conditions de réalisation. Conserver le contenu de fond et le menu existant.
  references:
  - source/vision-framework.yaml:204
