version: 1
date: '2026-10-27'
statut: proposition_conditionnelle_non_appliquee
objet: Enveloppe externe de passage au Groupe après livraison du Flow Core System, hors build déjà financé.
base: audits/2026-10-27-integration-make-rapprochement-preuves.json
prix: Prix de travail constants du modèle, sans indexation ni gains de productivité. Pas un devis commercial ni des euros 2026 normalisés.
lecture_couts:
  statut: Correspondance avec les agrégats historiques du moteur, non définition du MCO client. La lecture par responsabilités ci-dessous isole le cycle de vie du Core.
  glossaire: source/glossaire.yaml
  build_core_system_hors_enveloppe: true
  natures:
    integration_migration: [travaux_communs_conserves, coordination_technique_commune, deploiements_locaux, coordination_technique_deploiements, direction_coordination_programme]
    mco_run: [maintien_core, moyens_techniques_pendant_deploiement, exploitation_transitoire_client]
  precision: Run & MCO démarre pendant l'intégration ; la période ne crée pas une nouvelle nature de coût. Chaque poste appartient à une seule nature et figure une seule fois dans le total.
  periode: Depuis le début de l'intégration jusqu'à sa fin, borne finale exclue. Le Run & MCO à pleine capacité prend ensuite le relais ; aucune annuité complète n'est ajoutée à cette enveloppe.
lecture_responsabilites:
  cycle_vie_core_system: Corrections génériques, releases et évolutions du produit, avec calendrier propre. Réalisées en Make, achetées avec le produit en Buy. Hors MCO des adaptations client.
  run: Consommation des moyens et exploitation opérationnelle des environnements ; démarre dès leur usage, y compris pendant le build et l'intégration.
  mco_client: Maintien des configurations, adaptations, interfaces et compatibilité du contexte client. Prend le relais après réception/stabilisation des livrables concernés, pas nécessairement après tout le programme Groupe.
  limite_ventilation: Plusieurs activités et forfaits mêlent des services. Pas de prorata financier inventé ; les prix groupés restent uniques, avec inclusions et parts non ventilables explicites.
  hebergement_pendant_build:
    nature: run
    montant_eur_ht: null
    constat: Aucun budget explicite d'hébergement pendant le build identifié dans le calcul actif. Les 8 euros par JH financent l'outillage de réalisation, pas une preuve de couverture cloud.
    portee: Hors de l'enveloppe présente, qui commence après le build. Dimensionner les environnements de fabrication ; ne pas appliquer automatiquement le coût du socle de production.
perimetre:
  domaine: supply-chain-orchestration
  utilisateurs: 950
  instances_storeland: 8
  ensembles_si: 2
  applications_externes: 10
  donnees_actives_to: 2
  donnees_archives_to: 5
  unites_deploiement: 4
  poles_candidats: [Boardriders, Vibs, Premium, La Halle]
  precision: Quatre unités de travail proposées, pas une identité prouvée entre pôle, pays et unité Avanade. Regroupement des huit instances à organiser. Sarenza non ajouté ; aucune fonction métier nouvelle.
  repartition_usagers_par_unite: [0.25, 0.25, 0.25, 0.25]
  precision_usagers: Hypothèse symétrique pour calculer la montée du support, pas effectifs réels des pôles.
  recette: Un socle de recette intégrée commun et quatre acceptations locales. Les 43 situations servent aux critères, pas à multiplier les forfaits.
  migration: 280 JH conservés, dix applications externes et huit instances à rapprocher. Deux répétitions complètes par unité supposées dans cette provision ; pas deux fois 280 JH.
  formation: Formation des relais et transfert applicatif ; temps métier et transformation organisationnelle exclus comme dans la référence.
substitution:
  activites_retirees: [INT-012, INT-013]
  accompagnement_retire: true
  preparation_retiree: true
  justification: Les paquets Groupe remplacent toute la formation, l'accompagnement, la bascule et leur coordination technique précédemment chiffrés. La consommation technique sur la durée remplace les 60 k€ de préparation ; elle ne s'y ajoute pas.
  activites_conservees: [INT-001, INT-002, INT-003, INT-004, INT-005, INT-006, INT-007, INT-008, INT-009, INT-010, INT-011]
deploiement:
  roles_pct: {developpement: 15, integration: 45, support_n3: 30, support_n1: 10}
  origine_roles: Mix INT-013 repris comme hypothèse pour le paquet local entier, non publié par Avanade.
  coordination_technique_pct: 10
  convention: Les JH de paquet sont traités ici comme réalisation hors coordination technique. Le 10 % explicite couvre les leads techniques ; il ne prétend pas décrire la composition du prix Avanade.
  contenu: Préparer les relais et aides communs une fois, les adapter localement, rejouer la recette d'acceptation, former, exécuter la bascule et stabiliser chaque unité pendant deux mois jusqu'à son acceptation.
  exclusions: Pas de seconde conception des règles, écrans, extensions, interfaces, mappings ou scripts ; pas de seconde répétition de migration déjà en INT-007 ; pas de seconde recette transverse INT-010. Pas de correction du produit générique.
  limite: Les abaques 200/400 JH portent sur des paquets Avanade plus larges. Leur utilisation pour cette capacité de déploiement Make est une hypothèse prudente de contenu, pas une transposition validée ni un plafond prouvé.
  cartographie: [D01.f, D01.g, D04.i, D04.k, D06.d, human-task-management, BHV082]
pilotage:
  jours_par_etp_mois: 18
  tarif_direction_eur_jh: 1000
  tarif_coordination_eur_jh: 850
  statut_tarifs: Provisions proposées, non cotations de marché ni tarifs eXalt. Pas d'outillage ou de marge ajoutés à ces prix.
  justification: Directeur responsable du budget, des risques, fournisseurs et arbitrages ; coordination fonctionnelle/PMO responsable des dépendances entre pôles, de la préparation des décisions et des acceptations. Leur charge suit la durée, pas un pourcentage du prix SAP.
  distinct_de: Les leads techniques restent dans 10 % des travaux et 8 % du service. Les rôles de programme ne réalisent ni le code, ni les recettes techniques, ni les décisions métier internes.
  preuve_limite: Le COPIL exige une équipe métier dédiée, sans dimensionner le pilotage Make. Les 2371 JH de gouvernance/coordination SAP sont un contrôle d'ordre de grandeur, pas la charge à copier.
core:
  activite: MAI-003
  debut_mois: 0
  hypothese_contractuelle: Après réception du build, capacité de correctifs génériques et production/qualification des releases achetée séparément sur toute l'intégration ; elle n'est pas réputée fournie gratuitement par la garantie.
  pas_de_double_compte: Les corrections de conformité qui restent dues par le fournisseur du build sont imputées à sa garantie, pas facturées à ce service. La capacité budgétée couvre les besoins hors garantie et les releases ; sa quantité complète est une provision, pas une charge constatée.
  evolutions: Aucune évolution fonctionnelle générique MAI-009 commandée dans le central. En option distincte seulement ; le périmètre du Core est supposé complet à la réception.
  services_client: MAI-006 finance qualification et déploiement client des mises à jour ultérieures, distincts de leur production dans MAI-003 et de la réception initiale déjà financée dans INT-010.
  taux_pilotage_ref: source/calibration-couts.yaml#pilotage/maintenance_pct
transition:
  nature_cout_ref: mco_run
  stabilisation_mois: 2
  infrastructure_annuelle_refs: [cloud_make_annuel, ipaas_make_microsoft_annuel, outillage_support_annuel]
  infrastructure_debut_mois: 0
  infrastructure_fin: Fin de la dernière stabilisation ; pleine provision technique dès le début, sans économie de montée en charge supposée.
  justification_infrastructure: Les enveloppes actives 72/36/24 k€ par an remplacent la préparation de 60 k€. Pas de quatrième environnement ni de seconde plateforme par pôle.
  services_partages: [MAI-005, MAI-006, MAI-007, MAI-008]
  debut_services_partages: Première ouverture en production ; une seule fois pour le Groupe, sans prorata d'utilisateurs.
  services_variables: [MAI-001, MAI-002, MAI-004]
  debut_services_variables: Fin des deux mois de stabilisation de chaque unité ; prorata des utilisateurs supposés pour support et des périmètres stabilisés pour corrections d'extensions.
  limite_variables: Les proportions égales et la linéarité des seuls services variables sont des hypothèses. Les prestations fixes ne sont pas divisées par quatre.
  pas_de_double_compte: Pendant les deux mois de stabilisation locale, assistance et corrections de démarrage sont dans les paquets. Après, elles passent aux services variables. Les services partagés portent la plateforme et les contrats déjà acceptés, pas les nouveaux flux encore livrés par l'intégration.
  evolutions_client: MAI-009 absent ; pas de changement fonctionnel commandé pendant la trajectoire. Les défauts et l'entretien contractuel restent financés.
  fin: Fin de l'intégration, borne exclue ; le Run & MCO à pleine capacité prend ensuite le relais sans seconde facturation de la période antérieure. La référence reste inchangée ; cette proposition ne projette pas un nouveau TCO.
scenarios:
  resserre:
    titre: Bonne adhérence et gouvernance légère
    duree_mois: 34
    interfaces: 30
    jh_par_interface: 10.5
    migration_jh_supplementaires: 0
    deploiement_jh_par_unite: [200, 200, 200, 200]
    ouvertures_mois: [18, 23, 28, 32]
    direction_etp: 0.5
    coordination_etp: 0.5
    corrections_core_par_an: 12
    releases_par_an: 4
    nature: Scénario complet conditionnel à forte mutualisation ; pas une borne basse garantie.
  central:
    titre: Deux unités complexes et deux unités standard
    duree_mois: 34
    interfaces: 40
    jh_par_interface: 10.5
    migration_jh_supplementaires: 0
    deploiement_jh_par_unite: [400, 400, 200, 200]
    ouvertures_mois: [18, 23, 28, 32]
    direction_etp: 0.5
    coordination_etp: 1
    corrections_core_par_an: 12
    releases_par_an: 4
    nature: Proposition centrale d'opportunité, non plan validé. Deux SI et plusieurs instances motivent de tester des contextes complexes, sans prouver cette répartition.
  renforce:
    titre: Quatre unités complexes et qualification renforcée
    duree_mois: 42
    interfaces: 50
    jh_par_interface: 11.5
    migration_jh_supplementaires: 140
    deploiement_jh_par_unite: [400, 400, 400, 400]
    ouvertures_mois: [22, 28, 34, 40]
    direction_etp: 1
    coordination_etp: 1
    corrections_core_par_an: 18
    releases_par_an: 6
    nature: Stress explicite de durée, inventaire et service, pas percentile ni plafond contractuel. Les 140 JH additionnels couvrent une répétition ou remédiation de données supplémentaire proposée.
justifications_centrales:
  interfaces: Les 40 interfaces du pilote Avanade servent de point de comparaison ; retenir 40 contrats pour FLOW remplace l'hypothèse 30, sans prétendre que les inventaires sont identiques ou exhaustifs. MAP/CBS à inventorier.
  calendrier: 18 mois pour préparer la première ouverture, puis trois unités chevauchées et deux mois de stabilisation chacune, dernière sortie au mois 34. Les derniers paquets démarrent avant la fin des précédents ; durées ne s'additionnent pas.
  programme: Un demi-ETP de direction et un ETP de coordination pendant 34 mois à 18 JH/ETP/mois. Capacité externe proposée ; disponibilité des responsables internes en plus, hors budget externe.
  core: 12 corrections et 4 releases par an repris des volumes de service actifs, sans gain IA. Application pendant l'intégration = nouvelle convention contractuelle proposée, pas obligation prouvée.
  achats: Prix constants pour toutes les rubriques, cohérents entre eux ; l'indexation du futur calendrier doit être appliquée à toute l'enveloppe si elle est retenue, pas uniquement au Core.
preuves:
  - fichier: sources/client/copil-5.pdf
    pages: [7, 8]
    apport: Pilote puis quatre lots, Sarenza hors volumétrie, équipe métier dédiée, pôle/pays à affiner. Ne prouve ni quatre unités Make ni le staffing proposé.
  - fichier: sources/client/microsoft-1.pdf
    pages: [39, 40]
    apport: 40 interfaces et plage 380–460 JH ; abaques 200/400 JH à même RACI, sous condition d'adhérence et de géographie. Les 100 JH de support seul ne sont pas utilisés comme borne basse du même service.
  - fichier: sources/client/rfi-presentation.pdf
    pages: [4, 7]
    apport: Deux SI, huit instances Storeland au total, MAP/CBS hors questionnaire d'interfaces.
  - fichier: source/plan-investissement.yaml
    apport: Calendrier Make 48 mois build puis 34 mois intégration ; enveloppe SAP et exclusions ; fourchette de prix de pilotage indicative déjà identifiée, non cotation actuelle.
  - fichier: source/recalibration-metier.yaml
    apport: Capacités, unités de correctifs, de releases et d'évolutions génériques des trois stacks.
  - fichier: source/maintenance.yaml
    apport: Volumes de service et contributions internes ; ne prouve pas leur intensité pendant déploiement.
exclusions_preservees:
  - Build du Flow Core System, déjà financé séparément.
  - Temps interne IT/métier, conduite du changement organisationnelle, coût d'opportunité.
  - Coûts des systèmes historiques conservés et décommissionnement global.
  - Nouvelles fonctions, nouvelle génération de produit, Sarenza ou autres périmètres non décidés.
  - Run après la dernière stabilisation, présenté séparément dans la référence.
  - Astreinte humaine permanente 24/7 non prévue dans le service courant.
