- capabilities:
  - BC-009
  - BC-010
  subject: Faits externes, corrections tardives, double date, filiation et Handling Units
  existing: Champs et lectures de stock observés ; équivalence du protocole non démontrée.
  new_work: Contrat des faits et effets, reconstruction corrigée, propagation des corrections, liens explicites
    sans inventer de généalogie.
- capabilities:
  - BC-011
  subject: Positions explicables et limites de connaissance
  existing: Quantités natives présentes et attendues.
  new_work: Origine, fraîcheur, incertitudes et prévention des doubles comptes entre commandes, plans et réalisations.
- capabilities:
  - BC-012
  subject: Fourniture à la planification
  existing: Réutiliser les requêtes de quantité sélectionnées ; les compter une seule fois.
  new_work: Contrat d’extraction par périmètre/date/version, statut de fraîcheur et corrections ; pas un moteur
    de planification.
- capabilities:
  - BC-016
  subject: Fourniture à Finance
  existing: Registres natifs source de faits ; écritures comptables exclues.
  new_work: Préparation du fait, justificatifs, correction liée, suivi acceptation/rejet et référence de prise en
    compte ; raccordements Beaumanoir exclus.
- capabilities:
  - BC-017
  subject: Constats produit
  existing: Le stock peut fournir des faits ; aucun processus produit équivalent établi dans ces sélections.
  new_work: Préparer les constats documentés et leurs corrections ; ni diagnostic de cause ni PLM.
- capabilities:
  - BC-018
  subject: Réservations sous concurrence
  existing: Mises à jour et verrouillages natifs repérés.
  new_work: Qualifier garanties de quantité, consommation/libération, échéance et conflits par rapport au contrat
    Flow ; ne pas compter les décisions d’affectation.
