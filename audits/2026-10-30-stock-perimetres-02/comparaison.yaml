id: stock-perimetres-02
status: quatre_selections_constituees_comparabilite_partielle
unit: Inventory State Management
stack_target: java-spring
rules_source: source/fondamentaux.yaml#estimation_model
common_contracts:
- id: C1
  result: Conserver des mouvements reconnus et leurs corrections, reliés à leur origine.
  capabilities:
  - BC-009
  - BC-010
  limit: Les écritures natives passent souvent par la réalisation des mouvements ; ces appels ne sont pas assimilés
    à une ingestion externe complète.
- id: C2
  result: Lire des quantités par produit, lieu, lot ou autre dimension native, avec contexte de date.
  capabilities:
  - BC-011
  limit: La double date fait/connaissance et les limites de connaissance Flow ne sont pas présumées équivalentes
    aux filtres natifs.
- id: C3
  result: Rapprocher quantités attendues et constatées, préparer les ajustements de stock.
  capabilities:
  - BC-013
  limit: 'Politique de comptage, tolérances, prix et exécution mélangés : fonctions mixtes conservées comme limites,
    pas comptées intégralement.'
- id: C4
  result: Tenir des quantités réservées, disponibles et consommées ou libérées.
  capabilities:
  - BC-018
  limit: Pas de preuve de protocole universel d’expiration ni d’équivalence des décisions de réservation ; allocation
    et commandes sont isolées.
- id: C5
  result: Composer les positions à partir de mouvements présents et attendus connus.
  capabilities:
  - BC-011
  - BC-012
  limit: Une somme native de mouvements planifiés n’est pas le contrat complet de fourniture versionnée à la planification.
