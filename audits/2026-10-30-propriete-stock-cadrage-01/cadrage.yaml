excludes:
- Valorisation comptable, écritures financières et facturation
- Négociation des accords et codage des clauses propres à Beaumanoir
- Mouvements physiques, réservations et réalisation des prestations
- Disposition BC-019, décisions de réparation/rebut et optimisation
- Construction des familles Orders et orchestration pas encore financées
shared_funding: Réutilisation Master Data et Stock avec propriétaires inchangés. Adaptations et invariants de propriété
  à dimensionner séparément.
size_policy: La méthode amont autorise des parts de composants et analogies explicites. Les tailles brutes du repérage
  ne deviennent pas des KSLOC Flow ni une facture de reconstruction.
new_Flow_modules_to_size:
- id: OWN-F01
  name: Conditions de propriété et contexte applicables
  work: Référencer conditions/version/portée reçues et rapprocher les faits de Stock et des accords. Pas nouvelle
    édition des accords ni règles Beaumanoir.
  candidate_analogue: Évaluation conditionnelle des dimensions ERPNext ; critères de consignation Tryton ; validation
    de paramètres Java.
  reuse: Accords, parties, articles, unités, versions et admission Master Data.
- id: OWN-F02
  name: Détermination du transfert et quantités
  work: 'Trois familles de déclencheurs : consommation/vente, échéance et jalon reçu ; produire parties, quantité
    et date ou justification manquante.'
  candidate_analogue: Chaînes de consignation Tryton et propagation Odoo, sans confondre facturation et fait de
    propriété.
  reuse: Faits et positions Stock ; règles métier spécifiques fournies par intégration.
- id: OWN-F03
  name: Actes requis et transferts reconnus ailleurs
  work: État local en attente, référence de demande externe, réception du résultat et admission d’un transfert déjà
    établi. Pas reconstruction du moteur de processus.
  candidate_analogue: Transitions et origines natives, protocoles de contribution Master Data/Stock.
  reuse: 'Identité des commandes, admission et journal génériques déjà financés. Familles Orders/processus pas encore
    estimées : dépendance distincte.'
- id: OWN-F04
  name: Registre autonome de propriété
  work: Écritures ancien/nouveau propriétaire, quantité, fondement, preuves et liens ; plusieurs passages pour les
    mêmes biens sans doubler la position physique.
  candidate_analogue: Registres/mouvements des quatre OSS déjà étudiés ; la nouvelle écriture de propriété reste
    à dimensionner.
  reuse: Persistance, transactions et registres Stock ; nouveaux invariants métier non assimilés à une simple colonne.
- id: OWN-F05
  name: Corrections et lectures aux deux dates
  work: Annulations/corrections expliquées ; lecture à date d’effet et selon la connaissance disponible.
  candidate_analogue: Correction de propriétaire Odoo et chaînes de correction Stock ; dates physiques natives ne
    suffisent pas seules.
  reuse: Journal/version/reprise Master Data et correction Stock, sans financer à nouveau leurs moteurs.
- id: OWN-F06
  name: Rapprochement et fourniture des positions de propriété
  work: Rapprocher le registre de propriété et les positions existantes ; rendre les résultats et limites disponibles
    aux capacités Stock et Finance.
  candidate_analogue: Restitutions filtrées Odoo, quantités et historiques Java/Tryton/ERPNext.
  reuse: Inventory Visibility et Accounting Data Provision déjà financés en Stock. Pas seconde publication Finance
    ni valorisation comptable.
