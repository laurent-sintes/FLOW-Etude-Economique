    de mise en service) ; composition des cohortes, experts et mise en œuvre non parfaitement appariés. Le benchmark
    ne calibre pas le patrimoine Master Data/Stock réutilisé.
  component_boundary: Comptage local du composant ; les frontières diffèrent d’un comptage de tout le Core. Ne pas
    additionner les CFP de cette mesure aux anciennes mesures sans rapprochement des interfaces.
  native_technology_note: Le repère 20 h/CFP est historique Java ; il ne calibre pas les technologies Python, ni
    la réutilisation des familles disponibles.
  algorithm_note: La compacité des chaînes Java et le proxy de code non calibré entre langages expliquent une partie
    du désaccord ; ce n’est pas une preuve de productivité Spring.
  guarantees: Une base transactionnelle, registre de propriété local, contrôle de cohérence des quantités et branchements
    aux protocoles existants. Pas de réservation distribuée ni d’engagement chiffré nouveau de débit, latence, RPO/RTO.
  no_forced_convergence: true
  no_probabilistic_confidence: true
