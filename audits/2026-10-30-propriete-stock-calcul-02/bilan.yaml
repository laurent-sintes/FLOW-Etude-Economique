meaning: Charges supplémentaires de construction du périmètre cible Flow dans chaque écosystème natif, en supposant
  le patrimoine Master Data et Stock disponible. Pas coûts historiques observés, pas quatre budgets à additionner.
size_basis:
  modules:
  - id: OWN-F01
    name: Conditions de propriété et contexte applicables
    analogue: reservation_chain
    lower: 0.35
    central: 0.75
    upper: 1.25
    basis: Un module compagnon de contrôle des références, contexte, conditions applicables et justification manquante,
      estimé à trois quarts d’une chaîne native de décision sur une quantité. Les accords et leur version sont référencés
      ; aucune édition d’accord ni langage contractuel général.
  - id: OWN-F02
    name: Détermination des transferts et quantités
    analogue: reservation_chain
    lower: 0.75
    central: 1.5
    upper: 2.5
    basis: Un module traitant consommation/vente, échéance ou jalon reçu, avec quantités partielles et plusieurs
      passages entre parties. Taille proposée à une chaîne et demie de réservation ; les trois déclencheurs sont
      des variantes, pas trois copies du module.
  - id: OWN-F03
    name: Actes requis et transferts reconnus ailleurs
    analogue: reservation_chain
    lower: 0.35
    central: 0.75
    upper: 1.25
    basis: Branchement métier sur les protocoles existants, état en attente, références d’actes, admission du résultat
      et absence de double décision. Trois quarts d’une chaîne de réservation ; aucun moteur Orders ou orchestration
      construit ici.
  - id: OWN-F04
    name: Registre autonome de propriété
    analogue: correction_chain
    lower: 0.5
    central: 1
    upper: 1.75
    basis: Un nouveau module d’écriture et de justification des passages de propriété, équivalent en taille de comportement
      à une chaîne native de correction. Les tables et contrats sont propres à la propriété ; persistance et transactions
      sont réutilisées.
  - id: OWN-F05
    name: Corrections et lectures aux deux dates
    analogue: correction_chain
    lower: 0.35
    central: 0.75
    upper: 1.5
    basis: Un module additionnel de corrections expliquées et de lecture selon date d’effet et date de connaissance.
      Trois quarts de chaîne de correction ; l’écriture courante de OWN-F04 et les primitives de journal existantes
      ne sont pas réimplémentées.
  - id: OWN-F06
    name: Rapprochement et fourniture des positions
    analogue: correction_chain
    lower: 0.2
    central: 0.5
    upper: 0.9
    basis: Comparer les états du registre de propriété aux faits et positions existants, puis fournir résultat et
      limites. Une demi-chaîne de correction ; pas de nouveau moteur de stock, de publication Finance ou de sauvegarde.
