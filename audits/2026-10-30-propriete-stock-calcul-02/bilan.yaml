  pas productivités observées. Paramètres gelés avant premier calcul des efforts, sans objectif d’accord des quatre
  chiffres ou de COSMIC.
- Dix structures et champs spécifiques proposés, pas spécification validée. Les identifiants, rôles/organisation,
  horodatage ORM, versions techniques et journaux génériques ne sont pas recomptés. Les structures de décision et
  leurs lignes ne définissent pas à elles seules les groupes COSMIC.
- Une base transactionnelle, registre de propriété local, contrôle de cohérence des quantités et branchements aux
  protocoles existants. Pas de réservation distribuée ni d’engagement chiffré nouveau de débit, latence, RPO/RTO.
- La base technique et métier Stock/Master Data est déjà financée. Toute la nouvelle taille est répartie dans les
  six compléments de propriété ; aucune base autonome de reconstruction des produits natifs n’est ajoutée.
