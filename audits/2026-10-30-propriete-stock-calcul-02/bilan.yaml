    boundary: Composant fonctionnel Propriété du stock, de l’entrée métier aux écritures/consultations propres à
      la propriété. Les autres composants et opérateurs peuvent le déclencher. Données Master Data/Stock considérées
      comme persistances logiques déjà disponibles.
    scope_caveat: Comptage local du composant ; les frontières diffèrent d’un comptage de tout le Core. Ne pas additionner
      les CFP de cette mesure aux anciennes mesures sans rapprochement des interfaces.
    functional_reuse: Ne pas compter les imports génériques, transports, retries techniques ou publications Finance
      déjà financés ; les opérations propres à la propriété gardent leurs mouvements fonctionnels même si le code
      générique est réutilisé.
    productivity_hours_per_CFP: 20
    factor: 1
    day_hours: 7
    factor_note: Convention de comparaison par famille composante d’un projet plus vaste, dans la continuité de
      la décision Master Data. Le tableau ISBSG de correction par taille donnerait 1,1 pour un projet autonome de
      50–100 CFP ; ce facteur n’est pas appliqué automatiquement au composant.
    activity_note: Même intention de couvrir le projet logiciel (analyse, conception, réalisation, tests et préparation
      de mise en service) ; composition des cohortes, experts et mise en œuvre non parfaitement appariés. Le benchmark
      ne calibre pas le patrimoine Master Data/Stock réutilisé.
  original_CFP_before_group_review: 76
  group_refinement:
    id: propriete-stock-cosmic-review-02
    status: correction_de_groupement_apres_revue
    base: cosmic.json
    base_sha256: bff464d2c79ce5e3dbc5e24e48e3bd42a0c5f51dd54c490a1ff56f63ba0a8423
    reason: Un passage proposé possède ses propres parties, quantité, date et acte requis, notamment dans une chaîne
      entre sociétés. Il constitue un objet d’intérêt distinct de la détermination d’ensemble ; le regroupement
      initial sous-comptait ses mouvements.
    basis: COSMIC v5, un groupe par objet d’intérêt ; exemple order/order-line, partie 3c, page PDF 103 (index 102).
      La distinction ne provient pas du seul nombre de tables.
    source: https://cosmic-sizing.org/wp-content/uploads/2022/11/Combination-of-Parts-v5.0-Sep-2024.pdf#page=103
    group:
      id: LEG
      object: Passage de propriété proposé
      attributes: Détermination parente, rang/liaison de la chaîne, ancien et nouveau propriétaires, biens, quantité,
        unité, date d’effet et lien à l’acte requis.
    add_movements:
    - process: P02
      type: W
      group: LEG
    - process: P02
      type: X
      group: LEG
    - process: P03
      type: R
      group: LEG
    - process: P07
      type: R
      group: LEG
    updated_group:
      id: DETERMINATION
      object: Détermination d’ensemble d’une conséquence de propriété
      attributes: Déclencheur, contexte, conditions appliquées, résultat et références des passages proposés ; les
        attributs propres à chaque passage sont dans LEG.
    note: Quatre mouvements ajoutés une seule fois par type et processus, pas une multiplication par nombre de passages
      ou de sociétés. Les tables et JH COCOMO étaient déjà dimensionnés ; leur coût ne change pas.
    unchanged_effort_inputs: true
  benchmark_cohort: Java multi-plateforme/PC historique ; pas calibration des écosystèmes Python natifs
