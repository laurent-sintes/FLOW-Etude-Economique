allocation_note: Répartition descriptive des JH de la famille proportionnelle à sa taille estimée, pas six estimations
  COCOMO indépendantes.
reuse:
  policy: Master Data et Stock sont supposés disponibles dans chaque écosystème natif. Aucune reconstruction historique
    du framework ni nouvelle construction du registre physique de stock. Les analogues donnent une échelle au code
    propre à la propriété ; ils ne constituent pas des instructions de Stock facturées une seconde fois.
  funding_context:
    additional_framework_construction_jh: 0
    additional_physical_stock_construction_jh: 0
    no_free_work_claim: Déjà financé dans le contexte comparé. Les adaptations nouvelles sont intégralement portées
      par OWN-F01 à OWN-F06.
    native_context: Patrimoine Master Data et Stock disponible dans chaque technologie native ; contexte de comparaison,
      pas quatre budgets actifs.
  undelivered_dependency: Orders et orchestration restent à estimer ; seuls les contrats, références d’actes et
    états locaux de propriété sont chiffrés. Ne pas supposer ces familles déjà financées.
