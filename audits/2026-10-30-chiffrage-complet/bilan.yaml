  audit:
  - id: A01
    status: fermé sous hypothèses de l’étude
    result: Référentiel inchangé ; 72 capacités restantes et 215 résultats fonctionnels affectés aux six unités
      ; les 16 capacités retenues sont distinctes.
  - id: A02
    status: fermé
    result: 70 mécanismes/modules ont un propriétaire, dont onze communs. Les 280 JH communs sont intégrés ; capacité
      et prestation ont des objets nommés distincts.
  - id: A03
    status: fermé
    result: 148 fichiers vérifiés aux révisions figées avec le même compteur ; 104 calculs reproduits indépendamment.
  - id: A04
    status: chiffré pour opportunité, réalisation non démontrée
    result: Mécanismes sans équivalent exact dimensionnés par modules d’analogie nommés ; fractions et quantités
      supposées. Aucune durée proposée par l’IA ne sert d’entrée aux JH.
  - id: A05
    status: contrôle proposé, pas calibration
    result: Six frontières COSMIC recomptées, deux doubles événements fusionnés. Rendement de 20 h/CFP non calibré
      au réemploi ; pas de moyenne forcée ni somme des CFP du Core.
  - id: A06
    status: chiffrage disponible, organisation à construire
    result: Rôles et délais locaux calculés. Spécialités optimisation et moteur incluses dans Java/architecture/QA
      ; aucun engagement d’équipe ni calendrier global validé.
  - id: A07
    status: financement clarifié dans la proposition
    result: OR-Tools et Timefold consommés avec un seul contrat de calcul. Le catalogue actif et les écrans restent
      hors de cette proposition.
  residual_assumptions:
  - Fractions et nombre des modules Flow nouveaux ; modèles et vues supposés, pas spécification détaillée.
  - Six unités de financement cohérentes ; un autre regroupement change le calcul non linéaire.
  - Réutilisation effective du patrimoine adopté et des moteurs, avec adaptation métier ; pas reconstruction de
    leurs noyaux.
  - Objectifs et contraintes comparables aux modèles énumérés ; ni moteur réglementaire douanier, ni comptabilité,
    ni WMS d’exécutant, ni connecteurs Beaumanoir cachés dans le Core.
  - Volumes, SLA et ergonomie à préciser en conception. Les budgets prévoient architecture, QA, plateforme et frontend,
    sans démontrer leurs performances.
  - Paramètres COCOMO nominaux et rendement COSMIC × ISBSG non calibrés sur des bilans de projet ; stabilité de
    calcul ne vaut pas précision prédictive.
