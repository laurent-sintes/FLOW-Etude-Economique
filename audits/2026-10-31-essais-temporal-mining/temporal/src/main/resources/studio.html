<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Essai FLOW — Studio de processus</title><style>body{font:16px system-ui;margin:35px;color:#182632;background:#f5f7f6}main{max-width:1000px;margin:auto;background:white;padding:30px;border-radius:14px}h1,h2{color:#236159}label{display:block;margin:12px 0}input,select,button{font:inherit;padding:9px;margin:4px}button{background:#236159;color:white;border:0;border-radius:5px}pre{white-space:pre-wrap;background:#edf5f2;padding:15px}small{color:#53606b}.nodes{display:flex;flex-wrap:wrap;gap:8px}.node{border:1px solid #bdd4ce;padding:10px;border-radius:8px}section{border-top:1px solid #ccd8d3;margin-top:25px;padding-top:15px}</style><main><small>Prototype d’essai · données fictives · identité simulée · catalogue borné</small><h1>Composer puis exécuter un parcours</h1><label>Persona <select id="persona"><option>designer-A</option><option>gestionnaire-A</option><option>lecteur-A</option><option>designer-B</option><option>gestionnaire-B</option></select></label><section><h2>Définition métier</h2><label>Nom <input id="name" value="Réception et allocation"></label><label>Notification <select id="notification"><option value="standard">Standard</option><option value="express">Express</option></select></label><label><input id="control" type="checkbox"> Ajouter un contrôle de capacité avant la préparation</label><button id="publish">Publier une nouvelle version</button><button id="models">Voir les versions</button><div id="versions" class="nodes"></div></section><section><h2>Exécution</h2><label>Dossier <input id="caseId" value="atelier-01"></label><label>Version à exécuter <input id="version" type="number" value="1" min="1"></label><button id="start">Démarrer</button><button id="refresh">Actualiser l’état</button><button id="approve">Approuver la tâche humaine</button><pre id="result" role="status">Prêt pour l’essai.</pre></section></main><script>let latest=0;const $=id=>document.getElementById(id);async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Trial-User':$('persona').value},body:body?JSON.stringify(body):undefined});let d=await r.json();$('result').textContent=JSON.stringify({http:r.status,...d},null,2);return d;}async function models(){const rows=await api('/models');latest=Math.max(0,...rows.map(x=>x.version));$('versions').replaceChildren(...rows.map(d=>{let e=document.createElement('div');e.className='node';e.textContent='Version '+d.version+' · '+d.name+' · '+d.steps.filter(s=>s.service).map(s=>s.service).join(' → ');return e;}));return rows;}$('models').onclick=models;$('publish').onclick=async()=>{await api('/models',{name:$('name').value,expectedVersion:latest,express:$('notification').value==='express',control:$('control').checked});await models();$('version').value=latest;};$('start').onclick=()=>api('/cases',{caseId:$('caseId').value,version:Number($('version').value)});$('refresh').onclick=()=>api('/cases?caseId='+encodeURIComponent($('caseId').value));$('approve').onclick=()=>api('/outcomes',{caseId:$('caseId').value,eventId:crypto.randomUUID(),approved:true});$('persona').onchange=models;models();</script></html>
