statut: proposition_non_appliquee
date: '2026-10-27'
objet: Calendrier Make autonome à périmètre, charges et tarifs conservés
reference_des_resultats: 2026-10-27-calendrier-make-autonome.json
reproduction: 2026-10-27-calendrier-make-autonome.py
recommandation:
  integration_mois: 30
  origine: Réception du Flow Core System ; les 48 mois de build restent inchangés.
  ouvertures_mois: [16, 20, 24, 28]
  acceptations_mois: [18, 22, 26, 30]
  stabilisation_locale_mois: 2
  nature: Hypothèse d'opportunité construite par séquencement et capacité ; ni délai fournisseur ni durée prouvée par les seuls JH.
  dependance_buy: Aucune ; les durées, prix et séquences Microsoft et SAP restent inchangés.
travaux_communs:
  base: JH Java centraux conservés ; .NET totalise 1930 JH et Rust 2045 JH, contre 1925 JH Java.
  convention_fenetres: Mois continus depuis le début de l'intégration, début inclus et fin exclue ; chevauchements voulus.
  lots:
  - titre: Décisions et paramètres métier
    activites: [INT-001, INT-002, INT-003]
    jh_java: 295
    fenetre_mois: [0, 4]
    rattachement: source/parcours-integration.yaml#lots/parametres
    sortie: Règles, structures et critères d'acceptation validés ; cas partiels B2B et promesse/allocation.
  - titre: Parcours et adaptations client
    activites: [INT-004, INT-005]
    jh_java: 310
    fenetre_mois: [3, 10]
    rattachement: source/parcours-integration.yaml#lots/parcours
    sortie: Parcours et extensions testables sur les règles déjà décidées, sans reconstruire le Core.
  - titre: Interfaces et contrats de flux
    activites: [INT-006]
    jh_java: 420
    fenetre_mois: [3, 12]
    rattachement: source/parcours-integration.yaml#lots/flux
    sortie: Quarante contrats raccordés, vérifiés et exploitables ; mutualisation entre unités.
  - titre: Migration et répétitions
    activites: [INT-007]
    jh_java: 280
    fenetre_mois: [4, 14]
    rattachement: source/parcours-integration.yaml#lots/deploiement
    sortie: Données, rapprochements et mécanismes de reprise qualifiés. Provision existante, sans nouvel ajout pour les répétitions locales.
  - titre: Environnements et industrialisation
    activites: [INT-008, INT-009]
    jh_java: 270
    fenetre_mois: [0, 8]
    rattachement: source/parcours-integration.yaml#lots/deploiement
    sortie: Environnements, sécurité et chaîne de livraison disponibles progressivement pour les autres lots.
  - titre: Recette transverse et préparation du service
    activites: [INT-010, INT-011]
    jh_java: 350
    fenetre_mois: [10, 16]
    rattachement: source/parcours-integration.yaml#lots/recette
    sortie: Situations métier qualifiées de bout en bout, performance et exploitabilité acceptées ; premières recettes partielles avant complétude des flux.
deploiements:
  principe: Unités candidates, sans affecter prématurément un pôle nommé à un ordre de bascule ; huit instances à regrouper.
  vagues:
  - unite: complexe_1
    jh: 400
    preparation_et_stabilisation: [10, 18]
    ouverture: 16
    reception: 18
  - unite: complexe_2
    jh: 400
    preparation_et_stabilisation: [14, 22]
    ouverture: 20
    reception: 22
  - unite: standard_1
    jh: 200
    preparation_et_stabilisation: [20, 26]
    ouverture: 24
    reception: 26
  - unite: standard_2
    jh: 200
    preparation_et_stabilisation: [24, 30]
    ouverture: 28
    reception: 30
  non_double_compte: Les 1200 JH remplacent INT-012/013 ; pas de seconde conception, interface, migration transverse ni recette commune.
  metier: source/deploiement-groupe.yaml#deploiement/cartographie
capacite:
  jours_productifs_etp_mois: 18
  origine_productivite: Convention active du pilotage étendue ici aux capacités de réalisation ; hypothèse explicite, sans prix nouveau.
  commun_moyen_sur_16_mois: Environ 6,7 ETP Java/.NET et 7,1 ETP Rust ; ce sont des moyennes de charge, pas des équipes constantes.
  pic_java: Environ 11 ETP de réalisation sur les fenêtres proposées, hors pilotage et service Core ; à confirmer par profil et disponibilité.
  deploiement_complexe: Environ 2,8 ETP sur huit mois par unité complexe, avec deux vagues chevauchées ; les standard mobilisent environ 1,9 ETP sur six mois.
  pilotage: Maintenir 0,5 ETP de direction et 1 ETP de coordination pendant 30 mois, aux tarifs actuels. Coordination technique déjà financée séparément.
  limite: Ne pas transformer les moyennes en effectifs permanents facturés ; prix des travaux et budgets de coordination inchangés.
conditions:
- Core générique réceptionné et exploitable ; aucun rattrapage fonctionnel majeur imputé à l'intégration.
- Référents métier disponibles pour arbitrer et valider ; disponibilité interne hors dépenses chiffrées.
- Inventaire des 40 interfaces confirmé, notamment MAP/CBS ; accès aux SI et environnements tiers disponibles.
- Qualité des données et répétitions compatibles avec la provision de 280 JH ; les reprises tardives majeures invalident le planning.
- Disponibilité des profils techniques pendant les chevauchements ; les JH seuls ne démontrent pas le délai.
- Fenêtres commerciales et saisons retail compatibles avec les ouvertures ; aucun calendrier réel n'est encore confirmé.
- Recette commune prête à M16 et acceptations locales explicites ; pas de généralisation automatique d'un pilote non stabilisé.
sensibilites:
  acceleree: 26 mois, ouvertures 14/18/21/24 ; demande davantage de simultanéité. Non retenue comme promesse centrale.
  prudente: 36 mois, ouvertures 20/25/30/34 ; mêmes travaux, fenêtres plus longues. Ce n'est ni un plafond ni une probabilité.
  distinction: Sensibilités de calendrier uniquement ; différentes des scénarios resserré/renforcé du modèle qui changent aussi les volumes et le staffing.
calcul:
  methode: Copie en mémoire de la release ; durée Make et jalons explicites, stabilisation fixe de deux mois. Réutilisation du journal et du projecteur existants.
  prix: Charges, tarifs, build, contrats Buy et indices conservés. Le programme et les consommations transitoires changent avec les périodes ; régime complet avancé ou retardé.
  cash: La répartition uniforme des travaux dans leur phase reste celle du moteur. Les fenêtres de lots ci-dessus justifient la faisabilité proposée ; elles ne constituent pas un nouvel échéancier contractuel de facturation.
  interpretation: Une baisse jusqu'à réception peut coexister avec une hausse à dix ans, du fait du service complet supplémentaire. Bénéfices métier et économies des SI historiques non valorisés.
preuves:
- source: source/parcours-integration.yaml
  apport: Activités rattachées aux parcours et capacités métier ; pas de multiplication du coût par situation.
- source: source/deploiement-groupe.yaml
  apport: Quatre unités candidates, paquets 400/400/200/200 JH, 40 interfaces, stabilisation et staffing de programme.
- source: source/chiffrage/chiffrage-java-spring.yaml
  apport: Charges des travaux communs ; INT-006 remplacé par 40 x 10,5 JH et INT-012/013 par les paquets Groupe.
- source: sources/client/microsoft-1.pdf
  pages: [39, 40]
  apport: Provenance documentée des repères interfaces et paquets dans le registre Groupe ; ne prouve pas le calendrier Make proposé.
- source: sources/client/copil-5.pdf
  pages: [7, 8]
  apport: Déploiements et mobilisation métier ; la moyenne des durées Buy n'est pas utilisée pour construire cette proposition.
