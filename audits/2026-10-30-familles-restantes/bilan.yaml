findings:
- id: A01
  priority: haute
  subject: Périmètres comparables et délégations
  observation: La troisième itération élargit les mesures, mais ne ferme que des appels Java directs ; héritage
    et modules dynamiques Python/Odoo/Tryton restent partiellement isolés.
  consequence: Les quatre chiffres sont des diagnostics conditionnels ; pas quatre coûts natifs établis sur un périmètre
    identique.
  missing_iteration: 'I4 par famille : remplacer les paquets trop larges ou trop courts par une chaîne métier cohérente
    et enregistrer les inclusions/exclusions. Ne pas viser un nombre de lignes cible.'
- id: A02
  priority: haute
  subject: Financement unique entre familles
  observation: 39 fichiers natifs servent de référence à plusieurs familles. Cela ne prouve pas à lui seul un double
    compte, car un analogue peut dimensionner du code nouveau distinct.
  consequence: La campagne ne porte pas encore le registre fermé des nouveaux mécanismes partagés. Une somme globale
    des diagnostics ne serait pas défendable.
  missing_iteration: 'I4 transversale : attribuer un propriétaire aux cycles Order, contrats de prestation, décisions
    et moteur de Case ; distinguer consommation et adaptation spécifique.'
- id: A03
  priority: haute
  subject: Cohérence de la mesure de taille
  observation: Les diagnostics utilisent une union de méthodes et des modèles proposés. Les décisions adoptées combinent
    des mesures de composants, des structures et des ajustements de réutilisation différents.
  consequence: La correspondance avec les unités équivalentes du modèle adopté doit être réconciliée avant de retenir
    les nouveaux JH. Une formule exacte ne valide pas la taille d’entrée.
  missing_iteration: 'I4 transversale : réconcilier corps de méthodes, déclarations, modèles/vues et services réutilisés
    ; vérifier explicitement la continuité avec les trois décisions adoptées.'
- id: A04
  priority: haute
  subject: Compléments Flow non appariés
  observation: Optimisation, ATP/CTP/PTP, planification de services, coordination, douane, orchestration, supervision
    temporelle et mining restent insuffisamment appariés.
  consequence: Huit familles gardent proposed_java_jh = null ; les diagnostics calculés ne sont pas des propositions
    à retenir.
  missing_iteration: 'I4 ciblées : modèle de contraintes local réutilisant OR-Tools/Timefold ; CTP/PTP combinés
    ; capacités/offres de service ; booking/douane comme ordres confiés ; composition Flowable et journal de Case
    ; séquences corrigées pour mining.'
- id: A05
  priority: moyenne
  subject: Comptage COSMIC
  observation: Les mouvements sont explicités et recomptés. Les couvertures de variantes et sous-contrats sont proposées,
    sans validation de leur exhaustivité ; les frontières de composants rendent le cumul des CFP invalide sans retrait
    des interfaces.
  consequence: Le rendement historique de 20 h/CFP reste un contrôle non calibré. Son écart ne peut pas trancher
    seul entre les diagnostics de code.
  missing_iteration: 'I4 fonctionnelle : revoir les variantes de consignation/retour, les douze contrats de prestation
    et les corrections ; contrôler les doubles groupes et les interfaces entre composants.'
- id: A06
  priority: moyenne
  subject: Rôles et délais
  observation: 'Rôles et délais sont calculés depuis les diagnostics ; les clés Stock sont reprises pour toutes
    les familles, y compris algorithmes, tâches humaines et processus. Certains diagnostics de 10 JH produisent
    trois mois locaux : cette extrapolation ne décrit pas le calendrier d’un composant mutualisé dans le programme.'
  consequence: Ces répartitions ne constituent pas encore une organisation consolidée ; certains besoins spécialisés
    sont insuffisamment distingués.
  missing_iteration: 'Après stabilisation des tailles : regrouper les petites unités au bon niveau, répartir expertise
    optimisation/processus, Java, interface, QA et sécurité, puis vérifier le calendrier d’une équipe mutualisée.
    Garder les distributions publiées et les diagnostics locaux distincts.'
- id: A07
  priority: moyenne
  subject: Catalogue Java et bibliothèques de contraintes
  observation: Flowable et Timefold sont déclarés dans la stack Java ; OR-Tools est présent dans les preuves et
    essais historiques mais absent de ce catalogue.
  consequence: Le périmètre des dépendances Java n’est pas complètement aligné avec les références d’optimisation.
  missing_iteration: Aligner le catalogue Java avec OR-Tools et son packaging natif, puis mesurer le seul adaptateur
    et les contraintes métier ; ne pas financer une reconstruction du solveur.
