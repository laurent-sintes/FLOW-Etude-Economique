assumptions:
- id: framework
  hypothesis: Services équivalents à ceux employés dans les analogies Java disponibles dans Spring et dans le patrimoine
    Master Data/Stock ; réutilisation de persistance, transactions, sécurité, admission, reprise et livraison.
  trigger: Nécessité démontrée de reconstruire un mécanisme générique non couvert par les familles retenues.
  impact: Charge supplémentaire à dimensionner, inconnue aujourd'hui ; ni zéro implicite ni réduction Spring additionnelle.
- id: ledger
  hypothesis: Un registre propre à la propriété est construit, avec parties, quantité, preuve, date d'effet, date
    de connaissance et référence des corrections. Aucun historique Stock natif supposé équivalent.
  trigger: Volumes de nouveau code de OWN-F04/F05 supérieurs aux fractions centrales de 1 et 0,75 chaîne de correction.
  sensitivity_ref: registre-et-deux-dates
  impact: Sensibilité chiffrée depuis l'itération 02, pas intervalle de probabilité.
- id: rules
  hypothesis: Déclencheurs génériques consommation/vente, échéance et jalon reçu, avec conditions d'accord référencées
    et actes éventuels ; pas de langage général de contrats ni de règles juridiques Beaumanoir.
  trigger: Construction d'un moteur de clauses ou de décisions spécifiques du Groupe.
  impact: Périmètre supplémentaire à isoler et à financer ; impact non mesuré.
- id: temporal
  hypothesis: Lecture du registre de cette famille aux deux dates, correction expliquée et positions de propriété
    ; pas de moteur temporel universel pour tout Flow, ni garantie nouvelle de temps de réponse sur volumétrie non
    bornée.
  trigger: Généralisation à d'autres familles ou nouvelles exigences de performance/historique.
  impact: Dimensionnement à reprendre si ces garanties entrent dans le périmètre.
- id: team
  hypothesis: Équipe ayant les compétences et l'expérience nominales retenues par COCOMO, avec rôles mutualisés
    et services dépendants disponibles.
  trigger: Capacité ou expérience inférieures, indisponibilités, dépendances non livrées.
  sensitivity_ref: capacite-equipe
  impact: L'effort et le calendrier peuvent changer ; disponibilité des personnes non confirmée.
