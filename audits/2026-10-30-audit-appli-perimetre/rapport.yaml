avis:
  synthese: L’application fonctionne dans le parcours contrôlé. Le retrait des notes de complexité reste inachevé
    dans la présentation, les contrats et les consignes.
  calculs: Les notes sur cinq constituent une grille ordinale distincte des anciens points CSF. Aucun facteur note-vers-JH
    n’a été trouvé dans les calculs actifs inspectés. Modifier les 264 notes en mémoire laisse la calibration des
    travaux identique.
  cause: Le périmètre utile et ses frontières restent liés à un ancien contrat qui impose aussi des notes. La méthode
    COCOMO II / COSMIC × ISBSG cohabite avec cette présentation intermédiaire.
  priorite: Retirer les scores du parcours public et découpler leur contrat, en conservant capacités, fonctions, frontières
    et preuves.
constats:
- id: AUD-01
  priorite: P1
  titre: Les notes de complexité restent centrales dans le parcours public.
  fait: 'Périmètre métier affiche 88 capacités et 264 notes sur cinq : mécanismes et règles, validation et ajustements,
    richesse métier et interfaces. Un chapitre entier explique leur échelle. Ces appréciations sont proposées, pas
    validées par le métier.'
  impact: Le lecteur peut croire que ces notes sont une entrée nécessaire de l’estimation actuelle. L’avertissement
    sur l’absence de conversion en JH ne répond pas à l’intention de les retirer.
  etendue:
  - 'Périmètre métier : introduction, échelle et notes par capacité.'
  - 'Vue d’ensemble : deux passages conservent les niveaux et justifications de complexité.'
  - 'Préparer la réalisation : quatre mentions de la grille comme appui documentaire.'
  - 'Étude de marché : lien « Revoir les capacités et leur complexité ».'
  preuves:
  - app/src/DeliveryReadinessPage.tsx:53
  - app/src/DeliveryReadinessPage.tsx:69
  - config/application.yaml:1211
  - config/application.yaml:1430
  - source/vision-framework.yaml:26
  - source/vision-framework.yaml:71
  - source/capacite-realisation.yaml:50
  - source/capacite-realisation.yaml:76
  - browser.json
  - scope-capability.png
  recommandation: Retirer notes, échelle et formulations qui les présentent comme un repère courant. Garder les difficultés
    utiles sous forme de faits, frontières et points à vérifier avec leur statut. Conserver les preuves historiques.
- id: AUD-02
  priorite: P2
  titre: Le contenu fonctionnel du périmètre est omis au profit des notes.
  fait: La grille décrit 258 fonctions proposées avec identifiants et résultats attendus. La projection de la page
    conserve noms, chemins, frontières et notes, mais omet ces fonctions et le statut de revue de chaque capacité.
  exemple: BC-001 décrit notamment « Tenir les autorisations et suspensions motivées » et « Contrôler une nouvelle
    sollicitation et expliquer le refus ». Ces fonctions ne sont pas affichées sur la fiche du périmètre.
  impact: Le lecteur voit une frontière souvent négative et des appréciations de difficulté, sans voir clairement
    ce que le produit doit réaliser.
  preuves:
  - source/grille-complexite.yaml:32
  - tools/delivery_readiness.py:222
  - app/src/DeliveryReadinessPage.tsx:64
  - complexity-probe.json
  recommandation: Présenter nom, identifiant natif, alias de financement utile, résultat métier, fonctions proposées,
    frontières et statut de validation. Garder les liens à la capture et à Atlas. Inclure les fonctions dans la recherche.
- id: AUD-03
  priorite: P2
  titre: Le schéma, les projections et les tests imposent la conservation des scores.
  fait: La propriété complexite est obligatoire sur chaque bloc. La supprimer d’une copie provoque 88 erreurs de validation.
    Les compilateurs transportent les notes et les échelles ; des tests en imposent la restitution. La calibration
    requiert aussi une dépendance à la méthode de complexité.
  impact: Un masquage visuel seul laisserait les notes comme condition de chargement et permettrait leur réapparition
    lors d’une évolution.
  preuves:
  - source/schema-grille-complexite.yaml:79
  - tools/validate_complexity_grid.py:39
  - tools/delivery_readiness.py:216
  - tools/business_calibration.py:55
  - tools/study_app.py:565
  - tools/test_delivery_readiness.py:85
  - complexity-probe.json
  recommandation: Découpler le contrat actif du périmètre et le diagnostic historique. Adapter chargement, projections
    et tests sans casser identifiants, fonctions et financements. Vérifier la parité économique et les simulations.
    Ne pas modifier les travaux de chiffrage en cours.
- id: AUD-04
  priorite: P3
  titre: Des consignes et descriptions de données conservent une lecture ancienne.
  fait: AGENTS.md demande encore l’affichage des niveaux ordinaux sur la page Complexité. Le guide des sources attribue
    les chiffres actifs à la calibration historique, alors que le statut canonique annonce le retrait des anciennes
    charges et une construction à réestimer.
  impact: La documentation peut réintroduire l’ancienne présentation et attribue au Build courant une provenance inexacte.
  preuves:
  - AGENTS.md:69
  - source/README.md:9
  - source/README.md:19
  - source/README.md:21
  - source/statut-evaluation.yaml:6
  - audits/2026-10-29-application-audit-global.yaml:22
  recommandation: Aligner consignes et documentation sur le périmètre sans notes et le statut canonique. Garder les
    audits datés dans leur contexte historique, sans réécrire leurs constats passés.
etats_attendus_non_classes_comme_anomalies:
- Les charges Build Java, .NET et Rust sont en attente d’adoption. Les pages économiques affichent un avertissement
  explicite. Les zéros techniques ne sont pas des estimations gratuites.
- Les cinq options et les calendriers conservés restent consultables. Leurs totaux Make sont incomplets et ne permettent
  pas de conclure Make/Buy. Une amélioration transitoire possible est le libellé « À estimer » au voisinage des valeurs
  Build nulles, sans changer les données.
- Le total humain en JH et l’agrégation monétaire Build/Run restent des limites déjà déclarées ; cet audit ne les
  reconstruit pas.
- Les preuves partenaire et validations attendues sont présentées comme à obtenir, sans engagement inventé.
