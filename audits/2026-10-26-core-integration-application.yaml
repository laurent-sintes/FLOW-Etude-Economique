id: application-audit-core-integration-2026-10-26
date: '2026-10-26'
audit_source: audits/2026-10-26-core-integration-buy.yaml
statut: applique
principes:
  - Les capacités calibrent le build générique des trois Make ; elles ne génèrent aucune charge Buy automatique.
  - Les 178 revues Microsoft/SAP distinguent standard retenu, intégration client et points ciblés.
  - Sept points produit ou modules restent à qualifier ; leurs prix inconnus restent null et ne sont pas compris dans les dépenses calculées.
  - Aucun développement générique Buy supplémentaire n’est démontré dans le registre actuel. Les anciens lots systématiques et leur entretien additionnel sont retirés.
  - Les offres fournisseurs, abonnements, préparation et qualification client, autres services, durées et conventions temporelles sont conservés.
  - Le retrait des compléments SAP et de leur exclusion dans le repère Make se compensent ; les budgets Make restent inchangés.
referentiels:
  build: source/recalibration-metier.yaml
  couverture_buy: source/qualification-buy.yaml
  integration: source/parcours-integration.yaml
  capture_scenarios: sources/cartographie-scenarios-2026-10-26.yaml
  scenarios: 43
  parcours: 50
  activites_integration: 13
  lots_integration: 5
  regle: Le rapprochement des cas d’usage décrit les travaux et la recette ; aucun multiplicateur de coût par cas d’usage n’est introduit.
application:
  - Estimations propose Build Make, Charges du build par capacité, Intégration et Run & MCO.
  - La grille de charges et ses détails présentent Java, .NET et Rust.
  - Intégration compare les cinq budgets et durées ; les bases économiques et le repère Make sont accessibles à la demande.
  - Périmètre propose une lecture dédiée des points de couverture Buy et leurs sources.
  - La synthèse et les simulations consomment les résultats recalculés ; Microsoft devient moins coûteux que Java à dix ans.
  - Les règles et contenus restent dans AGENTS.md et les YAML ; les montants ne sont pas recopiés dans React.
  - Les paramètres gardent leur sens : la compatibilité de reprise est conservée et les écarts utilisateur sont réappliqués aux nouvelles références.
controles:
  moteur: 51 tests Python de calibration, application et grille métier
  reprise: 11 tests de reprise et navigation
  frontend: TypeScript, contrôle de contenu et compilation Vite
  economique: Make et prix fournisseurs préservés ; baisses Buy identiques à la sensibilité isolée de l’audit, aux horizons 3, 5, 7 et 10 ans.
  traceabilite: Identités, sources, plages, développement exceptionnel démontré, entretien associé et capture des scénarios contrôlés.
  visuel: Charges Make, détail de capacité, registre Buy, comparaison d’intégration et synthèse vérifiés dans le navigateur.
historique: archives/core-integration-2026-10-26/
resultats: audits/2026-10-26-core-integration-application-preuves.json
