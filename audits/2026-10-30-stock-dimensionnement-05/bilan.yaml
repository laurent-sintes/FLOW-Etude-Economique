measurements_vs_assumptions:
  measured: Méthodes natives complètes, bornes, instructions/déclarations, empreintes et révisions. Leur code original
    est joint aux échantillons.
  modeled: 66 traitements cibles, 17 structures, branchements de 21 processus et configurations. Quantités et correspondances
    aux analogues proposées pour le contrat fonctionnel.
  calculated: Quatre essais COCOMO via le moteur canonique, contribution marginale des compléments, sept activités
    publiées, contre-épreuve de sélection des analogues.
  not_established: Équivalence fonctionnelle des petites catégories de méthodes avec les mécanismes Stock complets,
    absence de recouvrement entre règles et branchements, dépendances applicatives fermées, objectifs de service
    dimensionnés.
