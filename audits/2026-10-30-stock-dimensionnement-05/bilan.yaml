what_became_less_uncertain:
- Les responsabilités génériques réutilisées et celles propres au Stock sont séparées avec un propriétaire unique.
- Finance et Product Feedback sont bornés à leurs contributions, corrections et retours ; pas de moteur comptable
  ni de PLM.
- Les traitements, champs et interfaces supposés sont visibles et leur calcul peut être reproduit.
- La fragilité du choix des petites méthodes est maintenant mesurée, au lieu d’être masquée par la précision des
  quatre résultats.
what_did_not_become_less_uncertain:
- 'Le coût total de Stock : aucune estimation nouvelle adoptable.'
- La taille complète des mécanismes de correction temporelle et de réservation concurrente.
- Le coût des garanties de volume, délai de réponse et reprise ; aucun objectif chiffré engagé.
- La productivité spécifique à Stock ou la précision du proxy AST utilisé dans COCOMO.
next_iteration:
  worthwhile: true
  approach_change_required: true
  not_worthwhile: Répéter ou affiner les coefficients du même catalogue de petites méthodes pour chercher quatre
    chiffres proches.
  objective: 'Prendre deux mécanismes complets et bornés : correction rétroactive des quantités et engagement concurrent
    d’une quantité donnée. Dans chaque OSS, mesurer validation, transaction, résultat et reprise comme une chaîne
    ; isoler l’allocation/valorisation non retenue et la réutilisation.'
  decision_gate: Si une chaîne ne peut être isolée, conserver un coût natif inconnu pour cette référence ; ne pas
    fabriquer son équivalent à partir d’un simple gabarit. Étendre seulement les chaînes qualifiées aux autres compléments.
  reason: Le blocage est localisé dans l’assiette de taille, pas dans l’arithmétique COCOMO. Une nouvelle mesure
    ciblée peut changer cette assiette ; un nouveau tour de formules ne le peut pas.
