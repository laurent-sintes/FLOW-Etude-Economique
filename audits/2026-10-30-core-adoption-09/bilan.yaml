  hypotheses:
  - id: scope
    hypothesis: Six capacités BC-002 à BC-007. Admission de contributions, consultation et administration ; pas
      de création d’un PIM/MDM complet avec édition collaborative et workflows riches.
    trigger: Ajout d’édition métier, validation multi-acteurs, fusion/dédoublonnage, recherche floue ou arbitrage
      automatique de données.
    effect: Hausse potentiellement importante. À l’inverse, isoler des fonctions natives non nécessaires à FLOW
      peut réduire le périmètre commun. Effet non chiffré sans liste d’écarts.
  - id: complements
    hypothesis: 'Les compléments restent dimensionnés par analogie : 172 traitements, 313 champs et 42 modèles supplémentaires,
      dont seules huit analogies de règle ont été affinées.'
    trigger: Modification substantielle des versions, des règles d’autorité, des dépendances ou du protocole de
      reprise.
    effect: Une hausse isolée de 10 % de la taille complémentaire ajoute environ 90 JH dans le modèle. Ce n’est
      ni une probabilité ni une marge à ajouter.
  - id: reuse
    hypothesis: Services comparables disponibles dans Spring, persistance, identité, import et composants UI ; base
      de données, sauvegardes et chaîne de livraison disponibles.
    trigger: Réécriture d’un mécanisme générique, intégration technique nettement plus difficile ou composants indisponibles.
    effect: Hausse des JH et du délai. La réutilisation ne peut pas être remplacée par une remise forfaitaire ;
      un mécanisme partagé garde un seul propriétaire de financement.
  - id: service
    hypothesis: 'Objectifs de comparaison S1 conservés : disponibilité 99,9 %, rétablissement après sinistre sous
      8 h, perte de données cible au plus 4 h ; qualification d’un lot de 100 000 lignes en 30 min. Ils ne sont
      pas démontrés.'
    trigger: Exigences plus fortes, plusieurs régions actives, reprise automatique sans intervention, volumes très
      supérieurs ou certification spécifique.
    effect: Hausse possible de l’architecture, de la qualification et de la plateforme. Les achats et l’exploitation
      récurrente restent hors des 1 500 JH.
  - id: organization
    hypothesis: Équipe maîtrisant Spring et les composants réutilisés, décideurs disponibles, environnements accessibles
      et capacité moyenne voisine de cinq personnes à temps plein.
    trigger: Équipe junior ou instable, attente de décisions, services partagés non disponibles, dépendances externes
      bloquantes.
    effect: Le délai de 17 mois devient fragile. À effort inchangé, quatre équivalents temps plein à 18 JH/mois
      requièrent déjà 20.8 mois de capacité ; les dépendances peuvent ajouter du délai. Ce quotient n’est pas une
      nouvelle prédiction COCOMO.
