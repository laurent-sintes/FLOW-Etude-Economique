statut: Recommandations de structure et de méthode appliquées ; preuves de capacité à réunir explicitement distinguées.
perimetre:
- Vision, Fondamentaux, glossaire et navigation.
- Entrants Synvance et périmètre métier retenu.
- Conditions de réalisation et dossier distinct de capacité.
- Aucun recalibrage ni reprise éditoriale du dossier économique.
realisation:
- constat: ambition_et_accueil
  resultat: Vision à l’accueil et au logo ; ambition plateforme de marques, Core première étape et décisions progressives sur dix ans.
- constat: dispositif_make
  resultat: Critères de réalisation dans le Framework ; registre de missions, acteurs envisagés, validations proposées et capacités à constituer dans le dossier distinct.
- constat: points_chauds_et_cartographie
  resultat: Entrant Périmètre métier dérivé des 88 capacités retenues, capture identifiée, liens natifs Atlas et quatre points chauds reliés à leurs preuves, missions et jalons.
- constat: capacite_exalt
  resultat: Dossier de références et de compétences attendues ; disponibilité des personnes, engagements et expérience vérifiable restent à documenter. Aucune capacité de livraison n’est déclarée acquise.
- constat: trajectoire_et_decision
  resultat: Quatre jalons avec résultats attendus, preuves, responsables de validation proposés et conditions de poursuite ou de réexamen.
- constat: acquis_synvance
  resultat: Besoins et réponses d’intégration présentés avant les montants ; accès direct au cadre, aux besoins et aux questionnaires. La divergence arithmétique SAP reste une réserve documentaire.
- constat: niveaux_de_preuve
  resultat: Méthode définie, évaluation appliquée, revue humaine et capacité de réalisation distinguées. Les documents disponibles ne valent pas validation ; aucun statut démontré n’est accepté sans évolution du contrat de revue.
