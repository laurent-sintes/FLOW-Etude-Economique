statut: Proposition 02 · Identité FLOW conservée · Non appliquée à l’application
titre: FLOW — continuité et énergie
intention: Le vert pâle signe l’identité. Le contraste structure la lecture. L’orange attire l’attention.
palette:
- nom: Ivoire
  valeur: '#FAF8F4'
  texte: '#182632'
  role: Fond de lecture
- nom: Encre
  valeur: '#182632'
  texte: '#FFFFFF'
  role: Titres et chiffres
- nom: Vert pâle FLOW
  valeur: '#D9F2EA'
  texte: '#182632'
  role: En-têtes et identité
- nom: Vert profond FLOW
  valeur: '#236159'
  texte: '#FFFFFF'
  role: Navigation et actions
- nom: Orange vif
  valeur: '#FF7A1A'
  texte: '#182632'
