- nom: Pêche claire
  valeur: '#FFF0DB'
  texte: '#182632'
  role: Conclusions de page
regles:
- Le logo FLOW original est intégré sans recoloration ni déformation ; seuls ses bords blancs sont cadrés dans la maquette.
- Le vert pâle et le vert profond reprennent exactement les couleurs de la charte existante.
- Le vert pâle occupe les en-têtes, à côté des surfaces blanches et ivoire de lecture.
- Texte blanc sur vert profond et encre ; texte encre sur vert pâle, orange vif et pêche claire.
- Aucun grand aplat orange ou terracotta. L’orange souligne une sélection, une icône ou une conclusion.
- Les couleurs ne constituent pas un classement des options Make et Buy.
