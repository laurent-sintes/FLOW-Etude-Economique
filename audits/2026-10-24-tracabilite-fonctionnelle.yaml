ecarts_cartographie:
- id: domain-plan
  kind: area
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -1,0 +2,6 @@\n\n+\n+Rapprocher les contributions utiles dans leurs [contextes de planification](glossary:TER389),\
    \ avec leurs horizons, versions et règles applicables. Les plans de collection, commerciaux et Supply restent distincts\
    \ ; leurs calendriers peuvent différer, mais les dépendances et conflits doivent être examinés avant de retenir une\
    \ solution. Une [saison](glossary:TER386) ou une [capsule](glossary:TER388) est un repère possible, sans imposer\
    \ un plan unique ou une structure annuelle. Un plan révisable porte hypothèses, objectifs et choix ; il ne se réduit\
    \ pas à un calendrier de référence. Les commandes peuvent contribuer à plusieurs plans, notamment par ligne ou quantité,\
    \ sans double compte des besoins. Un nouveau plan ne réécrit aucun engagement ; [Plan Application](model:D02.e) transmet\
    \ les changements autorisés aux responsables des commandes.\n+\n+[Pourquoi une révision du plan ne change pas seule\
    \ les engagements](principle:PRINCIPLE-DECISION-EFFECTS).\n+\n+[Pourquoi rapprocher la décision, le pilotage et les\
    \ opérations](principle:PRINCIPLE-OPERATIONAL-MASTER-PLAN)."
- id: supply-chain-orchestration
  kind: domain
  champ: definition
  delta: "--- \n\n+++ \n\n@@ -1 +1 @@\n\n-Organiser et adapter les ressources et les prestations pour satisfaire la demande.\
    \ Arbitrer priorités, affectations et apports, faire appliquer les changements autorisés aux commandes et engagements,\
    \ puis coordonner les prestations et suivre leurs résultats.\n+Piloter les ressources et les flux entre l’offre et\
    \ la [demande](glossary:TER011), en reliant achats, [stocks](glossary:TER005), ventes, service après-vente, retours\
    \ et déstockage."
- id: supply-chain-orchestration
  kind: domain
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -0,0 +1,2 @@\n\n+Le pilotage relie l’offre et la [demande](glossary:TER011) sur les parcours\
    \ d’achat, de vente, de service après-vente, de retour et de déstockage. Les choix portent sur les ressources utilisables,\
    \ les priorités, les lots, les destinations et les prestations. Leurs effets sont appréciés ensemble sur le service,\
    \ les coûts, les délais, le [stock](glossary:TER005) et la valeur récupérée.\n+\n@@ -3,0 +6,2 @@\n\n+\n+[Pourquoi\
    \ apprécier les compromis sur le parcours complet](principle:PRINCIPLE-SUPPLY-ASSIGNMENT-VALUE)."
- id: business-references
  kind: area
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -9,0 +10,2 @@\n\n+\n+Les [contextes de planification](glossary:TER389) reçus avec les produits\
    \ peuvent décrire [saisons](glossary:TER386), campagnes, [capsules](glossary:TER388), rythmes de renouvellement et\
    \ fenêtres connues. [Product Reference](model:D08) conserve les associations utiles, leur provenance et leur validité\
    \ ; le cadrage amont reste dans [Product Portfolio & Collection Management](model:domain-product-portfolio-collection).\
    \ Ces données ne créent ni capacité saisonnière ni hiérarchie obligatoire. Les calendriers de référence restent distincts\
    \ des plans révisables et des règles sous autorité de [Supply Policy Management](model:subdomain-policies)."
- id: D08
  kind: reference
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -7,0 +8,4 @@\n\n+\n+Conserver, lorsqu’elles sont fournies, les associations des produits\
    \ aux [contextes de planification](glossary:TER389) : [saisons](glossary:TER386), campagnes ou [capsules](glossary:TER388),\
    \ avec identifiants, version, fenêtres, validité et source. Un produit peut être associé à plusieurs contextes ou\
    \ être reconduit sans rattachement saisonnier obligatoire. Ces associations ne remplacent ni ses caractéristiques\
    \ approuvées ni son cycle de vie ; elles ne constituent pas une disponibilité de stock ou une autorisation de vente.\
    \ Les plans et les politiques ne sont pas stockés comme de simples attributs du produit.\n+\n+[Pourquoi les rattachements\
    \ aux calendriers restent configurables](principle:PRINCIPLE-CONFIGURABLE-CONTEXTS). [Pourquoi gérer la référence\
    \ locale avec une autorité explicite](principle:PRINCIPLE-REFERENCE-PROJECTIONS)."
- id: D01.g
  kind: capability
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -9,0 +10,2 @@\n\n+\n+[Pourquoi une correction doit conserver l’histoire du fait](principle:PRINCIPLE-TRACEABLE-FACTS)."
- id: D01.c
  kind: capability
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -13,0 +14,2 @@\n\n+\n+En [intercompany](glossary:TER122), relier les positions des sociétés\
    \ et les branches de [commande](glossary:TER012) au même flux de biens. Un [stock](glossary:TER005) visible chez\
    \ B n’est pas automatiquement utilisable pour une [promesse](glossary:TER014) de A : les droits d’usage, engagements\
    \ et autorisations restent à vérifier. Distinguer les quantités en transit de leurs propriétaires et détenteurs ;\
    \ un changement de propriétaire ne crée pas de quantité physique supplémentaire. Les vues par société et la vue groupe\
    \ ne s’additionnent pas. La [valorisation](glossary:TER229) et la reconnaissance comptable du transit restent financières."
- id: D02.c
  kind: capability
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -11,0 +12,2 @@\n\n+\n+[Pourquoi distinguer le blocage d’une quantité du calcul de son affectation](principle:PRINCIPLE-DECISION-EFFECTS)."
- id: D09
  kind: reference
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -11,0 +12,2 @@\n\n+\n+Pour qualifier une relation [intercompany](glossary:TER122), connaître\
    \ les personnes morales qui portent chaque [engagement](glossary:TER013) et leur appartenance au groupe, avec origine,\
    \ contexte et validité documentés. Une marque, un site ou un rôle différent ne suffit pas à établir une autre société.\
    \ Conserver la société porteuse avec l’identité d’origine d’une [commande](glossary:TER012) ou d’une facture ; un\
    \ numéro local seul peut être ambigu. Une donnée absente reste à qualifier ; la référence locale ne fabrique ni la\
    \ structure juridique du groupe ni une nouvelle source d’entreprise."
- id: D02.e
  kind: capability
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -15,0 +16,4 @@\n\n+\n+Transmettre avec chaque changement autorisé les références du plan,\
    \ de sa version et du [contexte de planification](glossary:TER389), ainsi que les règles et conditions qui justifient\
    \ la décision. Vérifier leur validité au moment de l’application ; un écart impose le traitement prévu ou un réexamen\
    \ explicite. La famille de commande conserve les versions utilisées, la portée appliquée ou refusée et ses engagements.\
    \ Un changement de [saison](glossary:TER386), de calendrier ou de plan ne vaut pas à lui seul autorisation de modifier\
    \ une commande.\n+\n+[Pourquoi appliquer un choix exige de distinguer ses effets autorisés](principle:PRINCIPLE-DECISION-EFFECTS)."
- id: D03.k
  kind: capability
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -13,0 +14,2 @@\n\n+\n+[Pourquoi aucun objectif économique universel n’est implicite](principle:PRINCIPLE-SUPPLY-ASSIGNMENT-VALUE)."
- id: D11
  kind: reference
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -9,0 +10,2 @@\n\n+\n+Les accords [intercompany](glossary:TER122) précisent les contreparties,\
    \ conditions, [prix de cession interne](glossary:TER384) et jalons applicables lorsqu’ils sont fournis. Distinguer\
    \ la validité de la politique financière, les conditions réellement convenues et le prix engagé dans la [commande](glossary:TER012).\
    \ Identifier leur source autorisée ; l’absence de règle ou d’autorité ne permet pas de reprendre le prix au client\
    \ final. La réception des conditions ne vaut ni négociation ni certification fiscale. Les conditions de propriété\
    \ restent distinctes des faits de déplacement et des décisions comptables."
- id: D04.i
  kind: capability
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -17,0 +18,4 @@\n\n+\n+Pour l’[intercompany](glossary:TER122), conserver société, contrepartie\
    \ et correspondances de lignes et versions. Chaque branche autorise ses changements et tient son prix engagé. [Facturation](glossary:TER153)\
    \ et traitement financier conservent leurs responsabilités. L’exemple détaille les confirmations partielles et les\
    \ prix distincts.\n+\n+[Pourquoi tenir un cycle complet et unique](principle:PRINCIPLE-ORDER-DECISION-CONTEXT). [Pourquoi\
    \ les plans et règles applicables restent configurables](principle:PRINCIPLE-CONFIGURABLE-CONTEXTS)."
- id: D04.j
  kind: capability
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -21,0 +22,4 @@\n\n+\n+Quand le fournisseur est une autre société du groupe, conserver la\
    \ société acheteuse et les correspondances avec la vente réciproque, par ligne, quantité et version. Appliquer uniquement\
    \ les changements acceptés par l’autorité concernée ; suivre les refus et les reliquats sans synchronisation aveugle\
    \ des états. Le [prix de cession interne](glossary:TER384) est reçu de la source autorisée et devient le prix engagé\
    \ de cet achat selon ses règles. Les références et résultats du traitement de la facture fournisseur sont reçus de\
    \ [Finance](glossary:TER117) ; leur conservation ne transfère ni son contrôle, ni sa comptabilisation, ni son paiement\
    \ dans la [commande](glossary:TER012).\n+\n+[Pourquoi tenir un cycle complet et unique](principle:PRINCIPLE-ORDER-DECISION-CONTEXT).\
    \ [Pourquoi les plans et règles applicables restent configurables](principle:PRINCIPLE-CONFIGURABLE-CONTEXTS)."
- id: D04.k
  kind: capability
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -17,0 +18,2 @@\n\n+\n+Pour un déplacement entre sites de sociétés distinctes du groupe,\
    \ distinguer la [demande](glossary:TER011) de transport des engagements commerciaux [intercompany](glossary:TER122).\
    \ Selon le montage autorisé, relier le déplacement à l’achat et à la vente réciproques, aux factures et aux preuves\
    \ de propriété ; ne pas imposer trois commandes ni une identité technique commune. La destination peut être le [stock](glossary:TER005)\
    \ de l’acheteur sans client externe. Un déplacement au sein d’une même société n’est pas [intercompany](glossary:TER122)\
    \ par son seul changement de site. La propriété peut changer sans déplacement, selon l’accord ; le départ ne vaut\
    \ ni arrivée ni facture."
- id: D04.l
  kind: capability
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -19,0 +20,2 @@\n\n+\n+Pour un retour [intercompany](glossary:TER122) avec client externe,\
    \ relier le retour client, la vente d’origine et les suites attendues entre sociétés. Conserver le lieu réel de réception\
    \ et les quantités de chaque relation ; une réception chez B ne crée pas de réception chez A. Le [dossier](glossary:TER064)\
    \ suit autorisations, réponses partielles et écarts. Les avoirs dus au client et entre sociétés sont obtenus séparément\
    \ du [service](glossary:TER075) de [facturation](glossary:TER153) ; le remboursement client, le remplacement et les\
    \ changements de propriétaire gardent leurs preuves propres. Un retour n’efface pas les ventes initiales et n’annule\
    \ pas automatiquement tous leurs engagements."
- id: D04.m
  kind: capability
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -17,0 +18,2 @@\n\n+\n+Quand le fournisseur est une société du groupe, relier le retour aux\
    \ achats et ventes réciproques et au retour client lorsqu’il existe. Distinguer quantités expédiées, reçues, acceptées\
    \ pour reprise et crédit reconnu. Une réception physique unique peut satisfaire des engagements liés, sans plusieurs\
    \ mouvements fictifs. Référencer chaque avoir [intercompany](glossary:TER122) et le résultat communiqué par [Finance](glossary:TER117)\
    \ ; cette capacité ne l’émet pas, ne le comptabilise pas et ne paie pas le fournisseur. Une reprise partielle ou\
    \ un refus reste visible dans la relation concernée."
- id: D04.n
  kind: capability
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -13,0 +14,2 @@\n\n+\n+Relier aussi les engagements réciproques [intercompany](glossary:TER122)\
    \ : société porteuse et contrepartie, identités d’origine, lignes, quantités, versions et rôle dans la chaîne. Lier\
    \ la vente de B à A et l’achat de A auprès de B ne les fusionne pas ; la vente éventuelle de A au client garde son\
    \ identité. Conserver correspondances et périmètre des changements ; chaque famille de [commande](glossary:TER012)\
    \ demeure responsable de leur validité et de leur acceptation. Le [dossier](glossary:TER064) exploite ces liens pour\
    \ solliciter et suivre les réponses. Les mêmes 100 pièces ne deviennent pas trois besoins indépendants."
- id: D04
  kind: area
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -21,0 +22,4 @@\n\n+\n+Conserver les liens des commandes avec les [contextes de planification](glossary:TER389)\
    \ et les plans concernés, éventuellement par ligne ou quantité. Distinguer provenance d’une proposition, contribution\
    \ à un besoin planifié et couverture déjà retenue ; une commande peut participer à plusieurs plans sans dupliquer\
    \ son engagement ni compter plusieurs fois le même besoin. [Saison](glossary:TER386) et [capsule](glossary:TER388)\
    \ ne constituent pas un rattachement obligatoire. Pour chaque décision, garder la version du plan et des règles effectivement\
    \ utilisées, leur validité et l’autorité applicable. Une nouvelle version du plan ou des politiques ne modifie pas\
    \ seule la commande : les transitions et changements restent autorisés par la famille responsable.\n+\n+[Pourquoi\
    \ partir de l’intention et de l’engagement](principle:PRINCIPLE-SUPPLY-DOCUMENTS). [Pourquoi distinguer proposition,\
    \ engagement et réalisation](principle:PRINCIPLE-DECISION-EFFECTS)."
- id: D01
  kind: area
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -9,0 +10,2 @@\n\n+\n+[Pourquoi conserver les faits de stock dans leurs registres](principle:PRINCIPLE-TRACEABLE-FACTS).\
    \ [Pourquoi distinguer propriété, réservation et affectation](principle:PRINCIPLE-DECISION-EFFECTS)."
- id: D03.o
  kind: capability
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -7,0 +8,2 @@\n\n+\n+[Pourquoi une affectation ne réserve pas seule la quantité](principle:PRINCIPLE-DECISION-EFFECTS).\
    \ [Pourquoi rendre les objectifs et compromis explicites](principle:PRINCIPLE-SUPPLY-ASSIGNMENT-VALUE)."
- id: D01.h
  kind: capability
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -7,0 +8,2 @@\n\n+\n+Pour des sociétés liées, déterminer séparément chaque passage de propriété\
    \ selon l’accord et les faits reconnus ; le trajet peut aller de B au client tandis que la propriété passe de B à\
    \ A puis au client. La date du départ, le transfert de risque et la reconnaissance comptable ne se déduisent pas\
    \ les uns des autres. Fournir le résultat et ses limites au [registre de propriété](glossary:TER132) ; le cadre financier\
    \ détermine les éléments supplémentaires requis pour la [comptabilité](glossary:TER118). Une condition absente reste\
    \ à justifier."
- id: BHV069
  kind: behavior
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -9,0 +10,2 @@\n\n+\n+L’[intercompany](glossary:TER122) qualifie les parties, indépendamment\
    \ du lieu de livraison. Relier la vente au client externe, lorsqu’elle existe, à l’achat et à la vente entre sociétés\
    \ ; conserver pour chaque [engagement](glossary:TER013) sa société, sa contrepartie, ses lignes, quantités, prix\
    \ et versions. Une réponse partielle ou une modification de date reste une proposition tant que la partie compétente\
    \ ne l’a pas acceptée. Le [dossier](glossary:TER064) coordonne ces réponses ; chaque [commande](glossary:TER012)\
    \ autorise ses propres transitions. Une vente entre sociétés peut aussi approvisionner le [stock](glossary:TER005)\
    \ de l’acheteur sans client final identifié. Ce cas d’usage ne crée pas une capacité globale [Intercompany](glossary:TER122)\
    \ ni une variante obligatoire dans chaque capacité."
- id: BHV082
  kind: capability
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -17,0 +18,2 @@\n\n+\n+Pour l’[intercompany](glossary:TER122), présenter ensemble les branches\
    \ liées et distinguer leur société, [engagement](glossary:TER013), version et résultat : livraison, facture émise,\
    \ facture reçue ou en contrôle, rejet et correction attendue. Un état global conserve le détail des branches encore\
    \ ouvertes ; livré ne signifie pas facturé, comptabilisé ou payé. Signaler les informations manquantes et leur origine.\
    \ La vue restitue le [dossier](glossary:TER064) et les commandes, sans créer leurs transitions."
- id: subdomain-policies
  kind: area
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -5,0 +6,2 @@\n\n+\n+Qualifier les règles Supply par [contexte de planification](glossary:TER389),\
    \ plan ou version concernée, produits, canaux, période et autorité, selon leur portée réelle. Une [saison](glossary:TER386),\
    \ une [capsule](glossary:TER388) ou un régime de produits reconduits peut contribuer à cette portée sans définir\
    \ une capacité supplémentaire. [Master Plan](model:domain-plan) et [Order Management](model:D04) utilisent les références\
    \ et versions applicables ; en cas de règles concurrentes, les priorités connues et les conflits non résolus restent\
    \ explicites. Le remplacement d’une règle ne vaut pas changement des engagements déjà pris. Les règles commerciales\
    \ et financières conservent leurs autorités ; l’appartenance à un même plan ne les transfère pas à Supply."
- id: plans-ingestion
  kind: capability
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -3,0 +4,2 @@\n\n+\n+Conserver avec chaque contribution reçue les références du [contexte\
    \ de planification](glossary:TER389) : origine, version, période, produits, statut et hypothèses connues. Une [saison](glossary:TER386)\
    \ ou une [capsule](glossary:TER388) peut qualifier la contribution sans devenir un type de capacité ni une hiérarchie\
    \ imposée. Distinguer un calendrier de référence d’un plan portant des quantités et des choix ; ne pas aligner silencieusement\
    \ des horizons différents. Les règles reçues restent attribuées à leur autorité : une référence à une politique ne\
    \ l’active pas et l’ingestion ne crée aucun engagement."
- id: service-order-billing
  kind: capability
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -11,0 +12,4 @@\n\n+\n+Distinguer la [facture intercompany](glossary:TER385) de B à A et\
    \ la facture de A au client externe, lorsqu’il existe. Pour chaque facture, conserver émetteur, destinataire, commandes\
    \ et lignes, quantités ou montants, devise, dates, statut d’émission, corrections et références réciproques connues.\
    \ Fournir les faits de facture et justificatifs à [Financial Accounting](glossary:TER118), qui contrôle et traite\
    \ la facture reçue chez l’acheteur et retourne ses résultats. Une émission ne prouve ni acceptation acheteur, ni\
    \ comptabilisation, ni paiement. Les avoirs réciproques suivent chaque relation concernée ; ni leur nombre ni leur\
    \ montant ne sont déduits du seul retour physique.\n+\n+[Pourquoi la facture est un résultat métier du service](principle:PRINCIPLE-SUPPLY-DOCUMENTS)."
- id: inventory-ownership-ledger
  kind: capability
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -7,0 +8,4 @@\n\n+\n+Dans une chaîne [intercompany](glossary:TER122), conserver les parties\
    \ et preuves de chaque passage reconnu, même si le détenteur physique ne change pas ou si A n’a aucun entrepôt traversé.\
    \ Relier les mêmes biens et quantités aux engagements concernés sans doubler le [stock](glossary:TER005). Les positions\
    \ de propriété ne constituent ni un registre financier ni, à elles seules, un [stock](glossary:TER005) valorisé en\
    \ transit ; [Finance](glossary:TER117) garde sa méthode et ses dates de reconnaissance comptable.\n+\n+[Pourquoi\
    \ le contexte entre sociétés ne définit pas le trajet physique](principle:PRINCIPLE-CONFIGURABLE-CONTEXTS). [Pourquoi\
    \ conserver chaque changement de propriétaire reconnu](principle:PRINCIPLE-TRACEABLE-FACTS)."
- id: accounting-data-provision
  kind: capability
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -7,0 +8,2 @@\n\n+\n+Pour l’[intercompany](glossary:TER122), fournir les sociétés, contreparties,\
    \ références des engagements et jalons connus avec les faits des registres de [stock](glossary:TER005) et de propriété.\
    \ Ne pas reconstruire les factures ou paiements à partir d’un mouvement : leurs producteurs fournissent leurs propres\
    \ faits et suivent leurs retours financiers. La préparation des faits de [stock](glossary:TER005) ne centralise donc\
    \ pas toute la chaîne financière. Les rejets et corrections restent rattachés au fait et à la société concernés."
- id: workflow-definition-management
  kind: capability
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -7,0 +8,4 @@\n\n+\n+Définir le parcours [intercompany](glossary:TER122) par les engagements\
    \ à coordonner : sociétés, contreparties, demandes et réponses, autorisations de changement, factures attendues,\
    \ contrôles et exceptions. Identifier le [dossier](glossary:TER064) responsable et ses liens aux demandes de chaque\
    \ société, sans imposer un [dossier](glossary:TER064) technique unique ni un état partagé. Une livraison achevée\
    \ peut laisser une attente financière ; les critères de fin du parcours précisent les résultats attendus de chacune\
    \ des branches.\n+\n+[Pourquoi les parcours et leurs versions restent configurables](principle:PRINCIPLE-CONFIGURABLE-CONTEXTS).\
    \ [Pourquoi une définition de parcours ne crée pas une nouvelle hiérarchie métier](principle:PRINCIPLE-DOMAIN-INTERACTIONS)."
- id: order-workflow-sentry
  kind: capability
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -11,0 +12,2 @@\n\n+\n+[Pourquoi la réaction à un événement se distingue de sa conservation](principle:PRINCIPLE-TRACEABLE-FACTS)."
- id: order-workflow-orchestration
  kind: capability
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -13,0 +14,4 @@\n\n+\n+Pour le [dossier](glossary:TER064) [intercompany](glossary:TER122),\
    \ exploiter les liens entre commandes et sociétés pour solliciter les changements autorisés puis attendre les réponses\
    \ de chaque responsabilité. Conserver acceptations partielles, refus, factures attendues et résultats financiers\
    \ reçus ; ne pas aligner les états par copie. Une livraison terminée ne ferme pas une attente de [facturation](glossary:TER153)\
    \ ou de traitement acheteur. Relier les [dossiers](glossary:TER064) délégués lorsqu’ils existent ; leur coordination\
    \ ne déplace pas l’autorité des commandes, du [stock](glossary:TER005) ou de [Finance](glossary:TER117).\n+\n+[Pourquoi\
    \ conduire le parcours préserve l’autorité des capacités sollicitées](principle:PRINCIPLE-DOMAIN-INTERACTIONS)."
- id: product-price-book
  kind: reference
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -5,0 +6,2 @@\n\n+\n+Un tarif peut concerner une relation [intercompany](glossary:TER122)\
    \ lorsqu’une source autorisée le fournit : identifier les sociétés, l’unité, la devise, la validité et les conditions\
    \ du [prix de cession interne](glossary:TER384). Le prix externe, le prix interne et une valeur comptable ne sont\
    \ pas interchangeables. La référence ne définit ni la politique fiscale ni le prix engagé ; elle signale une condition\
    \ ou une autorité manquante au lieu d’appliquer silencieusement le tarif client."
- id: return-credit-resolution
  kind: behavior
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -1,0 +2,2 @@\n\n+\n+Dans une chaîne [intercompany](glossary:TER122), distinguer l’avoir\
    \ attendu par le client de celui attendu entre sociétés : parties, lignes, quantités, montant autorisé et liens aux\
    \ factures initiales. Suivre l’obtention ou le rejet auprès du [service](glossary:TER075) de [facturation](glossary:TER153)\
    \ pour la relation client ; les suites entre sociétés restent liées au retour fournisseur et au traitement financier.\
    \ Un seul retour physique ne prouve ni tous les avoirs ni un remboursement."
- id: subdomain-process-management
  kind: area
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -9,0 +10,2 @@\n\n+\n+[Pourquoi conserver les faits du dossier et leurs corrections](principle:PRINCIPLE-TRACEABLE-FACTS)."
- id: process-mining
  kind: capability
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -13,0 +14,2 @@\n\n+\n+Analyser les traces des [dossiers](glossary:TER064) [intercompany](glossary:TER122)\
    \ en conservant société, rôle dans la chaîne et liens aux commandes. Distinguer délais de réponse réciproque, écarts\
    \ de quantité ou de prix et attentes financières lorsque les événements requis sont documentés. Compter une chaîne\
    \ et ses branches selon la question étudiée ; ne pas additionner automatiquement les mêmes 100 pièces à chaque [commande](glossary:TER012).\
    \ Une absence de trace signifie une couverture inconnue, pas une activité réalisée ni un délai nul. Les marges et\
    \ éliminations du groupe restent sous l’autorité financière."
- id: process-ledger
  kind: capability
  champ: scope
  delta: "--- \n\n+++ \n\n@@ -15,0 +16,2 @@\n\n+\n+Dans un [dossier](glossary:TER064) [intercompany](glossary:TER122),\
    \ relier chaque événement à la société qui porte l’[engagement](glossary:TER013), à sa contrepartie et aux identités\
    \ d’origine des commandes, lignes et factures connues. Conserver propositions de changement, réponses partielles,\
    \ refus et résultats financiers reçus avec leurs versions et corrections. Une notification partagée entre [dossiers](glossary:TER064)\
    \ ne devient pas plusieurs réalisations. Les liens de [dossier](glossary:TER064) expliquent la chaîne ; les [faits\
    \ de propriété](glossary:TER132) et les [écritures comptables](glossary:TER121) restent chez leurs producteurs, sans\
    \ registre [intercompany](glossary:TER122) concurrent."
