what_really_progressed:
- Les hooks de persistance et la fin de transaction sont reliés aux traitements métier ; on ne confond plus le corps
  d’une petite méthode avec le travail complet.
- 'Odoo : le retry couvre la transaction et son flush, avec cinq tentatives ; date de ligne liée à la date du mouvement.'
- 'Tryton : verrou avant la lecture des quantités dans assign_try, transition et reprise transactionnelle RPC identifiées.'
- 'Axelor : protection de version héritée du framework et reconstruction globale Stock existantes identifiées. Aucune
  absence de protection déduite de l’absence de FOR UPDATE.'
- 'ERPNext : propagation ordonnée et borne au prochain inventaire reliées au moteur courant ; création concurrente
  du Bin distinguée de la protection des réservations.'
remaining_uncertainty:
- Les protections transactionnelles natives ne démontrent pas l’idempotence d’un nouvel appel métier après perte
  de réponse.
- Le contrat Flow selon date de fait et date de connaissance n’est pas équivalent aux seules requêtes natives à
  date d’effet.
- Quantités, valorisation et exécution/affectation restent couplées dans plusieurs composants natifs ; leur taille
  intégrale serait un mauvais coût Flow.
- Objectifs de volume/latence/reprise et maîtrise de la stack restent des hypothèses. L’absence de tests OSS exécutés
  n’est pas, à elle seule, le motif de refus du chiffrage.
