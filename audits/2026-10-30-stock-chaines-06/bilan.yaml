id: stock-chaines-06
scope: Deux chaînes dans chacun des quatre OSS natifs ; pas toute la famille Stock, pas intégration Beaumanoir.
status: huit_dossiers_natifs_mesures_chiffrage_Flow_non_recevable
scenarios:
  correction: Delta de quantité pris en compte à une date d’effet passée, actualisation des positions concernées
    ; distinguer date d’effet et état des connaissances.
  reservation: Deux demandes portant sur une même portion produit/lieu/unité, contrôle disponible et engagement
    protégés dans une transaction ; distinguer conflit SQL et nouvel appel métier rejoué.
  conditions:
  - Standard des révisions épinglées ; extensions installées non présumées.
  - Moteur de base et niveau d’isolation sont des conditions de la référence.
  - La mesure inclut les composants natifs nécessaires même quand une responsabilité excédentaire est mêlée. Cette
    inclusion est une limite, pas une charge Flow automatique.
