id: audit-core-integration-buy-2026-10-26
date: '2026-10-26'
statut: audit_et_proposition_sans_modification_du_modele_actif
objet: Séparer le build du Core générique, l'intégration Beaumanoir et les exceptions produit Buy.
demande:
  - Réserver les charges par capacité au build Make.
  - Justifier individuellement tout complément fonctionnel Microsoft ou SAP.
  - Présenter l'intégration et le Run & MCO pour les cinq options.
conclusion:
  principe: >-
    Les capacités définissent les aptitudes du Core générique à réaliser en Make ou à obtenir d'un produit
    en Buy. Leur existence dans la carte ne crée pas une charge de développement supplémentaire Buy.
    L'intégration couvre leur déclinaison Beaumanoir, les paramètres, échanges, reprises, déploiements et
    qualifications de bout en bout pour les cinq options.
  nuance: >-
    La distinction est une convention économique, pas une équivalence automatique entre type d'objet
    métier et poste de coût. Un comportement générique, comme On-Hand ATP, précise aussi le Core.
    Un scénario mobilise des capacités indépendamment de la solution technique. Seule sa réalisation
    contextualisée permet de distinguer réemploi standard, paramétrage, intégration et fonction manquante.
  couverture_buy: >-
    Une couverture commerciale intégrale n'est pas démontrée par cet audit. Les preuves revues établissent
    des fonctions standard substantielles et des frontières de modules. Elles ne valident ni 48 lacunes
    produit par Buy ni la disparition de tout travail spécifique. La règle proposée est de retenir un
    développement Buy seulement sur un écart fonctionnel identifié, après examen du produit, des modules
    disponibles, de l'offre achetée et du travail déjà financé.
  classement: >-
    L'enjeu n'est pas seulement éditorial : les provisions conditionnelles influencent suffisamment les
    dépenses pour changer le classement Microsoft/Java à dix ans dans la sensibilité de retrait intégral.
perimetre_controle:
  - Méthode, grille de 88 capacités, 258 fonctions proposées et socle transverse.
  - Inventaire des 178 affectations Microsoft/SAP, avec lots, JH bruts, traitements, coûts et références.
  - Adaptateur de calibration, moteur économique et projection sponsor à 3, 5, 7 et 10 ans.
  - Vues Estimations, couverture, lecture Synvance, synthèse et contrat des simulations.
  - Cartographie source courante et capture active, identiques par SHA-256.
  - Revue ciblée de documentation officielle Microsoft DOM et SAP Order Management Foundation.
  - Pièces commerciales déjà indexées dans source/ecarts-perimetre-flow-rfi.md.
limite_de_la_revue_produit: >-
  Inventaire complet des affectations chiffrées, mais pas recette exhaustive des 258 fonctions sur les
  produits ni validation contractuelle de chaque licence. Les exceptions proposées restent à qualifier
  individuellement ; aucun pourcentage de couverture produit n'est déduit de cet audit.
constats:
  - id: F01
    priorite: haute
    titre: Le tableau juxtapose des objets économiques différents.
    preuve: >-
      BusinessCalibration.tsx somme les JH des lots pour les cinq options. Le moteur impose pourtant un
      build nul en Buy. Les lignes inclus_rfi portent du travail diagnostique inclus ; complement_integration
      finance des travaux additionnels en intégration. Ces JH ne sont pas des charges de build équivalentes.
    effet: Présentation trompeuse malgré des règles arithmétiques cohérentes avec les hypothèses retenues.
    recommandation: Trois colonnes Make dans les charges du build ; couverture des cinq options conservée dans Comprendre.
  - id: F02
    priorite: haute
    titre: Les compléments Buy sont systématisés au-delà d'exceptions produit démontrées.
    preuve: >-
      Chaque Buy compte 48 capacités en complement_integration et 40 capacités plus le transverse en
      inclus_rfi. Les compléments réemploient trois lots : adaptation de 90 JH, moteur de 260 JH, parcours
      de 245 JH. Microsoft reçoit 39/5/4 lots ; SAP 38/6/4. Ces paquets ne constituent pas à eux seuls
      la preuve d'une fonction absente du standard ou hors des prestations achetées.
    effet: Risque de financer une seconde fois du standard ou des adaptations déjà comprises dans les offres.
    recommandation: Remplacer l'attribution par défaut par un registre explicite des écarts et des travaux client.
  - id: F03
    priorite: haute
    titre: L'intégration n'est pas reliée au catalogue actuel des scénarios métier.
    preuve: >-
      La capture active conserve nodes, relations et hotspot_catalog, mais pas scenario_catalog.
      Les budgets Buy partent des offres et compléments ; le budget sponsor Make reste un repère dérivé
      de SAP, avec exclusions et gain de continuité. Le catalogue d'activités d'intégration référence encore
      core-system-features.yaml. Les scénarios ne sont pas aujourd'hui un détail de charge traçable du budget.
    recommandation: >-
      Rapprocher les scénarios/parcours de la cartographie des lots d'intégration communs aux cinq options,
      puis expliquer leur financement. Ne pas transformer ce rapprochement en multiplication d'un forfait
      par scénario : plusieurs cas partagent les mêmes flux, migrations, mécanismes et campagnes de recette.
  - id: F04
    priorite: haute
    titre: Le repère Make exclut déjà les compléments génériques SAP.
    preuve: >-
      project_investment.finance_sensitivity soustrait de l'intégration SAP les compléments fonctionnels
      et leur pilotage, en plus du retrait Finance. Leur suppression cohérente réduit simultanément le
      total SAP et son exclusion ; le repère puis les dépenses Make restent inchangés.
    recommandation: Recalculer l'exclusion depuis les travaux retenus ; ne pas diminuer manuellement le total SAP dans l'ancienne simulation.
  - id: F05
    priorite: haute
    titre: L'entretien des compléments doit suivre le portefeuille réel d'extensions.
    preuve: >-
      La calibration ajoute 240 JH/an Microsoft et 260 JH/an SAP pour les compléments, en sus des activités
      de service. MAI-009 prévoit aussi six évolutions génériques par an : 35 JH chacune Microsoft,
      valorisées comme estimation ; 40 JH SAP, incluses dans le forfait fournisseur.
    recommandation: >-
      Relier l'entretien additionnel aux exceptions conservées. Distinguer mises à jour éditeur et évolutions
      spécifiques demandées par Beaumanoir. Ne pas supprimer les adaptations client au motif que le produit
      est complet ; ne pas imputer au client le développement normal de la roadmap éditeur.
    limite_sensibilite: Le test retire seulement les 240/260 JH d'entretien des compléments ; MAI-009 et les autres activités restent inchangés.
  - id: F06
    priorite: moyenne
    titre: La note historique de périmètre contient des montants et une description d'ancrage obsolètes.
    preuve: >-
      source/ecarts-perimetre-flow-rfi.md conserve les 2,875 M€ de compléments SAP et indique leur maintien
      dans l'ancre Make. La calibration active donne 5,650 M€ avant pilotage et les exclut de cette ancre.
    recommandation: Préserver les preuves commerciales, retirer les anciens résultats du discours actif et renvoyer aux résultats générés.
regle_de_qualification_proposee:
  - situation: Fonction générique standard, module compris dans l'option.
    traitement: Couverture créditée ; aucun développement du Core client ajouté ; configuration et recette dans l'intégration.
  - situation: Fonction disponible dans un module commercial non compris dans l'offre.
    traitement: Achat et mise en œuvre à examiner ; ne pas remplacer automatiquement le module par un développement spécifique.
  - situation: Règle, échange ou parcours propre à Beaumanoir.
    traitement: Intégration initiale puis MCO de l'intégration, pour Make comme pour Buy.
  - situation: Fonction générique nécessaire et réellement absente des produits retenus.
    traitement: Exception Buy explicite ; comparer extension supportée, module tiers et réalisation spécifique.
  - situation: Couverture ou inclusion non déterminée.
    traitement: Point de qualification explicite ; ni gratuité acquise ni charge de reconstruction attribuée automatiquement.
registre_exceptions_propose:
  champs:
    - identifiant_stable
    - capacite_et_fonctions_cibles
    - comportement_attendu
    - produit_module_edition_et_version
    - preuve_de_couverture_ou_de_limite
    - inclusion_dans_offre_et_poste_financeur
    - nature_generique_ou_contextuelle
    - solution_retenue_et_reemploi
    - travaux_residuels_plages_jh_et_tjm
    - depense_initiale_et_entretien_associe
  familles_a_requalifier:
    - capacites: [BC-009, BC-010, BC-015, BC-059, BC-060, BC-061, BC-062, BC-063, BC-064, BC-065, BC-066, BC-067, BC-068, BC-069, BC-070, BC-071, BC-072, BC-073]
      question: Distinguer les registres et ordres standard de leurs mappings, messages, variantes et qualification client.
    - capacites: [BC-040, BC-041, BC-042, BC-047, BC-048]
      question: Définir la décision attendue avant de distinguer moteur standard, paramétrage, module optionnel et véritable optimisation manquante.
    - capacites: [BC-052]
      question: SAP TM non inclus dans l'offre indexée ; examiner le besoin et le module avant de provisionner un moteur maison.
    - capacites: [BC-053, BC-076, BC-077, BC-079]
      question: Créditer les mécanismes d'orchestration et de workflow disponibles puis isoler la coordination Beaumanoir.
    - capacites: [BC-087]
      question: Examiner l'achat et l'inclusion d'un produit de process mining avant tout développement spécifique.
revue_produit:
  - id: WEB-MS-DOM
    url: https://learn.microsoft.com/en-us/dynamics365/commerce/dom
    conclusion: DOM fournit une optimisation de l'exécution des commandes par contraintes, coûts et règles ; il ne faut pas considérer ce moteur comme absent par défaut.
    limite: Cela ne prouve ni toutes les optimisations FLOW, ni leur mise en œuvre dans le prix Avanade/K3.
  - id: WEB-MS-DOM-LIMITES
    url: https://learn.microsoft.com/en-us/dynamics365/commerce/dom-limitations
    conclusion: Des situations de réaffectation avec entrepôt avancé et des dimensions de stock nécessitent un traitement d'extension ; DOM est disponible dans Commerce cloud.
    limite: Exemple de frontière réelle à comparer à un scénario FLOW, pas justification d'une provision générique sur toutes les capacités.
  - id: WEB-SAP-OMF
    url: https://help.sap.com/doc/65309ba6056d4d6c8dc40195ec4b3074/Cloud/en-US/FSD_SAP_OMF.pdf
    edition: '2026-10-22'
    pages: [3, 4, 6, 7]
    conclusion: SAP Order Management Foundation documente réception, changements, orchestration, événements et retours ; son périmètre est distinct du sourcing/disponibilité d'OMSA.
    limite: La disponibilité actuelle d'une fonction ne prouve pas son inclusion dans une offre de 2025 ; certaines fonctions peuvent demander un abonnement séparé.
  - id: WEB-SAP-ORCHESTRATION
    url: https://learning.sap.com/courses/exploring-sap-order-management-foundation-and-sourcing-availability/explaining-the-concept-of-order-submit-and-order-orchestration
    conclusion: Les stratégies, routes, canaux et correspondances avec les systèmes d'exécution relèvent aussi de configuration et d'intégration de fonctions fournies.
  - id: LOCAL-OFFRES
    fichier: source/ecarts-perimetre-flow-rfi.md
    pieces:
      - sources/client/microsoft-1.pdf, pages 20–21 et 38–40
      - sources/client/delaware-septembre.pdf, pages 26 et 28
      - sources/client/sap-questionnaire.xlsx, besoins E229/H229 à E231/H231
    conclusion: >-
      L'index des pièces inclut Commerce et K3 chez Microsoft, OMSA chez SAP ; il signale TM et CAR Allocation
      Management non inclus et un moteur de réassort externe. Les offres ne correspondent pas au catalogue
      entier de chaque éditeur. Ces exclusions n'imposent pas à elles seules une réalisation spécifique.
  - id: WEB-SAP-OMSA
    url: https://help.sap.com/doc/08442b9d2cd744f7aecc1e08080c26f3/SHIP/en-US/FSD_SAP_OMSA.pdf
    statut: Nouvelle récupération en échec par timeout ; preuve antérieure indexée conservée, non présentée comme une nouvelle vérification du PDF.
