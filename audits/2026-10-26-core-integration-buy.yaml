  inventaire: audits/2026-10-26-core-integration-buy-inventaire.csv
  reproduction: audits/2026-10-26-core-integration-buy-calcul.py
  portee: Diagnostic uniquement ; aucun contenu de l'application ni paramètre actif modifié.
