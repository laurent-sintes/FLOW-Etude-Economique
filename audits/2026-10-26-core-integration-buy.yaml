impacts_modele:
  - fichiers: [source/methode-complexite.yaml, source/grille-complexite.yaml, source/recalibration-metier.yaml, source/schema-recalibration-metier.yaml]
    changement: Séparer couverture fonctionnelle cinq options, charges build trois Make, exceptions Buy et travaux d'intégration. Préserver Domaine / Sous-domaine / Business Area, capacités, fonctions, identifiants et réemplois.
  - fichiers: [source/integration.yaml, source/chiffrage/chiffrage-microsoft.yaml, source/chiffrage/chiffrage-sap.yaml, source/maintenance.yaml]
    changement: Relier les travaux contextualisés et les services annuels à leur objet ; identifier les inclusions fournisseur sans ventilation arbitraire des forfaits.
  - fichiers: [sources/cartographie-scm-2026-10-24.yaml]
    changement: Préparer une capture traçable distincte du catalogue de scénarios/parcours, sans modifier l'ancienne preuve ni dupliquer une définition métier.
  - fichiers: [tools/business_calibration.py, tools/calculate_costs.py, tools/project_investment.py, tools/study_app.py]
    changement: Adapter les contrats séparés, maintenir le build Buy sans objet, éviter doubles comptes et exclusion SAP obsolète. Garder une seule valorisation des travaux et une seule projection temporelle.
  - fichiers: [source/couts-15-ans.yaml, source/investissements-10-ans.yaml, source/synthese-sponsor.yaml, source/decision-make-buy.yaml, source/parcours-synvance.yaml, source/ecarts-perimetre-flow-rfi.md, source/glossaire.yaml]
    changement: Après décision sur les exceptions, régénérer les résultats, réviser les écarts et conclusions sponsor puis les explications associées. Aucun montant recopié comme hypothèse.
impacts_application:
  estimations:
    navigation_proposee: [Build Make, Charges du build par capacité, Intégration, Run & MCO]
    charges: Trois colonnes Java / .NET / Rust, y compris dans les détails ; retirer les diagnostics Buy de cette grille.
    integration: >-
      Comparaison simultanée des cinq options ; source du budget, contenu financé et compléments identifiés.
      Conserver à la demande le calcul du repère Make et un lien vers le parcours Synvance. Le sélecteur
      actuellement limité aux Make et les deux métriques Make doivent être remplacés : renommer seul ne suffit pas.
    annuel: Retirer la précision cinq options ; maintenir les cinq colonnes et distinguer standard éditeur, extensions client et exploitation.
  comprendre: Conserver la comparaison de couverture des cinq options ; afficher les exceptions documentées au bon endroit, sans assimiler inclusion commerciale et couverture fonctionnelle.
  synthese: Recalculer Make de référence, différences Buy et facteurs de choix ; ne pas conserver un avantage financier invalidé par la nouvelle base.
  simuler: >-
    Mettre à jour les valeurs de référence et exclusions liées. Préserver les écarts utilisateur si les paramètres
    gardent le même sens. Si le sens d'un paramètre change, faire évoluer simulation_contract_version ; pas
    d'incompatibilité forcée pour un simple changement de libellé. Conserver horizons, pages et anciens liens.
  fichiers: [config/application.yaml, app/src/BusinessCalibration.tsx, app/src/views.tsx, app/src/StudyReading.tsx, app/src/SponsorSummary.tsx, app/src/Simulations.tsx]
  contenu: Tous les nouveaux noms, explications, règles de classement et exceptions demeurent dans les YAML.
ordre_de_mise_en_oeuvre_propose:
  - Formaliser la frontière générique / contexte Beaumanoir dans la méthode et AGENTS.md, après accord sur ce diagnostic.
  - Requalifier les 48 compléments de chaque Buy ; isoler les exceptions réelles, achats de modules et travaux client déjà compris.
  - Rapprocher les scénarios/parcours de la cartographie des lots d'intégration ; conserver le repère macro tant qu'aucune nouvelle estimation n'est établie.
  - Réviser le portefeuille d'entretien lié aux compléments retenus et clarifier MAI-009.
  - Recalculer budgets et projections, puis actualiser la synthèse et les explications.
  - Adapter les grilles et la navigation ; vérifier reprise, liens, mobile, clavier et lecture sponsor.
controles_realises:
  - Recalcul économique identique au YAML actif sauvegardé.
  - Projection sponsor identique au YAML actif sauvegardé.
  - Deux sensibilités exécutées avec le moteur existant sur copies en mémoire.
  - Build Make, repère d'intégration Make et prix fournisseurs inchangés dans les deux sensibilités.
  - Empreintes des fichiers actifs identiques avant et après les calculs.
controles_a_prevoir_pour_application:
  - Standard Buy couvert ou inclus n'entraîne aucun développement additionnel automatique.
  - Toute exception payante possède un objet, une preuve, un financement et un entretien associés.
  - Retrait des compléments SAP et retrait de leur exclusion se compensent dans le repère Make.
  - Réemploi d'un mécanisme ou d'une interface entre cas d'usage facturé une seule fois.
  - Aucun diagnostic inclus ne devient une dépense ou un zéro inconnu dans la restitution.
  - Totaux, annualités et horizons 3/5/7/10 cohérents, sans modification des durées ni prix contractuels non concernés.
artefacts:
