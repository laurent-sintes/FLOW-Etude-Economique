mdm_summary: Unidata est choisi pour son code Java et sa couverture du MDM attendu. L’ancien import XML et la gestion générique des tâches et processus sont retirés. La charge FLOW couvre le moteur MDM, ses écrans, les familles de données et leur qualification.
mdm_decision: >-
  Unidata sert de référence technique et fonctionnelle : il est développé en Java et couvre le MDM attendu. FLOW ne reprend pas son ancien import de métamodèles XML. La gestion générique des tâches et des processus est déjà financée dans Process Management.
mdm_bridge: Les retraits documentés sont appliqués au comparatif COCOMO Unidata. La charge finale FLOW correspond au dimensionnement du moteur de données, des écrans, des familles de données et de leur qualification.
