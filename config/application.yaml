    ia_title: Réduction de l’effort par assistance IA
    ia_note: >-
      **Le taux représente la part des JH évitée, à périmètre et qualité constants.**
      Il réduit les JH éligibles, sans modifier le tarif ni le prix d’un contrat.
      La réutilisation du patrimoine logiciel est déjà prise en compte dans les
      travaux à réaliser ; elle ne donne pas lieu à une seconde remise globale.
    ia_formula: JH nets = JH bruts × (1 − gain en % / 100)
    ia_detail: Taux de réduction de l’effort retenus pour la construction
    ia_make_scope: Construction Make
    ia_buy_scope: Éventuels compléments client
    ia_maintenance_detail: Taux de réduction de l’effort des activités annuelles
    ia_maintenance_note: >-
      **Seules les activités estimées reçoivent un gain dans leur valorisation.**
      Pour une activité incluse dans une offre, le taux reste diagnostique et
      ne réduit pas le prix du contrat.
    ia_treatments:
      inclus_abonnement: Inclus dans l’abonnement
      inclus_forfait_rfi: Inclus dans le forfait
    ia_diagnostic: Taux diagnostique
    ia_integration_detail: Taux d’intégration du diagnostic historique
    ia_integration_note: >-
      **Ces taux ne réduisent pas le budget courant.** L’intégration Make utilise
      les travaux et déploiements Groupe sans ces gains. L’intégration Buy est
      financée par forfaits ; les compléments retenus sont valorisés séparément.
    ia_frontend: Interface utilisateur commune aux options Make
    ia_integration: Intégration diagnostique
    ia_nature_label: Activité
    tariffs_title: Tarifs et outillage par JH
    tariffs_note: >-
      **Le profil qui réalise le travail détermine le tarif.** Les JH retenus
      sont valorisés en € HT / JH, avec l’outillage technique applicable.
      Les forfaits fournisseur gardent leur prix documenté.
    tariff_formulas:
    - JH du profil = JH retenus pour l’activité × part du profil en % / 100
    - 'Coût des prestations (€ HT) = somme par profil [JH × (tarif + outillage applicable en € HT / JH)]'
    tariff_scope: >-
      Les parts de profils totalisent 100 %. **QA et architecture sont des travaux
      identifiés, pas des majorations automatiques des JH développeur.**
      L’outillage par JH ne s’ajoute ni aux forfaits ni au pilotage du programme.
