reading_journey:
  label: Continuer la lecture
  takeaway_label: À retenir de cette page
  next_label: Continuer avec
  steps:
    synvance:
      to: perimetres
      takeaway: Les offres documentent le produit acheté et sa mise en œuvre, avec des périmètres et des bases
        de prix différents.
      text: Vous pourrez replacer ces éléments sur la carte commune des capacités métier.
    synthese:
      to: logique
      takeaway: Le Make donne la maîtrise du produit et de ses évolutions, avec une équipe à financer dans la
        durée. Les dépenses, le calendrier et les responsabilités éclairent le Go.
      text: Vous retrouverez le périmètre métier commun et les financements qui structurent la comparaison.
    perimetres:
      to: build
      takeaway: Les écarts portent sur les fonctions, les frontières et les prestations achetées. Un point à qualifier
        n’est ni une absence produit démontrée, ni un coût ajouté.
      text: Vous pourrez examiner la construction de la {{notion.flow_core_system}}, ses charges et sa technologie
        Java/Spring.
    market:
      to: simulation-hypotheses
      takeaway: Les offres, les tarifs et les cas publiés apportent des preuves différentes. Les écarts expliqués
        restent distincts des hypothèses ou prix à qualifier.
      text: Vous mesurerez l’effet des hypothèses déterminantes sur les trois options.
    simulation-hypotheses:
      to: simulations
      takeaway: Votre scénario regroupe les hypothèses des trois options. Les paramètres communs et les liens
        entre budgets restent cohérents. Vos modifications sont distinctes de la référence de l’étude.
      text: Vous mesurerez leur effet sur les dépenses, les années de service et le reste à financer à 3, 5, 7
        et 10 ans.
    simulations:
      to: simulation-depenses
      takeaway: Les dépenses cumulées se lisent avec l’avancement de chaque option. À un horizon court, un total
        plus faible peut correspondre à une réalisation encore inachevée.
      text: Vous verrez quand financer chaque option et comment les financements se répartissent année par année.
    simulation-depenses:
      to: synthese
      takeaway: Le calendrier distingue l’effort de réalisation des charges récurrentes. Les totaux sur dix ans
        couvrent la même période, avec des durées de service différentes selon les options.
      text: Vous pourrez revenir aux arbitrages et aux conditions du Go. La synthèse présente la référence de
        l’étude. Votre simulation reste conservée dans le bloc Simuler.
    glossaire:
      to: synthese
      takeaway: La {{notion.core_system}} désigne la plateforme générique. L’intégration la fait fonctionner chez
        Beaumanoir. Leur entretien et leurs évolutions relèvent du {{notion.mco_run}}.
      text: Vous pourrez retrouver les arbitrages Make / Buy avec ces responsabilités en tête.
    logique:
      to: perimetres
      takeaway: La cartographie décrit le besoin métier. Le Make construit la {{notion.flow_core_system}}. Le
        Buy acquiert une {{notion.core_system}} existante. Toutes les options nécessitent intégration et exploitation.
      text: Vous verrez où les offres Microsoft et SAP diffèrent de la cible FLOW.
    build:
      to: exploitation
      takeaway: Le build finance le produit générique FLOW. Les charges de réalisation comprennent développement,
        assemblage et qualification. La complexité métier les éclaire sans les calculer.
      text: Vous comparerez les travaux client et les charges annuelles des trois options.
    exploitation:
      to: market
      takeaway: L’intégration finance la réalisation client. {{notion.maintenance_core}}, Run et {{notion.mco_client}}
        suivent leurs périodes propres. Les forfaits restent sur leur assiette et les différences de calendrier
        comptent dans les dépenses cumulées.
      text: Vous pourrez distinguer les écarts expliqués des estimations qui restent à challenger.
