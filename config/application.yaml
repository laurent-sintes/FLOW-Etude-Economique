        effect: Préparation de supports et transfert aux utilisateurs clés, hors transformation organisationnelle globale.
    inflation_title: Évolution des prix
    inflation_note: >-
      **L’indexation fait évoluer un prix, sans modifier les volumes ni les JH.**
      Chaque catégorie conserve son taux de référence et son périmètre d’application.
    inflation_formulas:
    - Base indexée en année n = base annuelle de référence × (1 + taux en % / 100)^(n − 1)
    - Dépense en année n = base indexée en année n × mois couverts dans cette année / 12
    - Prix de licence en année contractuelle k après la dernière année connue N = dernier prix documenté × (1 + taux en % / 100)^(k − N)
    inflation_scope: >-
      **Pour le régime stabilisé, n désigne l’année depuis le début du plan.**
      Les financements initiaux et enveloppes de transition Make restent constants.
      Les licences Buy conservent leur séquence de prix documentée, puis sont
      indexées après sa dernière année. Les forfaits de services SAP sont compris
      dans la base annuelle indexée.
    activity_allocation_title: Répartition {{notion.build}} / {{notion.run_activities}}
    activity_allocation_note: >-
      **La clé classe les dépenses déjà calculées ; elle ne crée pas de budget.**
      Le MCO de la {{notion.core_system}} reste entièrement Build. La clé ci-dessous
      concerne les adaptations et interfaces Beaumanoir.
    activity_formula: Part Run (%) = 100 − part Build (%)
    activity_scope: >-
      La part Build couvre les interventions importantes conduites en projet.
      **La ventilation monétaire comparative Build / Run reste à constituer.**
      Les contrats Buy sans ventilation connue conservent leur prix global ;
      leurs tags ne suffisent pas à calculer une part monétaire.
