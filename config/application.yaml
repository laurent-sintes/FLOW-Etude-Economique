    documentary_findings: Ce que le produit apporte
    documentary_summaries:
      erpnext:
        title: Données, automatisation et analyses dans un ensemble ouvert
        finding: Frappe permet de définir les données, les droits et les échanges avec les autres applications.
          La sélection étudiée ajoute un outil d’automatisation en version bêta et des analyses sur plusieurs sources.
        limit: La disponibilité des stocks entre systèmes et l’analyse des processus attendues pour FLOW restent
          à démontrer. Boutique en ligne et assistance sont des applications distinctes.
      odoo-community:
        title: Achats, ventes et stock dans un ensemble modulaire
        finding: La version Community fournit des modules de gestion et plusieurs modes de préparation et de livraison.
        limit: Les modules publics de caisse et de vente en ligne sont exclus de la mesure de code présentée. Leur
          réponse aux parcours FLOW reste à vérifier.
      tryton:
        title: Suivre le stock à une date donnée
        finding: Tryton conserve les positions de stock des périodes clôturées et contrôle les modifications simultanées
          des mouvements.
        limit: Les clôtures et verrouillages peuvent contraindre les corrections rétroactives et les produits très
          sollicités. Les modules de caisse et de commerce en ligne sont distincts du code mesuré.
      axelor-open-suite:
        title: Dessiner les processus, les décisions et les tâches
        finding: Studio/BPM fournit un éditeur graphique de processus et un suivi de leur exécution, associé à la
          suite de gestion Axelor.
        limit: Le moteur de processus est un composant tiers. La reprise après interruption et la prévention des
          effets en double vers les systèmes externes restent à démontrer pour FLOW.
      microsoft:
        title: Relier les canaux de vente et choisir le site de préparation
        finding: Commerce couvre la caisse, la vente en ligne et les ventes aux professionnels. Des services dédiés
          répliquent les données des canaux et répartissent les commandes entre les sites.
        limit: La répartition des commandes se fait par lots et la synchronisation des canaux comporte un décalage.
          Le remplacement des caisses dans le périmètre FLOW n’est pas établi.
      sap:
        title: Affecter les stocks rares et confirmer les commandes
        finding: S/4 Fashion affecte les approvisionnements aux commandes et contrats. Des fonctions complémentaires
          confirment les quantités et dates, puis réservent les stocks selon des règles.
        limit: Les activations, droits et composants compris dans la proposition reçue restent à confirmer. La documentation
          d’une fonction SAP ne suffit pas à établir son inclusion commerciale.
