      reçues et les choix de projection sont distingués ci-dessous.'
    inflation_formulas:
    - Base indexée en année n = base annuelle de référence × (1 + taux en % / 100)^(n − 1)
    - Dépense en année n = base indexée en année n × mois couverts dans cette année / 12
    - Après N années de prix retenus, prix de licence en année k = dernier prix retenu × (1 + taux en % / 100)^(k
      − N)
