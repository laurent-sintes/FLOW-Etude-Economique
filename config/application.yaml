parameters:
  common:
  - key: bonus_continuite_pct
    label: '{{notion.gain_continuite}}'
    unit: '%'
    min: 0
    max: 50
    step: 1
    scale: 1
    help: Sensibilité du repère SAP uniquement. La valeur sauvegardée est conservée ; elle ne réduit pas le chiffrage
      Make par activités. Les budgets actifs restent inchangés quand on ne modifie que ce taux.
    source: source/plan-investissement.yaml#integration_make
  - key: inflation_tjm
    label: Inflation des prestations
    unit: '% / an'
    min: 0
    max: 15
    step: 0.1
    scale: 0.01
    help: Indexation annuelle des services à partir de l’année 1.
    source: source/inflation.yaml#categories/tjm_ingenierie
  - key: inflation_cloud
    label: Inflation du cloud
    unit: '% / an'
    min: 0
    max: 15
    step: 0.1
    scale: 0.01
    help: Indexation de l’hébergement et de l’iPaaS Make et Microsoft.
    source: source/inflation.yaml#categories/cloud
  - key: inflation_licences
    label: Inflation des logiciels
    unit: '% / an'
    min: 0
    max: 15
    step: 0.1
    scale: 0.01
    help: Les annuités documentées sont conservées. L’indexation s’applique après leur séquence et aux achats logiciels
      complémentaires.
    source: source/inflation.yaml#categories/licences_logiciels
  option:
  - key: build_mois
    modes:
    - Make
    label: Durée du build
    unit: mois
    min: 36
    max: 60
    step: 1
    scale: 1
    help: Répartition d’un build complet. Une durée différente ne change pas son budget.
    source: source/plan-investissement.yaml#build_make_mois
  - key: build
    modes:
    - Make
    label: '{{notion.build_core_system}}'
    unit: k€ HT
    min: 0
    max: 100000
    step: 100
    scale: 1000
    help: Budget complet de réalisation de {{notion.flow_core_system}}. Le détail des estimations reste consultable
      dans Estimations.
    source: source/couts-15-ans.yaml
  - key: integration_mois
    modes:
    - Buy
    label: Durée d’intégration et migration
    unit: mois
    min: 6
    max: 60
    step: 1
    scale: 1
    help: Durée de réalisation Buy après sélection-contractualisation. La sélection et les abonnements suivent le
      calendrier de référence ; modifier cette durée ne change pas Make.
    source: source/plan-investissement.yaml#integration_buy_mois
  - key: integration
    modes:
    - Buy
    label: '{{notion.integration_migration}}'
    unit: k€ HT
    min: 0
    max: 100000
    step: 100
    scale: 1000
    help: Budget d’intégration Buy hors préparation transférée à la sélection. Les anciennes sauvegardes sont converties
      une seule fois en retirant cette provision, sans modifier leurs autres hypothèses.
    source: source/plan-investissement.yaml#integration_make
  - key: services_core
    modes:
    - Make
    label: '{{notion.maintenance_core}}'
    unit: k€ HT / an
    min: 0
    max: 20000
    step: 10
    scale: 1000
    help: Travaux annuels de la plateforme générique, pilotage associé compris. La variation module aussi proportionnellement
      les capacités transitoires correspondantes pendant le déploiement. Les évolutions optionnelles restent absentes
      de cette transition.
    source: source/plan-investissement.yaml#presentation_achats/ventilation_make
  - key: services_integration
    modes:
    - Make
    label: '{{notion.maintenance_integration}}'
    unit: k€ HT / an
    min: 0
    max: 20000
    step: 10
    scale: 1000
    help: Entretien des adaptations et activités propres à Beaumanoir. La migration initiale n’est pas répétée.
      La variation module aussi proportionnellement les capacités transitoires correspondantes pendant le déploiement.
      Les évolutions optionnelles restent absentes de cette transition.
    source: source/plan-investissement.yaml#presentation_achats/ventilation_make
  - key: services_grouped
    modes:
    - Buy
    label: '{{notion.services_mco}}'
    unit: k€ HT / an
    min: 0
    max: 20000
    step: 10
    scale: 1000
    help: Prestations client groupées. Les parts {{notion.core_system}} et intégration restent inconnues ; le maintien du standard
      financé par l’offre éditeur n’est pas ajouté.
    source: source/plan-investissement.yaml#presentation_achats
  - key: hebergement
    modes:
    - Make
    - Buy
    label: '{{notion.paas}}'
    unit: k€ HT / an
    min: 0
    max: 20000
    step: 5
    scale: 1000
    help: Achats d’hébergement séparés. Le cloud déjà inclus dans une offre éditeur n’est pas ajouté.
    source: source/calibration-couts.yaml#couts_communs
  - key: ipaas
    modes:
    - Make
    - Buy
    label: '{{notion.ipaas}}'
    unit: k€ HT / an
    min: 0
    max: 20000
    step: 5
    scale: 1000
    help: Provision pour la plateforme d’échanges. L’indexation dépend de sa nature d’achat.
    source: source/calibration-couts.yaml#couts_communs
  - key: licences_complementaires
    modes:
    - Make
    - Buy
    label: '{{notion.licences_complementaires}}'
    unit: k€ HT / an
    min: 0
    max: 20000
    step: 5
    scale: 1000
    help: Droits supplémentaires distincts des offres groupées et de l’iPaaS.
    source: source/calibration-couts.yaml#couts_communs
