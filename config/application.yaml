    projects:
      intro: '**Ces références servent à challenger les coûts de FLOW.** Pour chaque cas, comparer les ressemblances,
        les différences et ce que l’on en retient. Les prix et les preuves viennent ensuite. La proximité est partielle
        et précisée dans chaque fiche.'
      evidence_note: Les prix d’origine et leur normalisation monétaire sont des repères documentaires. Leur transposition
        au périmètre FLOW se lit dans le dossier économique.
      next:
        href: '#preetude-solutions'
        label: Poursuivre avec les solutions de marché
      ranges_title: Plages des projets de référence
      ranges_note: Montants en euros 2026, pour les périmètres des projets publiés. Les fiches précisent les inclusions
        et les différences avec FLOW.
    solutions:
      intro: Les quatre logiciels à code source ouvert, ou **[OSS](#glossaire?term=open_source_software) pour Open
        Source Software**, sont comparés à Microsoft et SAP. Leur code peut être consulté, modifié et redistribué
        selon les conditions de leur licence.
      evidence_note: Les six produits sont des références comparées. Les choix de construction Make et les décisions
        de financement sont présentés dans le dossier économique.
      economic_link: Examiner les écarts et leurs financements pour FLOW
      products_title: Fiches des solutions
      products_intro: Fonctions, versions, déploiements et mesures de code, avec leurs sources.
      products_action: Lire les six fiches produit
      next:
        href: '#preetude-couts'
        label: Poursuivre avec les tarifs et achats
    summary_title: Ce qu’on en retient
    location: Emplacement dans les études
    back_comparison: Revenir à la comparaison métier
    oss_intro: Les quatre logiciels à code source ouvert, ou **[OSS](#glossaire?term=open_source_software) pour
      Open Source Software**, sont comparés à Microsoft et SAP. Leur code peut être consulté, modifié et redistribué
      selon les conditions de leur licence.
    topics:
      projects:
        title: Projets d’intégration de référence
        summary: '**Les références SAP et Dynamics couvrent des projets très différents.** Les contrats publics,
          les estimations publiées et les entreprises composites sont distingués ci-dessous. Le périmètre intégré
          et le travail restant chez le client expliquent une partie des écarts de prix.'
      services:
        title: Services et exploitation
        summary: '**Les prix publiés regroupent souvent plusieurs services.** Support, hébergement, licences et
          mises à jour ne sont pas toujours séparés. Les observations chiffrées sont présentées avec leur période,
          puis les références sans montant isolé.'
      programmes:
        title: Programmes de développement documentés
        summary: '**Construire un produit finance aussi sa mise à l’épreuve et son écosystème.** OpenLMIS associe
          refonte et communauté. RELEX enrichit un produit existant avec des pilotes. W-RESPONSE documente un prototype
          de recherche historique. Aucun de ces financements n’isole le seul développement logiciel.'
      comparison:
        title: Comparaison métier
        summary: '**Commandes, stocks et approvisionnements disposent de fonctions de référence.** Les politiques
          saisonnières, l’orchestration entre systèmes et la promesse de service demandent des vérifications FLOW.
          Les quatre ERP ouverts servent de références de fonctions et de code pour le produit Java à construire.
          Microsoft et SAP sont les solutions d’achat comparées. Les fonctions étayées, déclarations fournisseur
          et analogies restent distinguées. Une analogie ne vaut pas couverture acquise.'
      products:
        title: Fiches des solutions
        summary: '**Les six solutions apportent des fonctions et des modes d’extension différents.** Les quatre
          logiciels à code ouvert permettent aussi d’examiner leur code. Les constats propres à chaque produit précèdent
          les preuves techniques et fonctionnelles.'
      rates:
        title: Tarifs des prestations
        summary: '**Un tarif dépend du profil et du mode d’achat.** Le relevé Java distingue le senior parisien
          et le backend expert. Le repère Avanade porte sur des prestations ESN de pilote. QA, architecture et support
          disposent de repères communs, parfois sans prix retranscrit.'
      purchases:
        title: Cloud, licences et outils
        summary: '**Le coût technique ne se résume pas aux licences.** Calcul, stockage, sauvegardes et intégration
          sont facturés séparément. Le catalogue décrit les composants envisagés pour FLOW et distingue les propositions
          des éléments issus de l’étude client.'
      indices:
        title: Change et indices
        summary: '**Comparer des prix historiques demande de conserver leur date et leur devise.** Les conversions
          des projets utilisent les taux et indices documentés ci-dessous. Les annonces de prix des éditeurs constituent
          des observations ponctuelles, distinctes des taux futurs retenus pour FLOW.'
      productivity:
        title: Productivité du développement
        summary: '**Les expériences IA n’observent pas toutes le même effet.** Copilot accélère une tâche JavaScript
          bornée en 2023. METR observe un ralentissement sur des travaux de développeurs expérimentés début 2025.
          Son suivi publié en 2026 ne permet pas de mesurer fiablement le nouvel effet. Ces résultats ne fixent
          aucun gain FLOW.'
      synvance:
        title: Repères Synvance
        summary: Les besoins exprimés, les propositions Microsoft et SAP et les pièces reçues lors de la consultation.
    overview:
      question: Que cherches-tu ?
      entries:
      - page: synvance
        question: Comprendre les offres reçues
        topic: synvance
        description: Les besoins exprimés, les offres Microsoft et SAP et les pièces reçues.
