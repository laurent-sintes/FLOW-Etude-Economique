    breakdown:
      title: Agrégats budgétaires
      text: Obtention, intégration et fonctionnement sont des regroupements de coûts, pas trois périodes étanches.
        Modèle détaille les natures des mêmes financements. Chaque somme n’est comptée qu’une fois et les prix Buy
        restent groupés.
      source: source/modele-composable.yaml#contrat
    build:
      title: '{{notion.obtenir_core_system}}'
      text: Le poste finance la construction du produit en Make et l’assistance acheteur en Buy. Pour Buy, le budget
        résulte des charges et tarifs de la source ; la préparation transférée a été retirée de l’intégration. Le
        support Microsoft initial reste financé une seule fois.
      source: source/selection-buy.yaml#travaux
    integration:
      title: '{{notion.integration_deploiement_initiaux}}'
      text: Adaptations Beaumanoir, migration, raccordements, déploiements et stabilisation.
      source: source/deploiement-groupe.yaml#perimetre
    services:
      title: '{{notion.mco_run}}'
      text: 'Agrégat budgétaire de plusieurs natures : {{notion.maintenance_core}} et de l’intégration, Run cloud,
        exploitation et support, achats techniques et contrats Buy groupés. Il finance aussi des consommations avant
        la fin de l’intégration. Les montants transitoires restent constants ; les annuités complètes sont indexées
        depuis le début du plan.'
      source: source/modele-composable.yaml#definitions
    scope:
      title: Périmètre et limites
      text: Le {{notion.programme_flow}} cible principalement le {{notion.supply_chain_management}} Beaumanoir. SAP conserve des travaux
        Finance dans son budget. Les modules et fonctions Buy ouverts restent à qualifier, sans supplément automatique.
        Le temps interne, la transformation organisationnelle, le maintien des SI historiques et leur décommissionnement
        sont hors des dépenses chiffrées ; ils ne sont pas réputés gratuits.
      source: source/qualification-buy.yaml#hypothese
    market:
      title: Références de marché
      text: ISBSG observe 72 développements neufs Java de 100 à 300 points de fonction, à 9,4 heures par point en
        médiane. Ce repère permet de tester des lots de la {{notion.flow_core_system}} après comptage fonctionnel indépendant
        et alignement des travaux inclus. Les budgets publics de la chaîne logistique et les composants open source ne donnent pas un
        prix directement transposable à la {{notion.core_system}} complète.
      source: sources/benchmark-build-core-scm-2026-10-27.md#résultat-utilisable-pour-la-calibration
    calendar:
      title: Calendrier des dépenses
      text: 'Make : calendrier Groupe autonome avec stabilisations locales fixes. Buy : sélection-contractualisation,
        puis intégration ; les durées d’intégration saisies excluent la sélection. Les abonnements commencent à
        la signature, au début de l’intégration. Le reste à financer inclut les allocations initiales et transitoires
        non encore dépensées.'
      source: source/plan-investissement.yaml#repartition/calendrier
    obtention:
      title: '{{notion.obtention_initiale_core_system}}'
      text: Construction de la {{notion.flow_core_system}} en Make ; sélection et contractualisation en Buy.
      source: source/modele-composable.yaml#contrat
    core_care:
      title: '{{notion.maintenance_core}}'
      text: Corrections, qualification et évolutions du produit générique, hors construction initiale. En Buy, parts
        non ventilées des contrats.
      source: source/modele-composable.yaml#classification_make
    client_care:
      title: '{{notion.mco_plateforme_beaumanoir}}'
      text: Entretien des configurations, extensions et interfaces Beaumanoir après réception ; évolutions demandées
        par le Groupe. Le {{notion.maintenance_core}} reste suivi séparément.
      source: source/modele-composable.yaml#classification_make
    run_cloud:
      title: '{{notion.socle_technique_cloud}}'
      text: Cette rubrique réunit l’hébergement et les achats techniques séparés. Le calcul conserve leurs lignes
        et indexations propres ; aucun service déjà compris dans le poste « {{notion.grouped_buy}} » n’est ajouté.
      source: source/modele-composable.yaml#definitions
    operations_support:
      title: '{{notion.operations_support}}'
      text: Assistance N1/N3, surveillance, opérations et sécurité, avec l’outillage de support. Ces prestations
        humaines ne sont pas du cloud.
      source: source/modele-composable.yaml#classification_make
    technical_purchases:
      title: Achats techniques séparés
      text: 'Achats techniques séparés : services d’intégration et droits complémentaires. Leur indexation contractuelle
        est conservée.'
      source: source/plan-investissement.yaml#presentation_achats
    grouped_buy:
