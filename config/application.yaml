    intro_text: >-
      **Cette page réunit les hypothèses et les prix retenus pour FLOW.** Chaque
      valeur conserve son origine, son périmètre et son effet sur le calcul.
      Les prix reçus restent distincts des estimations d’ingénierie. Les diagnostics
      historiques sont présentés séparément des valeurs actives.
    reference_note: >-
      **Simuler permet de tester les hypothèses qui y sont proposées,
      sans modifier cette référence.** Tous les paramètres présentés ici ne sont
      pas exposés à la simulation personnelle.
    navigation_label: Paramètres et repères
