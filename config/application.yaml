      source: source/modele-composable.yaml#definitions
    scope:
      title: Périmètre et limites
      text: 'Le {{notion.programme_flow}} porte principalement sur la {{notion.supply_chain_management}} de Beaumanoir.
        SAP conserve des travaux Finance dans son budget. Les modules et fonctions Buy ouverts restent à qualifier,
        sans supplément automatique. Le temps interne, la transformation organisationnelle, le maintien des SI historiques
        et leur décommissionnement sont hors des dépenses chiffrées. Ils ne sont pas réputés gratuits.'
      source: source/qualification-buy.yaml#hypothese
    market:
      title: Références de marché
      text: ISBSG observe 72 développements neufs Java de 100 à 300 points de fonction, à 9,4 heures par point en
        médiane. Ce repère permet de tester des lots de la {{notion.flow_core_system}} après comptage fonctionnel
        indépendant et alignement des travaux inclus. Les budgets publics de la chaîne logistique et les composants
        open source ne donnent pas un prix directement transposable à la {{notion.core_system}} complète.
      source: sources/benchmark-build-core-scm-2026-10-27.md#résultat-utilisable-pour-la-calibration
