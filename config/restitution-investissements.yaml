    à lever pour chaque solution.
  un_manque_de_preuve_ne_demontre_pas_une_absence_de_fonction_les_co: Un manque de preuve ne démontre pas une absence
    de fonction. Les compléments estimés restent à rapprocher du périmètre.
  sap_omsa_couvre_une_partie_du_cycle_oms_microsoft_propose_des_capa: SAP OMSA couvre une partie du cycle {{notion.oms.court}}.
    Microsoft propose des capacités {{notion.oms.court}}/DOM ; la reprise complète des responsabilités FLOW reste à vérifier.
  les_preuves_et_reserves_sont_detaillees_dans_sources_et_dans_la_no: Les preuves et réserves sont détaillées dans {{vue.sources}}
    et dans la note de périmètre. Les adaptations Beaumanoir relèvent de l’intégration.
